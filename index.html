h nutzt oder ins Netz stellst, endet die Ausnahme.<\/p>\n<p><strong>Merke:<\/strong> Solange etwas rein privat bleibt, interessiert es die DSGVO nicht. Sobald es beruflich wird oder an die Öffentlichkeit geht, greift sie sofort.<\/p>\n<ul>\n<li>Die Telefonnummern deiner Freunde im Handy → <strong>privat<\/strong>, keine DSGVO.<\/li>\n<li>Dieselbe Liste, aber es sind Kunden deiner Firma → <strong>DSGVO<\/strong>.<\/li>\n<li>Fotos von der Familienfeier im Album → privat.<\/li>\n<li>Dieselben Fotos öffentlich auf Instagram → nicht mehr rein privat.<\/li>\n<\/ul>\n<h3 id=\"d-22-raumlicher-anwendungsbereich-art-3\">2.2 Räumlicher Anwendungsbereich (Art. 3)<\/h3>\n<p><strong>Folie 27 (Original):<\/strong><\/p>\n<blockquote>\n<p>„▪ <strong>räumlich, Art. 3<\/strong>\n▪ <strong>Niederlassungsprinzip<\/strong>: alle Unternehmen mit <strong>Sitz in der EU, unabhängig vom Ort der Verarbeitung<\/strong>\n▪ <strong>Marktortprinzip<\/strong>: Unternehmen mit <strong>Sitz außerhalb der EU<\/strong>, wenn sie\n• europäischen Betroffenen <strong>Waren/Dienstleistungen (auch kostenlos)<\/strong> anbieten\n• <strong>das Verhalten europäischer Personen beobachten<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Zwei Prinzipien:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Prinzip<\/th>\n<th>Anknüpfung<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Niederlassungsprinzip<\/strong><\/td>\n<td>Sitz in der EU<\/td>\n<td>Eine deutsche GmbH verarbeitet Daten in einem Rechenzentrum in Singapur → DSGVO gilt<\/td>\n<\/tr>\n<tr>\n<td><strong>Marktortprinzip<\/strong><\/td>\n<td>Sitz außerhalb, aber EU-Markt<\/td>\n<td>Ein US-Startup bietet eine App für deutsche Nutzer an → DSGVO gilt<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>⚠️ <strong>Zwei Fallen im Marktortprinzip:<\/strong>\n1. <strong>„auch kostenlos\"<\/strong> — es muss kein Geld fließen. Eine kostenlose App reicht.\n2. <strong>„Verhalten beobachten\"<\/strong> — reines Tracking reicht schon, auch ohne jedes Angebot. Wer EU-Nutzer per Cookie profiliert, unterliegt der DSGVO.<\/p>\n<\/blockquote>\n<p><strong>Das ist der Grund, warum die DSGVO weltweit Wirkung entfaltet<\/strong> — sie knüpft nicht am Sitz des Unternehmens an, sondern am Standort der betroffenen Person.<\/p>\n<h3 id=\"d-typische-fallen-zu-kapitel-2\">Typische Fallen zu Kapitel 2<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aussage<\/th>\n<th>✓/✗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Die DSGVO gilt nur für automatisierte Verarbeitung.<\/td>\n<td><strong>✗<\/strong> — auch nichtautomatisiert, wenn in einem <strong>Dateisystem<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Ein US-Unternehmen ohne EU-Niederlassung unterliegt nie der DSGVO.<\/td>\n<td><strong>✗<\/strong> — <strong>Marktortprinzip<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Ein kostenloses Angebot löst das Marktortprinzip nicht aus.<\/td>\n<td><strong>✗<\/strong> — „auch kostenlos\"<\/td>\n<\/tr>\n<tr>\n<td>Ein privates Adressbuch auf dem eigenen Handy fällt unter die DSGVO.<\/td>\n<td><strong>✗<\/strong> — Haushaltsausnahme<\/td>\n<\/tr>\n<tr>\n<td>Ein deutsches Unternehmen, das Daten in den USA verarbeitet, unterliegt der DSGVO.<\/td>\n<td><strong>✓<\/strong> — Niederlassungsprinzip, unabhängig vom Verarbeitungsort<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Wann gilt die DSGVO überhaupt — und wann nicht? Zwei Fragen: Geht es um die richtige Art von Verarbeitung (sachlich)? Und ist der Betreffende in Europa (räumlich)? Die wichtigste Erkenntnis: Auch ein US-Konzern ohne Büro in Europa kann der DSGVO unterliegen, sobald er sich an europäische Nutzer richtet. 2.1 Sachlicher Anwendungsbereich (Art. 2) Folie 26 (Original): „▪ Verarbeitung von personenbezogenen Daten: ▪ „automatisiert\" : ganz oder teilweise ▪ „Nichtautomatisiert\": Dateisystem Ausnahmebereiche: z. B. Verarbeitung ausschließlich für persönliche oder familiäre Tätigkeiten \" Was das heißt: - Automatisiert = per Computer. Immer erfasst. - Nichtautomatisiert = auf Papier — aber nur, wenn es in einem Dateisystem (strukturierten Ablage) gespeichert ist oder werden soll. Ein alphabetisch sortierter Karteikasten fällt darunter, ein loser Notizzettel nicht. Die Haushaltsausnahme (Art. 2 II lit. c): Ausschließlich persönliche oder familiäre Tätigkeiten sind ausgenommen. - Dein privates Adressbuch im Handy → nicht von der DSGVO erfasst. - Deine Geburtstagsliste zu Hause → nicht erfasst. - Aber: Sobald du sie beruflich nutzt oder ins Netz stellst, endet die Ausnahme. Merke: Solange etwas rein privat bleibt, interessiert es die DSGVO nicht. Sobald es beruflich wird oder an die Öffentlichkeit geht, greift sie sofort. Die Telefonnummern deiner Freunde im Handy → privat , keine DSGVO. Dieselbe Liste, aber es sind Kunden deiner Firma → DSGVO . Fotos von der Familienfeier im Album → privat. Dieselben Fotos öffentlich auf Instagram → nicht mehr rein privat. 2.2 Räumlicher Anwendungsbereich (Art. 3) Folie 27 (Original): „▪ räumlich, Art. 3 ▪ Niederlassungsprinzip : alle Unternehmen mit Sitz in der EU, unabhängig vom Ort der Verarbeitung ▪ Marktortprinzip : Unternehmen mit Sitz außerhalb der EU , wenn sie • europäischen Betroffenen Waren/Dienstleistungen (auch kostenlos) anbieten • das Verhalten europäischer Personen beobachten \" Zwei Prinzipien: Prinzip Anknüpfung Beispiel Niederlassungsprinzip Sitz in der EU Eine deutsche GmbH verarbeitet Daten in einem Rechenzentrum in Singapur → DSGVO gilt Marktortprinzip Sitz außerhalb, aber EU-Markt Ein US-Startup bietet eine App für deutsche Nutzer an → DSGVO gilt ⚠️ Zwei Fallen im Marktortprinzip: 1. „auch kostenlos\" — es muss kein Geld fließen. Eine kostenlose App reicht. 2. „Verhalten beobachten\" — reines Tracking reicht schon, auch ohne jedes Angebot. Wer EU-Nutzer per Cookie profiliert, unterliegt der DSGVO. Das ist der Grund, warum die DSGVO weltweit Wirkung entfaltet — sie knüpft nicht am Sitz des Unternehmens an, sondern am Standort der betroffenen Person. Typische Fallen zu Kapitel 2 Aussage ✓/✗ Die DSGVO gilt nur für automatisierte Verarbeitung. ✗ — auch nichtautomatisiert, wenn in einem Dateisystem Ein US-Unternehmen ohne EU-Niederlassung unterliegt nie der DSGVO. ✗ — Marktortprinzip Ein kostenloses Angebot löst das Marktortprinzip nicht aus. ✗ — „auch kostenlos\" Ein privates Adressbuch auf dem eigenen Handy fällt unter die DSGVO. ✗ — Haushaltsausnahme Ein deutsches Unternehmen, das Daten in den USA verarbeitet, unterliegt der DSGVO. ✓ — Niederlassungsprinzip, unabhängig vom Verarbeitungsort","words":473,"mins":2},{"id":"d-3-begriffe-personenbezogene-daten","subject":"ds","num":"3","title":"3. Begriffe: personenbezogene Daten","short":"Begriffe: personenbezogene Daten","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\n<strong>Was ist überhaupt geschützt?<\/strong><\/p>\n<p>Ohne personenbezogene Daten gilt die DSGVO nicht. Deshalb fängt jede Prüfung hier an: Geht es um Daten, mit denen man einen einzelnen Menschen identifizieren kann?<\/p>\n<p>Merk dir vor allem die Grenzfälle — die IP-Adresse zählt dazu, Daten von Verstorbenen nicht.<\/p>\n<\/blockquote>\n<p><strong>Das ist das wichtigste Begriffskapitel.<\/strong> Ohne personenbezogene Daten gilt die DSGVO nicht — jede Prüfung beginnt hier.<\/p>\n<h3 id=\"d-31-die-definition-art-4-nr-1\">3.1 Die Definition — Art. 4 Nr. 1<\/h3>\n<p><strong>Folie 22 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Personenbezogene Daten, Art. 4 Abs. 1 DS-GVO<\/strong>\n<strong>alle Informationen, die sich auf identifizierte oder identifizierbare natürliche Personen („betroffene Person\") beziehen, ob direkt oder indirekt, insbesondere mittels Zuordnung zu einer Kennung wie einem Namen, Kennnummer, Standortdaten oder Online-Kennung.<\/strong>\n<strong>Wann sind Daten personenbezogen (pbD)?<\/strong> … wenn sie einer <strong>identifizierten oder identifizierbaren<\/strong> Person zuzuordnen sind.\"<\/p>\n<\/blockquote>\n<p><strong>Die vier Kernwörter: alle Informationen · identifiziert ODER identifizierbar · natürliche Person · direkt oder indirekt.<\/strong><\/p>\n<p><strong>„identifizierbar\" ist der weite Teil.<\/strong> Es reicht, dass man die Person <strong>mit vertretbarem Aufwand<\/strong> zuordnen könnte — auch über Umwege, auch mit Zusatzwissen.<\/p>\n<h3 id=\"d-32-beispiele-fur-pbd-folie-23-original\">3.2 Beispiele für pbD (Folie 23, Original)<\/h3>\n<blockquote>\n<p>„▪ Name, Alter, Familienstand, Geburtsdatum\n▪ Anschrift, Telefonnummer, E-Mail-Adresse\n▪ Kontonummer, Kreditkartennummer\n▪ Kraftfahrzeugnummer, Kfz-Kennzeichen\n▪ Personalausweisnummer, Sozialversicherungsnummer\n▪ Vorstrafen\n▪ genetische Daten und Krankendaten\n▪ <strong>Werturteile wie zum Beispiel Zeugnisse<\/strong>\n▪ <strong>IP-Adresse<\/strong>\"<\/p>\n<p>⚠️ <strong>Die zwei wichtigsten Einträge für T/F: „Werturteile (z. B. Zeugnisse)\" und „IP-Adresse\".<\/strong>\nViele denken, ein Werturteil sei keine „Information über\" jemanden — doch. Und die <strong>IP-Adresse ist personenbezogen<\/strong> (auch die dynamische, das hat der EuGH entschieden). Das ist für dich als Informatiker die relevanteste Aussage der ganzen Folie.<\/p>\n<\/blockquote>\n<h3 id=\"d-33-was-keine-pbd-sind-folie-24-original\">3.3 Was KEINE pbD sind (Folie 24, Original)<\/h3>\n<blockquote>\n<p>„▪ <strong>Angaben über Verstorbene<\/strong>\n▪ Angaben über eine <strong>Gruppe<\/strong> von natürlichen Personen <strong>in Summen zusammengefasst (aggregiert)<\/strong>, z.B.: Anzahl der Mitarbeiter/-innen eines Unternehmens über 45 Jahre\n▪ <strong>anonymisierte Daten<\/strong>\n▪ Einzelangaben über <strong>juristische Personen<\/strong>, wie zum Beispiel Kapitalgesellschaften oder eingetragene Vereine\"<\/p>\n<\/blockquote>\n<p><strong>Merkliste: Tote · Aggregate · Anonymisiertes · Juristische Personen.<\/strong><\/p>\n<p><strong>Die Faustregel:<\/strong> Solange man von den Daten auf einen <strong>einzelnen Menschen<\/strong> zurückkommen kann, sind es personenbezogene Daten.<\/p>\n<ul>\n<li><em>„In dieser Firma arbeiten 37 Personen über 45.\"<\/em> → Daraus kannst du niemanden herauslesen. <strong>Keine<\/strong> personenbezogenen Daten.<\/li>\n<li><em>„Herr Meier, Jahrgang 1974, Abteilung Einkauf.\"<\/em> → Sehr wohl. <strong>Personenbezogene Daten.<\/strong><\/li>\n<\/ul>\n<p>Vorsicht bei kleinen Gruppen: „Die eine Mitarbeiterin über 60 in unserer Abteilung\" ist zwar keine Namensnennung, aber jeder im Betrieb weiß, wer gemeint ist. Dann ist der Personenbezug wieder da.<\/p>\n<h3 id=\"d-34-besondere-kategorien-art-9-i\">3.4 Besondere Kategorien — Art. 9 I<\/h3>\n<p><strong>Folie 25 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Besondere Kategorien von pbD, Art. 9 Abs. 1 DS-GVO.<\/strong> Dies sind Angaben über die\n▪ <strong>rassische und ethnische Herkunft<\/strong>\n▪ <strong>politische Meinungen<\/strong>\n▪ <strong>religiöse oder weltanschauliche Überzeugungen<\/strong>\n▪ <strong>Gewerkschaftszugehörigkeit<\/strong>\n▪ <strong>Genetische und biometrische Daten zur eindeutigen Identifizierung<\/strong>\n▪ <strong>Gesundheitsdaten<\/strong>\n▪ <strong>Daten zum Sexualleben oder der sexuellen Orientierung<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Sieben Kategorien.<\/strong> Merkhilfe: <strong>„Rasse – Politik – Religion – Gewerkschaft – Gene/Biometrie – Gesundheit – Sexualität.\"<\/strong><\/p>\n<p>Für diese gilt ein <strong>grundsätzliches Verarbeitungsverbot<\/strong> (Art. 9 I) mit engen Ausnahmen in Art. 9 II — z. B. <strong>ausdrückliche<\/strong> Einwilligung, Arbeitsrecht, lebenswichtige Interessen, Gesundheitsversorgung.<\/p>\n<blockquote>\n<p>⚠️ <strong>Falle:<\/strong> <strong>Finanzdaten und Kontonummern gehören NICHT zu den besonderen Kategorien.<\/strong> Sie sind zwar sensibel im Alltagssinn, aber Art. 9 zählt sie nicht auf. Genauso: Vorstrafen sind <strong>keine<\/strong> besondere Kategorie nach Art. 9 — strafrechtliche Daten sind separat in <strong>Art. 10<\/strong> geregelt.<\/p>\n<p>⚠️ <strong>Zweite Falle:<\/strong> Biometrische Daten sind nur dann besondere Kategorie, wenn sie <strong>„zur eindeutigen Identifizierung\"<\/strong> verarbeitet werden. Ein Foto allein ist nicht automatisch Art. 9 — erst die Gesichtserkennung macht es dazu.<\/p>\n<\/blockquote>\n<h3 id=\"d-typische-fallen-zu-kapitel-3\">Typische Fallen zu Kapitel 3<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aussage<\/th>\n<th>✓/✗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Eine IP-Adresse ist ein personenbezogenes Datum.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Anonymisierte Daten sind personenbezogene Daten.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Pseudonymisierte Daten sind personenbezogene Daten.<\/td>\n<td><strong>✓<\/strong> — siehe Kapitel 7.4!<\/td>\n<\/tr>\n<tr>\n<td>Daten über Verstorbene fallen unter die DSGVO.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Die Daten einer GmbH sind personenbezogene Daten.<\/td>\n<td><strong>✗<\/strong> — juristische Person<\/td>\n<\/tr>\n<tr>\n<td>Ein Arbeitszeugnis enthält personenbezogene Daten.<\/td>\n<td><strong>✓<\/strong> — Werturteile<\/td>\n<\/tr>\n<tr>\n<td>Gesundheitsdaten gehören zu den besonderen Kategorien.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Kontonummern gehören zu den besonderen Kategorien nach Art. 9.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Die Gewerkschaftszugehörigkeit ist eine besondere Kategorie.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Was ist überhaupt geschützt? Ohne personenbezogene Daten gilt die DSGVO nicht. Deshalb fängt jede Prüfung hier an: Geht es um Daten, mit denen man einen einzelnen Menschen identifizieren kann? Merk dir vor allem die Grenzfälle — die IP-Adresse zählt dazu, Daten von Verstorbenen nicht. Das ist das wichtigste Begriffskapitel. Ohne personenbezogene Daten gilt die DSGVO nicht — jede Prüfung beginnt hier. 3.1 Die Definition — Art. 4 Nr. 1 Folie 22 (Original): „ Personenbezogene Daten, Art. 4 Abs. 1 DS-GVO alle Informationen, die sich auf identifizierte oder identifizierbare natürliche Personen („betroffene Person\") beziehen, ob direkt oder indirekt, insbesondere mittels Zuordnung zu einer Kennung wie einem Namen, Kennnummer, Standortdaten oder Online-Kennung. Wann sind Daten personenbezogen (pbD)? … wenn sie einer identifizierten oder identifizierbaren Person zuzuordnen sind.\" Die vier Kernwörter: alle Informationen · identifiziert ODER identifizierbar · natürliche Person · direkt oder indirekt. „identifizierbar\" ist der weite Teil. Es reicht, dass man die Person mit vertretbarem Aufwand zuordnen könnte — auch über Umwege, auch mit Zusatzwissen. 3.2 Beispiele für pbD (Folie 23, Original) „▪ Name, Alter, Familienstand, Geburtsdatum ▪ Anschrift, Telefonnummer, E-Mail-Adresse ▪ Kontonummer, Kreditkartennummer ▪ Kraftfahrzeugnummer, Kfz-Kennzeichen ▪ Personalausweisnummer, Sozialversicherungsnummer ▪ Vorstrafen ▪ genetische Daten und Krankendaten ▪ Werturteile wie zum Beispiel Zeugnisse ▪ IP-Adresse \" ⚠️ Die zwei wichtigsten Einträge für T/F: „Werturteile (z. B. Zeugnisse)\" und „IP-Adresse\". Viele denken, ein Werturteil sei keine „Information über\" jemanden — doch. Und die IP-Adresse ist personenbezogen (auch die dynamische, das hat der EuGH entschieden). Das ist für dich als Informatiker die relevanteste Aussage der ganzen Folie. 3.3 Was KEINE pbD sind (Folie 24, Original) „▪ Angaben über Verstorbene ▪ Angaben über eine Gruppe von natürlichen Personen in Summen zusammengefasst (aggregiert) , z.B.: Anzahl der Mitarbeiter/-innen eines Unternehmens über 45 Jahre ▪ anonymisierte Daten ▪ Einzelangaben über juristische Personen , wie zum Beispiel Kapitalgesellschaften oder eingetragene Vereine\" Merkliste: Tote · Aggregate · Anonymisiertes · Juristische Personen. Die Faustregel: Solange man von den Daten auf einen einzelnen Menschen zurückkommen kann, sind es personenbezogene Daten. „In dieser Firma arbeiten 37 Personen über 45.\" → Daraus kannst du niemanden herauslesen. Keine personenbezogenen Daten. „Herr Meier, Jahrgang 1974, Abteilung Einkauf.\" → Sehr wohl. Personenbezogene Daten. Vorsicht bei kleinen Gruppen: „Die eine Mitarbeiterin über 60 in unserer Abteilung\" ist zwar keine Namensnennung, aber jeder im Betrieb weiß, wer gemeint ist. Dann ist der Personenbezug wieder da. 3.4 Besondere Kategorien — Art. 9 I Folie 25 (Original): „ Besondere Kategorien von pbD, Art. 9 Abs. 1 DS-GVO. Dies sind Angaben über die ▪ rassische und ethnische Herkunft ▪ politische Meinungen ▪ religiöse oder weltanschauliche Überzeugungen ▪ Gewerkschaftszugehörigkeit ▪ Genetische und biometrische Daten zur eindeutigen Identifizierung ▪ Gesundheitsdaten ▪ Daten zum Sexualleben oder der sexuellen Orientierung \" Sieben Kategorien. Merkhilfe: „Rasse – Politik – Religion – Gewerkschaft – Gene/Biometrie – Gesundheit – Sexualität.\" Für diese gilt ein grundsätzliches Verarbeitungsverbot (Art. 9 I) mit engen Ausnahmen in Art. 9 II — z. B. ausdrückliche Einwilligung, Arbeitsrecht, lebenswichtige Interessen, Gesundheitsversorgung. ⚠️ Falle: Finanzdaten und Kontonummern gehören NICHT zu den besonderen Kategorien. Sie sind zwar sensibel im Alltagssinn, aber Art. 9 zählt sie nicht auf. Genauso: Vorstrafen sind keine besondere Kategorie nach Art. 9 — strafrechtliche Daten sind separat in Art. 10 geregelt. ⚠️ Zweite Falle: Biometrische Daten sind nur dann besondere Kategorie, wenn sie „zur eindeutigen Identifizierung\" verarbeitet werden. Ein Foto allein ist nicht automatisch Art. 9 — erst die Gesichtserkennung macht es dazu. Typische Fallen zu Kapitel 3 Aussage ✓/✗ Eine IP-Adresse ist ein personenbezogenes Datum. ✓ Anonymisierte Daten sind personenbezogene Daten. ✗ Pseudonymisierte Daten sind personenbezogene Daten. ✓ — siehe Kapitel 7.4! Daten über Verstorbene fallen unter die DSGVO. ✗ Die Daten einer GmbH sind personenbezogene Daten. ✗ — juristische Person Ein Arbeitszeugnis enthält personenbezogene Daten. ✓ — Werturteile Gesundheitsdaten gehören zu den besonderen Kategorien. ✓ Kontonummern gehören zu den besonderen Kategorien nach Art. 9. ✗ Die Gewerkschaftszugehörigkeit ist eine besondere Kategorie. ✓","words":651,"mins":3},{"id":"d-4-die-neun-grundsätze","subject":"ds","num":"4","title":"4. Die neun Grundsätze","short":"Die neun Grundsätze","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nDie neun Grundregeln, an die sich jeder halten muss, der Daten verarbeitet. Sie stehen alle in <strong>Artikel 5<\/strong>.<\/p>\n<p>Wenn du dir nur einen Artikel der DSGVO merkst, dann diesen. Und darin besonders <strong>Absatz 2<\/strong> — die Rechenschaftspflicht, die die Beweislast umdreht.<\/p>\n<\/blockquote>\n<p><strong>Folie 29 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Die neun Grundsätze der DS-GVO<\/strong>\nRechtmäßigkeit · Verarbeitung nach Treu und Glauben · Transparenz · Zweckbindung · Datenminimierung · Richtigkeit · Speicherbegrenzung · Integrität und Vertraulichkeit · Rechenschaftspflicht\"<\/p>\n<\/blockquote>\n<p>Alle stehen in <strong>Art. 5<\/strong>. Das ist der Artikel, den du am besten kennen solltest.<\/p>\n<h3 id=\"d-die-neun-im-uberblick\">Die neun im Überblick<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Grundsatz<\/th>\n<th>Art. 5<\/th>\n<th>Was es heißt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>Rechtmäßigkeit<\/strong><\/td>\n<td>I a<\/td>\n<td>Es braucht immer eine Rechtsgrundlage (Art. 6)<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>Treu und Glauben<\/strong><\/td>\n<td>I a<\/td>\n<td>fair, nicht heimlich, nicht manipulativ<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>Transparenz<\/strong><\/td>\n<td>I a<\/td>\n<td>die Person muss wissen, was passiert<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>Zweckbindung<\/strong><\/td>\n<td>I b<\/td>\n<td>nur für <strong>festgelegte, eindeutige und legitime<\/strong> Zwecke<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><strong>Datenminimierung<\/strong><\/td>\n<td>I c<\/td>\n<td>so wenig wie möglich, nur was erforderlich ist<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><strong>Richtigkeit<\/strong><\/td>\n<td>I d<\/td>\n<td>sachlich richtig, aktuell; falsches wird gelöscht/berichtigt<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><strong>Speicherbegrenzung<\/strong><\/td>\n<td>I e<\/td>\n<td>nur so lange wie nötig<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><strong>Integrität und Vertraulichkeit<\/strong><\/td>\n<td>I f<\/td>\n<td>angemessene Sicherheit durch TOMs<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td><strong>Rechenschaftspflicht<\/strong><\/td>\n<td><strong>II<\/strong><\/td>\n<td>nachweisen können, dass man sich daran hält<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Merkhilfe:<\/strong> Die ersten drei stehen zusammen in <strong>lit. a<\/strong>. Die Rechenschaftspflicht steht als einzige in <strong>Absatz II<\/strong> — nicht in Absatz I.<\/p>\n<h3 id=\"d-41-zweckbindung-folie-34-original\">4.1 Zweckbindung (Folie 34, Original)<\/h3>\n<blockquote>\n<p>„▪ Verarbeitung nur für <strong>festgelegte, eindeutige und legitime Zwecke<\/strong> (vgl. Art. 5 Abs. 1 lit. b)\n▪ <strong>Keine Weiterverarbeitung in einer mit diesen Zwecken nicht zu vereinbarenden Weise<\/strong>\n▪ ➔ Geburtstagsliste ▪ ➔ Kaufvertrag\"<\/p>\n<\/blockquote>\n<p><strong>Alltagsbeispiel:<\/strong> Ein Onlineshop erhebt deine Adresse, um dir das Paket zu schicken. Er darf sie <strong>nicht<\/strong> ohne Weiteres nutzen, um dir Werbepost zu schicken — anderer Zweck.<\/p>\n<p>Der Dozent nennt zwei Beispiele: Die <strong>Geburtstagsliste<\/strong> im Büro (Zweck: Gratulation — nicht: Altersstruktur-Analyse) und den <strong>Kaufvertrag<\/strong> (Zweck: Abwicklung — nicht: Profilbildung).<\/p>\n<h3 id=\"d-42-richtigkeit-folie-35-original\">4.2 Richtigkeit (Folie 35, Original)<\/h3>\n<blockquote>\n<p>„▪ pbD müssen <strong>sachlich richtig und erforderlichenfalls auf dem neuesten Stand<\/strong> sein\n▪ Es sind alle angemessenen Maßnahmen zu treffen, damit pbD, die unrichtig sind, <strong>unverzüglich gelöscht oder berichtigt<\/strong> werden\"<\/p>\n<\/blockquote>\n<h3 id=\"d-43-rechenschaftspflicht-art-5-ii\">4.3 Rechenschaftspflicht — Art. 5 II ★<\/h3>\n<p><strong>Folie 28 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Rechenschaftspflicht (Accountibility), Artikel 5 Abs. 2 DS-GVO<\/strong>\nDer/Die Daten-Verarbeiter/-in ist für die Einhaltung der Datenschutzprinzipien <strong>verantwortlich und muss deren Einhaltung nachweisen können<\/strong> („be able to demonstrate compliance\").\"<\/p>\n<\/blockquote>\n<p><strong>Folie 30 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Wesentlich: Beweislastumkehr!<\/strong>\"<\/p>\n<p>⚠️ <strong>Das Wort „Beweislastumkehr\" ist ein sehr wahrscheinlicher T/F-Kandidat.<\/strong>\nNormalerweise muss derjenige etwas beweisen, der einen Vorwurf erhebt. Hier ist es umgekehrt: <strong>Das Unternehmen muss beweisen, dass es alles richtig macht<\/strong> — nicht die Aufsichtsbehörde muss den Verstoß nachweisen. Wer nichts dokumentiert hat, hat verloren.<\/p>\n<\/blockquote>\n<p><strong>Was das praktisch heißt:<\/strong> Es reicht nicht, dass eine Firma alles richtig macht. Sie muss es auch <strong>beweisen<\/strong> können.<\/p>\n<p>Stell dir vor, du wirst im Zug kontrolliert und sagst: „Ich habe ein Ticket gekauft, ich kann es nur nicht zeigen.\" Dann hilft dir das nichts. Genau so steht eine Firma vor der Aufsichtsbehörde da, wenn sie nichts dokumentiert hat: Sie mag im Recht sein, aber sie kann es nicht zeigen — und verliert.<\/p>\n<p><strong>Folie 59 (Original):<\/strong><\/p>\n<blockquote>\n<p>„Der/Die Verantwortliche muss gegenüber der Aufsichtsbehörde nachweisen können, dass die Regelungen der Verordnung im Unternehmen eingehalten werden. (<strong>Artikel 5 Abs. 2 i.V.m. Artikel 58 DS-GVO<\/strong>)\"<\/p>\n<\/blockquote>\n<h3 id=\"d-typische-fallen-zu-kapitel-4\">Typische Fallen zu Kapitel 4<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aussage<\/th>\n<th>✓/✗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Die DSGVO kennt neun Grundsätze der Verarbeitung.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Die Rechenschaftspflicht steht in Art. 5 Abs. 1.<\/td>\n<td><strong>✗<\/strong> — <strong>Abs. 2<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Die Rechenschaftspflicht bedeutet eine Beweislastumkehr.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Daten dürfen unbegrenzt gespeichert werden, solange sie richtig sind.<\/td>\n<td><strong>✗<\/strong> — Speicherbegrenzung<\/td>\n<\/tr>\n<tr>\n<td>Zweckänderung ist ohne Weiteres zulässig.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Die Aufsichtsbehörde muss dem Unternehmen einen Verstoß nachweisen.<\/td>\n<td><strong>✗<\/strong> — umgekehrt<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Die neun Grundregeln, an die sich jeder halten muss, der Daten verarbeitet. Sie stehen alle in Artikel 5 . Wenn du dir nur einen Artikel der DSGVO merkst, dann diesen. Und darin besonders Absatz 2 — die Rechenschaftspflicht, die die Beweislast umdreht. Folie 29 (Original): „ Die neun Grundsätze der DS-GVO Rechtmäßigkeit · Verarbeitung nach Treu und Glauben · Transparenz · Zweckbindung · Datenminimierung · Richtigkeit · Speicherbegrenzung · Integrität und Vertraulichkeit · Rechenschaftspflicht\" Alle stehen in Art. 5 . Das ist der Artikel, den du am besten kennen solltest. Die neun im Überblick # Grundsatz Art. 5 Was es heißt 1 Rechtmäßigkeit I a Es braucht immer eine Rechtsgrundlage (Art. 6) 2 Treu und Glauben I a fair, nicht heimlich, nicht manipulativ 3 Transparenz I a die Person muss wissen, was passiert 4 Zweckbindung I b nur für festgelegte, eindeutige und legitime Zwecke 5 Datenminimierung I c so wenig wie möglich, nur was erforderlich ist 6 Richtigkeit I d sachlich richtig, aktuell; falsches wird gelöscht/berichtigt 7 Speicherbegrenzung I e nur so lange wie nötig 8 Integrität und Vertraulichkeit I f angemessene Sicherheit durch TOMs 9 Rechenschaftspflicht II nachweisen können, dass man sich daran hält Merkhilfe: Die ersten drei stehen zusammen in lit. a . Die Rechenschaftspflicht steht als einzige in Absatz II — nicht in Absatz I. 4.1 Zweckbindung (Folie 34, Original) „▪ Verarbeitung nur für festgelegte, eindeutige und legitime Zwecke (vgl. Art. 5 Abs. 1 lit. b) ▪ Keine Weiterverarbeitung in einer mit diesen Zwecken nicht zu vereinbarenden Weise ▪ ➔ Geburtstagsliste ▪ ➔ Kaufvertrag\" Alltagsbeispiel: Ein Onlineshop erhebt deine Adresse, um dir das Paket zu schicken. Er darf sie nicht ohne Weiteres nutzen, um dir Werbepost zu schicken — anderer Zweck. Der Dozent nennt zwei Beispiele: Die Geburtstagsliste im Büro (Zweck: Gratulation — nicht: Altersstruktur-Analyse) und den Kaufvertrag (Zweck: Abwicklung — nicht: Profilbildung). 4.2 Richtigkeit (Folie 35, Original) „▪ pbD müssen sachlich richtig und erforderlichenfalls auf dem neuesten Stand sein ▪ Es sind alle angemessenen Maßnahmen zu treffen, damit pbD, die unrichtig sind, unverzüglich gelöscht oder berichtigt werden\" 4.3 Rechenschaftspflicht — Art. 5 II ★ Folie 28 (Original): „ Rechenschaftspflicht (Accountibility), Artikel 5 Abs. 2 DS-GVO Der/Die Daten-Verarbeiter/-in ist für die Einhaltung der Datenschutzprinzipien verantwortlich und muss deren Einhaltung nachweisen können („be able to demonstrate compliance\").\" Folie 30 (Original): „ Wesentlich: Beweislastumkehr! \" ⚠️ Das Wort „Beweislastumkehr\" ist ein sehr wahrscheinlicher T/F-Kandidat. Normalerweise muss derjenige etwas beweisen, der einen Vorwurf erhebt. Hier ist es umgekehrt: Das Unternehmen muss beweisen, dass es alles richtig macht — nicht die Aufsichtsbehörde muss den Verstoß nachweisen. Wer nichts dokumentiert hat, hat verloren. Was das praktisch heißt: Es reicht nicht, dass eine Firma alles richtig macht. Sie muss es auch beweisen können. Stell dir vor, du wirst im Zug kontrolliert und sagst: „Ich habe ein Ticket gekauft, ich kann es nur nicht zeigen.\" Dann hilft dir das nichts. Genau so steht eine Firma vor der Aufsichtsbehörde da, wenn sie nichts dokumentiert hat: Sie mag im Recht sein, aber sie kann es nicht zeigen — und verliert. Folie 59 (Original): „Der/Die Verantwortliche muss gegenüber der Aufsichtsbehörde nachweisen können, dass die Regelungen der Verordnung im Unternehmen eingehalten werden. ( Artikel 5 Abs. 2 i.V.m. Artikel 58 DS-GVO )\" Typische Fallen zu Kapitel 4 Aussage ✓/✗ Die DSGVO kennt neun Grundsätze der Verarbeitung. ✓ Die Rechenschaftspflicht steht in Art. 5 Abs. 1. ✗ — Abs. 2 Die Rechenschaftspflicht bedeutet eine Beweislastumkehr. ✓ Daten dürfen unbegrenzt gespeichert werden, solange sie richtig sind. ✗ — Speicherbegrenzung Zweckänderung ist ohne Weiteres zulässig. ✗ Die Aufsichtsbehörde muss dem Unternehmen einen Verstoß nachweisen. ✗ — umgekehrt","words":604,"mins":3},{"id":"d-5-rechtmäßigkeit--einwilligung","subject":"ds","num":"5","title":"5. Rechtmäßigkeit & Einwilligung","short":"Rechtmäßigkeit & Einwilligung","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\n<strong>Wann darf man Daten überhaupt verarbeiten?<\/strong><\/p>\n<p>Der Grundsatz ist streng: erstmal gar nicht. Nur wenn einer von sechs Erlaubnisgründen greift, ist es erlaubt.<\/p>\n<p>Das räumt auch mit einem verbreiteten Irrtum auf: Die Einwilligung ist <strong>nur einer von sechs<\/strong> Gründen — nicht der Normalfall.<\/p>\n<\/blockquote>\n<h3 id=\"d-51-verbot-mit-erlaubnisvorbehalt\">5.1 Verbot mit Erlaubnisvorbehalt ★★★<\/h3>\n<p><strong>Folie 31 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Ausgangspunkt bei der Beurteilung der Verarbeitung pbD<\/strong>\n➢ <strong>„Verbot mit Erlaubnisvorbehalt\"<\/strong> — nur erlaubt wenn…\"<\/p>\n<\/blockquote>\n<p><strong>Das ist das Grundprinzip des gesamten Datenschutzrechts.<\/strong> Merk dir den Satz wörtlich.<\/p>\n<blockquote>\n<p><strong>Jede Verarbeitung personenbezogener Daten ist verboten — es sei denn, es greift ein Erlaubnistatbestand.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Nicht umgekehrt!<\/strong> Es ist nicht „alles erlaubt, was nicht verboten ist\", sondern „alles verboten, was nicht erlaubt ist\".<\/p>\n<p><strong>Das Bild dazu:<\/strong> Es ist wie mit einem fremden Grundstück. Betreten ist <strong>verboten<\/strong> — es sei denn, du hast einen Grund, den das Gesetz anerkennt: Der Besitzer hat es erlaubt, du bist der Postbote, oder es brennt.<\/p>\n<p>Nicht umgekehrt! Es ist <strong>nicht<\/strong> so, dass jeder erstmal reindarf, bis der Besitzer widerspricht.<\/p>\n<p>Genau so ist es mit Daten: Erst brauchst du eine Erlaubnis, dann darfst du verarbeiten. Wer keine Erlaubnis findet, darf nicht.<\/p>\n<h3 id=\"d-52-die-sechs-erlaubnistatbestande-art-6-i\">5.2 Die sechs Erlaubnistatbestände — Art. 6 I<\/h3>\n<p><strong>Folie 32 (Original, in der Reihenfolge des Dozenten):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Art. 6 DSGVO: Erlaubnistatbestände<\/strong>\n1. <strong>Schutz lebenswichtiger Interessen<\/strong> – Art 6 Abs. 1 Buchst. <strong>d<\/strong>\n2. <strong>Wahrung einer öffentlichen Aufgabe<\/strong> – Art 6 Abs. 1 Buchst. <strong>e<\/strong>\n3. <strong>Gesetz / rechtliche Verpflichtung<\/strong> – Art 6 Abs. 1 Buchst. <strong>c<\/strong>\n4. <strong>Vertragsbeziehung mit betroffenen Personen<\/strong> – Art 6 Abs. 1 Buchst. <strong>b<\/strong>\n5. <strong>Interessenabwägung<\/strong> – Art 6 Abs. 1 Buchst. <strong>f<\/strong> (Wahrung berechtigter Interessen: ▪ Erforderlichkeit ▪ Interessenabwägung)\n6. <strong>Einwilligung<\/strong> – Art 6 Abs. 1 Buchst. <strong>a<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>In der Buchstaben-Reihenfolge des Gesetzes:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>lit.<\/th>\n<th>Tatbestand<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>a<\/strong><\/td>\n<td><strong>Einwilligung<\/strong><\/td>\n<td>Newsletter-Anmeldung<\/td>\n<\/tr>\n<tr>\n<td><strong>b<\/strong><\/td>\n<td><strong>Vertrag<\/strong> (oder vorvertragliche Maßnahme)<\/td>\n<td>Adresse für den Paketversand<\/td>\n<\/tr>\n<tr>\n<td><strong>c<\/strong><\/td>\n<td><strong>rechtliche Verpflichtung<\/strong><\/td>\n<td>Lohnsteuer ans Finanzamt, Aufbewahrungsfristen<\/td>\n<\/tr>\n<tr>\n<td><strong>d<\/strong><\/td>\n<td><strong>lebenswichtige Interessen<\/strong><\/td>\n<td>Bewusstlose Person im Notfall<\/td>\n<\/tr>\n<tr>\n<td><strong>e<\/strong><\/td>\n<td><strong>öffentliche Aufgabe<\/strong><\/td>\n<td>Behörde erfüllt hoheitliche Aufgabe<\/td>\n<\/tr>\n<tr>\n<td><strong>f<\/strong><\/td>\n<td><strong>berechtigte Interessen<\/strong> (Interessenabwägung)<\/td>\n<td>Videoüberwachung gegen Diebstahl, IT-Sicherheitslogs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Merkhilfe: „Ein Vertrag ist Recht lebenswichtig für öffentliche Interessen\"<\/strong> (a–b–c–d–e–f).<\/p>\n<blockquote>\n<p>⚠️ <strong>Sehr wichtige Falle:<\/strong> Die Einwilligung ist <strong>eine von sechs<\/strong> gleichrangigen Grundlagen — <strong>nicht<\/strong> die wichtigste und <strong>nicht<\/strong> die Regel. In der Praxis ist sie sogar die <strong>unbeliebteste<\/strong>, weil sie jederzeit widerrufen werden kann. Wenn eine T/F-Frage behauptet „Für jede Verarbeitung ist eine Einwilligung erforderlich\" → <strong>falsch<\/strong>.<\/p>\n<\/blockquote>\n<p><strong>Bei lit. f prüfst du zwei Dinge<\/strong> (so die Folie): <strong>Erforderlichkeit<\/strong> + <strong>Interessenabwägung<\/strong>. Das berechtigte Interesse darf nicht von den Interessen der betroffenen Person überwogen werden.<\/p>\n<h3 id=\"d-53-anforderungen-an-die-einwilligung-art-6-i-a-ivm-art-7\">5.3 Anforderungen an die Einwilligung — Art. 6 I a i.V.m. Art. 7<\/h3>\n<p><strong>Folie 33 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Anforderungen an die Einwilligung<\/strong>\n▪ <strong>Keine eigenhändige Unterschrift<\/strong> des/der Betroffenen erforderlich, aber <strong>der/die Verantwortliche muss die Einwilligung nachweisen können<\/strong>\n▪ <strong>Klare einfache Sprache<\/strong> sowie <strong>Unterscheidung von anderen Sachverhalten<\/strong>\n▪ <strong>Information über Widerrufsrecht<\/strong>\n▪ <strong>Ausübung des Widerrufsrechts genauso einfach wie die Einwilligung<\/strong>\n▪ <strong>Allgemeines Kopplungsverbot / Kriterium der Freiwilligkeit<\/strong>\n▪ <strong>Einwilligungen von Kindern erst ab 16 Jahren<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Die sechs Anforderungen als Merkliste:<\/strong><\/p>\n<pre><code>① Keine Unterschrift nötig — aber NACHWEISBAR (Art. 7 I)\n② Klare, einfache Sprache + von anderen Erklärungen getrennt (Art. 7 II)\n③ Über das Widerrufsrecht informieren (Art. 7 III)\n④ Widerruf so einfach wie die Erteilung (Art. 7 III S. 4)\n⑤ Kopplungsverbot / Freiwilligkeit (Art. 7 IV)\n⑥ Kinder: erst ab 16 Jahren (Art. 8)\n<\/code><\/pre>\n<p><strong>Erklärung der wichtigsten Punkte:<\/strong><\/p>\n<ul>\n<li><strong>Nachweisbarkeit statt Form:<\/strong> Ein Klick auf eine Checkbox genügt — aber du musst später beweisen können, dass geklickt wurde. Deshalb Double-Opt-In mit Protokollierung.<\/li>\n<li><strong>„Genauso einfach widerrufen\"<\/strong>: Wenn die Einwilligung ein Klick war, darf der Widerruf nicht ein Brief per Post sein. Deshalb gibt es den „Alle ablehnen\"-Button in Cookie-Bannern gleichberechtigt neben „Alle akzeptieren\".<\/li>\n<li><strong>Kopplungsverbot:<\/strong> Ein Vertrag darf nicht davon abhängig gemacht werden, dass man in eine Datenverarbeitung einwilligt, die für den Vertrag gar nicht nötig ist. Sonst ist die Einwilligung nicht <strong>freiwillig<\/strong>.<\/li>\n<li><strong>16 Jahre (Art. 8):<\/strong> Bei Diensten der Informationsgesellschaft (Apps, Social Media) können Kinder erst ab 16 selbst einwilligen. Darunter braucht es die Zustimmung der Sorgeberechtigten. (Die DSGVO erlaubt den Mitgliedstaaten, auf bis zu 13 Jahre abzusenken — Deutschland bleibt bei 16.)<\/li>\n<\/ul>\n<blockquote>\n<p>⚠️ <strong>Falle:<\/strong> Die Einwilligung braucht <strong>keine Schriftform<\/strong> — aber der Verantwortliche trägt die <strong>Nachweispflicht<\/strong>. Beide Hälften des Satzes werden gern getrennt und einzeln falsch abgefragt.<\/p>\n<p>⚠️ <strong>Zweite Falle:<\/strong> Eine Einwilligung ist <strong>jederzeit widerruflich<\/strong> — ohne Angabe von Gründen. Der Widerruf wirkt aber nur <strong>für die Zukunft<\/strong> (ex nunc); die bis dahin erfolgte Verarbeitung bleibt rechtmäßig.<\/p>\n<\/blockquote>\n<h3 id=\"d-typische-fallen-zu-kapitel-5\">Typische Fallen zu Kapitel 5<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aussage<\/th>\n<th>✓/✗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Die Verarbeitung pbD ist grundsätzlich erlaubt, sofern sie nicht verboten ist.<\/td>\n<td><strong>✗<\/strong> — umgekehrt: <strong>Verbot mit Erlaubnisvorbehalt<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Art. 6 kennt sechs Erlaubnistatbestände.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Ohne Einwilligung darf man niemals pbD verarbeiten.<\/td>\n<td><strong>✗<\/strong> — fünf andere Grundlagen<\/td>\n<\/tr>\n<tr>\n<td>Eine Einwilligung muss eigenhändig unterschrieben werden.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Der Verantwortliche muss die Einwilligung nachweisen können.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Der Widerruf muss genauso einfach sein wie die Einwilligung.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Kinder können ab 14 Jahren selbst einwilligen.<\/td>\n<td><strong>✗<\/strong> — <strong>16<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Eine Einwilligung kann jederzeit widerrufen werden.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Der Widerruf macht die frühere Verarbeitung rückwirkend rechtswidrig.<\/td>\n<td><strong>✗<\/strong> — wirkt nur für die Zukunft<\/td>\n<\/tr>\n<tr>\n<td>Die Erfüllung eines Vertrags kann eine Rechtsgrundlage sein.<\/td>\n<td><strong>✓<\/strong> — Art. 6 I b<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Wann darf man Daten überhaupt verarbeiten? Der Grundsatz ist streng: erstmal gar nicht. Nur wenn einer von sechs Erlaubnisgründen greift, ist es erlaubt. Das räumt auch mit einem verbreiteten Irrtum auf: Die Einwilligung ist nur einer von sechs Gründen — nicht der Normalfall. 5.1 Verbot mit Erlaubnisvorbehalt ★★★ Folie 31 (Original): „ Ausgangspunkt bei der Beurteilung der Verarbeitung pbD ➢ „Verbot mit Erlaubnisvorbehalt\" — nur erlaubt wenn…\" Das ist das Grundprinzip des gesamten Datenschutzrechts. Merk dir den Satz wörtlich. Jede Verarbeitung personenbezogener Daten ist verboten — es sei denn, es greift ein Erlaubnistatbestand. Nicht umgekehrt! Es ist nicht „alles erlaubt, was nicht verboten ist\", sondern „alles verboten, was nicht erlaubt ist\". Das Bild dazu: Es ist wie mit einem fremden Grundstück. Betreten ist verboten — es sei denn, du hast einen Grund, den das Gesetz anerkennt: Der Besitzer hat es erlaubt, du bist der Postbote, oder es brennt. Nicht umgekehrt! Es ist nicht so, dass jeder erstmal reindarf, bis der Besitzer widerspricht. Genau so ist es mit Daten: Erst brauchst du eine Erlaubnis, dann darfst du verarbeiten. Wer keine Erlaubnis findet, darf nicht. 5.2 Die sechs Erlaubnistatbestände — Art. 6 I Folie 32 (Original, in der Reihenfolge des Dozenten): „ Art. 6 DSGVO: Erlaubnistatbestände 1. Schutz lebenswichtiger Interessen – Art 6 Abs. 1 Buchst. d 2. Wahrung einer öffentlichen Aufgabe – Art 6 Abs. 1 Buchst. e 3. Gesetz / rechtliche Verpflichtung – Art 6 Abs. 1 Buchst. c 4. Vertragsbeziehung mit betroffenen Personen – Art 6 Abs. 1 Buchst. b 5. Interessenabwägung – Art 6 Abs. 1 Buchst. f (Wahrung berechtigter Interessen: ▪ Erforderlichkeit ▪ Interessenabwägung) 6. Einwilligung – Art 6 Abs. 1 Buchst. a \" In der Buchstaben-Reihenfolge des Gesetzes: lit. Tatbestand Beispiel a Einwilligung Newsletter-Anmeldung b Vertrag (oder vorvertragliche Maßnahme) Adresse für den Paketversand c rechtliche Verpflichtung Lohnsteuer ans Finanzamt, Aufbewahrungsfristen d lebenswichtige Interessen Bewusstlose Person im Notfall e öffentliche Aufgabe Behörde erfüllt hoheitliche Aufgabe f berechtigte Interessen (Interessenabwägung) Videoüberwachung gegen Diebstahl, IT-Sicherheitslogs Merkhilfe: „Ein Vertrag ist Recht lebenswichtig für öffentliche Interessen\" (a–b–c–d–e–f). ⚠️ Sehr wichtige Falle: Die Einwilligung ist eine von sechs gleichrangigen Grundlagen — nicht die wichtigste und nicht die Regel. In der Praxis ist sie sogar die unbeliebteste , weil sie jederzeit widerrufen werden kann. Wenn eine T/F-Frage behauptet „Für jede Verarbeitung ist eine Einwilligung erforderlich\" → falsch . Bei lit. f prüfst du zwei Dinge (so die Folie): Erforderlichkeit + Interessenabwägung . Das berechtigte Interesse darf nicht von den Interessen der betroffenen Person überwogen werden. 5.3 Anforderungen an die Einwilligung — Art. 6 I a i.V.m. Art. 7 Folie 33 (Original): „ Anforderungen an die Einwilligung ▪ Keine eigenhändige Unterschrift des/der Betroffenen erforderlich, aber der/die Verantwortliche muss die Einwilligung nachweisen können ▪ Klare einfache Sprache sowie Unterscheidung von anderen Sachverhalten ▪ Information über Widerrufsrecht ▪ Ausübung des Widerrufsrechts genauso einfach wie die Einwilligung ▪ Allgemeines Kopplungsverbot / Kriterium der Freiwilligkeit ▪ Einwilligungen von Kindern erst ab 16 Jahren \" Die sechs Anforderungen als Merkliste: ① Keine Unterschrift nötig — aber NACHWEISBAR (Art. 7 I) ② Klare, einfache Sprache + von anderen Erklärungen getrennt (Art. 7 II) ③ Über das Widerrufsrecht informieren (Art. 7 III) ④ Widerruf so einfach wie die Erteilung (Art. 7 III S. 4) ⑤ Kopplungsverbot / Freiwilligkeit (Art. 7 IV) ⑥ Kinder: erst ab 16 Jahren (Art. 8) Erklärung der wichtigsten Punkte: Nachweisbarkeit statt Form: Ein Klick auf eine Checkbox genügt — aber du musst später beweisen können, dass geklickt wurde. Deshalb Double-Opt-In mit Protokollierung. „Genauso einfach widerrufen\" : Wenn die Einwilligung ein Klick war, darf der Widerruf nicht ein Brief per Post sein. Deshalb gibt es den „Alle ablehnen\"-Button in Cookie-Bannern gleichberechtigt neben „Alle akzeptieren\". Kopplungsverbot: Ein Vertrag darf nicht davon abhängig gemacht werden, dass man in eine Datenverarbeitung einwilligt, die für den Vertrag gar nicht nötig ist. Sonst ist die Einwilligung nicht freiwillig . 16 Jahre (Art. 8): Bei Diensten der Informationsgesellschaft (Apps, Social Media) können Kinder erst ab 16 selbst einwilligen. Darunter braucht es die Zustimmung der Sorgeberechtigten. (Die DSGVO erlaubt den Mitgliedstaaten, auf bis zu 13 Jahre abzusenken — Deutschland bleibt bei 16.) ⚠️ Falle: Die Einwilligung braucht keine Schriftform — aber der Verantwortliche trägt die Nachweispflicht . Beide Hälften des Satzes werden gern getrennt und einzeln falsch abgefragt. ⚠️ Zweite Falle: Eine Einwilligung ist jederzeit widerruflich — ohne Angabe von Gründen. Der Widerruf wirkt aber nur für die Zukunft (ex nunc); die bis dahin erfolgte Verarbeitung bleibt rechtmäßig. Typische Fallen zu Kapitel 5 Aussage ✓/✗ Die Verarbeitung pbD ist grundsätzlich erlaubt, sofern sie nicht verboten ist. ✗ — umgekehrt: Verbot mit Erlaubnisvorbehalt Art. 6 kennt sechs Erlaubnistatbestände. ✓ Ohne Einwilligung darf man niemals pbD verarbeiten. ✗ — fünf andere Grundlagen Eine Einwilligung muss eigenhändig unterschrieben werden. ✗ Der Verantwortliche muss die Einwilligung nachweisen können. ✓ Der Widerruf muss genauso einfach sein wie die Einwilligung. ✓ Kinder können ab 14 Jahren selbst einwilligen. ✗ — 16 Eine Einwilligung kann jederzeit widerrufen werden. ✓ Der Widerruf macht die frühere Verarbeitung rückwirkend rechtswidrig. ✗ — wirkt nur für die Zukunft Die Erfüllung eines Vertrags kann eine Rechtsgrundlage sein. ✓ — Art. 6 I b","words":854,"mins":4},{"id":"d-6-informationspflichten--betroffenenrechte","subject":"ds","num":"6","title":"6. Informationspflichten & Betroffenenrechte","short":"Informationspflichten & Betroffenenrechte","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\n<strong>Was kannst du als Betroffener verlangen?<\/strong><\/p>\n<p>Auskunft, Berichtigung, Löschung, Übertragung, Widerspruch. Jedes Recht hat seinen eigenen Artikel, und die Nummern werden bei True/False gern vertauscht.<\/p>\n<p>Merk dir die Reihenfolge einmal richtig, dann sind das mehrere sichere Punkte.<\/p>\n<\/blockquote>\n<h3 id=\"d-61-informationspflichten-folie-36-original\">6.1 Informationspflichten (Folie 36, Original)<\/h3>\n<blockquote>\n<p>„▪ <strong>Art. 13<\/strong>: Information <strong>zum Zeitpunkt der Erhebung<\/strong>\n▪ <strong>Art. 14<\/strong>: Information, <strong>wenn die Daten nicht bei der betroffenen Person erhoben<\/strong> [wurden]\n▪ <strong>Art. 33, 34<\/strong>: Informationspflicht bei <strong>Verletzung des Schutzes personenbezogener Daten<\/strong> an Aufsichtsbehörde/betroffene Personen\"<\/p>\n<\/blockquote>\n<p><strong>Merkhilfe:<\/strong>\n- <strong>Art. 13<\/strong> = Daten kommen <strong>direkt von dir<\/strong> (du füllst ein Formular aus)\n- <strong>Art. 14<\/strong> = Daten kommen <strong>von woanders<\/strong> (aus einem gekauften Adressbestand, von der Schufa)<\/p>\n<p><strong>Merksatz:<\/strong> <em>13 = direkt, 14 = fremd.<\/em><\/p>\n<h3 id=\"d-62-die-betroffenenrechte-folie-37-original\">6.2 Die Betroffenenrechte (Folie 37, Original)<\/h3>\n<blockquote>\n<p>„▪ <strong>Auskunftsanspruch — Art. 15<\/strong>\n▪ <strong>Berichtigung und Löschung von Daten — Art. 16 – 17<\/strong>\n▪ <strong>Einschränkung der Verarbeitung — Art. 19<\/strong> <em>(⚠️ Folienfehler, richtig ist <\/em><em>Art. 18<\/em><em>)<\/em>\n▪ <strong>Recht auf Datenübertragbarkeit — Art. 20<\/strong>\n▪ <strong>Widerspruchsrecht — Art. 21<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"d-die-rechte-im-uberblick\">Die Rechte im Überblick<\/h3>\n<table>\n<thead>\n<tr>\n<th>Art.<\/th>\n<th>Recht<\/th>\n<th>In einem Satz<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>15<\/strong><\/td>\n<td><strong>Auskunft<\/strong><\/td>\n<td>„Was habt ihr über mich?\"<\/td>\n<\/tr>\n<tr>\n<td><strong>16<\/strong><\/td>\n<td><strong>Berichtigung<\/strong><\/td>\n<td>„Das ist falsch, korrigiert es.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>17<\/strong><\/td>\n<td><strong>Löschung<\/strong> („Recht auf Vergessenwerden\")<\/td>\n<td>„Löscht mich.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>18<\/strong><\/td>\n<td><strong>Einschränkung der Verarbeitung<\/strong><\/td>\n<td>„Behaltet es, aber rührt es nicht an.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>19<\/strong><\/td>\n<td><em>Mitteilungspflicht<\/em> an Empfänger<\/td>\n<td>(kein Betroffenenrecht im engeren Sinn)<\/td>\n<\/tr>\n<tr>\n<td><strong>20<\/strong><\/td>\n<td><strong>Datenübertragbarkeit<\/strong> (Portabilität)<\/td>\n<td>„Gebt mir meine Daten als Datei.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>21<\/strong><\/td>\n<td><strong>Widerspruch<\/strong><\/td>\n<td>„Hört auf damit.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>22<\/strong><\/td>\n<td><em>Automatisierte Einzelfallentscheidung<\/em><\/td>\n<td>„Kein Mensch hat das entschieden — das will ich nicht.\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>⚠️ <strong>Die Folie schreibt für die Einschränkung der Verarbeitung „Art. 19\". Richtig ist Art. 18.<\/strong> Art. 19 ist die Mitteilungspflicht gegenüber Empfängern. Wenn dazu eine T/F-Frage kommt, ist Art. 18 die richtige Antwort — der DSGVO-Text ist ja zugelassenes Hilfsmittel, du kannst es nachschlagen.<\/p>\n<\/blockquote>\n<h3 id=\"d-63-recht-auf-auskunft-art-15-folie-38-original\">6.3 Recht auf Auskunft — Art. 15 (Folie 38, Original)<\/h3>\n<blockquote>\n<p>„Anspruch des/der Betroffenen, eine Auskunft über die ihn betreffenden pbD zu erhalten, sowie die weitere folgende Informationen:\n▪ <strong>Verarbeitungszwecke<\/strong>\n▪ <strong>Kategorien von pbD<\/strong>, die verarbeitet werden\n▪ <strong>Empfänger oder Kategorien von Empfängern<\/strong>\n▪ <strong>Speicherdauer<\/strong> bzw. Kriterien der Speicherdauer\n▪ Hinweis auf das Bestehen eines <strong>Rechts auf Berichtigung oder Löschung, Einschränkung der Verarbeitung oder auf das Widerspruchsrecht<\/strong>\n▪ Hinweis auf <strong>Beschwerderecht bei der Behörde<\/strong>\"<\/p>\n<\/blockquote>\n<p>Die Auskunft umfasst also nicht nur die Daten selbst, sondern <strong>auch die Metainformationen<\/strong>: Zwecke, Empfänger, Dauer, Rechte.<\/p>\n<h3 id=\"d-64-recht-auf-vergessenwerden-art-17-folie-40-original\">6.4 Recht auf Vergessenwerden — Art. 17 (Folie 40, Original)<\/h3>\n<blockquote>\n<p>„Anspruch des/der Betroffenen, die ihn/sie betreffenden pbD <strong>unverzüglich zu löschen<\/strong>, sofern <strong>keine Gründe dem entgegenstehen<\/strong> wie bspw.:\n▪ <strong>Recht auf freie Meinungsäußerung / Information<\/strong>\n▪ <strong>Erfüllung einer rechtlichen Verpflichtung<\/strong> (bspw. Aufbewahrungspflichten)\n▪ <strong>Geltendmachung von Rechtsansprüchen<\/strong>\n▪ Bei öffentlich gemachten pbD muss der/die Verantwortliche <strong>auch die weiteren Verantwortlichen über das Löschungsbegehren informieren<\/strong>\"<\/p>\n<p>⚠️ <strong>Falle:<\/strong> Das Recht auf Löschung ist <strong>nicht absolut<\/strong>. Es gibt Gegengründe — insbesondere <strong>gesetzliche Aufbewahrungspflichten<\/strong> (z. B. 10 Jahre für Rechnungen nach HGB/AO). Wenn eine Frage sagt „Betroffene können jederzeit die Löschung aller ihrer Daten verlangen\" → <strong>falsch<\/strong>.<\/p>\n<\/blockquote>\n<h3 id=\"d-65-recht-auf-datenubertragbarkeit-art-20-folie-39-original\">6.5 Recht auf Datenübertragbarkeit — Art. 20 (Folie 39, Original)<\/h3>\n<blockquote>\n<p>„Anspruch des/der Betroffenen\n▪ die ihn/sie betreffenden und <strong>von ihm/ihr bereitgestellten<\/strong> pbD zu erhalten (Abs. 1) und <strong>mittelbar/unmittelbar an einen anderen Verantwortlichen zu übermitteln<\/strong> (Abs. 1/Abs. 2),\n▪ Bereitstellung in einem <strong>üblichen, maschinenlesbaren Format<\/strong>,\n▪ <strong>wenn die Verarbeitung<\/strong>\n• <strong>auf einer Einwilligung oder einem Vertrag beruht<\/strong> und\n• <strong>mit Hilfe automatisierter Verfahren<\/strong> erfolgt.\"<\/p>\n<p>⚠️ <strong>Zwei kumulative Bedingungen<\/strong> — beide müssen erfüllt sein: (1) Rechtsgrundlage ist <strong>Einwilligung oder Vertrag<\/strong> (nicht: berechtigtes Interesse, nicht: gesetzliche Pflicht) <strong>und<\/strong> (2) die Verarbeitung ist <strong>automatisiert<\/strong>. Das ist das engste der Betroffenenrechte.<\/p>\n<\/blockquote>\n<p><strong>Alltagsbeispiel:<\/strong> Du willst deine Spotify-Playlists zu Apple Music mitnehmen → Art. 20. Du willst die Bonitätsbewertung der Schufa mitnehmen → geht nicht, die beruht nicht auf deiner Einwilligung und du hast sie nicht bereitgestellt.<\/p>\n<h3 id=\"d-66-widerspruchsrecht-art-21-folie-41-original\">6.6 Widerspruchsrecht — Art. 21 (Folie 41, Original)<\/h3>\n<blockquote>\n<p>„Recht, der weiteren Verarbeitung von Daten zu widersprechen, Artikel 21\n▪ <strong>aus Gründen, die sich aus der besonderen Situation des/der Betroffenen ergeben<\/strong>, wenn die Datenverarbeitung\n• für die Wahrnehmung einer <strong>Aufgabe im öffentlichen Interesse<\/strong> erforderlich ist\n• in Ausübung einer … <strong>öffentlichen Gewalt<\/strong> erfolgt\n• auf einem <strong>berechtigten Interesse<\/strong> des/der Verarbeiters/-in beruht\n▪ Der/Die Verantwortliche muss <strong>„zwingende Gründe\" nachweisen<\/strong>, welche die Interessen des/der Betroffenen überwiegen\n• <strong>bis diese nachgewiesen wurden: Einschränkung der Verarbeitung<\/strong>\n• es empfiehlt sich, diese schon zu Beginn der Verarbeitung zu dokumentieren\n▪ <strong>Der/Die Betroffene ist auf sein/ihr Widerspruchsrecht hinzuweisen<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Merke:<\/strong> Der Widerspruch greift bei <strong>Art. 6 I e und f<\/strong> (öffentliche Aufgabe, berechtigtes Interesse). Bei einer Einwilligung braucht man keinen Widerspruch — da widerruft man.<\/p>\n<p><strong>Ausnahme:<\/strong> Bei <strong>Direktwerbung<\/strong> ist der Widerspruch <strong>unbedingt<\/strong> — da braucht es keine „besondere Situation\", und der Verantwortliche kann nichts dagegensetzen.<\/p>\n<h3 id=\"d-67-widerspruch-vs-widerruf-die-abgrenzung\">6.7 Widerspruch vs. Widerruf — die Abgrenzung<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Widerruf<\/strong> (Art. 7 III)<\/th>\n<th><strong>Widerspruch<\/strong> (Art. 21)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Wogegen<\/td>\n<td>gegen die <strong>Einwilligung<\/strong> (Art. 6 I a)<\/td>\n<td>gegen Verarbeitung auf Basis von <strong>Art. 6 I e oder f<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Begründung nötig?<\/td>\n<td><strong>nein<\/strong><\/td>\n<td>ja — „besondere Situation\" (außer bei Direktwerbung)<\/td>\n<\/tr>\n<tr>\n<td>Wirkung<\/td>\n<td>Rechtsgrundlage entfällt sofort<\/td>\n<td>Verantwortlicher kann zwingende Gründe nachweisen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"d-typische-fallen-zu-kapitel-6\">Typische Fallen zu Kapitel 6<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aussage<\/th>\n<th>✓/✗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Art. 13 gilt, wenn die Daten bei der betroffenen Person erhoben werden.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Art. 14 gilt bei Direkterhebung.<\/td>\n<td><strong>✗<\/strong> — bei Erhebung <strong>woanders<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Das Recht auf Löschung gilt uneingeschränkt.<\/td>\n<td><strong>✗<\/strong> — gesetzliche Aufbewahrungspflichten gehen vor<\/td>\n<\/tr>\n<tr>\n<td>Das Recht auf Datenübertragbarkeit gilt für jede Verarbeitung.<\/td>\n<td><strong>✗<\/strong> — nur bei Einwilligung/Vertrag <strong>und<\/strong> automatisiert<\/td>\n<\/tr>\n<tr>\n<td>Die Auskunft nach Art. 15 umfasst auch die Speicherdauer.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Gegen Direktwerbung kann man ohne Begründung widersprechen.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Das Widerspruchsrecht richtet sich gegen eine erteilte Einwilligung.<\/td>\n<td><strong>✗<\/strong> — das wäre der <strong>Widerruf<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Was kannst du als Betroffener verlangen? Auskunft, Berichtigung, Löschung, Übertragung, Widerspruch. Jedes Recht hat seinen eigenen Artikel, und die Nummern werden bei True/False gern vertauscht. Merk dir die Reihenfolge einmal richtig, dann sind das mehrere sichere Punkte. 6.1 Informationspflichten (Folie 36, Original) „▪ Art. 13 : Information zum Zeitpunkt der Erhebung ▪ Art. 14 : Information, wenn die Daten nicht bei der betroffenen Person erhoben [wurden] ▪ Art. 33, 34 : Informationspflicht bei Verletzung des Schutzes personenbezogener Daten an Aufsichtsbehörde/betroffene Personen\" Merkhilfe: - Art. 13 = Daten kommen direkt von dir (du füllst ein Formular aus) - Art. 14 = Daten kommen von woanders (aus einem gekauften Adressbestand, von der Schufa) Merksatz: 13 = direkt, 14 = fremd. 6.2 Die Betroffenenrechte (Folie 37, Original) „▪ Auskunftsanspruch — Art. 15 ▪ Berichtigung und Löschung von Daten — Art. 16 – 17 ▪ Einschränkung der Verarbeitung — Art. 19 (⚠️ Folienfehler, richtig ist Art. 18 ) ▪ Recht auf Datenübertragbarkeit — Art. 20 ▪ Widerspruchsrecht — Art. 21 \" Die Rechte im Überblick Art. Recht In einem Satz 15 Auskunft „Was habt ihr über mich?\" 16 Berichtigung „Das ist falsch, korrigiert es.\" 17 Löschung („Recht auf Vergessenwerden\") „Löscht mich.\" 18 Einschränkung der Verarbeitung „Behaltet es, aber rührt es nicht an.\" 19 Mitteilungspflicht an Empfänger (kein Betroffenenrecht im engeren Sinn) 20 Datenübertragbarkeit (Portabilität) „Gebt mir meine Daten als Datei.\" 21 Widerspruch „Hört auf damit.\" 22 Automatisierte Einzelfallentscheidung „Kein Mensch hat das entschieden — das will ich nicht.\" ⚠️ Die Folie schreibt für die Einschränkung der Verarbeitung „Art. 19\". Richtig ist Art. 18. Art. 19 ist die Mitteilungspflicht gegenüber Empfängern. Wenn dazu eine T/F-Frage kommt, ist Art. 18 die richtige Antwort — der DSGVO-Text ist ja zugelassenes Hilfsmittel, du kannst es nachschlagen. 6.3 Recht auf Auskunft — Art. 15 (Folie 38, Original) „Anspruch des/der Betroffenen, eine Auskunft über die ihn betreffenden pbD zu erhalten, sowie die weitere folgende Informationen: ▪ Verarbeitungszwecke ▪ Kategorien von pbD , die verarbeitet werden ▪ Empfänger oder Kategorien von Empfängern ▪ Speicherdauer bzw. Kriterien der Speicherdauer ▪ Hinweis auf das Bestehen eines Rechts auf Berichtigung oder Löschung, Einschränkung der Verarbeitung oder auf das Widerspruchsrecht ▪ Hinweis auf Beschwerderecht bei der Behörde \" Die Auskunft umfasst also nicht nur die Daten selbst, sondern auch die Metainformationen : Zwecke, Empfänger, Dauer, Rechte. 6.4 Recht auf Vergessenwerden — Art. 17 (Folie 40, Original) „Anspruch des/der Betroffenen, die ihn/sie betreffenden pbD unverzüglich zu löschen , sofern keine Gründe dem entgegenstehen wie bspw.: ▪ Recht auf freie Meinungsäußerung / Information ▪ Erfüllung einer rechtlichen Verpflichtung (bspw. Aufbewahrungspflichten) ▪ Geltendmachung von Rechtsansprüchen ▪ Bei öffentlich gemachten pbD muss der/die Verantwortliche auch die weiteren Verantwortlichen über das Löschungsbegehren informieren \" ⚠️ Falle: Das Recht auf Löschung ist nicht absolut . Es gibt Gegengründe — insbesondere gesetzliche Aufbewahrungspflichten (z. B. 10 Jahre für Rechnungen nach HGB/AO). Wenn eine Frage sagt „Betroffene können jederzeit die Löschung aller ihrer Daten verlangen\" → falsch . 6.5 Recht auf Datenübertragbarkeit — Art. 20 (Folie 39, Original) „Anspruch des/der Betroffenen ▪ die ihn/sie betreffenden und von ihm/ihr bereitgestellten pbD zu erhalten (Abs. 1) und mittelbar/unmittelbar an einen anderen Verantwortlichen zu übermitteln (Abs. 1/Abs. 2), ▪ Bereitstellung in einem üblichen, maschinenlesbaren Format , ▪ wenn die Verarbeitung • auf einer Einwilligung oder einem Vertrag beruht und • mit Hilfe automatisierter Verfahren erfolgt.\" ⚠️ Zwei kumulative Bedingungen — beide müssen erfüllt sein: (1) Rechtsgrundlage ist Einwilligung oder Vertrag (nicht: berechtigtes Interesse, nicht: gesetzliche Pflicht) und (2) die Verarbeitung ist automatisiert . Das ist das engste der Betroffenenrechte. Alltagsbeispiel: Du willst deine Spotify-Playlists zu Apple Music mitnehmen → Art. 20. Du willst die Bonitätsbewertung der Schufa mitnehmen → geht nicht, die beruht nicht auf deiner Einwilligung und du hast sie nicht bereitgestellt. 6.6 Widerspruchsrecht — Art. 21 (Folie 41, Original) „Recht, der weiteren Verarbeitung von Daten zu widersprechen, Artikel 21 ▪ aus Gründen, die sich aus der besonderen Situation des/der Betroffenen ergeben , wenn die Datenverarbeitung • für die Wahrnehmung einer Aufgabe im öffentlichen Interesse erforderlich ist • in Ausübung einer … öffentlichen Gewalt erfolgt • auf einem berechtigten Interesse des/der Verarbeiters/-in beruht ▪ Der/Die Verantwortliche muss „zwingende Gründe\" nachweisen , welche die Interessen des/der Betroffenen überwiegen • bis diese nachgewiesen wurden: Einschränkung der Verarbeitung • es empfiehlt sich, diese schon zu Beginn der Verarbeitung zu dokumentieren ▪ Der/Die Betroffene ist auf sein/ihr Widerspruchsrecht hinzuweisen \" Merke: Der Widerspruch greift bei Art. 6 I e und f (öffentliche Aufgabe, berechtigtes Interesse). Bei einer Einwilligung braucht man keinen Widerspruch — da widerruft man. Ausnahme: Bei Direktwerbung ist der Widerspruch unbedingt — da braucht es keine „besondere Situation\", und der Verantwortliche kann nichts dagegensetzen. 6.7 Widerspruch vs. Widerruf — die Abgrenzung Widerruf (Art. 7 III) Widerspruch (Art. 21) Wogegen gegen die Einwilligung (Art. 6 I a) gegen Verarbeitung auf Basis von Art. 6 I e oder f Begründung nötig? nein ja — „besondere Situation\" (außer bei Direktwerbung) Wirkung Rechtsgrundlage entfällt sofort Verantwortlicher kann zwingende Gründe nachweisen Typische Fallen zu Kapitel 6 Aussage ✓/✗ Art. 13 gilt, wenn die Daten bei der betroffenen Person erhoben werden. ✓ Art. 14 gilt bei Direkterhebung. ✗ — bei Erhebung woanders Das Recht auf Löschung gilt uneingeschränkt. ✗ — gesetzliche Aufbewahrungspflichten gehen vor Das Recht auf Datenübertragbarkeit gilt für jede Verarbeitung. ✗ — nur bei Einwilligung/Vertrag und automatisiert Die Auskunft nach Art. 15 umfasst auch die Speicherdauer. ✓ Gegen Direktwerbung kann man ohne Begründung widersprechen. ✓ Das Widerspruchsrecht richtet sich gegen eine erteilte Einwilligung. ✗ — das wäre der Widerruf","words":916,"mins":5},{"id":"d-7-datensicherheit--toms","subject":"ds","num":"7","title":"7. Datensicherheit & TOMs","short":"Datensicherheit & TOMs","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\n<strong>Wie werden Daten technisch und organisatorisch geschützt?<\/strong><\/p>\n<p>Hier kommen die drei ähnlich klingenden Wörter, die man garantiert abfragt: <strong>Zutritt, Zugang, Zugriff<\/strong>. Und die wichtigste Unterscheidung des ganzen Datenschutzteils: pseudonymisiert gegen anonymisiert.<\/p>\n<\/blockquote>\n<h3 id=\"d-71-die-drei-schutzziele-der-it-sicherheit\">7.1 Die drei Schutzziele der IT-Sicherheit<\/h3>\n<p><strong>Folie 20 (Original):<\/strong><\/p>\n<blockquote>\n<p>„➢ <strong>Schutz vor unbeabsichtigten Störungen (engl.: safety)<\/strong> — Betriebssicherheit (safety), Zuverlässigkeit (reliability)\n➢ <strong>Schutz vor beabsichtigten Störungen (engl.: security)<\/strong> — Vertraulichkeit (confidentiality), Integrität (integrity), Verfügbarkeit (availability)\"<\/p>\n<\/blockquote>\n<p><strong>Folie 21 (Original) — die Definitionen, nun auch in Art. 32 DSGVO:<\/strong><\/p>\n<blockquote>\n<p>„➢ <strong>Vertraulichkeit<\/strong>: Ein Datum [eine Information] ist <strong>nur für einen bestimmten Empfänger(kreis) bestimmt<\/strong>. Eine unbefugte Kenntnisnahme ist unerwünscht bzw. ist wirksam zu verhindern.\n➢ <strong>Integrität<\/strong>: Ein Datum [eine Information] ist <strong>vollständig und unverändert<\/strong>. Eine Veränderung … kann absichtlich oder unbeabsichtigt erfolgen.\n➢ <strong>Verfügbarkeit<\/strong>: Ein Datum [eine Information] <strong>steht dem berechtigten Empfänger bei Bedarf zur Verfügung<\/strong>.\"<\/p>\n<\/blockquote>\n<p><strong>Die CIA-Triade<\/strong> (Confidentiality, Integrity, Availability). Merk dir die deutschen Definitionen wörtlich — sie eignen sich perfekt für T/F-Fragen, weil man leicht zwei davon vertauschen kann.<\/p>\n<blockquote>\n<p>⚠️ <strong>Falle:<\/strong> <strong>safety ≠ security.<\/strong> <em>Safety<\/em> = Schutz vor <strong>unbeabsichtigten<\/strong> Störungen (Ausfall, Fehler). <em>Security<\/em> = Schutz vor <strong>beabsichtigten<\/strong> Störungen (Angriff). Beide heißen auf Deutsch „Sicherheit\" — genau deshalb wird das gern abgefragt.<\/p>\n<\/blockquote>\n<h3 id=\"d-72-art-32-sicherheit-der-verarbeitung\">7.2 Art. 32 — Sicherheit der Verarbeitung<\/h3>\n<p><strong>Folie 43 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Artikel 32 DS-GVO: Sicherheit der Verarbeitung<\/strong>\n➢ <strong>Pseudonymisierung und Verschlüsselung<\/strong> personenbezogener Daten\n➢ Fähigkeit, die <strong>Vertraulichkeit, Integrität, Verfügbarkeit und Belastbarkeit<\/strong> der Systeme und Dienste … <strong>auf Dauer sicherzustellen<\/strong>\n➢ Fähigkeit, die Verfügbarkeit der pbD und den Zugang zu ihnen <strong>bei einem physischen oder technischen Zwischenfall rasch wiederherzustellen<\/strong>\n➢ <strong>Verfahren zur regelmäßigen Überprüfung, Bewertung und Evaluierung der Wirksamkeit<\/strong> der technischen und organisatorischen Maßnahmen\"<\/p>\n<\/blockquote>\n<p><strong>Vier Punkte: Pseudonymisierung/Verschlüsselung · CIA + Belastbarkeit · Wiederherstellbarkeit · regelmäßige Überprüfung.<\/strong><\/p>\n<blockquote>\n<p>⚠️ Art. 32 nennt <strong>vier<\/strong> Eigenschaften, nicht drei: Vertraulichkeit, Integrität, Verfügbarkeit <strong>und Belastbarkeit<\/strong> (Resilienz).<\/p>\n<\/blockquote>\n<p><strong>Folie 42 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Integrität und Vertraulichkeit<\/strong> — Eine Verarbeitung darf nur in einer Weise erfolgen, die eine <strong>angemessene Sicherheit<\/strong> der personenbezogenen Daten gewährleistet durch <strong>geeignete technische und organisatorische Maßnahmen<\/strong>.\"<\/p>\n<\/blockquote>\n<h3 id=\"d-73-toms-zutritt-zugang-zugriff\">7.3 TOMs: Zutritt – Zugang – Zugriff ★★★<\/h3>\n<p><strong>Folie 45 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>TOMs / Technisch Organisatorische Maßnahmen: Zutritts-, Zugangs-, Zugriffs-Kontrolle — eine Alliteration für die Datensicherheit!<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Das ist eine der wahrscheinlichsten T/F-Fragen überhaupt<\/strong>, weil die drei Wörter fast gleich klingen und leicht vertauschbar sind. Lern die Reihenfolge:<\/p>\n<pre><code>ZUTRITT   →  physisch, ins GEBÄUDE / in den Raum         &quot;Wer kommt rein?&quot;\nZUGANG    →  ins SYSTEM, Anmeldung, Authentifizierung    &quot;Wer darf sich einloggen?&quot;\nZUGRIFF   →  auf DATEN, Berechtigungen innerhalb         &quot;Wer darf was sehen/ändern?&quot;\n<\/code><\/pre>\n<p><strong>Merkhilfe:<\/strong> Von außen nach innen — erst durch die <strong>Tür<\/strong> (Zutritt), dann durch das <strong>Login<\/strong> (Zugang), dann an die <strong>Datei<\/strong> (Zugriff).<\/p>\n<p><strong>Ein Bild für alle drei — die Arztpraxis:<\/strong><\/p>\n<ul>\n<li><strong>Zutritt<\/strong>: Die Eingangstür der Praxis. Wer kommt überhaupt ins Gebäude?<\/li>\n<li><strong>Zugang<\/strong>: Der Computer am Empfang. Wer darf sich daran anmelden?<\/li>\n<li><strong>Zugriff<\/strong>: Die Patientenakten im System. Die Ärztin sieht alles, die Aushilfe an der Anmeldung nur den Terminkalender.<\/li>\n<\/ul>\n<p>Drei getrennte Schlösser hintereinander. Jemand kann durch die Tür kommen (Zutritt) und trotzdem keinen Rechner benutzen dürfen (kein Zugang). Und jemand kann sich anmelden dürfen (Zugang) und trotzdem die Akten nicht sehen (kein Zugriff).<\/p>\n<p><strong>Die Maßnahmen des Dozenten (Folien 46–48, Original):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><strong>Zutritts-Kontrolle<\/strong> (Folie 46)<\/th>\n<th><strong>Zugangs-Kontrolle<\/strong> (Folie 47)<\/th>\n<th><strong>Zugriffs-Kontrolle<\/strong> (Folie 48)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Schlüsselkarten<\/td>\n<td>Passwortschutz<\/td>\n<td>Rollenbasierte Zugriffskontrolle (RBAC)<\/td>\n<\/tr>\n<tr>\n<td>Biometrische Scanner<\/td>\n<td>Zwei-Faktor-Authentifizierung (2FA)<\/td>\n<td>Access Control Lists (ACLs)<\/td>\n<\/tr>\n<tr>\n<td>Überwachungskameras<\/td>\n<td>Virtual Private Network (VPN)<\/td>\n<td>Principle of Least Privilege<\/td>\n<\/tr>\n<tr>\n<td>Sicherheitsdienst<\/td>\n<td>Benutzerkonten<\/td>\n<td>Audit Logs<\/td>\n<\/tr>\n<tr>\n<td>Drehkreuze<\/td>\n<td>Single Sign-On (SSO)<\/td>\n<td>Gruppenrichtlinien<\/td>\n<\/tr>\n<tr>\n<td>Sicherheitszonen<\/td>\n<td>Temporäre Zugangscodes<\/td>\n<td>Tokenisierung<\/td>\n<\/tr>\n<tr>\n<td>Alarmanlagen<\/td>\n<td>IP-Adressfilterung<\/td>\n<td>Zeitbasierte Zugriffskontrolle<\/td>\n<\/tr>\n<tr>\n<td>Besuchermanagement<\/td>\n<td>Login-Monitoring<\/td>\n<td>IP-basierte Zugriffskontrolle<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>⚠️ <strong>Typische Falle:<\/strong> „2FA ist eine Maßnahme der Zutrittskontrolle\" → <strong>falsch<\/strong>, das ist <strong>Zugang<\/strong>.\n„Ein biometrischer Scanner an der Eingangstür gehört zur Zutrittskontrolle\" → <strong>richtig<\/strong>.\n„RBAC gehört zur Zugangskontrolle\" → <strong>falsch<\/strong>, das ist <strong>Zugriff<\/strong>.<\/p>\n<\/blockquote>\n<h3 id=\"d-74-pseudonymisierung-vs-anonymisierung\">7.4 Pseudonymisierung vs. Anonymisierung ★★★<\/h3>\n<p><strong>Folie 44<\/strong> stellt beide gegenüber. Der Unterschied ist <strong>die wichtigste Einzelunterscheidung des ganzen Datenschutzteils<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Pseudonymisierung<\/strong><\/th>\n<th><strong>Anonymisierung<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rückschluss möglich?<\/td>\n<td><strong>ja<\/strong>, mit Zusatzwissen (Schlüsseltabelle)<\/td>\n<td><strong>nein<\/strong>, unumkehrbar<\/td>\n<\/tr>\n<tr>\n<td>Noch personenbezogen?<\/td>\n<td><strong>JA<\/strong> — DSGVO gilt weiter!<\/td>\n<td><strong>NEIN<\/strong> — DSGVO gilt nicht mehr<\/td>\n<\/tr>\n<tr>\n<td>Ist es eine TOM nach Art. 32?<\/td>\n<td><strong>ja<\/strong>, ausdrücklich genannt<\/td>\n<td>(fällt aus dem Anwendungsbereich)<\/td>\n<\/tr>\n<tr>\n<td>Beispiel<\/td>\n<td>Kundennummer statt Name, Zuordnung liegt im Safe<\/td>\n<td>Aggregierte Statistik ohne Rückrechnungsmöglichkeit<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>⚠️ <strong>Die Falle schlechthin:<\/strong> <strong>Pseudonymisierte Daten sind weiterhin personenbezogene Daten.<\/strong> Wer pseudonymisiert, ist <em>nicht<\/em> aus der DSGVO raus — er hat nur eine Sicherheitsmaßnahme umgesetzt. Nur die <strong>Anonymisierung<\/strong> führt aus dem Anwendungsbereich heraus (siehe Folie 24: „anonymisierte Daten\" stehen unter „KEINE pbD\").<\/p>\n<\/blockquote>\n<p><strong>Das Bild, an dem du es dir merkst:<\/strong><\/p>\n<p><strong>Pseudonymisierung<\/strong> ist wie ein Klassenbuch, in dem statt Namen nur Nummern stehen — und die Liste, welche Nummer zu wem gehört, <strong>liegt im Schrank der Lehrerin<\/strong>. Wer den Schrank aufmacht, weiß wieder alles. Deshalb sind es <strong>weiterhin personenbezogene Daten<\/strong>, und die DSGVO gilt weiter.<\/p>\n<p><strong>Anonymisierung<\/strong> ist, wenn diese Liste <strong>verbrannt<\/strong> wurde. Jetzt kommt niemand mehr zurück — auch die Lehrerin nicht. Erst dann ist man aus der DSGVO raus.<\/p>\n<blockquote>\n<p>Das ist die wichtigste Unterscheidung im ganzen Datenschutzteil. Wer „pseudonymisiert\" hört und denkt „geschafft, DSGVO erledigt\", hat die Frage falsch beantwortet.<\/p>\n<\/blockquote>\n<h3 id=\"d-typische-fallen-zu-kapitel-7\">Typische Fallen zu Kapitel 7<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aussage<\/th>\n<th>✓/✗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pseudonymisierte Daten fallen nicht mehr unter die DSGVO.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Anonymisierte Daten fallen nicht mehr unter die DSGVO.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Zugangskontrolle regelt, wer das Gebäude betreten darf.<\/td>\n<td><strong>✗<\/strong> — das ist <strong>Zutritt<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Zugriffskontrolle regelt Berechtigungen auf Datenebene.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Art. 32 nennt Vertraulichkeit, Integrität und Verfügbarkeit.<\/td>\n<td><strong>✓<\/strong> — und zusätzlich <strong>Belastbarkeit<\/strong><\/td>\n<\/tr>\n<tr>\n<td>„Safety\" bezeichnet den Schutz vor beabsichtigten Angriffen.<\/td>\n<td><strong>✗<\/strong> — das ist <strong>security<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Verschlüsselung ist eine in Art. 32 genannte Maßnahme.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Die Wirksamkeit der TOMs muss regelmäßig überprüft werden.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Wie werden Daten technisch und organisatorisch geschützt? Hier kommen die drei ähnlich klingenden Wörter, die man garantiert abfragt: Zutritt, Zugang, Zugriff . Und die wichtigste Unterscheidung des ganzen Datenschutzteils: pseudonymisiert gegen anonymisiert. 7.1 Die drei Schutzziele der IT-Sicherheit Folie 20 (Original): „➢ Schutz vor unbeabsichtigten Störungen (engl.: safety) — Betriebssicherheit (safety), Zuverlässigkeit (reliability) ➢ Schutz vor beabsichtigten Störungen (engl.: security) — Vertraulichkeit (confidentiality), Integrität (integrity), Verfügbarkeit (availability)\" Folie 21 (Original) — die Definitionen, nun auch in Art. 32 DSGVO: „➢ Vertraulichkeit : Ein Datum [eine Information] ist nur für einen bestimmten Empfänger(kreis) bestimmt . Eine unbefugte Kenntnisnahme ist unerwünscht bzw. ist wirksam zu verhindern. ➢ Integrität : Ein Datum [eine Information] ist vollständig und unverändert . Eine Veränderung … kann absichtlich oder unbeabsichtigt erfolgen. ➢ Verfügbarkeit : Ein Datum [eine Information] steht dem berechtigten Empfänger bei Bedarf zur Verfügung .\" Die CIA-Triade (Confidentiality, Integrity, Availability). Merk dir die deutschen Definitionen wörtlich — sie eignen sich perfekt für T/F-Fragen, weil man leicht zwei davon vertauschen kann. ⚠️ Falle: safety ≠ security. Safety = Schutz vor unbeabsichtigten Störungen (Ausfall, Fehler). Security = Schutz vor beabsichtigten Störungen (Angriff). Beide heißen auf Deutsch „Sicherheit\" — genau deshalb wird das gern abgefragt. 7.2 Art. 32 — Sicherheit der Verarbeitung Folie 43 (Original): „ Artikel 32 DS-GVO: Sicherheit der Verarbeitung ➢ Pseudonymisierung und Verschlüsselung personenbezogener Daten ➢ Fähigkeit, die Vertraulichkeit, Integrität, Verfügbarkeit und Belastbarkeit der Systeme und Dienste … auf Dauer sicherzustellen ➢ Fähigkeit, die Verfügbarkeit der pbD und den Zugang zu ihnen bei einem physischen oder technischen Zwischenfall rasch wiederherzustellen ➢ Verfahren zur regelmäßigen Überprüfung, Bewertung und Evaluierung der Wirksamkeit der technischen und organisatorischen Maßnahmen\" Vier Punkte: Pseudonymisierung/Verschlüsselung · CIA + Belastbarkeit · Wiederherstellbarkeit · regelmäßige Überprüfung. ⚠️ Art. 32 nennt vier Eigenschaften, nicht drei: Vertraulichkeit, Integrität, Verfügbarkeit und Belastbarkeit (Resilienz). Folie 42 (Original): „ Integrität und Vertraulichkeit — Eine Verarbeitung darf nur in einer Weise erfolgen, die eine angemessene Sicherheit der personenbezogenen Daten gewährleistet durch geeignete technische und organisatorische Maßnahmen .\" 7.3 TOMs: Zutritt – Zugang – Zugriff ★★★ Folie 45 (Original): „ TOMs / Technisch Organisatorische Maßnahmen: Zutritts-, Zugangs-, Zugriffs-Kontrolle — eine Alliteration für die Datensicherheit! \" Das ist eine der wahrscheinlichsten T/F-Fragen überhaupt , weil die drei Wörter fast gleich klingen und leicht vertauschbar sind. Lern die Reihenfolge: ZUTRITT → physisch, ins GEBÄUDE / in den Raum \"Wer kommt rein?\" ZUGANG → ins SYSTEM, Anmeldung, Authentifizierung \"Wer darf sich einloggen?\" ZUGRIFF → auf DATEN, Berechtigungen innerhalb \"Wer darf was sehen/ändern?\" Merkhilfe: Von außen nach innen — erst durch die Tür (Zutritt), dann durch das Login (Zugang), dann an die Datei (Zugriff). Ein Bild für alle drei — die Arztpraxis: Zutritt : Die Eingangstür der Praxis. Wer kommt überhaupt ins Gebäude? Zugang : Der Computer am Empfang. Wer darf sich daran anmelden? Zugriff : Die Patientenakten im System. Die Ärztin sieht alles, die Aushilfe an der Anmeldung nur den Terminkalender. Drei getrennte Schlösser hintereinander. Jemand kann durch die Tür kommen (Zutritt) und trotzdem keinen Rechner benutzen dürfen (kein Zugang). Und jemand kann sich anmelden dürfen (Zugang) und trotzdem die Akten nicht sehen (kein Zugriff). Die Maßnahmen des Dozenten (Folien 46–48, Original): Zutritts-Kontrolle (Folie 46) Zugangs-Kontrolle (Folie 47) Zugriffs-Kontrolle (Folie 48) Schlüsselkarten Passwortschutz Rollenbasierte Zugriffskontrolle (RBAC) Biometrische Scanner Zwei-Faktor-Authentifizierung (2FA) Access Control Lists (ACLs) Überwachungskameras Virtual Private Network (VPN) Principle of Least Privilege Sicherheitsdienst Benutzerkonten Audit Logs Drehkreuze Single Sign-On (SSO) Gruppenrichtlinien Sicherheitszonen Temporäre Zugangscodes Tokenisierung Alarmanlagen IP-Adressfilterung Zeitbasierte Zugriffskontrolle Besuchermanagement Login-Monitoring IP-basierte Zugriffskontrolle ⚠️ Typische Falle: „2FA ist eine Maßnahme der Zutrittskontrolle\" → falsch , das ist Zugang . „Ein biometrischer Scanner an der Eingangstür gehört zur Zutrittskontrolle\" → richtig . „RBAC gehört zur Zugangskontrolle\" → falsch , das ist Zugriff . 7.4 Pseudonymisierung vs. Anonymisierung ★★★ Folie 44 stellt beide gegenüber. Der Unterschied ist die wichtigste Einzelunterscheidung des ganzen Datenschutzteils : Pseudonymisierung Anonymisierung Rückschluss möglich? ja , mit Zusatzwissen (Schlüsseltabelle) nein , unumkehrbar Noch personenbezogen? JA — DSGVO gilt weiter! NEIN — DSGVO gilt nicht mehr Ist es eine TOM nach Art. 32? ja , ausdrücklich genannt (fällt aus dem Anwendungsbereich) Beispiel Kundennummer statt Name, Zuordnung liegt im Safe Aggregierte Statistik ohne Rückrechnungsmöglichkeit ⚠️ Die Falle schlechthin: Pseudonymisierte Daten sind weiterhin personenbezogene Daten. Wer pseudonymisiert, ist nicht aus der DSGVO raus — er hat nur eine Sicherheitsmaßnahme umgesetzt. Nur die Anonymisierung führt aus dem Anwendungsbereich heraus (siehe Folie 24: „anonymisierte Daten\" stehen unter „KEINE pbD\"). Das Bild, an dem du es dir merkst: Pseudonymisierung ist wie ein Klassenbuch, in dem statt Namen nur Nummern stehen — und die Liste, welche Nummer zu wem gehört, liegt im Schrank der Lehrerin . Wer den Schrank aufmacht, weiß wieder alles. Deshalb sind es weiterhin personenbezogene Daten , und die DSGVO gilt weiter. Anonymisierung ist, wenn diese Liste verbrannt wurde. Jetzt kommt niemand mehr zurück — auch die Lehrerin nicht. Erst dann ist man aus der DSGVO raus. Das ist die wichtigste Unterscheidung im ganzen Datenschutzteil. Wer „pseudonymisiert\" hört und denkt „geschafft, DSGVO erledigt\", hat die Frage falsch beantwortet. Typische Fallen zu Kapitel 7 Aussage ✓/✗ Pseudonymisierte Daten fallen nicht mehr unter die DSGVO. ✗ Anonymisierte Daten fallen nicht mehr unter die DSGVO. ✓ Zugangskontrolle regelt, wer das Gebäude betreten darf. ✗ — das ist Zutritt Zugriffskontrolle regelt Berechtigungen auf Datenebene. ✓ Art. 32 nennt Vertraulichkeit, Integrität und Verfügbarkeit. ✓ — und zusätzlich Belastbarkeit „Safety\" bezeichnet den Schutz vor beabsichtigten Angriffen. ✗ — das ist security Verschlüsselung ist eine in Art. 32 genannte Maßnahme. ✓ Die Wirksamkeit der TOMs muss regelmäßig überprüft werden. ✓","words":916,"mins":5},{"id":"d-8-datenschutzmanagement","subject":"ds","num":"8","title":"8. Datenschutzmanagement","short":"Datenschutzmanagement","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\n<strong>Wie organisiert eine Firma das Ganze?<\/strong><\/p>\n<p>Im Kern über eine einzige Liste: das Verzeichnis der Verarbeitungstätigkeiten. Wer die nicht führt, kann gar nicht beweisen, dass er sich an die Regeln hält — und zahlt schon deswegen.<\/p>\n<\/blockquote>\n<h3 id=\"d-81-das-verzeichnis-der-verarbeitungstatigkeiten-art-30\">8.1 Das Verzeichnis der Verarbeitungstätigkeiten — Art. 30<\/h3>\n<p><strong>Folie 57 (Original):<\/strong><\/p>\n<blockquote>\n<p>„Ein <strong>„Hauptsteuerungsinstrument\"<\/strong> für das Datenschutzmanagement wird das <strong>Verzeichnis der Verarbeitungstätigkeiten gem. Artikel 30 DS-GVO<\/strong> i.V.m. § 70 BDSG (neu) sein.\nDort kann die Einhaltung der Datenschutzgrundsätze <strong>ähnlich einer Checkliste<\/strong> abgehandelt werden.\nAußerdem sind an dieser Stelle die <strong>Risikobewertung und Maßnahmen zur Datensicherheit<\/strong> festzuhalten.\nEbenso ist dort die <strong>Vereinbarung zur Auftragsdatenverarbeitung<\/strong> (falls erforderlich) und die <strong>Datenschutzfolgenabschätzung<\/strong> (falls erforderlich) aufzunehmen.\"<\/p>\n<\/blockquote>\n<p><strong>Was das ist:<\/strong> Eine Liste aller Verarbeitungsvorgänge im Unternehmen — welche Daten, zu welchem Zweck, wie lange, wer bekommt sie, wie sind sie geschützt.<\/p>\n<p><strong>Einfach gesagt: Das Verzeichnis ist die Inventarliste.<\/strong> Welche Daten haben wir? Wozu? Wie lange? Wer bekommt sie? Wie sind sie geschützt?<\/p>\n<p>Ohne diese Liste kann eine Firma gar nicht beweisen, dass sie sich an die Regeln hält — und genau das muss sie ja (Rechenschaftspflicht, Art. 5 II). Deshalb nennt der Dozent es das <strong>Hauptsteuerungsinstrument<\/strong>: Wer das Verzeichnis ordentlich führt, hat den Datenschutz im Griff. Wer es nicht hat, kassiert schon deswegen ein Bußgeld.<\/p>\n<
