+)\n• Annahme durch A: durch bloße Entgegennahme (-), weil keine entsprechende WE. Teilannahme (verändertes Angebot nach § 150 bzgl. Erdbeeren? Ja!, aber <strong>Bindung vernichtet durch Verbraucherschutz § 241a?<\/strong> Unbestellte Lieferung (+), durch Unternehmer § 14 (+), an Verbraucher § 13 (+)\n<strong>Dem entsprechend nach § 241a kein Anspruch gegen den Verbraucher!<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Der Doppelschlag ist die Pointe: <strong>Selbst wenn du durch Verbrauchen annimmst, killt § 241a den Anspruch trotzdem.<\/strong><\/p>\n<p><strong>Und für dich privat wertvoll:<\/strong> Wenn dir jemand unbestellt Ware schickt, musst du <strong>weder zahlen noch zurückschicken noch dich melden<\/strong>. Du darfst sie sogar behalten und benutzen.<\/p>\n<h3 id=\"f-fall-05-d-die-zerstorte-ps5\">Fall 05 d) — Die zerstörte PS5 ★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Elektronikhändler Jimmy verkauft Denny seine <strong>letzte<\/strong> PS5 für 500 Euro. Denny zahlt sofort per Kreditkarte, das Gerät soll ihm zugeschickt werden. Kurz vor dem Versand fällt bei einem Gewitter ein Balken der Lagerhalle auf die Konsole — Totalschaden. Jimmy sagt, er sei nach <strong>§ 275<\/strong> von der Leistungspflicht frei, will den Kaufpreis aber behalten.<\/p>\n<p><strong>Was gefragt ist.<\/strong> Hat Jimmy recht? Und wäre es anders, wenn Denny die PS5 abholen wollte?<\/p>\n<p><strong>Schritt für Schritt.<\/strong><\/p>\n<p>Jimmys Argument klingt erstmal plausibel: Die Konsole ist zerstört, er kann nicht liefern, also ist die Leistung unmöglich (§ 275). <strong>Aber der Fehler steckt in der Frage, was er eigentlich schuldet.<\/strong><\/p>\n<ol>\n<li><strong>Was war geschuldet — dieses eine Gerät oder irgendeine PS5?<\/strong>\n   Denny hat einfach „eine PS5\" gekauft. Dass es Jimmys letztes Exemplar war, konnte er nicht wissen, und es war ihm auch egal. Aus <strong>Dennys Sicht<\/strong> (objektiver Empfängerhorizont, § 133) ist das eine <strong>Gattungsschuld<\/strong> (§ 243): geschuldet ist eine Sache „mittlerer Art und Güte\".<\/li>\n<li><strong>Wann wird aus „irgendeine\" ein „diese hier\"?<\/strong>\n   Erst mit der <strong>Konkretisierung<\/strong> (§ 243 II) — wenn der Verkäufer „das seinerseits Erforderliche getan\" hat. Beim Versendungskauf heißt das: <strong>verpacken und losschicken<\/strong>.<\/li>\n<li>Jimmy hatte noch nicht verpackt und verschickt. Also war noch nicht konkretisiert.<\/li>\n<li>→ <strong>Keine Unmöglichkeit.<\/strong> Jimmy muss eine andere PS5 besorgen — die gibt es ja bei anderen Lieferanten.<\/li>\n<li>Zur Gegenprobe: <strong>§ 447 I<\/strong> sagt beim Versendungskauf, dass die Gefahr erst mit <strong>Übergabe an den Frachtführer<\/strong> übergeht. Das bestätigt das Ergebnis.<\/li>\n<\/ol>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Vertrag zustande gekommen, jedoch aus Sicht von Denny (Auslegung vom obj. Empfängerhorizont, § 133) jedoch nur als <strong>Gattungsschuld, § 243<\/strong>: Verpflichtung zur Lieferung einer Sache „mittlerer Art und Güte\". Denny konnte nicht wissen (und es war ihm auch egal), dass Jimmy nur noch eine PS5 am Lager hatte. <strong>Erst wenn Jimmy das seinerseits Erforderliche getan hat, hätte sich das Schuldverhältnis auf diese eine Sache konkretisiert, § 243 II.<\/strong> Das seinerseits Erforderliche war jedoch das Verpacken und Versenden, so dass <strong>keine Unmöglichkeit nach § 275 eintrat<\/strong> […] wonach beim Versendungskauf die Gefahr (des zufälligen Untergangs) nach <strong>§ 447 I<\/strong> erst mit Übergabe an den Frachtführer übergeht.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Der Kern in einem Satz: <strong>Bei einer Gattungsschuld gibt es keine Unmöglichkeit, solange es die Sache noch irgendwo auf der Welt gibt.<\/strong><\/p>\n<p>Und die Abwandlung (Denny will abholen): Dann müsste man prüfen, ob durch das Bereitstellen zur Abholung schon konkretisiert wurde. Beim Abholkauf hat der Verkäufer das Seinige getan, wenn er die Ware ausgesondert und bereitgestellt hat.<\/p>\n<h3 id=\"f-fall-05-e-zwei-agb-zwei-gerichtsstande\">Fall 05 e) — Zwei AGB, zwei Gerichtsstände ★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Jimmy bestellt bei der Großhändlerin Nancy ein Gerät. Auf <strong>seinem<\/strong> Bestellformular steht: „Die umseitigen AGB sind Vertragsbestandteil\", darin Ziff. 9: <strong>Gerichtsstand München<\/strong> (sein Sitz). Nancy liefert; dem Paket liegt ein Lieferschein bei mit dem Satz: <strong>Gerichtsstand Frankfurt<\/strong> (ihr Sitz).<\/p>\n<p><strong>Was gefragt ist.<\/strong> Ist ein Kaufvertrag zustande gekommen? Und wenn ja, welcher Gerichtsstand gilt?<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\n1. Beide wollten den Vertrag. Über Ware und Preis sind sie sich einig. Nur bei einem Nebenpunkt reden sie aneinander vorbei — und <strong>beide merken es nicht<\/strong>.\n2. Das nennt man <strong>versteckten Dissens<\/strong>, <strong>§ 155<\/strong>.\n3. § 155 sagt: Der Vertrag gilt „im Übrigen\", <strong>wenn<\/strong> anzunehmen ist, dass er auch ohne den strittigen Punkt geschlossen worden wäre.\n4. Auslegung (§§ 133, 157): Hätten die beiden das Geschäft am Gerichtsstand scheitern lassen? Sicher nicht — es ging um ein Gerät, nicht um Prozesstaktik.\n5. → <strong>Der Vertrag gilt.<\/strong> Nur die beiden Gerichtsstandsklauseln fallen weg.\n6. <strong>Und was gilt dann?<\/strong> Das <strong>Gesetz<\/strong>: Klage am Sitz des Beklagten.<\/p>\n<p><strong>Die Lösung des Dozenten<\/strong> (aus dem Bild):<\/p>\n<blockquote>\n<p>„Angebot durch Bestellformular einschl. AGB. Annahme durch Lieferung m. abweichenden AGB ⇒ <strong>versteckter Dissens (bzgl. Gerichtsstands) § 155<\/strong>. Alles, worüber sie sich geeinigt haben, gilt, wenn die Auslegung §§ 133, 157 ergibt, dass der Vertrag auch ohne den Punkt des Dissenses geschlossen werden sollte. Auslegung ergibt, dass die Parteien den Vertrag nicht an den unterschiedlichen Gerichtsständen scheitern lassen wollten. Dem entsprechend gilt der Vertrag „im übrigen\", § 155. <strong>Nach der Rspr. gilt in einem solchen Fall das Gesetz!<\/strong> ⇒ Klage muss am Sitz des Beklagten eingereicht werden.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Wenn sich zwei AGB widersprechen, <strong>heben sie sich gegenseitig auf<\/strong> und das Gesetz springt ein. Der Vertrag selbst bleibt bestehen.<\/p>\n<p><strong>Merkhilfe für die zwei Dissens-Arten:<\/strong>\n- <strong>Offener<\/strong> Dissens (§ 154): Beide <strong>wissen<\/strong>, dass noch etwas offen ist → im Zweifel <strong>kein<\/strong> Vertrag.\n- <strong>Versteckter<\/strong> Dissens (§ 155): Beide <strong>glauben<\/strong>, einig zu sein → Vertrag gilt im Übrigen.<\/p>","text":"Fall 05 a) — „Ich möchte dein Fahrrad kaufen\" Der Sachverhalt. Anneliese geht zu Denny und sagt: „Ich möchte dein Fahrrad kaufen.\" Schritt für Schritt. Ein Angebot muss so vollständig sein, dass der andere nur noch „Ja\" sagen muss. Dafür braucht es drei Dinge ( essentialia negotii ): Vertragspartner, Gegenstand, Preis . Der Preis fehlt. Denny kann nicht einfach „Ja\" sagen — er wüsste ja nicht, wofür. Die Lösung des Dozenten. „Kein Preis benannt, essentialia negotii nicht definiert ⇒ kein Angebot nach § 145\" Was du mitnimmst. Der Test in einem Satz: Kann der andere einfach „Ja\" sagen — und alles ist klar? Fall 05 b) — Das Fahrrad-Hin-und-Her ★ Der Sachverhalt. Eine Kette von Erklärungen: 1. Denny: „Gern, für 50 Euro ist es deins.\" 2. Anneliese: „Das muss ich mir überlegen.\" — Drei Stunden später ruft sie an: „Ja. Allerdings möchte ich, dass du es nochmal putzt.\" 3. Denny: „Na gut, mach ich. Hol es morgen ab, bring das Geld bar mit.\" 4. Am nächsten Tag hat Anneliese das Geld vergessen: „Kann ich es dir per PayPal schicken?\" — Denny: „Na gut, geht auch.\" Was gefragt ist. Wie beurteilst du diese Verhandlung? Und: Wann ist das Eigentum übergegangen? Schritt für Schritt. Du gehst chronologisch durch und prüfst jede Erklärung einzeln. Schritt 1. Dennys „für 50 Euro ist es deins\" ist ein vollständiges Angebot (§ 145). Schritt 2. Anneliese sagt erst nach drei Stunden zu — und will zusätzlich, dass er putzt. Zwei Probleme auf einmal: - Sie sind sich persönlich begegnet → § 147 I: Ein Angebot unter Anwesenden kann nur sofort angenommen werden. Drei Stunden später ist zu spät. - Und sie verändert das Angebot (Putzen kommt dazu). Beides führt zum selben Ergebnis: § 150 I — eine verspätete oder veränderte Annahme ist keine Annahme , sondern ein neuer Antrag . Dennys ursprüngliches Angebot ist damit tot. Schritt 3. Denny sagt „Na gut, mach ich\" → er nimmt jetzt ihr neues Angebot an. Jetzt ist der Vertrag geschlossen: Fahrrad für 50 Euro, geputzt, Barzahlung. Schritt 4. Die Änderung auf PayPal ist wieder ein neues Angebot — diesmal zur Vertragsänderung . Denny nimmt an. Und das Eigentum? Der Kaufvertrag allein überträgt gar nichts (Abstraktionsprinzip!). Das Eigentum geht erst über mit Einigung und Übergabe (§ 929) — also mit Geldeingang und Mitnahme des Rads. Die Lösung des Dozenten. „Angebot von Denny hätte nur sofort angenommen werden können, § 147, I; verspätete Annahme durch Anneliese (zusätzlich unter Erweiterungen) = neues Angebot, § 150 I ; Denny hat angenommen; Veränderung der Bezahlungsart ist neues Angebot zur Vertragsänderung, wurde angenommen. (Wann) Ist das Eigentum übergegangen? Mit Geldeingang und Mitnahme des Fahrrads \" Was du mitnimmst. Bei so einem Hin und Her: Nummeriere die Erklärungen und geh sie der Reihe nach durch. Jedes „Ja, aber…\" setzt die Rollen zurück — wer vorher angeboten hat, muss jetzt annehmen. Fall 05 c) — Die unbestellte Obstkiste ★ Der Sachverhalt. Obsthändler Denny schickt seiner Nachbarin Anneliese ungefragt eine Kiste Früchte mit Rechnung über 15 Euro . Handschriftlich dabei: „Das könnte ich jede Woche liefern.\" Anneliese will die Kiste zurückbringen, kann den Erdbeeren aber nicht widerstehen und isst sie . Den Rest bringt sie zurück. Denny verlangt die vollen 15 Euro, mindestens aber 5 Euro für die Erdbeeren. Was gefragt ist. Bekommt Denny Geld? Zu Recht? Schritt für Schritt. 1. Anspruchsgrundlage: § 433 II (Kaufpreis). Dafür braucht es einen Kaufvertrag. 2. Angebot? Ja — durch das Zuschicken. Gegenstand, Preis und Vertragspartner stehen fest. 3. Annahme? Das bloße Entgegennehmen ist keine Annahme — darin liegt keine Willenserklärung. Aber das Aufessen der Erdbeeren ? Das ist schlüssiges Verhalten und könnte eine Teilannahme sein (verändertes Angebot, § 150). 4. Aber jetzt kommt § 241a. Bei einer unbestellten Lieferung durch einen Unternehmer (§ 14) an einen Verbraucher (§ 13) entstehen keine Ansprüche — weder auf Zahlung noch auf Rückgabe. 5. → Denny bekommt gar nichts. Auch nicht die 5 Euro für die Erdbeeren. Die Lösung des Dozenten (aus dem Bild): „Anspruch des Denny auf Zahlung von 15 EUR aus § 433 BGB. Voraussetzung: geschlossener Kaufvertrag, § 145: Angebot und Annahme • Angebot durch Übersendung (Gegenstand, Vertragspartner, Preis +) • Annahme durch A: durch bloße Entgegennahme (-), weil keine entsprechende WE. Teilannahme (verändertes Angebot nach § 150 bzgl. Erdbeeren? Ja!, aber Bindung vernichtet durch Verbraucherschutz § 241a? Unbestellte Lieferung (+), durch Unternehmer § 14 (+), an Verbraucher § 13 (+) Dem entsprechend nach § 241a kein Anspruch gegen den Verbraucher! \" Was du mitnimmst. Der Doppelschlag ist die Pointe: Selbst wenn du durch Verbrauchen annimmst, killt § 241a den Anspruch trotzdem. Und für dich privat wertvoll: Wenn dir jemand unbestellt Ware schickt, musst du weder zahlen noch zurückschicken noch dich melden . Du darfst sie sogar behalten und benutzen. Fall 05 d) — Die zerstörte PS5 ★ Der Sachverhalt. Elektronikhändler Jimmy verkauft Denny seine letzte PS5 für 500 Euro. Denny zahlt sofort per Kreditkarte, das Gerät soll ihm zugeschickt werden. Kurz vor dem Versand fällt bei einem Gewitter ein Balken der Lagerhalle auf die Konsole — Totalschaden. Jimmy sagt, er sei nach § 275 von der Leistungspflicht frei, will den Kaufpreis aber behalten. Was gefragt ist. Hat Jimmy recht? Und wäre es anders, wenn Denny die PS5 abholen wollte? Schritt für Schritt. Jimmys Argument klingt erstmal plausibel: Die Konsole ist zerstört, er kann nicht liefern, also ist die Leistung unmöglich (§ 275). Aber der Fehler steckt in der Frage, was er eigentlich schuldet. Was war geschuldet — dieses eine Gerät oder irgendeine PS5? Denny hat einfach „eine PS5\" gekauft. Dass es Jimmys letztes Exemplar war, konnte er nicht wissen, und es war ihm auch egal. Aus Dennys Sicht (objektiver Empfängerhorizont, § 133) ist das eine Gattungsschuld (§ 243): geschuldet ist eine Sache „mittlerer Art und Güte\". Wann wird aus „irgendeine\" ein „diese hier\"? Erst mit der Konkretisierung (§ 243 II) — wenn der Verkäufer „das seinerseits Erforderliche getan\" hat. Beim Versendungskauf heißt das: verpacken und losschicken . Jimmy hatte noch nicht verpackt und verschickt. Also war noch nicht konkretisiert. → Keine Unmöglichkeit. Jimmy muss eine andere PS5 besorgen — die gibt es ja bei anderen Lieferanten. Zur Gegenprobe: § 447 I sagt beim Versendungskauf, dass die Gefahr erst mit Übergabe an den Frachtführer übergeht. Das bestätigt das Ergebnis. Die Lösung des Dozenten. „Vertrag zustande gekommen, jedoch aus Sicht von Denny (Auslegung vom obj. Empfängerhorizont, § 133) jedoch nur als Gattungsschuld, § 243 : Verpflichtung zur Lieferung einer Sache „mittlerer Art und Güte\". Denny konnte nicht wissen (und es war ihm auch egal), dass Jimmy nur noch eine PS5 am Lager hatte. Erst wenn Jimmy das seinerseits Erforderliche getan hat, hätte sich das Schuldverhältnis auf diese eine Sache konkretisiert, § 243 II. Das seinerseits Erforderliche war jedoch das Verpacken und Versenden, so dass keine Unmöglichkeit nach § 275 eintrat […] wonach beim Versendungskauf die Gefahr (des zufälligen Untergangs) nach § 447 I erst mit Übergabe an den Frachtführer übergeht.\" Was du mitnimmst. Der Kern in einem Satz: Bei einer Gattungsschuld gibt es keine Unmöglichkeit, solange es die Sache noch irgendwo auf der Welt gibt. Und die Abwandlung (Denny will abholen): Dann müsste man prüfen, ob durch das Bereitstellen zur Abholung schon konkretisiert wurde. Beim Abholkauf hat der Verkäufer das Seinige getan, wenn er die Ware ausgesondert und bereitgestellt hat. Fall 05 e) — Zwei AGB, zwei Gerichtsstände ★ Der Sachverhalt. Jimmy bestellt bei der Großhändlerin Nancy ein Gerät. Auf seinem Bestellformular steht: „Die umseitigen AGB sind Vertragsbestandteil\", darin Ziff. 9: Gerichtsstand München (sein Sitz). Nancy liefert; dem Paket liegt ein Lieferschein bei mit dem Satz: Gerichtsstand Frankfurt (ihr Sitz). Was gefragt ist. Ist ein Kaufvertrag zustande gekommen? Und wenn ja, welcher Gerichtsstand gilt? Schritt für Schritt. 1. Beide wollten den Vertrag. Über Ware und Preis sind sie sich einig. Nur bei einem Nebenpunkt reden sie aneinander vorbei — und beide merken es nicht . 2. Das nennt man versteckten Dissens , § 155 . 3. § 155 sagt: Der Vertrag gilt „im Übrigen\", wenn anzunehmen ist, dass er auch ohne den strittigen Punkt geschlossen worden wäre. 4. Auslegung (§§ 133, 157): Hätten die beiden das Geschäft am Gerichtsstand scheitern lassen? Sicher nicht — es ging um ein Gerät, nicht um Prozesstaktik. 5. → Der Vertrag gilt. Nur die beiden Gerichtsstandsklauseln fallen weg. 6. Und was gilt dann? Das Gesetz : Klage am Sitz des Beklagten. Die Lösung des Dozenten (aus dem Bild): „Angebot durch Bestellformular einschl. AGB. Annahme durch Lieferung m. abweichenden AGB ⇒ versteckter Dissens (bzgl. Gerichtsstands) § 155 . Alles, worüber sie sich geeinigt haben, gilt, wenn die Auslegung §§ 133, 157 ergibt, dass der Vertrag auch ohne den Punkt des Dissenses geschlossen werden sollte. Auslegung ergibt, dass die Parteien den Vertrag nicht an den unterschiedlichen Gerichtsständen scheitern lassen wollten. Dem entsprechend gilt der Vertrag „im übrigen\", § 155. Nach der Rspr. gilt in einem solchen Fall das Gesetz! ⇒ Klage muss am Sitz des Beklagten eingereicht werden.\" Was du mitnimmst. Wenn sich zwei AGB widersprechen, heben sie sich gegenseitig auf und das Gesetz springt ein. Der Vertrag selbst bleibt bestehen. Merkhilfe für die zwei Dissens-Arten: - Offener Dissens (§ 154): Beide wissen , dass noch etwas offen ist → im Zweifel kein Vertrag. - Versteckter Dissens (§ 155): Beide glauben , einig zu sein → Vertrag gilt im Übrigen.","words":1538,"mins":8},{"id":"f-6-fälle-zum-vertretungsrecht","subject":"faelle","num":"6","title":"6. Fälle zum Vertretungsrecht","short":"Fälle zum Vertretungsrecht","html":"<p><strong>Das ist die Sammlung, die deiner Probeklausur am nächsten kommt.<\/strong> Arbeite besonders Fall b) gründlich durch.<\/p>\n<p><strong>Bei jedem dieser Fälle prüfst du dieselben drei Punkte (§ 164):<\/strong>\neigene Willenserklärung? → im fremden Namen? → mit Vertretungsmacht?<\/p>\n<h3 id=\"f-fall-06-a-die-faz-und-die-rundschau\">Fall 06 a) — Die FAZ und die Rundschau<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Jimmy zu Denny: „Wenn du bei Anneliese einkaufst, bring mir bitte eine FAZ mit.\"<\/p>\n<p><em>Variante 1:<\/em> Denny sagt bei Anneliese „Bitte eine FAZ\", zahlt und liefert sie ab.\n<em>Variante 2:<\/em> Denny sagt <strong>versehentlich<\/strong> „Bitte eine Rundschau\". Jimmy will aber die FAZ.<\/p>\n<p><strong>Schritt für Schritt.<\/strong><\/p>\n<p><em>Variante 1.<\/em> Denny durfte nichts aussuchen — Zeitung, Preis und Zweck standen fest. Er ist also <strong>Bote<\/strong>, nicht Vertreter. Der Vertrag kommt zwischen <strong>Jimmy und Anneliese<\/strong> zustande.<\/p>\n<p>Interessant ist die Offenkundigkeit: Denny sagt ja nicht „ich kaufe für Jimmy\". Muss er auch nicht — bei <strong>Bargeschäften des täglichen Lebens<\/strong> ist es der Verkäuferin egal, wer der Vertragspartner ist. Das nennt man <strong>„Geschäft für den, den es angeht\"<\/strong> (§ 164 I S. 2).<\/p>\n<p><em>Variante 2.<\/em> Denny hat sich vertan. Bleibt er Bote? Ja — er <strong>glaubte<\/strong> ja, eine fremde Erklärung weiterzugeben. Er wollte nichts Eigenes entscheiden. Der Vertrag kommt trotzdem zwischen Jimmy und Anneliese zustande.\n<strong>Aber:<\/strong> Weil der Bote falsch übermittelt hat, ist die Erklärung <strong>nach § 120 anfechtbar<\/strong> — nicht nach § 119.<\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Vertragsschuss zwischen Jimmy und Anneliese. Angebot durch Denny als Bote für Jimmy: die essentialia negotii liegen fest, da Druckerzeugnisse einer Preisbindung unterliegen, das Objekt bestimmt ist und der Vertragspartner unerheblich als <strong>Bargeschäft des täglichen Lebens („Geschäft, für den es angeht\"), § 164 I, 2.<\/strong>\n[…] Vertragsschluss zwischen Jimmy und Anneliese wie oben (<strong>Denny hat nach wie vor keine eigene WE abgegeben, sondern war in dem Glauben, eine fremde WE weitergegeben zu haben. Daher ist er weiterhin Bote<\/strong>, andere Ansicht bei guter Argumentation vertretbar) <strong>Das Geschäft ist aber nach § 120 anfechtbar.<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Merk dir das Paar: <strong>Vertreter vertut sich → § 119. Bote vertut sich → § 120.<\/strong><\/p>\n<h3 id=\"f-fall-06-b-der-kuhlschrank-fur-1-euro\">Fall 06 b) — Der Kühlschrank für 1 Euro ★★★<\/h3>\n<blockquote>\n<p><strong>Das ist der Übungsfall, der deiner Probeklausur strukturell am ähnlichsten ist.<\/strong> Wenn du nur einen Fall vorher durchrechnest, dann diesen.<\/p>\n<\/blockquote>\n<p><strong>Der Sachverhalt.<\/strong> Jimmy betreibt einen Kiosk. Er bittet seinen Angestellten Denny, einen neuen Kühlschrank zu kaufen und den alten gut zu verkaufen. <strong>Am nächsten Tag<\/strong> bemerkt Jimmy, dass Denny in die Kasse gegriffen hat, und <strong>kündigt ihm fristlos<\/strong>. Aus Wut verkauft Denny <strong>einen Tag später<\/strong> den erst ein Jahr alten Kühlschrank (Wert <strong>300 Euro<\/strong>) an seine Bekannte Anneliese für <strong>1 Euro<\/strong>. Anneliese will den Kühlschrank, hilfsweise Schadensersatz.<\/p>\n<p><strong>Was gefragt ist.<\/strong> An wen kann Anneliese sich wenden? — Das sind <strong>zwei<\/strong> Ansprüche, die du nacheinander prüfst.<\/p>\n<p><strong>Schritt für Schritt.<\/strong><\/p>\n<p><strong>Anspruch 1: Anneliese gegen Jimmy auf Übereignung, § 433 I.<\/strong><\/p>\n<ol>\n<li>Dafür bräuchte es einen Kaufvertrag zwischen Anneliese und Jimmy.<\/li>\n<li>Das Angebot kam nicht von Jimmy, sondern von Denny. Hat Denny den Jimmy wirksam vertreten (§ 164)?\n   - <strong>Eigene WE?<\/strong> Ja — Denny hat selbst entschieden, an wen und zu welchem Preis. ✓\n   - <strong>Im fremden Namen?<\/strong> Ja, er handelte erkennbar für den Kiosk. ✓\n   - <strong>Vertretungsmacht?<\/strong> Hier hakt es.<\/li>\n<li>Woher hätte die Vertretungsmacht kommen sollen? Aus seinem <strong>Arbeitsvertrag<\/strong> — das ist das „zugrundeliegende Rechtsverhältnis\" (§§ 166 II, 168).<\/li>\n<li><strong>Aber der Arbeitsvertrag war einen Tag vorher fristlos gekündigt worden.<\/strong> Und <strong>§ 168 S. 1<\/strong> sagt: Erlischt das Grundverhältnis, erlischt auch die Vollmacht.<\/li>\n<li>→ Keine Vertretungsmacht. Jimmy wurde nicht wirksam vertreten. <strong>Kein Vertrag mit Jimmy.<\/strong><\/li>\n<\/ol>\n<p><strong>Anspruch 2: Anneliese gegen Denny auf Schadensersatz, § 179.<\/strong><\/p>\n<ol start=\"6\">\n<li>Wer ohne Vertretungsmacht handelt, haftet selbst — das ist der <strong>falsus procurator<\/strong>, § 179.<\/li>\n<li>Welcher Absatz? Denny <strong>wusste<\/strong>, dass er gekündigt war. Er hat bewusst überschritten → <strong>§ 179 I<\/strong>.<\/li>\n<li>§ 179 I gibt das <strong>positive Interesse<\/strong>: Anneliese wird so gestellt, wie sie bei wirksamem Vertrag stünde. Sie hätte einen Kühlschrank im Wert von 300 Euro für 1 Euro bekommen. → <strong>Schaden: 299 Euro<\/strong> (§ 249).<\/li>\n<li><strong>Aber: § 179 III prüfen!<\/strong> Der Anspruch entfällt, wenn Anneliese den Mangel der Vertretungsmacht kannte <strong>oder kennen musste<\/strong>. Für Kenntnis spricht nichts. Aber: Hätte sie bei einem so absurden Preis (1 Euro für einen 300-Euro-Kühlschrank) stutzig werden müssen?<\/li>\n<\/ol>\n<p><strong>Die Lösung des Dozenten<\/strong> — er hat sie im vollen Gutachtenstil formuliert:<\/p>\n<blockquote>\n<p>„<strong>(Obersatz:)<\/strong> Anne könnte einen Anspruch auf Übereignung des Kühlschranks von Jimmy nach § 433 haben. <strong>(Definition Tatbestandsmerkmale, TBM):<\/strong> Voraussetzung dafür wäre ein gültiger Kaufvertrag […] <strong>(Subsumtion:)<\/strong> Denny hat eine eigene Erklärung über die Übereignung des Kühlschrankes für 1 EUR abgegeben. Fraglich ist, ob er hierfür Vertretungsmacht von Jimmy hatte. Ursprünglich hatte Denny Vertretungsmacht […] aus seinem Arbeitsvertrag mit Jimmy, <strong>§§ 166 II, 168<\/strong>. Allerdings ist diese Vertretungsmacht durch die <strong>fristlose Kündigung des der Vollmacht zugrundeliegenden Rechtsgeschäfts (Arbeitsvertrag) weggefallen, § 168<\/strong>. <strong>(Schlusssatz:) Folglich<\/strong> hatte Denny […] keine Vertretungsmacht mehr. <strong>Folglich<\/strong> wurde Jimmy durch Denny nicht wirksam vertreten. <strong>Folglich<\/strong> ist kein Kaufvertrag zwischen Anne und Jimmy geschlossen worden […]\nAnneliese könnte gegen Denny einen Anspruch auf Schadensersatz nach <strong>§ 179 I<\/strong> in Höhe von 299 EUR haben. […] Sie hätte einen Kühlschrank im Wert von 300 EUR für den Preis von 1 EUR erhalten. <strong>Also ist ihr Schaden 299 EUR, § 249.<\/strong> […] Dieser Anspruch könnte jedoch <strong>nach § 179 III ausgeschlossen<\/strong> sein, wenn Anne den Mangel der Vertretungsmacht des Denny kannte oder hatte kennen müssen. Für eine Kenntnis sprechen keine Anhaltspunkte. Möglicherweise hätte sie bei einem so <strong>auffälligen Missverhältnis von Leistung und Gegenleistung<\/strong> die mangelnde Vertretungsmacht erkennen müssen. <strong>(Hier kommt es auf die Argumentation und die Umstände des Einzelfalls an. Für die Klausur reicht dieser Hinweis.)<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Drei Dinge, alle drei probeklausurrelevant:<\/p>\n<ol>\n<li><strong>Wenn der erste Anspruch scheitert, ist der Fall nicht zu Ende.<\/strong> Dann kommt der nächste Anspruchsgegner. Genau das verlangt auch deine Probeklausur („Welche Ansprüche hat die MK gegenüber Nancy?\").<\/li>\n<li><strong>§ 168 ist der heimliche Star:<\/strong> Fällt das Grundverhältnis weg (Job, Auftrag, Freundschaftsdienst), fällt die Vollmacht mit.<\/li>\n<li><strong>Der Klammersatz am Ende ist ein Geschenk:<\/strong> <em>„Für die Klausur reicht dieser Hinweis.\"<\/em> Der Dozent will, dass du das Problem <strong>erkennst und benennst<\/strong> — er erwartet keine dreiseitige Abwägung. Schreib „fraglich ist, ob…\", gib ein Argument, entscheide dich, weiter.<\/li>\n<\/ol>\n<h3 id=\"f-fall-06-c-die-untervollmacht\">Fall 06 c) — Die Untervollmacht<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Anneliese hat ein Wochenendhaus am Starnberger See, das dringend renoviert werden muss. Sie geht für sechs Monate in die USA und <strong>beauftragt ihren Studienkollegen Jimmy<\/strong>, der Immobilienmakler ist, mit der Vergabe aller Aufträge. Jimmy hat aber selbst keine Zeit und bittet den <strong>Pädagogikstudenten Denny<\/strong>, Angebote einzuholen und Aufträge bis 20.000 Euro gleich selbst abzuschließen. Denny beauftragt eine Dachreparatur für <strong>15.000 Euro<\/strong>. Anneliese weigert sich zu zahlen — sie habe Denny nie bevollmächtigt.<\/p>\n<p><strong>Schritt für Schritt.<\/strong><\/p>\n<ol>\n<li>Anspruchsgrundlage der Firma: <strong>§§ 631, 632<\/strong> (Werklohn). Dafür braucht es einen Werkvertrag mit Anneliese.<\/li>\n<li>Angenommen hat den Auftrag Denny. Hat er Anneliese wirksam vertreten (§ 164)?<\/li>\n<li>Vertretungsmacht hat Denny <strong>nicht von Anneliese<\/strong> bekommen, sondern <strong>von Jimmy<\/strong>. Also musst du <strong>eine Stufe höher<\/strong> prüfen: Durfte Jimmy überhaupt eine Untervollmacht erteilen?<\/li>\n<li><strong>Wichtig:<\/strong> Die Erteilung einer Vollmacht ist selbst ein Rechtsgeschäft (§ 166 II). Auch dafür braucht Jimmy Vertretungsmacht.<\/li>\n<li>Umfasste Annelieses Vollmacht auch das Recht, Untervollmachten zu erteilen? Das ist <strong>Auslegungssache<\/strong> (§§ 133, 157).<\/li>\n<li>Warum hat sie gerade Jimmy ausgesucht? Wegen seiner <strong>Fachkenntnis als Makler<\/strong> und weil sie ihn kennt. Mutmaßlich war ihr genau nicht recht, dass ein zufällig verfügbarer Pädagogikstudent ihre Aufträge vergibt.<\/li>\n<li>→ Keine Befugnis zur Untervollmacht → Denny hatte keine Vertretungsmacht → <strong>kein Vertrag, kein Werklohn.<\/strong><\/li>\n<\/ol>\n<p><strong>Die Lösung des Dozenten<\/strong> (gekürzt):<\/p>\n<blockquote>\n<p>„Die Übertragung von Vertretungsmacht ist ein Rechtsgeschäft nach § 166 II, für das ebenfalls festgestellt werden muss, ob Jimmy seine Auftraggeberin Anne dabei wirksam vertreten hat. […] Ob die dem Jimmy erteilte Vertretungsmacht […] auch die Erteilung von Untervollmachten umfasste, ist <strong>durch Auslegung nach §§ 133, 157<\/strong> zu ermitteln. Vorliegend hat Anne den Jimmy bevollmächtigt, da dieser durch seine <strong>fachliche Expertise als Makler<\/strong> und durch die freundschaftliche Verbindung besonders geeignet schien. Mutmaßlich war es Anne <strong>nicht recht<\/strong>, dass ihre Aufträge von einem gerade verfügbaren Pädagogikstudenten beauftragt werden. […] Die <strong>Weigerung der Rechnungsbezahlung durch Anne ist als Verweigerung der Genehmigung<\/strong> des durch den vollmachtlosen Vertreter geschlossenen Geschäfts anzusehen, <strong>§ 177 I<\/strong>.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Zwei Techniken:<\/p>\n<ol>\n<li><strong>Wenn die Vollmacht selbst von einem Vertreter kommt, musst du § 164 zweimal prüfen<\/strong> — einmal für das Hauptgeschäft, einmal für die Vollmachtserteilung.<\/li>\n<li><strong>Wer die Zahlung verweigert, verweigert damit auch die Genehmigung<\/strong> nach § 177 I. Du musst also nicht auf ein förmliches „Ich genehmige nicht\" warten.<\/li>\n<\/ol>\n<h3 id=\"f-fall-06-d-die-nagellack-bestellung-anscheinsvollmacht\">Fall 06 d) — Die Nagellack-Bestellung (Anscheinsvollmacht) ★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Die volljährige Studentin Nancy hilft in den Semesterferien <strong>jedes Jahr<\/strong> in der Buchhaltung des Kosmetikstudios ihrer Mutter aus. Dabei kontrolliert sie den Materialbestand und <strong>bestellt regelmäßig telefonisch<\/strong> fehlende Nagellackfarben bei der Gloss-GmbH. Diesmal übersieht sie, dass die Mutter schon nachbestellt hat. Die Mutter weigert sich, die Doppellieferung zu bezahlen — sie habe Nancy nie bevollmächtigt, und die früheren Bestellungen seien „an ihr vorbeigegangen\".<\/p>\n<p><strong>Schritt für Schritt.<\/strong><\/p>\n<p>Der Dozent geht hier <strong>drei Stufen<\/strong> durch — merk dir diese Reihenfolge:<\/p>\n<ol>\n<li><strong>Ausdrückliche Vollmacht?<\/strong> Nein, die Mutter hat nie etwas gesagt.<\/li>\n<li><strong>Vollmacht aus dem Grundverhältnis (§ 168)?<\/strong> Nancy hat einen Aushilfsjob in der <strong>Buchhaltung<\/strong>. Gehört zum Buchhalten das Bestellen von Ware? Eher nicht — das ist Einkauf, nicht Buchhaltung. → Der Dozent verneint das, hält aber die andere Ansicht für vertretbar.<\/li>\n<li><strong>Rechtsscheinvollmacht (§§ 170 ff. analog)?<\/strong> Jetzt wird es interessant. Voraussetzungen:\n   - Die Person ist <strong>mehrfach<\/strong> als Vertreterin aufgetreten → ja, jedes Jahr ✓\n   - Der Geschäftspartner ist <strong>gutgläubig<\/strong> → die Gloss-GmbH hatte keinen Grund zu zweifeln ✓\n   - Die Vertretene <strong>kannte<\/strong> das Auftreten (→ Duldungsvollmacht) <strong>oder hätte es kennen müssen<\/strong> (→ Anscheinsvollmacht) → die Mutter hätte es merken können ✓<\/li>\n<li>→ <strong>Anscheinsvollmacht (+)<\/strong> → Nancy hat wirksam vertreten → <strong>Kaufvertrag mit der Mutter, § 433. Die Firma bekommt ihr Geld.<\/strong><\/li>\n<\/ol>\n<p><strong>Die Lösung des Dozenten<\/strong> (gekürzt):<\/p>\n<blockquote>\n<p>„Eine Vertretungsmacht für Kaufverträge ist jedoch der Aushilfe bei der Buchhaltung nicht immanent (<strong>andere Ansicht vertretbar<\/strong>). Ferner könnte sich die Vertretungsmacht aus dem entstandenen <strong>Rechtsschein<\/strong> […] aus dem Rechtsgedanken der <strong>§§ 170ff<\/strong> ergeben […] Voraussetzung einer <strong>Anscheinsvollmacht<\/strong> in diesem Sinne ist, dass eine Person gegenüber dem Geschäftspartner <strong>mehrfach als Vertreter in Erscheinung getreten<\/strong> und dieser <strong>gutgläubig<\/strong> hinsichtlich der Vertretungsmacht ist. Letztlich müsste die Vertretene das Verhalten der Vertreterin <strong>gekannt haben oder hätte kennen müssen<\/strong>. Vorliegend hat Nancy mehrfach erfolgreich Bestellungen ausgeführt und die Mutter hätte das Auftreten ihrer Tochter auch erkennen können. <strong>Folglich liegen die Voraussetzungen einer Anscheinsvollmacht vor<\/strong> […] weswegen die Firma einen Anspruch auf Kaufpreiszahlung nach § 433 hat.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> <strong>Die Prüfungsreihenfolge bei der Vertretungsmacht:<\/strong><\/p>\n<blockquote>\n<p>ausdrückliche Vollmacht (§ 167) → aus dem Grundverhältnis (§ 168) → Rechtsschein (§§ 170 ff.)<\/p>\n<\/blockquote>\n<p>Und der Merksatz für die letzte Stufe:<\/p>\n<blockquote>\n<p><strong>D<\/strong>uldungsvollmacht = er <strong>d<\/strong>uldet es, weil er es <strong>weiß<\/strong>.\n<strong>A<\/strong>nscheinsvollmacht = er <strong>a<\/strong>hnt es nicht, hätte es aber wissen müssen.<\/p>\n<\/blockquote>\n<h3 id=\"f-fall-06-e-der-strohmann-181\">Fall 06 e) — Der Strohmann (§ 181)<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Anneliese braucht ein Auto und beauftragt Jimmy, für sie einen Gebrauchten <strong>bis 6.000 Euro<\/strong> zu kaufen. Jimmy will ohnehin seinen alten Golf loswerden, für den er anderswo nur 2.400 Euro bekäme. Er bittet seinen Kumpel Denny, als <strong>Strohmann<\/strong> aufzutreten: Denny soll als Vertreter für Jimmy dessen Auto an Anneliese verkaufen — während Jimmy auf der Käuferseite Anneliese vertritt. Preis: <strong>5.000 Euro<\/strong>.<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\nFormal sieht alles sauber aus: Auf der Käuferseite vertritt Jimmy die Anneliese, auf der Verkäuferseite vertritt Denny den Jimmy. Zwei getrennte Personen, zwei Vertretungen nach § 164.<\/p>\n<p><strong>Aber wirtschaftlich sitzt Jimmy auf beiden Seiten des Tisches.<\/strong> Er verhandelt gegen sich selbst — und je mehr er für sich herausholt, desto schlechter für Anneliese. Genau das verbietet <strong>§ 181<\/strong>: das <strong>Insichgeschäft<\/strong>. Der Strohmann ändert daran nichts.<\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„An sich liegen wirksame Stellvertretungen nach § 164 auf beiden Seiten vor (Jimmy vertritt Anne auf Käuferseite; Denny vertritt Jimmy auf Verkäuferseite), <strong>jedoch untersagt § 181, dass man als Vertreter oder als Vertretener Verträge mit sich selbst schließt („In-sich-Geschäft\")<\/strong>. Dementsprechend ist kein wirksamer Kaufvertrag zustande gekommen.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> <strong>§ 181 lässt sich nicht durch einen Strohmann umgehen.<\/strong> Wenn im Sachverhalt jemand auf beiden Seiten mitmischt — auch verdeckt — ist § 181 dein Stichwort.<\/p>","text":"Das ist die Sammlung, die deiner Probeklausur am nächsten kommt. Arbeite besonders Fall b) gründlich durch. Bei jedem dieser Fälle prüfst du dieselben drei Punkte (§ 164): eigene Willenserklärung? → im fremden Namen? → mit Vertretungsmacht? Fall 06 a) — Die FAZ und die Rundschau Der Sachverhalt. Jimmy zu Denny: „Wenn du bei Anneliese einkaufst, bring mir bitte eine FAZ mit.\" Variante 1: Denny sagt bei Anneliese „Bitte eine FAZ\", zahlt und liefert sie ab. Variante 2: Denny sagt versehentlich „Bitte eine Rundschau\". Jimmy will aber die FAZ. Schritt für Schritt. Variante 1. Denny durfte nichts aussuchen — Zeitung, Preis und Zweck standen fest. Er ist also Bote , nicht Vertreter. Der Vertrag kommt zwischen Jimmy und Anneliese zustande. Interessant ist die Offenkundigkeit: Denny sagt ja nicht „ich kaufe für Jimmy\". Muss er auch nicht — bei Bargeschäften des täglichen Lebens ist es der Verkäuferin egal, wer der Vertragspartner ist. Das nennt man „Geschäft für den, den es angeht\" (§ 164 I S. 2). Variante 2. Denny hat sich vertan. Bleibt er Bote? Ja — er glaubte ja, eine fremde Erklärung weiterzugeben. Er wollte nichts Eigenes entscheiden. Der Vertrag kommt trotzdem zwischen Jimmy und Anneliese zustande. Aber: Weil der Bote falsch übermittelt hat, ist die Erklärung nach § 120 anfechtbar — nicht nach § 119. Die Lösung des Dozenten. „Vertragsschuss zwischen Jimmy und Anneliese. Angebot durch Denny als Bote für Jimmy: die essentialia negotii liegen fest, da Druckerzeugnisse einer Preisbindung unterliegen, das Objekt bestimmt ist und der Vertragspartner unerheblich als Bargeschäft des täglichen Lebens („Geschäft, für den es angeht\"), § 164 I, 2. […] Vertragsschluss zwischen Jimmy und Anneliese wie oben ( Denny hat nach wie vor keine eigene WE abgegeben, sondern war in dem Glauben, eine fremde WE weitergegeben zu haben. Daher ist er weiterhin Bote , andere Ansicht bei guter Argumentation vertretbar) Das Geschäft ist aber nach § 120 anfechtbar. \" Was du mitnimmst. Merk dir das Paar: Vertreter vertut sich → § 119. Bote vertut sich → § 120. Fall 06 b) — Der Kühlschrank für 1 Euro ★★★ Das ist der Übungsfall, der deiner Probeklausur strukturell am ähnlichsten ist. Wenn du nur einen Fall vorher durchrechnest, dann diesen. Der Sachverhalt. Jimmy betreibt einen Kiosk. Er bittet seinen Angestellten Denny, einen neuen Kühlschrank zu kaufen und den alten gut zu verkaufen. Am nächsten Tag bemerkt Jimmy, dass Denny in die Kasse gegriffen hat, und kündigt ihm fristlos . Aus Wut verkauft Denny einen Tag später den erst ein Jahr alten Kühlschrank (Wert 300 Euro ) an seine Bekannte Anneliese für 1 Euro . Anneliese will den Kühlschrank, hilfsweise Schadensersatz. Was gefragt ist. An wen kann Anneliese sich wenden? — Das sind zwei Ansprüche, die du nacheinander prüfst. Schritt für Schritt. Anspruch 1: Anneliese gegen Jimmy auf Übereignung, § 433 I. Dafür bräuchte es einen Kaufvertrag zwischen Anneliese und Jimmy. Das Angebot kam nicht von Jimmy, sondern von Denny. Hat Denny den Jimmy wirksam vertreten (§ 164)? - Eigene WE? Ja — Denny hat selbst entschieden, an wen und zu welchem Preis. ✓ - Im fremden Namen? Ja, er handelte erkennbar für den Kiosk. ✓ - Vertretungsmacht? Hier hakt es. Woher hätte die Vertretungsmacht kommen sollen? Aus seinem Arbeitsvertrag — das ist das „zugrundeliegende Rechtsverhältnis\" (§§ 166 II, 168). Aber der Arbeitsvertrag war einen Tag vorher fristlos gekündigt worden. Und § 168 S. 1 sagt: Erlischt das Grundverhältnis, erlischt auch die Vollmacht. → Keine Vertretungsmacht. Jimmy wurde nicht wirksam vertreten. Kein Vertrag mit Jimmy. Anspruch 2: Anneliese gegen Denny auf Schadensersatz, § 179. Wer ohne Vertretungsmacht handelt, haftet selbst — das ist der falsus procurator , § 179. Welcher Absatz? Denny wusste , dass er gekündigt war. Er hat bewusst überschritten → § 179 I . § 179 I gibt das positive Interesse : Anneliese wird so gestellt, wie sie bei wirksamem Vertrag stünde. Sie hätte einen Kühlschrank im Wert von 300 Euro für 1 Euro bekommen. → Schaden: 299 Euro (§ 249). Aber: § 179 III prüfen! Der Anspruch entfällt, wenn Anneliese den Mangel der Vertretungsmacht kannte oder kennen musste . Für Kenntnis spricht nichts. Aber: Hätte sie bei einem so absurden Preis (1 Euro für einen 300-Euro-Kühlschrank) stutzig werden müssen? Die Lösung des Dozenten — er hat sie im vollen Gutachtenstil formuliert: „ (Obersatz:) Anne könnte einen Anspruch auf Übereignung des Kühlschranks von Jimmy nach § 433 haben. (Definition Tatbestandsmerkmale, TBM): Voraussetzung dafür wäre ein gültiger Kaufvertrag […] (Subsumtion:) Denny hat eine eigene Erklärung über die Übereignung des Kühlschrankes für 1 EUR abgegeben. Fraglich ist, ob er hierfür Vertretungsmacht von Jimmy hatte. Ursprünglich hatte Denny Vertretungsmacht […] aus seinem Arbeitsvertrag mit Jimmy, §§ 166 II, 168 . Allerdings ist diese Vertretungsmacht durch die fristlose Kündigung des der Vollmacht zugrundeliegenden Rechtsgeschäfts (Arbeitsvertrag) weggefallen, § 168 . (Schlusssatz:) Folglich hatte Denny […] keine Vertretungsmacht mehr. Folglich wurde Jimmy durch Denny nicht wirksam vertreten. Folglich ist kein Kaufvertrag zwischen Anne und Jimmy geschlossen worden […] Anneliese könnte gegen Denny einen Anspruch auf Schadensersatz nach § 179 I in Höhe von 299 EUR haben. […] Sie hätte einen Kühlschrank im Wert von 300 EUR für den Preis von 1 EUR erhalten. Also ist ihr Schaden 299 EUR, § 249. […] Dieser Anspruch könnte jedoch nach § 179 III ausgeschlossen sein, wenn Anne den Mangel der Vertretungsmacht des Denny kannte oder hatte kennen müssen. Für eine Kenntnis sprechen keine Anhaltspunkte. Möglicherweise hätte sie bei einem so auffälligen Missverhältnis von Leistung und Gegenleistung die mangelnde Vertretungsmacht erkennen müssen. (Hier kommt es auf die Argumentation und die Umstände des Einzelfalls an. Für die Klausur reicht dieser Hinweis.) \" Was du mitnimmst. Drei Dinge, alle drei probeklausurrelevant: Wenn der erste Anspruch scheitert, ist der Fall nicht zu Ende. Dann kommt der nächste Anspruchsgegner. Genau das verlangt auch deine Probeklausur („Welche Ansprüche hat die MK gegenüber Nancy?\"). § 168 ist der heimliche Star: Fällt das Grundverhältnis weg (Job, Auftrag, Freundschaftsdienst), fällt die Vollmacht mit. Der Klammersatz am Ende ist ein Geschenk: „Für die Klausur reicht dieser Hinweis.\" Der Dozent will, dass du das Problem erkennst und benennst — er erwartet keine dreiseitige Abwägung. Schreib „fraglich ist, ob…\", gib ein Argument, entscheide dich, weiter. Fall 06 c) — Die Untervollmacht Der Sachverhalt. Anneliese hat ein Wochenendhaus am Starnberger See, das dringend renoviert werden muss. Sie geht für sechs Monate in die USA und beauftragt ihren Studienkollegen Jimmy , der Immobilienmakler ist, mit der Vergabe aller Aufträge. Jimmy hat aber selbst keine Zeit und bittet den Pädagogikstudenten Denny , Angebote einzuholen und Aufträge bis 20.000 Euro gleich selbst abzuschließen. Denny beauftragt eine Dachreparatur für 15.000 Euro . Anneliese weigert sich zu zahlen — sie habe Denny nie bevollmächtigt. Schritt für Schritt. Anspruchsgrundlage der Firma: §§ 631, 632 (Werklohn). Dafür braucht es einen Werkvertrag mit Anneliese. Angenommen hat den Auftrag Denny. Hat er Anneliese wirksam vertreten (§ 164)? Vertretungsmacht hat Denny nicht von Anneliese bekommen, sondern von Jimmy . Also musst du eine Stufe höher prüfen: Durfte Jimmy überhaupt eine Untervollmacht erteilen? Wichtig: Die Erteilung einer Vollmacht ist selbst ein Rechtsgeschäft (§ 166 II). Auch dafür braucht Jimmy Vertretungsmacht. Umfasste Annelieses Vollmacht auch das Recht, Untervollmachten zu erteilen? Das ist Auslegungssache (§§ 133, 157). Warum hat sie gerade Jimmy ausgesucht? Wegen seiner Fachkenntnis als Makler und weil sie ihn kennt. Mutmaßlich war ihr genau nicht recht, dass ein zufällig verfügbarer Pädagogikstudent ihre Aufträge vergibt. → Keine Befugnis zur Untervollmacht → Denny hatte keine Vertretungsmacht → kein Vertrag, kein Werklohn. Die Lösung des Dozenten (gekürzt): „Die Übertragung von Vertretungsmacht ist ein Rechtsgeschäft nach § 166 II, für das ebenfalls festgestellt werden muss, ob Jimmy seine Auftraggeberin Anne dabei wirksam vertreten hat. […] Ob die dem Jimmy erteilte Vertretungsmacht […] auch die Erteilung von Untervollmachten umfasste, ist durch Auslegung nach §§ 133, 157 zu ermitteln. Vorliegend hat Anne den Jimmy bevollmächtigt, da dieser durch seine fachliche Expertise als Makler und durch die freundschaftliche Verbindung besonders geeignet schien. Mutmaßlich war es Anne nicht recht , dass ihre Aufträge von einem gerade verfügbaren Pädagogikstudenten beauftragt werden. […] Die Weigerung der Rechnungsbezahlung durch Anne ist als Verweigerung der Genehmigung des durch den vollmachtlosen Vertreter geschlossenen Geschäfts anzusehen, § 177 I .\" Was du mitnimmst. Zwei Techniken: Wenn die Vollmacht selbst von einem Vertreter kommt, musst du § 164 zweimal prüfen — einmal für das Hauptgeschäft, einmal für die Vollmachtserteilung. Wer die Zahlung verweigert, verweigert damit auch die Genehmigung nach § 177 I. Du musst also nicht auf ein förmliches „Ich genehmige nicht\" warten. Fall 06 d) — Die Nagellack-Bestellung (Anscheinsvollmacht) ★ Der Sachverhalt. Die volljährige Studentin Nancy hilft in den Semesterferien jedes Jahr in der Buchhaltung des Kosmetikstudios ihrer Mutter aus. Dabei kontrolliert sie den Materialbestand und bestellt regelmäßig telefonisch fehlende Nagellackfarben bei der Gloss-GmbH. Diesmal übersieht sie, dass die Mutter schon nachbestellt hat. Die Mutter weigert sich, die Doppellieferung zu bezahlen — sie habe Nancy nie bevollmächtigt, und die früheren Bestellungen seien „an ihr vorbeigegangen\". Schritt für Schritt. Der Dozent geht hier drei Stufen durch — merk dir diese Reihenfolge: Ausdrückliche Vollmacht? Nein, die Mutter hat nie etwas gesagt. Vollmacht aus dem Grundverhältnis (§ 168)? Nancy hat einen Aushilfsjob in der Buchhaltung . Gehört zum Buchhalten das Bestellen von Ware? Eher nicht — das ist Einkauf, nicht Buchhaltung. → Der Dozent verneint das, hält aber die andere Ansicht für vertretbar. Rechtsscheinvollmacht (§§ 170 ff. analog)? Jetzt wird es interessant. Voraussetzungen: - Die Person ist mehrfach als Vertreterin aufgetreten → ja, jedes Jahr ✓ - Der Geschäftspartner ist gutgläubig → die Gloss-GmbH hatte keinen Grund zu zweifeln ✓ - Die Vertretene kannte das Auftreten (→ Duldungsvollmacht) oder hätte es kennen müssen (→ Anscheinsvollmacht) → die Mutter hätte es merken können ✓ → Anscheinsvollmacht (+) → Nancy hat wirksam vertreten → Kaufvertrag mit der Mutter, § 433. Die Firma bekommt ihr Geld. Die Lösung des Dozenten (gekürzt): „Eine Vertretungsmacht für Kaufverträge ist jedoch der Aushilfe bei der Buchhaltung nicht immanent ( andere Ansicht vertretbar ). Ferner könnte sich die Vertretungsmacht aus dem entstandenen Rechtsschein […] aus dem Rechtsgedanken der §§ 170ff ergeben […] Voraussetzung einer Anscheinsvollmacht in diesem Sinne ist, dass eine Person gegenüber dem Geschäftspartner mehrfach als Vertreter in Erscheinung getreten und dieser gutgläubig hinsichtlich der Vertretungsmacht ist. Letztlich müsste die Vertretene das Verhalten der Vertreterin gekannt haben oder hätte kennen müssen . Vorliegend hat Nancy mehrfach erfolgreich Bestellungen ausgeführt und die Mutter hätte das Auftreten ihrer Tochter auch erkennen können. Folglich liegen die Voraussetzungen einer Anscheinsvollmacht vor […] weswegen die Firma einen Anspruch auf Kaufpreiszahlung nach § 433 hat.\" Was du mitnimmst. Die Prüfungsreihenfolge bei der Vertretungsmacht: ausdrückliche Vollmacht (§ 167) → aus dem Grundverhältnis (§ 168) → Rechtsschein (§§ 170 ff.) Und der Merksatz für die letzte Stufe: D uldungsvollmacht = er d uldet es, weil er es weiß . A nscheinsvollmacht = er a hnt es nicht, hätte es aber wissen müssen. Fall 06 e) — Der Strohmann (§ 181) Der Sachverhalt. Anneliese braucht ein Auto und beauftragt Jimmy, für sie einen Gebrauchten bis 6.000 Euro zu kaufen. Jimmy will ohnehin seinen alten Golf loswerden, für den er anderswo nur 2.400 Euro bekäme. Er bittet seinen Kumpel Denny, als Strohmann aufzutreten: Denny soll als Vertreter für Jimmy dessen Auto an Anneliese verkaufen — während Jimmy auf der Käuferseite Anneliese vertritt. Preis: 5.000 Euro . Schritt für Schritt. Formal sieht alles sauber aus: Auf der Käuferseite vertritt Jimmy die Anneliese, auf der Verkäuferseite vertritt Denny den Jimmy. Zwei getrennte Personen, zwei Vertretungen nach § 164. Aber wirtschaftlich sitzt Jimmy auf beiden Seiten des Tisches. Er verhandelt gegen sich selbst — und je mehr er für sich herausholt, desto schlechter für Anneliese. Genau das verbietet § 181 : das Insichgeschäft . Der Strohmann ändert daran nichts. Die Lösung des Dozenten. „An sich liegen wirksame Stellvertretungen nach § 164 auf beiden Seiten vor (Jimmy vertritt Anne auf Käuferseite; Denny vertritt Jimmy auf Verkäuferseite), jedoch untersagt § 181, dass man als Vertreter oder als Vertretener Verträge mit sich selbst schließt („In-sich-Geschäft\") . Dementsprechend ist kein wirksamer Kaufvertrag zustande gekommen.\" Was du mitnimmst. § 181 lässt sich nicht durch einen Strohmann umgehen. Wenn im Sachverhalt jemand auf beiden Seiten mitmischt — auch verdeckt — ist § 181 dein Stichwort.","words":2014,"mins":11},{"id":"f-7-fälle-zu-den-gesetzlichen-schuldverhältnissen","subject":"faelle","num":"7","title":"7. Fälle zu den gesetzlichen Schuldverhältnissen","short":"Fälle zu den gesetzlichen Schuldverhältnissen","html":"<p>Hier gibt es <strong>keine Verträge<\/strong>. Die Pflichten entstehen, weil etwas passiert ist. Drei Normen tauchen auf: <strong>c.i.c.<\/strong> (Schutzpflichten vor dem Vertrag), <strong>§ 812<\/strong> (Rückholung), <strong>§ 823<\/strong> (Schaden).<\/p>\n<p><strong>In dieser Sammlung steht auch das Bewertungsschema des Dozenten<\/strong> — siehe Fall c).<\/p>\n<h3 id=\"f-fall-07-a-malware-auf-der-shop-website-cic\">Fall 07 a) — Malware auf der Shop-Website (c.i.c.) ★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Nancy stöbert auf der Website des Online-Shops von Jimmy nach einer Konsole. Bevor sie etwas bestellt, wird sie abgelenkt. Später ist ihr Tablet von <strong>Ransomware blockiert<\/strong> — sie muss 0,1 Bitcoin zahlen, um es wieder freizubekommen. Da ihr Virenscanner aktuell war, steht fest: Die Malware kam von der Website. Nancy verlangt Schadensersatz. Jimmy weigert sich: Er hatte mit ihr <strong>gar keinen Vertrag<\/strong> und die Malware nicht selbst installiert.<\/p>\n<p><strong>Was gefragt ist.<\/strong> Muss Jimmy zahlen, obwohl nie ein Vertrag zustande kam?<\/p>\n<p><strong>Schritt für Schritt.<\/strong><\/p>\n<p>Jimmys Einwand trifft einen wahren Punkt: Es gab keinen Vertrag. Also kein vertraglicher Anspruch. <strong>Aber<\/strong> Schutzpflichten entstehen schon <strong>vorher<\/strong>.<\/p>\n<ol>\n<li><strong>Vorvertragliches Schuldverhältnis, § 311 II Nr. 1.<\/strong> Durch Jimmys Angebot im Netz und Nancys Besuch mit Kaufabsicht ist ein Kontakt entstanden, an den das Gesetz Pflichten knüpft. (Der Alltagsklassiker dazu: Du rutschst im Supermarkt aus, bevor du etwas gekauft hast.)<\/li>\n<li><strong>Pflichtverletzung, § 241 II.<\/strong> Zu den Rücksichtnahmepflichten gegenüber Kunden gehört es, die eigene Website ordentlich abzusichern. Das hat Jimmy unterlassen.<\/li>\n<li><strong>Vertretenmüssen, § 276 I.<\/strong> Ob aus Nachlässigkeit (fahrlässig) oder aus Kostengründen bewusst (vorsätzlich) — beides reicht.<\/li>\n<li><strong>Kausaler Schaden.<\/strong> Ohne die ungesicherte Seite kein Trojaner, ohne Trojaner keine Zahlung.<\/li>\n<li>→ Anspruch aus <strong>§§ 311 II, 241 II, 280<\/strong>. Ersetzt wird das <strong>negative Interesse<\/strong> (§ 122): Nancy wird so gestellt, als hätte es die Vertragsanbahnung nie gegeben. Das sind genau die 0,1 BTC.<\/li>\n<\/ol>\n<p><strong>Die Lösung des Dozenten<\/strong> (gekürzt):<\/p>\n<blockquote>\n<p>„Nancy könnte einen Anspruch auf Schadensersatz in Höhe von 0,1 BTC gegen Jimmy aus <strong>§§ 311 II, 241 II Nr. 1, 280 „c.i.c.\"<\/strong> haben. […] Durch Jimmys Angebot im Netz und den Besuch von Nancy auf der Website, um eine Konsole zu kaufen, ist ein <strong>vorvertragliches Schuldverhältnis nach § 311 II Nr. 1<\/strong> entstanden. <strong>Zu den Rücksichtnahmepflichten gegenüber potentiellen Kunden im Netz gehört es, die Angebotswebsites mit den bestmöglichen Virenschutzsystemen zu schützen. Dies hat Jimmy offenbar unterlassen<\/strong> („Pflichtverletzung\"). […] <strong>Ersatzfähig nach §§ 311 II, 241 II, 280 ist das negative Interesse (vgl. § 122)<\/strong>, nach der die Geschädigte so gestellt werden muss, als ob es die Vertragsverhandlungen niemals gegeben habe.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Das ist ein <strong>IT-Fall in einer Informatik-Klausur<\/strong> — die Wahrscheinlichkeit, dass so etwas drankommt, ist überdurchschnittlich. Der Kernsatz:<\/p>\n<blockquote>\n<p><strong>Schon wer einen Onlineshop betreibt, schuldet Besuchern IT-Sicherheit — auch ohne Vertrag.<\/strong><\/p>\n<\/blockquote>\n<h3 id=\"f-fall-07-b-fake-bewertungen-bei-checkingcom\">Fall 07 b) — Fake-Bewertungen bei Checking.com<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Denny sucht ein Hotel für einen Kurzurlaub. Bei Checking.com findet er ein Gasthaus mit <strong>9,5/10 Bewertung<\/strong>. Er bucht schon mal <strong>Konzertkarten für 50 Euro<\/strong>. Dann zweifelt er an den Bewertungen und schreibt Rezensenten an — er bekommt nur gleichlautende Auto-Antworten von <strong>derselben Adresse<\/strong>. Er bucht gar nicht mehr und fährt stattdessen zur Tante an die Ostsee. Von Checking.com will er die 50 Euro für die nutzlosen Tickets.<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\n1. <strong>§ 311 II Nr. 1<\/strong> — vorvertragliches Schuldverhältnis durch den Webshop und Dennys Buchungsabsicht.\n2. <strong>§ 241 II<\/strong> — dazu gehört auch das Interesse des Kunden an <strong>zutreffenden Informationen<\/strong>. Fake-Bewertungen verletzen das.\n3. <strong>§ 276<\/strong> — das geschah vorsätzlich.\n4. <strong>Kausalität.<\/strong> Hier liegt das eigentliche Problem: Denny hat die Reise ja <strong>selbst<\/strong> abgesagt. Unterbricht das die Kausalkette? Der Dozent sagt nein — dass jemand nach so einer Erfahrung die ganze Reise absagt, liegt nicht so fern, dass eine neue Ursachenkette begänne. Also <strong>adäquat kausal<\/strong>.\n5. → Anspruch auf 50 Euro.<\/p>\n<p><strong>Die Lösung des Dozenten<\/strong> (gekürzt):<\/p>\n<blockquote>\n<p>„Im Rahmen dieses Schuldverhältnisses muss auch das <strong>Interesse des D auf zutreffende Informationen<\/strong> als Kunde nach § 241 II beachtet werden. Dies hat C verletzt, in dem er <strong>Fake-Bewertungen<\/strong> selbst erstellt oder auf seiner Website zugelassen hat. […] <strong>Dass D von sich aus entschieden hat, die Reise ganz abzusagen, liegt in Bezug auf die negative Erfahrung beim Buchen nicht so fern, dass vom Beginn einer neuen Ursachenkette auszugehen wäre.<\/strong> Damit ist der Schaden <strong>adäquat kausal<\/strong> von der Pflichtverletzung verursacht worden.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Die <strong>Adäquanz<\/strong> ist der Punkt, an dem solche Fälle kippen. Frag dich immer: <em>War diese Folge noch typisch — oder völlig aus der Luft gegriffen?<\/em> Vergleich dazu Fall 07 g), wo die Kausalkette tatsächlich unterbrochen wird.<\/p>\n<h3 id=\"f-fall-07-c-das-zahngold-mit-dem-bewertungsschema\">Fall 07 c) — Das Zahngold ★★ (mit dem Bewertungsschema!)<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Der <strong>17-jährige<\/strong> Denny hatte von Geburt an ein schlechtes Gebiss. Seine <strong>Gold-Inlays<\/strong> wurden durch Keramik ersetzt; das Zahngold durfte er mitnehmen. Zu Hause <strong>schenkten ihm seine Eltern die Goldinlays<\/strong> als Wiedergutmachung für die Schmerzen. Denny verkauft das Gold sofort beim Goldankauf von Anneliese für <strong>455 Euro<\/strong> in bar, um sich eine Switch 2 zu kaufen. Die Eltern sind nicht begeistert und <strong>lehnen den Verkauf nachträglich ab<\/strong> — sie hatten gedacht, er würde das Gold für sein Studium aufheben. Gesagt hatten sie ihm das aber nicht. Als Anneliese hört, dass Denny minderjährig war, will <strong>sie<\/strong> ihr Geld zurück, denn der Goldpreis ist inzwischen auf 400 Euro gefallen.<\/p>\n<p><strong>Was gefragt ist.<\/strong> Kann <strong>Anneliese<\/strong> die 455 Euro zurückverlangen? — Achtung, die Frage geht in die für dich ungewohnte Richtung: nicht die Eltern wollen etwas, sondern die Käuferin.<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\n1. Anspruchsgrundlage: <strong>§ 812 I S. 1 1. Fall<\/strong> — hat Denny die 455 Euro ohne Rechtsgrund bekommen?\n2. Rechtsgrund wäre der Kaufvertrag (§ 433). Der kam durch Angebot und Annahme zustande.\n3. Denny ist 17 → § 106. Der Verkauf ist kein reiner Vorteil, die Eltern haben nicht eingewilligt → an sich <strong>§ 108 schwebend unwirksam<\/strong>.\n4. <strong>Aber § 110:<\/strong> Denny hat seine Leistung — die Übereignung des Goldes — mit Mitteln bewirkt, die ihm <strong>zur freien Verfügung überlassen<\/strong> worden waren. Die Eltern hatten ihm das Gold ja geschenkt.\n5. Und: Die <strong>spätere Reue der Eltern ändert daran nichts<\/strong>. Einmal überlassen ist überlassen; die Einwilligung lässt sich nicht rückwirkend zurücknehmen.\n6. → Der Kaufvertrag ist <strong>wirksam<\/strong> → es gibt einen Rechtsgrund → <strong>§ 812 greift nicht. Anneliese bekommt nichts.<\/strong><\/p>\n<p><strong>Die Lösung des Dozenten<\/strong> (gekürzt):<\/p>\n<blockquote>\n<p>„Dennoch wäre der Vertrag nach § 110 wirksam zustande gekommen, wenn Denny die Gegenleistung […] mit Mitteln bewirkt hat, die ihm hierfür oder zur freien Vergütung überlassen worden sind. <strong>Die Eltern hatten ihm das Zahngold zur freien Verfügung gegeben. Eine spätere „Reue\" der Eltern ändert daran nichts mehr.<\/strong> Dementsprechend war der Vertrag wirksam zustande gekommen und es liegt ein Rechtsgrund vor. Somit ist auch kein Anspruch auf Herausgabe nach § 812 I, S. 1, 1 Fall gegeben.\"<\/p>\n<\/blockquote>\n<p><strong>Und direkt darunter steht in den Unterlagen das Bewertungsschema:<\/strong><\/p>\n<blockquote>\n<p>„(Und hier mein Bewertungsschema für die Klausur)\n<strong>Gesamtpunkte Falllösung 55<\/strong>\nJur. Methode (Gutachtenstil) <strong>10<\/strong> — Verstanden (ggfs. definiert) 5 · Umgesetzt 5\nAnspruchsgrundlage <strong>10<\/strong> — Als erforderlich erkannt 3 · EINE AG gefunden 3 · § 812 4\nPrüfung §§ 433, 108, 110 <strong>15<\/strong>\nPrüfung Anfechtung, § 119 II <strong>15<\/strong> <em>(hier nicht Teil der Lösung)<\/em>\nFormulierung Ergebnis <strong>5<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Zwei Dinge, und beide sind wichtig:<\/p>\n<ol>\n<li><strong>Inhaltlich:<\/strong> § 110 gilt nicht nur fürs Bezahlen mit Taschengeld. Auch <strong>eine Sache<\/strong>, die dem Minderjährigen zur freien Verfügung überlassen wurde, ist ein „Mittel\" im Sinne des § 110. Und Eltern können ihre Einwilligung nicht nachträglich zurückziehen.<\/li>\n<li><strong>Für die Klausurstrategie:<\/strong> Schau dir die Punkteverteilung genau an. Für <strong>Methode + Anspruchsgrundlage + Ergebnisformulierung<\/strong> gibt es <strong>25 von 55 Punkten<\/strong> — fast die Hälfte, und zwar unabhängig davon, ob dein Ergebnis richtig ist. Deshalb gilt: <strong>Immer eine Anspruchsgrundlage nennen, immer im Gutachtenstil, immer mit Schlusssatz<\/strong> — selbst wenn du inhaltlich unsicher bist.<\/li>\n<\/ol>\n<h3 id=\"f-fall-07-d-die-500-euro-furs-zusammenziehen-zweckverfehlung\">Fall 07 d) — Die 500 Euro fürs Zusammenziehen (Zweckverfehlung)<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Jimmy will nach vier Monaten Beziehung mit Nancy zusammenziehen. Ihr geht das zu schnell, und sie sagt, sie könne sich den Umzug sowieso nicht leisten. Daraufhin Jimmy: „Das Geld für den Umzug kann ich dir doch geben. Hier hast du <strong>500 Euro<\/strong>.\" Als Nancy sich später traut zu sagen, dass sie gar nicht zusammenziehen will, verlangt Jimmy das Geld zurück.<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\n1. <strong>§ 812 I S. 1 1. Fall<\/strong> — hat Nancy die 500 Euro ohne Rechtsgrund bekommen?\n2. Problem: Es <em>gab<\/em> vielleicht einen Rechtsgrund. Jimmy hat ihr das Geld ja gegeben — als Schenkung oder Darlehen. Beides wäre ein Rechtsgrund.\n3. <strong>Aber:<\/strong> Jimmy hat mit der Zahlung einen <strong>bestimmten Zweck<\/strong> verfolgt — das Zusammenziehen. Dieser Zweck ist nicht eingetreten.\n4. <strong>§ 812 I S. 2 (2. Alt.):<\/strong> Der <strong>Nichteintritt des mit einer Leistung bezweckten Erfolgs<\/strong> steht den Fällen des Satzes 1 gleich.\n5. → Anspruch auf Rückzahlung.<\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Allerdings hatte sich Jimmy mit der Zahlung und den ggfs. zugrundeliegenden Rechtsgeschäften die Erreichung eines bestimmten Zweckes, nämlich des Zusammenziehens, vorgestellt. <strong>Der Nichteintritt des verfolgten Zwecks steht nach § 812 I, S. 2 den Fällen des S. 1 gleich<\/strong>, so dass ein entsprechender Anspruch gegeben ist.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Das ist die <strong>dritte Variante des § 812<\/strong>, die man leicht übersieht: die <strong>Zweckverfehlung<\/strong>. Merk dir alle drei:\n- <strong>§ 812 I S. 1, 1. Alt.<\/strong> — durch Leistung (Leistungskondiktion)\n- <strong>§ 812 I S. 1, 2. Alt.<\/strong> — in sonstiger Weise (Eingriffskondiktion)\n- <strong>§ 812 I S. 2<\/strong> — der bezweckte Erfolg tritt nicht ein (Zweckverfehlung)<\/p>\n<h3 id=\"f-fall-07-e-die-dreifache-ruckzahlung-entreicherung\">Fall 07 e) — Die dreifache Rückzahlung (Entreicherung)<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Anneliese hat bei RAZA einen Pulli für <strong>85 Euro<\/strong> gekauft und zurückgeschickt. Durch einen Fehler im Zahllauf bekommt sie die Rückzahlung <strong>dreimal<\/strong>, also <strong>255 Euro<\/strong>. Die Überzahlung kommt ihr gerade recht: Ihre Freundin sucht eine Reisebegleitung fürs Wochenende, das hätte sie sich sonst <strong>nie leisten können<\/strong>. Die 170 Euro sind vollständig verbraucht. Jetzt will RAZA das Geld zurück.<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\n1. <strong>§ 812 I S. 1 1. Fall<\/strong> — RAZA hat 170 Euro zu viel gezahlt, ohne Rechtsgrund. Der Anspruch besteht grundsätzlich.\n2. <strong>Aber § 818 III:<\/strong> Der Anspruch ist ausgeschlossen, soweit der Empfänger <strong>nicht mehr bereichert<\/strong> ist. Anneliese hat das Geld ausgegeben, es ist weg.\n3. <strong>Die entscheidende Zusatzfrage — „ersparte Aufwendungen\":<\/strong> Hätte sie das Geld für etwas ausgegeben, das sie <strong>sowieso<\/strong> gekauft hätte (Miete, Lebensmittel), wäre sie nicht entreichert — dann hätte sie ja eigenes Geld gespart. Nur bei <strong>Luxus, den sie sich sonst nie geleistet hätte<\/strong>, greift § 818 III wirklich.\n4. Der Sachverhalt sagt ausdrücklich: „das hätte sich Anneliese sonst nie leisten können\". → Keine ersparten Aufwendungen.\n5. → <strong>§ 818 III greift. RAZA bekommt nichts.<\/strong><\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Der Anspruch ist nach § 812 I, S 1, 1. Fall (Leistungskondiktion) gegeben, allerdings steht dem die <strong>Einwendung des § 818 III<\/strong> entgegen, da die Bereicherung im Vermögen der A nicht mehr vorhanden, sie somit <strong>entreichert<\/strong> und damit der Anspruch nach § 812 ausgeschlossen ist. <strong>Es liegen auch keine ersparten Aufwendungen vor<\/strong>, die ansonsten üblicherweise getätigt worden wären.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> § 818 III ist keine Freikarte fürs Geldausgeben. Die Prüffrage lautet: <strong>Hätte er es sowieso ausgegeben?<\/strong>\n- Wochenendtrip, den er sich nie geleistet hätte → <strong>entreichert<\/strong>, er darf behalten.\n- Wocheneinkauf → <strong>nicht entreichert<\/strong>, er muss zahlen.<\/p>\n<h3 id=\"f-fall-07-f-der-verkehrsunfall-823-mit-acht-schadenspositionen\">Fall 07 f) — Der Verkehrsunfall (§ 823 mit acht Schadenspositionen) ★★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Jimmy fährt gern zügig und übersieht in einer geschlossenen Ortschaft die <strong>von rechts kommende<\/strong> Anneliese. Er fährt ihr in die Seitentür. Neben dem Sachschaden wird ihr <strong>Bein erheblich geprellt<\/strong>, sie kann zwei Wochen nicht arbeiten.<\/p>\n<p><strong>Was gefragt ist.<\/strong> Welche Schäden muss Jimmy ersetzen? — Der Dozent prüft <strong>jeden Posten einzeln<\/strong>. Genau diese Technik sollst du lernen.<\/p>\n<p><strong>Schritt für Schritt — erst der Grundanspruch.<\/strong>\n<strong>§ 823 I:<\/strong> Jimmy hat durch Missachtung der Vorfahrt rechtswidrig und schuldhaft (fahrlässig, § 276 II) geschützte Rechtsgüter der Anneliese verletzt (<strong>Eigentum<\/strong> am Auto, <strong>Körper/Gesundheit<\/strong>). Daraus sind kausal Schäden entstanden. Grundanspruch (+).<\/p>\n<p><strong>Und jetzt Posten für Posten:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Posten<\/th>\n<th>Ergebnis<\/th>\n<th>Begründung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Reparatur 3.500 €<\/td>\n<td><strong>✓ voll<\/strong><\/td>\n<td>Rechtsgut Eigentum, Vermögensvergleich nach § 249<\/td>\n<\/tr>\n<tr>\n<td>… wenn das Auto nur <strong>2.500 €<\/strong> wert wäre<\/td>\n<td><strong>nur 2.500 €<\/strong><\/td>\n<td>Reparaturkosten dürfen den Wert um höchstens <strong>30 %<\/strong> übersteigen — hier überschritten<\/td>\n<\/tr>\n<tr>\n<td>Heilbehandlung Bein + Physio 1.500 €<\/td>\n<td><strong>✓<\/strong><\/td>\n<td>Rechtsgut Gesundheit<\/td>\n<\/tr>\n<tr>\n<td>Weitere Physio 1.800 € wegen <strong>vorbestehender Arthrose<\/strong><\/td>\n<td><strong>✗<\/strong><\/td>\n<td>die Arthrose war schon vorher da → <strong>keine schadensbegründende Kausalität<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Schmerzensgeld 800 €<\/td>\n<td><strong>✓<\/strong><\/td>\n<td>immaterieller Schaden, aber ersatzfähig nach <strong>§ 253 II<\/strong>; 800 € liegt „am oberen Rand\"<\/td>\n<\/tr>\n<tr>\n<td>Mietwagen <strong>Porsche<\/strong> 2.400 € für 2 Wochen<\/td>\n<td><strong>gekürzt<\/strong><\/td>\n<td>ersetzt wird nur ein <strong>vergleichbares<\/strong> Fahrzeug, nicht die Luxusklasse<\/td>\n<\/tr>\n<tr>\n<td>Lohnfortzahlung 2.800 € vom Arbeitgeber<\/td>\n<td><strong>✗<\/strong><\/td>\n<td>Anneliese hat <strong>keinen Schaden<\/strong> — sie hat ihr Geld ja bekommen. (Der Arbeitgeber könnte selbst fordern.)<\/td>\n<\/tr>\n<tr>\n<td>Entgangener Geschäftsabschluss 5.000 €<\/td>\n<td><strong>fraglich<\/strong><\/td>\n<td>§ 252 entgangener Gewinn — aber stünde der Anneliese oder ihrem Arbeitgeber zu?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Die Lösung des Dozenten<\/strong> (Auszüge):<\/p>\n<blockquote>\n<p>„Wie wäre es, wenn das Auto nur noch 2.500 EUR wert wäre? […] <strong>Sofern ein besonderes Interesse an genau diesem Fahrzeug plausibel gemacht wird, ist eine Überschreitung der (tatsächlichen) Reparaturkosten um höchstens 30% anerkannt worden.<\/strong> (-, da hier überschritten ⇒ nur 2.500 EUR)\n[…] Schmerzensgeld von 800 EUR (+, zwar immaterieller Schaden, aber <strong>zu ersetzen nach § 253 II<\/strong>; 800 EUR liegt jedoch am oberen Rand).\nKosten für einen Mietwagen […] Dabei hatte sich A einmal im Leben als Mietwagen einen Porsche geleistet. (<strong>Der Schaden besteht lediglich in der Nichtverfügbarkeit eines Autos der Klasse, die bisher gefahren wurde.<\/strong> […] § 249.)\nKosten für die Lohnfortzahlung […] (-; <strong>A hat keinen Schaden<\/strong>, allerdings könnte der Arbeitgeber SE fordern.)\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Drei Regeln, die alle drei in der Klausur zählen:<\/p>\n<ol>\n<li><strong>Prüfe jeden Schadensposten getrennt.<\/strong> Ein Anspruch kann dem Grunde nach bestehen und trotzdem bei einzelnen Positionen scheitern.<\/li>\n<li><strong>Der Geschädigte soll nicht besser dastehen als vorher.<\/strong> Deshalb kein Porsche statt Kleinwagen, deshalb keine Reparatur über 130 % des Werts.<\/li>\n<li><strong>Wer keinen Schaden hat, bekommt nichts<\/strong> — auch wenn er verletzt wurde. Die Lohnfortzahlung ist das perfekte Beispiel.<\/li>\n<\/ol>\n<h3 id=\"f-fall-07-g-der-trojaner-am-arbeitsplatz\">Fall 07 g) — Der Trojaner am Arbeitsplatz ★★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Denny wurde bei einer Beförderung übergangen. Um seinem Chef seine Fähigkeiten zu beweisen, <strong>installiert er einen Trojaner<\/strong>, der das Betriebssystem lahmlegt — er wollte den Fehler anschließend beheben und als Retter dastehen. Die Reparatur misslingt, ein <strong>neues Release<\/strong> wird nötig: <strong>15.000 Euro<\/strong>. Ohne den Vorfall wäre der Releasewechsel erst in einem halben Jahr fällig gewesen. Während des Stillstands gehen Aufträge mit <strong>25.000 Euro<\/strong> potenziellem Gewinn verloren. Zusätzlich beschädigt die Malware das System eines <strong>Konkurrenten, der sich illegal auf Dennys Rechner aufgeschaltet hatte<\/strong> — Schaden dort: <strong>12.000 Euro<\/strong>.<\/p>\n<p><strong>Was gefragt ist.<\/strong> Für welche Schäden muss Denny aufkommen?<\/p>\n<p><strong>Schritt für Schritt.<\/strong><\/p>\n<p><strong>Ansprüche des Arbeitgebers gegen Denny, § 823 I.<\/strong>\nDer Dozent hakt das Schema Punkt für Punkt ab:\n- Verletzungshandlung: ✓ (Manipulation des Systems)\n- Rechtsgutsverletzung: ✓ (Eigentum / Nutzungsmöglichkeit / Vermögen)\n- Haftungsbegründende Kausalität: ✓\n- Rechtswidrigkeit: ✓\n- Verschulden: ✓ (<strong>Vorsatz<\/strong>)\n- Schaden: ✓<\/p>\n<p><strong>Und jetzt die haftungsausfüllende Kausalität, Posten für Posten:<\/strong><\/p>\n<ul>\n<li><strong>Releasewechsel 15.000 €:<\/strong> Die Kosten wären in einem halben Jahr <strong>ohnehin<\/strong> angefallen. Ist die Rechtsgutsverletzung wirklich ursächlich für diesen Schaden? Der Dozent sagt: <strong>wohl nein (-)<\/strong>. Denk den Trojaner weg — das Release hätte trotzdem Geld gekostet, nur später.<\/li>\n<li><strong>Entgangener Gewinn 25.000 €:<\/strong> <strong>✓ (+)<\/strong>, §§ 823 I, 249, 252. Diese Aufträge wären ohne den Angriff hereingekommen.<\/li>\n<\/ul>\n<p><strong>Anspruch des Konkurrenten gegen Denny, § 823 I — 12.000 €.<\/strong>\n- Verletzungshandlung: ✓\n- Rechtsgutsverletzung beim Konkurrenten: ✓\n- Haftungsbegründende Kausalität: Ohne Dennys Trojaner kein Schaden — „conditio sine qua non\" also ✓.\n- <strong>Aber die Adäquanz?<\/strong> Damit, dass sich jemand <strong>illegal<\/strong> auf seinen Rechner aufschaltet und dadurch mitgeschädigt wird, muss Denny nicht rechnen. Das ist völlig untypisch und <strong>unterbricht die Kausalkette<\/strong>.\n- → <strong>Kein Anspruch (-).<\/strong><\/p>\n<p><strong>Die Lösung des Dozenten<\/strong> (gekürzt):<\/p>\n<blockquote>\n<p>„<strong>Releasewechsel (15.000 EUR):<\/strong> Fraglich ist, ob die Kosten für den Releasewechsel einen kausal durch die Verletzungshandlung entstandenen Schaden darstellen, <strong>da sie in einem halben Jahr ohnehin angefallen wären.<\/strong> […] Hier wohl (-). <strong>Entgangener Gewinn (25.000 EUR): (+, §§ 823 I, 249, 252).<\/strong>\n<strong>Anspruch Konkurrent<\/strong> […] Zwar war die Verletzungshandlung conditio sine qua non für die Rechtsgutsverletzung bei K, jedoch ist die Frage, ob dem D diese Rechtsgutsverletzung im Sinne einer <strong>Adäquanz<\/strong> zuzurechnen ist. […] <strong>Insbesondere wird die Kausalkette durch das völlig unübliche, nicht erwartbare widerrechtliche Eingreifen des Dritten K unterbrochen.<\/strong> Damit liegt keine adäquat kausale Rechtgutsverletzung vor. (-)\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Das ist ein <strong>IT-Fall<\/strong> und damit ein wahrscheinlicher Klausurkandidat. Zwei Merksätze:<\/p>\n<ol>\n<li><strong>Ein Schaden, der sowieso eingetreten wäre, ist nicht kausal verursacht.<\/strong> (Wegdenken-Test: Fällt der Schaden weg, wenn ich die Handlung wegdenke?)<\/li>\n<li><strong>Das unerwartete rechtswidrige Eingreifen eines Dritten unterbricht die Adäquanz.<\/strong><\/li>\n<\/ol>\n<p>Und die Darstellungsform: Der Dozent hakt das Schema mit <strong>(+) und (−)<\/strong> ab. Mach das genauso — das ist schnell geschrieben und zeigt sofort, dass du das Schema beherrschst.<\/p>","text":"Hier gibt es keine Verträge . Die Pflichten entstehen, weil etwas passiert ist. Drei Normen tauchen auf: c.i.c. (Schutzpflichten vor dem Vertrag), § 812 (Rückholung), § 823 (Schaden). In dieser Sammlung steht auch das Bewertungsschema des Dozenten — siehe Fall c). Fall 07 a) — Malware auf der Shop-Website (c.i.c.) ★ Der Sachverhalt. Nancy stöbert auf der Website des Online-Shops von Jimmy nach einer Konsole. Bevor sie etwas bestellt, wird sie abgelenkt. Später ist ihr Tablet von Ransomware blockiert — sie muss 0,1 Bitcoin zahlen, um es wieder freizubekommen. Da ihr Virenscanner aktuell war, steht fest: Die Malware kam von der Website. Nancy verlangt Schadensersatz. Jimmy weigert sich: Er hatte mit ihr gar keinen Vertrag und die Malware nicht selbst installiert. Was gefragt ist. Muss Jimmy zahlen, obwohl nie ein Vertrag zustande kam? Schritt für Schritt. Jimmys Einwand trifft einen wahren Punkt: Es gab keinen Vertrag. Also kein vertraglicher Anspruch. Aber Schutzpflichten entstehen schon vorher . Vorvertragliches Schuldverhältnis, § 311 II Nr. 1. Durch Jimmys Angebot im Netz und Nancys Besuch mit Kaufabsicht ist ein Kontakt entstanden, an den das Gesetz Pflichten knüpft. (Der Alltagsklassiker dazu: Du rutschst im Supermarkt aus, bevor du etwas gekauft hast.) Pflichtverletzung, § 241 II. Zu den Rücksichtnahmepflichten gegenüber Kunden gehört es, die eigene Website ordentlich abzusichern. Das hat Jimmy unterlassen. Vertretenmüssen, § 276 I. Ob aus Nachlässigkeit (fahrlässig) oder aus Kostengründen bewusst (vorsätzlich) — beides reicht. Kausaler Schaden. Ohne die ungesicherte Seite kein Trojaner, ohne Trojaner keine Zahlung. → Anspruch aus §§ 311 II, 241 II, 280 . Ersetzt wird das negative Interesse (§ 122): Nancy wird so gestellt, als hätte es die Vertragsanbahnung nie gegeben. Das sind genau die 0,1 BTC. Die Lösung des Dozenten (gekürzt): „Nancy könnte einen Anspruch auf Schadensersatz in Höhe von 0,1 BTC gegen Jimmy aus §§ 311 II, 241 II Nr. 1, 280 „c.i.c.\" haben. […] Durch Jimmys Angebot im Netz und den Besuch von Nancy auf der Website, um eine Konsole zu kaufen, ist ein vorvertragliches Schuldverhältnis nach § 311 II Nr. 1 entstanden. Zu den Rücksichtnahmepflichten gegenüber potentiellen Kunden im Netz gehört es, die Angebotswebsites mit den bestmöglichen Virenschutzsystemen zu schützen. Dies hat Jimmy offenbar unterlassen („Pflichtverletzung\"). […] Ersatzfähig nach §§ 311 II, 241 II, 280 ist das negative Interesse (vgl. § 122) , nach der die Geschädigte so gestellt werden muss, als ob es die Vertragsverhandlungen niemals gegeben habe.\" Was du mitnimmst. Das ist ein IT-Fall in einer Informatik-Klausur — die Wahrscheinlichkeit, dass so etwas drankommt, ist überdurchschnittlich. Der Kernsatz: Schon wer einen Onlineshop betreibt, schuldet Besuchern IT-Sicherheit — auch ohne Vertrag. Fall 07 b) — Fake-Bewertungen bei Checking.com Der Sachverhalt. Denny sucht ein Hotel für einen Kurzurlaub. Bei Checking.com findet er ein Gasthaus mit 9,5/10 Bewertung . Er bucht schon mal Konzertkarten für 50 Euro . Dann zweifelt er an den Bewertungen und schreibt Rezensenten an — er bekommt nur gleichlautende Auto-Antworten von derselben Adresse . Er bucht gar nicht mehr und fährt stattdessen zur Tante an die Ostsee. Von Checking.com will er die 50 Euro für die nutzlosen Tickets. Schritt für Schritt. 1. § 311 II Nr. 1 — vorvertragliches Schuldverhältnis durch den Webshop und Dennys Buchungsabsicht. 2. § 241 II — dazu gehört auch das Interesse des Kunden an zutreffenden Informationen . Fake-Bewertungen verletzen das. 3. § 276 — das geschah vorsätzlich. 4. Kausalität. Hier liegt das eigentliche Problem: Denny hat die Reise ja selbst abgesagt. Unterbricht das die Kausalkette? Der Dozent sagt nein — dass jemand nach so einer Erfahrung die ganze Reise absagt, liegt nicht so fern, dass eine neue Ursachenkette begänne. Also adäquat kausal . 5. → Anspruch auf 50 Euro. Die Lösung des Dozenten (gekürzt): „Im Rahmen dieses Schuldverhältnisses muss auch das Interesse des D auf zutreffende Informationen als Kunde nach § 241 II beachtet werden. Dies hat C verletzt, in dem er Fake-Bewertungen selbst erstellt oder auf seiner Website zugelassen hat. […] Dass D von sich aus entschieden hat, die Reise ganz abzusagen, liegt in Bezug auf die negative Erfahrung beim Buchen nicht so fern, dass vom Beginn einer neuen Ursachenkette auszugehen wäre. Damit ist der Schaden adäquat kausal von der Pflichtverletzung verursacht worden.\" Was du mitnimmst. Die Adäquanz ist der Punkt, an dem solche Fälle kippen. Frag dich immer: War diese Folge noch typisch — oder völlig aus der Luft gegriffen? Vergleich dazu Fall 07 g), wo die Kausalkette tatsächlich unterbrochen wird. Fall 07 c) — Das Zahngold ★★ (mit dem Bewertungsschema!) Der Sachverhalt. Der 17-jährige Denny hatte von Geburt an ein schlechtes Gebiss. Seine Gold-Inlays wurden durch Keramik ersetzt; das Zahngold durfte er mitnehmen. Zu Hause schenkten ihm seine Eltern die Goldinlays als Wiedergutmachung für die Schmerzen. Denny verkauft das Gold sofort beim Goldankauf von Anneliese für 455 Euro in bar, um sich eine Switch 2 zu kaufen. Die Eltern sind nicht begeistert und lehnen den Verkauf nachträglich ab — sie hatten gedacht, er würde das Gold für sein Studium aufheben. Gesagt hatten sie ihm das aber nicht. Als Anneliese hört, dass Denny minderjährig war, will sie ihr Geld zurück, denn der Goldpreis ist inzwischen auf 400 Euro gefallen. Was gefragt ist. Kann Anneliese die 455 Euro zurückverlangen? — Achtung, die Frage geht in die für dich ungewohnte Richtung: nicht die Eltern wollen etwas, sondern die Käuferin. Schritt für Schritt. 1. Anspruchsgrundlage: § 812 I S. 1 1. Fall — hat Denny die 455 Euro ohne Rechtsgrund bekommen? 2. Rechtsgrund wäre der Kaufvertrag (§ 433). Der kam durch Angebot und Annahme zustande. 3. Denny ist 17 → § 106. Der Verkauf ist kein reiner Vorteil, die Eltern haben nicht eingewilligt → an sich § 108 schwebend unwirksam . 4. Aber § 110: Denny hat seine Leistung — die Übereignung des Goldes — mit Mitteln bewirkt, die ihm zur freien Verfügung überlassen worden waren. Die Eltern hatten ihm das Gold ja geschenkt. 5. Und: Die spätere Reue der Eltern ändert daran nichts . Einmal überlassen ist überlassen; die Einwilligung lässt sich nicht rückwirkend zurücknehmen. 6. → Der Kaufvertrag ist wirksam → es gibt einen Rechtsgrund → § 812 greift nicht. Anneliese bekommt nichts. Die Lösung des Dozenten (gekürzt): „Dennoch wäre der Vertrag nach § 110 wirksam zustande gekommen, wenn Denny die Gegenleistung […] mit Mitteln bewirkt hat, die ihm hierfür oder zur freien Vergütung überlassen worden sind. Die Eltern hatten ihm das Zahngold zur freien Verfügung gegeben. Eine spätere „Reue\" der Eltern ändert daran nichts mehr. Dementsprechend war der Vertrag wirksam zustande gekommen und es liegt ein Rechtsgrund vor. Somit ist auch kein Anspruch auf Herausgabe nach § 812 I, S. 1, 1 Fall gegeben.\" Und direkt darunter steht in den Unterlagen das Bewertungsschema: „(Und hier mein Bewertungsschema für die Klausur) Gesamtpunkte Falllösung 55 Jur. Methode (Gutachtenstil) 10 — Verstanden (ggfs. definiert) 5 · Umgesetzt 5 Anspruchsgrundlage 10 — Als erforderlich erkannt 3 · EINE AG gefunden 3 · § 812 4 Prüfung §§ 433, 108, 110 15 Prüfung Anfechtung, § 119 II 15 (hier nicht Teil der Lösung) Formulierung Ergebnis 5 \" Was du mitnimmst. Zwei Dinge, und beide sind wichtig: Inhaltlich: § 110 gilt nicht nur fürs Bezahlen mit Taschengeld. Auch eine Sache , die dem Minderjährigen zur freien Verfügung überlassen wurde, ist ein „Mittel\" im Sinne des § 110. Und Eltern können ihre Einwilligung nicht nachträglich zurückziehen. Für die Klausurstrategie: Schau dir die Punkteverteilung genau an. Für Methode + Anspruchsgrundlage + Ergebnisformulierung gibt es 25 von 55 Punkten — fast die Hälfte, und zwar unabhängig davon, ob dein Ergebnis richtig ist. Deshalb gilt: Immer eine Anspruchsgrundlage nennen, immer im Gutachtenstil, immer mit Schlusssatz — selbst wenn du inhaltlich unsicher bist. Fall 07 d) — Die 500 Euro fürs Zusammenziehen (Zweckverfehlung) Der Sachverhalt. Jimmy will nach vier Monaten Beziehung mit Nancy zusammenziehen. Ihr geht das zu schnell, und sie sagt, sie könne sich den Umzug sowieso nicht leisten. Daraufhin Jimmy: „Das Geld für den Umzug kann ich dir doch geben. Hier hast du 500 Euro .\" Als Nancy sich später traut zu sagen, dass sie gar nicht zusammenziehen will, verlangt Jimmy das Geld zurück. Schritt für Schritt. 1. § 812 I S. 1 1. Fall — hat Nancy die 500 Euro ohne Rechtsgrund bekommen? 2. Problem: Es gab vielleicht einen Rechtsgrund. Jimmy hat ihr das Geld ja gegeben — als Schenkung oder Darlehen. Beides wäre ein Rechtsgrund. 3. Aber: Jimmy hat mit der Zahlung einen bestimmten Zweck verfolgt — das Zusammenziehen. Dieser Zweck ist nicht eingetreten. 4. § 812 I S. 2 (2. Alt.): Der Nichteintritt des mit einer Leistung bezweckten Erfolgs steht den Fällen des Satzes 1 gleich. 5. → Anspruch auf Rückzahlung. Die Lösung des Dozenten. „Allerdings hatte sich Jimmy mit der Zahlung und den ggfs. zugrundeliegenden Rechtsgeschäften die Erreichung eines bestimmten Zweckes, nämlich des Zusammenziehens, vorgestellt. Der Nichteintritt des verfolgten Zwecks steht nach § 812 I, S. 2 den Fällen des S. 1 gleich , so dass ein entsprechender Anspruch gegeben ist.\" Was du mitnimmst. Das ist die dritte Variante des § 812 , die man leicht übersieht: die Zweckverfehlung . Merk dir alle drei: - § 812 I S. 1, 1. Alt. — durch Leistung (Leistungskondiktion) - § 812 I S. 1, 2. Alt. — in sonstiger Weise (Eingriffskondiktion) - § 812 I S. 2 — der bezweckte Erfolg tritt nicht ein (Zweckverfehlung) Fall 07 e) — Die dreifache Rückzahlung (Entreicherung) Der Sachverhalt. Anneliese hat bei RAZA einen Pulli für 85 Euro gekauft und zurückgeschickt. Durch einen Fehler im Zahllauf bekommt sie die Rückzahlung dreimal , also 255 Euro . Die Überzahlung kommt ihr gerade
