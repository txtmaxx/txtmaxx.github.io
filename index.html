<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wirtschaftsrecht I Lernblatt</title>
<meta name="description" content="Interaktives Lernblatt zu Recht und Datenschutz (Provadis, BIN-T23-F1): alle Kapitel, alle Uebungsfaelle Schritt fuer Schritt, Quiz und Karteikarten.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAFAFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1116" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%238A5410'/><text x='16' y='23' font-size='21' font-family='Georgia,serif' font-weight='600' fill='%23fff' text-anchor='middle'>%C2%A7</text></svg>">
<style>
/* ============================================================================
   Wirtschaftsrecht I — Lernblatt
   Farbwelt: Ocker (Recht, nach der Justitia-Grafik der Folien) / EU-Blau
   (Datenschutz). Quiz-Semantik separat, damit sie nicht mit den Fachfarben
   kollidiert. Neutrale leicht kuehl gebrochen.
   ========================================================================== */

:root {
  color-scheme: light;

  --ground:        #FAFAFC;
  --surface:       #FFFFFF;
  --surface-2:     #F1F2F7;
  --surface-3:     #E8EAF1;

  --ink:           #15171C;
  --ink-muted:     #5C6273;
  --ink-faint:     #8A90A2;

  --border:        #E2E4EE;
  --border-strong: #C7CAD9;

  --recht:         #8A5410;
  --recht-bright:  #B0721E;
  --recht-soft:    #F6EAD6;
  --ds:            #26428B;
  --ds-bright:     #34549F;
  --ds-soft:       #DFE5F6;

  --on-accent:     #FFFFFF;
  --ok:            #1A7247;
  --ok-soft:       #DCF0E5;
  --bad:           #B23429;
  --bad-soft:      #FAE4E1;

  --grid:          rgba(21, 23, 28, .045);
  --shadow:        0 1px 2px rgba(21,23,28,.05), 0 6px 18px -8px rgba(21,23,28,.13);
  --shadow-lg:     0 2px 6px rgba(21,23,28,.06), 0 22px 48px -20px rgba(21,23,28,.24);

  --accent:        var(--recht);
  --accent-bright: var(--recht-bright);
  --accent-soft:   var(--recht-soft);

  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:  ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --rail: 304px;
  --top:  58px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:        #0F1116;
    --surface:       #161922;
    --surface-2:     #1D212C;
    --surface-3:     #262B38;
    --ink:           #E7EAF2;
    --ink-muted:     #A2A9BB;
    --ink-faint:     #767D90;
    --border:        #292E3B;
    --border-strong: #3B4153;
    --recht:         #E3AC63;
    --recht-bright:  #F0BC77;
    --recht-soft:    #33280F;
    --ds:            #92AAEE;
    --ds-bright:     #A9BDF5;
    --ds-soft:       #1B2440;
    --on-accent:     #12141A;
    --on-accent:     #12141A;
  --ok:            #5CC98F;
    --ok-soft:       #14301F;
    --bad:           #EF8D80;
    --bad-soft:      #351B18;
    --grid:          rgba(231, 234, 242, .05);
    --shadow:        0 1px 2px rgba(0,0,0,.4), 0 6px 18px -8px rgba(0,0,0,.6);
    --shadow-lg:     0 2px 6px rgba(0,0,0,.45), 0 22px 48px -20px rgba(0,0,0,.75);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:        #0F1116;
  --surface:       #161922;
  --surface-2:     #1D212C;
  --surface-3:     #262B38;
  --ink:           #E7EAF2;
  --ink-muted:     #A2A9BB;
  --ink-faint:     #767D90;
  --border:        #292E3B;
  --border-strong: #3B4153;
  --recht:         #E3AC63;
  --recht-bright:  #F0BC77;
  --recht-soft:    #33280F;
  --ds:            #92AAEE;
  --ds-bright:     #A9BDF5;
  --ds-soft:       #1B2440;
  --ok:            #5CC98F;
  --ok-soft:       #14301F;
  --bad:           #EF8D80;
  --bad-soft:      #351B18;
  --grid:          rgba(231, 234, 242, .05);
  --shadow:        0 1px 2px rgba(0,0,0,.4), 0 6px 18px -8px rgba(0,0,0,.6);
  --shadow-lg:     0 2px 6px rgba(0,0,0,.45), 0 22px 48px -20px rgba(0,0,0,.75);
}

[data-subject="faelle"] {
  --accent: var(--recht); --accent-bright: var(--recht-bright); --accent-soft: var(--recht-soft);
}

[data-subject="ds"] {
  --accent: var(--ds); --accent-bright: var(--ds-bright); --accent-soft: var(--ds-soft);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; border-radius: 3px; }

/* ------------------------------------------------------------------ Topbar */
.topbar {
  position: sticky; top: 0; z-index: 60;
  height: var(--top);
  display: flex; align-items: center; gap: 14px;
  min-width: 0; overflow: hidden;
  padding: 0 16px;
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(12px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: baseline; gap: 9px; font-family: var(--serif); text-decoration: none; color: inherit; }
.brand b { font-size: 17px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.brand span { font-size: 11.5px; color: var(--ink-faint); font-family: var(--sans); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }

.modes { display: flex; gap: 2px; flex: 0 1 auto; min-width: 0; padding: 3px; background: var(--surface-2); border-radius: 9px; margin-left: auto; }
.modes button {
  font: 500 13px var(--sans); color: var(--ink-muted);
  background: none; border: 0; padding: 6px 13px; border-radius: 7px; cursor: pointer;
  transition: background .14s, color .14s;
}
.modes button:hover { color: var(--ink); }
.modes button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.tools { display: flex; align-items: center; gap: 8px; flex: none; }
.searchwrap { position: relative; }
.searchwrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); pointer-events: none; }
#search {
  font: 400 13.5px var(--sans); color: var(--ink);
  background: var(--surface-2); border: 1px solid transparent; border-radius: 8px;
  padding: 7px 10px 7px 30px; width: 210px;
  transition: border-color .14s, background .14s;
}
#search::placeholder { color: var(--ink-faint); }
#search:focus { outline: none; border-color: var(--accent-bright); background: var(--surface); }
kbd {
  font: 500 10.5px var(--mono); color: var(--ink-faint);
  background: var(--surface-3); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px; white-space: nowrap;
}
.searchwrap kbd { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); }
#search:focus + kbd { opacity: 0; }

.iconbtn {
  display: grid; place-items: center; width: 34px; height: 34px;
  background: var(--surface-2); border: 1px solid transparent; border-radius: 8px;
  color: var(--ink-muted); cursor: pointer; transition: color .14s, background .14s;
}
.iconbtn:hover { color: var(--ink); background: var(--surface-3); }
#menubtn { display: none; }

.progressbar { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--accent); width: 0; transition: width .2s ease-out; }

/* ----------------------------------------------------------------- Sidebar */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); }

.rail {
  position: sticky; top: var(--top); align-self: start;
  height: calc(100vh - var(--top));
  overflow-y: auto; overscroll-behavior: contain;
  border-right: 1px solid var(--border);
  padding: 18px 12px 60px;
  background: var(--surface);
}
.railgroup + .railgroup { margin-top: 22px; }
.railhead {
  display: flex; align-items: center; gap: 8px;
  padding: 0 10px 8px; margin-bottom: 4px;
  font: 600 11px var(--sans); letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-faint);
}
.railhead .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.railhead .dot.r { background: var(--recht); }
.railhead .dot.d { background: var(--ds); }
/* Die Uebungsfaelle gehoeren inhaltlich zum Rechtsteil — gleiche Farbe,
   aber als Ring, damit die Gruppe in der Navigation unterscheidbar bleibt. */
.railhead .dot.f { background: transparent; box-shadow: inset 0 0 0 2px var(--recht); }
.railhead .count { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; font-weight: 500; }

.rail a {
  display: flex; align-items: center; gap: 9px;
  padding: 6.5px 10px; border-radius: 7px;
  font-size: 13.5px; line-height: 1.35; color: var(--ink-muted); text-decoration: none;
  transition: background .12s, color .12s;
}
.rail a:hover { background: var(--surface-2); color: var(--ink); }
.rail a.active { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.rail a .num {
  flex: none; width: 22px; text-align: right;
  font: 500 11.5px var(--mono); color: var(--ink-faint); font-variant-numeric: tabular-nums;
}
.rail a.active .num { color: var(--accent); }
.rail a .label { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rail a .tick { flex: none; margin-left: auto; color: var(--ok); opacity: 0; transition: opacity .15s; }
.rail a.done .tick { opacity: 1; }
.rail a.done .label { color: var(--ink-faint); }
.rail a.hidden { display: none; }

/* -------------------------------------------------------------------- Main */
main { min-width: 0; padding: 0 0 120px; }
.view[hidden] { display: none; }

.doc { max-width: 78ch; margin: 0 auto; padding: 40px 32px 0; }

.dochead { margin-bottom: 30px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
.eyebrow {
  display: inline-flex; align-items: center; gap: 7px; margin-bottom: 12px;
  font: 600 11px var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--accent);
}
.eyebrow::before { content: "§"; font-family: var(--serif); font-size: 15px; letter-spacing: 0; }
.doc h2.title {
  font-family: var(--serif); font-size: clamp(27px, 3.6vw, 38px); font-weight: 600;
  line-height: 1.16; letter-spacing: -.018em; margin: 0 0 12px; text-wrap: balance;
}
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 12.5px; color: var(--ink-faint); }
.meta .readtoggle {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-muted);
  border-radius: 999px; padding: 4px 11px 4px 8px; font: 500 12px var(--sans);
  transition: border-color .14s, color .14s, background .14s;
}
.meta .readtoggle:hover { border-color: var(--border-strong); color: var(--ink); }
.meta .readtoggle[aria-pressed="true"] { background: var(--ok-soft); border-color: transparent; color: var(--ok); }

/* ---------------------------------------------------------------- Fliesstext */
.prose { font-family: var(--serif); font-size: 17px; line-height: 1.68; }
.prose > * { margin: 0; }
.prose > * + * { margin-top: 1.05em; }
.prose > :first-child { margin-top: 0; }
.prose blockquote > p { margin: 0; }
.prose blockquote > p + p { margin-top: .7em; }
.prose li > p { margin: 0; }
.prose h3 {
  font-family: var(--serif); font-size: 22.5px; font-weight: 600; letter-spacing: -.012em;
  line-height: 1.28; margin: 2.1em 0 0; padding-top: .55em; border-top: 1px solid var(--border);
  text-wrap: balance; scroll-margin-top: calc(var(--top) + 16px);
}
.prose h3:first-child { margin-top: 0; border-top: 0; padding-top: 0; }
.prose h4 {
  font-family: var(--sans); font-size: 13px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-muted); margin: 1.9em 0 0; scroll-margin-top: calc(var(--top) + 16px);
}
.prose strong { font-weight: 650; color: var(--ink); }
.prose em { font-style: italic; }
.prose a { color: var(--accent); text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 2px; }
.prose a:hover { text-decoration-color: var(--accent); }

.prose ul, .prose ol { padding-left: 1.35em; }
.prose li { margin: .35em 0; }
.prose li::marker { color: var(--ink-faint); }

.prose blockquote {
  margin: 1.5em 0 0; padding: 2px 0 2px 20px;
  border-left: 2.5px solid var(--accent);
  color: var(--ink-muted); font-size: 16px;
}
.prose blockquote strong { color: var(--ink); }

/* Der Einstieg ist MEINE Erklaerung, das normale Zitat ist der Originaltext
   des Dozenten. Beides muss auf einen Blick unterscheidbar sein. */
.prose blockquote.intro {
  border-left: 0; border-radius: 12px;
  background: var(--accent-soft);
  padding: 18px 20px;
  color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.6;
}
.prose blockquote.intro .lead {
  display: block; margin-bottom: 8px;
  font: 600 10.5px var(--sans); letter-spacing: .09em; text-transform: uppercase;
  color: var(--accent);
}
.prose blockquote.intro p + p { margin-top: .7em; }

.prose code {
  font: 500 .86em var(--mono); background: var(--surface-2);
  padding: .12em .38em; border-radius: 4px; color: var(--ink);
  border: 1px solid var(--border);
}
.prose pre {
  margin: 1.5em 0 0; padding: 16px 18px; overflow-x: auto;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
}
.prose pre code {
  font: 400 13px/1.62 var(--mono); background: none; border: 0; padding: 0;
  color: var(--ink); white-space: pre;
}
.prose hr { margin: 2.4em 0 0; border: 0; border-top: 1px solid var(--border); }

.tablewrap { margin: 1.5em 0 0; overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.prose table { border-collapse: collapse; width: 100%; font-family: var(--sans); font-size: 13.8px; line-height: 1.5; }
.prose thead th {
  position: sticky; top: 0;
  text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase;
  color: var(--ink-faint); background: var(--surface-2);
  padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap;
}
.prose tbody td { padding: 10px 14px; border-top: 1px solid var(--border); vertical-align: top; }
.prose tbody tr:first-child td { border-top: 0; }
.prose tbody tr:hover { background: var(--surface-2); }
.prose td strong { font-weight: 600; }
.prose td:first-child { color: var(--ink); }

/* Zellen, die nur aus einem Symbol/Paragraf bestehen, sauber ausrichten */
.prose td.sym { text-align: center; font-size: 15px; white-space: nowrap; }
.yes { color: var(--ok); font-weight: 700; }
.no  { color: var(--bad); font-weight: 700; }

/* ------------------------------------------------------------ Suchergebnisse */
.results { max-width: 78ch; margin: 0 auto; padding: 32px; }
.results h3 { font-family: var(--serif); font-size: 20px; margin: 0 0 4px; }
.results .hint { color: var(--ink-faint); font-size: 13.5px; margin: 0 0 22px; }
.hit {
  display: block; text-decoration: none; color: inherit;
  padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); margin-bottom: 10px; transition: border-color .14s, transform .14s;
}
.hit:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.hit .where { font: 600 10.5px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.hit h4 { font-family: var(--serif); font-size: 17px; font-weight: 600; margin: 3px 0 5px; }
.hit p { margin: 0; font-size: 13.5px; color: var(--ink-muted); line-height: 1.55; }
mark { background: var(--accent-soft); color: var(--ink); padding: 0 2px; border-radius: 3px; }

/* --------------------------------------------------------- Quiz & Karteikarten */
.pad { max-width: 720px; margin: 0 auto; padding: 40px 24px 0; }
.pad.wide { max-width: 880px; }

.panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 26px; box-shadow: var(--shadow);
}
.panel.grid {
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  background-position: -1px -1px;
}
.panel h3 { font-family: var(--serif); font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
.panel .sub { color: var(--ink-muted); font-size: 14px; margin: 0 0 22px; line-height: 1.55; }

.field { margin-bottom: 18px; }
.field > label { display: block; font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  font: 500 13px var(--sans); color: var(--ink-muted);
  background: var(--surface-2); border: 1px solid transparent; border-radius: 8px;
  padding: 7px 13px; cursor: pointer; transition: all .14s;
}
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--ink); font-weight: 600; }
.chip .n { font-variant-numeric: tabular-nums; color: var(--ink-faint); margin-left: 5px; font-weight: 400; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 600 14.5px var(--sans); border: 0; border-radius: 10px; padding: 12px 22px;
  background: var(--accent); color: var(--on-accent); cursor: pointer;
  transition: filter .14s, transform .06s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.ghost:hover { background: var(--surface-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.quizbar { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; font-size: 13px; color: var(--ink-muted); }
.quizbar .track { flex: 1; height: 5px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.quizbar .fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
.quizbar .tally { font-variant-numeric: tabular-nums; white-space: nowrap; }
.quizbar .tally .g { color: var(--ok); font-weight: 700; }
.quizbar .tally .b { color: var(--bad); font-weight: 700; }

.qtopic { font: 600 10.5px var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
.qtext { font-family: var(--serif); font-size: clamp(19px, 2.6vw, 24px); line-height: 1.42; margin: 0 0 26px; text-wrap: pretty; }

.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tf button {
  font: 600 15px var(--sans); padding: 16px; border-radius: 11px; cursor: pointer;
  background: var(--surface-2); border: 1.5px solid transparent; color: var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 9px;
  transition: all .14s;
}
.tf button:hover:not(:disabled) { border-color: var(--border-strong); }
.tf button:disabled { cursor: default; }
.tf button .k { font: 500 10.5px var(--mono); color: var(--ink-faint); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
.tf button.pickedRight { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.tf button.pickedWrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.tf button.wasRight { border-color: var(--ok); color: var(--ok); }

.verdict { margin-top: 18px; padding: 15px 17px; border-radius: 11px; font-size: 14.5px; line-height: 1.6; }
.verdict.good { background: var(--ok-soft); color: var(--ok); }
.verdict.bad  { background: var(--bad-soft); color: var(--bad); }
.verdict b { display: block; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 4px; }
.verdict .note { color: var(--ink); }

.actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

.score { text-align: center; padding: 12px 0 26px; }
.score .big { font-family: var(--serif); font-size: 60px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.score .of { font-size: 15px; color: var(--ink-muted); margin-top: 8px; }
.score .pct { display: inline-block; margin-top: 14px; padding: 5px 14px; border-radius: 999px; font: 600 13px var(--sans); }
.score .pct.good { background: var(--ok-soft); color: var(--ok); }
.score .pct.mid  { background: var(--accent-soft); color: var(--accent); }
.score .pct.bad  { background: var(--bad-soft); color: var(--bad); }

.review { margin-top: 8px; }
.review h4 { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin: 22px 0 10px; }
.rev {
  padding: 13px 15px; border-radius: 10px; background: var(--surface-2);
  border-left: 3px solid var(--bad); margin-bottom: 9px; font-size: 14px; line-height: 1.55;
}
.rev .s { display: block; margin-bottom: 5px; }
.rev .t { font-size: 12.5px; color: var(--ink-muted); }

/* Karteikarte */
.card {
  position: relative; min-height: 260px; display: flex; flex-direction: column; justify-content: center;
  cursor: pointer; user-select: none;
}
.card .side { font: 600 10.5px var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
.card .q { font-family: var(--serif); font-size: clamp(20px, 2.8vw, 26px); line-height: 1.38; margin: 0; text-wrap: pretty; }
.card .a {
  margin: 22px 0 0; padding-top: 20px; border-top: 1px solid var(--border);
  font-family: var(--serif); font-size: 17.5px; line-height: 1.62; color: var(--ink);
}
.card .a strong { font-weight: 650; }
.card .flip { margin-top: 22px; font-size: 12.5px; color: var(--ink-faint); display: flex; align-items: center; gap: 7px; }

.emptynote { color: var(--ink-muted); font-size: 14.5px; line-height: 1.6; }

/* ------------------------------------------------------------------ Mobile */
@media (max-width: 1000px) {
  :root { --rail: 268px; }
  #search { width: 160px; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  #menubtn { display: grid; }
  .rail {
    position: fixed; top: var(--top); left: 0; width: 300px; z-index: 55;
    transform: translateX(-101%); transition: transform .22s ease;
    box-shadow: var(--shadow-lg);
  }
  body.navopen .rail { transform: none; }
  body.navopen::after {
    content: ""; position: fixed; inset: var(--top) 0 0; background: rgba(0,0,0,.34); z-index: 54;
  }
  .brand span { display: none; }
  .doc { padding: 28px 20px 0; }
  .modes button { padding: 6px 10px; font-size: 12.5px; }
  .searchwrap kbd { display: none; }
  #search { width: 44px; padding-right: 8px; }
  #search:focus { width: 190px; }
  .prose { font-size: 16.5px; }
}
@media (max-width: 600px) {
  .topbar { gap: 7px; padding: 0 10px; }
  /* Die Wortmarke weicht — Hamburger und Kapiteltitel sagen genug,
     und die drei Modus-Schalter brauchen den Platz. */
  .brand { display: none; }
  .modes { margin-left: 0; flex: 1; justify-content: center; }
  .modes button { padding: 6px 9px; font-size: 12.5px; }
  #search { width: 38px; }
  #search:focus { width: 150px; }
  .tf { grid-template-columns: 1fr; }
  .pad { padding: 24px 16px 0; }
  .panel { padding: 20px; }
  .score .big { font-size: 48px; }
}

/* ------------------------------------------------------------------- Print */
@media print {
  .topbar, .rail, .modes, .tools, .meta .readtoggle { display: none !important; }
  .shell { display: block; }
  .doc { max-width: none; padding: 0; }
  .view[hidden] { display: block !important; }
  .prose h3 { break-after: avoid; }
  .tablewrap, .prose pre, .prose blockquote { break-inside: avoid; }
  body { background: #fff; color: #000; }
}

window.DATA = {"sections":[{"id":"r-inhaltsverzeichnis","subject":"recht","num":null,"title":"Inhaltsverzeichnis","short":"Inhaltsverzeichnis","html":"<table>\n<thead>\n<tr>\n<th>Kap.<\/th>\n<th>Thema<\/th>\n<th>§§<\/th>\n<th>Gewicht<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>0<\/strong><\/td>\n<td><a href=\"#r-0-klausur-cockpit\">Klausur-Cockpit: Format, Punkte, Zeitplan<\/a><\/td>\n<td>–<\/td>\n<td>Pflicht<\/td>\n<\/tr>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td><a href=\"#r-1-privatrecht-vs-öffentliches-recht\">Privatrecht vs. Öffentliches Recht<\/a><\/td>\n<td>–<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td><a href=\"#r-2-ziel-des-zivilrechts--aufbau-des-bgb\">Ziel des Zivilrechts + Aufbau des BGB<\/a><\/td>\n<td>§§ 1, 21, 705<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td><a href=\"#r-3-juristische-methode\">Juristische Methode: Gutachtenstil + Anspruchsaufbau<\/a><\/td>\n<td>–<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>4<\/strong><\/td>\n<td><a href=\"#r-4-die-willenserklärung-we\">Willenserklärung<\/a><\/td>\n<td>§§ 133, 157<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>5<\/strong><\/td>\n<td><a href=\"#r-5-wirksamwerden-durch-zugang\">Wirksamwerden durch Zugang<\/a><\/td>\n<td>§§ 130, 147, 162<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>6<\/strong><\/td>\n<td><a href=\"#r-6-geschäftsfähigkeit--minderjährigenrecht\">Minderjährigenrecht<\/a><\/td>\n<td>§§ 104–113<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>7<\/strong><\/td>\n<td><a href=\"#r-7-abstraktionsprinzip\">Abstraktionsprinzip<\/a><\/td>\n<td>§§ 433, 929<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>8<\/strong><\/td>\n<td><a href=\"#r-8-unwirksamkeitsgründe\">Unwirksamkeit: Form &amp; Inhalt<\/a><\/td>\n<td>§§ 125–138<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td><strong>9<\/strong><\/td>\n<td><a href=\"#r-9-vertragsschluss\">Vertragsschluss<\/a><\/td>\n<td>§§ 145–157, 305<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>10<\/strong><\/td>\n<td><a href=\"#r-10-stellvertretung--bote\">Stellvertretung &amp; Bote<\/a><\/td>\n<td>§§ 164–181<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>11<\/strong><\/td>\n<td><a href=\"#r-11-anfechtung\">Anfechtung<\/a><\/td>\n<td>§§ 119–124, 142<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>12<\/strong><\/td>\n<td><a href=\"#r-12-widerruf\">Widerruf<\/a><\/td>\n<td>§§ 312g, 355<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td><strong>13<\/strong><\/td>\n<td><a href=\"#r-13-rücktritt\">Rücktritt<\/a><\/td>\n<td>§§ 323, 346<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td><strong>14<\/strong><\/td>\n<td><a href=\"#r-14-leistungsstörungen\">Leistungsstörungen / Verzug<\/a><\/td>\n<td>§§ 275, 286<\/td>\n<td>★<\/td>\n<\/tr>\n<tr>\n<td><strong>15<\/strong><\/td>\n<td><a href=\"#r-15-gesetzliche-schuldverhältnisse\">Gesetzliche Schuldverhältnisse<\/a><\/td>\n<td>§§ 311 II, 812, 823<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>16<\/strong><\/td>\n<td><a href=\"#r-16-vertragstypen--erfüllung\">Vertragstypen &amp; Erfüllung<\/a><\/td>\n<td>§§ 433, 631, 929<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td><strong>A<\/strong><\/td>\n<td><a href=\"#r-anhang-a-post-it-plan\">Post-it-Plan fürs BGB<\/a><\/td>\n<td>–<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td><strong>B<\/strong><\/td>\n<td><a href=\"#r-anhang-b-fehler-in-den-folien\">Fehler in den Folien<\/a><\/td>\n<td>–<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td><strong>C<\/strong><\/td>\n<td><a href=\"#r-anhang-c-probeklausur\">Probeklausur-Vorbereitung<\/a><\/td>\n<td>–<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td><strong>D<\/strong><\/td>\n<td><a href=\"#r-anhang-d-selbsttest\">Selbsttest<\/a><\/td>\n<td>–<\/td>\n<td>–<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Kap. Thema §§ Gewicht 0 Klausur-Cockpit: Format, Punkte, Zeitplan – Pflicht 1 Privatrecht vs. Öffentliches Recht – ★★ 2 Ziel des Zivilrechts + Aufbau des BGB §§ 1, 21, 705 ★★ 3 Juristische Methode: Gutachtenstil + Anspruchsaufbau – ★★★ 4 Willenserklärung §§ 133, 157 ★★★ 5 Wirksamwerden durch Zugang §§ 130, 147, 162 ★★★ 6 Minderjährigenrecht §§ 104–113 ★★★ 7 Abstraktionsprinzip §§ 433, 929 ★★★ 8 Unwirksamkeit: Form & Inhalt §§ 125–138 ★★ 9 Vertragsschluss §§ 145–157, 305 ★★★ 10 Stellvertretung & Bote §§ 164–181 ★★★ 11 Anfechtung §§ 119–124, 142 ★★★ 12 Widerruf §§ 312g, 355 ★★ 13 Rücktritt §§ 323, 346 ★★ 14 Leistungsstörungen / Verzug §§ 275, 286 ★ 15 Gesetzliche Schuldverhältnisse §§ 311 II, 812, 823 ★★★ 16 Vertragstypen & Erfüllung §§ 433, 631, 929 ★★ A Post-it-Plan fürs BGB – – B Fehler in den Folien – – C Probeklausur-Vorbereitung – – D Selbsttest – –","words":151,"mins":1},{"id":"r-vorbemerkung-was-ich-an-deiner-themenliste-korrigiert-habe","subject":"recht","num":null,"title":"Vorbemerkung: Was ich an deiner Themenliste korrigiert habe","short":"Vorbemerkung: Was ich an deiner Themenliste korrigiert habe","html":"<p>Du hast gesagt, ich soll deine KI-erstellte Liste <strong>nicht<\/strong> einfach übernehmen. Habe ich nicht. Ergebnis:<\/p>\n<p><strong>Drei echte Lücken — die habe ich ergänzt:<\/strong><\/p>\n<ol>\n<li><strong>Der Anspruchsaufbau (Folie 12) fehlte komplett.<\/strong> Deine Liste kennt nur „Obersatz → Definition → Subsumtion → Ergebnis\" (Folie 11). Aber Folie 12 ist die zweite Hälfte derselben Methode: <em>Anspruch entstanden → erloschen → durchsetzbar<\/em>, mit Einwendungen und Einreden. Genau das sind die <strong>10 Methodenpunkte<\/strong>. Ohne diese Folie schreibst du ein halbes Gutachten. → jetzt <strong>Kapitel 3<\/strong>.<\/li>\n<li><strong>Leistungsstörungen / Verzug fehlten ganz.<\/strong> Folien 29 und 30, inklusive einem kompletten Prüfungsschema für den Verzug. → jetzt <strong>Kapitel 14<\/strong>.<\/li>\n<li><strong>Rücktritt ist NICHT „nur eine Überschrift\".<\/strong> Folie 28 führt ihn vollständig aus (§§ 346, 323, 324, 326 V, 325), und es gibt eine <strong>eigene Fallsammlung „09 Fälle Rücktritt\"<\/strong> mit zwei Fällen und zwei abfotografierten Flipcharts, auf denen der Dozent das Schema per Hand aufgemalt hat. Das ist genau umgekehrt zu deiner Annahme. → jetzt <strong>Kapitel 13<\/strong> mit dem Original-Schema.<\/li>\n<\/ol>\n<p><strong>Eine Fehlermeldung in deiner Liste stimmt nicht:<\/strong><\/p>\n<blockquote>\n<p>„ACHTUNG Fehler in einer Foliequelle: Schmerzensgeld steht in § 253 II, NICHT in § 252\"<\/p>\n<\/blockquote>\n<p>Folie 25 schreibt korrekt: <em>„ein Schaden … §§ 249, 252\"<\/em> und getrennt davon <em>„Schmerzensgeld, § 253\"<\/em>. <strong>In den Folien ist da kein Fehler.<\/strong> Die Warnung stammt aus deiner eigenen KI-Lernübersicht, die nur klarstellen wollte, dass § 252 der entgangene Gewinn ist. Beides ist inhaltlich richtig — es gibt nur nichts zu korrigieren.<\/p>\n<p><strong>Deine „BGB Lernübersicht.pdf\" und die „Post-its.xlsx\" sind nicht vom Dozenten.<\/strong> Beide enthalten wörtlich dieselben KI-Anmerkungen wie deine Themenliste („Folie schreibt 'StrVG'\", „Achtung: NICHT Schmerzensgeld!\"). Inhaltlich sind sie zu ~90 % korrekt, aber sie sind <strong>keine Prüfungsquelle<\/strong>. Ich habe dieses Lernblatt deshalb aus den Folien und den Übungsfällen gebaut und die Übersicht nur als Gegencheck benutzt.<\/p>\n<p><strong>Deine Beobachtung „je später im Semester, desto unwichtiger\" ist riskant.<\/strong> Der Dozent hat für Rücktritt und Leistungsstörungen eigene Fallsammlungen gemacht — das macht man nicht für Randthemen. Was tatsächlich Randmaterial ist: die Gerichtsbarkeiten-Folie (5) und die BGH-AGB-Beispiele (18). Da hast du recht.<\/p>\n<p><strong>Was du zusätzlich draufhaben solltest<\/strong> (steht in den Folien/Fällen, fehlte bei dir):\n§ 112, § 113 (weitere Minderjährigen-Ausnahmen) · <strong>§ 241a unbestellte Leistung<\/strong> (kommt in <em>zwei<\/em> Übungsfällen vor!) · § 812 I S. 2 <strong>Zweckverfehlung<\/strong> (Fall 07d) · § 243 Gattungsschuld + § 447 Versendungskauf (Fall 05d) · § 631/632 Werkvertrag (Fälle 06c, 09a) · § 179 III (Fall 06b) · „Fehleridentität beim Verfügungsgeschäft\" (Folie 26).<\/p>","text":"Du hast gesagt, ich soll deine KI-erstellte Liste nicht einfach übernehmen. Habe ich nicht. Ergebnis: Drei echte Lücken — die habe ich ergänzt: Der Anspruchsaufbau (Folie 12) fehlte komplett. Deine Liste kennt nur „Obersatz → Definition → Subsumtion → Ergebnis\" (Folie 11). Aber Folie 12 ist die zweite Hälfte derselben Methode: Anspruch entstanden → erloschen → durchsetzbar , mit Einwendungen und Einreden. Genau das sind die 10 Methodenpunkte . Ohne diese Folie schreibst du ein halbes Gutachten. → jetzt Kapitel 3 . Leistungsstörungen / Verzug fehlten ganz. Folien 29 und 30, inklusive einem kompletten Prüfungsschema für den Verzug. → jetzt Kapitel 14 . Rücktritt ist NICHT „nur eine Überschrift\". Folie 28 führt ihn vollständig aus (§§ 346, 323, 324, 326 V, 325), und es gibt eine eigene Fallsammlung „09 Fälle Rücktritt\" mit zwei Fällen und zwei abfotografierten Flipcharts, auf denen der Dozent das Schema per Hand aufgemalt hat. Das ist genau umgekehrt zu deiner Annahme. → jetzt Kapitel 13 mit dem Original-Schema. Eine Fehlermeldung in deiner Liste stimmt nicht: „ACHTUNG Fehler in einer Foliequelle: Schmerzensgeld steht in § 253 II, NICHT in § 252\" Folie 25 schreibt korrekt: „ein Schaden … §§ 249, 252\" und getrennt davon „Schmerzensgeld, § 253\" . In den Folien ist da kein Fehler. Die Warnung stammt aus deiner eigenen KI-Lernübersicht, die nur klarstellen wollte, dass § 252 der entgangene Gewinn ist. Beides ist inhaltlich richtig — es gibt nur nichts zu korrigieren. Deine „BGB Lernübersicht.pdf\" und die „Post-its.xlsx\" sind nicht vom Dozenten. Beide enthalten wörtlich dieselben KI-Anmerkungen wie deine Themenliste („Folie schreibt 'StrVG'\", „Achtung: NICHT Schmerzensgeld!\"). Inhaltlich sind sie zu ~90 % korrekt, aber sie sind keine Prüfungsquelle . Ich habe dieses Lernblatt deshalb aus den Folien und den Übungsfällen gebaut und die Übersicht nur als Gegencheck benutzt. Deine Beobachtung „je später im Semester, desto unwichtiger\" ist riskant. Der Dozent hat für Rücktritt und Leistungsstörungen eigene Fallsammlungen gemacht — das macht man nicht für Randthemen. Was tatsächlich Randmaterial ist: die Gerichtsbarkeiten-Folie (5) und die BGH-AGB-Beispiele (18). Da hast du recht. Was du zusätzlich draufhaben solltest (steht in den Folien/Fällen, fehlte bei dir): § 112, § 113 (weitere Minderjährigen-Ausnahmen) · § 241a unbestellte Leistung (kommt in zwei Übungsfällen vor!) · § 812 I S. 2 Zweckverfehlung (Fall 07d) · § 243 Gattungsschuld + § 447 Versendungskauf (Fall 05d) · § 631/632 Werkvertrag (Fälle 06c, 09a) · § 179 III (Fall 06b) · „Fehleridentität beim Verfügungsgeschäft\" (Folie 26).","words":401,"mins":2},{"id":"r-0-klausur-cockpit","subject":"recht","num":"0","title":"0. Klausur-Cockpit","short":"Klausur-Cockpit","html":"<h3 id=\"r-01-das-original-bewertungsschema\">0.1 Das Original-Bewertungsschema<\/h3>\n<p>Das ist <strong>kein Gerücht<\/strong> — der Dozent hat es selbst in die Lösung von Übungsfall 07c geschrieben:<\/p>\n<blockquote>\n<p>„(Und hier mein Bewertungsschema für die Klausur)\nGesamtpunkte Falllösung <strong>55<\/strong>\nJur. Methode (Gutachtenstil) <strong>10<\/strong> — Verstanden (ggfs. definiert) 5 · Umgesetzt 5\nAnspruchsgrundlage <strong>10<\/strong> — Als erforderlich erkannt 3 · EINE AG gefunden 3 · § 812 4\nPrüfung §§ 433, 108, 110 <strong>15<\/strong>\nPrüfung Anfechtung, § 119 II <strong>15<\/strong> (hier nicht Teil der Lösung)\nFormulierung Ergebnis <strong>5<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Was daraus folgt — lies das zweimal:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Punkte<\/th>\n<th>Wofür<\/th>\n<th>Was du dafür tun musst<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>10<\/strong><\/td>\n<td>Methode<\/td>\n<td>Gutachtenstil erkennbar durchziehen. Konjunktiv, dann definieren, dann subsumieren.<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td>„Als erforderlich erkannt\"<\/td>\n<td>Den Satz „Anspruchsgrundlage hierfür könnte … sein\" überhaupt schreiben.<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td>„EINE AG gefunden\"<\/td>\n<td>Irgendeine vertretbare Anspruchsgrundlage nennen.<\/td>\n<\/tr>\n<tr>\n<td><strong>4<\/strong><\/td>\n<td>Die <em>richtige<\/em> AG<\/td>\n<td>Die passende Norm treffen.<\/td>\n<\/tr>\n<tr>\n<td><strong>5<\/strong><\/td>\n<td>Ergebnis formulieren<\/td>\n<td>Am Ende einen sauberen Schlusssatz („Folglich hat X einen Anspruch …\").<\/td>\n<\/tr>\n<tr>\n<td><strong>30<\/strong><\/td>\n<td>Inhalt<\/td>\n<td>Die eigentliche Prüfung der Normen.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>25 von 55 Punkten (45 %) bekommst du für Form, Struktur und Formulierung — unabhängig davon, ob dein Ergebnis stimmt.<\/strong> Ein formal sauberes Gutachten mit falschem Ergebnis schlägt ein richtiges Ergebnis in Stichworten. Wenn du in der Klausur nicht weiterweißt: <strong>schreib trotzdem die Struktur hin.<\/strong><\/p>\n<h3 id=\"r-02-zeitplan-fur-60-minuten\">0.2 Zeitplan für 60 Minuten<\/h3>\n<table>\n<thead>\n<tr>\n<th>Zeit<\/th>\n<th>Was<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–3 min<\/td>\n<td>Ganze Klausur überfliegen. Datenschutz-T/F zuerst? Nein — erst Fall lesen, dann entscheiden.<\/td>\n<\/tr>\n<tr>\n<td>3–8 min<\/td>\n<td><strong>Datenschutz 24× True/False.<\/strong> Schnell, sicher, 24 Punkte. Nicht grübeln.<\/td>\n<\/tr>\n<tr>\n<td>8–13 min<\/td>\n<td>Fall lesen, Skizze: Wer will was von wem woraus?<\/td>\n<\/tr>\n<tr>\n<td>13–40 min<\/td>\n<td><strong>Fall im Gutachtenstil.<\/strong> Struktur zuerst, dann füllen.<\/td>\n<\/tr>\n<tr>\n<td>40–52 min<\/td>\n<td>Kurzfragen (Definitionen, Unterschiede, Beispiele).<\/td>\n<\/tr>\n<tr>\n<td>52–60 min<\/td>\n<td>Puffer / Lücken schließen / Schlusssätze nachtragen.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-03-der-dozent-hat-gesagt\">0.3 Der Dozent hat gesagt<\/h3>\n<ul>\n<li><strong>Verständnis, nicht Detailtiefe.<\/strong> Das Skript reicht.<\/li>\n<li><strong>Bei der Fallbearbeitung reichen Stichworte und Halbsätze<\/strong> — geordnete Struktur schlägt schöne Prosa.<\/li>\n<li>Hilfsmittel: BGB (Markierungen + kurze handschriftliche Verweise erlaubt) + ein Text der DSGVO.<\/li>\n<\/ul>","text":"0.1 Das Original-Bewertungsschema Das ist kein Gerücht — der Dozent hat es selbst in die Lösung von Übungsfall 07c geschrieben: „(Und hier mein Bewertungsschema für die Klausur) Gesamtpunkte Falllösung 55 Jur. Methode (Gutachtenstil) 10 — Verstanden (ggfs. definiert) 5 · Umgesetzt 5 Anspruchsgrundlage 10 — Als erforderlich erkannt 3 · EINE AG gefunden 3 · § 812 4 Prüfung §§ 433, 108, 110 15 Prüfung Anfechtung, § 119 II 15 (hier nicht Teil der Lösung) Formulierung Ergebnis 5 \" Was daraus folgt — lies das zweimal: Punkte Wofür Was du dafür tun musst 10 Methode Gutachtenstil erkennbar durchziehen. Konjunktiv, dann definieren, dann subsumieren. 3 „Als erforderlich erkannt\" Den Satz „Anspruchsgrundlage hierfür könnte … sein\" überhaupt schreiben. 3 „EINE AG gefunden\" Irgendeine vertretbare Anspruchsgrundlage nennen. 4 Die richtige AG Die passende Norm treffen. 5 Ergebnis formulieren Am Ende einen sauberen Schlusssatz („Folglich hat X einen Anspruch …\"). 30 Inhalt Die eigentliche Prüfung der Normen. 25 von 55 Punkten (45 %) bekommst du für Form, Struktur und Formulierung — unabhängig davon, ob dein Ergebnis stimmt. Ein formal sauberes Gutachten mit falschem Ergebnis schlägt ein richtiges Ergebnis in Stichworten. Wenn du in der Klausur nicht weiterweißt: schreib trotzdem die Struktur hin. 0.2 Zeitplan für 60 Minuten Zeit Was 0–3 min Ganze Klausur überfliegen. Datenschutz-T/F zuerst? Nein — erst Fall lesen, dann entscheiden. 3–8 min Datenschutz 24× True/False. Schnell, sicher, 24 Punkte. Nicht grübeln. 8–13 min Fall lesen, Skizze: Wer will was von wem woraus? 13–40 min Fall im Gutachtenstil. Struktur zuerst, dann füllen. 40–52 min Kurzfragen (Definitionen, Unterschiede, Beispiele). 52–60 min Puffer / Lücken schließen / Schlusssätze nachtragen. 0.3 Der Dozent hat gesagt Verständnis, nicht Detailtiefe. Das Skript reicht. Bei der Fallbearbeitung reichen Stichworte und Halbsätze — geordnete Struktur schlägt schöne Prosa. Hilfsmittel: BGB (Markierungen + kurze handschriftliche Verweise erlaubt) + ein Text der DSGVO.","words":302,"mins":2},{"id":"r-1-privatrecht-vs-öffentliches-recht","subject":"recht","num":"1","title":"1. Privatrecht vs. Öffentliches Recht","short":"Privatrecht vs. Öffentliches Recht","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nRecht ist in zwei große Hälften geteilt. In der einen darf dir jemand etwas <strong>befehlen<\/strong> — der Staat, die Polizei, das Finanzamt. In der anderen sind alle <strong>gleichberechtigt<\/strong> — du und der Verkäufer, du und dein Vermieter.<\/p>\n<p>Deine ganze Klausur spielt in der zweiten Hälfte. Dieses Kapitel sagt dir nur, woran du die beiden auseinanderhältst. Mehr musst du hier nicht können.<\/p>\n<\/blockquote>\n<p><strong>Folie 3 (Originalüberschrift):<\/strong><\/p>\n<blockquote>\n<p>„Öffentliches und Privatrecht unterscheiden sich durch die <strong>beteiligten Rechtssubjekte und deren Beziehungen zueinander<\/strong>.\"<\/p>\n<\/blockquote>\n<p>Die Folie zeigt eine Grafik „Aufteilung der Rechtsgebiete\":<\/p>\n<table>\n<thead>\n<tr>\n<th>Öffentliches Recht<\/th>\n<th>Privatrecht<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Staats- und Verfassungsrecht, Verfassungsrecht<\/td>\n<td><strong>Bürgerliches Recht<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Polizeirecht, Baurecht, Verkehrsrecht, Umweltrecht<\/td>\n<td>└ Schuldrecht<\/td>\n<\/tr>\n<tr>\n<td>Kommunalrecht, Hochschulrecht, Schulrecht<\/td>\n<td>└ Delikts- und Schadensersatzrecht<\/td>\n<\/tr>\n<tr>\n<td>Prozessrecht, Sozialrecht, Völkerrecht<\/td>\n<td>└ Familienrecht<\/td>\n<\/tr>\n<tr>\n<td>Strafrecht, Steuerrecht, Kirchenrecht<\/td>\n<td>Handelsrecht, Gesellschaftsrecht, Wertpapierrecht, Wettbewerbsrecht, Urheber- und Erfinderrecht<\/td>\n<\/tr>\n<tr>\n<td><em>(dazwischen: Arbeitsrecht, Wirtschaftsrecht)<\/em><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-erklarung-ohne-vorwissen\">Erklärung ohne Vorwissen<\/h3>\n<p>Stell dir vor, wer mit wem redet und <strong>auf welcher Ebene<\/strong>.<\/p>\n<p><strong>Öffentliches Recht = Über-/Unterordnung.<\/strong> Eine Seite handelt <em>hoheitlich<\/em> — sie darf einseitig anordnen, du musst folgen. Du kannst nicht verhandeln.<\/p>\n<ul>\n<li>Polizist hält dich an und nimmt dir den Führerschein ab. Du kannst nicht sagen „lass uns über 50 % einigen\".<\/li>\n<li>Finanzamt schickt einen Steuerbescheid. Kein Angebot, sondern eine Anordnung.<\/li>\n<li>Die Hochschule exmatrikuliert dich. Verwaltungsakt, kein Vertrag.<\/li>\n<\/ul>\n<p><strong>Privatrecht = Koordination, Augenhöhe.<\/strong> Beide Seiten sind gleichgeordnet. Niemand darf dem anderen etwas befehlen. Alles läuft über <em>Einigung<\/em>.<\/p>\n<ul>\n<li>Du kaufst ein gebrauchtes ThinkPad bei Kleinanzeigen. Beide können Nein sagen.<\/li>\n<li>Du unterschreibst einen Arbeitsvertrag. Auch wenn dein Chef dir später Weisungen gibt — die Grundlage war eine freiwillige Einigung.<\/li>\n<li>Du mietest eine Wohnung.<\/li>\n<\/ul>\n<p><strong>Zwei Situationen am selben Bahnhof — daran merkst du dir den Unterschied für immer:<\/strong><\/p>\n<p>Du sitzt im Zug ohne Fahrkarte. Der Kontrolleur stellt dir 60 Euro erhöhtes Beförderungsentgelt aus. Du kannst nicht sagen „Lass uns über 30 reden\". Er <strong>ordnet an<\/strong>, du musst zahlen. Wenn du nicht einverstanden bist, musst <em>du<\/em> dich wehren. → <strong>Öffentliches Recht: von oben nach unten.<\/strong><\/p>\n<p>Am Kiosk im selben Bahnhof willst du eine Cola. Der Verkäufer sagt: 2,50 Euro. Du findest das zu teuer und gehst weiter. Es passiert <strong>nichts<\/strong>. Er kann dich nicht zwingen zu kaufen, du kannst ihn nicht zwingen zu verkaufen. → <strong>Privatrecht: auf Augenhöhe.<\/strong><\/p>\n<p>Der Unterschied ist also nicht, <em>wer<\/em> beteiligt ist, sondern <strong>ob einer dem anderen etwas befehlen darf<\/strong>.<\/p>\n<p><strong>Merksatz:<\/strong> <em>Öffentliches Recht = von oben nach unten. Privatrecht = auf Augenhöhe.<\/em><\/p>\n<p><strong>Achtung, klassische Falle:<\/strong> Der Staat ist nicht automatisch „öffentliches Recht\". Wenn die Stadt Frankfurt Büromöbel bestellt, ist das ein ganz normaler <strong>Kaufvertrag § 433<\/strong> — Privatrecht. Es kommt darauf an, <em>wie<\/em> gehandelt wird (hoheitlich oder als normaler Marktteilnehmer), nicht <em>wer<\/em> handelt.<\/p>\n<h3 id=\"r-kurzantwort-fur-die-klausur-auswendig\">Kurzantwort für die Klausur (auswendig)<\/h3>\n<blockquote>\n<p>Öffentliches Recht liegt vor, wenn mindestens eine Partei hoheitlich handelt; die Beteiligten stehen im Verhältnis der <strong>Über- und Unterordnung<\/strong> (Subordination). Beispiel: Polizeirecht, Steuerrecht.\nPrivatrecht regelt die Beziehungen <strong>gleichgeordneter<\/strong> Rechtssubjekte (Koordination). Kernstück ist das BGB. Beispiel: Kaufvertrag zwischen zwei Privatpersonen.<\/p>\n<\/blockquote>\n<h3 id=\"r-randnotiz-gerichtsbarkeiten-folie-5-nur-uberfliegen\">Randnotiz: Gerichtsbarkeiten (Folie 5) — nur überfliegen<\/h3>\n<p>Der Dozent hat eine sehr dichte Tabelle zu den Gerichtsbarkeiten. Das ist Hintergrundwissen. Merk dir nur den Reflex:<\/p>\n<ul>\n<li><strong>Zivilrecht<\/strong> → Ordentliche Gerichtsbarkeit: Amtsgericht (≤ 10.000 €, Wohnungsmiete, Familienrecht) → Landgericht → OLG → BGH (Karlsruhe).<\/li>\n<li>Arbeitsrecht → Arbeitsgericht → LAG → BAG (Erfurt/Leipzig laut Folie).<\/li>\n<li>Verwaltung → VG → OVG/VGH → BVerwG. Steuern → FG → BFH (München). Sozial → SG → LSG → BSG (Kassel).<\/li>\n<li>Verfassung → BVerfG (Karlsruhe). Vorabentscheidungen → EuGH.<\/li>\n<\/ul>","text":"Worum es hier geht — in einfachen Worten Recht ist in zwei große Hälften geteilt. In der einen darf dir jemand etwas befehlen — der Staat, die Polizei, das Finanzamt. In der anderen sind alle gleichberechtigt — du und der Verkäufer, du und dein Vermieter. Deine ganze Klausur spielt in der zweiten Hälfte. Dieses Kapitel sagt dir nur, woran du die beiden auseinanderhältst. Mehr musst du hier nicht können. Folie 3 (Originalüberschrift): „Öffentliches und Privatrecht unterscheiden sich durch die beteiligten Rechtssubjekte und deren Beziehungen zueinander .\" Die Folie zeigt eine Grafik „Aufteilung der Rechtsgebiete\": Öffentliches Recht Privatrecht Staats- und Verfassungsrecht, Verfassungsrecht Bürgerliches Recht Polizeirecht, Baurecht, Verkehrsrecht, Umweltrecht └ Schuldrecht Kommunalrecht, Hochschulrecht, Schulrecht └ Delikts- und Schadensersatzrecht Prozessrecht, Sozialrecht, Völkerrecht └ Familienrecht Strafrecht, Steuerrecht, Kirchenrecht Handelsrecht, Gesellschaftsrecht, Wertpapierrecht, Wettbewerbsrecht, Urheber- und Erfinderrecht (dazwischen: Arbeitsrecht, Wirtschaftsrecht) Erklärung ohne Vorwissen Stell dir vor, wer mit wem redet und auf welcher Ebene . Öffentliches Recht = Über-/Unterordnung. Eine Seite handelt hoheitlich — sie darf einseitig anordnen, du musst folgen. Du kannst nicht verhandeln. Polizist hält dich an und nimmt dir den Führerschein ab. Du kannst nicht sagen „lass uns über 50 % einigen\". Finanzamt schickt einen Steuerbescheid. Kein Angebot, sondern eine Anordnung. Die Hochschule exmatrikuliert dich. Verwaltungsakt, kein Vertrag. Privatrecht = Koordination, Augenhöhe. Beide Seiten sind gleichgeordnet. Niemand darf dem anderen etwas befehlen. Alles läuft über Einigung . Du kaufst ein gebrauchtes ThinkPad bei Kleinanzeigen. Beide können Nein sagen. Du unterschreibst einen Arbeitsvertrag. Auch wenn dein Chef dir später Weisungen gibt — die Grundlage war eine freiwillige Einigung. Du mietest eine Wohnung. Zwei Situationen am selben Bahnhof — daran merkst du dir den Unterschied für immer: Du sitzt im Zug ohne Fahrkarte. Der Kontrolleur stellt dir 60 Euro erhöhtes Beförderungsentgelt aus. Du kannst nicht sagen „Lass uns über 30 reden\". Er ordnet an , du musst zahlen. Wenn du nicht einverstanden bist, musst du dich wehren. → Öffentliches Recht: von oben nach unten. Am Kiosk im selben Bahnhof willst du eine Cola. Der Verkäufer sagt: 2,50 Euro. Du findest das zu teuer und gehst weiter. Es passiert nichts . Er kann dich nicht zwingen zu kaufen, du kannst ihn nicht zwingen zu verkaufen. → Privatrecht: auf Augenhöhe. Der Unterschied ist also nicht, wer beteiligt ist, sondern ob einer dem anderen etwas befehlen darf . Merksatz: Öffentliches Recht = von oben nach unten. Privatrecht = auf Augenhöhe. Achtung, klassische Falle: Der Staat ist nicht automatisch „öffentliches Recht\". Wenn die Stadt Frankfurt Büromöbel bestellt, ist das ein ganz normaler Kaufvertrag § 433 — Privatrecht. Es kommt darauf an, wie gehandelt wird (hoheitlich oder als normaler Marktteilnehmer), nicht wer handelt. Kurzantwort für die Klausur (auswendig) Öffentliches Recht liegt vor, wenn mindestens eine Partei hoheitlich handelt; die Beteiligten stehen im Verhältnis der Über- und Unterordnung (Subordination). Beispiel: Polizeirecht, Steuerrecht. Privatrecht regelt die Beziehungen gleichgeordneter Rechtssubjekte (Koordination). Kernstück ist das BGB. Beispiel: Kaufvertrag zwischen zwei Privatpersonen. Randnotiz: Gerichtsbarkeiten (Folie 5) — nur überfliegen Der Dozent hat eine sehr dichte Tabelle zu den Gerichtsbarkeiten. Das ist Hintergrundwissen. Merk dir nur den Reflex: Zivilrecht → Ordentliche Gerichtsbarkeit: Amtsgericht (≤ 10.000 €, Wohnungsmiete, Familienrecht) → Landgericht → OLG → BGH (Karlsruhe). Arbeitsrecht → Arbeitsgericht → LAG → BAG (Erfurt/Leipzig laut Folie). Verwaltung → VG → OVG/VGH → BVerwG. Steuern → FG → BFH (München). Sozial → SG → LSG → BSG (Kassel). Verfassung → BVerfG (Karlsruhe). Vorabentscheidungen → EuGH.","words":557,"mins":3},{"id":"r-2-ziel-des-zivilrechts--aufbau-des-bgb","subject":"recht","num":"2","title":"2. Ziel des Zivilrechts + Aufbau des BGB","short":"Ziel des Zivilrechts + Aufbau des BGB","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nZwei Dinge stecken in diesem Kapitel.<\/p>\n<p><strong>Erstens:<\/strong> Was will das Zivilrecht überhaupt? Kurze Antwort: klären, wem was gehört und wer wem was schuldet.<\/p>\n<p><strong>Zweitens:<\/strong> Wie ist das BGB aufgebaut? Das klingt nach Beiwerk, ist aber das Praktischste im ganzen Blatt — denn in der Klausur hast du das BGB dabei und musst wissen, wo du blättern musst.<\/p>\n<\/blockquote>\n<p><strong>Folie 7 (Originalüberschrift):<\/strong><\/p>\n<blockquote>\n<p>„Das Zivilrecht dient dem <strong>Ausgleich und der Regelung von Verschiebungen von Rechtsobjekten zwischen Rechtssubjekten<\/strong>.\"<\/p>\n<\/blockquote>\n<p>Das ist der Satz, den du auswendig können solltest. Er ist die Landkarte für alles Weitere.<\/p>\n<h3 id=\"r-21-die-drei-bausteine-folie-7-im-original\">2.1 Die drei Bausteine (Folie 7 im Original)<\/h3>\n<blockquote>\n<p>„● <strong>Rechtssubjekte<\/strong>\n– Träger von Rechten und Pflichten\n– Natürliche (§§ 1 ff) und Juristische Personen (§§ 21 ff) und rechtsfähige Gesellschaften/Gemeinschaften (§§ 705 ff); jur. Personen handeln durch ihre <strong>Organe<\/strong> (§§ 26 BGB, 35 GmbHG, 78 AktG)<\/p>\n<p>● <strong>Rechtsobjekte<\/strong>\n– Gegenstände, auf die sich die Rechte und Pflichten beziehen\n– Sachen (Tiere), Forderungen (Ansprüche zwischen Gläubiger und Schuldner, Nutzungsrechte, Dienstbarkeiten); Immaterialgüterrechte (Patente, UrhR)<\/p>\n<p>● <strong>Verschiebung<\/strong>\n– Durch bewusste, gewillkürte Entscheidung einer oder mehrerer Beteiligter (Erklärungen und Realakte)\n– Durch gesetzliche Anknüpfung\"<\/p>\n<\/blockquote>\n<h3 id=\"r-was-dieser-satz-eigentlich-sagt\">Was dieser Satz eigentlich sagt<\/h3>\n<p>Der Satz klingt fürchterlich. Er meint aber etwas ganz Einfaches. Übersetz ihn dir so:<\/p>\n<table>\n<thead>\n<tr>\n<th>Fachwort<\/th>\n<th>Heißt schlicht<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Rechtssubjekt<\/strong><\/td>\n<td><strong>Wer<\/strong> kann etwas haben oder schulden?<\/td>\n<td>du · deine Nachbarin · die Telekom<\/td>\n<\/tr>\n<tr>\n<td><strong>Rechtsobjekt<\/strong><\/td>\n<td><strong>Was<\/strong> kann man haben oder schulden?<\/td>\n<td>dein Fahrrad · 50 Euro · ein Patent<\/td>\n<\/tr>\n<tr>\n<td><strong>Verschiebung<\/strong><\/td>\n<td>Etwas <strong>wechselt den Inhaber<\/strong><\/td>\n<td>du verkaufst das Fahrrad<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Damit lautet der ganze Satz auf Deutsch:<\/p>\n<blockquote>\n<p><strong>Das Zivilrecht regelt, wem was gehört — und was passiert, wenn sich das ändert.<\/strong><\/p>\n<\/blockquote>\n<p>Mehr steckt nicht dahinter. Jeder Fall in der Klausur ist am Ende eine von zwei Fragen: <em>Wem gehört was?<\/em> oder <em>Wer schuldet wem was?<\/em> Und wenn sich daran etwas verschoben hat: <em>Durfte das so passieren — oder muss es zurück?<\/em><\/p>\n<p><strong>Rechtssubjekte in echt:<\/strong>\n- <em>Natürliche Person<\/em> (§ 1): du. Rechtsfähig <strong>ab Vollendung der Geburt<\/strong> — nicht ab Zeugung, nicht ab Volljährigkeit. Ein Neugeborenes kann schon erben.\n- <em>Juristische Person<\/em> (§§ 21 ff.): die GmbH, der eingetragene Verein. Ein „künstlicher Mensch\". Sie hat keine Hände, also handelt sie <strong>durch Organe<\/strong> — der Geschäftsführer (§ 35 GmbHG), der Vorstand (§ 78 AktG, § 26 BGB).\n  → Ganz praktisch: Eine GmbH hat keine Hand, sie kann nicht selbst unterschreiben. Wenn du einen Handyvertrag mit der Telekom schließt, redest du in Wirklichkeit mit einem <strong>Menschen<\/strong>, der für die Telekom handeln darf. Der Vertrag gilt trotzdem zwischen dir und der Telekom — nicht zwischen dir und diesem Menschen.\n- <em>Rechtsfähige Gesellschaften<\/em> (§§ 705 ff.): die GbR, z. B. drei Freunde, die zusammen eine WG-Solaranlage betreiben.<\/p>\n<p><strong>Rechtsobjekte in echt:<\/strong>\n- <em>Sache<\/em>: dein Laptop. <strong>Tiere<\/strong> sind rechtlich keine Sachen (§ 90a), werden aber wie Sachen behandelt.\n- <em>Forderung<\/em>: „Ich habe dir 50 € geliehen\" — mein Anspruch gegen dich ist selbst ein Vermögenswert. Ich kann ihn sogar verkaufen.\n- <em>Immaterialgüterrecht<\/em>: dein Patent, dein Urheberrecht am Code.<\/p>\n<p><strong>Die zwei Wege der Verschiebung (Folie 8, Original):<\/strong><\/p>\n<blockquote>\n<p>„● Nukleus/Grundbaustein zur Erzeugung von Rechtsfolgen ist die <strong>WILLENSERKLÄRUNG<\/strong> …\n● <strong>RECHTSGESCHÄFTE<\/strong> infolge wirksamer Willenserklärungen bilden die Grundlage für Rechtsverschiebung …\n● Rechtsverschiebungen treten auch unmittelbar <strong>DURCH GESETZ<\/strong> ein\n– durch Geschäftsanbahnung § 311 II\n– durch die Verletzung von Rechtsgütern (§§ 823 ff)\n– durch ungerechtfertigte Bereicherung (§§ 812 ff)\"<\/p>\n<\/blockquote>\n<p>Also:<\/p>\n<pre><code>                 ┌── gewollt ──→  Willenserklärung → Rechtsgeschäft (Vertrag)\nVerschiebung ────┤                 z.B. Kauf § 433\n                 └── ungewollt ─→  Gesetz: § 311 II (c.i.c.) · § 823 (Delikt) · § 812 (Bereicherung)\n<\/code><\/pre>\n<p>Das ist die <strong>erste Weiche in jedem Fall<\/strong>: Ist etwas verschoben worden, weil beide es wollten (→ Vertrag suchen) — oder obwohl keiner es wollte (→ gesetzliches Schuldverhältnis suchen)?<\/p>\n<h3 id=\"r-22-aufbau-des-bgb-folie-6\">2.2 Aufbau des BGB (Folie 6)<\/h3>\n<p><strong>Folie 6 (Originalüberschrift):<\/strong><\/p>\n<blockquote>\n<p>„Zentrales zivilrechtliches Gesetz ist das BGB. Es enthält eine allgemeine <strong>„Gebrauchsanweisung\"<\/strong> und regelt die Rechtsbeziehungen in vier unterschiedlichen Themengebieten\"<\/p>\n<\/blockquote>\n<p>Die Grafik der Folie:<\/p>\n<pre><code>                              BGB\n                               │\n                  1. Buch, Allgemeiner Teil, §§ 1 – 240\n                               │\n        ┌──────────────┬───────┴───────┬──────────────┐\n   2. Buch          3. Buch         4. Buch        5. Buch\n  Schuldrecht      Sachenrecht    Familienrecht    Erbrecht\n  §§ 241 – 853    §§ 854 – 1296  §§ 1297 – 1921  §§ 1922 – 2385\n        │\n   ┌────┴────┐\nAllgemeines  Besonderes\nSchuldrecht  Schuldrecht\n<\/code><\/pre>\n<h3 id=\"r-warum-das-die-wichtigste-folie-fur-deinen-bgb-umgang-ist\">Warum das die wichtigste Folie für deinen BGB-Umgang ist<\/h3>\n<p>Das BGB ist <strong>„vor die Klammer gezogen\"<\/strong> aufgebaut. Was für <em>alles<\/em> gilt, steht ganz vorne. Was nur für Kaufverträge gilt, steht hinten.<\/p>\n<p><strong>Stell dir ein dickes Handbuch für Haushaltsgeräte vor.<\/strong><\/p>\n<p>Vorne stehen 40 Seiten, die für <strong>jedes<\/strong> Gerät gelten: was die Warnsymbole bedeuten, wie die Garantie läuft, wer überhaupt als Kunde zählt. Danach kommen die einzelnen Kapitel: Waschmaschine, Kühlschrank, Staubsauger.<\/p>\n<p>Willst du wissen, wie du die Waschmaschine anschließt? → ins Waschmaschinen-Kapitel.\nWillst du wissen, wie lange die Garantie läuft? → <strong>nach vorne<\/strong>. Das steht nur einmal ganz am Anfang, weil es für alle Geräte gleich ist.<\/p>\n<p>Genau so ist das BGB gebaut. Buch 1 ist der allgemeine Teil vorne, die Bücher 2 bis 5 sind die Gerätekapitel.<\/p>\n<p>Wenn du bei einem Kaufvertrag wissen willst, ob der Käufer minderjährig wirksam handeln konnte, findest du das <strong>nicht<\/strong> bei § 433. Du musst nach vorne, in den Allgemeinen Teil, zu § 106. Genau deshalb heißt Buch 1 „Gebrauchsanweisung\".<\/p>\n<p><strong>Praktische Konsequenz für die Klausur:<\/strong> Du springst im BGB fast immer zwischen zwei Stellen — hinten die konkrete Anspruchsgrundlage (§ 433, § 631, § 823), vorne die allgemeinen Wirksamkeitsfragen (§§ 104 ff., 119 ff., 145 ff., 164 ff.).<\/p>\n<p><strong>Der Klausurschwerpunkt liegt in Buch 1 + Buch 2.<\/strong> Sachen-, Familien- und Erbrecht kommen nur als Randnotiz vor (§ 929 aus dem Sachenrecht musst du kennen — siehe Kapitel 7).<\/p>\n<h3 id=\"r-kurzantwort-fur-die-klausur\">Kurzantwort für die Klausur<\/h3>\n<blockquote>\n<p>Das BGB gliedert sich in fünf Bücher. Das 1. Buch (Allgemeiner Teil, §§ 1–240) enthält die für das gesamte BGB geltenden Grunddefinitionen — Personen, Sachen, Rechtsgeschäfte, Willenserklärung, Fristen, Verjährung. Daran schließen sich vier speziellere Bücher an: Schuldrecht (§§ 241–853, unterteilt in Allgemeines und Besonderes Schuldrecht), Sachenrecht (§§ 854–1296), Familienrecht (§§ 1297–1921) und Erbrecht (§§ 1922–2385).<\/p>\n<\/blockquote>\n<h3 id=\"r-beispiel-aus-deinen-ubungsfallen\">Beispiel aus deinen Übungsfällen<\/h3>\n<p>Fall 03 e) (Nancy, 16, kauft die Simson-Schwalbe): Die Anspruchsgrundlage steht in <strong>Buch 2<\/strong> (§ 433 Kaufvertrag). Ob Nancys Willenserklärung wirksam war, steht in <strong>Buch 1<\/strong> (§§ 106, 107, 108, 110). Wer Eigentümerin der Schwalbe wurde, steht in <strong>Buch 3<\/strong> (§ 929). Ein einziger Fall, drei Bücher.<\/p>","text":"Worum es hier geht — in einfachen Worten Zwei Dinge stecken in diesem Kapitel. Erstens: Was will das Zivilrecht überhaupt? Kurze Antwort: klären, wem was gehört und wer wem was schuldet. Zweitens: Wie ist das BGB aufgebaut? Das klingt nach Beiwerk, ist aber das Praktischste im ganzen Blatt — denn in der Klausur hast du das BGB dabei und musst wissen, wo du blättern musst. Folie 7 (Originalüberschrift): „Das Zivilrecht dient dem Ausgleich und der Regelung von Verschiebungen von Rechtsobjekten zwischen Rechtssubjekten .\" Das ist der Satz, den du auswendig können solltest. Er ist die Landkarte für alles Weitere. 2.1 Die drei Bausteine (Folie 7 im Original) „● Rechtssubjekte – Träger von Rechten und Pflichten – Natürliche (§§ 1 ff) und Juristische Personen (§§ 21 ff) und rechtsfähige Gesellschaften/Gemeinschaften (§§ 705 ff); jur. Personen handeln durch ihre Organe (§§ 26 BGB, 35 GmbHG, 78 AktG) ● Rechtsobjekte – Gegenstände, auf die sich die Rechte und Pflichten beziehen – Sachen (Tiere), Forderungen (Ansprüche zwischen Gläubiger und Schuldner, Nutzungsrechte, Dienstbarkeiten); Immaterialgüterrechte (Patente, UrhR) ● Verschiebung – Durch bewusste, gewillkürte Entscheidung einer oder mehrerer Beteiligter (Erklärungen und Realakte) – Durch gesetzliche Anknüpfung\" Was dieser Satz eigentlich sagt Der Satz klingt fürchterlich. Er meint aber etwas ganz Einfaches. Übersetz ihn dir so: Fachwort Heißt schlicht Beispiel Rechtssubjekt Wer kann etwas haben oder schulden? du · deine Nachbarin · die Telekom Rechtsobjekt Was kann man haben oder schulden? dein Fahrrad · 50 Euro · ein Patent Verschiebung Etwas wechselt den Inhaber du verkaufst das Fahrrad Damit lautet der ganze Satz auf Deutsch: Das Zivilrecht regelt, wem was gehört — und was passiert, wenn sich das ändert. Mehr steckt nicht dahinter. Jeder Fall in der Klausur ist am Ende eine von zwei Fragen: Wem gehört was? oder Wer schuldet wem was? Und wenn sich daran etwas verschoben hat: Durfte das so passieren — oder muss es zurück? Rechtssubjekte in echt: - Natürliche Person (§ 1): du. Rechtsfähig ab Vollendung der Geburt — nicht ab Zeugung, nicht ab Volljährigkeit. Ein Neugeborenes kann schon erben. - Juristische Person (§§ 21 ff.): die GmbH, der eingetragene Verein. Ein „künstlicher Mensch\". Sie hat keine Hände, also handelt sie durch Organe — der Geschäftsführer (§ 35 GmbHG), der Vorstand (§ 78 AktG, § 26 BGB). → Ganz praktisch: Eine GmbH hat keine Hand, sie kann nicht selbst unterschreiben. Wenn du einen Handyvertrag mit der Telekom schließt, redest du in Wirklichkeit mit einem Menschen , der für die Telekom handeln darf. Der Vertrag gilt trotzdem zwischen dir und der Telekom — nicht zwischen dir und diesem Menschen. - Rechtsfähige Gesellschaften (§§ 705 ff.): die GbR, z. B. drei Freunde, die zusammen eine WG-Solaranlage betreiben. Rechtsobjekte in echt: - Sache : dein Laptop. Tiere sind rechtlich keine Sachen (§ 90a), werden aber wie Sachen behandelt. - Forderung : „Ich habe dir 50 € geliehen\" — mein Anspruch gegen dich ist selbst ein Vermögenswert. Ich kann ihn sogar verkaufen. - Immaterialgüterrecht : dein Patent, dein Urheberrecht am Code. Die zwei Wege der Verschiebung (Folie 8, Original): „● Nukleus/Grundbaustein zur Erzeugung von Rechtsfolgen ist die WILLENSERKLÄRUNG … ● RECHTSGESCHÄFTE infolge wirksamer Willenserklärungen bilden die Grundlage für Rechtsverschiebung … ● Rechtsverschiebungen treten auch unmittelbar DURCH GESETZ ein – durch Geschäftsanbahnung § 311 II – durch die Verletzung von Rechtsgütern (§§ 823 ff) – durch ungerechtfertigte Bereicherung (§§ 812 ff)\" Also: ┌── gewollt ──→ Willenserklärung → Rechtsgeschäft (Vertrag) Verschiebung ────┤ z.B. Kauf § 433 └── ungewollt ─→ Gesetz: § 311 II (c.i.c.) · § 823 (Delikt) · § 812 (Bereicherung) Das ist die erste Weiche in jedem Fall : Ist etwas verschoben worden, weil beide es wollten (→ Vertrag suchen) — oder obwohl keiner es wollte (→ gesetzliches Schuldverhältnis suchen)? 2.2 Aufbau des BGB (Folie 6) Folie 6 (Originalüberschrift): „Zentrales zivilrechtliches Gesetz ist das BGB. Es enthält eine allgemeine „Gebrauchsanweisung\" und regelt die Rechtsbeziehungen in vier unterschiedlichen Themengebieten\" Die Grafik der Folie: BGB │ 1. Buch, Allgemeiner Teil, §§ 1 – 240 │ ┌──────────────┬───────┴───────┬──────────────┐ 2. Buch 3. Buch 4. Buch 5. Buch Schuldrecht Sachenrecht Familienrecht Erbrecht §§ 241 – 853 §§ 854 – 1296 §§ 1297 – 1921 §§ 1922 – 2385 │ ┌────┴────┐ Allgemeines Besonderes Schuldrecht Schuldrecht Warum das die wichtigste Folie für deinen BGB-Umgang ist Das BGB ist „vor die Klammer gezogen\" aufgebaut. Was für alles gilt, steht ganz vorne. Was nur für Kaufverträge gilt, steht hinten. Stell dir ein dickes Handbuch für Haushaltsgeräte vor. Vorne stehen 40 Seiten, die für jedes Gerät gelten: was die Warnsymbole bedeuten, wie die Garantie läuft, wer überhaupt als Kunde zählt. Danach kommen die einzelnen Kapitel: Waschmaschine, Kühlschrank, Staubsauger. Willst du wissen, wie du die Waschmaschine anschließt? → ins Waschmaschinen-Kapitel. Willst du wissen, wie lange die Garantie läuft? → nach vorne . Das steht nur einmal ganz am Anfang, weil es für alle Geräte gleich ist. Genau so ist das BGB gebaut. Buch 1 ist der allgemeine Teil vorne, die Bücher 2 bis 5 sind die Gerätekapitel. Wenn du bei einem Kaufvertrag wissen willst, ob der Käufer minderjährig wirksam handeln konnte, findest du das nicht bei § 433. Du musst nach vorne, in den Allgemeinen Teil, zu § 106. Genau deshalb heißt Buch 1 „Gebrauchsanweisung\". Praktische Konsequenz für die Klausur: Du springst im BGB fast immer zwischen zwei Stellen — hinten die konkrete Anspruchsgrundlage (§ 433, § 631, § 823), vorne die allgemeinen Wirksamkeitsfragen (§§ 104 ff., 119 ff., 145 ff., 164 ff.). Der Klausurschwerpunkt liegt in Buch 1 + Buch 2. Sachen-, Familien- und Erbrecht kommen nur als Randnotiz vor (§ 929 aus dem Sachenrecht musst du kennen — siehe Kapitel 7). Kurzantwort für die Klausur Das BGB gliedert sich in fünf Bücher. Das 1. Buch (Allgemeiner Teil, §§ 1–240) enthält die für das gesamte BGB geltenden Grunddefinitionen — Personen, Sachen, Rechtsgeschäfte, Willenserklärung, Fristen, Verjährung. Daran schließen sich vier speziellere Bücher an: Schuldrecht (§§ 241–853, unterteilt in Allgemeines und Besonderes Schuldrecht), Sachenrecht (§§ 854–1296), Familienrecht (§§ 1297–1921) und Erbrecht (§§ 1922–2385). Beispiel aus deinen Übungsfällen Fall 03 e) (Nancy, 16, kauft die Simson-Schwalbe): Die Anspruchsgrundlage steht in Buch 2 (§ 433 Kaufvertrag). Ob Nancys Willenserklärung wirksam war, steht in Buch 1 (§§ 106, 107, 108, 110). Wer Eigentümerin der Schwalbe wurde, steht in Buch 3 (§ 929). Ein einziger Fall, drei Bücher.","words":1034,"mins":5},{"id":"r-3-juristische-methode","subject":"recht","num":"3","title":"3. Juristische Methode","short":"Juristische Methode","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nHier geht es nicht darum, <em>was<\/em> du schreibst, sondern <strong>in welcher Reihenfolge<\/strong>.<\/p>\n<p>Das klingt nach Formkram. Ist es aber nicht: Für die reine Form gibt es 20 von 55 Punkten, und weitere 5 für den Schlusssatz. Du kannst also inhaltlich danebenliegen und trotzdem gut abschneiden, wenn die Struktur sitzt — und umgekehrt.<\/p>\n<p><strong>Wenn du nur ein einziges Kapitel wirklich beherrschst, dann dieses.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Das ist das wichtigste Kapitel des Lernblatts.<\/strong> Hier liegen die 10 Methodenpunkte + 10 Punkte Anspruchsgrundlage = <strong>36 % der Fallpunkte<\/strong>, und zwar unabhängig vom Inhalt.<\/p>\n<h3 id=\"r-31-der-grundgedanke-folie-11-original\">3.1 Der Grundgedanke (Folie 11, Original)<\/h3>\n<blockquote>\n<p>„● <strong>Jura als Wissenschaft<\/strong>\n– Klassische wissenschaftliche Methode: Aufstellen einer Hypothese ⇒ Experimentelle Erhärtung/Falsifizierung der Hypothese ⇒ Ableitung des Ergebnisses in Bezug auf die Hypothese\n– <strong>Juristische Methode (in der Falllösung): Aufstellung eines Obersatzes ⇒ Definition der Tatbestandsmerkmale / Einordnung des Lebenssachverhaltes unter die definierten TBM („Subsumtion\") ⇒ Schlussfolgern des Ergebnisses<\/strong>\"<\/p>\n<\/blockquote>\n<p>Der Dozent baut hier eine Brücke, die für dich als Informatiker perfekt passt:<\/p>\n<pre><code>Naturwissenschaft:  Hypothese  →  Experiment       →  Ergebnis\nJura:               Obersatz   →  Definition+Subsumtion → Schlusssatz\nInformatik:         Assertion  →  Test ausführen   →  pass/fail\n<\/code><\/pre>\n<p><strong>Ein Gutachten ist ein Unit-Test in Prosa.<\/strong> Du behauptest etwas (Obersatz = Assertion), definierst die Bedingung (Definition = erwarteter Wert), prüfst den konkreten Fall dagegen (Subsumtion = actual vs. expected) und stellst das Ergebnis fest (Schlusssatz = assert passed/failed).<\/p>\n<h3 id=\"r-32-die-vier-schritte-im-detail-folie-11-original\">3.2 Die vier Schritte im Detail (Folie 11, Original)<\/h3>\n<blockquote>\n<p>„● Aufstellung eines <strong>„Obersatzes\"<\/strong>, der zu dem gewünschten juristischen Ergebnis führen würde\n– <strong>„Wer? will was? von wem?\"<\/strong>; ggfs. mehrere Obersätze bei verschiedenen Personenbeziehungen\n– Was wäre hierfür eine geeignete <strong>Anspruchsgrundlage<\/strong>, z.B. eine Rechtsnorm aus Gesetz oder Vertrag <strong>(„woraus?\")<\/strong><\/p>\n<p>● Benennung und <strong>Definition der Tatbestandsmerkmale<\/strong>\n– Ggfs. in mehreren Ebenen (manche Definition enthält weiter zu definierende Begriffe)<\/p>\n<p>● <strong>„Subsumtion\"<\/strong>\n– Einordnung des Lebenssachverhalts unter jedes der definierten Tatbestandsmerkmale / Argumentation<\/p>\n<p>● <strong>„Schlusssatz\"<\/strong>: Feststellung des Zwischenergebnisses/Gesamtergebnisses\n– Alle anspruchsbegründenden Tatbestandsmerkmale erfüllt?\n– Feststellung der Rechtsfolge\"<\/p>\n<\/blockquote>\n<h3 id=\"r-die-zauberformel-wer-will-was-von-wem-woraus\">Die Zauberformel: WER will WAS von WEM WORAUS?<\/h3>\n<p>Das ist der einzige Satz, den du am Anfang jeder Fallbearbeitung hinschreiben musst.<\/p>\n<table>\n<thead>\n<tr>\n<th>Frage<\/th>\n<th>Bedeutung<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Wer?<\/strong><\/td>\n<td>Anspruchsteller / Gläubiger<\/td>\n<td>Anneliese<\/td>\n<\/tr>\n<tr>\n<td><strong>will was?<\/strong><\/td>\n<td>Rechtsfolge, das Begehren<\/td>\n<td>Übereignung des Kühlschranks<\/td>\n<\/tr>\n<tr>\n<td><strong>von wem?<\/strong><\/td>\n<td>Anspruchsgegner / Schuldner<\/td>\n<td>von Jimmy<\/td>\n<\/tr>\n<tr>\n<td><strong>woraus?<\/strong><\/td>\n<td>Anspruchsgrundlage<\/td>\n<td>aus § 433 I<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Daraus wird automatisch der Obersatz:<\/p>\n<blockquote>\n<p>„<strong>Anneliese könnte einen Anspruch auf Übereignung des Kühlschranks gegen Jimmy aus § 433 I haben.<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Merke: Immer Konjunktiv.<\/strong> „könnte … haben\", „müsste\", „wäre\". Im Gutachtenstil weißt du das Ergebnis noch nicht — du arbeitest darauf hin. Wenn du „Anneliese hat einen Anspruch …\" schreibst und dann erst prüfst, ist das <strong>Urteilsstil<\/strong> und kostet dich Methodenpunkte.<\/p>\n<p><strong>Schreib wie ein Arzt, der eine Diagnose stellt — nicht wie einer, der das Ergebnis schon kennt.<\/strong><\/p>\n<p>Ein Arzt sagt nicht „Sie haben Grippe\" und sucht sich danach die Gründe zusammen. Er sagt:<\/p>\n<blockquote>\n<p>„Es <strong>könnte<\/strong> eine Grippe sein. Dafür bräuchte es Fieber, Gliederschmerzen und Husten.\nFieber: 39 Grad, ja. Gliederschmerzen: ja. Husten: ja.\n<strong>Also<\/strong> ist es eine Grippe.\"<\/p>\n<\/blockquote>\n<p>Erst die Vermutung, dann die Voraussetzungen, dann der Abgleich mit dem, was du vorfindest, dann das Ergebnis. Genau diese Reihenfolge will der Dozent auf dem Papier sehen.<\/p>\n<h3 id=\"r-die-gutachten-satzbausteine-auswendig-lernen\">Die Gutachten-Satzbausteine (auswendig lernen!)<\/h3>\n<p>Diese fünf Formulierungen ziehst du in der Klausur einfach durch. Sie sind wörtlich aus den Musterlösungen des Dozenten:<\/p>\n<table>\n<thead>\n<tr>\n<th>Schritt<\/th>\n<th>Baustein<\/th>\n<th>Original aus Fall 02d / 06b<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. Obersatz<\/strong><\/td>\n<td>„X könnte einen Anspruch auf … gegen Y aus § … haben.\"<\/td>\n<td><em>„Denny könnte einen Anspruch auf Übereignung der Konsole zum Preis von 230 EUR haben. Grundlage hierfür wäre ein wirksamer Kaufvertrag nach § 433 I. („Obersatz\")\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>2. Voraussetzung<\/strong><\/td>\n<td>„Voraussetzung dafür wäre …\" / „Fraglich ist, ob …\"<\/td>\n<td><em>„Voraussetzung für § 164 ist eine eigene WE, die im fremden Namen im Rahmen der gegebenen Vertretungsmacht abgegeben wurde.\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>3. Definition<\/strong><\/td>\n<td>„Unter … versteht man …\" / „… ist …\"<\/td>\n<td><em>„Eine WE ist eine von einem Handlungswillen getragene Äußerung, durch die die Erklärenden einen Rechtserfolg herbeiführen möchten („neue Definition\")\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>4. Subsumtion<\/strong><\/td>\n<td>„Vorliegend …\" / „Hier hat X …\"<\/td>\n<td><em>„Durch das Schreiben der Mail wollte Nancy den Rechtserfolg eines Kaufvertrages mit Denny herbeiführen („Subsumtion\")\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>5. Schluss<\/strong><\/td>\n<td>„Folglich …\" / „Somit liegt … vor\" / „Mithin …\"<\/td>\n<td><em>„Folglich ist kein Kaufvertrag zwischen Anne und Jimmy geschlossen worden, so dass Anne keinen Anspruch … hat.\"<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Der Dozent liebt „Folglich\".<\/strong> In Fall 06b stehen vier „Folglich\" hintereinander. Benutz es. Es ist das sichtbarste Signal für „ich beherrsche den Gutachtenstil\".<\/p>\n<h3 id=\"r-33-verschachtelung-der-punkt-an-dem-die-meisten-scheitern\">3.3 Verschachtelung — der Punkt, an dem die meisten scheitern<\/h3>\n<p><strong>Folie 11:<\/strong> <em>„Ggfs. in mehreren Ebenen (manche Definition enthält weiter zu definierende Begriffe)\"<\/em><\/p>\n<p>Genau das ist der Kern. Eine Definition wirft neue Begriffe auf, die du wieder definieren musst. Das ist <strong>Rekursion<\/strong>.<\/p>\n<p>Schau dir an, wie der Dozent das in Fall 02d selbst durchzieht (Original, gekürzt):<\/p>\n<pre><code>Obersatz:        Anspruch auf Übereignung aus § 433 I?\n └ TBM:          Dafür braucht es einen Vertrag → §§ 145 ff.: Angebot + Annahme\n    └ Definition: „Bei einem Angebot handelt es sich um eine WE&quot;\n       └ Definition eine Ebene tiefer: „Eine WE ist eine von einem Handlungswillen\n                                        getragene Äußerung …&quot;\n          └ Subsumtion:  „Durch das Schreiben der Mail wollte Nancy …&quot;\n          └ Teilergebnis: „Somit liegt ein Angebot vor&quot;\n    └ Neues TBM: „Fraglich ist, ob dieses wirksam geworden ist&quot;\n       └ Definition:  „Wirksam werden WE unter Abwesenden mit Zugang, § 130 I&quot;\n          └ Definition tiefer: „Zugegangen ist eine WE, wenn sie so in den\n                                Machtbereich … gelangt ist, dass eine Kenntnisnahme\n                                möglich und üblich ist&quot;\n             └ Subsumtion: „Vorliegend ist die Mail … um 21 Uhr in den Machtbereich\n                            von Denny gelangt&quot;\n             └ Zwischenergebnis: „Zugang liegt vor&quot;\n    └ Neues TBM: „Allerdings wird eine WE nicht wirksam, wenn … ein Widerruf zugeht, § 130 I 2&quot;\n       └ ...\nSchlusssatz:     „Folglich liegt Denny kein wirksames Angebot durch Nancy vor,\n                  so dass auch kein Kaufvertrag … geschlossen wurde und demnach\n                  Danny keinen Anspruch auf Übereignung der Konsole hat&quot;\n<\/code><\/pre>\n<p><strong>Kennst du das von Behörden?<\/strong> Du willst einen Personalausweis. Dafür brauchst du eine Meldebescheinigung. Für die brauchst du eine Wohnungsgeberbestätigung. Für die brauchst du den Vermieter.<\/p>\n<p>Jede Voraussetzung bringt eine neue mit — so lange, bis du bei etwas ankommst, das du einfach vorlegen kannst. Genau so hangelt sich ein Gutachten nach unten: Jeder Begriff, den du zur Erklärung benutzt, muss selbst erklärt werden, bis du bei einer Frage landest, die du direkt am Sachverhalt beantworten kannst.<\/p>\n<pre><code class=\"language-python\">def anspruch_433(): \n    return vertrag_geschlossen() and not erloschen() and durchsetzbar()\ndef vertrag_geschlossen():\n    return angebot() and annahme()\ndef angebot():\n    return ist_willenserklaerung() and wirksam_geworden() and kein_widerruf()\ndef wirksam_geworden():\n    return zugang_130()       # ← hier endlich am Sachverhalt entscheidbar\n<\/code><\/pre>\n<p><strong>Klausur-Tipp:<\/strong> Rück ein! Der Dozent hat gesagt, Stichworte und Halbsätze reichen. Nutz Einrückung und Spiegelstriche, um die Ebenen sichtbar zu machen. Genau so sieht sein eigenes handschriftliches Flipchart aus (Fall 09):<\/p>\n<pre><code>Anspruch Nancy → Jimmy: Zahlung d. Werklohns, § 631\n * Vertrag geschlossen  ⟹ Anspruch entstanden\n * Anspruch erloschen, § 346? Rücktritt\n    * RT-Erklärung, § 349  (+)\n    * RT-Recht aus Gesetz\n       - § 323\n       - fällige Leistung, § 271  (+)\n       - nicht (vertragsmäßig) erfüllt  (+)\n       * angemessene Nachfrist  (+)\n    ⟹ RT-Grund § 323  (+)\n<\/code><\/pre>\n<p>Das ist <strong>Original-Dozentenhandschrift<\/strong>. So darf dein Gutachten aussehen. Mit <code>(+)<\/code> und <code>(-)<\/code> markiert er, ob ein Merkmal erfüllt ist. Übernimm das.<\/p>\n<h3 id=\"r-34-der-anspruchsaufbau-die-drei-stufen-folie-12\">3.4 Der Anspruchsaufbau — die drei Stufen (Folie 12)<\/h3>\n<p><strong>Das ist der Teil, der in deiner Themenliste komplett fehlte.<\/strong> Folie 11 sagt dir, <em>wie<\/em> du schreibst. Folie 12 sagt dir, <em>in welcher Reihenfolge<\/em> du prüfst.<\/p>\n<p><strong>Folie 12 (Original, vollständig):<\/strong><\/p>\n<blockquote>\n<p>„⇒ <strong>Anspruch entstanden!<\/strong> Eine oder mehrere Anspruchsgrundlagen sind erfüllt<\/p>\n<p>● <strong>Anspruch erloschen?<\/strong> <strong>Einwendungen<\/strong> gegen den Anspruch (von Amts wegen zu berücksichtigen)\n– durch Erfüllung, § 346\n– durch Aufrechnung, § 349\n– durch Erlass, § 389\n– durch absolute oder wirtschaftliche Unmöglichkeit, §§ 275, 326<\/p>\n<p>● <strong>Anspruch durchsetzbar?<\/strong> <strong>Einreden<\/strong> gegen den Anspruch (durch Partei vorzutragen)\n– Verjährung, § 214\n– Zurückbehaltungsrecht, § 273\n– Nicht erfüllter Vertrag, § 320\n– Stundung<\/p>\n<p>⇒ <strong>Endergebnis<\/strong>\"<\/p>\n<p>⚠️ <strong>Achtung, die §§ auf dieser Folie sind verrutscht.<\/strong> Richtig ist:\n<strong>Erfüllung = § 362<\/strong> (nicht 346) · <strong>Aufrechnung = § 389<\/strong> (nicht 349) · <strong>Erlass = § 397<\/strong> (nicht 389).\n§ 346 ist der <em>Rücktritt<\/em>, § 349 die <em>Rücktrittserklärung<\/em>.\nSchreib in der Klausur einfach „Erfüllung\", „Aufrechnung\", „Erlass\" ohne § — dann kannst du nichts falsch machen. Der Dozent will die <em>Struktur<\/em> sehen, nicht die Paragrafennummer dieser Nebenpunkte. Die §§ 214, 273, 320 auf der Folie sind dagegen <strong>korrekt<\/strong>.<\/p>\n<\/b
