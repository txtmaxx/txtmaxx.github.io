gung vom Empfängerhorizont)\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Je höher der Wert und je größer das Risiko, desto eher nimmt das Recht einen Rechtsbindungswillen an. <strong>Ein Gefallen unter Nachbarn ist etwas anderes als die Betreuung eines Vermögenswerts.<\/strong><\/p>\n<h3 id=\"f-fall-01-c-das-winken-bei-der-weinauktion\">Fall 01 c) — Das Winken bei der Weinauktion ★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Denny kommt in einen Auktionsraum, sieht seinen Freund Jimmy und <strong>winkt ihm freudig zu<\/strong>. Im selben Moment schlägt der Auktionator zu und beglückwünscht Denny zum Kauf von 10 Fuder Wein für <strong>45.400 Euro<\/strong>.<\/p>\n<p><strong>Was gefragt ist.<\/strong> Muss Denny den Wein bezahlen?<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\nAus Dennys Sicht: Er wollte winken, nicht kaufen. Sein <strong>Erklärungswille fehlt<\/strong> — er hatte kein Bewusstsein, etwas rechtlich Bedeutsames zu tun.<\/p>\n<p>Aber jetzt die entscheidende Frage: <strong>Wie musste der Auktionator das sehen?<\/strong> In einem Auktionsraum bedeutet Handheben genau eine Sache: ein Gebot. Ein vernünftiger Auktionator durfte das als Gebot verstehen.<\/p>\n<p>Und weil im Recht der <strong>objektive Empfängerhorizont<\/strong> entscheidet (§§ 133, 157), liegt eine wirksame Willenserklärung vor. Der Kaufvertrag kommt zustande.<\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Handlungswille (+), Erklärungswille (?), subjektiv aus der Sicht von D (-), jedoch nach Auslegung vom obj. Empfängerhorizont (+) ⇒ wirksame WE\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Das ist <strong>der<\/strong> Grundsatzfall der ganzen Sammlung. Merk ihn dir: Es zählt nicht, was du dachtest, sondern was der andere verstehen durfte.<\/p>\n<p><strong>Und die Anschlussfrage, die in der Klausur kommen könnte:<\/strong> Ist Denny damit verloren? Nein — er kann <strong>anfechten<\/strong> (§ 119 I, Kapitel 11), weil Wille und Erklärung auseinanderfielen. Er muss dann aber Jimmy den Vertrauensschaden ersetzen (§ 122). Genau dafür gibt es die Anfechtung.<\/p>\n<h3 id=\"f-fall-01-d-die-vorbereitete-kundigung\">Fall 01 d) — Die vorbereitete Kündigung ★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Anneliese hat eine neue Wohnung in Aussicht, aber noch nichts unterschrieben. Sie <strong>bereitet<\/strong> die Kündigung ihrer alten Wohnung vor, steckt sie in einen adressierten Umschlag und legt ihn auf den Tisch. Ihr Lebensgefährte Denny sieht den Umschlag, frankiert ihn und wirft ihn ein. Zwei Tage später kommt er beim Vermieter an. Der neue Mietvertrag platzt.<\/p>\n<p><strong>Was gefragt ist.<\/strong> Ist Annelieses Kündigung wirksam? Sie steht sonst ohne Wohnung da.<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\nAnneliese wollte die Kündigung <strong>nur vorbereiten<\/strong>, nicht abgeben. Aus ihrer Sicht fehlt der Erklärungswille — sie hat die Erklärung nicht „mit Wissen und Wollen\" in den Verkehr gebracht.<\/p>\n<p>Aber der Vermieter sieht nur: ein unterschriebenes Kündigungsschreiben in seinem Briefkasten. Er kann nicht wissen, dass der Brief noch auf dem Tisch liegen sollte. Für ihn ist das eine ganz normale Kündigung.<\/p>\n<p>Wieder gewinnt der objektive Empfängerhorizont: <strong>Die Kündigung ist wirksam.<\/strong><\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Handlungswille (+ bezüglich Verfassens der Kündigung), Erklärungswille (?): A wollte ihre Erklärung nur vorbereiten und hat sie nicht mit Wissen und Wollen abgegeben, subjektiv aus sicht von AB (-), jedoch nach Auslegung vom obj. Empfängerhorizont (+) ⇒ wirksame WE\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Derselbe Gedanke wie im Auktionsfall, aber in einer alltäglicheren Situation. <strong>Sobald eine Erklärung aus deinem Bereich heraus in die Welt gelangt, musst du dich meist daran festhalten lassen<\/strong> — auch wenn ein Dritter sie losgeschickt hat.<\/p>\n<h3 id=\"f-fall-01-e-vier-verkaufssituationen-im-vergleich\">Fall 01 e) — Vier Verkaufssituationen im Vergleich ★<\/h3>\n<p>Das ist die wichtigste Teilaufgabe der Sammlung, weil sie <strong>invitatio ad offerendum<\/strong> von einem echten Angebot trennt. Vier Varianten:<\/p>\n<p><strong>e1) Media Markt plakatiert „Schnell-Spar-Tage, PS5 Pro 649 €\"<\/strong><\/p>\n<p>Das ist Werbung. Der Markt will noch keinen Vertrag schließen — er will, dass Leute in den Laden kommen.<\/p>\n<blockquote>\n<p>„Handlungswille (+), Erklärungswille (-), da noch kein unmittelbarer Geschäftserfolg angestrebt, sondern lediglich vorbereitet ⇒ keine WE\"<\/p>\n<\/blockquote>\n<p><strong>Warum ist das so?<\/strong> Stell dir vor, das Plakat wäre ein Angebot. Dann könnten 5.000 Leute „Ja\" sagen — und Media Markt müsste 5.000 Konsolen liefern, die es gar nicht gibt. Deshalb ist Werbung nur eine <strong>Einladung, selbst ein Angebot zu machen<\/strong>.<\/p>\n<p><strong>e2) Media Markt schickt Anneliese ungefragt eine PS5 mit Rechnung<\/strong><\/p>\n<p>Hier ist es anders: Die Konsole steht bei ihr im Flur. Sie muss nur noch zugreifen. Das <strong>ist<\/strong> ein Angebot.<\/p>\n<blockquote>\n<p>„Handlungswille (+), Erklärungswille (+), Erklärung (+) durch konkludentes Verhalten „Zuschicken\", AB muss nur noch zugreifen ⇒ wirksame WE, allerdings kein Vertragsschluss wegen § 241a\"<\/p>\n<\/blockquote>\n<p><strong>Und jetzt der wichtige Teil:<\/strong> Trotz wirksamem Angebot entsteht <strong>kein Vertrag<\/strong> — wegen <strong>§ 241a<\/strong>. Unbestellte Ware an einen Verbraucher begründet keine Ansprüche. Anneliese muss weder zahlen noch zurückschicken noch sich melden.<\/p>\n<p><strong>e3) Anneliese bietet ihre gebrauchte PS5 auf Amazon für 350 € an<\/strong><\/p>\n<p>Der Dozent sagt: hier eher <strong>ja<\/strong>, ein Angebot — weil man auf Amazon direkt in den Warenkorb legen kann und der Verkäufer an jeden verkaufen will.<\/p>\n<blockquote>\n<p>„Erklärungswille (?): da bei Amazon die Ware durch Klicken unmittelbar in den eigenen Warenkorb gelegt werden kann und die Fa. an jeden verkaufen will (+) ⇒ wirksame WE, <strong>andere Ansicht (a.A.) vertretbar<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>e4) Anneliese hat einen Stand auf einer Gamer-Börse, PS5 mit 350 € ausgezeichnet<\/strong><\/p>\n<blockquote>\n<p>„Erklärungswille (?): <strong>beide Ansichten vertretbar<\/strong>, zu argumentieren ist, ob sich AB noch bezüglich des Käufers Gedanken machen wollte.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Zwei Dinge:<\/p>\n<ol>\n<li><strong>Die Leitfrage lautet immer:<\/strong> Will sich der Anbietende schon jetzt binden — oder will er sich den Vertragspartner noch aussuchen? Je begrenzter der Vorrat, desto eher nur eine Einladung.<\/li>\n<li><strong>Der Dozent schreibt zweimal „andere Ansicht vertretbar\".<\/strong> Das ist ein Geschenk: In der Klausur zählt deine <strong>Begründung<\/strong> mehr als das Ergebnis. Schreib nie nur „ja\" oder „nein\" — schreib, <em>warum<\/em>.<\/li>\n<\/ol>","text":"Diese Sammlung übt eine einzige Frage : Liegt überhaupt eine Willenserklärung vor? Der Dozent prüft immer nach demselben Muster: Handlungswille? Erklärungswille? Und wenn es eng wird: Wie sieht es ein vernünftiger Empfänger? (§§ 133, 157) Fall 01 a) — Die Kino-Frage Der Sachverhalt. Denny fragt Nancy: „Wollen wir heute Abend zusammen ins Gibson's gehen?\" Was gefragt ist. Ist das eine Willenserklärung? Schritt für Schritt. Denny hat bewusst gesprochen — er wollte etwas tun. Handlungswille liegt vor. Aber: Wollte er damit etwas rechtlich Verbindliches auslösen? Nein. Wenn Nancy nicht kommt, kann er sie nicht verklagen. Es ging um einen netten Abend, nicht um eine Rechtsfolge. Erklärungswille fehlt. Die Lösung des Dozenten. „Handlungswille (+), Erklärungswille (-): keine rechtlich erhebliche Folge angestrebt ⇒ keine wirksame WE\" Was du mitnimmst. Das nennt man eine Gefälligkeit . Verabredungen unter Freunden sind kein Vertrag. Das ist der Normalfall im Alltag — die meisten Dinge, die wir sagen, sind rechtlich gar nichts. Fall 01 b) — Die Zimmerpflanzen Der Sachverhalt. Anneliese bittet ihren Nachbarn Jimmy, im Urlaub ihre Zimmerpflanzen zu gießen. Schritt für Schritt. Wie im Kino-Fall: Nachbarschaftshilfe ist eine Gefälligkeit, kein Vertrag. Wenn Jimmy es vergisst, kann Anneliese nicht klagen. Aber — und das ist die Pointe des Falls — es kommt auf die Umstände an. Wenn es sich um eine seltene Orchideensammlung im Wert von 3.000 Euro handelt und Jimmy das erkennen konnte, sieht die Sache anders aus. Dann durfte Anneliese davon ausgehen, dass er die Verantwortung ernst nimmt. Die Lösung des Dozenten. „Handlungswille (+); Erklärungswille (-): s.o. ⇒ keine wirksame WE — anders ggfs. wenn die Pflanzen einen besonderen Wert haben und J dies erkennen konnte (§§ 133, 157 Auslegung vom Empfängerhorizont)\" Was du mitnimmst. Je höher der Wert und je größer das Risiko, desto eher nimmt das Recht einen Rechtsbindungswillen an. Ein Gefallen unter Nachbarn ist etwas anderes als die Betreuung eines Vermögenswerts. Fall 01 c) — Das Winken bei der Weinauktion ★ Der Sachverhalt. Denny kommt in einen Auktionsraum, sieht seinen Freund Jimmy und winkt ihm freudig zu . Im selben Moment schlägt der Auktionator zu und beglückwünscht Denny zum Kauf von 10 Fuder Wein für 45.400 Euro . Was gefragt ist. Muss Denny den Wein bezahlen? Schritt für Schritt. Aus Dennys Sicht: Er wollte winken, nicht kaufen. Sein Erklärungswille fehlt — er hatte kein Bewusstsein, etwas rechtlich Bedeutsames zu tun. Aber jetzt die entscheidende Frage: Wie musste der Auktionator das sehen? In einem Auktionsraum bedeutet Handheben genau eine Sache: ein Gebot. Ein vernünftiger Auktionator durfte das als Gebot verstehen. Und weil im Recht der objektive Empfängerhorizont entscheidet (§§ 133, 157), liegt eine wirksame Willenserklärung vor. Der Kaufvertrag kommt zustande. Die Lösung des Dozenten. „Handlungswille (+), Erklärungswille (?), subjektiv aus der Sicht von D (-), jedoch nach Auslegung vom obj. Empfängerhorizont (+) ⇒ wirksame WE\" Was du mitnimmst. Das ist der Grundsatzfall der ganzen Sammlung. Merk ihn dir: Es zählt nicht, was du dachtest, sondern was der andere verstehen durfte. Und die Anschlussfrage, die in der Klausur kommen könnte: Ist Denny damit verloren? Nein — er kann anfechten (§ 119 I, Kapitel 11), weil Wille und Erklärung auseinanderfielen. Er muss dann aber Jimmy den Vertrauensschaden ersetzen (§ 122). Genau dafür gibt es die Anfechtung. Fall 01 d) — Die vorbereitete Kündigung ★ Der Sachverhalt. Anneliese hat eine neue Wohnung in Aussicht, aber noch nichts unterschrieben. Sie bereitet die Kündigung ihrer alten Wohnung vor, steckt sie in einen adressierten Umschlag und legt ihn auf den Tisch. Ihr Lebensgefährte Denny sieht den Umschlag, frankiert ihn und wirft ihn ein. Zwei Tage später kommt er beim Vermieter an. Der neue Mietvertrag platzt. Was gefragt ist. Ist Annelieses Kündigung wirksam? Sie steht sonst ohne Wohnung da. Schritt für Schritt. Anneliese wollte die Kündigung nur vorbereiten , nicht abgeben. Aus ihrer Sicht fehlt der Erklärungswille — sie hat die Erklärung nicht „mit Wissen und Wollen\" in den Verkehr gebracht. Aber der Vermieter sieht nur: ein unterschriebenes Kündigungsschreiben in seinem Briefkasten. Er kann nicht wissen, dass der Brief noch auf dem Tisch liegen sollte. Für ihn ist das eine ganz normale Kündigung. Wieder gewinnt der objektive Empfängerhorizont: Die Kündigung ist wirksam. Die Lösung des Dozenten. „Handlungswille (+ bezüglich Verfassens der Kündigung), Erklärungswille (?): A wollte ihre Erklärung nur vorbereiten und hat sie nicht mit Wissen und Wollen abgegeben, subjektiv aus sicht von AB (-), jedoch nach Auslegung vom obj. Empfängerhorizont (+) ⇒ wirksame WE\" Was du mitnimmst. Derselbe Gedanke wie im Auktionsfall, aber in einer alltäglicheren Situation. Sobald eine Erklärung aus deinem Bereich heraus in die Welt gelangt, musst du dich meist daran festhalten lassen — auch wenn ein Dritter sie losgeschickt hat. Fall 01 e) — Vier Verkaufssituationen im Vergleich ★ Das ist die wichtigste Teilaufgabe der Sammlung, weil sie invitatio ad offerendum von einem echten Angebot trennt. Vier Varianten: e1) Media Markt plakatiert „Schnell-Spar-Tage, PS5 Pro 649 €\" Das ist Werbung. Der Markt will noch keinen Vertrag schließen — er will, dass Leute in den Laden kommen. „Handlungswille (+), Erklärungswille (-), da noch kein unmittelbarer Geschäftserfolg angestrebt, sondern lediglich vorbereitet ⇒ keine WE\" Warum ist das so? Stell dir vor, das Plakat wäre ein Angebot. Dann könnten 5.000 Leute „Ja\" sagen — und Media Markt müsste 5.000 Konsolen liefern, die es gar nicht gibt. Deshalb ist Werbung nur eine Einladung, selbst ein Angebot zu machen . e2) Media Markt schickt Anneliese ungefragt eine PS5 mit Rechnung Hier ist es anders: Die Konsole steht bei ihr im Flur. Sie muss nur noch zugreifen. Das ist ein Angebot. „Handlungswille (+), Erklärungswille (+), Erklärung (+) durch konkludentes Verhalten „Zuschicken\", AB muss nur noch zugreifen ⇒ wirksame WE, allerdings kein Vertragsschluss wegen § 241a\" Und jetzt der wichtige Teil: Trotz wirksamem Angebot entsteht kein Vertrag — wegen § 241a . Unbestellte Ware an einen Verbraucher begründet keine Ansprüche. Anneliese muss weder zahlen noch zurückschicken noch sich melden. e3) Anneliese bietet ihre gebrauchte PS5 auf Amazon für 350 € an Der Dozent sagt: hier eher ja , ein Angebot — weil man auf Amazon direkt in den Warenkorb legen kann und der Verkäufer an jeden verkaufen will. „Erklärungswille (?): da bei Amazon die Ware durch Klicken unmittelbar in den eigenen Warenkorb gelegt werden kann und die Fa. an jeden verkaufen will (+) ⇒ wirksame WE, andere Ansicht (a.A.) vertretbar \" e4) Anneliese hat einen Stand auf einer Gamer-Börse, PS5 mit 350 € ausgezeichnet „Erklärungswille (?): beide Ansichten vertretbar , zu argumentieren ist, ob sich AB noch bezüglich des Käufers Gedanken machen wollte.\" Was du mitnimmst. Zwei Dinge: Die Leitfrage lautet immer: Will sich der Anbietende schon jetzt binden — oder will er sich den Vertragspartner noch aussuchen? Je begrenzter der Vorrat, desto eher nur eine Einladung. Der Dozent schreibt zweimal „andere Ansicht vertretbar\". Das ist ein Geschenk: In der Klausur zählt deine Begründung mehr als das Ergebnis. Schreib nie nur „ja\" oder „nein\" — schreib, warum .","words":1136,"mins":6},{"id":"f-2-fälle-zum-wirksamwerden-zugang","subject":"faelle","num":"2","title":"2. Fälle zum Wirksamwerden (Zugang)","short":"Fälle zum Wirksamwerden (Zugang)","html":"<p>Alles in dieser Sammlung dreht sich um eine Frage: <strong>Wann genau ist eine Erklärung angekommen?<\/strong><\/p>\n<p>Die Definition, die du dafür brauchst, steht in Kapitel 5 und muss sitzen:<\/p>\n<blockquote>\n<p>Zugegangen ist eine WE, wenn sie so in den <strong>Machtbereich<\/strong> des Empfängers gelangt ist, dass eine <strong>Kenntnisnahme möglich<\/strong> und nach der <strong>Verkehrsanschauung üblich<\/strong> ist.<\/p>\n<\/blockquote>\n<h3 id=\"f-fall-02-a-der-anruf\">Fall 02 a) — Der Anruf<\/h3>\n<p>Nancy will Denny ihre PS5 für 230 Euro verkaufen und <strong>ruft ihn an<\/strong>.<\/p>\n<p><strong>Variante 1: Er hört zu.<\/strong><\/p>\n<blockquote>\n<p>„Zugang unter Anwesenden, § 147 I, S. 2 auch Telefon ⇒ Wirksamwerden sofort\"<\/p>\n<\/blockquote>\n<p><strong>Variante 2: Er ist abgelenkt und versteht sie nicht.<\/strong><\/p>\n<blockquote>\n<p>„Zugang ebenfalls sofort, § 147 I, S. 2. Das Zugangshindernis liegt in der Sphäre des Empfängers\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Ein <strong>Telefonat zählt als „unter Anwesenden\"<\/strong> — das steht ausdrücklich in § 147 I S. 2. Und: Wer am Telefon nicht zuhört, hat Pech. Das Problem liegt in seinem Bereich.<\/p>\n<h3 id=\"f-fall-02-b-der-brief\">Fall 02 b) — Der Brief<\/h3>\n<p>Nancy schreibt am 04.05. einen Brief, der am 06.05. in Dennys Briefkasten landet.<\/p>\n<table>\n<thead>\n<tr>\n<th>Variante<\/th>\n<th>Zugang wann?<\/th>\n<th>Warum<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Er liest ihn am Abend des 06.<\/td>\n<td><strong>06.05.<\/strong><\/td>\n<td>Machtbereich (+) mit Einwurf, Kenntnisnahme an dem Tag üblich<\/td>\n<\/tr>\n<tr>\n<td>Er liest ihn erst am 10.05., weil er im Urlaub war<\/td>\n<td><strong>trotzdem 06.05.<\/strong><\/td>\n<td>die tatsächliche Kenntnisnahme zählt nicht<\/td>\n<\/tr>\n<tr>\n<td>… und Nancy <strong>wusste<\/strong>, dass er im Urlaub ist<\/td>\n<td><strong>trotzdem 06.05.<\/strong><\/td>\n<td>ändert nichts!<\/td>\n<\/tr>\n<tr>\n<td>Denny hat gar keinen Briefkasten<\/td>\n<td><strong>trotzdem zugegangen<\/strong><\/td>\n<td>§ 162 I analog, das Hindernis liegt bei ihm<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Die Lösung des Dozenten zur Urlaubsvariante:<\/strong><\/p>\n<blockquote>\n<p>„Kein Unterschied zum Ausgangsfall, da es auf die tatsächliche Kenntnisnahme nicht ankommt, <strong>selbst dann nicht, wenn die Erklärende weiß, dass im konkreten Fall nicht mit der üblichen Kenntnisnahme zu rechnen ist<\/strong>.\"<\/p>\n<\/blockquote>\n<p><strong>Zur Briefkasten-Variante:<\/strong><\/p>\n<blockquote>\n<p>„Machtbereich (-), allerdings liegt das Zugangshindernis in der Sphäre des Empfängers. Daher muss er sich so behandeln lassen, als habe das Zugangshindernis nicht bestanden, § 162 I analog.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Die dritte Zeile der Tabelle ist die überraschende: <strong>Selbst wenn der Absender weiß, dass der Empfänger verreist ist, ändert das nichts.<\/strong> Das ist ein perfektes Klausurdetail, weil es dem Bauchgefühl widerspricht.<\/p>\n<h3 id=\"f-fall-02-c-die-e-mail-um-21-uhr\">Fall 02 c) — Die E-Mail um 21 Uhr ★<\/h3>\n<p>Nancy schreibt am 04.05. <strong>um 21:00 Uhr<\/strong> eine E-Mail.<\/p>\n<table>\n<thead>\n<tr>\n<th>Variante<\/th>\n<th>Zugang wann?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Er liest sie um 21:01<\/td>\n<td><strong>erst am Folgetag<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Er liest sie am nächsten Morgen um 9:00<\/td>\n<td><strong>am Folgetag<\/strong> (dasselbe)<\/td>\n<\/tr>\n<tr>\n<td>Er liest sie nie, weil er den Account gewechselt hat<\/td>\n<td>kommt auf den Einzelfall an<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„eMail ist eine Erklärung unter Abwesenden, § 130 I; Machtbereich (+, um 21 Uhr); <strong>mögliche Kenntnisnahme schon dann, üblich jedoch nicht schon am Abend, sondern im Laufe des nächsten Tages am 05.05.<\/strong>\"<\/p>\n<\/blockquote>\n<p>Zur dritten Variante:<\/p>\n<blockquote>\n<p>„Machtbereich? (-); Zugangshindernis beim Erklärenden oder beim Empfänger? kommt auf die Umstände des Einzelfalls an. Im Normalfall ist der Empfänger verpflichtet, den Zugang von Erklärungen auch bei Adresswechsel sicherzustellen, wenn das im konkreten Fall ein üblicher Weg ist, entsprechende Erklärungen zu empfangen\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Die erste Zeile ist der Merksatz: <strong>Auch wenn er sie tatsächlich eine Minute später liest, geht sie erst am nächsten Tag zu.<\/strong> Denn maßgeblich ist die <em>übliche<\/em> Kenntnisnahme, nicht die tatsächliche. Abends um 21 Uhr rechnet niemand damit, dass eine Privatperson noch Mails liest.<\/p>\n<h3 id=\"f-fall-02-d-angebot-und-widerruf-beide-per-mail\">Fall 02 d) — Angebot und Widerruf, beide per Mail ★★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Nancy mailt Denny um <strong>21:00 Uhr<\/strong> das Angebot (PS5 für 230 €). Er liest es um 21:01. Kurz darauf kommt ihre Freundin Billie vorbei und bietet <strong>250 Euro<\/strong>. Nancy gibt Billie die Konsole sofort mit und mailt Denny um <strong>22:00 Uhr<\/strong>, dass sie doch nicht verkaufen will.<\/p>\n<p><strong>Was gefragt ist.<\/strong> Hat Denny einen Anspruch auf die Konsole?<\/p>\n<p><strong>Schritt für Schritt — und das ist der wichtigste Fall der ganzen Sammlung.<\/strong><\/p>\n<ol>\n<li>Ein Vertrag braucht Angebot und Annahme (§ 145).<\/li>\n<li>Nancys Mail um 21 Uhr ist ein Angebot — aber wirksam wird sie erst mit <strong>Zugang<\/strong>.<\/li>\n<li>Zugang der 21-Uhr-Mail: erst am <strong>Folgetag<\/strong> (abends rechnet niemand mit Lesen).<\/li>\n<li>Zugang der 22-Uhr-Mail (Widerruf): ebenfalls erst am <strong>Folgetag<\/strong>.<\/li>\n<li>Beide gehen also <strong>gleichzeitig<\/strong> zu.<\/li>\n<li><strong>§ 130 I S. 2:<\/strong> Eine WE wird nicht wirksam, wenn dem Empfänger vorher <strong>oder gleichzeitig<\/strong> ein Widerruf zugeht.<\/li>\n<li>Ergebnis: Das Angebot wird nie wirksam. Kein Vertrag. Denny bekommt nichts.<\/li>\n<\/ol>\n<p><strong>Warum das trotz „er hat es doch gelesen\" so ist:<\/strong> Weil es rechtlich nicht auf das tatsächliche Lesen ankommt. Beide Mails landen im selben rechtlichen Zeitfenster.<\/p>\n<p><strong>Die Lösung des Dozenten<\/strong> — er hat diesen einen Fall <strong>komplett im Gutachtenstil ausformuliert<\/strong>, mit Klammerkommentaren, welcher Schritt gerade dran ist:<\/p>\n<blockquote>\n<p>„Denny könnte einen Anspruch auf Übereignung der Konsole zum Preis von 230 EUR haben. Grundlage hierfür wäre ein wirksamer Kaufvertrag nach § 433 I. (<strong>„Obersatz\"<\/strong>)\nEin Vertrag kommt gemäß §§ 145 ff durch Angebot und Annahme zustande (<strong>„Tatbestandsmerkmale, TBM\"<\/strong>). Bei einem Angebot handelt es sich um eine Willenserklärung (WE), die wirksam geworden sein müsste (<strong>„Definition\"<\/strong>).\nEine WE ist eine von einem Handlungswillen getragene Äußerung, durch die die Erklärenden einen Rechtserfolg herbeiführen möchten (<strong>„neue Definition\"<\/strong>). Durch das Schreiben der Mail wollte Nancy den Rechtserfolg eines Kaufvertrages mit Denny herbeiführen (<strong>„Subsumtion\"<\/strong>). Somit liegt ein Angebot vor (<strong>„Teilergebnis\"<\/strong>).\nFraglich ist, ob dieses wirksam geworden ist (<strong>„TBM auf nächster Stufe\"<\/strong>). Wirksam werden WE unter Abwesenden mit Zugang, § 130 I (<strong>„Definition\"<\/strong>). Zugegangen ist eine WE, wenn sie so in den Machtbereich des Erklärungsempfängers gelangt ist, dass eine Kenntnisnahme möglich und üblich ist (<strong>„Definition eine Ebene tiefer\"<\/strong>). […]\nAllerdings wird eine WE nicht wirksam, wenn dem Empfänger vor deren Zugang oder gleichzeitig ein Widerruf zugeht § 130 I, 2 […] <strong>Folglich wird durch den gleichzeitigen Zugang des Widerrufs das Ausgangsangebot nicht wirksam, § 130 I 2<\/strong> (<strong>„Zwischenergebnis\"<\/strong>).\nFolglich liegt Denny kein wirksames Angebot durch Nancy vor, so dass auch kein Kaufvertrag nach §§ 433, 145 geschlossen wurde und demnach Danny keinen Anspruch auf Übereignung der Konsole hat (<strong>„Schlusssatz\"<\/strong>)\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Lies diese Lösung <strong>im Original einmal ganz durch<\/strong> — sie ist deine Schreibvorlage für die Klausur. Der Dozent hat die Klammerkommentare extra reingeschrieben, damit man sieht, welcher Baustein gerade dran ist. So soll dein Gutachten aussehen.<\/p>\n<h3 id=\"f-fall-02-e-wer-darf-post-entgegennehmen\">Fall 02 e) — Wer darf Post entgegennehmen? ★<\/h3>\n<p>Nancy gibt den Brief am 04.05. ihrer Freundin Anne mit, die Denny abends besuchen will. Fünf Varianten:<\/p>\n<table>\n<thead>\n<tr>\n<th>Variante<\/th>\n<th>Zugang wann?<\/th>\n<th>Warum<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Denny nimmt den Brief abends von Anne entgegen<\/td>\n<td><strong>04.05. sofort<\/strong><\/td>\n<td>Anne ist <strong>Erklärungsbotin<\/strong>, Übergabe = unter Anwesenden<\/td>\n<\/tr>\n<tr>\n<td>Anne vergisst es und gibt ihn erst am 15.05. ab<\/td>\n<td><strong>15.05.<\/strong><\/td>\n<td>Erklärungsbotin, Verzögerung geht zulasten der Absenderin<\/td>\n<\/tr>\n<tr>\n<td>Denny ist nicht da, Anne wirft den Brief ein<\/td>\n<td><strong>05.05.<\/strong><\/td>\n<td>jetzt Zugang unter Abwesenden, § 130 I<\/td>\n<\/tr>\n<tr>\n<td>Anne gibt ihn dem <strong>Mitbewohner<\/strong> Jimmy, der gibt ihn 3 Tage später weiter<\/td>\n<td><strong>05.05.<\/strong><\/td>\n<td>Mitbewohner = <strong>Empfangsbote<\/strong>, Zugang schon am 04.05. + übliche Weitergabe<\/td>\n<\/tr>\n<tr>\n<td>Anne gibt ihn der <strong>Nachbarin<\/strong> Billie, die gibt ihn 3 Tage später weiter<\/td>\n<td><strong>07.05.<\/strong><\/td>\n<td>Nachbarin ist <strong>kein<\/strong> Empfangsbote → falsche Auswahl, Risiko beim Absender<\/td>\n<\/tr>\n<tr>\n<td>Anne trifft nur den <strong>10-jährigen Sohn<\/strong> an, der gibt ihn 3 Tage später weiter<\/td>\n<td><strong>erst nach 3 Tagen<\/strong><\/td>\n<td>ein 10-Jähriger ist kein Empfangsbote<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Die Lösung des Dozenten zum Mitbewohner:<\/strong><\/p>\n<blockquote>\n<p>„Der Mitbewohner in derselben Wohnung gilt nach der Verkehrsanschauung als befugt, für den Empfänger Erklärungen entgegenzunehmen. Er ist damit als Empfangsbote für den Empfänger anzusehen.\"<\/p>\n<\/blockquote>\n<p><strong>Zur Nachbarin:<\/strong><\/p>\n<blockquote>\n<p>„Die Nachbarin gilt normalerweise nicht als befugt, Erklärungen entgegenzunehmen und kann nicht als Empfangsbotin angesehen werden. Daher liegt das Störungsereignis durch die fehlerhafte Auswahl der Übergabeperson in der Sphäre der Erklärenden.\"<\/p>\n<\/blockquote>\n<p><strong>Zum Kind:<\/strong><\/p>\n<blockquote>\n<p>„Auch ein 10-Jähriger gilt nicht als dafür vorgesehen, Willenserklärungen für einen Dritten entgegenzunehmen (fehlerhafte Auswahl).\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Merk dir die eine Leitfrage: <strong>Wessen Person ist das?<\/strong><\/p>\n<ul>\n<li>Gehört sie zum <strong>Absender<\/strong> (Erklärungsbote) → Verzögerung ist dessen Problem.<\/li>\n<li>Gehört sie zum <strong>Empfänger<\/strong> (Empfangsbote) → Zugang sofort, Verzögerung ist dessen Problem.<\/li>\n<\/ul>\n<p>Und wer ist Empfangsbote? Wer <strong>im Haushalt oder Betrieb<\/strong> des Empfängers lebt bzw. arbeitet: Mitbewohner ✓, Ehepartner ✓, Angestellte ✓ — Nachbarn ✗, Kinder ✗.<\/p>\n<p><strong>Praktisch für dich:<\/strong> Wenn du eine fristgebundene Kündigung abgibst, gib sie <strong>niemals<\/strong> dem Nachbarn mit. Wirf sie selbst ein.<\/p>\n<h3 id=\"f-fall-02-f-der-brief-ins-firmenpostfach\">Fall 02 f) — Der Brief ins Firmenpostfach<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Nancy verkauft an die Händlerin Billie. Der Brief landet am <strong>Abend des 04.05.<\/strong> im Postfach der Firma. Am Nachmittag des Folgetages liest ihn der Angestellte Denny und entsorgt ihn, ohne ihn weiterzugeben.<\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Machtbereich am 04.05.; übliche Kenntnisnahme im Geschäftsbereich: <strong>am Vormittag des Folgetages<\/strong>.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Bei Firmen liegt die übliche Kenntnisnahme <strong>am Vormittag des nächsten Werktages<\/strong> — Geschäftsräume werden morgens geöffnet. Und dass der Angestellte den Brief wegwirft, ändert nichts: Das passiert im Machtbereich der Empfängerin.<\/p>","text":"Alles in dieser Sammlung dreht sich um eine Frage: Wann genau ist eine Erklärung angekommen? Die Definition, die du dafür brauchst, steht in Kapitel 5 und muss sitzen: Zugegangen ist eine WE, wenn sie so in den Machtbereich des Empfängers gelangt ist, dass eine Kenntnisnahme möglich und nach der Verkehrsanschauung üblich ist. Fall 02 a) — Der Anruf Nancy will Denny ihre PS5 für 230 Euro verkaufen und ruft ihn an . Variante 1: Er hört zu. „Zugang unter Anwesenden, § 147 I, S. 2 auch Telefon ⇒ Wirksamwerden sofort\" Variante 2: Er ist abgelenkt und versteht sie nicht. „Zugang ebenfalls sofort, § 147 I, S. 2. Das Zugangshindernis liegt in der Sphäre des Empfängers\" Was du mitnimmst. Ein Telefonat zählt als „unter Anwesenden\" — das steht ausdrücklich in § 147 I S. 2. Und: Wer am Telefon nicht zuhört, hat Pech. Das Problem liegt in seinem Bereich. Fall 02 b) — Der Brief Nancy schreibt am 04.05. einen Brief, der am 06.05. in Dennys Briefkasten landet. Variante Zugang wann? Warum Er liest ihn am Abend des 06. 06.05. Machtbereich (+) mit Einwurf, Kenntnisnahme an dem Tag üblich Er liest ihn erst am 10.05., weil er im Urlaub war trotzdem 06.05. die tatsächliche Kenntnisnahme zählt nicht … und Nancy wusste , dass er im Urlaub ist trotzdem 06.05. ändert nichts! Denny hat gar keinen Briefkasten trotzdem zugegangen § 162 I analog, das Hindernis liegt bei ihm Die Lösung des Dozenten zur Urlaubsvariante: „Kein Unterschied zum Ausgangsfall, da es auf die tatsächliche Kenntnisnahme nicht ankommt, selbst dann nicht, wenn die Erklärende weiß, dass im konkreten Fall nicht mit der üblichen Kenntnisnahme zu rechnen ist .\" Zur Briefkasten-Variante: „Machtbereich (-), allerdings liegt das Zugangshindernis in der Sphäre des Empfängers. Daher muss er sich so behandeln lassen, als habe das Zugangshindernis nicht bestanden, § 162 I analog.\" Was du mitnimmst. Die dritte Zeile der Tabelle ist die überraschende: Selbst wenn der Absender weiß, dass der Empfänger verreist ist, ändert das nichts. Das ist ein perfektes Klausurdetail, weil es dem Bauchgefühl widerspricht. Fall 02 c) — Die E-Mail um 21 Uhr ★ Nancy schreibt am 04.05. um 21:00 Uhr eine E-Mail. Variante Zugang wann? Er liest sie um 21:01 erst am Folgetag Er liest sie am nächsten Morgen um 9:00 am Folgetag (dasselbe) Er liest sie nie, weil er den Account gewechselt hat kommt auf den Einzelfall an Die Lösung des Dozenten. „eMail ist eine Erklärung unter Abwesenden, § 130 I; Machtbereich (+, um 21 Uhr); mögliche Kenntnisnahme schon dann, üblich jedoch nicht schon am Abend, sondern im Laufe des nächsten Tages am 05.05. \" Zur dritten Variante: „Machtbereich? (-); Zugangshindernis beim Erklärenden oder beim Empfänger? kommt auf die Umstände des Einzelfalls an. Im Normalfall ist der Empfänger verpflichtet, den Zugang von Erklärungen auch bei Adresswechsel sicherzustellen, wenn das im konkreten Fall ein üblicher Weg ist, entsprechende Erklärungen zu empfangen\" Was du mitnimmst. Die erste Zeile ist der Merksatz: Auch wenn er sie tatsächlich eine Minute später liest, geht sie erst am nächsten Tag zu. Denn maßgeblich ist die übliche Kenntnisnahme, nicht die tatsächliche. Abends um 21 Uhr rechnet niemand damit, dass eine Privatperson noch Mails liest. Fall 02 d) — Angebot und Widerruf, beide per Mail ★★ Der Sachverhalt. Nancy mailt Denny um 21:00 Uhr das Angebot (PS5 für 230 €). Er liest es um 21:01. Kurz darauf kommt ihre Freundin Billie vorbei und bietet 250 Euro . Nancy gibt Billie die Konsole sofort mit und mailt Denny um 22:00 Uhr , dass sie doch nicht verkaufen will. Was gefragt ist. Hat Denny einen Anspruch auf die Konsole? Schritt für Schritt — und das ist der wichtigste Fall der ganzen Sammlung. Ein Vertrag braucht Angebot und Annahme (§ 145). Nancys Mail um 21 Uhr ist ein Angebot — aber wirksam wird sie erst mit Zugang . Zugang der 21-Uhr-Mail: erst am Folgetag (abends rechnet niemand mit Lesen). Zugang der 22-Uhr-Mail (Widerruf): ebenfalls erst am Folgetag . Beide gehen also gleichzeitig zu. § 130 I S. 2: Eine WE wird nicht wirksam, wenn dem Empfänger vorher oder gleichzeitig ein Widerruf zugeht. Ergebnis: Das Angebot wird nie wirksam. Kein Vertrag. Denny bekommt nichts. Warum das trotz „er hat es doch gelesen\" so ist: Weil es rechtlich nicht auf das tatsächliche Lesen ankommt. Beide Mails landen im selben rechtlichen Zeitfenster. Die Lösung des Dozenten — er hat diesen einen Fall komplett im Gutachtenstil ausformuliert , mit Klammerkommentaren, welcher Schritt gerade dran ist: „Denny könnte einen Anspruch auf Übereignung der Konsole zum Preis von 230 EUR haben. Grundlage hierfür wäre ein wirksamer Kaufvertrag nach § 433 I. ( „Obersatz\" ) Ein Vertrag kommt gemäß §§ 145 ff durch Angebot und Annahme zustande ( „Tatbestandsmerkmale, TBM\" ). Bei einem Angebot handelt es sich um eine Willenserklärung (WE), die wirksam geworden sein müsste ( „Definition\" ). Eine WE ist eine von einem Handlungswillen getragene Äußerung, durch die die Erklärenden einen Rechtserfolg herbeiführen möchten ( „neue Definition\" ). Durch das Schreiben der Mail wollte Nancy den Rechtserfolg eines Kaufvertrages mit Denny herbeiführen ( „Subsumtion\" ). Somit liegt ein Angebot vor ( „Teilergebnis\" ). Fraglich ist, ob dieses wirksam geworden ist ( „TBM auf nächster Stufe\" ). Wirksam werden WE unter Abwesenden mit Zugang, § 130 I ( „Definition\" ). Zugegangen ist eine WE, wenn sie so in den Machtbereich des Erklärungsempfängers gelangt ist, dass eine Kenntnisnahme möglich und üblich ist ( „Definition eine Ebene tiefer\" ). […] Allerdings wird eine WE nicht wirksam, wenn dem Empfänger vor deren Zugang oder gleichzeitig ein Widerruf zugeht § 130 I, 2 […] Folglich wird durch den gleichzeitigen Zugang des Widerrufs das Ausgangsangebot nicht wirksam, § 130 I 2 ( „Zwischenergebnis\" ). Folglich liegt Denny kein wirksames Angebot durch Nancy vor, so dass auch kein Kaufvertrag nach §§ 433, 145 geschlossen wurde und demnach Danny keinen Anspruch auf Übereignung der Konsole hat ( „Schlusssatz\" )\" Was du mitnimmst. Lies diese Lösung im Original einmal ganz durch — sie ist deine Schreibvorlage für die Klausur. Der Dozent hat die Klammerkommentare extra reingeschrieben, damit man sieht, welcher Baustein gerade dran ist. So soll dein Gutachten aussehen. Fall 02 e) — Wer darf Post entgegennehmen? ★ Nancy gibt den Brief am 04.05. ihrer Freundin Anne mit, die Denny abends besuchen will. Fünf Varianten: Variante Zugang wann? Warum Denny nimmt den Brief abends von Anne entgegen 04.05. sofort Anne ist Erklärungsbotin , Übergabe = unter Anwesenden Anne vergisst es und gibt ihn erst am 15.05. ab 15.05. Erklärungsbotin, Verzögerung geht zulasten der Absenderin Denny ist nicht da, Anne wirft den Brief ein 05.05. jetzt Zugang unter Abwesenden, § 130 I Anne gibt ihn dem Mitbewohner Jimmy, der gibt ihn 3 Tage später weiter 05.05. Mitbewohner = Empfangsbote , Zugang schon am 04.05. + übliche Weitergabe Anne gibt ihn der Nachbarin Billie, die gibt ihn 3 Tage später weiter 07.05. Nachbarin ist kein Empfangsbote → falsche Auswahl, Risiko beim Absender Anne trifft nur den 10-jährigen Sohn an, der gibt ihn 3 Tage später weiter erst nach 3 Tagen ein 10-Jähriger ist kein Empfangsbote Die Lösung des Dozenten zum Mitbewohner: „Der Mitbewohner in derselben Wohnung gilt nach der Verkehrsanschauung als befugt, für den Empfänger Erklärungen entgegenzunehmen. Er ist damit als Empfangsbote für den Empfänger anzusehen.\" Zur Nachbarin: „Die Nachbarin gilt normalerweise nicht als befugt, Erklärungen entgegenzunehmen und kann nicht als Empfangsbotin angesehen werden. Daher liegt das Störungsereignis durch die fehlerhafte Auswahl der Übergabeperson in der Sphäre der Erklärenden.\" Zum Kind: „Auch ein 10-Jähriger gilt nicht als dafür vorgesehen, Willenserklärungen für einen Dritten entgegenzunehmen (fehlerhafte Auswahl).\" Was du mitnimmst. Merk dir die eine Leitfrage: Wessen Person ist das? Gehört sie zum Absender (Erklärungsbote) → Verzögerung ist dessen Problem. Gehört sie zum Empfänger (Empfangsbote) → Zugang sofort, Verzögerung ist dessen Problem. Und wer ist Empfangsbote? Wer im Haushalt oder Betrieb des Empfängers lebt bzw. arbeitet: Mitbewohner ✓, Ehepartner ✓, Angestellte ✓ — Nachbarn ✗, Kinder ✗. Praktisch für dich: Wenn du eine fristgebundene Kündigung abgibst, gib sie niemals dem Nachbarn mit. Wirf sie selbst ein. Fall 02 f) — Der Brief ins Firmenpostfach Der Sachverhalt. Nancy verkauft an die Händlerin Billie. Der Brief landet am Abend des 04.05. im Postfach der Firma. Am Nachmittag des Folgetages liest ihn der Angestellte Denny und entsorgt ihn, ohne ihn weiterzugeben. Die Lösung des Dozenten. „Machtbereich am 04.05.; übliche Kenntnisnahme im Geschäftsbereich: am Vormittag des Folgetages .\" Was du mitnimmst. Bei Firmen liegt die übliche Kenntnisnahme am Vormittag des nächsten Werktages — Geschäftsräume werden morgens geöffnet. Und dass der Angestellte den Brief wegwirft, ändert nichts: Das passiert im Machtbereich der Empfängerin.","words":1415,"mins":7},{"id":"f-3-fälle-zum-minderjährigenrecht","subject":"faelle","num":"3","title":"3. Fälle zum Minderjährigenrecht","short":"Fälle zum Minderjährigenrecht","html":"<p>Die wichtigste Sammlung. Rechne fest damit, dass so etwas in der Klausur steht.<\/p>\n<p><strong>Die Kette, die du bei jedem dieser Fälle durchgehst:<\/strong>\nWie alt? → § 107 nur Vorteil? → Einwilligung der Eltern? → § 110 Taschengeld voll bezahlt? → sonst § 108 schwebend unwirksam.<\/p>\n<h3 id=\"f-fall-03-a-denny-6-gibt-die-schuhe-ab\">Fall 03 a) — Denny (6) gibt die Schuhe ab ★★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Anneliese gibt ihrem Sohn Denny, <strong>6 Jahre alt<\/strong>, seine zu klein gewordenen Schuhe mit in die Vorschule. Sie sollen dort in den Kleiderfundus. Üblich sind 3 Euro dafür. Denny gibt die Schuhe beim Erzieher Jimmy ab und sagt „drei EUR\". Jimmy gibt ihm drei 1-Euro-Münzen. Denny steckt sie ein und gibt sie zu Hause bei seiner Mutter ab.<\/p>\n<p><strong>Was gefragt ist.<\/strong> „Wie ist die Rechtslage?\" — Das ist eine <strong>offene Frage<\/strong>, und der Dozent sagt dazu ausdrücklich: <strong>alle Personenbeziehungen<\/strong> durchgehen. Also drei Paare: Denny↔Jimmy, Anneliese↔Jimmy, Anneliese↔Denny.<\/p>\n<p><strong>Schritt für Schritt.<\/strong><\/p>\n<p><em>Beziehung 1: Denny und Jimmy.<\/em>\nDenny ist 6, also <strong>geschäftsunfähig<\/strong> (§ 104 Nr. 1). Seine Willenserklärung ist <strong>nichtig<\/strong> (§ 105). Zwischen den beiden kommt kein Kaufvertrag zustande. Punkt.<\/p>\n<p><em>Beziehung 2: Anneliese und Jimmy.<\/em>\nUnd jetzt kommt der Kniff. Denny hat gar keine <strong>eigene<\/strong> Erklärung abgegeben — er hat die seiner Mutter <strong>überbracht<\/strong>. Sie hat entschieden: die Schuhe, für 3 Euro, in den Fundus. Denny war nur der Transportweg.<\/p>\n<p>Damit ist Denny <strong>Bote<\/strong>, nicht Vertreter. Und für einen Boten braucht man <strong>keine Geschäftsfähigkeit<\/strong> — er muss ja nichts entscheiden. Also:\n- Angebot von Anneliese, überbracht durch Denny ✓\n- Annahme durch Jimmy ✓\n- <strong>Kaufvertrag zwischen Anneliese und Jimmy.<\/strong><\/p>\n<p><em>Beziehung 3: Anneliese und Denny.<\/em> Zwischen Mutter und Sohn ist gar nichts geschehen — kein Rechtsgeschäft.<\/p>\n<p><strong>Die Lösung des Dozenten<\/strong> (aus dem Bild in der Fallsammlung):<\/p>\n<blockquote>\n<p>„Alle Personenbeziehungen sind rechtlich zu erörtern; ggfs. auch Sachbeziehungen (Eigentum)\n<strong>Vertragsbeziehung Denny (6J) und Jimmy (Erzieher):<\/strong> […] Antrag durch D? Erklärung abgegeben, aber <strong>nichtig nach § 105, weil D geschäftsunfähig ist § 104, Nr. 1.<\/strong> D und J haben keinen wirksamen KV geschlossen.\n<strong>J könnte einen Anspruch aus § 433 auf Übereignung der Schuhe gegen die Mutter A haben.<\/strong> […] Antrag von A könnte im Mitgeben der Schuhe liegen und der Beauftragung von D liegen. <strong>Es ist ihre WE, die D lediglich als Bote überbracht hat. Ist D als Erklärungsbote geeignet? (+)<\/strong> ⇒ Antrag (+), Annahme durch J (+) ⇒ Vertrag (+)\n<strong>Übereignung der Schuhe § 929 durch D als Bote für A<\/strong>, Übereignung des Geldes durch D als Bote von J\n<strong>Rechtsbeziehung A und D: kein Rechtsgeschäft abgeschlossen worden.<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Der Satz, der hängen bleiben soll: <strong>Ein Geschäftsunfähiger kann Bote sein.<\/strong> Weil er nichts entscheidet, sondern nur überbringt. Deshalb funktioniert der Vertrag trotzdem — nur eben mit der Mutter statt mit dem Kind.<\/p>\n<p><strong>Und die Arbeitstechnik:<\/strong> Wenn die Frage „Wie ist die Rechtslage?\" lautet, ist das eine Aufforderung, <strong>systematisch alle Zweierbeziehungen<\/strong> durchzugehen. Mal dir die Personen auf und zieh Pfeile.<\/p>\n<h3 id=\"f-fall-03-b-denny-sagt-zwei-euro\">Fall 03 b) — Denny sagt „zwei Euro\"<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Wie a), aber Denny sagt aus Versehen „zwei Euro\", und Jimmy zahlt auch nur zwei.<\/p>\n<p><strong>Schritt für Schritt.<\/strong> Jetzt wird es interessant, weil der Bote sich vertan hat.<\/p>\n<ul>\n<li>Der Antrag „drei Euro\" von Anneliese ist <strong>nie angekommen<\/strong> — der Bote hat ihn nicht übermittelt. Kein Zugang, § 130 I.<\/li>\n<li>Ein Antrag „zwei Euro\" von Denny? Geht nicht, seine WE ist nichtig (§§ 105, 104 Nr. 1).<\/li>\n<li><strong>Aber:<\/strong> Als Jimmy die zwei Euro hinlegt, macht <em>er<\/em> damit ein neues Angebot — durch schlüssiges Verhalten, ausgelegt nach §§ 133, 157.<\/li>\n<li>Dieses Angebot überbringt Denny nun als Bote <strong>für Jimmy<\/strong> an die Mutter.<\/li>\n<li>Anneliese nimmt es an, indem sie das Geld entgegennimmt (konkludent).<\/li>\n<\/ul>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Antrag „drei EUR\" durch A ist nicht zugegangen, da Erklärungsbote nicht übermittelt hat, § 130 I, also nicht wirksam geworden. Antrag „zwei EUR\": durch D nicht mgl, da dessen WE nach §§ 105, 104 Nr. 1 nichtig ist. <strong>Aber im Hingeben von zwei EUR durch J ist durch Auslegung nach §§ 133, 157 ein neues Angebot auf Abschluss eines Kaufvertrages zum Erwerb der Schuhe zum Preis von zwei EUR zu sehen, § 150.<\/strong> In diesem Fall erfolgt Zugang durch D, der Erklärungsbote für J ist. Das von D übermittelte Angebot kann A, z.B. konkludent, durch Entgegennahme des Geldes annehmen.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Ein Bote kann in <strong>beide Richtungen<\/strong> laufen — hin als Bote der Mutter, zurück als Bote des Erziehers. Und: Wenn eine Erklärung scheitert, such nach einer <strong>anderen<\/strong> Erklärung, die den Vertrag doch noch zustande bringt. Hier war es das Hinlegen des Geldes.<\/p>\n<h3 id=\"f-fall-03-c-dieselbe-szene-an-dennys-7-geburtstag\">Fall 03 c) — Dieselbe Szene an Dennys 7. Geburtstag<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Wie a), aber es ist Dennys siebter Geburtstag.<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\nErst die Frage: Ist er am Geburtstag schon 7 — oder erst am Tag danach? <strong>§ 187 II S. 2:<\/strong> Mit dem Geburtstag ist das Lebensjahr <strong>vollendet<\/strong>. Also ist Denny an diesem Tag bereits sieben.<\/p>\n<p>Damit ist er <strong>beschränkt geschäftsfähig<\/strong> (§ 106) und kann eine eigene Willenserklärung abgeben. Der Verkauf der Schuhe ist aber kein reiner Vorteil (er gibt ja etwas her), also greift § 107 nicht. Ohne Einwilligung der Eltern ist der Vertrag <strong>schwebend unwirksam<\/strong> (§ 108 I) — bis die Mutter ihn genehmigt.<\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Ja, denn mit dem Geburtstag vollendet D sein siebentes Lebensjahr, <strong>§ 187 II, 2<\/strong> und ist damit <strong>beschränkt geschäftsfähig, § 106<\/strong>. Somit bietet D seine Schuhe dem J zum Kauf für 2 EUR an. Diese WE ist <strong>schwebend unwirksam bis A sie als gesetzliche Vertreterin genehmigt, §§ 108, 1629, 184.<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Ein einziger Tag ändert die ganze Konstruktion: vorher <strong>Bote<\/strong> (weil er nichts entscheiden konnte), nachher <strong>eigene Willenserklärung<\/strong> in der Schwebe.<\/p>\n<h3 id=\"f-fall-03-d-der-n-tv-fall-lollis-fur-4220-dollar\">Fall 03 d) — Der n-tv-Fall: Lollis für 4.220 Dollar<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Ein Zeitungsfall: Der <strong>7-jährige Liam<\/strong> bestellt bei Amazon für <strong>4.220 Dollar<\/strong> Lollis. Der Betrag wird vom Konto der Mutter (Holly) abgebucht. Sie will das Geld zurück.<\/p>\n<p><strong>Schritt für Schritt.<\/strong><\/p>\n<ol>\n<li>Anspruchsgrundlage für „Geld zurück ohne Vertrag\" = <strong>§ 812<\/strong>.<\/li>\n<li>Hat die Firma etwas erlangt? Ja, das Geld. Wie? Nicht durch eine bewusste Leistung der Mutter, sondern <strong>durch Abbuchung<\/strong> → also „in sonstiger Weise\", <strong>§ 812 I 2. Fall<\/strong>.<\/li>\n<li>Gab es einen Rechtsgrund? Nur, wenn ein Kaufvertrag zustande kam.<\/li>\n<li>Liams Klick wäre das Angebot. Aber er ist 7 → <strong>§ 106<\/strong> beschränkt geschäftsfähig. Der Kauf ist kein reiner Vorteil (§ 107 greift nicht), die Mutter hat nicht eingewilligt.<\/li>\n<li>Also <strong>schwebend unwirksam<\/strong> — und mit der Weigerung der Mutter endgültig unwirksam.<\/li>\n<li>Kein Vertrag → kein Rechtsgrund → <strong>§ 812, Geld zurück.<\/strong><\/li>\n<\/ol>\n<p><strong>Die Lösung des Dozenten<\/strong> (aus dem Bild):<\/p>\n<blockquote>\n<p>„Anspruchsgrundlage könnte <strong>§ 812 I, 2. Fall<\/strong> sein. Vss: etwas erlangt (+) das Geld, in sonstiger Weise (+) durch Abbuchung, ohne rechtlichen Grund. […] Angebot könnte im Klicken des Liam auf Amazon gelegen haben. Allerdings könnte dieses Angebot nach § 107 unwirksam gewesen sein, da Liam in seiner Geschäftsfähigkeit als 7-jähriger beschränkt war, § 106, und keine Einwilligung durch seine Mutter vorlag. […] <strong>Mit der Verweigerung der Genehmigung ist der Vertrag nicht zustande gekommen.<\/strong> Folglich liegt kein Rechtsgrund für die Abbuchung von 4.200 $ vor. Folglich hat die Mutter einen Rückgabeanspruch nach § 812 I, 2. Fall.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Das ist die <strong>Standardkombination<\/strong>, die in der Klausur immer wieder auftaucht: Minderjähriger schließt Vertrag → Eltern verweigern → Vertrag weg → <strong>§ 812<\/strong> holt das Geld zurück. Präg dir diese Kette ein.<\/p>\n<h3 id=\"f-fall-03-e-die-simson-schwalbe\">Fall 03 e) — Die Simson-Schwalbe ★★★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Jimmy braucht Geld und bietet seiner <strong>16-jährigen<\/strong> Freundin Nancy sein Moped für <strong>550 Euro<\/strong> an (Wert: mindestens 750). Nancy hat noch <strong>400 Euro Konfirmationsgeld<\/strong> und bekommt <strong>75 Euro Taschengeld pro Woche<\/strong>. Sie zahlt 400 Euro sofort, den Rest in zwei Wochenraten à 75 Euro. Das Moped wird sofort übergeben. Die Eltern wissen von nichts.<\/p>\n<p><strong>Was gefragt ist.<\/strong> Drei Fragen: Sind die Verträge gültig? <strong>Wer ist Eigentümer?<\/strong> Ändert sich etwas, wenn Nancy die letzte Rate gezahlt hat?<\/p>\n<p><strong>Warum dieser Fall so wichtig ist.<\/strong> Er kombiniert Minderjährigenrecht <strong>und<\/strong> Abstraktionsprinzip. Genau deshalb musst du hier <strong>drei Geschäfte getrennt<\/strong> prüfen — das ist die eigentliche Übung.<\/p>\n<p><strong>Schritt für Schritt.<\/strong><\/p>\n<p><strong>① Der Kaufvertrag (§ 433).<\/strong>\n- § 107 — nur rechtlicher Vorteil? Nancy bekommt zwar ein Schnäppchen (wirtschaftlich super), aber sie muss <strong>zahlen<\/strong>. Eine Zahlungspflicht ist ein <strong>rechtlicher Nachteil<\/strong>. → <strong>nein<\/strong>\n- Einwilligung der Eltern? → <strong>nein<\/strong>\n- § 110 Taschengeldparagraph? Sie zahlt zwar aus eigenen Mitteln — aber <strong>in Raten<\/strong>. § 110 verlangt, dass die Leistung <strong>vollständig bewirkt<\/strong> ist. Sonst könnte man den Minderjährigenschutz mit jedem Ratenvertrag aushebeln. → <strong>nein<\/strong>\n- Ergebnis: <strong>schwebend unwirksam, § 108.<\/strong> Jimmy kann die restlichen 200 Euro nicht verlangen.<\/p>\n<p><strong>② Die Übereignung des Mopeds (§ 929).<\/strong>\nJetzt getrennt betrachten: Hier <strong>bekommt<\/strong> Nancy nur etwas. Sie gibt nichts her, sie verpflichtet sich zu nichts. Das ist ein <strong>lediglich rechtlicher Vorteil<\/strong> → <strong>§ 107 greift, keine Einwilligung nötig.<\/strong> Einigung + Übergabe liegen vor.\n→ <strong>Nancy ist Eigentümerin der Schwalbe.<\/strong><\/p>\n<p><strong>③ Die Übereignung der 550 Euro (§ 929).<\/strong>\nDas Geld hat sie aus eigenen Mitteln bezahlt → <strong>§ 110<\/strong> greift für diesen Teil.\n→ <strong>Jimmy ist Eigentümer der 550 Euro.<\/strong><\/p>\n<p><strong>④ Und wenn Nancy alle Raten gezahlt hat?<\/strong>\nDann ist die Leistung <strong>vollständig bewirkt<\/strong> — jetzt greift § 110 auch für den Kaufvertrag. <strong>Der Vertrag wird wirksam.<\/strong><\/p>\n<p><strong>Die Lösung des Dozenten<\/strong> (gekürzt):<\/p>\n<blockquote>\n<p>„Lediglich rechtlicher Vorteil? Zwar wirtschaftlicher Vorteil, aber <strong>Pflicht zur Gegenleistung, daher rechtlicher Nachteil<\/strong> ⇒ (-) […] nach Sinn und Zweck muss die Vorschrift jedoch <strong>einschränkend ausgelegt<\/strong> werden, um den Minderjährigenschutz nicht auszuhebeln. Daher müssen <strong>längerfristige Verbindlichkeiten ausgeschlossen<\/strong> werden und es ist zu fordern, dass die <strong>Gegenleistung vollständig bewirkt<\/strong> sein muss […] ⇒ Vertrag ist nach § 108 schwebend unwirksam\n<strong>Übereignung der Schwalbe<\/strong> […] Annahme durch N? <strong>WE wirksam nach § 107, da die Einigung über den Eigentumsübergang einen lediglich rechtlichen Vorteil darstellt (+)<\/strong> Übergabe ist erfolgt ⇒ <strong>N ist Eigentümerin<\/strong>\n<strong>Übereignung der 550 EUR<\/strong> — Einigung nach § 929 (+), weil N das Geld nach § 110 mit eigenen Mitteln bewirkt hat ⇒ J ist Eigentümer der 550 EUR\n<strong>Anspruch auf Zahlung der weiteren 200 EUR nachdem N gezahlt hat?<\/strong> Kaufvertrag § 433 diesmal (+) weil N inzwischen die Leistung aus eigenen Mitteln bewirkt hat, § 110.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Das Ergebnis wirkt zuerst absurd und ist genau deshalb der Lernstoff:<\/p>\n<blockquote>\n<p><strong>Nancy schuldet die 200 Euro nicht — aber das Moped gehört ihr trotzdem.<\/strong><\/p>\n<\/blockquote>\n<p>Der Kaufvertrag hängt in der Schwebe, die Übereignung ist wirksam. Das ist das <strong>Abstraktionsprinzip<\/strong> in einem Satz. Jimmy müsste das Moped über <strong>§ 812<\/strong> zurückfordern.<\/p>\n<p><strong>Die Arbeitstechnik:<\/strong> Wenn im Fall gefragt wird „<strong>Wer ist Eigentümer?<\/strong>\", ist das immer das Signal: <strong>Verpflichtung und Verfügung getrennt prüfen.<\/strong> Und daran denken, dass die Übereignung für den Minderjährigen oft ein reiner Vorteil ist.<\/p>\n<h3 id=\"f-fall-03-f-denny-17-und-ea-sports-fc\">Fall 03 f) — Denny (17) und EA Sports FC ★<\/h3>\n<blockquote>\n<p>⚠️ <strong>Zu diesem Fall gibt es in den Unterlagen keine Musterlösung.<\/strong> Der Dozent hat ihn als „Übungsklausur\" <strong>zweimal<\/strong> beigelegt (in Sammlung 03 und in Sammlung 04), aber ohne Lösung. Die folgende Lösung ist <strong>meine<\/strong> — sie folgt aber genau dem Muster, das er in Fall 03 e) und 07 c) selbst vorgemacht hat.<\/p>\n<\/blockquote>\n<p><strong>Der Sachverhalt.<\/strong> Denny ist <strong>17<\/strong> und Gamer. Mit <strong>Erlaubnis seiner Eltern<\/strong> hat er ein PayPal-Konto, auf das er den Verdienst aus seinem Nachhilfejob einzahlt. Guthaben: 35 Euro.<\/p>\n<p><em>Teil 1:<\/em> Er kauft für <strong>19,99 €<\/strong> ein Paket „2000 FC Points\", bezahlt sofort per PayPal und nutzt es.<\/p>\n<p><em>Teil 2:<\/em> Wochen später schließt er ein <strong>Mini-Abo<\/strong> ab: 1500 Points für <strong>9,99 € pro Monat<\/strong>, Laufzeit <strong>6 Monate<\/strong>, zahlbar jeweils zum Monatsersten. Er hat 75 € Taschengeld pro Woche plus 75 € aus dem Nachhilfejob.<\/p>\n<p>Die Eltern erfahren davon und wollen wissen, <strong>was sie tun können<\/strong>, um die Verträge rückgängig zu machen und das Geld zurückzuholen.<\/p>\n<p><strong>Schritt für Schritt — meine Lösung.<\/strong><\/p>\n<p><strong>Teil 1: Das einmalige Paket für 19,99 €.<\/strong>\n- Denny ist 17 → § 106 beschränkt geschäftsfähig.\n- § 107 nur Vorteil? Nein, er muss zahlen.\n- Einwilligung? Nicht ausdrücklich für diesen Kauf.\n- <strong>§ 110?<\/strong> Er hat mit <strong>eigenen Mitteln<\/strong> (Nachhilfeverdienst, den die Eltern ihm überlassen haben) <strong>vollständig sofort<\/strong> bezahlt. → <strong>§ 110 greift, der Vertrag ist wirksam.<\/strong>\n- Zusätzlich argumentierbar: <strong>§ 113<\/strong> — die Eltern haben ihm den Nebenjob erlaubt, also darf er über den Verdienst verfügen.\n- <strong>Ergebnis: Diesen Vertrag bekommen die Eltern nicht rückgängig.<\/strong><\/p>\n<p><strong>Teil 2: Das 6-Monats-Abo.<\/strong>\n- § 107 nur Vorteil? Nein.\n- Einwilligung? Nein.\n- <strong>§ 110?<\/strong> Hier scheitert es an <strong>zwei<\/strong> Punkten, die der Dozent in Fall 03 e) ausdrücklich genannt hat:\n  1. Es ist eine <strong>längerfristige Bindung<\/strong> über 6 Monate.\n  2. Die Leistung ist <strong>nicht vollständig bewirkt<\/strong> — er zahlt monatlich weiter.\n  → <strong>§ 110 greift nicht.<\/strong>\n- <strong>Ergebnis: schwebend unwirksam, § 108 I.<\/strong><\/p>\n<p><strong>Was die Eltern also tun können:<\/strong>\n1. Die <strong>Genehmigung verweigern<\/strong> (§ 108 I). Damit ist das Abo endgültig unwirksam. Formlos möglich; die Weigerung zu zahlen genügt als konkludente Verweigerung (so hat es der Dozent in Fall 06 c) gemacht).\n2. Das bereits gezahlte Abo-Geld über <strong>§ 812 I S. 1 1. Fall<\/strong> (Leistungskondiktion) zurückfordern — es wurde ohne Rechtsgrund geleistet.\n3. Achtung bei der Rückabwicklung: Denny hat die Points ja schon <strong>verbraucht<\/strong>. EA könnte einwenden, dass auch Denny etwas herausgeben müsste. Für die Klausur reicht der Hinweis auf diesen Punkt.<\/p>\n<p><strong>Was du mitnimmst.<\/strong> Der Fall ist bewusst zweigeteilt, und darin liegt die ganze Prüfung:<\/p>\n<blockquote>\n<p><strong>§ 110 rettet den Einmalkauf. § 110 rettet das Abo nicht.<\/strong><\/p>\n<\/blockquote>\n<p>Wenn du in der Klausur ein Abo, eine Rate oder eine Mitgliedschaft siehst, ist das das Signal: <strong>§ 110 scheitert.<\/strong><\/p>","text":"Die wichtigste Sammlung. Rechne fest damit, dass so etwas in der Klausur steht. Die Kette, die du bei jedem dieser Fälle durchgehst: Wie alt? → § 107 nur Vorteil? → Einwilligung der Eltern? → § 110 Taschengeld voll bezahlt? → sonst § 108 schwebend unwirksam. Fall 03 a) — Denny (6) ngsbote geeignet? (+) ⇒ Antrag (+), Annahme durch J (+) ⇒ Vertrag (+) Übereignung der Schuhe § 929 durch D als Bote für A , Übereignung des Geldes durch D als Bote von J Rechtsbeziehung A und D: kein Rechtsgeschäft abgeschlossen worden. \" Was du mitnimmst. Der Satz, der hängen bleiben soll: Ein Geschäftsunfähiger kann Bote sein. Weil er nichts entscheidet, sondern nur überbringt. Deshalb funktioniert der Vertrag trotzdem — nur eben mit der Mutter statt mit dem Kind. Und die Arbeitstechnik: Wenn die Frage „Wie ist die Rechtslage?\" lautet, ist das eine Aufforderung, systematisch alle Zweierbeziehungen durchzugehen. Mal dir die Personen auf und zieh Pfeile. Fall 03 b) — Denny sagt „zwei Euro\" Der Sachverhalt. Wie a), aber Denny sagt aus Versehen „zwei Euro\", und Jimmy zahlt auch nur zwei. Schritt für Schritt. Jetzt wird es interessant, weil der Bote sich vertan hat. Der Antrag „drei Euro\" von Anneliese ist nie angekommen — der Bote hat ihn nicht übermittelt. Kein Zugang, § 130 I. Ein Antrag „zwei Euro\" von Denny? Geht nicht, seine WE ist nichtig (§§ 105, 104 Nr. 1). Aber: Als Jimmy die zwei Euro hinlegt, macht er damit ein neues Angebot — durch schlüssiges Verhalten, ausgelegt nach §§ 133, 157. Dieses Angebot überbringt Denny nun als Bote für Jimmy an die Mutter. Anneliese nimmt es an, indem sie das Geld entgegennimmt (konkludent). Die Lösung des Dozenten. „Antrag „drei EUR\" durch A ist nicht zugegangen, da Erklärungsbote nicht übermittelt hat, § 130 I, also nicht wirksam geworden. Antrag „zwei EUR\": durch D nicht mgl, da dessen WE nach §§ 105, 104 Nr. 1 nichtig ist. Aber im Hingeben von zwei EUR durch J ist durch Auslegung nach §§ 133, 157 ein neues Angebot auf Abschluss eines Kaufvertrages zum Erwerb der Schuhe zum Preis von zwei EUR zu sehen, § 150. In diesem Fall erfolgt Zugang durch D, der Erklärungsbote für J ist. Das von D übermittelte Angebot kann A, z.B. konkludent, durch Entgegennahme des Geldes annehmen.\" Was du mitnimmst. Ein Bote kann in beide Richtungen laufen — hin als Bote der Mutter, zurück als Bote des Erziehers. Und: Wenn eine Erklärung scheitert, such nach einer anderen Erklärung, die den Vertrag doch noch zustande bringt. Hier war es das Hinlegen des Geldes. Fall 03 c) — Dieselbe Szene an Dennys 7. Geburtstag Der Sachverhalt. Wie a), aber es ist Dennys siebter Geburtstag. Schritt für Schritt. Erst die Frage: Ist er am Geburtstag schon 7 — oder erst am Tag danach? § 187 II S. 2: Mit dem Geburtstag ist das Lebensjahr vollendet . Also ist Denny an diesem Tag bereits sieben. Damit ist er beschränkt geschäftsfähig (§ 106) und kann eine eigene Willenserklärung abgeben. Der Verkauf der Schuhe ist aber kein reiner Vorteil (er gibt ja etwas her), also greift § 107 nicht. Ohne Einwilligung der Eltern ist der Vertrag schwebend unwirksam (§ 108 I) — bis die Mutter ihn genehmigt. Die Lösung des Dozenten. „Ja, denn mit dem Geburtstag vollendet D sein siebentes Lebensjahr, § 187 II, 2 und ist damit beschränkt geschäftsfähig, § 106 . Somit bietet D seine Schuhe dem J zum Kauf für 2 EUR an. Diese WE ist schwebend unwirksam bis A sie als gesetzliche Vertreterin genehmigt, §§ 108, 1629, 184. \" Was du mitnimmst. Ein einziger Tag ändert die ganze Konstruktion: vorher Bote (weil er nichts entscheiden konnte), nachher eigene Willenserklärung in der Schwebe. Fall 03 d) — Der n-tv-Fall: Lollis für 4.220 Dollar Der Sachverhalt. Ein Zeitungsfall: Der 7-jährige Liam bestellt bei Amazon für 4.220 Dollar Lollis. Der Betrag wird vom Konto der Mutter (Holly) abgebucht. Sie will das Geld zurück. Schritt für Schritt. Anspruchsgrundlage für „Geld zurück ohne Vertrag\" = § 812 . Hat die Firma etwas erlangt? Ja, das Geld. Wie? Nicht durch eine bewusste Leistung der Mutter, sondern durch Abbuchung → also „in sonstiger Weise\", § 812 I 2. Fall . Gab es einen Rechtsgrund? Nur, wenn ein Kaufvertrag zustande kam. Liams Klick wäre das Angebot. Aber er ist 7 → § 106 beschränkt geschäftsfähig. Der Kauf ist kein reiner Vorteil (§ 107 greift nicht), die Mutter hat nicht eingewilligt. Also schwebend unwirksam — und mit der Weigerung der Mutter endgültig unwirksam. Kein Vertrag → kein Rechtsgrund → § 812, Geld zurück. Die Lösung des Dozenten (aus dem Bild): „Anspruchsgrundlage könnte § 812 I, 2. Fall sein. Vss: etwas erlangt (+) das Geld, in sonstiger Weise (+) durch Abbuchung, ohne rechtlichen Grund. […] Angebot könnte im Klicken des Liam auf Amazon gelegen haben. Allerdings könnte dieses Angebot nach § 107 unwirksam gewesen sein, da Liam in seiner Geschäftsfähigkeit als 7-jähriger beschränkt war, § 106, und keine Einwilligung durch seine Mutter vorlag. […] Mit der Verweigerung der Genehmigung ist der Vertrag nicht zustande gekommen. Folglich liegt kein Rechtsgrund für die Abbuchung von 4.200 $ vor. Folglich hat die Mutter einen Rückgabeanspruch nach § 812 I, 2. Fall.\" Was du mitnimmst. Das ist die Standardkombination , die in der Klausur immer wieder auftaucht: Minderjähriger schließt Vertrag → Eltern verweigern → Vertrag weg → § 812 holt das Geld zurück. Präg dir diese Kette ein. Fall 03 e) — Die Simson-Schwalbe ★★★ Der Sachverhalt. Jimmy braucht Geld und bietet seiner 16-jährigen Freundin Nancy sein Moped für 550 Euro an (Wert: mindestens 750). Nancy hat noch 400 Euro Konfirmationsgeld und bekommt 75 Euro Taschengeld pro Woche . Sie zahlt 400 Euro sofort, den Rest in zwei Wochenraten à 75 Euro. Das Moped wird sofort übergeben. Die Eltern wissen von nichts. Was gefragt ist. Drei Fragen: Sind die Verträge gültig? Wer ist Eigentümer? Ändert sich etwas, wenn Nancy die letzte Rate gezahlt hat? Warum dieser Fall so wichtig ist. Er kombiniert Minderjährigenrecht und Abstraktionsprinzip. Genau deshalb musst du hier drei Geschäfte getrennt prüfen — das ist die eigentliche Übung. Schritt für Schritt. ① Der Kaufvertrag (§ 433). - § 107 — nur rechtlicher Vorteil? Nancy bekommt zwar ein Schnäppchen (wirtschaftlich super), aber sie muss zahlen . Eine Zahlungspflicht ist ein rechtlicher Nachteil . → nein - Einwilligung der Eltern? → nein - § 110 Taschengeldparagraph? Sie zahlt zwar aus eigenen Mitteln — aber in Raten . § 110 verlangt, dass die Leistung vollständig bewirkt ist. Sonst könnte man den Minderjährigenschutz mit jedem Ratenvertrag aushebeln. → nein - Ergebnis: schwebend unwirksam, § 108. Jimmy kann die restlichen 200 Euro nicht verlangen. ② Die Übereignung des Mopeds (§ 929). Jetzt getrennt betrachten: Hier bekommt Nancy nur etwas. Sie gibt nichts her, sie verpflichtet sich zu nichts. Das ist ein lediglich rechtlicher Vorteil → § 107 greift, keine Einwilligung nötig. Einigung + Übergabe liegen vor. → Nancy ist Eigentümerin der Schwalbe. ③ Die Übereignung der 550 Euro (§ 929). Das Geld hat sie aus eigenen Mitteln bezahlt → § 110 greift für diesen Teil. → Jimmy ist Eigentümer der 550 Euro. ④ Und wenn Nancy alle Raten gezahlt hat? Dann ist die Leistung vollständig bewirkt — jetzt greift § 110 auch für den Kaufvertrag. Der Vertrag wird wirksam. Die Lösung des Dozenten (gekürzt): „Lediglich rechtlicher Vorteil? Zwar wirtschaftlicher Vorteil, aber Pflicht zur Gegenleistung, daher rechtlicher Nachteil ⇒ (-) […] nach Sinn und Zweck muss die Vorschrift jedoch einschränkend ausgelegt werden, um den Minderjährigenschutz nicht auszuhebeln. Daher müssen längerfristige Verbindlichkeiten ausgeschlossen werden und es ist zu fordern, dass die Gegenleistung vollständig bewirkt sein muss […] ⇒ Vertrag ist nach § 108 schwebend unwirksam Übereignung der Schwalbe […] Annahme durch N? WE wirksam nach § 107, da die Einigung über den Eigentumsübergang einen lediglich rechtlichen Vorteil darstellt (+) Übergabe ist erfolgt ⇒ N ist Eigentümerin Übereignung der 550 EUR — Einigung nach § 929 (+), weil N das Geld nach § 110 mit eigenen Mitteln bewirkt hat ⇒ J ist Eigentümer der 550 EUR Anspruch auf Zahlung der weiteren 200 EUR nachdem N gezahlt hat? Kaufvertrag § 433 diesmal (+) weil N inzwischen die Leistung aus eigenen Mitteln bewirkt hat, § 110.\" Was du mitnimmst. Das Ergebnis wirkt zuerst absurd und ist genau deshalb der Lernstoff: Nancy schuldet die 200 Euro nicht — aber das Moped gehört ihr trotzdem. Der Kaufvertrag hängt in der Schwebe, die Übereignung ist wirksam. Das ist das Abstraktionsprinzip in einem Satz. Jimmy müsste das Moped über § 812 zurückfordern. Die Arbeitstechnik: Wenn im Fall gefragt wird „ Wer ist Eigentümer? \", ist das immer das Signal: Verpflichtung und Verfügung getrennt prüfen. Und daran denken, dass die Übereignung für den Minderjährigen oft ein reiner Vorteil ist. Fall 03 f) — Denny (17) und EA Sports FC ★ ⚠️ Zu diesem Fall gibt es in den Unterlagen keine Musterlösung. Der Dozent hat ihn als „Übungsklausur\" zweimal beigelegt (in Sammlung 03 und in Sammlung 04), aber ohne Lösung. Die folgende Lösung ist meine — sie folgt aber genau dem Muster, das er in Fall 03 e) und 07 c) selbst vorgemacht hat. Der Sachverhalt. Denny ist 17 und Gamer. Mit Erlaubnis seiner Eltern hat er ein PayPal-Konto, auf das er den Verdienst aus seinem Nachhilfejob einzahlt. Guthaben: 35 Euro. Teil 1: Er kauft für 19,99 € ein Paket „2000 FC Points\", bezahlt sofort per PayPal und nutzt es. Teil 2: Wochen später schließt er ein Mini-Abo ab: 1500 Points für 9,99 € pro Monat , Laufzeit 6 Monate , zahlbar jeweils zum Monatsersten. Er hat 75 € Taschengeld pro Woche plus 75 € aus dem Nachhilfejob. Die Eltern erfahren davon und wollen wissen, was sie tun können , um die Verträge rückgängig zu machen und das Geld zurückzuholen. Schritt für Schritt — meine Lösung. Teil 1: Das einmalige Paket für 19,99 €. - Denny ist 17 → § 106 beschränkt geschäftsfähig. - § 107 nur Vorteil? Nein, er muss zahlen. - Einwilligung? Nicht ausdrücklich für diesen Kauf. - § 110? Er hat mit eigenen Mitteln (Nachhilfeverdienst, den die Eltern ihm überlassen haben) vollständig sofort bezahlt. → § 110 greift, der Vertrag ist wirksam. - Zusätzlich argumentierbar: § 113 — die Eltern haben ihm den Nebenjob erlaubt, also darf er über den Verdienst verfügen. - Ergebnis: Diesen Vertrag bekommen die Eltern nicht rückgängig. Teil 2: Das 6-Monats-Abo. - § 107 nur Vorteil? Nein. - Einwilligung? Nein. - § 110? Hier scheitert es an zwei Punkten, die der Dozent in Fall 03 e) ausdrücklich genannt hat: 1. Es ist eine längerfristige Bindung über 6 Monate. 2. Die Leistung ist nicht vollständig bewirkt — er zahlt monatlich weiter. → § 110 greift nicht. - Ergebnis: schwebend unwirksam, § 108 I. Was die Eltern also tun können: 1. Die Genehmigung verweigern (§ 108 I). Damit ist das Abo endgültig unwirksam. Formlos möglich; die Weigerung zu zahlen genügt als konkludente Verweigerung (so hat es der Dozent in Fall 06 c) gemacht). 2. Das bereits gezahlte Abo-Geld über § 812 I S. 1 1. Fall (Leistungskondiktion) zurückfordern — es wurde ohne Rechtsgrund geleistet. 3. Achtung bei der Rückabwicklung: Denny hat die Points ja schon verbraucht . EA könnte einwenden, dass auch Denny etwas herausgeben müsste. Für die Klausur reicht der Hinweis auf diesen Punkt. Was du mitnimmst. Der Fall ist bewusst zweigeteilt, und darin liegt die ganze Prüfung: § 110 rettet den Einmalkauf. § 110 rettet das Abo nicht. Wenn du in der Klausur ein Abo, eine Rate oder eine Mitgliedschaft siehst, ist das das Signal: § 110 scheitert.","words":2231,"mins":12},{"id":"f-4-fälle-zur-gesetzlichen-unwirksamkeit","subject":"faelle","num":"4","title":"4. Fälle zur gesetzlichen Unwirksamkeit","short":"Fälle zur gesetzlichen Unwirksamkeit","html":"<p>Hier geht es um Verträge, die trotz voller Einigkeit nicht gelten — wegen <strong>§ 134<\/strong> (Gesetzesverstoß) oder <strong>§ 138<\/strong> (Wucher/Sittenwidrigkeit).<\/p>\n<p><strong>Beachte den Aufbau in beiden Fällen:<\/strong> Die Anspruchsgrundlage ist <strong>§ 812<\/strong>. § 134 und § 138 sind nur die <strong>Vorfrage<\/strong> („gab es überhaupt einen Rechtsgrund?\"). Genau so machst du es auch.<\/p>\n<h3 id=\"f-fall-04-e-das-cannabis-tutchen\">Fall 04 e) — Das Cannabis-Tütchen<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Jimmy und Nancy wohnen in einer WG. Nancy zieht auf dem Balkon drei Cannabispflanzen für den Eigenbedarf. Jimmy will etwas für eine Party mitnehmen und zahlt ihr <strong>50 Euro für 10 Gramm<\/strong>. Unterwegs wird ihm das Tütchen gestohlen. Jetzt will er sein Geld zurück.<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\n1. Anspruchsgrundlage: <strong>§ 812 I<\/strong> — Nancy hat 50 Euro bekommen; gab es dafür einen Rechtsgrund?\n2. Rechtsgrund wäre ein Kaufvertrag (§ 433). Angebot und Annahme liegen vor.\n3. <strong>Aber:<\/strong> Der Verkauf von Cannabis (nicht zum Eigenkonsum) ist nach wie vor strafbar. Der Vertrag verstößt gegen ein <strong>gesetzliches Verbot<\/strong> → <strong>§ 134, nichtig<\/strong>.\n4. Kein Vertrag → kein Rechtsgrund → <strong>§ 812 greift. Jimmy bekommt seine 50 Euro.<\/strong><\/p>\n<p><strong>Die Lösung des Dozenten<\/strong> (aus dem Bild):<\/p>\n<blockquote>\n<p>„Anspruchsgrundlage hierfür könnte § 812 Abs. 1 sein. […] Rechtlicher Grund könnte ein Kaufvertrag nach § 433 gewesen sein. J und N haben einen KV durch Angebot und Annahme geschlossen. Dieser könnte jedoch <strong>nach § 134 nichtig<\/strong> sein. […] <strong>Der Verkauf von Cannabis nicht zum Eigenkonsum ist nach wie vor strafbar.<\/strong> Daher ist der Kaufvertrag nach § 134 nichtig. Folglich ist die Leistung der 50 EUR ohne Rechtsgrund erfolgt. <strong>Folglich hat Jimmy einen Anspruch auf gezahlten 50 EUR.<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Dass ihm das Tütchen gestohlen wurde, ist für die Lösung <strong>völlig egal<\/strong> — der Vertrag war von Anfang an nichtig. Lass dich von solchen Details im Sachverhalt nicht ablenken.<\/p>\n<h3 id=\"f-fall-04-f-die-schwalbe-fur-300-euro-wucher\">Fall 04 f) — Die Schwalbe für 300 Euro (Wucher)<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Jimmy braucht wieder Geld. Seine Freundin Anneliese hat ihm über Jahre immer wieder Geld geliehen, das sie nur schleppend zurückbekam. Als er wieder fragt, stellt sie eine Bedingung: Für die nächsten <strong>300 Euro<\/strong> will sie sein Moped übereignet bekommen — <strong>Wert: 750 Euro<\/strong>. Als Jimmy im Lotto gewinnt, will er die Schwalbe gegen Rückgabe der 300 Euro zurück.<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\n1. Anspruchsgrundlage: <strong>§ 812 I<\/strong> — Anneliese hat Eigentum am Moped erlangt.\n2. Rechtsgrund wäre der Kaufvertrag. Ist der wirksam?\n3. <strong>§ 138 II Wucher<\/strong> — zwei Voraussetzungen, beide müssen vorliegen:\n   - <strong>objektiv<\/strong>, auffälliges Missverhältnis: 750 statt 300 → mehr als das Doppelte, also <strong>über 100 % Aufschlag<\/strong> ✓\n   - <strong>subjektiv<\/strong>, Ausnutzen einer Schwäche: Anneliese kennt Jimmys Geldnot und nutzt sie aus ✓\n4. → Vertrag <strong>nichtig nach § 138 II<\/strong> → kein Rechtsgrund → <strong>§ 812, Moped zurück.<\/strong><\/p>\n<p><strong>Die Lösung des Dozenten<\/strong> (aus dem Bild):<\/p>\n<blockquote>\n<p>„§ 812 I — etwas erlangt (+) Eigentum am Moped — ohne Rechtsgrund? ursprünglich könnte Kaufvertrag zw A und J Rechtsgrund gewesen sein? könnte gemäß § 138 II nichtig sein?\n• <strong>auffällige Missverhältnis zw Leistung und Gegenleistung (+) &gt; 100% Aufschlag<\/strong>\n• <strong>Ausnutzen der Zwangslage (+)<\/strong>\n⇒ Rechtsgeschäft nach § 138 II nichtig ⇒ ohne Rechtsgrund (+). Anspruch auf Rückübertragung aus § 812 I gegeben.\"<\/p>\n<\/blockquote>\n<p><strong>Und — sehr wichtig — der Dozent ergänzt ausdrücklich:<\/strong><\/p>\n<blockquote>\n<p>„Eine andere Argumentation, nach der angesichts der <strong>Historie des Anpumpens in der Gesamtschau kein auffälliges Missverhältnis<\/strong> zwischen Leistung und Gegenleistung vorliegt, ist ebenfalls <strong>gut vertretbar<\/strong>.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Zwei Dinge:<\/p>\n<ol>\n<li><strong>Merk dir die Faustregel:<\/strong> Das Doppelte des Üblichen = auffälliges Missverhältnis. Und dass § 138 II <strong>immer zwei<\/strong> Elemente braucht — objektiv <em>und<\/em> subjektiv.<\/li>\n<li><strong>Der Dozent akzeptiert das Gegenteil, wenn du es begründest.<\/strong> Man könnte nämlich sagen: Sie hat ihm über Jahre Geld geliehen, das sie teils nie zurückbekam — rechnet man das ein, ist der Deal gar nicht so schief. <strong>Beide Wege geben volle Punkte.<\/strong> Was zählt, ist die Argumentation.<\/li>\n<\/ol>","text":"Hier geht es um Verträge, die trotz voller Einigkeit nicht gelten — wegen § 134 (Gesetzesverstoß) oder § 138 (Wucher/Sittenwidrigkeit). Beachte den Aufbau in beiden Fällen: Die Anspruchsgrundlage ist § 812 . § 134 und § 138 sind nur die Vorfrage („gab es überhaupt einen Rechtsgrund?\"). Genau so machst du es auch. Fall 04 e) — Das Cannabis-Tütchen Der Sachverhalt. Jimmy und Nancy wohnen in einer WG. Nancy zieht auf dem Balkon drei Cannabispflanzen für den Eigenbedarf. Jimmy will etwas für eine Party mitnehmen und zahlt ihr 50 Euro für 10 Gramm . Unterwegs wird ihm das Tütchen gestohlen. Jetzt will er sein Geld zurück. Schritt für Schritt. 1. Anspruchsgrundlage: § 812 I — Nancy hat 50 Euro bekommen; gab es dafür einen Rechtsgrund? 2. Rechtsgrund wäre ein Kaufvertrag (§ 433). Angebot und Annahme liegen vor. 3. Aber: Der Verkauf von Cannabis (nicht zum Eigenkonsum) ist nach wie vor strafbar. Der Vertrag verstößt gegen ein gesetzliches Verbot → § 134, nichtig . 4. Kein Vertrag → kein Rechtsgrund → § 812 greift. Jimmy bekommt seine 50 Euro. Die Lösung des Dozenten (aus dem Bild): „Anspruchsgrundlage hierfür könnte § 812 Abs. 1 sein. […] Rechtlicher Grund könnte ein Kaufvertrag nach § 433 gewesen sein. J und N haben einen KV durch Angebot und Annahme geschlossen. Dieser könnte jedoch nach § 134 nichtig sein. […] Der Verkauf von Cannabis nicht zum Eigenkonsum ist nach wie vor strafbar. Daher ist der Kaufvertrag nach § 134 nichtig. Folglich ist die Leistung der 50 EUR ohne Rechtsgrund erfolgt. Folglich hat Jimmy einen Anspruch auf gezahlten 50 EUR. \" Was du mitnimmst. Dass ihm das Tütchen gestohlen wurde, ist für die Lösung völlig egal — der Vertrag war von Anfang an nichtig. Lass dich von solchen Details im Sachverhalt nicht ablenken. Fall 04 f) — Die Schwalbe für 300 Euro (Wucher) Der Sachverhalt. Jimmy braucht wieder Geld. Seine Freundin Anneliese hat ihm über Jahre immer wieder Geld geliehen, das sie nur schleppend zurückbekam. Als er wieder fragt, stellt sie eine Bedingung: Für die nächsten 300 Euro will sie sein Moped übereignet bekommen — Wert: 750 Euro . Als Jimmy im Lotto gewinnt, will er die Schwalbe gegen Rückgabe der 300 Euro zurück. Schritt für Schritt. 1. Anspruchsgrundlage: § 812 I — Anneliese hat Eigentum am Moped erlangt. 2. Rechtsgrund wäre der Kaufvertrag. Ist der wirksam? 3. § 138 II Wucher — zwei Voraussetzungen, beide müssen vorliegen: - objektiv , auffälliges Missverhältnis: 750 statt 300 → mehr als das Doppelte, also über 100 % Aufschlag ✓ - subjektiv , Ausnutzen einer Schwäche: Anneliese kennt Jimmys Geldnot und nutzt sie aus ✓ 4. → Vertrag nichtig nach § 138 II → kein Rechtsgrund → § 812, Moped zurück. Die Lösung des Dozenten (aus dem Bild): „§ 812 I — etwas erlangt (+) Eigentum am Moped — ohne Rechtsgrund? ursprünglich könnte Kaufvertrag zw A und J Rechtsgrund gewesen sein? könnte gemäß § 138 II nichtig sein? • auffällige Missverhältnis zw Leistung und Gegenleistung (+) > 100% Aufschlag • Ausnutzen der Zwangslage (+) ⇒ Rechtsgeschäft nach § 138 II nichtig ⇒ ohne Rechtsgrund (+). Anspruch auf Rückübertragung aus § 812 I gegeben.\" Und — sehr wichtig — der Dozent ergänzt ausdrücklich: „Eine andere Argumentation, nach der angesichts der Historie des Anpumpens in der Gesamtschau kein auffälliges Missverhältnis zwischen Leistung und Gegenleistung vorliegt, ist ebenfalls gut vertretbar .\" Was du mitnimmst. Zwei Dinge: Merk dir die Faustregel: Das Doppelte des Üblichen = auffälliges Missverhältnis. Und dass § 138 II immer zwei Elemente braucht — objektiv und subjektiv. Der Dozent akzeptiert das Gegenteil, wenn du es begründest. Man könnte nämlich sagen: Sie hat ihm über Jahre Geld geliehen, das sie teils nie zurückbekam — rechnet man das ein, ist der Deal gar nicht so schief. Beide Wege geben volle Punkte. Was zählt, ist die Argumentation.","words":633,"mins":3},{"id":"f-5-fälle-zum-vertragsschluss","subject":"faelle","num":"5","title":"5. Fälle zum Vertragsschluss","short":"Fälle zum Vertragsschluss","html":"<h3 id=\"f-fall-05-a-ich-mochte-dein-fahrrad-kaufen\">Fall 05 a) — „Ich möchte dein Fahrrad kaufen\"<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Anneliese geht zu Denny und sagt: „Ich möchte dein Fahrrad kaufen.\"<\/p>\n<p><strong>Schritt für Schritt.<\/strong> Ein Angebot muss so vollständig sein, dass der andere nur noch „Ja\" sagen muss. Dafür braucht es drei Dinge (<strong>essentialia negotii<\/strong>): Vertragspartner, Gegenstand, <strong>Preis<\/strong>.<\/p>\n<p>Der Preis fehlt. Denny kann nicht einfach „Ja\" sagen — er wüsste ja nicht, wofür.<\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Kein Preis benannt, essentialia negotii nicht definiert ⇒ kein Angebot nach § 145\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Der Test in einem Satz: <strong>Kann der andere einfach „Ja\" sagen — und alles ist klar?<\/strong><\/p>\n<h3 id=\"f-fall-05-b-das-fahrrad-hin-und-her\">Fall 05 b) — Das Fahrrad-Hin-und-Her ★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Eine Kette von Erklärungen:\n1. Denny: „Gern, für 50 Euro ist es deins.\"\n2. Anneliese: „Das muss ich mir überlegen.\" — <strong>Drei Stunden später<\/strong> ruft sie an: „Ja. Allerdings möchte ich, dass du es nochmal putzt.\"\n3. Denny: „Na gut, mach ich. Hol es morgen ab, bring das Geld bar mit.\"\n4. Am nächsten Tag hat Anneliese das Geld vergessen: „Kann ich es dir per PayPal schicken?\" — Denny: „Na gut, geht auch.\"<\/p>\n<p><strong>Was gefragt ist.<\/strong> Wie beurteilst du diese Verhandlung? Und: Wann ist das Eigentum übergegangen?<\/p>\n<p><strong>Schritt für Schritt.<\/strong> Du gehst <strong>chronologisch<\/strong> durch und prüfst jede Erklärung einzeln.<\/p>\n<p><strong>Schritt 1.<\/strong> Dennys „für 50 Euro ist es deins\" ist ein vollständiges Angebot (§ 145).<\/p>\n<p><strong>Schritt 2.<\/strong> Anneliese sagt erst nach <strong>drei Stunden<\/strong> zu — und will zusätzlich, dass er putzt. Zwei Probleme auf einmal:\n- Sie sind sich <strong>persönlich<\/strong> begegnet → § 147 I: Ein Angebot unter Anwesenden kann nur <strong>sofort<\/strong> angenommen werden. Drei Stunden später ist zu spät.\n- Und sie <strong>verändert<\/strong> das Angebot (Putzen kommt dazu).<\/p>\n<p>Beides führt zum selben Ergebnis: <strong>§ 150 I<\/strong> — eine verspätete oder veränderte Annahme ist <strong>keine Annahme<\/strong>, sondern ein <strong>neuer Antrag<\/strong>. Dennys ursprüngliches Angebot ist damit tot.<\/p>\n<p><strong>Schritt 3.<\/strong> Denny sagt „Na gut, mach ich\" → <strong>er<\/strong> nimmt jetzt ihr neues Angebot an. <strong>Jetzt<\/strong> ist der Vertrag geschlossen: Fahrrad für 50 Euro, geputzt, Barzahlung.<\/p>\n<p><strong>Schritt 4.<\/strong> Die Änderung auf PayPal ist wieder ein neues Angebot — diesmal zur <strong>Vertragsänderung<\/strong>. Denny nimmt an.<\/p>\n<p><strong>Und das Eigentum?<\/strong> Der Kaufvertrag allein überträgt gar nichts (Abstraktionsprinzip!). Das Eigentum geht erst über mit <strong>Einigung und Übergabe<\/strong> (§ 929) — also mit Geldeingang und Mitnahme des Rads.<\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Angebot von Denny hätte nur sofort angenommen werden können, § 147, I; <strong>verspätete Annahme durch Anneliese (zusätzlich unter Erweiterungen) = neues Angebot, § 150 I<\/strong>; Denny hat angenommen; Veränderung der Bezahlungsart ist neues Angebot zur Vertragsänderung, wurde angenommen.\n(Wann) Ist das Eigentum übergegangen? <strong>Mit Geldeingang und Mitnahme des Fahrrads<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Bei so einem Hin und Her: <strong>Nummeriere die Erklärungen und geh sie der Reihe nach durch.<\/strong> Jedes „Ja, aber…\" setzt die Rollen zurück — wer vorher angeboten hat, muss jetzt annehmen.<\/p>\n<h3 id=\"f-fall-05-c-die-unbestellte-obstkiste\">Fall 05 c) — Die unbestellte Obstkiste ★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Obsthändler Denny schickt seiner Nachbarin Anneliese <strong>ungefragt<\/strong> eine Kiste Früchte mit Rechnung über <strong>15 Euro<\/strong>. Handschriftlich dabei: „Das könnte ich jede Woche liefern.\" Anneliese will die Kiste zurückbringen, kann den Erdbeeren aber nicht widerstehen und <strong>isst sie<\/strong>. Den Rest bringt sie zurück. Denny verlangt die vollen 15 Euro, mindestens aber 5 Euro für die Erdbeeren.<\/p>\n<p><strong>Was gefragt ist.<\/strong> Bekommt Denny Geld? Zu Recht?<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\n1. Anspruchsgrundlage: <strong>§ 433 II<\/strong> (Kaufpreis). Dafür braucht es einen Kaufvertrag.\n2. <strong>Angebot?<\/strong> Ja — durch das Zuschicken. Gegenstand, Preis und Vertragspartner stehen fest.\n3. <strong>Annahme?<\/strong> Das bloße Entgegennehmen ist keine Annahme — darin liegt keine Willenserklärung. Aber das <strong>Aufessen der Erdbeeren<\/strong>? Das ist schlüssiges Verhalten und könnte eine <strong>Teilannahme<\/strong> sein (verändertes Angebot, § 150).\n4. <strong>Aber jetzt kommt § 241a.<\/strong> Bei einer <strong>unbestellten Lieferung<\/strong> durch einen <strong>Unternehmer<\/strong> (§ 14) an einen <strong>Verbraucher<\/strong> (§ 13) entstehen <strong>keine Ansprüche<\/strong> — weder auf Zahlung noch auf Rückgabe.\n5. → <strong>Denny bekommt gar nichts.<\/strong> Auch nicht die 5 Euro für die Erdbeeren.<\/p>\n<p><strong>Die Lösung des Dozenten<\/strong> (aus dem Bild):<\/p>\n<blockquote>\n<p>„Anspruch des Denny auf Zahlung von 15 EUR aus § 433 BGB. Voraussetzung: geschlossener Kaufvertrag, § 145: Angebot und Annahme\n• Angebot durch Übersendung (Gegenstand, Vertragspartner, Preis
