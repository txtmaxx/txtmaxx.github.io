illige Anwendung bestimmter Anforderungen Art. 95 KI-Systeme mit allg. Verwendungszweck ➢ Spezifische Anforderungen an Sicherheit und Zuverlässigkeit \" Die Pyramide von oben nach unten: ┌─ VERBOTEN ──────────────── gar nicht erlaubt (z.B. Social Scoring, │ manipulative Systeme, biometrische Massenüberwachung) ├─ HOCHRISIKO ────────────── strenge Pflichten, Art. 6–49 ├─ TRANSPARENZPFLICHT ────── Deepfakes, Chatbots: Art. 50 — man muss wissen, │ dass man mit einer Maschine spricht ├─ RISIKOARM ─────────────── freiwillige Verhaltenskodizes, Art. 95 └─ GPAI (allg. Zweck) ────── eigene Regeln zu Sicherheit und Zuverlässigkeit Merksatz: Je höher das Risiko, desto strenger die Pflicht — von Verbot bis Freiwilligkeit. ⚠️ Falle: Nicht jede KI ist verboten oder hochriskant. Die meisten Systeme fallen in die risikoarme Kategorie mit rein freiwilligen Anforderungen. Eine Aussage wie „Die KI-VO verbietet den Einsatz von KI-Systemen grundsätzlich\" ist falsch — das wäre das DSGVO-Prinzip (Verbot mit Erlaubnisvorbehalt), nicht das der KI-VO. 16.5 Der Zeitplan (Folie 86, Original) Datum Abstand Was gilt 01.08.2024 Inkrafttreten (20 Tage nach Veröffentlichung im Amtsblatt) – 02.02.2025 +6 Monate allgemeine Bestimmungen und verbotene KI-Praktiken 02.08.2025 +12 Monate notifizierende Behörden/Stellen, Verpflichtungen für universelle KI-Modelle , Verwaltung, Sanktionen 02.08.2026 +24 Monate alle übrigen Verpflichtungen (außer den genannten) 02.08.2027 +36 Monate Verpflichtungen für andere KI-Systeme mit hohem Risiko 02.12.2027 „Soll verschoben werden\" (Vermerk auf der Folie) Merkhilfe: Verbote zuerst (6 Monate), dann Sanktionen (12), dann der Rest (24), dann Hochrisiko in Produkten (36). 16.6 Art. 4 KI-VO — KI-Kompetenz (Folie 89, Original) „ Artikel 4 KI-Kompetenz Die Anbieter und Betreiber von KI-Systemen ergreifen Maßnahmen, um nach besten Kräften sicherzustellen, dass ihr Personal und andere Personen, die in ihrem Auftrag mit dem Betrieb und der Nutzung von KI-Systemen befasst sind, über ein ausreichendes Maß an KI-Kompetenz verfügen … Diese „muss\"-Vorschrift erscheint für kleine und mittlere Betreiber unverhältnismäßig.\" Kurz: Wer KI einsetzt, muss sein Personal schulen. Das ist eine Pflicht , keine Empfehlung — und gilt für Anbieter und Betreiber . 16.7 Menschliche Aufsicht (Folie 88, Original) „ Ziel: Vertrauenswürdige KI — Menschliche Aufsicht von KI-Systemen besonders im Hochrisiko-Bereich Verstehen : Menschen müssen den Output der KI nachvollziehen und prüfen können Kontrolle : Menschen brauchen die Stopptaste (unterschiedlich ausgestaltet je nach System) Motivation : Die Mensch-Maschine-Interaktion und die Arbeitsumgebung müssen so gestaltet sein, dass der Mensch die Aufgabe langfristig ausüben kann\" Drei Begriffe: Verstehen – Kontrolle – Motivation. 16.8 KI und personenbezogene Daten (Folie 92, Original) „Bei der Nutzung eines KI-Systems fallen unter anderem folgende personenbezogene Daten an: • Benutzernamen und Passwort beim Login des Nutzers • Chatverlauf / Historie • Daten der Nutzung des KI-Systems (Datum, Uhrzeit, Standort, verwendetes Gerät, Lizenzangaben) • Prompts inkl. ergänzender Input • Output ➢ Umstritten, ob auch das KI-Modell selbst personenbezogene Daten enthält \" ⚠️ Merke: Prompts und Output sind personenbezogene Daten. Das ist der praktisch wichtigste Satz des KI-Blocks. Wenn du einen Namen in einen Chatbot tippst, verarbeitest du pbD. Und: Ob das Modell selbst pbD enthält, ist laut Folie umstritten — eine Aussage „Das KI-Modell enthält unstreitig keine pbD\" wäre also falsch . 16.9 Die Checkliste für LLM-Chatbots ★ (Folie 110, Original) „ Checkliste zum Einsatz LLM-basierter Chatbots 1. Bereitstellung eines Funktions-Accounts 2. Keine Eingabe personenbezogener Daten 3. Keine Ausgabe personenbezogener Daten 4. Vorsicht bei personenbeziehbaren Daten 5. Opt-out des KI-Trainings 6. Ergebnisse auf Richtigkeit prüfen 7. Ergebnisse auf Diskriminierung überprüfen 8. Keine automatisierte Letztentscheidung \" Diese acht Punkte sind ein sehr wahrscheinlicher T/F-Steinbruch. Merk dir besonders Punkt 8: keine automatisierte Letztentscheidung — das ist der Bezug zu Art. 22 DSGVO (Recht, keiner ausschließlich automatisierten Entscheidung unterworfen zu werden). 16.10 Wie LLMs funktionieren — die Argumentation des Dozenten Der Dozent baut eine ganze Argumentationskette auf, dass LLMs keine Semantik haben. Für T/F-Fragen relevant: Folie 99 (Original) — Tokenisierung: „ Tokenisierung bezeichnet das Zerteilen von Text in die kleineren Einheiten Worte bzw. Wortbestandteile , die als Tokens bezeichnet werden … Anschließend erfolgt die Umwandlung in Zahlen . Diese Umwandlung ist grundlegend für die generative KI.\" Folie 100 (Original): „ Wie arbeiten LLMs? ➢ Können Tausende von Wörtern einlesen (Prompt) ➢ Lernen, das nächste Wort vorherzusagen ➢ Jedoch ohne Semantik! \" Folie 105 (Original) — John Searle: „„ Syntax reicht nicht für Semantik aus. \" · „Computerprogramme sind vollständig durch ihre formale (oder syntaktische) Struktur definiert.\" · „Ein Geist hat geistige Inhalte, und zwar semantische Inhalte.\" · „ Schlussfolgerung 1: Kein Computerprogramm kann aus eigener Kraft einem System einen Geist geben. \"\" Folie 108 (Original): „ Was lernen wir daraus: ➢ Wir Menschen gehen wie folgt vor: nachdenken, analysieren, bewerten . ➢ Dies können Maschinen heute (noch?) nicht ➢ Maschinen können auch (noch?) keine moralischen Fragen bewerten . ➢ Aber sie können schon Texte assoziieren, die aussehen wie das Produkt von Nachdenken, Analyse oder moralischer Bewertung. ➢ Mit heutigen Methoden werden Maschinen dazu nicht in der Lage sein. Ihnen fehlt die Referenz auf die Realität. \" Folie 109 (Original): „ ChatGPT: Plappernder Papagei mit ~Nachdenken light \" Halluzinationen (Folien 101–102): Der Dozent zeigt einen echten Screenshot, in dem ChatGPT ausführlich über einen „Lila Leierapfel\" referiert — eine Sorte, die er frei erfunden hat. Sein Kommentar: „ Ist frei erfunden!! \". Das ist sein Beleg für Checklistenpunkt 6 („Ergebnisse auf Richtigkeit prüfen\"). Und die Gegenseite (Folie 95): „ Überraschung!!! ChatGPT kann schreiben · kann Schach spielen · kann übersetzen · … aber wurde darauf gar nicht trainiert! \" 16.11 Weitere Fakten aus dem KI-Block Folie 96: „ChatGPT-4 schafft die (amerikanische) Anwaltsprüfung\" (Quelle: Katz/Bommarito u.a., 2024). Folie 111: „ Landgericht München: OpenAI verstößt gegen das Urheberrecht! \" — Klage der GEMA wegen neun Liedtexten; das Gericht untersagte die Nutzung von Songtexten. (Die Folie schreibt in der Überschrift „Landesgericht\", im Text korrekt „Landgericht München\".) Folie 91: Staatsanwaltschaft in Florida ermittelt gegen OpenAI im Zusammenhang mit einer Schusswaffentat. Folien 112–113: Bitkom-Studie zu Rechenzentren — Deutschland: 530 MW (2025) → 2.020 MW (2030), also Vervierfachung ; Europa 16.500 → 28.000 MW (+70 %); USA 48.000 (2024) → 95.000 MW. Folie 76: KI könnte das deutsche BIP jährlich um 0,8 Prozentpunkte steigern, 4,5 Billionen Euro zusätzliche Wertschöpfung in 15 Jahren (IAB-Studie). Folie 74: Abschließendes Statement des Dozenten: „ Vom Datenschutzrecht zum Datennutzungsrecht. \" Typische Fallen zu Kapitel 16 Aussage ✓/✗ Die KI-VO trat am 01.08.2024 in Kraft. ✓ Regelbasierte Software ist ein KI-System im Sinne der KI-VO. ✗ Die KI-VO verfolgt einen risikobasierten Ansatz. ✓ Alle KI-Systeme unterliegen denselben Pflichten. ✗ Für risikoarme KI-Systeme gelten nur freiwillige Anforderungen. ✓ Deepfakes und Chatbots unterliegen Transparenzpflichten. ✓ — Art. 50 Prompts, die man in einen Chatbot eingibt, können pbD sein. ✓ Nach der Checkliste des Dozenten dürfen KI-Ergebnisse als Letztentscheidung dienen. ✗ — „keine automatisierte Letztentscheidung\" Art. 4 KI-VO verpflichtet Anbieter und Betreiber zur Sicherstellung von KI-Kompetenz. ✓ LLMs verstehen die Bedeutung der Wörter, die sie erzeugen. ✗ — laut Folie „ohne Semantik\"","words":1522,"mins":8},{"id":"d-anhang-a-zahlen-cheatsheet","subject":"ds","num":"A","title":"Anhang A: Zahlen-Cheatsheet","short":"Zahlen-Cheatsheet","html":"<p><strong>Die häufigste T/F-Falle sind vertauschte Zahlen. Lern diese Tabelle als Letztes vor der Klausur.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Zahl<\/th>\n<th>Wofür<\/th>\n<th>Quelle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>25.05.2016<\/strong><\/td>\n<td>DSGVO in Kraft getreten<\/td>\n<td>Folie 9<\/td>\n<\/tr>\n<tr>\n<td><strong>25.05.2018<\/strong><\/td>\n<td>DSGVO verpflichtend anwendbar<\/td>\n<td>Folie 9<\/td>\n<\/tr>\n<tr>\n<td><strong>15.12.1983<\/strong><\/td>\n<td>Volkszählungsurteil BVerfG<\/td>\n<td>Folie 11<\/td>\n<\/tr>\n<tr>\n<td><strong>01.08.2024<\/strong><\/td>\n<td>KI-VO in Kraft getreten<\/td>\n<td>Folie 83<\/td>\n<\/tr>\n<tr>\n<td><strong>02.02.2025<\/strong><\/td>\n<td>KI-VO: verbotene Praktiken gelten<\/td>\n<td>Folie 86<\/td>\n<\/tr>\n<tr>\n<td><strong>02.08.2025<\/strong><\/td>\n<td>KI-VO: GPAI + Sanktionen<\/td>\n<td>Folie 86<\/td>\n<\/tr>\n<tr>\n<td><strong>02.08.2026<\/strong><\/td>\n<td>KI-VO: alle übrigen Pflichten<\/td>\n<td>Folie 86<\/td>\n<\/tr>\n<tr>\n<td><strong>02.08.2027<\/strong><\/td>\n<td>KI-VO: weitere Hochrisiko-Systeme<\/td>\n<td>Folie 86<\/td>\n<\/tr>\n<tr>\n<td><strong>9<\/strong><\/td>\n<td>Grundsätze der DSGVO (Art. 5)<\/td>\n<td>Folie 29<\/td>\n<\/tr>\n<tr>\n<td><strong>6<\/strong><\/td>\n<td>Erlaubnistatbestände (Art. 6 I a–f)<\/td>\n<td>Folie 32<\/td>\n<\/tr>\n<tr>\n<td><strong>7<\/strong><\/td>\n<td>besondere Kategorien (Art. 9 I)<\/td>\n<td>Folie 25<\/td>\n<\/tr>\n<tr>\n<td><strong>16 Jahre<\/strong><\/td>\n<td>Einwilligungsalter für Kinder<\/td>\n<td>Folie 33<\/td>\n<\/tr>\n<tr>\n<td><strong>72 Stunden<\/strong><\/td>\n<td>Meldung der Datenpanne an die <strong>Behörde<\/strong><\/td>\n<td>Folie 69<\/td>\n<\/tr>\n<tr>\n<td><strong>≥ 20 Personen<\/strong><\/td>\n<td>DSB-Benennungspflicht (§ 38 BDSG)<\/td>\n<td>Folie 64<\/td>\n<\/tr>\n<tr>\n<td><strong>10 Mio € / 2 %<\/strong><\/td>\n<td>Bußgeld Art. 83 <strong>IV<\/strong> — organisatorische Pflichten<\/td>\n<td>Folie 62<\/td>\n<\/tr>\n<tr>\n<td><strong>20 Mio € / 4 %<\/strong><\/td>\n<td>Bußgeld Art. 83 <strong>V<\/strong> — Grundsätze und Betroffenenrechte<\/td>\n<td>Folie 63<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 1<\/strong><\/td>\n<td>Zweck / Grundrechtsschutz<\/td>\n<td>Folie 16<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 2 / Art. 3<\/strong><\/td>\n<td>sachlicher / räumlicher Anwendungsbereich<\/td>\n<td>Folien 26, 27<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 4 Nr. 1<\/strong><\/td>\n<td>Definition pbD<\/td>\n<td>Folie 22<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 5 I / Art. 5 II<\/strong><\/td>\n<td>8 Grundsätze / Rechenschaftspflicht<\/td>\n<td>Folien 28, 29<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 6 / Art. 7<\/strong><\/td>\n<td>Rechtmäßigkeit / Einwilligung<\/td>\n<td>Folien 32, 33<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 9<\/strong><\/td>\n<td>besondere Kategorien<\/td>\n<td>Folie 25<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 13 / Art. 14<\/strong><\/td>\n<td>Information bei Direkt- / Fremderhebung<\/td>\n<td>Folie 36<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 15 / 16 / 17 / 18 / 20 / 21<\/strong><\/td>\n<td>Auskunft / Berichtigung / Löschung / Einschränkung / Portabilität / Widerspruch<\/td>\n<td>Folien 37–41<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 28<\/strong><\/td>\n<td>Auftragsverarbeitung<\/td>\n<td>Folie 66<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 30<\/strong><\/td>\n<td>Verzeichnis der Verarbeitungstätigkeiten<\/td>\n<td>Folie 57<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 32<\/strong><\/td>\n<td>Sicherheit der Verarbeitung / TOMs<\/td>\n<td>Folie 43<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 33 / Art. 34<\/strong><\/td>\n<td>Meldung Behörde / Benachrichtigung Betroffene<\/td>\n<td>Folien 68, 69<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 35<\/strong><\/td>\n<td>Datenschutz-Folgenabschätzung<\/td>\n<td>Folie 67<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 39<\/strong><\/td>\n<td>Aufgaben des DSB<\/td>\n<td>Folie 65<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 58<\/strong><\/td>\n<td>Befugnisse der Aufsichtsbehörde<\/td>\n<td>Folie 59<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 83<\/strong><\/td>\n<td>Geldbußen<\/td>\n<td>Folien 62, 63<\/td>\n<\/tr>\n<tr>\n<td><strong>§ 26 BDSG<\/strong><\/td>\n<td>Beschäftigtendatenschutz<\/td>\n<td>Folien 70–73<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 3 Nr. 1 KI-VO<\/strong><\/td>\n<td>Legaldefinition KI-System<\/td>\n<td>Folie 82<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 4 KI-VO<\/strong><\/td>\n<td>KI-Kompetenz<\/td>\n<td>Folie 89<\/td>\n<\/tr>\n<tr>\n<td><strong>Art. 50 KI-VO<\/strong><\/td>\n<td>Transparenzpflichten (Deepfakes, Chatbots)<\/td>\n<td>Folie 85<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"d-die-10-wichtigsten-merksatze-in-einer-spalte\">Die 10 wichtigsten Merksätze in einer Spalte<\/h3>\n<pre><code>1.  Verbot mit Erlaubnisvorbehalt — verboten, außer es gibt eine Erlaubnis.\n2.  Pseudonymisiert = weiterhin pbD.  Anonymisiert = keine pbD mehr.\n3.  Zutritt (Gebäude) → Zugang (System) → Zugriff (Daten).\n4.  72 Stunden an die BEHÖRDE bei Risiko;\n    unverzüglich an BETROFFENE nur bei HOHEM Risiko.\n5.  10 Mio/2 % = Organisation.   20 Mio/4 % = Grundsätze und Rechte.\n6.  Rechenschaftspflicht (Art. 5 II) = Beweislastumkehr.\n7.  Bei Auftragsverarbeitung bleibt die Verantwortung beim Auftraggeber.\n8.  Der DSB berät und überwacht — er entscheidet nicht und haftet nicht.\n9.  Einwilligung ist EINE von SECHS Rechtsgrundlagen, nicht die Regel.\n10. Regelbasierte Software ist KEIN KI-System nach der KI-VO.\n<\/code><\/pre>","text":"Die häufigste T/F-Falle sind vertauschte Zahlen. Lern diese Tabelle als Letztes vor der Klausur. Zahl Wofür Quelle 25.05.2016 DSGVO in Kraft getreten Folie 9 25.05.2018 DSGVO verpflichtend anwendbar Folie 9 15.12.1983 Volkszählungsurteil BVerfG Folie 11 01.08.2024 KI-VO in Kraft getreten Folie 83 02.02.2025 KI-VO: verbotene Praktiken gelten Folie 86 02.08.2025 KI-VO: GPAI + Sanktionen Folie 86 02.08.2026 KI-VO: alle übrigen Pflichten Folie 86 02.08.2027 KI-VO: weitere Hochrisiko-Systeme Folie 86 9 Grundsätze der DSGVO (Art. 5) Folie 29 6 Erlaubnistatbestände (Art. 6 I a–f) Folie 32 7 besondere Kategorien (Art. 9 I) Folie 25 16 Jahre Einwilligungsalter für Kinder Folie 33 72 Stunden Meldung der Datenpanne an die Behörde Folie 69 ≥ 20 Personen DSB-Benennungspflicht (§ 38 BDSG) Folie 64 10 Mio € / 2 % Bußgeld Art. 83 IV — organisatorische Pflichten Folie 62 20 Mio € / 4 % Bußgeld Art. 83 V — Grundsätze und Betroffenenrechte Folie 63 Art. 1 Zweck / Grundrechtsschutz Folie 16 Art. 2 / Art. 3 sachlicher / räumlicher Anwendungsbereich Folien 26, 27 Art. 4 Nr. 1 Definition pbD Folie 22 Art. 5 I / Art. 5 II 8 Grundsätze / Rechenschaftspflicht Folien 28, 29 Art. 6 / Art. 7 Rechtmäßigkeit / Einwilligung Folien 32, 33 Art. 9 besondere Kategorien Folie 25 Art. 13 / Art. 14 Information bei Direkt- / Fremderhebung Folie 36 Art. 15 / 16 / 17 / 18 / 20 / 21 Auskunft / Berichtigung / Löschung / Einschränkung / Portabilität / Widerspruch Folien 37–41 Art. 28 Auftragsverarbeitung Folie 66 Art. 30 Verzeichnis der Verarbeitungstätigkeiten Folie 57 Art. 32 Sicherheit der Verarbeitung / TOMs Folie 43 Art. 33 / Art. 34 Meldung Behörde / Benachrichtigung Betroffene Folien 68, 69 Art. 35 Datenschutz-Folgenabschätzung Folie 67 Art. 39 Aufgaben des DSB Folie 65 Art. 58 Befugnisse der Aufsichtsbehörde Folie 59 Art. 83 Geldbußen Folien 62, 63 § 26 BDSG Beschäftigtendatenschutz Folien 70–73 Art. 3 Nr. 1 KI-VO Legaldefinition KI-System Folie 82 Art. 4 KI-VO KI-Kompetenz Folie 89 Art. 50 KI-VO Transparenzpflichten (Deepfakes, Chatbots) Folie 85 Die 10 wichtigsten Merksätze in einer Spalte 1. Verbot mit Erlaubnisvorbehalt — verboten, außer es gibt eine Erlaubnis. 2. Pseudonymisiert = weiterhin pbD. Anonymisiert = keine pbD mehr. 3. Zutritt (Gebäude) → Zugang (System) → Zugriff (Daten). 4. 72 Stunden an die BEHÖRDE bei Risiko; unverzüglich an BETROFFENE nur bei HOHEM Risiko. 5. 10 Mio/2 % = Organisation. 20 Mio/4 % = Grundsätze und Rechte. 6. Rechenschaftspflicht (Art. 5 II) = Beweislastumkehr. 7. Bei Auftragsverarbeitung bleibt die Verantwortung beim Auftraggeber. 8. Der DSB berät und überwacht — er entscheidet nicht und haftet nicht. 9. Einwilligung ist EINE von SECHS Rechtsgrundlagen, nicht die Regel. 10. Regelbasierte Software ist KEIN KI-System nach der KI-VO.","words":445,"mins":2},{"id":"d-anhang-b-fehler-in-den-folien","subject":"ds","num":"B","title":"Anhang B: Fehler in den Folien","short":"Fehler in den Folien","html":"<table>\n<thead>\n<tr>\n<th>Folie<\/th>\n<th>Steht dort<\/th>\n<th>Richtig<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>37<\/strong><\/td>\n<td>„Einschränkung der Verarbeitung — <strong>Art. 19<\/strong>\"<\/td>\n<td><strong>Art. 18<\/strong>. Art. 19 ist die Mitteilungspflicht an Empfänger.<\/td>\n<\/tr>\n<tr>\n<td><strong>57<\/strong><\/td>\n<td>„§ 70 <strong>BGSG<\/strong> (neu)\"<\/td>\n<td><strong>BDSG<\/strong> (Tippfehler)<\/td>\n<\/tr>\n<tr>\n<td><strong>69<\/strong><\/td>\n<td>„unverzüglich (<strong>mind.<\/strong> binnen 72 Stunden)\"<\/td>\n<td>Art. 33 sagt „unverzüglich und <strong>möglichst<\/strong> binnen 72 Stunden\". „mind.\" ist eine unglückliche Formulierung — gemeint ist: <strong>spätestens<\/strong> nach 72 Stunden.<\/td>\n<\/tr>\n<tr>\n<td><strong>111<\/strong><\/td>\n<td>„<strong>Landesgericht<\/strong> München\"<\/td>\n<td><strong>Landgericht<\/strong> München (im Fließtext der Folie steht es korrekt)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Bei einer T/F-Frage zur Einschränkung der Verarbeitung: <strong>Art. 18<\/strong> ist richtig, und du kannst es im DSGVO-Ausdruck nachschlagen.<\/p>","text":"Folie Steht dort Richtig 37 „Einschränkung der Verarbeitung — Art. 19 \" Art. 18 . Art. 19 ist die Mitteilungspflicht an Empfänger. 57 „§ 70 BGSG (neu)\" BDSG (Tippfehler) 69 „unverzüglich ( mind. binnen 72 Stunden)\" Art. 33 sagt „unverzüglich und möglichst binnen 72 Stunden\". „mind.\" ist eine unglückliche Formulierung — gemeint ist: spätestens nach 72 Stunden. 111 „ Landesgericht München\" Landgericht München (im Fließtext der Folie steht es korrekt) Bei einer T/F-Frage zur Einschränkung der Verarbeitung: Art. 18 ist richtig, und du kannst es im DSGVO-Ausdruck nachschlagen.","words":88,"mins":1},{"id":"d-anhang-c-dein-dsgvo-ausdruck","subject":"ds","num":"C","title":"Anhang C: Dein DSGVO-Ausdruck","short":"Dein DSGVO-Ausdruck","html":"<p>Der Dozent hat in Teams geschrieben:<\/p>\n<blockquote>\n<p>„Das <strong>„Exzerpt\"<\/strong> ist zum Ausdruck und zur Mitnahme in die Klausur geeignet und bestimmt. Allerdings ist der Text sehr klein geraten. Wenn es Ihnen also … gelingt, aus dem DSGVO-Auszug eine besser lesbare Version auszudrucken …, feel free! <strong>Als zulässiges Hilfsmittel gilt ein Text der DSGVO.<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"d-was-in-deinem-ordner-liegt-und-was-du-drucken-solltest\">Was in deinem Ordner liegt — und was du drucken solltest<\/h3>\n<table>\n<thead>\n<tr>\n<th>Datei<\/th>\n<th>Format<\/th>\n<th>Seiten<\/th>\n<th>Lesbarkeit<\/th>\n<th>Empfehlung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>WRuDS DSGVO Exzerpt.pdf<\/code><\/td>\n<td>A4 hoch<\/td>\n<td><strong>4<\/strong><\/td>\n<td>sehr klein — der ganze Text auf 4 Seiten gequetscht<\/td>\n<td>✗<\/td>\n<\/tr>\n<tr>\n<td><code>WRuDS DSGVO Auszug.pdf<\/code><\/td>\n<td>–<\/td>\n<td>–<\/td>\n<td>(Datei ist beschädigt, lässt sich nicht sauber öffnen)<\/td>\n<td>✗<\/td>\n<\/tr>\n<tr>\n<td><strong><code>WRuDS DSGVO Auszug bereinigt.pdf<\/code><\/strong><\/td>\n<td><strong>A4 quer<\/strong><\/td>\n<td><strong>10<\/strong><\/td>\n<td><strong>gut lesbar<\/strong>, saubere Typografie, 3 Spalten pro Seite<\/td>\n<td><strong>✓ das drucken<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Die „bereinigte\" Version ist genau das, was der Dozent gemeint hat<\/strong> — jemand hat den Auszug bereits neu gesetzt. Drucke die, <strong>im Querformat<\/strong>, am besten einseitig, damit du schnell blättern kannst.<\/p>\n<h3 id=\"d-was-nicht-im-ausdruck-steht\">⚠️ Was NICHT im Ausdruck steht<\/h3>\n<p>Ich habe den Inhalt geprüft: Der Auszug reicht von <strong>Art. 2<\/strong> bis etwa <strong>Art. 39<\/strong>.<\/p>\n<p><strong>Das bedeutet für die Klausur:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Kannst du nachschlagen<\/th>\n<th>Musst du auswendig können<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Art. 2, 3 Anwendungsbereich<\/td>\n<td><strong>Art. 82 Schadensersatz<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Art. 4 Begriffe<\/td>\n<td><strong>Art. 83 Geldbußen (10/2 und 20/4)<\/strong> ← am wichtigsten!<\/td>\n<\/tr>\n<tr>\n<td>Art. 5 Grundsätze<\/td>\n<td><strong>§ 26 BDSG<\/strong> Beschäftigtendatenschutz<\/td>\n<\/tr>\n<tr>\n<td>Art. 6, 7, 8, 9 Rechtmäßigkeit<\/td>\n<td><strong>§ 38 BDSG<\/strong> (20-Personen-Grenze)<\/td>\n<\/tr>\n<tr>\n<td>Art. 12–22 Betroffenenrechte<\/td>\n<td><strong>Die gesamte KI-VO<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Art. 25 Privacy by Design/Default<\/td>\n<td>Volkszählungsurteil, alle Definitionen aus den Folien<\/td>\n<\/tr>\n<tr>\n<td>Art. 28 Auftragsverarbeitung<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Art. 30 Verzeichnis<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Art. 32 Sicherheit<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Art. 33, 34 Datenpanne<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Art. 35 DSFA<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Art. 37–39 DSB<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Die Bußgeldzahlen sind also nicht nachschlagbar.<\/strong> Schreib sie dir auf ein Post-it und lern sie zuletzt.<\/p>\n<h3 id=\"d-vorbereitung-des-ausdrucks\">Vorbereitung des Ausdrucks<\/h3>\n<p>Der Dozent erlaubt beim BGB ausdrücklich Markierungen und kurze handschriftliche Verweise. Für die DSGVO ist als Hilfsmittel „ein Text der DSGVO\" zugelassen — halte es sicherheitshalber genauso: <strong>markieren ja, Volltext-Kommentare nein.<\/strong><\/p>\n<p>Markier dir am Rand:\n- Art. 5 → „<strong>9 Grundsätze<\/strong>\"\n- Art. 6 → „<strong>6 Erlaubnistatbestände a–f<\/strong>\"\n- Art. 9 → „<strong>7 besondere Kategorien<\/strong>\"\n- Art. 13/14 → „<strong>13 = direkt, 14 = fremd<\/strong>\"\n- Art. 15–21 → die Rechte durchnummerieren\n- Art. 33 → „<strong>72 h Behörde<\/strong>\", Art. 34 → „<strong>hohes Risiko → Betroffene<\/strong>\"<\/p>","text":"Der Dozent hat in Teams geschrieben: „Das „Exzerpt\" ist zum Ausdruck und zur Mitnahme in die Klausur geeignet und bestimmt. Allerdings ist der Text sehr klein geraten. Wenn es Ihnen also … gelingt, aus dem DSGVO-Auszug eine besser lesbare Version auszudrucken …, feel free! Als zulässiges Hilfsmittel gilt ein Text der DSGVO. \" Was in deinem Ordner liegt — und was du drucken solltest Datei Format Seiten Lesbarkeit Empfehlung WRuDS DSGVO Exzerpt.pdf A4 hoch 4 sehr klein — der ganze Text auf 4 Seiten gequetscht ✗ WRuDS DSGVO Auszug.pdf – – (Datei ist beschädigt, lässt sich nicht sauber öffnen) ✗ WRuDS DSGVO Auszug bereinigt.pdf A4 quer 10 gut lesbar , saubere Typografie, 3 Spalten pro Seite ✓ das drucken Die „bereinigte\" Version ist genau das, was der Dozent gemeint hat — jemand hat den Auszug bereits neu gesetzt. Drucke die, im Querformat , am besten einseitig, damit du schnell blättern kannst. ⚠️ Was NICHT im Ausdruck steht Ich habe den Inhalt geprüft: Der Auszug reicht von Art. 2 bis etwa Art. 39 . Das bedeutet für die Klausur: Kannst du nachschlagen Musst du auswendig können Art. 2, 3 Anwendungsbereich Art. 82 Schadensersatz Art. 4 Begriffe Art. 83 Geldbußen (10/2 und 20/4) ← am wichtigsten! Art. 5 Grundsätze § 26 BDSG Beschäftigtendatenschutz Art. 6, 7, 8, 9 Rechtmäßigkeit § 38 BDSG (20-Personen-Grenze) Art. 12–22 Betroffenenrechte Die gesamte KI-VO Art. 25 Privacy by Design/Default Volkszählungsurteil, alle Definitionen aus den Folien Art. 28 Auftragsverarbeitung Art. 30 Verzeichnis Art. 32 Sicherheit Art. 33, 34 Datenpanne Art. 35 DSFA Art. 37–39 DSB Die Bußgeldzahlen sind also nicht nachschlagbar. Schreib sie dir auf ein Post-it und lern sie zuletzt. Vorbereitung des Ausdrucks Der Dozent erlaubt beim BGB ausdrücklich Markierungen und kurze handschriftliche Verweise. Für die DSGVO ist als Hilfsmittel „ein Text der DSGVO\" zugelassen — halte es sicherheitshalber genauso: markieren ja, Volltext-Kommentare nein. Markier dir am Rand: - Art. 5 → „ 9 Grundsätze \" - Art. 6 → „ 6 Erlaubnistatbestände a–f \" - Art. 9 → „ 7 besondere Kategorien \" - Art. 13/14 → „ 13 = direkt, 14 = fremd \" - Art. 15–21 → die Rechte durchnummerieren - Art. 33 → „ 72 h Behörde \", Art. 34 → „ hohes Risiko → Betroffene \"","words":374,"mins":2},{"id":"d-anhang-d-60-übungsfragen","subject":"ds","num":"D","title":"Anhang D: 60 Übungsfragen","short":"60 Übungsfragen","html":"<p>Deck die rechte Spalte ab. Antworte in <strong>maximal 10 Sekunden<\/strong> — genau wie in der Klausur.<\/p>\n<h3 id=\"d-rechtsrahmen-anwendungsbereich\">Rechtsrahmen &amp; Anwendungsbereich<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Aussage<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Die DSGVO ist seit dem 25.05.2018 verpflichtend anzuwenden.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Die DSGVO musste durch ein deutsches Gesetz erst umgesetzt werden.<\/td>\n<td><strong>✗<\/strong> Verordnung, gilt unmittelbar<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Das Recht auf informationelle Selbstbestimmung stammt aus dem Volkszählungsurteil von 1983.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Das Volkszählungsurteil erging durch den Bundesgerichtshof.<\/td>\n<td><strong>✗<\/strong> BVerfG<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Die DSGVO schützt auch juristische Personen.<\/td>\n<td><strong>✗<\/strong> nur natürliche<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Ein US-Unternehmen ohne EU-Sitz kann der DSGVO unterliegen.<\/td>\n<td><strong>✓<\/strong> Marktortprinzip<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Das Marktortprinzip greift nur bei entgeltlichen Angeboten.<\/td>\n<td><strong>✗<\/strong> „auch kostenlos\"<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Das bloße Beobachten des Verhaltens von EU-Bürgern löst die DSGVO aus.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Rein private Adressbücher fallen unter die DSGVO.<\/td>\n<td><strong>✗<\/strong> Haushaltsausnahme<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Papierakten fallen nie unter die DSGVO.<\/td>\n<td><strong>✗<\/strong> wenn in einem Dateisystem<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"d-begriffe\">Begriffe<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Aussage<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>11<\/td>\n<td>Eine IP-Adresse ist ein personenbezogenes Datum.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Ein Arbeitszeugnis enthält personenbezogene Daten.<\/td>\n<td><strong>✓<\/strong> Werturteil<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>Daten Verstorbener sind personenbezogene Daten.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>Aggregierte Statistiken sind personenbezogene Daten.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Anonymisierte Daten unterliegen weiterhin der DSGVO.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>Pseudonymisierte Daten unterliegen weiterhin der DSGVO.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>Gesundheitsdaten sind eine besondere Kategorie nach Art. 9.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td>Die Gewerkschaftszugehörigkeit ist eine besondere Kategorie.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td>Kreditkartennummern sind eine besondere Kategorie nach Art. 9.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>Politische Meinungen sind eine besondere Kategorie.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"d-grundsatze-rechtmaigkeit\">Grundsätze &amp; Rechtmäßigkeit<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Aussage<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>21<\/td>\n<td>Die DSGVO kennt neun Verarbeitungsgrundsätze.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>22<\/td>\n<td>Die Rechenschaftspflicht steht in Art. 5 Abs. 2.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>23<\/td>\n<td>Die Rechenschaftspflicht bewirkt eine Beweislastumkehr.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>24<\/td>\n<td>Die Verarbeitung pbD ist erlaubt, solange sie nicht ausdrücklich verboten ist.<\/td>\n<td><strong>✗<\/strong> umgekehrt<\/td>\n<\/tr>\n<tr>\n<td>25<\/td>\n<td>Art. 6 kennt sechs Erlaubnistatbestände.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>26<\/td>\n<td>Ohne Einwilligung ist jede Verarbeitung rechtswidrig.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>27<\/td>\n<td>Die Vertragserfüllung ist eine Rechtsgrundlage nach Art. 6 I b.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>28<\/td>\n<td>Bei berechtigtem Interesse ist eine Interessenabwägung erforderlich.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>29<\/td>\n<td>Eine Einwilligung bedarf nach der DSGVO der eigenhändigen Unterschrift.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>30<\/td>\n<td>Der Verantwortliche muss die Einwilligung nachweisen können.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>31<\/td>\n<td>Der Widerruf muss so einfach sein wie die Erteilung der Einwilligung.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>32<\/td>\n<td>Kinder können ab 16 Jahren selbst einwilligen.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>33<\/td>\n<td>Ein Widerruf macht die bisherige Verarbeitung rückwirkend rechtswidrig.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"d-betroffenenrechte\">Betroffenenrechte<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Aussage<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>34<\/td>\n<td>Art. 13 gilt bei Erhebung direkt bei der betroffenen Person.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>35<\/td>\n<td>Art. 14 gilt bei Direkterhebung.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>36<\/td>\n<td>Das Auskunftsrecht steht in Art. 15.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>37<\/td>\n<td>Die Auskunft umfasst auch die geplante Speicherdauer.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>38<\/td>\n<td>Das Recht auf Löschung gilt uneingeschränkt.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>39<\/td>\n<td>Gesetzliche Aufbewahrungspflichten können der Löschung entgegenstehen.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>40<\/td>\n<td>Das Recht auf Datenübertragbarkeit gilt bei jeder Rechtsgrundlage.<\/td>\n<td><strong>✗<\/strong> nur Einwilligung/Vertrag + automatisiert<\/td>\n<\/tr>\n<tr>\n<td>41<\/td>\n<td>Gegen Direktwerbung kann ohne Begründung widersprochen werden.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>42<\/td>\n<td>Betroffene müssen auf ihr Widerspruchsrecht hingewiesen werden.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"d-sicherheit-organisation\">Sicherheit &amp; Organisation<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Aussage<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>43<\/td>\n<td>Zutrittskontrolle regelt den physischen Zugang zu Räumen.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>44<\/td>\n<td>Zwei-Faktor-Authentifizierung ist eine Zutrittskontrolle.<\/td>\n<td><strong>✗<\/strong> Zugang<\/td>\n<\/tr>\n<tr>\n<td>45<\/td>\n<td>RBAC ist eine Maßnahme der Zugriffskontrolle.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>46<\/td>\n<td>Art. 32 nennt auch die Belastbarkeit der Systeme.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>47<\/td>\n<td>Die Wirksamkeit der TOMs muss regelmäßig überprüft werden.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>48<\/td>\n<td>„Safety\" meint den Schutz vor gezielten Angriffen.<\/td>\n<td><strong>✗<\/strong> das ist security<\/td>\n<\/tr>\n<tr>\n<td>49<\/td>\n<td>Das Verzeichnis der Verarbeitungstätigkeiten steht in Art. 30.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>50<\/td>\n<td>PDCA steht für Plan – Do – Check – Act.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"d-bugelder-dsb-av-dsfa-datenpanne\">Bußgelder, DSB, AV, DSFA, Datenpanne<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Aussage<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>51<\/td>\n<td>Der Bußgeldrahmen der oberen Stufe liegt bei 20 Mio € oder 4 % des Vorjahresumsatzes.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>52<\/td>\n<td>Ein fehlendes Verarbeitungsverzeichnis fällt in die 20-Mio-Stufe.<\/td>\n<td><strong>✗<\/strong> 10 Mio / 2 %<\/td>\n<\/tr>\n<tr>\n<td>53<\/td>\n<td>Bußgelder sind absolut auf 20 Mio € gedeckelt.<\/td>\n<td><strong>✗<\/strong> je nachdem, welcher Betrag höher ist<\/td>\n<\/tr>\n<tr>\n<td>54<\/td>\n<td>Ein DSB ist ab 20 ständig mit automatisierter Verarbeitung betrauten Personen zu benennen.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>55<\/td>\n<td>Der DSB haftet persönlich für Verstöße des Unternehmens.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>56<\/td>\n<td>Der DSB kann extern bestellt werden.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>57<\/td>\n<td>Bei Auftragsverarbeitung geht die Verantwortung auf den Dienstleister über.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>58<\/td>\n<td>Für die Auftragsverarbeitung ist ein Vertrag erforderlich.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>59<\/td>\n<td>Eine Datenpanne ist der Aufsichtsbehörde binnen 72 Stunden zu melden.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>60<\/td>\n<td>Betroffene sind bei jeder Datenpanne zu benachrichtigen.<\/td>\n<td><strong>✗<\/strong> nur bei hohem Risiko<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"d-bonus-ki-vo\">Bonus: KI-VO<\/h3>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Aussage<\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>61<\/td>\n<td>Die KI-VO trat am 01.08.2024 in Kraft.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>62<\/td>\n<td>Klassische Wenn-Dann-Software ist ein KI-System nach der KI-VO.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>63<\/td>\n<td>Die KI-VO verfolgt einen risikobasierten Ansatz.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>64<\/td>\n<td>Für risikoarme KI-Systeme gelten nur freiwillige Anforderungen.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>65<\/td>\n<td>Deepfakes und Chatbots unterliegen Transparenzpflichten nach Art. 50.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>66<\/td>\n<td>Prompts können personenbezogene Daten enthalten.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>67<\/td>\n<td>Art. 4 KI-VO verpflichtet zur Sicherstellung ausreichender KI-Kompetenz.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>68<\/td>\n<td>Nach der Checkliste des Dozenten darf eine KI die Letztentscheidung treffen.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>69<\/td>\n<td>Nutzung von KI ausschließlich zu persönlichen, nicht beruflichen Zwecken ist ausgenommen.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>70<\/td>\n<td>Laut Folie ist unstreitig, dass ein KI-Modell selbst keine pbD enthält.<\/td>\n<td><strong>✗<\/strong> „umstritten\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Auswertung:<\/strong> Unter 60 richtig → nochmal durchs Blatt. 60–65 → gut. Über 65 → du bist bereit.<\/p>\n<hr>\n<p><em>Erstellt aus: „WRuDS Schulung Datenschutz 2026-06-16\" (114 Folien, Udo Keuter, externer zertifizierter Datenschutzbeauftragter), sowie den DSGVO-Auszügen im Kursordner. Stand: August 2026.<\/em><\/p>","text":"Deck die rechte Spalte ab. Antworte in maximal 10 Sekunden — genau wie in der Klausur. Rechtsrahmen & Anwendungsbereich # Aussage 1 Die DSGVO ist seit dem 25.05.2018 verpflichtend anzuwenden. ✓ 2 Die DSGVO musste durch ein deutsches Gesetz erst umgesetzt werden. ✗ Verordnung, gilt unmittelbar 3 Das Recht auf informationelle Selbstbestimmung stammt aus dem Volkszählungsurteil von 1983. ✓ 4 Das Volkszählungsurteil erging durch den Bundesgerichtshof. ✗ BVerfG 5 Die DSGVO schützt auch juristische Personen. ✗ nur natürliche 6 Ein US-Unternehmen ohne EU-Sitz kann der DSGVO unterliegen. ✓ Marktortprinzip 7 Das Marktortprinzip greift nur bei entgeltlichen Angeboten. ✗ „auch kostenlos\" 8 Das bloße Beobachten des Verhaltens von EU-Bürgern löst die DSGVO aus. ✓ 9 Rein private Adressbücher fallen unter die DSGVO. ✗ Haushaltsausnahme 10 Papierakten fallen nie unter die DSGVO. ✗ wenn in einem Dateisystem Begriffe # Aussage 11 Eine IP-Adresse ist ein personenbezogenes Datum. ✓ 12 Ein Arbeitszeugnis enthält personenbezogene Daten. ✓ Werturteil 13 Daten Verstorbener sind personenbezogene Daten. ✗ 14 Aggregierte Statistiken sind personenbezogene Daten. ✗ 15 Anonymisierte Daten unterliegen weiterhin der DSGVO. ✗ 16 Pseudonymisierte Daten unterliegen weiterhin der DSGVO. ✓ 17 Gesundheitsdaten sind eine besondere Kategorie nach Art. 9. ✓ 18 Die Gewerkschaftszugehörigkeit ist eine besondere Kategorie. ✓ 19 Kreditkartennummern sind eine besondere Kategorie nach Art. 9. ✗ 20 Politische Meinungen sind eine besondere Kategorie. ✓ Grundsätze & Rechtmäßigkeit # Aussage 21 Die DSGVO kennt neun Verarbeitungsgrundsätze. ✓ 22 Die Rechenschaftspflicht steht in Art. 5 Abs. 2. ✓ 23 Die Rechenschaftspflicht bewirkt eine Beweislastumkehr. ✓ 24 Die Verarbeitung pbD ist erlaubt, solange sie nicht ausdrücklich verboten ist. ✗ umgekehrt 25 Art. 6 kennt sechs Erlaubnistatbestände. ✓ 26 Ohne Einwilligung ist jede Verarbeitung rechtswidrig. ✗ 27 Die Vertragserfüllung ist eine Rechtsgrundlage nach Art. 6 I b. ✓ 28 Bei berechtigtem Interesse ist eine Interessenabwägung erforderlich. ✓ 29 Eine Einwilligung bedarf nach der DSGVO der eigenhändigen Unterschrift. ✗ 30 Der Verantwortliche muss die Einwilligung nachweisen können. ✓ 31 Der Widerruf muss so einfach sein wie die Erteilung der Einwilligung. ✓ 32 Kinder können ab 16 Jahren selbst einwilligen. ✓ 33 Ein Widerruf macht die bisherige Verarbeitung rückwirkend rechtswidrig. ✗ Betroffenenrechte # Aussage 34 Art. 13 gilt bei Erhebung direkt bei der betroffenen Person. ✓ 35 Art. 14 gilt bei Direkterhebung. ✗ 36 Das Auskunftsrecht steht in Art. 15. ✓ 37 Die Auskunft umfasst auch die geplante Speicherdauer. ✓ 38 Das Recht auf Löschung gilt uneingeschränkt. ✗ 39 Gesetzliche Aufbewahrungspflichten können der Löschung entgegenstehen. ✓ 40 Das Recht auf Datenübertragbarkeit gilt bei jeder Rechtsgrundlage. ✗ nur Einwilligung/Vertrag + automatisiert 41 Gegen Direktwerbung kann ohne Begründung widersprochen werden. ✓ 42 Betroffene müssen auf ihr Widerspruchsrecht hingewiesen werden. ✓ Sicherheit & Organisation # Aussage 43 Zutrittskontrolle regelt den physischen Zugang zu Räumen. ✓ 44 Zwei-Faktor-Authentifizierung ist eine Zutrittskontrolle. ✗ Zugang 45 RBAC ist eine Maßnahme der Zugriffskontrolle. ✓ 46 Art. 32 nennt auch die Belastbarkeit der Systeme. ✓ 47 Die Wirksamkeit der TOMs muss regelmäßig überprüft werden. ✓ 48 „Safety\" meint den Schutz vor gezielten Angriffen. ✗ das ist security 49 Das Verzeichnis der Verarbeitungstätigkeiten steht in Art. 30. ✓ 50 PDCA steht für Plan – Do – Check – Act. ✓ Bußgelder, DSB, AV, DSFA, Datenpanne # Aussage 51 Der Bußgeldrahmen der oberen Stufe liegt bei 20 Mio € oder 4 % des Vorjahresumsatzes. ✓ 52 Ein fehlendes Verarbeitungsverzeichnis fällt in die 20-Mio-Stufe. ✗ 10 Mio / 2 % 53 Bußgelder sind absolut auf 20 Mio € gedeckelt. ✗ je nachdem, welcher Betrag höher ist 54 Ein DSB ist ab 20 ständig mit automatisierter Verarbeitung betrauten Personen zu benennen. ✓ 55 Der DSB haftet persönlich für Verstöße des Unternehmens. ✗ 56 Der DSB kann extern bestellt werden. ✓ 57 Bei Auftragsverarbeitung geht die Verantwortung auf den Dienstleister über. ✗ 58 Für die Auftragsverarbeitung ist ein Vertrag erforderlich. ✓ 59 Eine Datenpanne ist der Aufsichtsbehörde binnen 72 Stunden zu melden. ✓ 60 Betroffene sind bei jeder Datenpanne zu benachrichtigen. ✗ nur bei hohem Risiko Bonus: KI-VO # Aussage 61 Die KI-VO trat am 01.08.2024 in Kraft. ✓ 62 Klassische Wenn-Dann-Software ist ein KI-System nach der KI-VO. ✗ 63 Die KI-VO verfolgt einen risikobasierten Ansatz. ✓ 64 Für risikoarme KI-Systeme gelten nur freiwillige Anforderungen. ✓ 65 Deepfakes und Chatbots unterliegen Transparenzpflichten nach Art. 50. ✓ 66 Prompts können personenbezogene Daten enthalten. ✓ 67 Art. 4 KI-VO verpflichtet zur Sicherstellung ausreichender KI-Kompetenz. ✓ 68 Nach der Checkliste des Dozenten darf eine KI die Letztentscheidung treffen. ✗ 69 Nutzung von KI ausschließlich zu persönlichen, nicht beruflichen Zwecken ist ausgenommen. ✓ 70 Laut Folie ist unstreitig, dass ein KI-Modell selbst keine pbD enthält. ✗ „umstritten\" Auswertung: Unter 60 richtig → nochmal durchs Blatt. 60–65 → gut. Über 65 → du bist bereit. Erstellt aus: „WRuDS Schulung Datenschutz 2026-06-16\" (114 Folien, Udo Keuter, externer zertifizierter Datenschutzbeauftragter), sowie den DSGVO-Auszügen im Kursordner. Stand: August 2026.","words":798,"mins":4},{"id":"d-anhang-e-was-du-wirklich-auswendig-können-musst","subject":"ds","num":"E","title":"Anhang E: Was du wirklich auswendig können musst","short":"Was du wirklich auswendig können musst","html":"<p>Der Datenschutzteil wird als True/False geprüft. Du musst also nichts <strong>formulieren<\/strong> können — du musst Aussagen <strong>wiedererkennen<\/strong>. Das ändert, was Lernen hier heißt.<\/p>\n<h3 id=\"d-e1-das-wichtigste-zuerst-was-nicht-im-ausdruck-steht\">E.1 Das Wichtigste zuerst: Was nicht im Ausdruck steht<\/h3>\n<p>Dein DSGVO-Auszug reicht nur bis <strong>Artikel 39<\/strong>. Alles Folgende kannst du <strong>nicht nachschlagen<\/strong> und musst es im Kopf haben:<\/p>\n<table>\n<thead>\n<tr>\n<th>Muss ins Gedächtnis<\/th>\n<th>Warum<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Art. 83 — die vier Bußgeldzahlen<\/strong><\/td>\n<td>10 Mio / 2 % für organisatorische Pflichten · 20 Mio / 4 % für Grundsätze und Betroffenenrechte<\/td>\n<\/tr>\n<tr>\n<td><strong>§ 26 BDSG<\/strong> — Beschäftigtendatenschutz<\/td>\n<td>steht im BDSG, nicht in der DSGVO<\/td>\n<\/tr>\n<tr>\n<td><strong>§ 38 BDSG<\/strong> — die 20-Personen-Grenze<\/td>\n<td>dito<\/td>\n<\/tr>\n<tr>\n<td><strong>Die gesamte KI-VO<\/strong><\/td>\n<td>eigenes Gesetz, nicht im Auszug<\/td>\n<\/tr>\n<tr>\n<td><strong>Volkszählungsurteil 1983, BVerfG, Art. 1 + 2 GG<\/strong><\/td>\n<td>Hintergrund, steht in keinem Gesetzestext<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"d-e2-die-zehn-satze-die-fast-sicher-drankommen\">E.2 Die zehn Sätze, die fast sicher drankommen<\/h3>\n<p>Wenn du nur zehn Dinge mitnimmst, dann diese:<\/p>\n<ol>\n<li><strong>Verbot mit Erlaubnisvorbehalt<\/strong> — Verarbeitung ist verboten, außer es greift ein Erlaubnisgrund. Nicht umgekehrt.<\/li>\n<li><strong>Pseudonymisiert = weiterhin personenbezogen.<\/strong> Nur <strong>anonymisiert<\/strong> ist raus aus der DSGVO.<\/li>\n<li><strong>Zutritt<\/strong> (Gebäude) → <strong>Zugang<\/strong> (System) → <strong>Zugriff<\/strong> (Daten). In dieser Reihenfolge.<\/li>\n<li><strong>72 Stunden<\/strong> an die <strong>Behörde<\/strong> — schon bei einfachem Risiko. An die <strong>Betroffenen<\/strong> nur bei <strong>hohem<\/strong> Risiko.<\/li>\n<li><strong>10 Mio / 2 %<\/strong> = Organisation (Verzeichnis, DSB, DSFA, AV-Vertrag). <strong>20 Mio / 4 %<\/strong> = Grundsätze und Betroffenenrechte.<\/li>\n<li><strong>Rechenschaftspflicht<\/strong> (Art. 5 <strong>II<\/strong>) = <strong>Beweislastumkehr<\/strong>. Die Firma muss beweisen, dass sie es richtig macht.<\/li>\n<li>Bei <strong>Auftragsverarbeitung<\/strong> bleibt die Verantwortung beim <strong>Auftraggeber<\/strong>.<\/li>\n<li>Der <strong>Datenschutzbeauftragte berät und überwacht<\/strong> — er entscheidet nicht und haftet nicht.<\/li>\n<li>Die <strong>Einwilligung ist eine von sechs<\/strong> Rechtsgrundlagen, nicht die Regel.<\/li>\n<li><strong>Regelbasierte Wenn-Dann-Software ist kein KI-System<\/strong> im Sinne der KI-VO.<\/li>\n<\/ol>\n<h3 id=\"d-e3-definitionen-die-du-wiedererkennen-musst\">E.3 Definitionen, die du wiedererkennen musst<\/h3>\n<p>Nicht formulieren — nur erkennen, ob eine Aussage sie richtig wiedergibt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Kern<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Personenbezogene Daten<\/strong> (Art. 4 Nr. 1)<\/td>\n<td>alle Informationen über eine <strong>identifizierte oder identifizierbare<\/strong> natürliche Person<\/td>\n<\/tr>\n<tr>\n<td><strong>Vertraulichkeit<\/strong><\/td>\n<td>nur für einen bestimmten Empfängerkreis bestimmt<\/td>\n<\/tr>\n<tr>\n<td><strong>Integrität<\/strong><\/td>\n<td>vollständig und unverändert<\/td>\n<\/tr>\n<tr>\n<td><strong>Verfügbarkeit<\/strong><\/td>\n<td>steht dem Berechtigten bei Bedarf zur Verfügung<\/td>\n<\/tr>\n<tr>\n<td><strong>Datenpanne<\/strong> (Art. 33)<\/td>\n<td>unrechtmäßige Übermittlung oder Kenntniserlangung <strong>und<\/strong> Risiko für Rechte und Freiheiten<\/td>\n<\/tr>\n<tr>\n<td><strong>KI-System<\/strong> (Art. 3 Nr. 1 KI-VO)<\/td>\n<td>maschinengestützt · autonom · anpassungsfähig · leitet aus Eingaben ab · beeinflusst Umgebungen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"d-e4-die-zahlen\">E.4 Die Zahlen<\/h3>\n<p>Stehen vollständig im <strong>Anhang A: Zahlen-Cheatsheet<\/strong>. Geh die Tabelle am Vorabend einmal von oben nach unten durch — mehr braucht es nicht.<\/p>\n<p>Die vier, die am häufigsten vertauscht werden:<\/p>\n<ul>\n<li><strong>25.05.2018<\/strong> (DSGVO anwendbar) ↔ <strong>25.05.2016<\/strong> (in Kraft)<\/li>\n<li><strong>72 Stunden<\/strong> ↔ 72 Tage<\/li>\n<li><strong>16 Jahre<\/strong> (Einwilligung Kinder) ↔ 18 Jahre<\/li>\n<li><strong>20 Personen<\/strong> (DSB-Pflicht) ↔ irgendeine andere Zahl<\/li>\n<\/ul>\n<h3 id=\"d-e5-was-du-nicht-lernen-musst\">E.5 Was du NICHT lernen musst<\/h3>\n<ul>\n<li>Die Artikelnummern der DSGVO bis Art. 39 — <strong>die kannst du nachschlagen.<\/strong><\/li>\n<li>Die Maßnahmenlisten der TOM-Folien (Schlüsselkarten, VPN, RBAC …) im Detail. Du musst nur zuordnen können, ob etwas Zutritt, Zugang oder Zugriff ist.<\/li>\n<li>Die Statistiken und Rechenzentrumszahlen aus den letzten Folien.<\/li>\n<li>Die philosophische Argumentation zu Searle und den „plappernden Papageien\". Verstehen ja, auswendig nein.<\/li>\n<\/ul>","text":"Der Datenschutzteil wird als True/False geprüft. Du musst also nichts formulieren können — du musst Aussagen wiedererkennen . Das ändert, was Lernen hier heißt. E.1 Das Wichtigste zuerst: Was nicht im Ausdruck steht Dein DSGVO-Auszug reicht nur bis Artikel 39 . Alles Folgende kannst du nicht nachschlagen und musst es im Kopf haben: Muss ins Gedächtnis Warum Art. 83 — die vier Bußgeldzahlen 10 Mio / 2 % für organisatorische Pflichten · 20 Mio / 4 % für Grundsätze und Betroffenenrechte § 26 BDSG — Beschäftigtendatenschutz steht im BDSG, nicht in der DSGVO § 38 BDSG — die 20-Personen-Grenze dito Die gesamte KI-VO eigenes Gesetz, nicht im Auszug Volkszählungsurteil 1983, BVerfG, Art. 1 + 2 GG Hintergrund, steht in keinem Gesetzestext E.2 Die zehn Sätze, die fast sicher drankommen Wenn du nur zehn Dinge mitnimmst, dann diese: Verbot mit Erlaubnisvorbehalt — Verarbeitung ist verboten, außer es greift ein Erlaubnisgrund. Nicht umgekehrt. Pseudonymisiert = weiterhin personenbezogen. Nur anonymisiert ist raus aus der DSGVO. Zutritt (Gebäude) → Zugang (System) → Zugriff (Daten). In dieser Reihenfolge. 72 Stunden an die Behörde — schon bei einfachem Risiko. An die Betroffenen nur bei hohem Risiko. 10 Mio / 2 % = Organisation (Verzeichnis, DSB, DSFA, AV-Vertrag). 20 Mio / 4 % = Grundsätze und Betroffenenrechte. Rechenschaftspflicht (Art. 5 II ) = Beweislastumkehr . Die Firma muss beweisen, dass sie es richtig macht. Bei Auftragsverarbeitung bleibt die Verantwortung beim Auftraggeber . Der Datenschutzbeauftragte berät und überwacht — er entscheidet nicht und haftet nicht. Die Einwilligung ist eine von sechs Rechtsgrundlagen, nicht die Regel. Regelbasierte Wenn-Dann-Software ist kein KI-System im Sinne der KI-VO. E.3 Definitionen, die du wiedererkennen musst Nicht formulieren — nur erkennen, ob eine Aussage sie richtig wiedergibt. Begriff Kern Personenbezogene Daten (Art. 4 Nr. 1) alle Informationen über eine identifizierte oder identifizierbare natürliche Person Vertraulichkeit nur für einen bestimmten Empfängerkreis bestimmt Integrität vollständig und unverändert Verfügbarkeit steht dem Berechtigten bei Bedarf zur Verfügung Datenpanne (Art. 33) unrechtmäßige Übermittlung oder Kenntniserlangung und Risiko für Rechte und Freiheiten KI-System (Art. 3 Nr. 1 KI-VO) maschinengestützt · autonom · anpassungsfähig · leitet aus Eingaben ab · beeinflusst Umgebungen E.4 Die Zahlen Stehen vollständig im Anhang A: Zahlen-Cheatsheet . Geh die Tabelle am Vorabend einmal von oben nach unten durch — mehr braucht es nicht. Die vier, die am häufigsten vertauscht werden: 25.05.2018 (DSGVO anwendbar) ↔ 25.05.2016 (in Kraft) 72 Stunden ↔ 72 Tage 16 Jahre (Einwilligung Kinder) ↔ 18 Jahre 20 Personen (DSB-Pflicht) ↔ irgendeine andere Zahl E.5 Was du NICHT lernen musst Die Artikelnummern der DSGVO bis Art. 39 — die kannst du nachschlagen. Die Maßnahmenlisten der TOM-Folien (Schlüsselkarten, VPN, RBAC …) im Detail. Du musst nur zuordnen können, ob etwas Zutritt, Zugang oder Zugriff ist. Die Statistiken und Rechenzentrumszahlen aus den letzten Folien. Die philosophische Argumentation zu Searle und den „plappernden Papageien\". Verstehen ja, auswendig nein.","words":471,"mins":2}],"quiz":[{"q":"Die DSGVO gilt seit dem 25.05.2018 verpflichtend in allen Mitgliedstaaten.","a":true,"note":"","topic":"1. Rechtsrahmen & Grundrecht","subject":"ds"},{"q":"Die DSGVO ist eine Richtlinie und musste in deutsches Recht umgesetzt werden.","a":false,"note":"sie ist eine Verordnung und gilt unmittelbar","topic":"1. Rechtsrahmen & Grundrecht","subject":"ds"},{"q":"Das Recht auf informationelle Selbstbestimmung wurde vom BGH entwickelt.","a":false,"note":"vom BVerfG (Volkszählungsurteil 1983)","topic":"1. Rechtsrahmen & Grundrecht","subject":"ds"},{"q":"Das Recht auf informationelle Selbstbestimmung leitet sich aus Art. 1 und 2 GG ab.","a":true,"note":"","topic":"1. Rechtsrahmen & Grundrecht","subject":"ds"},{"q":"Datenschutz und Datensicherheit sind dasselbe.","a":false,"note":"","topic":"1. Rechtsrahmen & Grundrecht","subject":"ds"},{"q":"Primäres Schutzziel des Datenschutzes ist die Datenminimierung.","a":false,"note":"primär ist der Persönlichkeitsschutz, Datenminimierung ist sekundär","topic":"1. Rechtsrahmen & Grundrecht","subject":"ds"},{"q":"Die DSGVO gilt nur für automatisierte Verarbeitung.","a":false,"note":"auch nichtautomatisiert, wenn in einem Dateisystem","topic":"2. Anwendungsbereich","subject":"ds"},{"q":"Ein US-Unternehmen ohne EU-Niederlassung unterliegt nie der DSGVO.","a":false,"note":"Marktortprinzip","topic":"2. Anwendungsbereich","subject":"ds"},{"q":"Ein kostenloses Angebot löst das Marktortprinzip nicht aus.","a":false,"note":"„auch kostenlos\"","topic":"2. Anwendungsbereich","subject":"ds"},{"q":"Ein privates Adressbuch auf dem eigenen Handy fällt unter die DSGVO.","a":false,"note":"Haushaltsausnahme","topic":"2. Anwendungsbereich","subject":"ds"},{"q":"Ein deutsches Unternehmen, das Daten in den USA verarbeitet, unterliegt der DSGVO.","a":true,"note":"Niederlassungsprinzip, unabhängig vom Verarbeitungsort","topic":"2. Anwendungsbereich","subject":"ds"},{"q":"Eine IP-Adresse ist ein personenbezogenes Datum.","a":true,"note":"","topic":"3. Begriffe: personenbezogene Daten","subject":"ds"},{"q":"Anonymisierte Daten sind personenbezogene Daten.","a":false,"note":"","topic":"3. Begriffe: personenbezogene Daten","subject":"ds"},{"q":"Pseudonymisierte Daten sind personenbezogene Daten.","a":true,"note":"siehe Kapitel 7.4!","topic":"3. Begriffe: personenbezogen te":"","topic":"5. Rechtmäßigkeit & Einwilligung","subject":"ds"},{"q":"Ohne Einwilligung darf man niemals pbD verarbeiten.","a":false,"note":"fünf andere Grundlagen","topic":"5. Rechtmäßigkeit & Einwilligung","subject":"ds"},{"q":"Eine Einwilligung muss eigenhändig unterschrieben werden.","a":false,"note":"","topic":"5. Rechtmäßigkeit & Einwilligung","subject":"ds"},{"q":"Der Verantwortliche muss die Einwilligung nachweisen können.","a":true,"note":"","topic":"5. Rechtmäßigkeit & Einwilligung","subject":"ds"},{"q":"Der Widerruf muss genauso einfach sein wie die Einwilligung.","a":true,"note":"","topic":"5. Rechtmäßigkeit & Einwilligung","subject":"ds"},{"q":"Kinder können ab 14 Jahren selbst einwilligen.","a":false,"note":"16","topic":"5. Rechtmäßigkeit & Einwilligung","subject":"ds"},{"q":"Eine Einwilligung kann jederzeit widerrufen werden.","a":true,"note":"","topic":"5. Rechtmäßigkeit & Einwilligung","subject":"ds"},{"q":"Der Widerruf macht die frühere Verarbeitung rückwirkend rechtswidrig.","a":false,"note":"wirkt nur für die Zukunft","topic":"5. Rechtmäßigkeit & Einwilligung","subject":"ds"},{"q":"Die Erfüllung eines Vertrags kann eine Rechtsgrundlage sein.","a":true,"note":"Art. 6 I b","topic":"5. Rechtmäßigkeit & Einwilligung","subject":"ds"},{"q":"Art. 13 gilt, wenn die Daten bei der betroffenen Person erhoben werden.","a":true,"note":"","topic":"6. Informationspflichten & Betroffenenrechte","subject":"ds"},{"q":"Art. 14 gilt bei Direkterhebung.","a":false,"note":"bei Erhebung woanders","topic":"6. Informationspflichten & Betroffenenrechte","subject":"ds"},{"q":"Das Recht auf Löschung gilt uneingeschränkt.","a":false,"note":"gesetzliche Aufbewahrungspflichten gehen vor","topic":"6. Informationspflichten & Betroffenenrechte","subject":"ds"},{"q":"Das Recht auf Datenübertragbarkeit gilt für jede Verarbeitung.","a":false,"note":"nur bei Einwilligung/Vertrag und automatisiert","topic":"6. Informationspflichten & Betroffenenrechte","subject":"ds"},{"q":"Die Auskunft nach Art. 15 umfasst auch die Speicherdauer.","a":true,"note":"","topic":"6. Informationspflichten & Betroffenenrechte","subject":"ds"},{"q":"Gegen Direktwerbung kann man ohne Begründung widersprechen.","a":true,"note":"","topic":"6. Informationspflichten & Betroffenenrechte","subject":"ds"},{"q":"Das Widerspruchsrecht richtet sich gegen eine erteilte Einwilligung.","a":false,"note":"das wäre der Widerruf","topic":"6. Informationspflichten & Betroffenenrechte","subject":"ds"},{"q":"Pseudonymisierte Daten fallen nicht mehr unter die DSGVO.","a":false,"note":"","topic":"7. Datensicherheit & TOMs","subject":"ds"},{"q":"Anonymisierte Daten fallen nicht mehr unter die DSGVO.","a":true,"note":"","topic":"7. Datensicherheit & TOMs","subject":"ds"},{"q":"Zugangskontrolle regelt, wer das Gebäude betreten darf.","a":false,"note":"das ist Zutritt","topic":"7. Datensicherheit & TOMs","subject":"ds"},{"q":"Zugriffskontrolle regelt Berechtigungen auf Datenebene.","a":true,"note":"","topic":"7. Datensicherheit & TOMs","subject":"ds"},{"q":"Art. 32 nennt Vertraulichkeit, Integrität und Verfügbarkeit.","a":true,"note":"und zusätzlich Belastbarkeit","topic":"7. Datensicherheit & TOMs","subject":"ds"},{"q":"„Safety\" bezeichnet den Schutz vor beabsichtigten Angriffen.","a":false,"note":"das ist security","topic":"7. Datensicherheit & TOMs","subject":"ds"},{"q":"Verschlüsselung ist eine in Art. 32 genannte Maßnahme.","a":true,"note":"","topic":"7. Datensicherheit & TOMs","subject":"ds"},{"q":"Die Wirksamkeit der TOMs muss regelmäßig überprüft werden.","a":true,"note":"","topic":"7. Datensicherheit & TOMs","subject":"ds"},{"q":"Der Höchstrahmen für Bußgelder liegt bei 20 Mio € oder 4 % des Vorjahresumsatzes.","a":true,"note":"","topic":"9. Haftung & Geldbußen","subject":"ds"},{"q":"Verstöße gegen die Grundsätze werden mit bis zu 10 Mio € geahndet.","a":false,"note":"Grundsätze = 20 Mio / 4 %","topic":"9. Haftung & Geldbußen","subject":"ds"},{"q":"Wer kein Verarbeitungsverzeichnis führt, riskiert bis zu 10 Mio € / 2 %.","a":true,"note":"","topic":"9. Haftung & Geldbußen","subject":"ds"},{"q":"Die Bußgeldobergrenze ist absolut auf 20 Mio € gedeckelt.","a":false,"note":"je nachdem, welcher Betrag höher ist","topic":"9. Haftung & Geldbußen","subject":"ds"},{"q":"Jedes einzelne Vorkommnis kann geahndet werden.","a":true,"note":"","topic":"9. Haftung & Geldbußen","subject":"ds"},{"q":"Privacy by Default bedeutet, dass die Voreinstellungen datenschutzfreundlich sein müssen.","a":true,"note":"","topic":"9. Haftung & Geldbußen","subject":"ds"},{"q":"Der Prozentsatz bemisst sich am Gewinn.","a":false,"note":"am Umsatz","topic":"9. Haftung & Geldbußen","subject":"ds"},{"q":"Ein DSB muss ab 20 ständig mit automatisierter Verarbeitung betrauten Personen benannt werden.","a":true,"note":"","topic":"10. Der Datenschutzbeauftragte","subject":"ds"},{"q":"Jedes Unternehmen mit mehr als 20 Mitarbeitern braucht einen DSB.","a":false,"note":"es kommt auf die mit der Verarbeitung betrauten Personen an","topic":"10. Der Datenschutzbeauftragte","subject":"ds"},{"q":"Behörden müssen immer einen DSB benennen.","a":true,"note":"","topic":"10. Der Datenschutzbeauftragte","subject":"ds"},{"q":"Der DSB haftet persönlich für Datenschutzverstöße des Unternehmens.","a":false,"note":"","topic":"10. Der Datenschutzbeauftragte","subject":"ds"},{"q":"Der DSB muss ein interner Mitarbeiter sein.","a":false,"note":"auch extern möglich","topic":"10. Der Datenschutzbeauftragte","subject":"ds"},{"q":"Der DSB ist Anlaufstelle für die Aufsichtsbehörde.","a":true,"note":"","topic":"10. Der Datenschutzbeauftragte","subject":"ds"},{"q":"Der DSB entscheidet über Zwecke und Mittel der Verarbeitung.","a":false,"note":"das ist der Verantwortliche","topic":"10. Der Datenschutzbeauftragte","subject":"ds"},{"q":"Bei Auftragsverarbeitung geht die Verantwortung auf den Dienstleister über.","a":false,"note":"","topic":"11. Auftragsverarbeitung","subject":"ds"},{"q":"Für die Auftragsverarbeitung ist ein Vertrag erforderlich.","a":true,"note":"","topic":"11. Auftragsverarbeitung","subject":"ds"},{"q":"Der Auftragsverarbeiter handelt auf Weisung des Verantwortlichen.","a":true,"note":"","topic":"11. Auftragsverarbeitung","subject":"ds"},{"q":"Cloud-Hosting kann eine Auftragsverarbeitung sein.","a":true,"note":"","topic":"11. Auftragsverarbeitung","subject":"ds"},{"q":"Der Auftragsverarbeiter darf die Daten für eigene Zwecke nutzen.","a":false,"note":"","topic":"11. Auftragsverarbeitung","subject":"ds"},{"q":"Eine DSFA ist für jede Verarbeitung durchzuführen.","a":false,"note":"nur bei voraussichtlich hohem Risiko","topic":"12. Datenschutz-Folgenabschätzung","subject":"ds"},{"q":"Die DSFA erfolgt nach dem Start der Verarbeitung.","a":false,"note":"vorher","topic":"12. Datenschutz-Folgenabschätzung","subject":"ds"},{"q":"Der DSB berät bei der DSFA.","a":true,"note":"","topic":"12. Datenschutz-Folgenabschätzung","subject":"ds"},{"q":"Die Verwendung neuer Technologien ist ein Kriterium der Risikoanalyse.","a":true,"note":"","topic":"12. Datenschutz-Folgenabschätzung","subject":"ds"},{"q":"Eine Datenpanne ist der Aufsichtsbehörde binnen 72 Stunden zu melden.","a":true,"note":"","topic":"13. Datenschutzverletzung / Datenpanne","subject":"ds"},{"q":"Eine Datenpanne ist der Aufsichtsbehörde binnen 72 Tagen zu melden.","a":false,"note":"","topic":"13. Datenschutzverletzung / Datenpanne","subject":"ds"},{"q":"Betroffene sind bei jeder Datenpanne zu informieren.","a":false,"note":"nur bei hohem Risiko","topic":"13. Datenschutzverletzung / Datenpanne","subject":"ds"},{"q":"Die Meldepflicht gilt nur für besondere Kategorien von Daten.","a":false,"note":"unabhängig von der Sensibilität","topic":"13. Datenschutzverletzung / Datenpanne","subject":"ds"},{"q":"Bei Erpressung ist die erste Maßnahme die Zahlung des Lösegelds.","a":false,"note":"Strafanzeige","topic":"13. Datenschutzverletzung / Datenpanne","subject":"ds"},{"q":"Ein verlorener USB-Stick mit Kundendaten kann eine meldepflichtige Datenpanne sein.","a":true,"note":"","topic":"13. Datenschutzverletzung / Datenpanne","subject":"ds"},{"q":"Bewerber sind Beschäftigte im Sinne des § 26 BDSG.","a":true,"note":"","topic":"14. Beschäftigtendatenschutz","subject":"ds"},{"q":"Ausgeschiedene Mitarbeiter fallen nicht mehr unter § 26 BDSG.","a":false,"note":"","topic":"14. Beschäftigtendatenschutz","subject":"ds"},{"q":"Verdachtslose Überwachung zur Straftataufdeckung ist zulässig.","a":false,"note":"es braucht dokumentierte tatsächliche Anhaltspunkte","topic":"14. Beschäftigtendatenschutz","subject":"ds"},{"q":"Eine Einwilligung im Beschäftigungsverhältnis bedarf in der Regel der Schriftform.","a":true,"note":"","topic":"14. Beschäftigtendatenschutz","subject":"ds"},{"q":"Beschäftigtendaten dürfen für die Beendigung des Arbeitsverhältnisses verarbeitet werden.","a":true,"note":"","topic":"14. Beschäftigtendatenschutz","subject":"ds"},{"q":"Die Abhängigkeit des Beschäftigten ist bei der Freiwilligkeit zu berücksichtigen.","a":true,"note":"","topic":"14. Beschäftigtendatenschutz","subject":"ds"},{"q":"Die KI-VO trat am 01.08.2024 in Kraft.","a":true,"note":"","topic":"16. Künstliche Intelligenz & KI-VO","subject":"ds"},{"q":"Regelbasierte Software ist ein KI-System im Sinne der KI-VO.","a":false,"note":"","topic":"16. Künstliche Intelligenz & KI-VO","subject":"ds"},{"q":"Die KI-VO verfolgt einen risikobasierten Ansatz.","a":true,"note":"","topic":"16. Künstliche Intelligenz & KI-VO","subject":"ds"},{"q":"Alle KI-Systeme unterliegen denselben Pflichten.","a":false,"note":"","topic":"16. Künstliche Intelligenz & KI-VO","subject":"ds"},{"q":"Für risikoarme KI-Systeme gelten nur freiwillige Anforderungen.","a":true,"note":"","topic":"16. Künstliche Intelligenz & KI-VO","subject":"ds"},{"q":"Deepfakes und Chatbots unterliegen Transparenzpflichten.","a":true,"note":"Art. 50","topic":"16. Künstliche Intelligenz & KI-VO","subject":"ds"},{"q":"Prompts, die man in einen Chatbot eingibt, können pbD sein.","a":true,"note":"","topic":"16. Künstliche Intelligenz & KI-VO","subject":"ds"},{"q":"Nach der Checkliste des Dozenten dürfen KI-Ergebnisse als Letztentscheidung dienen.","a":false,"note":"„keine automatisierte Letztentscheidung\"","topic":"16. Künstliche Intelligenz & KI-VO","subject":"ds"},{"q":"Art. 4 KI-VO verpflichtet Anbieter und Betreiber zur Sicherstellung von KI-Kompetenz.","a":true,"note":"","topic":"16. Künstliche Intelligenz & KI-VO","subject":"ds"},{"q":"LLMs verstehen die Bedeutung der Wörter, die sie erzeugen.","a":false,"note":"laut Folie „ohne Semantik\"","topic":"16. Künstliche Intelligenz & KI-VO","subject":"ds"},{"q":"Die DSGVO ist seit dem 25.05.2018 verpflichtend anzuwenden.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Die DSGVO musste durch ein deutsches Gesetz erst umgesetzt werden.","a":false,"note":"Verordnung, gilt unmittelbar","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Das Recht auf informationelle Selbstbestimmung stammt aus dem Volkszählungsurteil von 1983.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Das Volkszählungsurteil erging durch den Bundesgerichtshof.","a":false,"note":"BVerfG","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Die DSGVO schützt auch juristische Personen.","a":false,"note":"nur natürliche","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Ein US-Unternehmen ohne EU-Sitz kann der DSGVO unterliegen.","a":true,"note":"Marktortprinzip","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Das Marktortprinzip greift nur bei entgeltlichen Angeboten.","a":false,"note":"„auch kostenlos\"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Das bloße Beobachten des Verhaltens von EU-Bürgern löst die DSGVO aus.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Rein private Adressbücher fallen unter die DSGVO.","a":false,"note":"Haushaltsausnahme","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Papierakten
