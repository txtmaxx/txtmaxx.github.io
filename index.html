\/td>\n<td>jeder<\/td>\n<td>nur Verbraucher<\/td>\n<\/tr>\n<tr>\n<td>Schadensersatz<\/td>\n<td>§ 122 möglich<\/td>\n<td>keiner<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Der Ein-Satz-Merksatz:<\/strong><\/p>\n<blockquote>\n<p><strong>Anfechtung braucht einen Grund. Widerruf braucht keinen — nur die 14 Tage.<\/strong><\/p>\n<\/blockquote>\n<h3 id=\"r-123-wann-gibt-es-ein-widerrufsrecht-312g\">12.3 Wann gibt es ein Widerrufsrecht? (§ 312g)<\/h3>\n<p>Zwei Fallgruppen, beide setzen <strong>Verbraucher (§ 13) + Unternehmer (§ 14)<\/strong> voraus:<\/p>\n<ul>\n<li><strong>§ 312b — außerhalb von Geschäftsräumen<\/strong> („Haustürgeschäft\"): an der Haustür, auf der Straße, auf einer Messe, auf einer Kaffeefahrt — <strong>und laut § 312b I Nr. 3 auch der Telefonanruf<\/strong>.<\/li>\n<li><strong>§ 312c — Fernabsatzvertrag<\/strong>: ausschließlich über Fernkommunikationsmittel — Online-Shop, Telefon, Katalogversand, E-Mail.<\/li>\n<\/ul>\n<p><strong>Warum gibt es das?<\/strong> Weil du in diesen Situationen <strong>überrumpelt<\/strong> wirst oder die Ware <strong>nicht prüfen<\/strong> kannst. Im Laden kannst du das Produkt anfassen und in Ruhe gehen — online nicht.<\/p>\n<p><strong>Die Begriffe:<\/strong>\n- <strong>§ 13 Verbraucher:<\/strong> natürliche Person, die zu <strong>privaten<\/strong> Zwecken handelt.\n- <strong>§ 14 Unternehmer:<\/strong> handelt in Ausübung <strong>gewerblicher oder selbständiger<\/strong> Tätigkeit.<\/p>\n<p>Kein Widerrufsrecht also bei: Privat an Privat (Kleinanzeigen!) · Unternehmer an Unternehmer · Kauf im <strong>Ladengeschäft<\/strong>.<\/p>\n<blockquote>\n<p><strong>Klassische Falle:<\/strong> Im Laden gibt es <strong>kein gesetzliches Widerrufsrecht<\/strong>. Wenn ein Media Markt Umtausch gewährt, ist das reine <strong>Kulanz<\/strong> bzw. ein <strong>vertraglich vereinbartes<\/strong> Widerrufsrecht — kein Gesetz.<\/p>\n<\/blockquote>\n<h3 id=\"r-124-frist-und-ausubung-355\">12.4 Frist und Ausübung — § 355<\/h3>\n<ul>\n<li><strong>14 Tage<\/strong> (§ 355 II). Bei Warenkauf ab Erhalt der Ware.<\/li>\n<li><strong>Keine Begründung<\/strong> nötig.<\/li>\n<li>Wurde <strong>nicht ordnungsgemäß belehrt<\/strong> → die Frist läuft nicht an (kann sich auf bis zu 12 Monate + 14 Tage verlängern).<\/li>\n<li>Rechtsfolge: Beide Seiten geben das Empfangene zurück.<\/li>\n<\/ul>\n<h3 id=\"r-beispiel-aus-deinen-ubungsfallen\">Beispiel aus deinen Übungsfällen<\/h3>\n<p><strong>Fall 08 a) — das eBike per Werbeanruf.<\/strong> Das ist die Musterlösung, die du dir merken solltest, weil sie den <strong>kompletten Aufbau<\/strong> zeigt. Original (gekürzt):<\/p>\n<blockquote>\n<p>„Anne verlangt 2.999 EUR von der Fa. Recard zurück. Anspruchsgrundlage hierfür könnte <strong>§ 812 I, 1. Fall<\/strong> sein (<strong>Alternativ wäre auch die Anspruchsgrundlage § 355 III als Spezialvorschrift möglich<\/strong>; da § 812 I aber auch in anderen Fällen greift, wird hier § 812 geprüft). […]\nDa der Widerruf einer WE nach <strong>§ 130 I 2<\/strong> voraussetzt, dass dieser gleichzeitig oder vor der WE … zugeht und dies vorliegend nicht der Fall war, müsste Anneliese ein <strong>besonderes Widerrufsrecht<\/strong> zustehen.\nEin solches könnte sich aus <strong>§ 355 I<\/strong> ergeben … Dieses könnte sich aus <strong>§ 312g I<\/strong> ergeben. Dann müsste es sich … um einen Vertrag zwischen einem <strong>Verbraucher und einem Unternehmer<\/strong> handeln, der <strong>außerhalb von Geschäftsräumen<\/strong> geschlossen wurde, <strong>§ 312b<\/strong>. Anneliese ist als Privatperson <strong>Verbraucherin nach § 13<\/strong> und die Recard GmbH handelt nach <strong>§ 14<\/strong> gewerblich … Der Vertrag wurde auch <strong>ausschließlich fernmündlich<\/strong>, also außerhalb der Geschäftsräume der Recard GmbH <strong>nach § 312b I Nr. 3<\/strong> geschlossen. Mithin liegen die Voraussetzungen des § 312g I vor, so dass Anneliese ein Widerrufsrecht nach § 355 zusteht. Dies muss sie nach <strong>§ 355 I, II fristgerecht, innerhalb von 14 Tagen<\/strong> ausüben …\nFolglich entfällt durch den statthaften Widerruf die Bindung an ihre zum Kaufvertrag führende WE, so dass der Vertrag wegfällt und <strong>keine Rechtsgrundlage für die Zahlung mehr darstellt<\/strong>. Mithin hat Anne einen Anspruch auf Rückgewähr der geleisteten 2.999 EUR.\"<\/p>\n<\/blockquote>\n<p><strong>Drei Dinge, die du daraus mitnimmst:<\/strong>\n1. Die <strong>Anspruchsgrundlage ist § 812<\/strong> — nicht § 355! § 355 ist nur die Vorfrage („war der Rechtsgrund weg?\"). Genau so baut der Dozent es auf.\n2. Er prüft <strong>erst § 130 I 2<\/strong> (geht nicht, weil zu spät), <strong>dann § 355<\/strong>. Diese Reihenfolge ist die Prüfungsreihenfolge.\n3. Er hakt § 13 und § 14 <strong>einzeln<\/strong> ab. Mach das auch — das sind sichere Punkte.<\/p>\n<p><strong>Und beachte das Gegenargument im Fall:<\/strong> Jimmy sagt „pacta sunt servanda, Verträge müssen gehalten werden, es war alles schriftlich bestätigt\". Das ist <strong>irrelevant<\/strong> — das Widerrufsrecht ist zwingendes Verbraucherrecht und kann nicht durch eine Bestätigung ausgehebelt werden.<\/p>","text":"Worum es hier geht — in einfachen Worten Das ist der 14-Tage-Rückgabe-Klassiker vom Onlinekauf. Der entscheidende Unterschied zur Anfechtung: Hier brauchst du überhaupt keinen Grund . Du sagst einfach „nein doch nicht\" und bist raus. Dafür gilt das Widerrufsrecht nur für Verbraucher und nur bei bestimmten Vertragsarten. Folie 26 (Original): „● Vernichtung der WE durch Widerruf – Durch Widerruf gleichzeitig oder vor dem Wirksamwerden der WE, § 130 I 2 – Durch gesetzlich eingeräumtes Widerrufsrecht nach § 355 bei Fernabsatz- und Haustürgeschäften gemäß § 312g (Online, Telefon, Versand, Geschäfte auf öffentlichen Plätzen/Messen, §§ 312b, 312c ), Frist 14 Tage nach § 355 II – Durch rechtsgeschäftlich vereinbartes Widerrufsrecht (konstitutive Einräumung oder Verlängerung)\" 12.1 Zwei ganz verschiedene Dinge, die beide „Widerruf\" heißen Das verwechseln alle. Halte sie streng auseinander: § 130 I S. 2 § 355 (Verbraucherwiderruf) Was Widerruf der WE , bevor sie wirksam wird Widerruf des geschlossenen Vertrags Wann nur vor oder gleichzeitig mit dem Zugang 14 Tage nach Vertragsschluss/Warenerhalt Wer jeder nur Verbraucher (§ 13) gegenüber Unternehmer (§ 14) Wo immer nur bei bestimmten Vertragstypen (§ 312g) Grund nötig? nein nein 12.2 ★ Widerruf vs. Anfechtung — die Abgrenzung Sehr wahrscheinliche Kurzfrage. Anfechtung Widerruf (§ 355) Grund nötig? JA — § 119, 120 oder 123 NEIN — reine Willkür, „ich hab's mir anders überlegt\" Frist unverzüglich (§ 121) / 1 Jahr (§ 124) 14 Tage (§ 355 II) Wirkung ex tunc (§ 142) — von Anfang an nichtig Bindung entfällt, Rückgewähr § 355 III / § 357 Wer jeder nur Verbraucher Schadensersatz § 122 möglich keiner Der Ein-Satz-Merksatz: Anfechtung braucht einen Grund. Widerruf braucht keinen — nur die 14 Tage. 12.3 Wann gibt es ein Widerrufsrecht? (§ 312g) Zwei Fallgruppen, beide setzen Verbraucher (§ 13) + Unternehmer (§ 14) voraus: § 312b — außerhalb von Geschäftsräumen („Haustürgeschäft\"): an der Haustür, auf der Straße, auf einer Messe, auf einer Kaffeefahrt — und laut § 312b I Nr. 3 auch der Telefonanruf . § 312c — Fernabsatzvertrag : ausschließlich über Fernkommunikationsmittel — Online-Shop, Telefon, Katalogversand, E-Mail. Warum gibt es das? Weil du in diesen Situationen überrumpelt wirst oder die Ware nicht prüfen kannst. Im Laden kannst du das Produkt anfassen und in Ruhe gehen — online nicht. Die Begriffe: - § 13 Verbraucher: natürliche Person, die zu privaten Zwecken handelt. - § 14 Unternehmer: handelt in Ausübung gewerblicher oder selbständiger Tätigkeit. Kein Widerrufsrecht also bei: Privat an Privat (Kleinanzeigen!) · Unternehmer an Unternehmer · Kauf im Ladengeschäft . Klassische Falle: Im Laden gibt es kein gesetzliches Widerrufsrecht . Wenn ein Media Markt Umtausch gewährt, ist das reine Kulanz bzw. ein vertraglich vereinbartes Widerrufsrecht — kein Gesetz. 12.4 Frist und Ausübung — § 355 14 Tage (§ 355 II). Bei Warenkauf ab Erhalt der Ware. Keine Begründung nötig. Wurde nicht ordnungsgemäß belehrt → die Frist läuft nicht an (kann sich auf bis zu 12 Monate + 14 Tage verlängern). Rechtsfolge: Beide Seiten geben das Empfangene zurück. Beispiel aus deinen Übungsfällen Fall 08 a) — das eBike per Werbeanruf. Das ist die Musterlösung, die du dir merken solltest, weil sie den kompletten Aufbau zeigt. Original (gekürzt): „Anne verlangt 2.999 EUR von der Fa. Recard zurück. Anspruchsgrundlage hierfür könnte § 812 I, 1. Fall sein ( Alternativ wäre auch die Anspruchsgrundlage § 355 III als Spezialvorschrift möglich ; da § 812 I aber auch in anderen Fällen greift, wird hier § 812 geprüft). […] Da der Widerruf einer WE nach § 130 I 2 voraussetzt, dass dieser gleichzeitig oder vor der WE … zugeht und dies vorliegend nicht der Fall war, müsste Anneliese ein besonderes Widerrufsrecht zustehen. Ein solches könnte sich aus § 355 I ergeben … Dieses könnte sich aus § 312g I ergeben. Dann müsste es sich … um einen Vertrag zwischen einem Verbraucher und einem Unternehmer handeln, der außerhalb von Geschäftsräumen geschlossen wurde, § 312b . Anneliese ist als Privatperson Verbraucherin nach § 13 und die Recard GmbH handelt nach § 14 gewerblich … Der Vertrag wurde auch ausschließlich fernmündlich , also außerhalb der Geschäftsräume der Recard GmbH nach § 312b I Nr. 3 geschlossen. Mithin liegen die Voraussetzungen des § 312g I vor, so dass Anneliese ein Widerrufsrecht nach § 355 zusteht. Dies muss sie nach § 355 I, II fristgerecht, innerhalb von 14 Tagen ausüben … Folglich entfällt durch den statthaften Widerruf die Bindung an ihre zum Kaufvertrag führende WE, so dass der Vertrag wegfällt und keine Rechtsgrundlage für die Zahlung mehr darstellt . Mithin hat Anne einen Anspruch auf Rückgewähr der geleisteten 2.999 EUR.\" Drei Dinge, die du daraus mitnimmst: 1. Die Anspruchsgrundlage ist § 812 — nicht § 355! § 355 ist nur die Vorfrage („war der Rechtsgrund weg?\"). Genau so baut der Dozent es auf. 2. Er prüft erst § 130 I 2 (geht nicht, weil zu spät), dann § 355 . Diese Reihenfolge ist die Prüfungsreihenfolge. 3. Er hakt § 13 und § 14 einzeln ab. Mach das auch — das sind sichere Punkte. Und beachte das Gegenargument im Fall: Jimmy sagt „pacta sunt servanda, Verträge müssen gehalten werden, es war alles schriftlich bestätigt\". Das ist irrelevant — das Widerrufsrecht ist zwingendes Verbraucherrecht und kann nicht durch eine Bestätigung ausgehebelt werden.","words":857,"mins":5},{"id":"r-13-rücktritt","subject":"recht","num":"13","title":"13. Rücktritt","short":"Rücktritt","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nDer dritte Weg aus einem Vertrag heraus — und der mit dem anderen Auslöser.<\/p>\n<p>Hier war nämlich alles in Ordnung: kein Irrtum, keine Reue. Sondern: <strong>Der andere hat nicht geliefert.<\/strong><\/p>\n<p>Der Dozent hat dazu eine eigene Fallsammlung gemacht und das Prüfungsschema per Hand aufs Flipchart gemalt. Das spricht dafür, dass er es wichtig findet.<\/p>\n<p>📌 <strong>Korrektur zu deiner Themenliste:<\/strong> Du hattest Rücktritt als „nur eine Überschrift, inhaltlich nicht ausgeführt\" eingestuft. Das stimmt nicht. <strong>Folie 28 führt ihn vollständig aus<\/strong>, und es gibt eine <strong>eigene Fallsammlung (09 Fälle Rücktritt)<\/strong> mit zwei Fällen und <strong>zwei abfotografierten handschriftlichen Flipcharts des Dozenten<\/strong>, auf denen er das Prüfungsschema selbst aufgemalt hat. Behandle das Thema als vollwertig.<\/p>\n<\/blockquote>\n<p><strong>Folie 28 (Original, vollständig):<\/strong><\/p>\n<blockquote>\n<p>„● <strong>Auflösung/Umgestaltung des Vertragsverhältnisses durch Rücktritt, § 346<\/strong>\n– <strong>Vertraglich:<\/strong> wenn Rücktrittsmöglichkeit <strong>vereinbart oder vorbehalten<\/strong>, z.B. bei Preisanpassung (bei Dauerschuldverhältnissen ggfs. Sonderkündigungsrecht), Rücktritt kann aber auch <strong>vertraglich ausgeschlossen<\/strong> werden.\n– <strong>Gesetzlich:<\/strong> wenn die Leistung <strong>nach Fristsetzung nicht oder nicht ordnungsgemäß erbracht<\/strong> wurde, <strong>§ 323<\/strong>\n– <strong>Gesetzlich:<\/strong> wenn die Vertragserfüllung z. B. nach § 275 <strong>unmöglich<\/strong> (geworden) ist, <strong>§ 326 V<\/strong> oder wenn eine <strong>Nebenpflicht verletzt<\/strong> wurde, <strong>§ 324<\/strong>\n– <strong>Rechtsfolge ist die Umwandlung des ursprünglichen Vertrages in ein Rückgewährschuldverhältnis, § 346<\/strong>; ggfs. kann zusätzlich <strong>Schadensersatz<\/strong> verlangt werden, <strong>§§ 325, 280<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"r-131-der-grundgedanke\">13.1 Der Grundgedanke<\/h3>\n<p>Der Rücktritt ist das Werkzeug für den Fall: <strong>Der Vertrag war völlig in Ordnung — aber der andere hat nicht geliefert.<\/strong><\/p>\n<p>Kein Willensmangel (das wäre Anfechtung), keine Reue (das wäre Widerruf), sondern eine <strong>Leistungsstörung<\/strong>.<\/p>\n<h3 id=\"r-132-die-groe-abgrenzung-anfechtung-widerruf-rucktritt\">13.2 ★ Die große Abgrenzung: Anfechtung – Widerruf – Rücktritt<\/h3>\n<p><strong>Das ist mit hoher Wahrscheinlichkeit eine Kurzfrage.<\/strong> Lern diese Tabelle.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Anfechtung<\/strong> §§ 119 ff.<\/th>\n<th><strong>Widerruf<\/strong> § 355<\/th>\n<th><strong>Rücktritt<\/strong> § 346<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Warum?<\/strong><\/td>\n<td>Willensmangel — die WE war fehlerhaft<\/td>\n<td>Verbraucherschutz — Überrumpelung<\/td>\n<td><strong>Leistungsstörung<\/strong> — der andere hat nicht geliefert<\/td>\n<\/tr>\n<tr>\n<td><strong>Grund nötig?<\/strong><\/td>\n<td>ja (§§ 119, 120, 123)<\/td>\n<td><strong>nein<\/strong><\/td>\n<td>ja (Vertrag oder Gesetz: §§ 323, 324, 326 V)<\/td>\n<\/tr>\n<tr>\n<td><strong>Frist<\/strong><\/td>\n<td>unverzüglich / 1 Jahr<\/td>\n<td>14 Tage<\/td>\n<td>keine feste Frist (aber Nachfrist nötig!)<\/td>\n<\/tr>\n<tr>\n<td><strong>Wirkung<\/strong><\/td>\n<td><strong>ex tunc<\/strong> — von Anfang an nichtig<\/td>\n<td>Bindung entfällt<\/td>\n<td><strong>ex nunc<\/strong> — Vertrag war bis dahin <strong>wirksam<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Folge<\/strong><\/td>\n<td>§ 142 Nichtigkeit + § 812 Rückabwicklung<\/td>\n<td>Rückgewähr §§ 355 III, 357<\/td>\n<td><strong>Rückgewährschuldverhältnis § 346<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Wer?<\/strong><\/td>\n<td>jeder<\/td>\n<td>nur Verbraucher<\/td>\n<td>jede Vertragspartei<\/td>\n<\/tr>\n<tr>\n<td><strong>Schadensersatz<\/strong><\/td>\n<td>§ 122 (negatives Interesse)<\/td>\n<td>–<\/td>\n<td>§§ 325, 280 (<strong>positives<\/strong> Interesse) daneben möglich<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Der Kernsatz für die Klausur:<\/strong><\/p>\n<blockquote>\n<p><strong>Anfechtung wirkt ex tunc — der Vertrag gilt als nie geschlossen. Rücktritt wirkt ex nunc — der Vertrag war bis zum Rücktritt wirksam und wandelt sich dann in ein Rückgewährschuldverhältnis (§ 346) um.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Warum ist der Unterschied wichtig?<\/strong> Weil bei Anfechtung der Rechtsgrund rückwirkend entfällt → Rückabwicklung läuft über <strong>§ 812<\/strong>. Beim Rücktritt bleibt der Vertrag bestehen und wird <strong>umgewandelt<\/strong> → Rückabwicklung läuft über <strong>§ 346<\/strong>, aus dem Vertrag selbst.<\/p>\n<h3 id=\"r-133-rucktrittsgrunde\">13.3 Rücktrittsgründe<\/h3>\n<table>\n<thead>\n<tr>\n<th>Grund<\/th>\n<th>§<\/th>\n<th>Was<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Vertraglich<\/strong><\/td>\n<td>–<\/td>\n<td>vereinbart oder vorbehalten; kann auch <strong>ausgeschlossen<\/strong> werden<\/td>\n<\/tr>\n<tr>\n<td><strong>Nicht/schlecht geleistet<\/strong><\/td>\n<td><strong>§ 323<\/strong><\/td>\n<td>fällige Leistung + nicht oder nicht vertragsgemäß erfüllt + <strong>angemessene Nachfrist<\/strong> erfolglos<\/td>\n<\/tr>\n<tr>\n<td><strong>Nebenpflichtverletzung<\/strong><\/td>\n<td><strong>§ 324<\/strong><\/td>\n<td>Verletzung einer Pflicht nach § 241 II — <strong>keine Nachfrist nötig<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Unmöglichkeit<\/strong><\/td>\n<td><strong>§ 326 V<\/strong><\/td>\n<td>Leistung nach § 275 unmöglich — <strong>keine Nachfrist nötig<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Die Nachfrist ist der Knackpunkt bei § 323.<\/strong> Du kannst nicht einfach zurücktreten, weil einmal etwas zu spät kam — du musst dem anderen erst eine <strong>angemessene Frist zur Nacherfüllung<\/strong> setzen.<\/p>\n<p><strong>§ 323 II<\/strong> nennt Fälle, in denen die Nachfrist <strong>entbehrlich<\/strong> ist: ernsthafte und endgültige Leistungsverweigerung (Nr. 1), Fixgeschäft (Nr. 2), besondere Umstände / Interessenabwägung (Nr. 3).<\/p>\n<h3 id=\"r-134-das-original-prufungsschema-des-dozenten\">13.4 Das Original-Prüfungsschema des Dozenten<\/h3>\n<p>Das hat er im Fall 09a <strong>handschriftlich aufs Flipchart<\/strong> geschrieben. Übernimm es genau so:<\/p>\n<pre><code>Anspruch Nancy → Jimmy: Zahlung d. Werklohns, § 631\n\n* Vertrag geschlossen\n     ⟹ Anspruch entstanden\n* Anspruch erloschen, § 346?  Rücktritt\n     * RT-Erklärung, § 349                          (+)\n     * RT-Recht aus Gesetz\n          - § 323\n          - fällige Leistung, § 271                 (+)\n          - nicht (vertragsmäßig) erfüllt           (+)\n          * angemessene Nachfrist                   (+)\n     ⟹ RT-Grund § 323                               (+)\n<\/code><\/pre>\n<p><strong>Beachte:<\/strong> Der Rücktritt wird <strong>nicht<\/strong> als eigener Obersatz geprüft, sondern als <strong>Einwendung<\/strong> auf der zweiten Stufe des Anspruchsaufbaus („Anspruch erloschen?\") — genau wie in Kapitel 3.4 beschrieben. Das ist der methodisch saubere Weg.<\/p>\n<p><strong>Und die Rücktrittserklärung braucht § 349<\/strong> — die vergisst fast jeder. Der Rücktritt geschieht durch <strong>Erklärung gegenüber dem anderen Teil<\/strong>.<\/p>\n<h3 id=\"r-135-rechtsfolge-346\">13.5 Rechtsfolge — § 346<\/h3>\n<blockquote>\n<p>Der Vertrag wandelt sich in ein <strong>Rückgewährschuldverhältnis<\/strong> um: Beide Seiten geben die empfangenen Leistungen zurück, gezogene Nutzungen werden herausgegeben.<\/p>\n<\/blockquote>\n<p><strong>Zusätzlich Schadensersatz möglich, §§ 325, 280.<\/strong> § 325 sagt ausdrücklich: Der Rücktritt schließt den Schadensersatz <strong>nicht<\/strong> aus. Das ist wichtig, weil nach dem Rücktritt eigentlich kein Schuldverhältnis mehr besteht — § 325 hält den Anspruch trotzdem am Leben.<\/p>\n<h3 id=\"r-beispiele-aus-deinen-ubungsfallen-fall-09\">Beispiele aus deinen Übungsfällen (Fall 09)<\/h3>\n<p><strong>Fall 09 a) — die Inspektion vor dem Urlaub.<\/strong> Jimmy bringt das Auto Montag in die Werkstatt, setzt am Mittwoch eine Frist bis zum nächsten Montagmittag, holt es dann unrepariert ab. Original:<\/p>\n<blockquote>\n<p><em>„Folglich hatte Jimmy einen <\/em><em>Rücktrittsgrund<\/em><em> und den <\/em><em>Rücktritt ausgeübt<\/em><em>, weswegen der Anspruch aus § 631 entfallen ist.\n[…] Die 200 EUR Zuschlag stellen einen Schaden aus dem Vertrag dar, den Jimmy durch Rücktritt aufgelöst hat. Ein <\/em><em>Schadensersatzanspruch gegen Nancy ergibt sich aus §§ 325, 280<\/em><em>. Nach § 280 müsste Nancy eine Pflicht aus ihrem Schuldverhältnis mit Jimmy verletzt und dies zu vertreten haben. <\/em><em>Allerdings existiert zwischen den beiden nach Ausübung des Rücktritts durch J kein Schuldverhältnis mehr. Gleichwohl bleibt nach § 325 ein Schadensersatzanspruch auch in diesem Fall erhalten.<\/em><em> Vorliegend hat Nancy <\/em><em>nicht zum richtigen Zeitpunkt geleistet, §§ 271, 323 I, II.<\/em><em> Dies ist sogar <\/em><em>vorsätzlich<\/em><em> geschehen, da sie andere Kunden vorgezogen hat, so dass sie die Pflichtverletzung <\/em><em>nach § 276 I zu vertreten<\/em><em> hat. […]\nNach <\/em><em>§ 249<\/em><em> hat Jimmy den Zustand herzustellen, der ohne das schädigende Ereignis … eingetreten wäre (<\/em><em>„positives Interesse\"<\/em><em>). Dann hätte J 200 EUR weniger bezahlt. […]\n<\/em><em>Im Gegensatz dazu wird in anderen Fällen (§§ 122, 179 II) nur das „negative Interesse\" ersetzt.<\/em><em>\"<\/em><\/p>\n<\/blockquote>\n<p>Der letzte Satz ist ein direkter Hinweis des Dozenten auf die Abgrenzung positives/negatives Interesse. Er hält das für prüfungsrelevant.<\/p>\n<p><strong>Fall 09 b) — der Sponsorenvertrag Panther/Victoria.<\/strong> Anneliese verschweigt einen ausstehenden Auftritt für die Konkurrenz. Die getippte Lösung ist knapp:<\/p>\n<blockquote>\n<p><em>„<\/em><em>Rücktrittsgrund aus §§ 241 II, 324 (+)<\/em><em>\"<\/em><\/p>\n<\/blockquote>\n<p>Das handschriftliche Flipchart zeigt den vollen Weg:<\/p>\n<pre><code>Panther will sich vom Sponsoren-Vertrag lösen\n* Vertrag zustande gekommen                       (+)\n* Vertrag durch RT aufgelöst § 346\n   + Erklärung, § 349                             (+)\n   + Grund? § 323\n      * fällige Leistung?                         ✓\n      * nicht vertragsgemäß erfüllt?\n           * Hauptleistung o.k.\n           * Treuepflicht, § 241 II               ✓\n      * angemessene Nachfrist?                    (-)\n           entbehrlich nach § 323 II Nr. 3\n<\/code><\/pre>\n<p><strong>Zwei Wege, ein Ergebnis:<\/strong> Entweder über <strong>§ 324<\/strong> (Verletzung einer Nebenpflicht aus § 241 II — da braucht es von vornherein keine Nachfrist), oder über <strong>§ 323<\/strong> mit <strong>entbehrlicher Nachfrist nach § 323 II Nr. 3<\/strong>. Beides vertretbar. Annelieses Einwand „ich hätte nach § 323 III erst abgemahnt werden müssen\" greift daher nicht.<\/p>\n<p><strong>Merke die Struktur:<\/strong> Wenn die <strong>Hauptleistung<\/strong> in Ordnung ist, aber eine <strong>Rücksichtnahme-/Treuepflicht<\/strong> verletzt wurde → <strong>§ 241 II i.V.m. § 324<\/strong>.<\/p>","text":"Worum es hier geht — in einfachen Worten Der dritte Weg aus einem Vertrag heraus — und der mit dem anderen Auslöser. Hier war nämlich alles in Ordnung: kein Irrtum, keine Reue. Sondern: Der andere hat nicht geliefert. Der Dozent hat dazu eine eigene Fallsammlung gemacht und das Prüfungsschema per Hand aufs Flipchart gemalt. Das spricht dafür, dass er es wichtig findet. 📌 Korrektur zu deiner Themenliste: Du hattest Rücktritt als „nur eine Überschrift, inhaltlich nicht ausgeführt\" eingestuft. Das stimmt nicht. Folie 28 führt ihn vollständig aus , und es gibt eine eigene Fallsammlung (09 Fälle Rücktritt) mit zwei Fällen und zwei abfotografierten handschriftlichen Flipcharts des Dozenten , auf denen er das Prüfungsschema selbst aufgemalt hat. Behandle das Thema als vollwertig. Folie 28 (Original, vollständig): „● Auflösung/Umgestaltung des Vertragsverhältnisses durch Rücktritt, § 346 – Vertraglich: wenn Rücktrittsmöglichkeit vereinbart oder vorbehalten , z.B. bei Preisanpassung (bei Dauerschuldverhältnissen ggfs. Sonderkündigungsrecht), Rücktritt kann aber auch vertraglich ausgeschlossen werden. – Gesetzlich: wenn die Leistung nach Fristsetzung nicht oder nicht ordnungsgemäß erbracht wurde, § 323 – Gesetzlich: wenn die Vertragserfüllung z. B. nach § 275 unmöglich (geworden) ist, § 326 V oder wenn eine Nebenpflicht verletzt wurde, § 324 – Rechtsfolge ist die Umwandlung des ursprünglichen Vertrages in ein Rückgewährschuldverhältnis, § 346 ; ggfs. kann zusätzlich Schadensersatz verlangt werden, §§ 325, 280 \" 13.1 Der Grundgedanke Der Rücktritt ist das Werkzeug für den Fall: Der Vertrag war völlig in Ordnung — aber der andere hat nicht geliefert. Kein Willensmangel (das wäre Anfechtung), keine Reue (das wäre Widerruf), sondern eine Leistungsstörung . 13.2 ★ Die große Abgrenzung: Anfechtung – Widerruf – Rücktritt Das ist mit hoher Wahrscheinlichkeit eine Kurzfrage. Lern diese Tabelle. Anfechtung §§ 119 ff. Widerruf § 355 Rücktritt § 346 Warum? Willensmangel — die WE war fehlerhaft Verbraucherschutz — Überrumpelung Leistungsstörung — der andere hat nicht geliefert Grund nötig? ja (§§ 119, 120, 123) nein ja (Vertrag oder Gesetz: §§ 323, 324, 326 V) Frist unverzüglich / 1 Jahr 14 Tage keine feste Frist (aber Nachfrist nötig!) Wirkung ex tunc — von Anfang an nichtig Bindung entfällt ex nunc — Vertrag war bis dahin wirksam Folge § 142 Nichtigkeit + § 812 Rückabwicklung Rückgewähr §§ 355 III, 357 Rückgewährschuldverhältnis § 346 Wer? jeder nur Verbraucher jede Vertragspartei Schadensersatz § 122 (negatives Interesse) – §§ 325, 280 ( positives Interesse) daneben möglich Der Kernsatz für die Klausur: Anfechtung wirkt ex tunc — der Vertrag gilt als nie geschlossen. Rücktritt wirkt ex nunc — der Vertrag war bis zum Rücktritt wirksam und wandelt sich dann in ein Rückgewährschuldverhältnis (§ 346) um. Warum ist der Unterschied wichtig? Weil bei Anfechtung der Rechtsgrund rückwirkend entfällt → Rückabwicklung läuft über § 812 . Beim Rücktritt bleibt der Vertrag bestehen und wird umgewandelt → Rückabwicklung läuft über § 346 , aus dem Vertrag selbst. 13.3 Rücktrittsgründe Grund § Was Vertraglich – vereinbart oder vorbehalten; kann auch ausgeschlossen werden Nicht/schlecht geleistet § 323 fällige Leistung + nicht oder nicht vertragsgemäß erfüllt + angemessene Nachfrist erfolglos Nebenpflichtverletzung § 324 Verletzung einer Pflicht nach § 241 II — keine Nachfrist nötig Unmöglichkeit § 326 V Leistung nach § 275 unmöglich — keine Nachfrist nötig Die Nachfrist ist der Knackpunkt bei § 323. Du kannst nicht einfach zurücktreten, weil einmal etwas zu spät kam — du musst dem anderen erst eine angemessene Frist zur Nacherfüllung setzen. § 323 II nennt Fälle, in denen die Nachfrist entbehrlich ist: ernsthafte und endgültige Leistungsverweigerung (Nr. 1), Fixgeschäft (Nr. 2), besondere Umstände / Interessenabwägung (Nr. 3). 13.4 Das Original-Prüfungsschema des Dozenten Das hat er im Fall 09a handschriftlich aufs Flipchart geschrieben. Übernimm es genau so: Anspruch Nancy → Jimmy: Zahlung d. Werklohns, § 631 * Vertrag geschlossen ⟹ Anspruch entstanden * Anspruch erloschen, § 346? Rücktritt * RT-Erklärung, § 349 (+) * RT-Recht aus Gesetz - § 323 - fällige Leistung, § 271 (+) - nicht (vertragsmäßig) erfüllt (+) * angemessene Nachfrist (+) ⟹ RT-Grund § 323 (+) Beachte: Der Rücktritt wird nicht als eigener Obersatz geprüft, sondern als Einwendung auf der zweiten Stufe des Anspruchsaufbaus („Anspruch erloschen?\") — genau wie in Kapitel 3.4 beschrieben. Das ist der methodisch saubere Weg. Und die Rücktrittserklärung braucht § 349 — die vergisst fast jeder. Der Rücktritt geschieht durch Erklärung gegenüber dem anderen Teil . 13.5 Rechtsfolge — § 346 Der Vertrag wandelt sich in ein Rückgewährschuldverhältnis um: Beide Seiten geben die empfangenen Leistungen zurück, gezogene Nutzungen werden herausgegeben. Zusätzlich Schadensersatz möglich, §§ 325, 280. § 325 sagt ausdrücklich: Der Rücktritt schließt den Schadensersatz nicht aus. Das ist wichtig, weil nach dem Rücktritt eigentlich kein Schuldverhältnis mehr besteht — § 325 hält den Anspruch trotzdem am Leben. Beispiele aus deinen Übungsfällen (Fall 09) Fall 09 a) — die Inspektion vor dem Urlaub. Jimmy bringt das Auto Montag in die Werkstatt, setzt am Mittwoch eine Frist bis zum nächsten Montagmittag, holt es dann unrepariert ab. Original: „Folglich hatte Jimmy einen Rücktrittsgrund und den Rücktritt ausgeübt , weswegen der Anspruch aus § 631 entfallen ist. […] Die 200 EUR Zuschlag stellen einen Schaden aus dem Vertrag dar, den Jimmy durch Rücktritt aufgelöst hat. Ein Schadensersatzanspruch gegen Nancy ergibt sich aus §§ 325, 280 . Nach § 280 müsste Nancy eine Pflicht aus ihrem Schuldverhältnis mit Jimmy verletzt und dies zu vertreten haben. Allerdings existiert zwischen den beiden nach Ausübung des Rücktritts durch J kein Schuldverhältnis mehr. Gleichwohl bleibt nach § 325 ein Schadensersatzanspruch auch in diesem Fall erhalten. Vorliegend hat Nancy nicht zum richtigen Zeitpunkt geleistet, §§ 271, 323 I, II. Dies ist sogar vorsätzlich geschehen, da sie andere Kunden vorgezogen hat, so dass sie die Pflichtverletzung nach § 276 I zu vertreten hat. […] Nach § 249 hat Jimmy den Zustand herzustellen, der ohne das schädigende Ereignis … eingetreten wäre ( „positives Interesse\" ). Dann hätte J 200 EUR weniger bezahlt. […] Im Gegensatz dazu wird in anderen Fällen (§§ 122, 179 II) nur das „negative Interesse\" ersetzt. \" Der letzte Satz ist ein direkter Hinweis des Dozenten auf die Abgrenzung positives/negatives Interesse. Er hält das für prüfungsrelevant. Fall 09 b) — der Sponsorenvertrag Panther/Victoria. Anneliese verschweigt einen ausstehenden Auftritt für die Konkurrenz. Die getippte Lösung ist knapp: „ Rücktrittsgrund aus §§ 241 II, 324 (+) \" Das handschriftliche Flipchart zeigt den vollen Weg: Panther will sich vom Sponsoren-Vertrag lösen * Vertrag zustande gekommen (+) * Vertrag durch RT aufgelöst § 346 + Erklärung, § 349 (+) + Grund? § 323 * fällige Leistung? ✓ * nicht vertragsgemäß erfüllt? * Hauptleistung o.k. * Treuepflicht, § 241 II ✓ * angemessene Nachfrist? (-) entbehrlich nach § 323 II Nr. 3 Zwei Wege, ein Ergebnis: Entweder über § 324 (Verletzung einer Nebenpflicht aus § 241 II — da braucht es von vornherein keine Nachfrist), oder über § 323 mit entbehrlicher Nachfrist nach § 323 II Nr. 3 . Beides vertretbar. Annelieses Einwand „ich hätte nach § 323 III erst abgemahnt werden müssen\" greift daher nicht. Merke die Struktur: Wenn die Hauptleistung in Ordnung ist, aber eine Rücksichtnahme-/Treuepflicht verletzt wurde → § 241 II i.V.m. § 324 .","words":1163,"mins":6},{"id":"r-14-leistungsstörungen","subject":"recht","num":"14","title":"14. Leistungsstörungen","short":"Leistungsstörungen","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nWas alles schiefgehen kann: <strong>zu spät · gar nicht · schlecht.<\/strong><\/p>\n<p>Dieses Kapitel liefert die Gründe, aus denen man überhaupt zurücktreten darf — es gehört also inhaltlich zu Kapitel 13 dazu.<\/p>\n<p>Der Dozent will hier ausdrücklich nur Grundverständnis. Kenne die vier Störungsarten und das Verzugsschema in Grundzügen, das reicht.<\/p>\n<p>📌 <strong>Das fehlte in deiner Themenliste komplett.<\/strong> Folien 29 und 30 behandeln Leistungsstörungen, Folie 30 enthält ein vollständiges <strong>Prüfungsschema zum Verzug<\/strong>. Der Dozent hat das im Juni gemacht, also spät im Semester — aber es ist die Voraussetzung für Kapitel 13 (Rücktritt). Ich halte es für ein <strong>★-Thema<\/strong>: kennen, nicht vertiefen.<\/p>\n<\/blockquote>\n<p><strong>Folie 29 (Original):<\/strong><\/p>\n<blockquote>\n<p>„● <strong>Leistungsstörungen<\/strong> bezeichnen Sachverhalte, bei denen die Schuldverhältnisse <strong>nicht ordnungsgemäß/vertragsgemäß erfüllt<\/strong> werden\n⇒Sofern vertraglich nichts anderes bestimmt ist, regelt das allgemeine Schuldrecht, insb. die §§ 241 ff wie Schuldverhältnisse zu erfüllen sind:\n– <strong>Das Richtige<\/strong>: Erfüllung der Haupt- und Nebenleistungspflichten nach dem Vertragsinhalt, <strong>§ 241 I<\/strong> (vgl. § 433 I und II; § 535 I, S. 1, 2, II; §§ 631 I, 640)\n– <strong>unter Schutz und Schonung der Rechtsgüter des Vertragspartners, § 241 II<\/strong>\n– <strong>in der richtigen Weise<\/strong>: Art der Leistungserfüllung: <strong>§§ 242, 243<\/strong> nach Treu und Glauben; Leistung mittlerer Art und Güte\n– <strong>am richtigen Ort<\/strong>: Leistungs- und Zahlungsort <strong>§§ 269, 270<\/strong>\n– <strong>zur richtigen Zeit<\/strong>: Fälligkeit nach <strong>§ 271<\/strong>\n⇒Hierbei können <strong>Erfüllungsdefizite<\/strong> auftreten …\n– <strong>Nichtleistung<\/strong> durch Unmöglichkeit oder Leistungsverweigerung, <strong>§§ 275, 326<\/strong>\n– <strong>Zu-spät-Leistung<\/strong> durch Verzug, <strong>§§ 286 ff<\/strong> oder <strong>Annahmeverzug, §§ 293 ff<\/strong>\n– <strong>Schlecht- oder Mangelleistung, §§ 280 ff<\/strong> oder spezifische Gewährleistungsvorschriften\n– <strong>Verletzung von Nebenpflichten, § 241 II, 280<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"r-141-die-richtigkeits-checkliste\">14.1 Die „Richtigkeits-Checkliste\"<\/h3>\n<p>Der Dozent baut es sehr schön auf. Eine Leistung muss sein:<\/p>\n<pre><code>DAS RICHTIGE      § 241 I     die geschuldete Haupt- und Nebenleistung\nIN RICHTIGER WEISE §§ 242,243 nach Treu und Glauben; mittlere Art und Güte\nAM RICHTIGEN ORT  §§ 269, 270\nZUR RICHTIGEN ZEIT § 271      Fälligkeit\nUND SCHONEND      § 241 II    ohne die Rechtsgüter des anderen zu verletzen\n<\/code><\/pre>\n<p>Merkhilfe: <strong>Was – Wie – Wo – Wann – und ohne Kollateralschaden.<\/strong><\/p>\n<p><strong>Denk an eine Pizzabestellung.<\/strong> Richtig geliefert ist sie nur, wenn <em>alles<\/em> stimmt:<\/p>\n<ul>\n<li>die <strong>richtige<\/strong> Pizza (Margherita, nicht Salami) → § 241 I<\/li>\n<li><strong>ordentlich<\/strong> (nicht zerlaufen, nicht kalt) → §§ 242, 243<\/li>\n<li>an die <strong>richtige Adresse<\/strong> → §§ 269, 270<\/li>\n<li>zur <strong>vereinbarten Zeit<\/strong> → § 271<\/li>\n<li>und <strong>ohne dass der Fahrer dir beim Reinstellen die Tür zerkratzt<\/strong> → § 241 II<\/li>\n<\/ul>\n<p>Fällt eines davon aus, ist das eine <strong>Leistungsstörung<\/strong>. Genau danach sind die fünf Punkte des Dozenten sortiert.<\/p>\n<h3 id=\"r-142-die-vier-storungstypen\">14.2 Die vier Störungstypen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Störung<\/th>\n<th>Was<\/th>\n<th>§§<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Nichtleistung / Unmöglichkeit<\/strong><\/td>\n<td>kann gar nicht (mehr) geleistet werden<\/td>\n<td>§§ 275, 326<\/td>\n<\/tr>\n<tr>\n<td><strong>Verzug<\/strong> (Zu-spät-Leistung)<\/td>\n<td>könnte, tut es aber nicht rechtzeitig<\/td>\n<td>§§ 286 ff.<\/td>\n<\/tr>\n<tr>\n<td><strong>Annahmeverzug<\/strong><\/td>\n<td>der <em>Gläubiger<\/em> nimmt nicht an<\/td>\n<td>§§ 293 ff.<\/td>\n<\/tr>\n<tr>\n<td><strong>Schlechtleistung<\/strong><\/td>\n<td>geleistet, aber mangelhaft<\/td>\n<td>§§ 280 ff. + Gewährleistung<\/td>\n<\/tr>\n<tr>\n<td><strong>Nebenpflichtverletzung<\/strong><\/td>\n<td>Hauptleistung ok, Rücksichtnahme verletzt<\/td>\n<td>§§ 241 II, 280<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-143-275-unmoglichkeit\">14.3 § 275 — Unmöglichkeit<\/h3>\n<blockquote>\n<p>Wenn die Leistung für <strong>jedermann<\/strong> (objektiv) oder für <strong>den Schuldner<\/strong> (subjektiv) unmöglich ist, entfällt die Leistungspflicht — automatisch, ohne dass jemand etwas tun muss.<\/p>\n<\/blockquote>\n<p><strong>Aber Vorsicht — die Gegenleistung entfällt auch<\/strong> (§ 326 I): Wer nicht liefern muss, bekommt auch kein Geld. Und wer schon gezahlt hat, kann nach <strong>§ 326 IV<\/strong> zurückfordern.<\/p>\n<p><strong>Fall 05 d) zeigt die Grenzen von § 275 sehr schön.<\/strong> Jimmys letzte PS5 wird vor dem Versand von einem Balken zerstört. Er beruft sich auf § 275. Original:<\/p>\n<blockquote>\n<p><em>„Vertrag zustande gekommen, jedoch aus Sicht von Denny (<\/em><em>Auslegung vom obj. Empfängerhorizont, § 133<\/em><em>) jedoch nur als <\/em><em>Gattungsschuld, § 243<\/em><em>: Verpflichtung zur Lieferung einer Sache <\/em><em>„mittlerer Art und Güte\"<\/em><em>. Denny konnte nicht wissen (und es war ihm auch egal), dass Jimmy nur noch eine PS5 am Lager hatte. <\/em><em>Erst wenn Jimmy das seinerseits Erforderliche getan hat, hätte sich das Schuldverhältnis auf diese eine Sache konkretisiert, § 243 II.<\/em><em> Das seinerseits Erforderliche war jedoch das <\/em><em>Verpacken und Versenden<\/em><em>, so dass <\/em><em>keine Unmöglichkeit nach § 275 eintrat<\/em><em>; andere Lieferanten konnten weiterhin entsprechende Ware noch liefern. Diese Rechtsfolge … bestätigt sich auch in der Spezialvorschrift …, wonach beim <\/em><em>Versendungskauf die Gefahr (des zufälligen Untergangs) nach § 447 I erst mit Übergabe an den Frachtführer<\/em><em> übergeht.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Die Lehre:<\/strong> <strong>Gattungsschuld vs. Stückschuld.<\/strong>\n- <strong>Stückschuld:<\/strong> genau <em>dieses<\/em> Objekt („dein roter Golf mit dem Kennzeichen X\"). Geht es kaputt → Unmöglichkeit § 275.\n- <strong>Gattungsschuld<\/strong> (§ 243): <em>irgendeine<\/em> Sache dieser Art („eine PS5 Pro\"). Geht ein Exemplar kaputt → <strong>kein<\/strong> § 275, der Schuldner muss ein anderes beschaffen. Erst mit <strong>Konkretisierung<\/strong> (§ 243 II) wird daraus eine Stückschuld.<\/p>\n<p><strong>Der Unterschied an zwei Sätzen:<\/strong><\/p>\n<p>„Ich kaufe <strong>diesen<\/strong> Gebrauchtwagen da auf dem Hof, den mit dem Kratzer an der Fahrertür.\" → Gemeint ist genau <strong>dieses eine<\/strong> Auto. Brennt es ab, kann niemand mehr liefern. Die Leistung ist unmöglich.<\/p>\n<p>„Ich kaufe <strong>eine<\/strong> PS5 Pro.\" → Gemeint ist <strong>irgendeine<\/strong>. Geht ein Gerät im Lager kaputt, muss der Händler eben ein anderes besorgen. Erst wenn er <em>dein<\/em> Gerät verpackt und losgeschickt hat, ist aus „irgendeine\" ein „diese hier\" geworden.<\/p>\n<h3 id=\"r-144-verzug-286-ff-das-schema-der-folie-30\">14.4 Verzug — §§ 286 ff. (das Schema der Folie 30)<\/h3>\n<p><strong>Folie 30 (Original, vollständig):<\/strong><\/p>\n<blockquote>\n<p>„● <strong>Verzug des Schuldners führt zum Schadensersatz für die Verzögerung bis hin zum vollen SE, § 286, 280, 287 (Prüfungsschema)<\/strong>\n⇒<strong>Durchsetzbarer Anspruch<\/strong>\n– Anspruch wirksam entstanden?\n– Nichtleistung, Anspruch entstanden und durchsetzbar (keine Einreden/Einwendungen gegen den Anspruch?)\n– <strong>Keine wirksamen Einwendungen<\/strong>: Tatsachen, die das Entstehen des Anspruchs verhindert oder vernichtet haben, sind im Prozess <strong>von Amts wegen<\/strong> zu berücksichtigen, z.B. mangelnde Geschäftsfähigkeit (§§ 105 ff), Formmangel (§ 125), gesetzliches Verbot (§ 134), Sittenwidrigkeit (§ 138), wirksame Anfechtung (<strong>§ 122<\/strong>), Erfüllung, Aufrechnung, Widerruf (§§ 130, 355), Rücktritt (§ 346)\n– <strong>Keine durchgreifenden Einreden<\/strong>: Tatsachen, die es dem Schuldner, sofern er sich darauf beruft, ermöglichen, die aktuelle Durchsetzung des Anspruchs zu verhindern oder hinauszuschieben, z.B. nicht erfüllter Vertrag (§§ 320, 322), Zurückbehaltungsrecht (§§ 273, 322), Verjährung (§§ 194, 214)\n⇒<strong>Mahnung, soweit nicht entbehrlich<\/strong>\n– <strong>Mahnung ist die einseitige empfangsbedürftige Aufforderung zur Leistung, § 286 I<\/strong>\n– <strong>Entbehrlich nach § 286 I 2, II Nrn. 1-4, III<\/strong>\n⇒<strong>Nichtleistung (trotz Möglichkeit)<\/strong>\n⇒<strong>Verschulden, §§ 286 iV, 276<\/strong>\n⇒<strong>Rechtsfolge: Schadensersatz, § 288 I, IV, 280<\/strong>\"<\/p>\n<p>⚠️ <strong>Fehler auf dieser Folie:<\/strong> „wirksame Anfechtung (<strong>§ 122<\/strong>)\" — richtig ist <strong>§ 142<\/strong>. § 122 ist die Schadensersatzpflicht <em>nach<\/em> der Anfechtung. Schreib in der Klausur § 142.<\/p>\n<\/blockquote>\n<h3 id=\"r-das-verzugsschema-in-kurzform\">Das Verzugsschema in Kurzform<\/h3>\n<pre><code>① Durchsetzbarer, fälliger Anspruch     (§ 271 Fälligkeit)\n② Mahnung, soweit nicht entbehrlich     § 286 I\n     Definition: einseitige empfangsbedürftige Aufforderung zur Leistung\n     Entbehrlich nach § 286 II:\n        Nr. 1  kalendermäßig bestimmte Leistungszeit (&quot;Zahlbar am 1.3.&quot;)\n        Nr. 2  Ereignis + angemessene Frist\n        Nr. 3  ernsthafte und endgültige Leistungsverweigerung\n        Nr. 4  besondere Gründe / Interessenabwägung\n     § 286 III: bei Entgeltforderungen automatisch 30 Tage nach Rechnung\n③ Nichtleistung trotz Möglichkeit\n④ Verschulden, §§ 286 IV, 276\n⇒ Rechtsfolge: Verzugsschaden §§ 280 I, II, 286; Verzugszinsen § 288\n<\/code><\/pre>\n<p><strong>Alltagsbeispiel:<\/strong> Deine Miete ist „zum dritten Werktag\" fällig. Du zahlst nicht. → <strong>Keine Mahnung nötig<\/strong> (§ 286 II Nr. 1, kalendermäßig bestimmt). Du bist automatisch im Verzug und schuldest Verzugszinsen.\nAnderes Beispiel: Du hast einen Schrank bestellt „Lieferung in ein paar Wochen\". Da ist nichts kalendermäßig bestimmt → der Händler kommt erst nach <strong>Mahnung<\/strong> in Verzug.<\/p>\n<p><strong>§ 288 Verzugszinsen:<\/strong> 5 Prozentpunkte über Basiszins (Verbraucher), 9 Prozentpunkte bei Rechtsgeschäften ohne Verbraucherbeteiligung. Nur die Größenordnung merken.<\/p>\n<h3 id=\"r-wie-tief-musst-du-das-konnen\">Wie tief musst du das können?<\/h3>\n<p>Der Dozent will Verständnis. <strong>Für die Klausur reicht:<\/strong>\n- Die vier Störungstypen benennen können.\n- § 275 (Unmöglichkeit) und den Unterschied Gattungs-/Stückschuld erklären können.\n- Das Verzugsschema in Grundzügen: <strong>fälliger Anspruch → Mahnung (oder entbehrlich) → Nichtleistung → Verschulden<\/strong>.\n- Wissen, dass Leistungsstörungen die <strong>Rücktrittsgründe<\/strong> liefern (Kapitel 13).<\/p>","text":"Worum es hier geht — in einfachen Worten Was alles schiefgehen kann: zu spät · gar nicht · schlecht. Dieses Kapitel liefert die Gründe, aus denen man überhaupt zurücktreten darf — es gehört also inhaltlich zu Kapitel 13 dazu. Der Dozent will hier ausdrücklich nur Grundverständnis. Kenne die vier Störungsarten und das Verzugsschema in Grundzügen, das reicht. 📌 Das fehlte in deiner Themenliste komplett. Folien 29 und 30 behandeln Leistungsstörungen, Folie 30 enthält ein vollständiges Prüfungsschema zum Verzug . Der Dozent hat das im Juni gemacht, also spät im Semester — aber es ist die Voraussetzung für Kapitel 13 (Rücktritt). Ich halte es für ein ★-Thema : kennen, nicht vertiefen. Folie 29 (Original): „● Leistungsstörungen bezeichnen Sachverhalte, bei denen die Schuldverhältnisse nicht ordnungsgemäß/vertragsgemäß erfüllt werden ⇒Sofern vertraglich nichts anderes bestimmt ist, regelt das allgemeine Schuldrecht, insb. die §§ 241 ff wie Schuldverhältnisse zu erfüllen sind: – Das Richtige : Erfüllung der Haupt- und Nebenleistungspflichten nach dem Vertragsinhalt, § 241 I (vgl. § 433 I und II; § 535 I, S. 1, 2, II; §§ 631 I, 640) – unter Schutz und Schonung der Rechtsgüter des Vertragspartners, § 241 II – in der richtigen Weise : Art der Leistungserfüllung: §§ 242, 243 nach Treu und Glauben; Leistung mittlerer Art und Güte – am richtigen Ort : Leistungs- und Zahlungsort §§ 269, 270 – zur richtigen Zeit : Fälligkeit nach § 271 ⇒Hierbei können Erfüllungsdefizite auftreten … – Nichtleistung durch Unmöglichkeit oder Leistungsverweigerung, §§ 275, 326 – Zu-spät-Leistung durch Verzug, §§ 286 ff oder Annahmeverzug, §§ 293 ff – Schlecht- oder Mangelleistung, §§ 280 ff oder spezifische Gewährleistungsvorschriften – Verletzung von Nebenpflichten, § 241 II, 280 \" 14.1 Die „Richtigkeits-Checkliste\" Der Dozent baut es sehr schön auf. Eine Leistung muss sein: DAS RICHTIGE § 241 I die geschuldete Haupt- und Nebenleistung IN RICHTIGER WEISE §§ 242,243 nach Treu und Glauben; mittlere Art und Güte AM RICHTIGEN ORT §§ 269, 270 ZUR RICHTIGEN ZEIT § 271 Fälligkeit UND SCHONEND § 241 II ohne die Rechtsgüter des anderen zu verletzen Merkhilfe: Was – Wie – Wo – Wann – und ohne Kollateralschaden. Denk an eine Pizzabestellung. Richtig geliefert ist sie nur, wenn alles stimmt: die richtige Pizza (Margherita, nicht Salami) → § 241 I ordentlich (nicht zerlaufen, nicht kalt) → §§ 242, 243 an die richtige Adresse → §§ 269, 270 zur vereinbarten Zeit → § 271 und ohne dass der Fahrer dir beim Reinstellen die Tür zerkratzt → § 241 II Fällt eines davon aus, ist das eine Leistungsstörung . Genau danach sind die fünf Punkte des Dozenten sortiert. 14.2 Die vier Störungstypen Störung Was §§ Nichtleistung / Unmöglichkeit kann gar nicht (mehr) geleistet werden §§ 275, 326 Verzug (Zu-spät-Leistung) könnte, tut es aber nicht rechtzeitig §§ 286 ff. Annahmeverzug der Gläubiger nimmt nicht an §§ 293 ff. Schlechtleistung geleistet, aber mangelhaft §§ 280 ff. + Gewährleistung Nebenpflichtverletzung Hauptleistung ok, Rücksichtnahme verletzt §§ 241 II, 280 14.3 § 275 — Unmöglichkeit Wenn die Leistung für jedermann (objektiv) oder für den Schuldner (subjektiv) unmöglich ist, entfällt die Leistungspflicht — automatisch, ohne dass jemand etwas tun muss. Aber Vorsicht — die Gegenleistung entfällt auch (§ 326 I): Wer nicht liefern muss, bekommt auch kein Geld. Und wer schon gezahlt hat, kann nach § 326 IV zurückfordern. Fall 05 d) zeigt die Grenzen von § 275 sehr schön. Jimmys letzte PS5 wird vor dem Versand von einem Balken zerstört. Er beruft sich auf § 275. Original: „Vertrag zustande gekommen, jedoch aus Sicht von Denny ( Auslegung vom obj. Empfängerhorizont, § 133 ) jedoch nur als Gattungsschuld, § 243 : Verpflichtung zur Lieferung einer Sache „mittlerer Art und Güte\" . Denny konnte nicht wissen (und es war ihm auch egal), dass Jimmy nur noch eine PS5 am Lager hatte. Erst wenn Jimmy das seinerseits Erforderliche getan hat, hätte sich das Schuldverhältnis auf diese eine Sache konkretisiert, § 243 II. Das seinerseits Erforderliche war jedoch das Verpacken und Versenden , so dass keine Unmöglichkeit nach § 275 eintrat ; andere Lieferanten konnten weiterhin entsprechende Ware noch liefern. Diese Rechtsfolge … bestätigt sich auch in der Spezialvorschrift …, wonach beim Versendungskauf die Gefahr (des zufälligen Untergangs) nach § 447 I erst mit Übergabe an den Frachtführer übergeht.\" Die Lehre: Gattungsschuld vs. Stückschuld. - Stückschuld: genau dieses Objekt („dein roter Golf mit dem Kennzeichen X\"). Geht es kaputt → Unmöglichkeit § 275. - Gattungsschuld (§ 243): irgendeine Sache dieser Art („eine PS5 Pro\"). Geht ein Exemplar kaputt → kein § 275, der Schuldner muss ein anderes beschaffen. Erst mit Konkretisierung (§ 243 II) wird daraus eine Stückschuld. Der Unterschied an zwei Sätzen: „Ich kaufe diesen Gebrauchtwagen da auf dem Hof, den mit dem Kratzer an der Fahrertür.\" → Gemeint ist genau dieses eine Auto. Brennt es ab, kann niemand mehr liefern. Die Leistung ist unmöglich. „Ich kaufe eine PS5 Pro.\" → Gemeint ist irgendeine . Geht ein Gerät im Lager kaputt, muss der Händler eben ein anderes besorgen. Erst wenn er dein Gerät verpackt und losgeschickt hat, ist aus „irgendeine\" ein „diese hier\" geworden. 14.4 Verzug — §§ 286 ff. (das Schema der Folie 30) Folie 30 (Original, vollständig): „● Verzug des Schuldners führt zum Schadensersatz für die Verzögerung bis hin zum vollen SE, § 286, 280, 287 (Prüfungsschema) ⇒ Durchsetzbarer Anspruch – Anspruch wirksam entstanden? – Nichtleistung, Anspruch entstanden und durchsetzbar (keine Einreden/Einwendungen gegen den Anspruch?) – Keine wirksamen Einwendungen : Tatsachen, die das Entstehen des Anspruchs verhindert oder vernichtet haben, sind im Prozess von Amts wegen zu berücksichtigen, z.B. mangelnde Geschäftsfähigkeit (§§ 105 ff), Formmangel (§ 125), gesetzliches Verbot (§ 134), Sittenwidrigkeit (§ 138), wirksame Anfechtung ( § 122 ), Erfüllung, Aufrechnung, Widerruf (§§ 130, 355), Rücktritt (§ 346) – Keine durchgreifenden Einreden : Tatsachen, die es dem Schuldner, sofern er sich darauf beruft, ermöglichen, die aktuelle Durchsetzung des Anspruchs zu verhindern oder hinauszuschieben, z.B. nicht erfüllter Vertrag (§§ 320, 322), Zurückbehaltungsrecht (§§ 273, 322), Verjährung (§§ 194, 214) ⇒ Mahnung, soweit nicht entbehrlich – Mahnung ist die einseitige empfangsbedürftige Aufforderung zur Leistung, § 286 I – Entbehrlich nach § 286 I 2, II Nrn. 1-4, III ⇒ Nichtleistung (trotz Möglichkeit) ⇒ Verschulden, §§ 286 iV, 276 ⇒ Rechtsfolge: Schadensersatz, § 288 I, IV, 280 \" ⚠️ Fehler auf dieser Folie: „wirksame Anfechtung ( § 122 )\" — richtig ist § 142 . § 122 ist die Schadensersatzpflicht nach der Anfechtung. Schreib in der Klausur § 142. Das Verzugsschema in Kurzform ① Durchsetzbarer, fälliger Anspruch (§ 271 Fälligkeit) ② Mahnung, soweit nicht entbehrlich § 286 I Definition: einseitige empfangsbedürftige Aufforderung zur Leistung Entbehrlich nach § 286 II: Nr. 1 kalendermäßig bestimmte Leistungszeit (\"Zahlbar am 1.3.\") Nr. 2 Ereignis + angemessene Frist Nr. 3 ernsthafte und endgültige Leistungsverweigerung Nr. 4 besondere Gründe / Interessenabwägung § 286 III: bei Entgeltforderungen automatisch 30 Tage nach Rechnung ③ Nichtleistung trotz Möglichkeit ④ Verschulden, §§ 286 IV, 276 ⇒ Rechtsfolge: Verzugsschaden §§ 280 I, II, 286; Verzugszinsen § 288 Alltagsbeispiel: Deine Miete ist „zum dritten Werktag\" fällig. Du zahlst nicht. → Keine Mahnung nötig (§ 286 II Nr. 1, kalendermäßig bestimmt). Du bist automatisch im Verzug und schuldest Verzugszinsen. Anderes Beispiel: Du hast einen Schrank bestellt „Lieferung in ein paar Wochen\". Da ist nichts kalendermäßig bestimmt → der Händler kommt erst nach Mahnung in Verzug. § 288 Verzugszinsen: 5 Prozentpunkte über Basiszins (Verbraucher), 9 Prozentpunkte bei Rechtsgeschäften ohne Verbraucherbeteiligung. Nur die Größenordnung merken. Wie tief musst du das können? Der Dozent will Verständnis. Für die Klausur reicht: - Die vier Störungstypen benennen können. - § 275 (Unmöglichkeit) und den Unterschied Gattungs-/Stückschuld erklären können. - Das Verzugsschema in Grundzügen: fälliger Anspruch → Mahnung (oder entbehrlich) → Nichtleistung → Verschulden . - Wissen, dass Leistungsstörungen die Rücktrittsgründe liefern (Kapitel 13).","words":1275,"mins":7},{"id":"r-15-gesetzliche-schuldverhältnisse","subject":"recht","num":"15","title":"15. Gesetzliche Schuldverhältnisse","short":"Gesetzliche Schuldverhältnisse","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nBisher ging es um Verträge, die man <strong>schließt<\/strong>. Jetzt geht es um Pflichten, die einem <strong>passieren<\/strong> — ohne dass irgendjemand etwas vereinbart hat.<\/p>\n<p>Du fährst jemandem ins Auto. Dir wird versehentlich Geld überwiesen. Du rutschst im Supermarkt aus, bevor du überhaupt etwas gekauft hast.<\/p>\n<p>Drei Normen musst du hier können: <strong>§ 823<\/strong> (jemand hat mir geschadet), <strong>§ 812<\/strong> (jemand hat etwas ohne Grund bekommen) und <strong>c.i.c.<\/strong> (Schutzpflichten schon vor dem Vertrag).<\/p>\n<\/blockquote>\n<p><strong>Folie 23 (Original, Einleitung):<\/strong><\/p>\n<blockquote>\n<p>„● Manche Schuldverhältnisse entstehen <strong>unabhängig vom Willen der Parteien<\/strong>, allein aufgrund von <strong>tatsächlichen Konstellationen<\/strong>, insbesondere Rechtsgutsverletzungen, an die die Rechtsordnung Rechte u. Pflichten knüpft\"<\/p>\n<\/blockquote>\n<p><strong>Der Grundgedanke:<\/strong> Bis jetzt entstand alles durch Willenserklärungen. Hier entsteht ein Schuldverhältnis, <strong>ohne dass jemand es wollte<\/strong> — kraft Gesetzes.<\/p>\n<p><strong>Der Unterschied in einem Satz: Einen Vertrag schließt du. Ein gesetzliches Schuldverhältnis passiert dir.<\/strong><\/p>\n<p>Niemand fährt morgens los und denkt „heute schließe ich mal einen Vertrag über Schadensersatz\". Aber wenn du jemandem ins Auto fährst, schuldest du ihm Geld — <strong>ob du willst oder nicht<\/strong>. Keiner hat etwas vereinbart, keiner hat etwas unterschrieben. Das Gesetz knüpft die Pflicht einfach an das, was passiert ist.<\/p>\n<h3 id=\"r-151-cic-culpa-in-contrahendo-311-ii-241-ii-280\">15.1 c.i.c. — culpa in contrahendo, §§ 311 II, 241 II, 280<\/h3>\n<p><strong>Folie 23 (Original):<\/strong><\/p>\n<blockquote>\n<p>„– <strong>Culpa in contrahendo („c.i.c\", Verschulden bei Vertragsschluss)<\/strong>, Konkretisierung der allgemeinen Nebenpflichten von (künftigen) Vertragspartnern, <strong>die Rechtsgüter des anderen zu schützen<\/strong>, vertragsähnliches Schuldverhältnis, <strong>§ 311 II<\/strong> ⇒ Schadensersatzpflicht nach <strong>§§ 280, 311 II, 241 II<\/strong>\n⇒<strong>Schuldverhältnis durch Vertragsverhandlungen, § 311 II<\/strong>\n⇒<strong>Pflichtverletzung, § 241 II<\/strong>\n⇒<strong>Vertretenmüssen<\/strong> für eigenes Verschulden; Maßstab: <strong>§§ 280 I 2, 276 I<\/strong>, Vorsatz und Fahrlässigkeit; ausnahmsweise auch Vertretenmüssen für Fremdverschulden (<strong>„Erfüllungsgehilfe\"<\/strong>: wer im Pflichtenkreis des Schuldners mit dessen Wissen und Wollen zur Erfüllung der Verbindlichkeit tätig ist), <strong>§ 278<\/strong>\n⇒<strong>Kausaler Schaden<\/strong>: die Pflichtverletzung muss <strong>„conditio sine qua non\"<\/strong> (Bedingung, ohne welche nicht) für die Entstehung des Schadens sein, eingeschränkt durch <strong>„Adäquanz\"<\/strong>, sofern der eingetretene Erfolg nicht völlig atypisch ist oder durch das nicht erwartbare Eingreifen eines/r Dritten eine neue Kausalkette in Gang gesetzt wurde\n⇒<strong>Ausgleich des negativen Interesses, definiert in § 122 I.<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Was c.i.c. bedeutet:<\/strong> „Verschulden bei Vertragsverhandlungen\". Schon <strong>bevor<\/strong> ein Vertrag geschlossen ist, entstehen Schutzpflichten, sobald man in geschäftlichen Kontakt tritt.<\/p>\n<p><strong>Der Klassiker:<\/strong> Du gehst in den Supermarkt, um einzukaufen, und rutschst auf einem Salatblatt aus. Kein Vertrag geschlossen — trotzdem haftet der Supermarkt. Weil mit dem Betreten schon ein <strong>vorvertragliches Schuldverhältnis<\/strong> nach § 311 II Nr. 2 entstanden ist.<\/p>\n<p><strong>§ 311 II Nr. 1–3:<\/strong> Vertragsverhandlungen (Nr. 1) · Vertragsanbahnung mit Einwirkungsmöglichkeit auf Rechtsgüter (Nr. 2) · ähnliche geschäftliche Kontakte (Nr. 3).<\/p>\n<h3 id=\"r-prufungsschema-cic\">Prüfungsschema c.i.c.<\/h3>\n<pre><code>Anspruch auf Schadensersatz aus §§ 311 II, 241 II, 280?\n ① Vorvertragliches Schuldverhältnis, § 311 II Nr. 1–3\n ② Pflichtverletzung, § 241 II  (Rücksicht auf Rechte, Rechtsgüter, Interessen)\n ③ Vertretenmüssen, §§ 280 I 2, 276 I (Vorsatz/Fahrlässigkeit)\n       ggf. § 278 Erfüllungsgehilfe\n ④ Kausaler Schaden: conditio sine qua non + Adäquanz\n ⇒ Rechtsfolge: Ersatz des NEGATIVEN Interesses (§ 122 I als Definition)\n<\/code><\/pre>\n<p><strong>§ 278 Erfüllungsgehilfe (Definition der Folie):<\/strong> „wer im Pflichtenkreis des Schuldners mit dessen Wissen und Wollen zur Erfüllung der Verbindlichkeit tätig ist\". → Der Schuldner haftet für dessen Verschulden <strong>wie für eigenes<\/strong>.\nBeispiel: Der Paketbote deines Onlineshops beschädigt beim Liefern deinen Türrahmen. Der Shop haftet über § 278.<\/p>\n<p><strong>Kausalität — zwei Stufen:<\/strong>\n- <strong>conditio sine qua non:<\/strong> Wäre der Schaden ohne die Handlung ausgeblieben? (Wegdenken-Test)\n- <strong>Adäquanz:<\/strong> War der Erfolg nicht völlig atypisch? Die Kausalkette bricht, wenn ein Dritter unerwartet eingreift.<\/p>\n<h3 id=\"r-falle-aus-der-ubungssammlung-07\">Fälle aus der Übungssammlung 07<\/h3>\n<p><strong>Fall 07 a) — Malware auf der Shop-Website.<\/strong> Nancy fängt sich Ransomware auf Jimmys Shop ein, ohne etwas gekauft zu haben. Original (gekürzt):<\/p>\n<blockquote>\n<p><em>„Nancy könnte einen Anspruch auf Schadensersatz in Höhe von 0,1 BTC gegen Jimmy aus <\/em><em>§§ 311 II, 241 II Nr. 1, 280 „c.i.c.\"<\/em><em> haben. […] Durch Jimmys Angebot im Netz und den Besuch von Nancy auf der Website, um eine Konsole zu kaufen, ist ein <\/em><em>vorvertragliches Schuldverhältnis nach § 311 II Nr. 1<\/em><em> entstanden. Zu den <\/em><em>Rücksichtnahmepflichten<\/em><em> gegenüber potentiellen Kunden im Netz gehört es, die Angebotswebsites mit den bestmöglichen Virenschutzsystemen zu schützen. Dies hat Jimmy offenbar unterlassen (<\/em><em>„Pflichtverletzung\"<\/em><em>). Dieses Verhalten müsste Jimmy <\/em><em>nach § 276 I vorsätzlich oder fahrlässig<\/em><em> zu vertreten haben. […] <\/em><em>Ersatzfähig … ist das negative Interesse (vgl. § 122)<\/em><em> …\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Sehr relevant für dich als Informatiker:<\/strong> Der Dozent leitet aus § 241 II eine <strong>IT-Sicherheitspflicht<\/strong> ab. Merk dir das — es passt perfekt in einen Klausurfall für Informatikstudierende.<\/p>\n<p><strong>Fall 07 b) — Fake-Bewertungen bei Checking.com.<\/strong> Denny bucht Konzerttickets, storniert dann alles wegen gefälschter Hotelbewertungen. Original:<\/p>\n<blockquote>\n<p><em>„Im Rahmen dieses Schuldverhältnisses muss auch das <\/em><em>Interesse des D auf zutreffende Informationen<\/em><em> als Kunde nach § 241 II beachtet werden. Dies hat C verletzt, indem er <\/em><em>Fake-Bewertungen<\/em><em> selbst erstellt oder auf seiner Website zugelassen hat. Dies geschah vorsätzlich und damit schuldhaft nach § 276. […] <\/em><em>Dass D von sich aus entschieden hat, die Reise ganz abzusagen, liegt … nicht so fern, dass vom Beginn einer neuen Ursachenkette auszugehen wäre.<\/em><em> Damit ist der Schaden <\/em><em>adäquat kausal<\/em><em> … verursacht worden.\"<\/em><\/p>\n<\/blockquote>\n<h3 id=\"r-152-goa-geschaftsfuhrung-ohne-auftrag-677\">15.2 GoA — Geschäftsführung ohne Auftrag, § 677<\/h3>\n<p><strong>Folie 24 (Original):<\/strong><\/p>\n<blockquote>\n<p>„– <strong>Geschäftsführung ohne Auftrag („GoA\"), § 677<\/strong> (Klassiker: Erste-Hilfe-Leistung, Lottotippschein zur Annahmestelle) ⇒ <strong>Aufwendungsersatz, Herausgabepflicht<\/strong>\"<\/p>\n<\/blockquote>\n<p>Laut deiner Angabe hat der Dozent gesagt: <strong>nicht prüfungsrelevant.<\/strong> Der Vollständigkeit halber:<\/p>\n<blockquote>\n<p>Du besorgst ein fremdes Geschäft, ohne beauftragt zu sein. Wenn das dem Willen und Interesse des anderen entspricht, bekommst du deine <strong>Aufwendungen ersetzt<\/strong> und musst herausgeben, was du erlangt hast.<\/p>\n<\/blockquote>\n<p><strong>Beispiel:<\/strong> Du leistest Erste Hilfe und deine Jacke wird zerschnitten → Ersatz. Oder: Bei deinem verreisten Nachbarn platzt ein Rohr, du rufst den Notdienst → er muss dir die Kosten erstatten.<\/p>\n<p><strong>Nicht vertiefen. Nur den Namen und ein Beispiel parat haben.<\/strong><\/p>\n<h3 id=\"r-153-812-ungerechtfertigte-bereicherung\">15.3 § 812 — Ungerechtfertigte Bereicherung ★★<\/h3>\n<p><strong>Folie 24 (Original):<\/strong><\/p>\n<blockquote>\n<p>„– <strong>Ungerechtfertigte Bereicherung, § 812<\/strong> ⇒ <strong>Herausgabepflicht des durch Leistung, durch Eingriff oder in sonstiger Weise ohne Rechtsgrund Erlangten.<\/strong> Zweck: <strong>Rückabwicklung bzw. Ausgleich ungerechtfertigter Vermögensverschiebung (Kein Schadensersatz)<\/strong> zwischen demjenigen, der etwas eingebüßt hat und demjenigen, der etwas bekommen hat\n⇒ <strong>§ 812 I. 1. Alt.<\/strong> Die Bereicherung erfolgte aufgrund einer <strong>Leistung (bewusste zweckgerichtete Mehrung fremden Vermögens)<\/strong> des anderen (<strong>„Leistungskondiktion\"<\/strong>)\n⇒ <strong>§ 812 I, 2. Alt.<\/strong> Die Bereicherung erfolgte <strong>in sonstiger Weise („Eingriffskondiktion\")<\/strong>\n⇒ Das Erlangen erfolgte <strong>ohne Rechtsgrundlage<\/strong> (von Anfang an oder durch Wegfall der Rechtsgrundlage) oder <strong>wenn der – nicht vertraglich fixierte – Erfolg einer Leistung nicht eintritt<\/strong>\n⇒ Anspruch kann <strong>ausgeschlossen<\/strong> sein bei <strong>Entreicherung<\/strong> oder bei <strong>Kenntnis der Nichtschuld, §§ 814, 818 III<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>§ 812 ist das meistgeprüfte Werkzeug der ganzen Vorlesung.<\/strong> Es taucht in den Fällen 03d, 04e, 04f, 07c, 07d, 07e und 08a auf. Immer dann, wenn etwas rückabgewickelt werden muss.<\/p>\n<p><strong>Der Grundgedanke:<\/strong> Jemand hat etwas bekommen, ohne dass es dafür einen rechtlichen Grund gibt. Das muss zurück. <strong>Es ist kein Schadensersatz<\/strong> — es geht nicht um Schaden, sondern um die Abschöpfung einer grundlosen Bereicherung.<\/p>\n<p><strong>§ 812 ist der Rückholdienst des Zivilrechts.<\/strong> Immer wenn jemand etwas hat, für das es keinen rechtlichen Grund (mehr) gibt, sorgt § 812 dafür, dass es zurückgeht.<\/p>\n<ul>\n<li>Die Bank überweist dir versehentlich 500 Euro → § 812.<\/li>\n<li>Der Kaufvertrag war nichtig, du hast aber schon bezahlt → § 812.<\/li>\n<li>Du hast eine Rechnung bezahlt, die es gar nicht gab → § 812.<\/li>\n<\/ul>\n<p>Deshalb steht § 812 am Ende von so vielen Fällen: Erst wird geprüft, ob der Vertrag gilt. Wenn nein, kommt die Frage „und wie kommt jetzt wer wieder an sein Geld?\" — und die Antwort heißt fast immer § 812.<\/p>\n<h3 id=\"r-die-vier-voraussetzungen\">Die vier Voraussetzungen<\/h3>\n<pre><code>① etwas ERLANGT            (Geld, Eigentum, Besitz, Befreiung von einer Schuld)\n② durch LEISTUNG oder IN SONSTIGER WEISE\n③ OHNE RECHTSGRUND\n④ kein Ausschluss (§ 814 Kenntnis der Nichtschuld, § 818 III Entreicherung)\n<\/code><\/pre>\n<h3 id=\"r-leistungskondiktion-vs-eingriffskondiktion\">Leistungskondiktion vs. Eingriffskondiktion<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>§ 812 I S. 1, 1. Alt.<\/strong><\/th>\n<th><strong>§ 812 I S. 1, 2. Alt.<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Name<\/td>\n<td><strong>Leistungskondiktion<\/strong><\/td>\n<td><strong>Eingriffskondiktion<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Wie<\/td>\n<td>durch <strong>Leistung<\/strong> = bewusste zweckgerichtete Mehrung fremden Vermögens<\/td>\n<td><strong>in sonstiger Weise<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Beispiel<\/td>\n<td>Du überweist Geld auf einen nichtigen Vertrag hin<\/td>\n<td>Jemand bucht bei dir ab · jemand nutzt dein Grundstück als Parkplatz · Diebstahl<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Der Test:<\/strong> Hat der Bereicherte etwas bekommen, weil der andere es ihm <strong>bewusst und zweckgerichtet zugewendet<\/strong> hat? → Leistungskondiktion. Sonst → Eingriffskondiktion.<\/p>\n<p><strong>Sehr wichtige dritte Variante — § 812 I S. 2 (Zweckverfehlung).<\/strong> Das fehlte in deiner Liste:<\/p>\n<blockquote>\n<p>Wenn der mit einer Leistung bezweckte <strong>Erfolg nicht eintritt<\/strong>, steht das den Fällen des Satzes 1 gleich.<\/p>\n<\/blockquote>\n<p><strong>Fall 07 d) genau dazu:<\/strong> Jimmy gibt Nancy 500 € für den Umzug in eine gemeinsame Wohnung. Nancy will dann doch nicht zusammenziehen. Original:<\/p>\n<blockquote>\n<p><em>„Allerdings hatte sich Jimmy mit der Zahlung … die <\/em><em>Erreichung eines bestimmten Zweckes, nämlich des Zusammenziehens<\/em><em>, vorgestellt. <\/em><em>Der Nichteintritt des verfolgten Zwecks steht nach § 812 I, S. 2 den Fällen des S. 1 gleich<\/em><em>, so dass ein entsprechender Anspruch gegeben ist.\"<\/em><\/p>\n<\/blockquote>\n<h3 id=\"r-die-ausschlusse\">Die Ausschlüsse<\/h3>\n<table>\n<thead>\n<tr>\n<th>§<\/th>\n<th>Was<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>§ 814<\/strong><\/td>\n<td><strong>Kenntnis der Nichtschuld<\/strong> — du wusstest, dass du nicht schuldest, und hast trotzdem gezahlt<\/td>\n<td>Du zahlst eine verjährte Schuld, obwohl du weißt, dass du nicht musst → kein Rückforderungsrecht<\/td>\n<\/tr>\n<tr>\n<td><strong>§ 818 III<\/strong><\/td>\n<td><strong>Entreicherung<\/strong> — die Bereicherung ist nicht mehr im Vermögen vorhanden<\/td>\n<td>siehe Fall 07e<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Fall 07 e) — die dreifache Rückzahlung von RAZA.<\/strong> Anneliese bekommt 255 € statt 85 € zurück und verjubelt die 170 € auf einem Wochenendtrip. Original:<\/p>\n<blockquote>\n<p><em>„Der Anspruch ist nach <\/em><em>§ 812 I, S 1, 1. Fall (Leistungskondiktion)<\/em><em> gegeben, allerdings steht dem die <\/em><em>Einwendung des § 818 III<\/em><em> entgegen, da die Bereicherung im Vermögen der A nicht mehr vorhanden, sie somit <\/em><em>entreichert<\/em><em> und damit der Anspruch nach § 812 ausgeschlossen ist. <\/em><em>Es liegen auch keine ersparten Aufwendungen vor<\/em><em>, die ansonsten üblicherweise getätigt worden wären.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Der Kniff bei § 818 III — „ersparte Aufwendungen\":<\/strong> Hättest du das Geld für etwas ausgegeben, was du <strong>sowieso gekauft hättest<\/strong> (Miete, Lebensmittel), bist du <strong>nicht<\/strong> entreichert — du hast ja eigenes Geld gespart. Nur für <strong>Luxusausgaben, die du dir sonst nie geleistet hättest<\/strong>, greift § 818 III. Genau das prüft der Dozent im letzten Satz.<\/p>\n<h3 id=\"r-154-823-unerlaubte-handlung\">15.4 § 823 — Unerlaubte Handlung ★★★<\/h3>\n<p><strong>Folie 25 (Original, das komplette Prüfungsschema):<\/strong><\/p>\n<blockquote>\n<p>„– <strong>Unerlaubte Handlung, § 823<\/strong> (Klassiker: Verkehrsunfall, Schlägerei) ⇒ Schadenersatzpflicht für widerrechtlich verletzte Rechtsgüter (<strong>Prüfungsschema<\/strong>):\n⇒ Eine <strong>Verletzungshandlung<\/strong> (oder Unterlassung)\n⇒ verursacht <strong>adäquat kausal<\/strong> („conditio sine qua non\" + Adäquanz; <strong>„haftungsbegründende Kausalität\"<\/strong>)\n⇒ die <strong>Verletzung eines geschützten Rechtsgutes<\/strong>\n⇒ in <strong>rechtswidriger<\/strong> Weise (entfällt nur bei <strong>Rechtfertigungsgründen, z.B. Notwehr<\/strong>)\n⇒ durch eigenes <strong>Verschulden § 276<\/strong>\n⇒ Durch die Rechtsgutsverletzung entsteht adäquat kausal (<strong>„Haftungsausfüllende Kausalität\"<\/strong>)\n⇒ ein <strong>Schaden<\/strong>: Vergleich der Vermögenssituationen vor und nach der Verletzungshandlung, <strong>§§ 249, 252<\/strong>\n⇒ und berechtigt zum <strong>Schadensersatz<\/strong>: Herstellung des Zustands ohne das schädigende Ereignis; ausnahmsweise auch <strong>Immaterialschaden = Schmerzensgeld, § 253<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"r-das-prufungsschema-823-i-auswendig\">Das Prüfungsschema § 823 I (auswendig!)<\/h3>\n<pre><code>① Verletzungshandlung (Tun oder Unterlassen)\n② HAFTUNGSBEGRÜNDENDE Kausalität   (conditio sine qua non + Adäquanz)\n③ Rechtsgutsverletzung              (Leben, Körper, Gesundheit, Freiheit,\n                                     EIGENTUM, sonstiges Recht)\n④ Rechtswidrigkeit                  (indiziert; entfällt nur bei Rechtfertigung,\n                                     z.B. Notwehr, Einwilligung)\n⑤ Verschulden, § 276                (Vorsatz oder Fahrlässigkeit)\n⑥ HAFTUNGSAUSFÜLLENDE Kausalität    (Rechtsgutsverletzung → Schaden)\n⑦ Schaden, §§ 249, 252\n⇒ Schadensersatz; ggf. Schmerzensgeld § 253 II\n<\/code><\/pre>\n<h3 id=\"r-die-zwei-kausalitaten-das-pruft-der-dozent-wirklich\">★ Die zwei Kausalitäten — das prüft der Dozent wirklich<\/h3>\n<p>Das ist der Punkt, an dem Fall 07g steht und fällt:<\/p>\n<pre><code>Handlung  ──① haftungsBEGRÜNDENDE Kausalität──▶  Rechtsgutsverletzung\n                                                         │\n                                                         ② haftungsAUSFÜLLENDE\n                                                            Kausalität\n                                                         ▼\n                                                      Schaden\n<\/code><\/pre>\n<ul>\n<li><strong>Haftungsbegründend:<\/strong> War die Handlung ursächlich für die <em>Verletzung<\/em>?<\/li>\n<li><strong>Haftungsausfüllend:<\/strong> War die <em>Verletzung<\/em> ursächlich für den <em>Schaden<\/em>?<\/li>\n<\/ul>\n<p>Ein Anspruch kann an <strong>jeder<\/strong> der beiden Stufen scheitern.<\/p>\n<p><strong>Adäquanz — die Definition des Dozenten:<\/strong> Der eingetretene Erfolg darf <strong>nicht völlig atypisch<\/strong> sein, und die Kausalkette bricht, wenn ein Dritter <strong>unerwartet und nicht erwartbar<\/strong> eingreift.<\/p>\n<h3 id=\"r-253-ii-schmerzensgeld\">§ 253 II — Schmerzensgeld<\/h3>\n<blockquote>\n<p>Immaterieller Schaden ist nur in gesetzlich bestimmten Fällen zu ersetzen. <strong>§ 253 II:<\/strong> bei Verletzung von <strong>Körper, Gesundheit, Freiheit oder sexueller Selbstbestimmung<\/strong> gibt es eine billige Entschädigung in Geld.<\/p>\n<\/blockquote>\n<p><strong>Merke die Abgrenzung<\/strong> (das ist die Stelle, um die es in deiner Liste ging):\n- <strong>§ 249<\/strong> — Naturalrestitution, Vermögensvergleich vor/nach.\n- <strong>§ 252<\/strong> — <strong>entgangener Gewinn<\/strong>.\n- <strong>§ 253 II<\/strong> — <strong>Schmerzensgeld<\/strong>.<\/p>\n<p>Bei reinem Sachschaden (Auto kaputt) gibt es <strong>kein<\/strong> Schmerzensgeld.<\/p>\n<h3 id=\"r-831-verrichtungsgehilfe\">§ 831 — Verrichtungsgehilfe<\/h3>\n<p>Nicht mit § 278 verwechseln!<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>§ 278<\/strong> Erfüllungsgehilfe<\/th>\n<th><strong>§ 831<\/strong> Verrichtungsgehilfe<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Wo<\/td>\n<td>im <strong>Schuldverhältnis<\/strong> (Vertrag, c.i.c.)<\/td>\n<td>im <strong>Deliktsrecht<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Haftung<\/td>\n<td>für fremdes Verschulden <strong>wie für eigenes<\/strong><\/td>\n<td>für <strong>eigenes Auswahl-/Überwachungsverschulden<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Entlastung<\/td>\n<td><strong>keine<\/strong><\/td>\n<td><strong>möglich<\/strong> (Exkulpation): sorgfältig ausgewählt und überwacht<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-155-gefahrdungshaftung-7-stvg\">15.5 Gefährdungshaftung — § 7 StVG<\/h3>\n<p><strong>Folie 25 (Original):<\/strong><\/p>\n<blockquote>\n<p>„– <strong>Gefährdungshaftung<\/strong>, (wer die allgemeine Gefahr für die Öffentlichkeit abstrakt dadurch erhöht, dass er/sie einen Gefahrgegenstand besitzt, verwendet, „hält\", ist allein dadurch für bestimmte Körperschäden mitverantwortlich, <strong>§ 7 StrVG<\/strong> ⇒ <strong>Halterhaftung<\/strong>\"<\/p>\n<p>⚠️ Die Folie schreibt <strong>„StrVG\"<\/strong> — richtig ist <strong>StVG<\/strong> (Straßenverkehrsgesetz). Da hattest du recht.<\/p>\n<\/blockquote>\n<p><strong>Der Kern:<\/strong> Gefährdungshaftung ist <strong>verschuldensunabhängig<\/strong>. Der Halter haftet, weil er eine Gefahrenquelle betreibt — auch wenn er alles richtig gemacht hat.<\/p>\n<p><strong>Alltagsbeispiel:<\/strong> Dein Auto steht am Hang, die Handbremse versagt trotz frischer Wartung und es rollt in ein anderes Auto. Nach § 823 haftest du nicht (kein Verschulden). Nach <strong>§ 7 StVG<\/strong> haftest du trotzdem — als Halter.<\/p>\n<p><strong>Weitere Gefährdungshaftungen:<\/strong> § 833 Tierhalter, ProdHaftG, HaftPflG. Nur den Begriff kennen.<\/p>\n<h3 id=\"r-beispiele-aus-deinen-ubungsfallen-fall-07-f-und-g\">Beispiele aus deinen Übungsfällen (Fall 07 f und g)<\/h3>\n<p><strong>Fall 07 f) — der Verkehrsunfall.<\/strong> Jimmy missachtet die Vorfahrt, Anneliese wird verletzt. Der Dozent prüft <strong>jeden Schadensposten einzeln<\/strong> — genau das ist die Technik:<\/p>\n<table>\n<thead>\n<tr>\n<th>Posten<\/th>\n<th>Ergebnis<\/th>\n<th>Begründung (Original)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Reparatur 3.500 €<\/td>\n<td>✓<\/td>\n<td>Rechtsgut Eigentum, § 249<\/td>\n<\/tr>\n<tr>\n<td>… wenn das Auto nur 2.500 € wert wäre<\/td>\n<td><strong>nur 2.500 €<\/strong><\/td>\n<td><em>„eine Überschreitung der (tatsächlichen) Reparaturkosten um höchstens <\/em><em>30%<\/em><em> ist anerkannt worden\"<\/em> — hier überschritten<\/td>\n<\/tr>\n<tr>\n<td>Heilbehandlung Bein 1.500 €<\/td>\n<td>✓<\/td>\n<td>Rechtsgut Gesundheit<\/td>\n<\/tr>\n<tr>\n<td>Physio für vorbestehende Arthrose 1.800 €<\/td>\n<td>✗<\/td>\n<td><em>„weil schon keine schadensbegründende Kausalität vorliegt\"<\/em><\/td>\n<\/tr>\n<tr>\n<td>Schmerzensgeld 800 €<\/td>\n<td>✓<\/td>\n<td><em>„zwar immaterieller Schaden, aber zu ersetzen nach <\/em><em>§ 253 II<\/em><em>; 800 EUR liegt jedoch am oberen Rand\"<\/em><\/td>\n<\/tr>\n<tr>\n<td>Mietwagen Porsche 2.400 €<\/td>\n<td><strong>gekürzt<\/strong><\/td>\n<td><em>„Der Schaden besteht lediglich in der Nichtverfügbarkeit eines Autos <\/em><em>der Klasse, die bisher gefahren wurde<\/em><em>\"<\/em><\/td>\n<\/tr>\n<tr>\n<td>Lohnfortzahlung 2.800 €<\/td>\n<td>✗<\/td>\n<td><em>„A hat keinen Schaden, allerdings könnte der Arbeitgeber SE fordern\"<\/em><\/td>\n<\/tr>\n<tr>\n<td>Entgangener Geschäftsabschluss 5.000 €<\/td>\n<td><strong>fraglich<\/strong><\/td>\n<td><em>„Fraglich ist, ob unter normalen Umständen, <\/em><em>§ 252<\/em><em>, A diesen Gewinn beanspruchen konnte und nicht ihr Arbeitgeber\"<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Merke die 30-%-Regel<\/strong> (Reparatur vs. Wiederbeschaffungswert) und dass <strong>§ 253 II<\/strong> ausdrücklich genannt wird.<\/p>\n<p><strong>Fall 07 g) — der Trojaner am Arbeitsplatz.<\/strong> Denny legt aus Frust das System seines Arbeitgebers lahm; ein Konkurrent, der sich illegal aufgeschaltet hatte, wird mitbeschädigt. Der Dozent hakt das Schema Punkt für Punkt ab:<\/p>\n<blockquote>\n<p><em>„Ansprüche Arbeitgeber (AG) ⇒ D aus § 823 I: Verletzungshandlung: (+; Manipulation des Systems) · Rechtsgutsverletzung: (+, Eigentum/Nutzungsmöglichkeit/Vermögen) · Haftungsbegründende Kausalität: (+) · Rechtswidrigkeit: (+) · Verschulden: (+; Vorsatz) · Schaden: (+)<\/em>\n<em>Haftungsausfüllende Kausalität: <\/em><em>Releasewechsel (15.000 EUR)<\/em><em>: Fraglich ist, ob die Kosten … einen kausal … entstandenen Schaden darstellen, <\/em><em>da sie in einem halben Jahr ohnehin angefallen wären<\/em><em>. […] Hier wohl <\/em><em>(-)<\/em><em>. <\/em><em>Entgangener Gewinn (25.000 EUR): (+, §§ 823 I, 249, 252)<\/em><em>.<\/em>\n<em>Anspruch Konkurrent (K) ⇒ D auf 12.000 EUR aus § 823 I: […] jedoch ist die Frage, ob dem D diese Rechtsgutsverletzung im Sinne einer <\/em><em>Adäquanz<\/em><em> zuzurechnen ist. […] Insbesondere wird die <\/em><em>Kausalkette durch das völlig unübliche, nicht erwartbare widerrechtliche Eingreifen des Dritten K unterbrochen<\/em><em>. Damit liegt keine adäquat kausale Rechtsgutsverletzung vor. <\/em><em>(-)<\/em><em>\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Das ist ein IT-Fall — genau euer Studiengang.<\/strong> Die zwei Lehren:\n1. Ein Schaden, der <strong>sowieso eingetreten wäre<\/strong>, scheitert an der <strong>haftungsausfüllenden Kausalität<\/strong>.\n2. Das <strong>unerwartete rechtswidrige Eingreifen eines Dritten<\/strong> unterbricht die <strong>Adäquanz<\/strong> und damit die haftungsbegründende Kausalität.<\/p>\n<p>Schreib das Schema in der Klausur genau so ab — mit (+) und (-) hinter jedem Punkt. Das ist die Darstellungsform des Dozenten.<\/p>","text":"Worum es hier geht — in einfachen Worten Bisher ging es um Verträge, die man schließt . Jetzt geht es um Pflichten, die einem passieren — ohne dass irgendjemand etwas vereinbart hat. Du fährst jemandem ins Auto. Dir wird versehentlich Geld überwiesen. Du rutschst im Supermarkt aus, bevor du überhaupt etwas gekauft hast. Drei Normen musst du hier können: § 823 (jemand hat mir geschadet), § 812 (jemand hat etwas ohne Grund bekommen) und c.i.c. (Schutzpflichten schon vor dem Vertrag). Folie 23 (Original, Einleitung): „● Manche Schuldverhältnisse entstehen unabhängig vom Willen der Parteien , allein aufgrund von tatsächlichen Konstellationen , insbesondere Rechtsgutsverletzungen, an die die Rechtsordnung Rechte u. Pflichten knüpft\" Der Grundgedanke: Bis jetzt entstand alles durch Willenserklärungen. Hier entsteht ein Schuldverhältnis, ohne dass jemand es wollte — kraft Gesetzes. Der Unterschied in einem Satz: Einen Vertrag schließt du. Ein gesetzliches Schuldverhältnis passiert dir. Niemand fährt morgens los und denkt „heute schließe ich mal einen Vertrag über Schadensersatz\". Aber wenn du jemandem ins Auto fährst, schuldest du ihm Geld — ob du willst oder nicht . Keiner hat etwas vereinbart, keiner hat etwas unterschrieben. Das Gesetz knüpft die Pflicht einfach an das, was passiert ist. 15.1 c.i.c. — culpa in contrahendo, §§ 311 II, 241 II, 280 Folie 23 (Original): „– Culpa in contrahendo („c.i.c\", Verschulden bei Vertragsschluss) , Konkretisierung der allgemeinen Nebenpflichten von (künftigen) Vertragspartnern, die Rechtsgüter des anderen zu schützen , vertragsähnliches Schuldverhältnis, § 311 II ⇒ Schadensersatzpflicht nach §§ 280, 311 II, 241 II ⇒ Schuldverhältnis durch Vertragsverhandlungen, § 311 II ⇒ Pflichtverletzung, § 241 II ⇒ Vertretenmüssen für eigenes Verschulden; Maßstab: §§ 280 I 2, 276 I , Vorsatz und Fahrlässigkeit; ausnahmsweise auch Vertretenmüssen für Fremdverschulden ( „Erfüllungsgehilfe\" : wer im Pflichtenkreis des Schuldners mit dessen Wissen und Wollen zur Erfüllung der Verbindlichkeit tätig ist), § 278 ⇒ Kausaler Schaden : die Pflichtverletzung muss „conditio sine qua non\" (Bedingung, ohne welche nicht) für die Entstehung des Schadens sein, eingeschränkt durch „Adäquanz\" , sofern der eingetretene Erfolg nicht völlig atypisch ist oder durch das nicht erwartbare Eingreifen eines/r Dritten eine neue Kausalkette in Gang gesetzt wurde ⇒ Ausgleich des negativen Interesses, definiert in § 122 I. \" Was c.i.c. bedeutet: „Verschulden bei Vertragsverhandlungen\". Schon bevor ein Vertrag geschlossen ist, entstehen Schutzpflichten, sobald man in geschäftlichen Kontakt tritt. Der Klassiker: Du gehst in den Supermarkt, um einzukaufen, und rutschst auf einem Salatblatt aus. Kein Vertrag geschlossen — trotzdem haftet der Supermarkt. Weil mit dem Betreten schon ein vorvertragliches Schuldverhältnis nach § 311 II Nr. 2 entstanden ist. § 311 II Nr. 1–3: Vertragsverhandlungen (Nr. 1) · Vertragsanbahnung mit Einwirkungsmöglichkeit auf Rechtsgüter (Nr. 2) · ähnliche geschäftliche Kontakte (Nr. 3). Prüfungsschema c.i.c. Anspruch auf Schadensersatz aus §§ 311 II, 241 II, 280? ① Vorvertragliches Schuldverhältnis, § 311 II Nr. 1–3 ② Pflichtverletzung, § 241 II (Rücksicht auf Rechte, Rechtsgüter, Interessen) ③ Vertretenmüssen, §§ 280 I 2, 276 I (Vorsatz/Fahrlässigkeit) ggf. § 278 Erfüllungsgehilfe ④ Kausaler Schaden: conditio sine qua non + Adäquanz ⇒ Rechtsfolge: Ersatz des NEGATIVEN Interesses (§ 122 I als Definition) § 278 Erfüllungsgehilfe (Definition der Folie): „wer im Pflichtenkreis des Schuldners mit dessen Wissen und Wollen zur Erfüllung der Verbindlichkeit tätig ist\". → Der Schuldner haftet für dessen Verschulden wie für eigenes . Beispiel: Der Paketbote deines Onlineshops beschädigt beim Liefern deinen Türrahmen. Der Shop haftet über § 278. Kausalität — zwei Stufen: - conditio sine qua non: Wäre der Schaden ohne die Handlung ausgeblieben? (Wegdenken-Test) - Adäquanz: War der Erfolg nicht völlig atypisch? Die Kausalkette bricht, wenn ein Dritter unerwartet eingreift. Fälle aus der Übungssammlung 07 Fall 07 a) — Malware auf der Shop-Website. Nancy fängt sich Ransomware auf Jimmys Shop ein, ohne etwas gekauft zu haben. Original (gekürzt): „Nancy könnte einen Anspruch auf Schadensersatz in Höhe von 0,1 BTC gegen Jimmy aus §§ 311 II, 241 II Nr. 1, 280 „c.i.c.\" haben. […] Durch Jimmys Angebot im Netz und den Besuch von Nancy auf der Website, um eine Konsole zu kaufen, ist ein vorvertragliches Schuldverhältnis nach § 311 II Nr. 1 entstanden. Zu den Rücksichtnahmepflichten gegenüber potentiellen Kunden im Netz gehört es, die Angebotswebsites mit den bestmöglichen Virenschutzsystemen zu schützen. Dies hat Jimmy offenbar unterlassen ( „Pflichtverletzung\" ). Dieses Verhalten müsste Jimmy nach § 276 I vorsätzlich oder fahrlässig zu vertreten haben. […] Ersatzfähig … ist das negative Interesse (vgl. § 122) …\" Sehr relevant für dich als Informatiker: Der Dozent leitet aus § 241 II eine IT-Sicherheitspflicht ab. Merk dir das — es passt perfekt in einen Klausurfall für Informatikstudierende. Fall 07 b) — Fake-Bewertungen bei Checking.com. Denny bucht Konzerttickets, storniert dann alles wegen gefälschter Hotelbewertungen. Original: „Im Rahmen dieses Schuldverhältnisses muss auch das Interesse des D auf zutreffende Informationen als Kunde nach § 241 II beachtet werden. Dies hat C verletzt, indem er Fake-Bewertungen selbst erstellt oder auf seiner Website zugelassen hat. Dies geschah vorsätzlich und damit schuldhaft nach § 276. […] Dass D von sich aus entschieden hat, die Reise ganz abzusagen, liegt … nicht so fern, dass vom Beginn einer neuen Ursachenkette auszugehen wäre. Damit ist der Schaden adäquat kausal … verursacht worden.\" 15.2 GoA — Geschäftsführung ohne Auftrag, § 677 Folie 24 (Original): „– Geschäftsführung ohne Auftrag („GoA\"), § 677 (Klassiker: Erste-Hilfe-Leistung, Lottotippschein zur Annahmestelle) ⇒ Aufwendungsersatz, Herausgabepflicht \" Laut deiner Angabe hat der Dozent gesagt: nicht prüfungsrelevant. Der Vollständigkeit halber: Du besorgst ein fremdes Geschäft, ohne beauftragt zu sein. Wenn das dem Willen und Interesse des a
