nderen entspricht, bekommst du deine Aufwendungen ersetzt und musst herausgeben, was du erlangt hast. Beispiel: Du leistest Erste Hilfe und deine Jacke wird zerschnitten → Ersatz. Oder: Bei deinem verreisten Nachbarn platzt ein Rohr, du rufst den Notdienst → er muss dir die Kosten erstatten. Nicht vertiefen. Nur den Namen und ein Beispiel parat haben. 15.3 § 812 — Ungerechtfertigte Bereicherung ★★ Folie 24 (Original): „– Ungerechtfertigte Bereicherung, § 812 ⇒ Herausgabepflicht des durch Leistung, durch Eingriff oder in sonstiger Weise ohne Rechtsgrund Erlangten. Zweck: Rückabwicklung bzw. Ausgleich ungerechtfertigter Vermögensverschiebung (Kein Schadensersatz) zwischen demjenigen, der etwas eingebüßt hat und demjenigen, der etwas bekommen hat ⇒ § 812 I. 1. Alt. Die Bereicherung erfolgte aufgrund einer Leistung (bewusste zweckgerichtete Mehrung fremden Vermögens) des anderen ( „Leistungskondiktion\" ) ⇒ § 812 I, 2. Alt. Die Bereicherung erfolgte in sonstiger Weise („Eingriffskondiktion\") ⇒ Das Erlangen erfolgte ohne Rechtsgrundlage (von Anfang an oder durch Wegfall der Rechtsgrundlage) oder wenn der – nicht vertraglich fixierte – Erfolg einer Leistung nicht eintritt ⇒ Anspruch kann ausgeschlossen sein bei Entreicherung oder bei Kenntnis der Nichtschuld, §§ 814, 818 III \" § 812 ist das meistgeprüfte Werkzeug der ganzen Vorlesung. Es taucht in den Fällen 03d, 04e, 04f, 07c, 07d, 07e und 08a auf. Immer dann, wenn etwas rückabgewickelt werden muss. Der Grundgedanke: Jemand hat etwas bekommen, ohne dass es dafür einen rechtlichen Grund gibt. Das muss zurück. Es ist kein Schadensersatz — es geht nicht um Schaden, sondern um die Abschöpfung einer grundlosen Bereicherung. § 812 ist der Rückholdienst des Zivilrechts. Immer wenn jemand etwas hat, für das es keinen rechtlichen Grund (mehr) gibt, sorgt § 812 dafür, dass es zurückgeht. Die Bank überweist dir versehentlich 500 Euro → § 812. Der Kaufvertrag war nichtig, du hast aber schon bezahlt → § 812. Du hast eine Rechnung bezahlt, die es gar nicht gab → § 812. Deshalb steht § 812 am Ende von so vielen Fällen: Erst wird geprüft, ob der Vertrag gilt. Wenn nein, kommt die Frage „und wie kommt jetzt wer wieder an sein Geld?\" — und die Antwort heißt fast immer § 812. Die vier Voraussetzungen ① etwas ERLANGT (Geld, Eigentum, Besitz, Befreiung von einer Schuld) ② durch LEISTUNG oder IN SONSTIGER WEISE ③ OHNE RECHTSGRUND ④ kein Ausschluss (§ 814 Kenntnis der Nichtschuld, § 818 III Entreicherung) Leistungskondiktion vs. Eingriffskondiktion § 812 I S. 1, 1. Alt. § 812 I S. 1, 2. Alt. Name Leistungskondiktion Eingriffskondiktion Wie durch Leistung = bewusste zweckgerichtete Mehrung fremden Vermögens in sonstiger Weise Beispiel Du überweist Geld auf einen nichtigen Vertrag hin Jemand bucht bei dir ab · jemand nutzt dein Grundstück als Parkplatz · Diebstahl Der Test: Hat der Bereicherte etwas bekommen, weil der andere es ihm bewusst und zweckgerichtet zugewendet hat? → Leistungskondiktion. Sonst → Eingriffskondiktion. Sehr wichtige dritte Variante — § 812 I S. 2 (Zweckverfehlung). Das fehlte in deiner Liste: Wenn der mit einer Leistung bezweckte Erfolg nicht eintritt , steht das den Fällen des Satzes 1 gleich. Fall 07 d) genau dazu: Jimmy gibt Nancy 500 € für den Umzug in eine gemeinsame Wohnung. Nancy will dann doch nicht zusammenziehen. Original: „Allerdings hatte sich Jimmy mit der Zahlung … die Erreichung eines bestimmten Zweckes, nämlich des Zusammenziehens , vorgestellt. Der Nichteintritt des verfolgten Zwecks steht nach § 812 I, S. 2 den Fällen des S. 1 gleich , so dass ein entsprechender Anspruch gegeben ist.\" Die Ausschlüsse § Was Beispiel § 814 Kenntnis der Nichtschuld — du wusstest, dass du nicht schuldest, und hast trotzdem gezahlt Du zahlst eine verjährte Schuld, obwohl du weißt, dass du nicht musst → kein Rückforderungsrecht § 818 III Entreicherung — die Bereicherung ist nicht mehr im Vermögen vorhanden siehe Fall 07e Fall 07 e) — die dreifache Rückzahlung von RAZA. Anneliese bekommt 255 € statt 85 € zurück und verjubelt die 170 € auf einem Wochenendtrip. Original: „Der Anspruch ist nach § 812 I, S 1, 1. Fall (Leistungskondiktion) gegeben, allerdings steht dem die Einwendung des § 818 III entgegen, da die Bereicherung im Vermögen der A nicht mehr vorhanden, sie somit entreichert und damit der Anspruch nach § 812 ausgeschlossen ist. Es liegen auch keine ersparten Aufwendungen vor , die ansonsten üblicherweise getätigt worden wären.\" Der Kniff bei § 818 III — „ersparte Aufwendungen\": Hättest du das Geld für etwas ausgegeben, was du sowieso gekauft hättest (Miete, Lebensmittel), bist du nicht entreichert — du hast ja eigenes Geld gespart. Nur für Luxusausgaben, die du dir sonst nie geleistet hättest , greift § 818 III. Genau das prüft der Dozent im letzten Satz. 15.4 § 823 — Unerlaubte Handlung ★★★ Folie 25 (Original, das komplette Prüfungsschema): „– Unerlaubte Handlung, § 823 (Klassiker: Verkehrsunfall, Schlägerei) ⇒ Schadenersatzpflicht für widerrechtlich verletzte Rechtsgüter ( Prüfungsschema ): ⇒ Eine Verletzungshandlung (oder Unterlassung) ⇒ verursacht adäquat kausal („conditio sine qua non\" + Adäquanz; „haftungsbegründende Kausalität\" ) ⇒ die Verletzung eines geschützten Rechtsgutes ⇒ in rechtswidriger Weise (entfällt nur bei Rechtfertigungsgründen, z.B. Notwehr ) ⇒ durch eigenes Verschulden § 276 ⇒ Durch die Rechtsgutsverletzung entsteht adäquat kausal ( „Haftungsausfüllende Kausalität\" ) ⇒ ein Schaden : Vergleich der Vermögenssituationen vor und nach der Verletzungshandlung, §§ 249, 252 ⇒ und berechtigt zum Schadensersatz : Herstellung des Zustands ohne das schädigende Ereignis; ausnahmsweise auch Immaterialschaden = Schmerzensgeld, § 253 \" Das Prüfungsschema § 823 I (auswendig!) ① Verletzungshandlung (Tun oder Unterlassen) ② HAFTUNGSBEGRÜNDENDE Kausalität (conditio sine qua non + Adäquanz) ③ Rechtsgutsverletzung (Leben, Körper, Gesundheit, Freiheit, EIGENTUM, sonstiges Recht) ④ Rechtswidrigkeit (indiziert; entfällt nur bei Rechtfertigung, z.B. Notwehr, Einwilligung) ⑤ Verschulden, § 276 (Vorsatz oder Fahrlässigkeit) ⑥ HAFTUNGSAUSFÜLLENDE Kausalität (Rechtsgutsverletzung → Schaden) ⑦ Schaden, §§ 249, 252 ⇒ Schadensersatz; ggf. Schmerzensgeld § 253 II ★ Die zwei Kausalitäten — das prüft der Dozent wirklich Das ist der Punkt, an dem Fall 07g steht und fällt: Handlung ──① haftungsBEGRÜNDENDE Kausalität──▶ Rechtsgutsverletzung │ ② haftungsAUSFÜLLENDE Kausalität ▼ Schaden Haftungsbegründend: War die Handlung ursächlich für die Verletzung ? Haftungsausfüllend: War die Verletzung ursächlich für den Schaden ? Ein Anspruch kann an jeder der beiden Stufen scheitern. Adäquanz — die Definition des Dozenten: Der eingetretene Erfolg darf nicht völlig atypisch sein, und die Kausalkette bricht, wenn ein Dritter unerwartet und nicht erwartbar eingreift. § 253 II — Schmerzensgeld Immaterieller Schaden ist nur in gesetzlich bestimmten Fällen zu ersetzen. § 253 II: bei Verletzung von Körper, Gesundheit, Freiheit oder sexueller Selbstbestimmung gibt es eine billige Entschädigung in Geld. Merke die Abgrenzung (das ist die Stelle, um die es in deiner Liste ging): - § 249 — Naturalrestitution, Vermögensvergleich vor/nach. - § 252 — entgangener Gewinn . - § 253 II — Schmerzensgeld . Bei reinem Sachschaden (Auto kaputt) gibt es kein Schmerzensgeld. § 831 — Verrichtungsgehilfe Nicht mit § 278 verwechseln! § 278 Erfüllungsgehilfe § 831 Verrichtungsgehilfe Wo im Schuldverhältnis (Vertrag, c.i.c.) im Deliktsrecht Haftung für fremdes Verschulden wie für eigenes für eigenes Auswahl-/Überwachungsverschulden Entlastung keine möglich (Exkulpation): sorgfältig ausgewählt und überwacht 15.5 Gefährdungshaftung — § 7 StVG Folie 25 (Original): „– Gefährdungshaftung , (wer die allgemeine Gefahr für die Öffentlichkeit abstrakt dadurch erhöht, dass er/sie einen Gefahrgegenstand besitzt, verwendet, „hält\", ist allein dadurch für bestimmte Körperschäden mitverantwortlich, § 7 StrVG ⇒ Halterhaftung \" ⚠️ Die Folie schreibt „StrVG\" — richtig ist StVG (Straßenverkehrsgesetz). Da hattest du recht. Der Kern: Gefährdungshaftung ist verschuldensunabhängig . Der Halter haftet, weil er eine Gefahrenquelle betreibt — auch wenn er alles richtig gemacht hat. Alltagsbeispiel: Dein Auto steht am Hang, die Handbremse versagt trotz frischer Wartung und es rollt in ein anderes Auto. Nach § 823 haftest du nicht (kein Verschulden). Nach § 7 StVG haftest du trotzdem — als Halter. Weitere Gefährdungshaftungen: § 833 Tierhalter, ProdHaftG, HaftPflG. Nur den Begriff kennen. Beispiele aus deinen Übungsfällen (Fall 07 f und g) Fall 07 f) — der Verkehrsunfall. Jimmy missachtet die Vorfahrt, Anneliese wird verletzt. Der Dozent prüft jeden Schadensposten einzeln — genau das ist die Technik: Posten Ergebnis Begründung (Original) Reparatur 3.500 € ✓ Rechtsgut Eigentum, § 249 … wenn das Auto nur 2.500 € wert wäre nur 2.500 € „eine Überschreitung der (tatsächlichen) Reparaturkosten um höchstens 30% ist anerkannt worden\" — hier überschritten Heilbehandlung Bein 1.500 € ✓ Rechtsgut Gesundheit Physio für vorbestehende Arthrose 1.800 € ✗ „weil schon keine schadensbegründende Kausalität vorliegt\" Schmerzensgeld 800 € ✓ „zwar immaterieller Schaden, aber zu ersetzen nach § 253 II ; 800 EUR liegt jedoch am oberen Rand\" Mietwagen Porsche 2.400 € gekürzt „Der Schaden besteht lediglich in der Nichtverfügbarkeit eines Autos der Klasse, die bisher gefahren wurde \" Lohnfortzahlung 2.800 € ✗ „A hat keinen Schaden, allerdings könnte der Arbeitgeber SE fordern\" Entgangener Geschäftsabschluss 5.000 € fraglich „Fraglich ist, ob unter normalen Umständen, § 252 , A diesen Gewinn beanspruchen konnte und nicht ihr Arbeitgeber\" Merke die 30-%-Regel (Reparatur vs. Wiederbeschaffungswert) und dass § 253 II ausdrücklich genannt wird. Fall 07 g) — der Trojaner am Arbeitsplatz. Denny legt aus Frust das System seines Arbeitgebers lahm; ein Konkurrent, der sich illegal aufgeschaltet hatte, wird mitbeschädigt. Der Dozent hakt das Schema Punkt für Punkt ab: „Ansprüche Arbeitgeber (AG) ⇒ D aus § 823 I: Verletzungshandlung: (+; Manipulation des Systems) · Rechtsgutsverletzung: (+, Eigentum/Nutzungsmöglichkeit/Vermögen) · Haftungsbegründende Kausalität: (+) · Rechtswidrigkeit: (+) · Verschulden: (+; Vorsatz) · Schaden: (+) Haftungsausfüllende Kausalität: Releasewechsel (15.000 EUR) : Fraglich ist, ob die Kosten … einen kausal … entstandenen Schaden darstellen, da sie in einem halben Jahr ohnehin angefallen wären . […] Hier wohl (-) . Entgangener Gewinn (25.000 EUR): (+, §§ 823 I, 249, 252) . Anspruch Konkurrent (K) ⇒ D auf 12.000 EUR aus § 823 I: […] jedoch ist die Frage, ob dem D diese Rechtsgutsverletzung im Sinne einer Adäquanz zuzurechnen ist. […] Insbesondere wird die Kausalkette durch das völlig unübliche, nicht erwartbare widerrechtliche Eingreifen des Dritten K unterbrochen . Damit liegt keine adäquat kausale Rechtsgutsverletzung vor. (-) \" Das ist ein IT-Fall — genau euer Studiengang. Die zwei Lehren: 1. Ein Schaden, der sowieso eingetreten wäre , scheitert an der haftungsausfüllenden Kausalität . 2. Das unerwartete rechtswidrige Eingreifen eines Dritten unterbricht die Adäquanz und damit die haftungsbegründende Kausalität. Schreib das Schema in der Klausur genau so ab — mit (+) und (-) hinter jedem Punkt. Das ist die Darstellungsform des Dozenten.","words":2581,"mins":14},{"id":"r-16-vertragstypen--erfüllung","subject":"recht","num":"16","title":"16. Vertragstypen & Erfüllung","short":"Vertragstypen & Erfüllung","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nEin kurzer Überblick: Welche Vertragsarten gibt es, und was ist bei jeder geschuldet?<\/p>\n<p>Der mit Abstand wichtigste ist der <strong>Kaufvertrag, § 433<\/strong>. Den brauchst du in fast jedem Fall als Einstieg — er ist die häufigste Anspruchsgrundlage überhaupt.<\/p>\n<\/blockquote>\n<h3 id=\"r-161-433-der-kaufvertrag\">16.1 § 433 — Der Kaufvertrag ★★<\/h3>\n<p><strong>Die mit Abstand häufigste Anspruchsgrundlage.<\/strong> Lern den Inhalt auswendig:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Pflicht<\/th>\n<th>§<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Verkäufer<\/strong><\/td>\n<td>Sache <strong>übergeben<\/strong> + <strong>Eigentum verschaffen<\/strong> + frei von Sach- und Rechtsmängeln<\/td>\n<td>§ 433 I<\/td>\n<\/tr>\n<tr>\n<td><strong>Käufer<\/strong><\/td>\n<td><strong>Kaufpreis zahlen<\/strong> + Sache <strong>abnehmen<\/strong><\/td>\n<td>§ 433 II<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Das ist ein gegenseitiger Vertrag<\/strong> — beide Seiten haben Pflichten. Deshalb ist er für Minderjährige nie „lediglich rechtlich vorteilhaft\" (Kap. 6.3).<\/p>\n<p><strong>In der Klausur formulierst du:<\/strong><\/p>\n<blockquote>\n<p>„X könnte einen Anspruch auf Übergabe und Übereignung der Sache gegen Y aus <strong>§ 433 I S. 1<\/strong> haben.\"\n„X könnte einen Anspruch auf Zahlung des Kaufpreises gegen Y aus <strong>§ 433 II<\/strong> haben.\"<\/p>\n<\/blockquote>\n<p><strong>Achte auf die Richtung!<\/strong> Wer klagt worauf? Verkäufer klagt auf Geld → § 433 II. Käufer klagt auf die Sache → § 433 I.<\/p>\n<h3 id=\"r-162-631-werkvertrag\">16.2 § 631 — Werkvertrag<\/h3>\n<blockquote>\n<p>Der Unternehmer schuldet die <strong>Herstellung eines Werks<\/strong> (= einen <strong>Erfolg<\/strong>), der Besteller die <strong>Vergütung<\/strong>.\n<strong>§ 632:<\/strong> Ist keine Vergütung vereinbart, gilt die <strong>übliche<\/strong> als vereinbart.<\/p>\n<\/blockquote>\n<p><strong>Abgrenzung, die man abfragen kann:<\/strong>\n- <strong>Werkvertrag § 631:<\/strong> geschuldet ist der <strong>Erfolg<\/strong>. Autoreparatur, Dachdecken, Softwareerstellung nach Pflichtenheft.\n- <strong>Dienstvertrag § 611:<\/strong> geschuldet ist das <strong>Bemühen<\/strong>, nicht der Erfolg. Arztbehandlung, Arbeitsvertrag, Beratung.<\/p>\n<p><strong>Der Unterschied ganz praktisch — Friseur gegen Arzt:<\/strong><\/p>\n<p>Beim <strong>Friseur<\/strong> zahlst du für den <strong>fertigen Haarschnitt<\/strong>. Ist er schief, kannst du verlangen, dass nachgebessert wird. Der Erfolg ist geschuldet. → <strong>Werkvertrag, § 631<\/strong><\/p>\n<p>Beim <strong>Arzt<\/strong> zahlst du für die <strong>Behandlung<\/strong> — auch wenn du hinterher nicht gesund bist. Er schuldet sorgfältige Arbeit, nicht Heilung. Sonst könnte kein Arzt einen schwerkranken Patienten behandeln. → <strong>Dienstvertrag, § 611<\/strong><\/p>\n<p>Kommt in <strong>Fall 06c<\/strong> (Dachreparatur 15.000 €) und <strong>Fall 09a<\/strong> (Inspektion) vor.<\/p>\n<h3 id=\"r-163-929-ubereignung-beweglicher-sachen\">16.3 § 929 — Übereignung beweglicher Sachen<\/h3>\n<blockquote>\n<p><strong>Einigung + Übergabe.<\/strong> Beides ist nötig.<\/p>\n<\/blockquote>\n<p>Merkhilfe: <strong>„Einig sein und rübergeben.\"<\/strong> Das ist das <strong>Verfügungsgeschäft<\/strong> aus Kapitel 7 — die Norm, die du brauchst, wenn gefragt wird: <strong>Wer ist Eigentümer?<\/strong><\/p>\n<h3 id=\"r-164-243-gattungsschuld\">16.4 § 243 — Gattungsschuld<\/h3>\n<blockquote>\n<p>Bei einer nur der Gattung nach bestimmten Sache ist eine Sache <strong>mittlerer Art und Güte<\/strong> zu leisten (<strong>Abs. I<\/strong>). Hat der Schuldner <strong>das seinerseits Erforderliche getan<\/strong>, beschränkt sich das Schuldverhältnis auf diese Sache — <strong>Konkretisierung, Abs. II<\/strong>.<\/p>\n<\/blockquote>\n<p>Siehe Kapitel 14.3 und Fall 05d.<\/p>\n<h3 id=\"r-165-447-versendungskauf\">16.5 § 447 — Versendungskauf<\/h3>\n<blockquote>\n<p>Beim Versendungskauf geht die <strong>Gefahr des zufälligen Untergangs<\/strong> mit der <strong>Übergabe an den Frachtführer<\/strong> auf den Käufer über.<\/p>\n<\/blockquote>\n<p><strong>Aber:<\/strong> Beim <strong>Verbrauchsgüterkauf<\/strong> (Unternehmer → Verbraucher) gilt das nicht — dort trägt der Verkäufer die Gefahr bis zur Ablieferung (§ 475 II). Wenn also dein Paket auf dem Transport verloren geht, ist das beim Onlinekauf als Privatperson <strong>nicht dein Problem<\/strong>. Beim Kauf von Privat an Privat schon.<\/p>\n<h3 id=\"r-166-241a-unbestellte-leistung\">16.6 § 241a — Unbestellte Leistung<\/h3>\n<p>Siehe Kapitel 9.7. Kommt in <strong>zwei<\/strong> Übungsfällen vor (01e, 05c) — unterschätz das nicht.<\/p>","text":"Worum es hier geht — in einfachen Worten Ein kurzer Überblick: Welche Vertragsarten gibt es, und was ist bei jeder geschuldet? Der mit Abstand wichtigste ist der Kaufvertrag, § 433 . Den brauchst du in fast jedem Fall als Einstieg — er ist die häufigste Anspruchsgrundlage überhaupt. 16.1 § 433 — Der Kaufvertrag ★★ Die mit Abstand häufigste Anspruchsgrundlage. Lern den Inhalt auswendig: Pflicht § Verkäufer Sache übergeben + Eigentum verschaffen + frei von Sach- und Rechtsmängeln § 433 I Käufer Kaufpreis zahlen + Sache abnehmen § 433 II Das ist ein gegenseitiger Vertrag — beide Seiten haben Pflichten. Deshalb ist er für Minderjährige nie „lediglich rechtlich vorteilhaft\" (Kap. 6.3). In der Klausur formulierst du: „X könnte einen Anspruch auf Übergabe und Übereignung der Sache gegen Y aus § 433 I S. 1 haben.\" „X könnte einen Anspruch auf Zahlung des Kaufpreises gegen Y aus § 433 II haben.\" Achte auf die Richtung! Wer klagt worauf? Verkäufer klagt auf Geld → § 433 II. Käufer klagt auf die Sache → § 433 I. 16.2 § 631 — Werkvertrag Der Unternehmer schuldet die Herstellung eines Werks (= einen Erfolg ), der Besteller die Vergütung . § 632: Ist keine Vergütung vereinbart, gilt die übliche als vereinbart. Abgrenzung, die man abfragen kann: - Werkvertrag § 631: geschuldet ist der Erfolg . Autoreparatur, Dachdecken, Softwareerstellung nach Pflichtenheft. - Dienstvertrag § 611: geschuldet ist das Bemühen , nicht der Erfolg. Arztbehandlung, Arbeitsvertrag, Beratung. Der Unterschied ganz praktisch — Friseur gegen Arzt: Beim Friseur zahlst du für den fertigen Haarschnitt . Ist er schief, kannst du verlangen, dass nachgebessert wird. Der Erfolg ist geschuldet. → Werkvertrag, § 631 Beim Arzt zahlst du für die Behandlung — auch wenn du hinterher nicht gesund bist. Er schuldet sorgfältige Arbeit, nicht Heilung. Sonst könnte kein Arzt einen schwerkranken Patienten behandeln. → Dienstvertrag, § 611 Kommt in Fall 06c (Dachreparatur 15.000 €) und Fall 09a (Inspektion) vor. 16.3 § 929 — Übereignung beweglicher Sachen Einigung + Übergabe. Beides ist nötig. Merkhilfe: „Einig sein und rübergeben.\" Das ist das Verfügungsgeschäft aus Kapitel 7 — die Norm, die du brauchst, wenn gefragt wird: Wer ist Eigentümer? 16.4 § 243 — Gattungsschuld Bei einer nur der Gattung nach bestimmten Sache ist eine Sache mittlerer Art und Güte zu leisten ( Abs. I ). Hat der Schuldner das seinerseits Erforderliche getan , beschränkt sich das Schuldverhältnis auf diese Sache — Konkretisierung, Abs. II . Siehe Kapitel 14.3 und Fall 05d. 16.5 § 447 — Versendungskauf Beim Versendungskauf geht die Gefahr des zufälligen Untergangs mit der Übergabe an den Frachtführer auf den Käufer über. Aber: Beim Verbrauchsgüterkauf (Unternehmer → Verbraucher) gilt das nicht — dort trägt der Verkäufer die Gefahr bis zur Ablieferung (§ 475 II). Wenn also dein Paket auf dem Transport verloren geht, ist das beim Onlinekauf als Privatperson nicht dein Problem . Beim Kauf von Privat an Privat schon. 16.6 § 241a — Unbestellte Leistung Siehe Kapitel 9.7. Kommt in zwei Übungsfällen vor (01e, 05c) — unterschätz das nicht.","words":498,"mins":3},{"id":"r-anhang-a-post-it-plan","subject":"recht","num":"A","title":"Anhang A: Post-it-Plan","short":"Post-it-Plan","html":"<h3 id=\"r-bewertung-deiner-bisherigen-struktur\">Bewertung deiner bisherigen Struktur<\/h3>\n<p>Deine 5 Farben sind <strong>thematisch sinnvoll gewählt<\/strong> — aber es fehlen wichtige Normen, und die Gewichtung passt nicht ganz zum Bewertungsschema. Konkret:<\/p>\n<table>\n<thead>\n<tr>\n<th>Deine Farbe<\/th>\n<th>Bewertung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1 Anspruchsgrundlagen:<\/strong> §§ 433, 812, 823, 280/311 II<\/td>\n<td>✓ gut, aber <strong>§ 179, § 631 und § 346 fehlen<\/strong> — und § 179 ist genau das Thema der Probeklausur<\/td>\n<\/tr>\n<tr>\n<td><strong>2 Vertragsschluss &amp; Auslegung:<\/strong> §§ 133/157, 130, 145, 150<\/td>\n<td>✓ gute Auswahl. Ergänze <strong>§ 147<\/strong> (Frist) und <strong>§ 155<\/strong> (versteckter Dissens)<\/td>\n<\/tr>\n<tr>\n<td><strong>3 Minderjährigenrecht:<\/strong> §§ 106, 107, 108, 110<\/td>\n<td>✓ genau richtig. Ergänze <strong>§§ 104/105<\/strong> — die brauchst du für den Denny-Fall<\/td>\n<\/tr>\n<tr>\n<td><strong>4 Anfechtung &amp; Nichtigkeit:<\/strong> §§ 119, 123, 138, 134<\/td>\n<td>✓ gut. <strong>§ 142 und § 143 fehlen<\/strong> — ohne die kannst du die Anfechtung nicht sauber aufbauen<\/td>\n<\/tr>\n<tr>\n<td><strong>5 Vertretungsrecht:<\/strong> §§ 164, 177, 179, 181<\/td>\n<td>✓ sehr gut. Ergänze <strong>§ 168<\/strong> (Erlöschen) — das ist der Dreh- und Angelpunkt in Fall 06b und in der Probeklausur<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Grundsätzliches Problem:<\/strong> Alle fünf Farben liegen im <strong>vorderen BGB<\/strong> (§§ 104–181). Du hast keine Markierung für die Rückabwicklung (§§ 346, 355) und keine für den Schadensumfang (§§ 249, 252, 253). Genau die brauchst du am Ende jedes Falls.<\/p>\n<h3 id=\"r-empfohlene-6-farben-struktur\">Empfohlene 6-Farben-Struktur<\/h3>\n<p>Ich habe eine Farbe ergänzt und innerhalb der Farben ergänzt. Die <strong>fett<\/strong> markierten sind neu:<\/p>\n<p><strong>🔴 Farbe 1 — Anspruchsgrundlagen<\/strong> (dein Einstieg in jeden Fall)\n<code>§ 433<\/code> Kauf · <code>§ 631/632<\/code> Werkvertrag · <code>§ 812<\/code> Bereicherung · <code>§ 823<\/code> Delikt · <code>§ 280<\/code> i.V.m. <code>§ 311 II<\/code>, <code>§ 241 II<\/code> c.i.c. · <strong><code>§ 179<\/code><\/strong> falsus procurator · <strong><code>§ 346<\/code><\/strong> Rückgewähr · <strong><code>§ 929<\/code><\/strong> Übereignung<\/p>\n<p><strong>🟠 Farbe 2 — Vertragsschluss &amp; Auslegung<\/strong>\n<code>§ 133<\/code>/<code>§ 157<\/code> Auslegung · <code>§ 130<\/code> Zugang · <code>§ 145<\/code> Antrag · <strong><code>§ 147<\/code><\/strong> Annahmefrist · <code>§ 150<\/code> verspätete/geänderte Annahme · <strong><code>§ 151<\/code><\/strong> Annahme ohne Zugang · <strong><code>§ 155<\/code><\/strong> versteckter Dissens · <strong><code>§ 241a<\/code><\/strong> unbestellte Leistung<\/p>\n<p><strong>🟡 Farbe 3 — Minderjährigenrecht<\/strong>\n<strong><code>§ 104<\/code><\/strong> · <strong><code>§ 105<\/code><\/strong> · <code>§ 106<\/code> · <code>§ 107<\/code> · <code>§ 108<\/code> · <code>§ 110<\/code> · <strong><code>§ 184<\/code><\/strong> Genehmigung<\/p>\n<p><strong>🟢 Farbe 4 — Unwirksamkeit &amp; Anfechtung<\/strong>\n<code>§ 119<\/code> · <strong><code>§ 120<\/code><\/strong> · <strong><code>§ 121<\/code><\/strong> · <strong><code>§ 122<\/code><\/strong> · <code>§ 123<\/code> · <strong><code>§ 124<\/code><\/strong> · <strong><code>§ 142<\/code><\/strong> · <strong><code>§ 143<\/code><\/strong> · <code>§ 134<\/code> · <code>§ 138<\/code> · <strong><code>§ 125<\/code>/<code>§ 126<\/code><\/strong><\/p>\n<p><strong>🔵 Farbe 5 — Vertretungsrecht<\/strong>\n<code>§ 164<\/code> · <strong><code>§ 166 II<\/code><\/strong> Vollmachtsdefinition · <strong><code>§ 167<\/code><\/strong> Innen-/Außenvollmacht · <strong><code>§ 168<\/code><\/strong> Erlöschen · <code>§ 177<\/code> · <code>§ 179<\/code> · <code>§ 181<\/code><\/p>\n<p><strong>🟣 Farbe 6 — Lösung &amp; Schaden<\/strong> <em>(neu)<\/em>\n<strong><code>§ 249<\/code><\/strong> Naturalrestitution · <strong><code>§ 252<\/code><\/strong> entgangener Gewinn · <strong><code>§ 253<\/code><\/strong> Schmerzensgeld · <strong><code>§ 323<\/code><\/strong> Rücktritt · <strong><code>§ 349<\/code><\/strong> Rücktrittserklärung · <strong><code>§ 355<\/code><\/strong>/<strong><code>§ 312g<\/code><\/strong>/<strong><code>§ 13<\/code><\/strong>/<strong><code>§ 14<\/code><\/strong> Widerruf · <strong><code>§ 818 III<\/code><\/strong> Entreicherung<\/p>\n<h3 id=\"r-zwei-zusatz-tipps-zu-den-post-its\">Zwei Zusatz-Tipps zu den Post-its<\/h3>\n<ol>\n<li><strong>Beschrifte sie mit Stichwort, nicht mit der Nummer.<\/strong> Die Nummer siehst du beim Aufschlagen sowieso. Schreib „Zugang\", „Taschengeld\", „falsus procurator\" drauf — dann findest du sie unter Zeitdruck über den Begriff.<\/li>\n<li><strong>Der Dozent erlaubt „kurze handschriftliche Verweise und Kommentare\".<\/strong> Nutz das: Schreib neben § 110 an den Rand <code>nur wenn VOLLSTÄNDIG bewirkt — nicht bei Raten/Abo<\/code>. Neben § 138 <code>erst Abs. II, dann Abs. I!<\/code>. Neben § 179 <code>I = positives, II = negatives Interesse, III = Ausschluss<\/code>. Das sind genau die Stellen, an denen man unter Stress durcheinanderkommt.<\/li>\n<\/ol>","text":"Bewertung deiner bisherigen Struktur Deine 5 Farben sind thematisch sinnvoll gewählt — aber es fehlen wichtige Normen, und die Gewichtung passt nicht ganz zum Bewertungsschema. Konkret: Deine Farbe Bewertung 1 Anspruchsgrundlagen: §§ 433, 812, 823, 280/311 II ✓ gut, aber § 179, § 631 und § 346 fehlen — und § 179 ist genau das Thema der Probeklausur 2 Vertragsschluss & Auslegung: §§ 133/157, 130, 145, 150 ✓ gute Auswahl. Ergänze § 147 (Frist) und § 155 (versteckter Dissens) 3 Minderjährigenrecht: §§ 106, 107, 108, 110 ✓ genau richtig. Ergänze §§ 104/105 — die brauchst du für den Denny-Fall 4 Anfechtung & Nichtigkeit: §§ 119, 123, 138, 134 ✓ gut. § 142 und § 143 fehlen — ohne die kannst du die Anfechtung nicht sauber aufbauen 5 Vertretungsrecht: §§ 164, 177, 179, 181 ✓ sehr gut. Ergänze § 168 (Erlöschen) — das ist der Dreh- und Angelpunkt in Fall 06b und in der Probeklausur Grundsätzliches Problem: Alle fünf Farben liegen im vorderen BGB (§§ 104–181). Du hast keine Markierung für die Rückabwicklung (§§ 346, 355) und keine für den Schadensumfang (§§ 249, 252, 253). Genau die brauchst du am Ende jedes Falls. Empfohlene 6-Farben-Struktur Ich habe eine Farbe ergänzt und innerhalb der Farben ergänzt. Die fett markierten sind neu: 🔴 Farbe 1 — Anspruchsgrundlagen (dein Einstieg in jeden Fall) § 433 Kauf · § 631/632 Werkvertrag · § 812 Bereicherung · § 823 Delikt · § 280 i.V.m. § 311 II , § 241 II c.i.c. · § 179 falsus procurator · § 346 Rückgewähr · § 929 Übereignung 🟠 Farbe 2 — Vertragsschluss & Auslegung § 133 / § 157 Auslegung · § 130 Zugang · § 145 Antrag · § 147 Annahmefrist · § 150 verspätete/geänderte Annahme · § 151 Annahme ohne Zugang · § 155 versteckter Dissens · § 241a unbestellte Leistung 🟡 Farbe 3 — Minderjährigenrecht § 104 · § 105 · § 106 · § 107 · § 108 · § 110 · § 184 Genehmigung 🟢 Farbe 4 — Unwirksamkeit & Anfechtung § 119 · § 120 · § 121 · § 122 · § 123 · § 124 · § 142 · § 143 · § 134 · § 138 · § 125 / § 126 🔵 Farbe 5 — Vertretungsrecht § 164 · § 166 II Vollmachtsdefinition · § 167 Innen-/Außenvollmacht · § 168 Erlöschen · § 177 · § 179 · § 181 🟣 Farbe 6 — Lösung & Schaden (neu) § 249 Naturalrestitution · § 252 entgangener Gewinn · § 253 Schmerzensgeld · § 323 Rücktritt · § 349 Rücktrittserklärung · § 355 / § 312g / § 13 / § 14 Widerruf · § 818 III Entreicherung Zwei Zusatz-Tipps zu den Post-its Beschrifte sie mit Stichwort, nicht mit der Nummer. Die Nummer siehst du beim Aufschlagen sowieso. Schreib „Zugang\", „Taschengeld\", „falsus procurator\" drauf — dann findest du sie unter Zeitdruck über den Begriff. Der Dozent erlaubt „kurze handschriftliche Verweise und Kommentare\". Nutz das: Schreib neben § 110 an den Rand nur wenn VOLLSTÄNDIG bewirkt — nicht bei Raten/Abo . Neben § 138 erst Abs. II, dann Abs. I! . Neben § 179 I = positives, II = negatives Interesse, III = Ausschluss . Das sind genau die Stellen, an denen man unter Stress durcheinanderkommt.","words":545,"mins":3},{"id":"r-anhang-b-fehler-in-den-folien","subject":"recht","num":"B","title":"Anhang B: Fehler in den Folien","short":"Fehler in den Folien","html":"<p>Damit du nicht verunsichert wirst, wenn du die Folien liest. Diese Stellen sind in den Originalunterlagen falsch:<\/p>\n<table>\n<thead>\n<tr>\n<th>Folie<\/th>\n<th>Steht dort<\/th>\n<th>Richtig ist<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>12<\/strong><\/td>\n<td>„durch Erfüllung, <strong>§ 346<\/strong>\"<\/td>\n<td>Erfüllung = <strong>§ 362<\/strong>. § 346 ist der Rücktritt.<\/td>\n<\/tr>\n<tr>\n<td><strong>12<\/strong><\/td>\n<td>„durch Aufrechnung, <strong>§ 349<\/strong>\"<\/td>\n<td>Aufrechnung = <strong>§ 389<\/strong> (Erklärung § 388). § 349 ist die Rücktrittserklärung.<\/td>\n<\/tr>\n<tr>\n<td><strong>12<\/strong><\/td>\n<td>„durch Erlass, <strong>§ 389<\/strong>\"<\/td>\n<td>Erlass = <strong>§ 397<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><strong>25<\/strong><\/td>\n<td>„§ 7 <strong>StrVG<\/strong>\"<\/td>\n<td><strong>StVG<\/strong> (Straßenverkehrsgesetz)<\/td>\n<\/tr>\n<tr>\n<td><strong>30<\/strong><\/td>\n<td>„wirksame Anfechtung (<strong>§ 122<\/strong>)\"<\/td>\n<td><strong>§ 142<\/strong>. § 122 ist der Schadensersatz <em>nach<\/em> der Anfechtung.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Praktischer Rat:<\/strong> Bei den §§ auf Folie 12 schreibst du in der Klausur einfach nur die Stichworte („Erfüllung, Aufrechnung, Erlass\") ohne Paragraf. Der Dozent will an dieser Stelle die <strong>Struktur<\/strong> sehen, nicht die Normnummern der Nebenpunkte. Die anderen §§ auf Folie 12 (§ 214 Verjährung, § 273 Zurückbehaltung, § 320 nicht erfüllter Vertrag) sind <strong>korrekt<\/strong> — die kannst du bedenkenlos zitieren.<\/p>\n<p><strong>Was in den Folien KEIN Fehler ist<\/strong> (entgegen deiner Notiz): Folie 25 schreibt korrekt „Schmerzensgeld, § 253\" und „ein Schaden … §§ 249, 252\". Da ist nichts zu korrigieren.<\/p>","text":"Damit du nicht verunsichert wirst, wenn du die Folien liest. Diese Stellen sind in den Originalunterlagen falsch: Folie Steht dort Richtig ist 12 „durch Erfüllung, § 346 \" Erfüllung = § 362 . § 346 ist der Rücktritt. 12 „durch Aufrechnung, § 349 \" Aufrechnung = § 389 (Erklärung § 388). § 349 ist die Rücktrittserklärung. 12 „durch Erlass, § 389 \" Erlass = § 397 . 25 „§ 7 StrVG \" StVG (Straßenverkehrsgesetz) 30 „wirksame Anfechtung ( § 122 )\" § 142 . § 122 ist der Schadensersatz nach der Anfechtung. Praktischer Rat: Bei den §§ auf Folie 12 schreibst du in der Klausur einfach nur die Stichworte („Erfüllung, Aufrechnung, Erlass\") ohne Paragraf. Der Dozent will an dieser Stelle die Struktur sehen, nicht die Normnummern der Nebenpunkte. Die anderen §§ auf Folie 12 (§ 214 Verjährung, § 273 Zurückbehaltung, § 320 nicht erfüllter Vertrag) sind korrekt — die kannst du bedenkenlos zitieren. Was in den Folien KEIN Fehler ist (entgegen deiner Notiz): Folie 25 schreibt korrekt „Schmerzensgeld, § 253\" und „ein Schaden … §§ 249, 252\". Da ist nichts zu korrigieren.","words":182,"mins":1},{"id":"r-anhang-c-probeklausur","subject":"recht","num":"C","title":"Anhang C: Probeklausur","short":"Probeklausur","html":"<blockquote>\n<p>Du hast gesagt, du willst <strong>keine Lösung<\/strong> — der Dozent korrigiert sie persönlich, und die Methodenpunkte lernst du nur durchs Selbstschreiben. Also gibt es hier keine. Nur Werkzeug.<\/p>\n<\/blockquote>\n<h3 id=\"r-der-sachverhalt-in-kurze\">Der Sachverhalt in Kürze<\/h3>\n<p>Architektenwettbewerb München, Modelle werden an Mitglieder der Münchener Architektenkammer (MK) verkauft. Jimmy ist Mitglied, ist am Ausstellungstag verhindert, trifft zufällig seine frühere Studienkollegin Nancy, die erzählt, sie sei Partnerin in einem renommierten Architekturbüro. Jimmy bittet sie, für ihn hinzugehen und „ein schönes Modell\" zu erwerben; er würde sich „entsprechend bedanken\". Nancy kauft für 4.500 €. Jimmy findet das überteuert, erfährt, dass Nancy ihr Studium nie abgeschlossen hat, und will ihr <strong>die Vertretungsbefugnis rückwirkend entziehen<\/strong>. Die MK will den Kaufpreis.<\/p>\n<p><strong>Die Fragestellung lautet: „Welche Ansprüche hat die MK gegenüber Nancy?\"<\/strong><\/p>\n<h3 id=\"r-der-wichtigste-hinweis-vorab\">⚠️ Der wichtigste Hinweis vorab<\/h3>\n<p><strong>Lies die Frage dreimal.<\/strong> Gefragt ist nach Ansprüchen der MK gegen <strong>NANCY<\/strong> — nicht gegen Jimmy. Das ist die Weiche, an der die halbe Bearbeitung hängt. Der Sachverhalt endet mit „Gleichwohl möchte die MK den Kaufpreis von Jimmy\" — das ist ein Ablenkungsmanöver. Du musst trotzdem zuerst klären, ob ein Vertrag mit <strong>Jimmy<\/strong> zustande kam, denn davon hängt ab, ob überhaupt etwas gegen Nancy in Betracht kommt.<\/p>\n<h3 id=\"r-dein-werkzeugkasten-kapitel-im-lernblatt\">Dein Werkzeugkasten (Kapitel im Lernblatt)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Thema<\/th>\n<th>Kapitel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gutachtenstil + Anspruchsaufbau<\/td>\n<td><strong>3<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Stellvertretung, Voraussetzungen, § 179<\/td>\n<td><strong>10<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Vollmacht, Erlöschen, Widerruf<\/td>\n<td><strong>10.4<\/strong><\/td>\n<\/tr>\n<tr>\n<td>positives / negatives Interesse<\/td>\n<td><strong>10.5<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Vertragsschluss, Auslegung<\/td>\n<td><strong>9<\/strong>, <strong>4.3<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-der-ubungsfall-der-am-nachsten-dran-ist\">Der Übungsfall, der am nächsten dran ist<\/h3>\n<p><strong>Fall 06 b) (Kühlschrank).<\/strong> Gleiche Struktur: Vertreter handelt ohne (noch bestehende) Vertretungsmacht, der Vertretene verweigert, dann § 179 mit Prüfung von Abs. I / II / III. <strong>Arbeite den Fall vorher komplett durch<\/strong>, dann hast du das Muster im Kopf.<\/p>\n<h3 id=\"r-checkliste-diese-punkte-solltest-du-im-gutachten-ansprechen\">Checkliste: Diese Punkte solltest du im Gutachten ansprechen<\/h3>\n<p>Ohne dir zu sagen, wie sie ausgehen:<\/p>\n<ol>\n<li><strong>Obersatz(-sätze) bilden.<\/strong> Wer will was von wem woraus? Achtung: Möglicherweise brauchst du mehr als einen — und du musst begründen, warum du einen bestimmten Weg zuerst gehst.<\/li>\n<li><strong>Kam ein Vertrag zwischen MK und Jimmy zustande?<\/strong> Prüfe § 164 mit allen drei Voraussetzungen: eigene WE? im fremden Namen (Offenkundigkeit)? mit Vertretungsmacht?<\/li>\n<li><strong>Hatte Nancy Vertretungsmacht?<\/strong> Woher käme sie? Prüfe § 167 I (Innen- oder Außenvollmacht?). Und: Was genau umfasste sie — „ein schönes Modell erwerben\" ist auslegungsbedürftig (§§ 133, 157). Gab es eine <strong>Betragsgrenze<\/strong>?<\/li>\n<li><strong>Der rückwirkende Entzug.<\/strong> Jimmy „will Nancy die Vertretungsbefugnis rückwirkend entziehen\". Schau dir § 168 S. 3 genau an und überlege, <strong>ab wann<\/strong> ein Widerruf wirkt (Kap. 10.4, das ⚠️-Kästchen).<\/li>\n<li><strong>Falls keine oder überschrittene Vertretungsmacht:<\/strong> § 177 I — schwebende Unwirksamkeit. Hat Jimmy genehmigt oder verweigert? Woran erkennst du das im Sachverhalt?<\/li>\n<li><strong>§ 179 durchprüfen.<\/strong> Welcher Absatz? Wusste Nancy, dass sie keine (ausreichende) Vertretungsmacht hatte, oder war sie gutgläubig? Davon hängt ab, ob positives oder negatives Interesse geschuldet ist.<\/li>\n<li><strong>§ 179 III prüfen.<\/strong> Kannte die MK den Mangel oder hätte sie ihn kennen müssen? Hier ist Argumentation gefragt, kein festes Ergebnis.<\/li>\n<li><strong>Nebenthemen, die im Sachverhalt angelegt sind<\/strong> — sprich sie kurz an, verzettel dich nicht:\n   - Der Preis von 4.500 €: Ist das ein Fall für § 138? (Prüf die Reihenfolge Abs. II vor Abs. I und frag dich, ob du überhaupt genug Sachverhalt für das objektive <em>und<\/em> das subjektive Element hast.)\n   - Nancys falsche Angabe über ihren Abschluss: Ist das relevant für <strong>Jimmys<\/strong> Verhältnis zu Nancy? Könnte § 119 II oder § 123 eine Rolle spielen — und <strong>gegenüber wem<\/strong>?\n   - Jimmys „ich bedanke mich entsprechend\": Was für ein Grundverhältnis ist das? Spielt das für die Vollmacht eine Rolle (§ 168 S. 1)?<\/li>\n<li><strong>Schlusssatz nicht vergessen.<\/strong> 5 Punkte. „Folglich hat die MK gegen Nancy einen Anspruch auf … aus § …\" bzw. „… keinen Anspruch.\"<\/li>\n<\/ol>\n<h3 id=\"r-so-gehst-du-beim-schreiben-vor\">So gehst du beim Schreiben vor<\/h3>\n<pre><code>0–5 min    Sachverhalt lesen, Personen aufmalen:\n              MK ──── Kaufvertrag? ────  Jimmy\n                \\                        /\n                 \\  Nancy (Vertreterin) /\n           Pfeile: wer will was von wem?\n5–8 min    Normen im BGB aufschlagen: 164, 167, 168, 177, 179 (Farbe 5!)\n              Gliederung auf dem Konzeptblatt: A. MK → Jimmy   B. MK → Nancy\n8–35 min   Schreiben. Konjunktiv. Einrücken. (+)/(-).\n35–40 min  Schlusssätze prüfen: Steht am Ende jedes Prüfungspunkts ein &quot;Folglich&quot;?\n<\/code><\/pre>\n<h3 id=\"r-wenn-du-sie-geschrieben-hast\">Wenn du sie geschrieben hast<\/h3>\n<p>Schick mir deinen Text. Ich korrigiere ihn <strong>hart<\/strong> gegen das Original-Bewertungsschema aus Fall 07c — also Punkt für Punkt: Methode (10), Anspruchsgrundlage (10), inhaltliche Prüfung (30), Ergebnisformulierung (5). Und ich sage dir, wo du Punkte liegen gelassen hast, nicht nur, was inhaltlich falsch war.<\/p>","text":"Du hast gesagt, du willst keine Lösung — der Dozent korrigiert sie persönlich, und die Methodenpunkte lernst du nur durchs Selbstschreiben. Also gibt es hier keine. Nur Werkzeug. Der Sachverhalt in Kürze Architektenwettbewerb München, Modelle werden an Mitglieder der Münchener Architektenkammer (MK) verkauft. Jimmy ist Mitglied, ist am Ausstellungstag verhindert, trifft zufällig seine frühere Studienkollegin Nancy, die erzählt, sie sei Partnerin in einem renommierten Architekturbüro. Jimmy bittet sie, für ihn hinzugehen und „ein schönes Modell\" zu erwerben; er würde sich „entsprechend bedanken\". Nancy kauft für 4.500 €. Jimmy findet das überteuert, erfährt, dass Nancy ihr Studium nie abgeschlossen hat, und will ihr die Vertretungsbefugnis rückwirkend entziehen . Die MK will den Kaufpreis. Die Fragestellung lautet: „Welche Ansprüche hat die MK gegenüber Nancy?\" ⚠️ Der wichtigste Hinweis vorab Lies die Frage dreimal. Gefragt ist nach Ansprüchen der MK gegen NANCY — nicht gegen Jimmy. Das ist die Weiche, an der die halbe Bearbeitung hängt. Der Sachverhalt endet mit „Gleichwohl möchte die MK den Kaufpreis von Jimmy\" — das ist ein Ablenkungsmanöver. Du musst trotzdem zuerst klären, ob ein Vertrag mit Jimmy zustande kam, denn davon hängt ab, ob überhaupt etwas gegen Nancy in Betracht kommt. Dein Werkzeugkasten (Kapitel im Lernblatt) Thema Kapitel Gutachtenstil + Anspruchsaufbau 3 Stellvertretung, Voraussetzungen, § 179 10 Vollmacht, Erlöschen, Widerruf 10.4 positives / negatives Interesse 10.5 Vertragsschluss, Auslegung 9 , 4.3 Der Übungsfall, der am nächsten dran ist Fall 06 b) (Kühlschrank). Gleiche Struktur: Vertreter handelt ohne (noch bestehende) Vertretungsmacht, der Vertretene verweigert, dann § 179 mit Prüfung von Abs. I / II / III. Arbeite den Fall vorher komplett durch , dann hast du das Muster im Kopf. Checkliste: Diese Punkte solltest du im Gutachten ansprechen Ohne dir zu sagen, wie sie ausgehen: Obersatz(-sätze) bilden. Wer will was von wem woraus? Achtung: Möglicherweise brauchst du mehr als einen — und du musst begründen, warum du einen bestimmten Weg zuerst gehst. Kam ein Vertrag zwischen MK und Jimmy zustande? Prüfe § 164 mit allen drei Voraussetzungen: eigene WE? im fremden Namen (Offenkundigkeit)? mit Vertretungsmacht? Hatte Nancy Vertretungsmacht? Woher käme sie? Prüfe § 167 I (Innen- oder Außenvollmacht?). Und: Was genau umfasste sie — „ein schönes Modell erwerben\" ist auslegungsbedürftig (§§ 133, 157). Gab es eine Betragsgrenze ? Der rückwirkende Entzug. Jimmy „will Nancy die Vertretungsbefugnis rückwirkend entziehen\". Schau dir § 168 S. 3 genau an und überlege, ab wann ein Widerruf wirkt (Kap. 10.4, das ⚠️-Kästchen). Falls keine oder überschrittene Vertretungsmacht: § 177 I — schwebende Unwirksamkeit. Hat Jimmy genehmigt oder verweigert? Woran erkennst du das im Sachverhalt? § 179 durchprüfen. Welcher Absatz? Wusste Nancy, dass sie keine (ausreichende) Vertretungsmacht hatte, oder war sie gutgläubig? Davon hängt ab, ob positives oder negatives Interesse geschuldet ist. § 179 III prüfen. Kannte die MK den Mangel oder hätte sie ihn kennen müssen? Hier ist Argumentation gefragt, kein festes Ergebnis. Nebenthemen, die im Sachverhalt angelegt sind — sprich sie kurz an, verzettel dich nicht: - Der Preis von 4.500 €: Ist das ein Fall für § 138? (Prüf die Reihenfolge Abs. II vor Abs. I und frag dich, ob du überhaupt genug Sachverhalt für das objektive und das subjektive Element hast.) - Nancys falsche Angabe über ihren Abschluss: Ist das relevant für Jimmys Verhältnis zu Nancy? Könnte § 119 II oder § 123 eine Rolle spielen — und gegenüber wem ? - Jimmys „ich bedanke mich entsprechend\": Was für ein Grundverhältnis ist das? Spielt das für die Vollmacht eine Rolle (§ 168 S. 1)? Schlusssatz nicht vergessen. 5 Punkte. „Folglich hat die MK gegen Nancy einen Anspruch auf … aus § …\" bzw. „… keinen Anspruch.\" So gehst du beim Schreiben vor 0–5 min Sachverhalt lesen, Personen aufmalen: MK ──── Kaufvertrag? ──── Jimmy \\ / \\ Nancy (Vertreterin) / Pfeile: wer will was von wem? 5–8 min Normen im BGB aufschlagen: 164, 167, 168, 177, 179 (Farbe 5!) Gliederung auf dem Konzeptblatt: A. MK → Jimmy B. MK → Nancy 8–35 min Schreiben. Konjunktiv. Einrücken. (+)/(-). 35–40 min Schlusssätze prüfen: Steht am Ende jedes Prüfungspunkts ein \"Folglich\"? Wenn du sie geschrieben hast Schick mir deinen Text. Ich korrigiere ihn hart gegen das Original-Bewertungsschema aus Fall 07c — also Punkt für Punkt: Methode (10), Anspruchsgrundlage (10), inhaltliche Prüfung (30), Ergebnisformulierung (5). Und ich sage dir, wo du Punkte liegen gelassen hast, nicht nur, was inhaltlich falsch war.","words":716,"mins":4},{"id":"r-anhang-d-selbsttest","subject":"recht","num":"D","title":"Anhang D: Selbsttest","short":"Selbsttest","html":"<p>Deck die rechte Spalte ab. Wenn du eine Frage nicht in <strong>20 Sekunden<\/strong> beantworten kannst, geh zurück ins Kapitel.<\/p>\n<h3 id=\"r-definitionen-die-musst-du-wortlich-konnen\">Definitionen (die musst du wörtlich können)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Frage<\/th>\n<th>Antwort<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Definiere die Willenserklärung.<\/td>\n<td>Auf einen rechtlichen Erfolg gerichtete menschliche Willensäußerung.<\/td>\n<\/tr>\n<tr>\n<td>Definiere den Zugang unter Abwesenden.<\/td>\n<td>Eine WE geht zu, wenn sie so in den Machtbereich des Empfängers gelangt, dass eine Kenntnisnahme möglich ist und nach der Verkehrsanschauung damit gerechnet werden kann.<\/td>\n<\/tr>\n<tr>\n<td>Definiere den Irrtum.<\/td>\n<td>Das unbewusste Auseinanderfallen von Wille und Erklärung.<\/td>\n<\/tr>\n<tr>\n<td>Definiere die Sittenwidrigkeit.<\/td>\n<td>Verstoß gegen das Anstandsgefühl aller billig und gerecht Denkenden.<\/td>\n<\/tr>\n<tr>\n<td>Definiere die Drohung.<\/td>\n<td>Das Inaussichtstellen eines empfindlichen Übels, das der Drohende nach der Vorstellung des Erklärenden beeinflussen kann.<\/td>\n<\/tr>\n<tr>\n<td>Definiere die Täuschung.<\/td>\n<td>Vorspiegelung falscher oder Entstellung bzw. Verschweigen wesentlicher Tatsachen, wodurch ein Irrtum ausgelöst wird.<\/td>\n<\/tr>\n<tr>\n<td>Definiere den Erfüllungsgehilfen (§ 278).<\/td>\n<td>Wer im Pflichtenkreis des Schuldners mit dessen Wissen und Wollen zur Erfüllung der Verbindlichkeit tätig ist.<\/td>\n<\/tr>\n<tr>\n<td>Definiere die Leistung i.S.d. § 812.<\/td>\n<td>Bewusste zweckgerichtete Mehrung fremden Vermögens.<\/td>\n<\/tr>\n<tr>\n<td>Definiere die Mahnung.<\/td>\n<td>Einseitige empfangsbedürftige Aufforderung zur Leistung, § 286 I.<\/td>\n<\/tr>\n<tr>\n<td>Was sind die essentialia negotii?<\/td>\n<td>Vertragspartner, Vertragsgegenstand, Gegenleistung — so, dass nur noch „ja\" gesagt werden muss.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-unterschiede-typische-kurzfragen\">Unterschiede (typische Kurzfragen)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Frage<\/th>\n<th>Antwort<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Öffentliches Recht vs. Privatrecht?<\/td>\n<td>Über-/Unterordnung (mind. eine Partei hoheitlich) vs. Gleichordnung/Koordination.<\/td>\n<\/tr>\n<tr>\n<td>Einwendung vs. Einrede?<\/td>\n<td>Einwendung: Anspruch existiert nicht (mehr), von Amts wegen zu prüfen. Einrede: Anspruch existiert, ist aber nicht durchsetzbar — nur wenn die Partei sie vorträgt.<\/td>\n<\/tr>\n<tr>\n<td>Verpflichtungs- vs. Verfügungsgeschäft?<\/td>\n<td>Verpflichtung begründet nur eine Pflicht (§ 433). Verfügung wirkt unmittelbar auf ein Recht ein (§ 929: Einigung + Übergabe). Beide sind rechtlich unabhängig (Abstraktionsprinzip).<\/td>\n<\/tr>\n<tr>\n<td>Vertreter vs. Bote?<\/td>\n<td>Vertreter gibt eine <strong>eigene<\/strong> WE mit eigener Entschließungsfreiheit ab (§ 164). Bote überbringt nur eine <strong>fremde<\/strong>, fertige WE. Irrtum: § 119 vs. § 120.<\/td>\n<\/tr>\n<tr>\n<td>Anfechtung vs. Widerruf?<\/td>\n<td>Anfechtung braucht einen <strong>Grund<\/strong> (§§ 119, 123) und wirkt <strong>ex tunc<\/strong>. Widerruf (§ 355) braucht <strong>keinen Grund<\/strong>, nur die 14-Tage-Frist, und gilt nur für Verbraucher.<\/td>\n<\/tr>\n<tr>\n<td>Anfechtung vs. Rücktritt?<\/td>\n<td>Anfechtung = Willensmangel, ex tunc, Rückabwicklung über § 812. Rücktritt = Leistungsstörung, <strong>ex nunc<\/strong>, Rückabwicklung über § 346 (Rückgewährschuldverhältnis).<\/td>\n<\/tr>\n<tr>\n<td>Positives vs. negatives Interesse?<\/td>\n<td>Positiv: gestellt werden wie bei <strong>erfülltem<\/strong> Vertrag (inkl. entgangenem Gewinn, § 252) — §§ 179 I, 325/280. Negativ: gestellt werden, als hätte man sich <strong>nie getroffen<\/strong> — §§ 122, 179 II, c.i.c.<\/td>\n<\/tr>\n<tr>\n<td>§ 278 vs. § 831?<\/td>\n<td>§ 278: Erfüllungsgehilfe im Schuldverhältnis, Haftung für fremdes Verschulden wie für eigenes, <strong>keine Entlastung<\/strong>. § 831: Verrichtungsgehilfe im Deliktsrecht, eigenes Auswahlverschulden, <strong>Exkulpation möglich<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>Leistungs- vs. Eingriffskondiktion?<\/td>\n<td>§ 812 I 1, 1. Alt.: durch <strong>Leistung<\/strong> (bewusste zweckgerichtete Zuwendung). 2. Alt.: <strong>in sonstiger Weise<\/strong> (Abbuchung, Eingriff).<\/td>\n<\/tr>\n<tr>\n<td>Haftungsbegründende vs. haftungsausfüllende Kausalität?<\/td>\n<td>Begründend: Handlung → Rechtsgutsverletzung. Ausfüllend: Rechtsgutsverletzung → Schaden.<\/td>\n<\/tr>\n<tr>\n<td>Gattungs- vs. Stückschuld?<\/td>\n<td>Gattung (§ 243): irgendeine Sache mittlerer Art und Güte, kein § 275 bei Untergang eines Stücks, bis zur Konkretisierung (§ 243 II). Stückschuld: genau diese Sache.<\/td>\n<\/tr>\n<tr>\n<td>Werkvertrag vs. Dienstvertrag?<\/td>\n<td>§ 631: geschuldet ist der <strong>Erfolg<\/strong>. § 611: geschuldet ist das <strong>Bemühen<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-schemata-aus-dem-kopf-aufschreiben\">Schemata (aus dem Kopf aufschreiben)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Frage<\/th>\n<th>Antwort<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Die drei Stufen des Anspruchsaufbaus?<\/td>\n<td>Entstanden → Erloschen (Einwendungen) → Durchsetzbar (Einreden).<\/td>\n<\/tr>\n<tr>\n<td>Die vier Schritte des Gutachtenstils?<\/td>\n<td>Obersatz → Definition der TBM → Subsumtion → Schlusssatz.<\/td>\n<\/tr>\n<tr>\n<td>Die drei Voraussetzungen des § 164?<\/td>\n<td>Eigene WE, im fremden Namen (Offenkundigkeit), mit Vertretungsmacht.<\/td>\n<\/tr>\n<tr>\n<td>Die drei Voraussetzungen der Anfechtung?<\/td>\n<td>Anfechtungserklärung (§ 143), Anfechtungsgrund (§§ 119/120/123), Frist (§ 121/124).<\/td>\n<\/tr>\n<tr>\n<td>Das Prüfungsschema § 823 I (7 Punkte)?<\/td>\n<td>Verletzungshandlung → haftungsbegründende Kausalität → Rechtsgutsverletzung → Rechtswidrigkeit → Verschulden (§ 276) → haftungsausfüllende Kausalität → Schaden (§§ 249, 252).<\/td>\n<\/tr>\n<tr>\n<td>Die 4 Voraussetzungen des § 812?<\/td>\n<td>Etwas erlangt → durch Leistung oder in sonstiger Weise → ohne Rechtsgrund → kein Ausschluss (§ 814, § 818 III).<\/td>\n<\/tr>\n<tr>\n<td>Das Minderjährigen-Schema?<\/td>\n<td>§ 104/105 (&lt; 7) → § 106 → § 107 lediglich rechtl. Vorteil → Einwilligung → § 110 → §§ 112/113 → sonst § 108 I schwebend unwirksam.<\/td>\n<\/tr>\n<tr>\n<td>Der AGB-Dreischritt?<\/td>\n<td>§ 305 I (sind es AGB?) → § 305 II (einbezogen?) → §§ 307–309 (inhaltlich zulässig?).<\/td>\n<\/tr>\n<tr>\n<td>Die 5 Unwirksamkeitsgründe?<\/td>\n<td>§§ 104 ff. Geschäftsfähigkeit · §§ 125 ff. Form · § 134 Verbot · § 138 Sitte/Wucher · § 142 Anfechtung.<\/td>\n<\/tr>\n<tr>\n<td>Das Verzugsschema?<\/td>\n<td>Fälliger durchsetzbarer Anspruch → Mahnung (§ 286 I) oder entbehrlich (§ 286 II) → Nichtleistung → Verschulden (§§ 286 IV, 276).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-fallen-hier-verliert-man-punkte\">Fallen (hier verliert man Punkte)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Frage<\/th>\n<th>Antwort<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kommt es beim Zugang auf die tatsächliche Kenntnisnahme an?<\/td>\n<td><strong>Nein<\/strong> — nur auf die übliche. Auch dann nicht, wenn der Absender weiß, dass der Empfänger verreist ist.<\/td>\n<\/tr>\n<tr>\n<td>Ist ein wirtschaftlich vorteilhafter Kauf für einen Minderjährigen „lediglich rechtlich vorteilhaft\"?<\/td>\n<td><strong>Nein.<\/strong> Die Pflicht zur Gegenleistung ist ein rechtlicher Nachteil.<\/td>\n<\/tr>\n<tr>\n<td>Rettet § 110 einen Ratenkauf?<\/td>\n<td><strong>Nein<\/strong> — die Leistung muss <strong>vollständig<\/strong> bewirkt sein. Erst mit der letzten Rate wird der Vertrag wirksam.<\/td>\n<\/tr>\n<tr>\n<td>Prüfst du § 138 I oder § 138 II zuerst?<\/td>\n<td><strong>Immer § 138 II zuerst<\/strong> — Spezialnorm vor allgemeiner Norm.<\/td>\n<\/tr>\n<tr>\n<td>Ist der Irrtum über den Wert einer Sache anfechtbar?<\/td>\n<td><strong>Nein.<\/strong> Nur über <strong>wertbildende Faktoren<\/strong> (§ 119 II), nicht über den Wert selbst.<\/td>\n<\/tr>\n<tr>\n<td>Ist der Motivirrtum anfechtbar?<\/td>\n<td><strong>Nein.<\/strong> Kein gesetzlich anerkannter Anfechtungsgrund.<\/td>\n<\/tr>\n<tr>\n<td>Gibt es § 122 Schadensersatz auch bei § 123?<\/td>\n<td><strong>Nein.<\/strong> Wer täuscht oder droht, ist nicht schutzwürdig. Nur bei §§ 119, 120.<\/td>\n<\/tr>\n<tr>\n<td>Kann man eine Vollmacht rückwirkend entziehen?<\/td>\n<td><strong>Nein.<\/strong> Der Widerruf (§ 168 S. 3) wirkt nur <strong>ex nunc<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>Wahrt ein Fax die Schriftform des § 126?<\/td>\n<td><strong>Nein<\/strong> — beim Empfänger kommt keine eigenhändige Unterschrift an.<\/td>\n<\/tr>\n<tr>\n<td>Gibt es beim Kauf im Ladengeschäft ein Widerrufsrecht?<\/td>\n<td><strong>Nein<\/strong> — nur bei § 312b (außerhalb Geschäftsräumen) und § 312c (Fernabsatz). Umtausch im Laden ist Kulanz.<\/td>\n<\/tr>\n<tr>\n<td>Muss ein Verbraucher unbestellte Ware zurückschicken?<\/td>\n<td><strong>Nein<\/strong>, § 241a. Weder zahlen noch zurückschicken noch sich melden.<\/td>\n<\/tr>\n<tr>\n<td>Wo steht das Schmerzensgeld?<\/td>\n<td><strong>§ 253 II.<\/strong> § 252 ist der entgangene Gewinn, § 249 die Naturalrestitution.<\/td>\n<\/tr>\n<tr>\n<td>Kann ein Geschäftsunfähiger Bote sein?<\/td>\n<td><strong>Ja<\/strong> — er gibt keine eigene WE ab, sondern überbringt nur eine fremde (Fall 03a).<\/td>\n<\/tr>\n<tr>\n<td>Was passiert bei fehlender Offenkundigkeit?<\/td>\n<td>Der Vertreter wird <strong>selbst<\/strong> Vertragspartner, § 164 II — und kann sich nicht auf seinen inneren Willen berufen.<\/td>\n<\/tr>\n<tr>\n<td>Was passiert bei widersprechenden AGB?<\/td>\n<td>Versteckter Dissens § 155 — beide Klauseln fallen weg, <strong>das Gesetz greift ein<\/strong> (Fall 05e).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Deck die rechte Spalte ab. Wenn du eine Frage nicht in 20 Sekunden beantworten kannst, geh zurück ins Kapitel. Definitionen (die musst du wörtlich können) Frage Antwort Definiere die Willenserklärung. Auf einen rechtlichen Erfolg gerichtete menschliche Willensäußerung. Definiere den Zugang unter Abwesenden. Eine WE geht zu, wenn sie so in den Machtbereich des Empfängers gelangt, dass eine Kenntnisnahme möglich ist und nach der Verkehrsanschauung damit gerechnet werden kann. Definiere den Irrtum. Das unbewusste Auseinanderfallen von Wille und Erklärung. Definiere die Sittenwidrigkeit. Verstoß gegen das Anstandsgefühl aller billig und gerecht Denkenden. Definiere die Drohung. Das Inaussichtstellen eines empfindlichen Übels, das der Drohende nach der Vorstellung des Erklärenden beeinflussen kann. Definiere die Täuschung. Vorspiegelung falscher oder Entstellung bzw. Verschweigen wesentlicher Tatsachen, wodurch ein Irrtum ausgelöst wird. Definiere den Erfüllungsgehilfen (§ 278). Wer im Pflichtenkreis des Schuldners mit dessen Wissen und Wollen zur Erfüllung der Verbindlichkeit tätig ist. Definiere die Leistung i.S.d. § 812. Bewusste zweckgerichtete Mehrung fremden Vermögens. Definiere die Mahnung. Einseitige empfangsbedürftige Aufforderung zur Leistung, § 286 I. Was sind die essentialia negotii? Vertragspartner, Vertragsgegenstand, Gegenleistung — so, dass nur noch „ja\" gesagt werden muss. Unterschiede (typische Kurzfragen) Frage Antwort Öffentliches Recht vs. Privatrecht? Über-/Unterordnung (mind. eine Partei hoheitlich) vs. Gleichordnung/Koordination. Einwendung vs. Einrede? Einwendung: Anspruch existiert nicht (mehr), von Amts wegen zu prüfen. Einrede: Anspruch existiert, ist aber nicht durchsetzbar — nur wenn die Partei sie vorträgt. Verpflichtungs- vs. Verfügungsgeschäft? Verpflichtung begründet nur eine Pflicht (§ 433). Verfügung wirkt unmittelbar auf ein Recht ein (§ 929: Einigung + Übergabe). Beide sind rechtlich unabhängig (Abstraktionsprinzip). Vertreter vs. Bote? Vertreter gibt eine eigene WE mit eigener Entschließungsfreiheit ab (§ 164). Bote überbringt nur eine fremde , fertige WE. Irrtum: § 119 vs. § 120. Anfechtung vs. Widerruf? Anfechtung braucht einen Grund (§§ 119, 123) und wirkt ex tunc . Widerruf (§ 355) braucht keinen Grund , nur die 14-Tage-Frist, und gilt nur für Verbraucher. Anfechtung vs. Rücktritt? Anfechtung = Willensmangel, ex tunc, Rückabwicklung über § 812. Rücktritt = Leistungsstörung, ex nunc , Rückabwicklung über § 346 (Rückgewährschuldverhältnis). Positives vs. negatives Interesse? Positiv: gestellt werden wie bei erfülltem Vertrag (inkl. entgangenem Gewinn, § 252) — §§ 179 I, 325/280. Negativ: gestellt werden, als hätte man sich nie getroffen — §§ 122, 179 II, c.i.c. § 278 vs. § 831? § 278: Erfüllungsgehilfe im Schuldverhältnis, Haftung für fremdes Verschulden wie für eigenes, keine Entlastung . § 831: Verrichtungsgehilfe im Deliktsrecht, eigenes Auswahlverschulden, Exkulpation möglich . Leistungs- vs. Eingriffskondiktion? § 812 I 1, 1. Alt.: durch Leistung (bewusste zweckgerichtete Zuwendung). 2. Alt.: in sonstiger Weise (Abbuchung, Eingriff). Haftungsbegründende vs. haftungsausfüllende Kausalität? Begründend: Handlung → Rechtsgutsverletzung. Ausfüllend: Rechtsgutsverletzung → Schaden. Gattungs- vs. Stückschuld? Gattung (§ 243): irgendeine Sache mittlerer Art und Güte, kein § 275 bei Untergang eines Stücks, bis zur Konkretisierung (§ 243 II). Stückschuld: genau diese Sache. Werkvertrag vs. Dienstvertrag? § 631: geschuldet ist der Erfolg . § 611: geschuldet ist das Bemühen . Schemata (aus dem Kopf aufschreiben) Frage Antwort Die drei Stufen des Anspruchsaufbaus? Entstanden → Erloschen (Einwendungen) → Durchsetzbar (Einreden). Die vier Schritte des Gutachtenstils? Obersatz → Definition der TBM → Subsumtion → Schlusssatz. Die drei Voraussetzungen des § 164? Eigene WE, im fremden Namen (Offenkundigkeit), mit Vertretungsmacht. Die drei Voraussetzungen der Anfechtung? Anfechtungserklärung (§ 143), Anfechtungsgrund (§§ 119/120/123), Frist (§ 121/124). Das Prüfungsschema § 823 I (7 Punkte)? Verletzungshandlung → haftungsbegründende Kausalität → Rechtsgutsverletzung → Rechtswidrigkeit → Verschulden (§ 276) → haftungsausfüllende Kausalität → Schaden (§§ 249, 252). Die 4 Voraussetzungen des § 812? Etwas erlangt → durch Leistung oder in sonstiger Weise → ohne Rechtsgrund → kein Ausschluss (§ 814, § 818 III). Das Minderjährigen-Schema? § 104/105 (< 7) → § 106 → § 107 lediglich rechtl. Vorteil → Einwilligung → § 110 → §§ 112/113 → sonst § 108 I schwebend unwirksam. Der AGB-Dreischritt? § 305 I (sind es AGB?) → § 305 II (einbezogen?) → §§ 307–309 (inhaltlich zulässig?). Die 5 Unwirksamkeitsgründe? §§ 104 ff. Geschäftsfähigkeit · §§ 125 ff. Form · § 134 Verbot · § 138 Sitte/Wucher · § 142 Anfechtung. Das Verzugsschema? Fälliger durchsetzbarer Anspruch → Mahnung (§ 286 I) oder entbehrlich (§ 286 II) → Nichtleistung → Verschulden (§§ 286 IV, 276). Fallen (hier verliert man Punkte) Frage Antwort Kommt es beim Zugang auf die tatsächliche Kenntnisnahme an? Nein — nur auf die übliche. Auch dann nicht, wenn der Absender weiß, dass der Empfänger verreist ist. Ist ein wirtschaftlich vorteilhafter Kauf für einen Minderjährigen „lediglich rechtlich vorteilhaft\"? Nein. Die Pflicht zur Gegenleistung ist ein rechtlicher Nachteil. Rettet § 110 einen Ratenkauf? Nein — die Leistung muss vollständig bewirkt sein. Erst mit der letzten Rate wird der Vertrag wirksam. Prüfst du § 138 I oder § 138 II zuerst? Immer § 138 II zuerst — Spezialnorm vor allgemeiner Norm. Ist der Irrtum über den Wert einer Sache anfechtbar? Nein. Nur über wertbildende Faktoren (§ 119 II), nicht über den Wert selbst. Ist der Motivirrtum anfechtbar? Nein. Kein gesetzlich anerkannter Anfechtungsgrund. Gibt es § 122 Schadensersatz auch bei § 123? Nein. Wer täuscht oder droht, ist nicht schutzwürdig. Nur bei §§ 119, 120. Kann man eine Vollmacht rückwirkend entziehen? Nein. Der Widerruf (§ 168 S. 3) wirkt nur ex nunc . Wahrt ein Fax die Schriftform des § 126? Nein — beim Empfänger kommt keine eigenhändige Unterschrift an. Gibt es beim Kauf im Ladengeschäft ein Widerrufsrecht? Nein — nur bei § 312b (außerhalb Geschäftsräumen) und § 312c (Fernabsatz). Umtausch im Laden ist Kulanz. Muss ein Verbraucher unbestellte Ware zurückschicken? Nein , § 241a. Weder zahlen noch zurückschicken noch sich melden. Wo steht das Schmerzensgeld? § 253 II. § 252 ist der entgangene Gewinn, § 249 die Naturalrestitution. Kann ein Geschäftsunfähiger Bote sein? Ja — er gibt keine eigene WE ab, sondern überbringt nur eine fremde (Fall 03a). Was passiert bei fehlender Offenkundigkeit? Der Vertreter wird selbst Vertragspartner, § 164 II — und kann sich nicht auf seinen inneren Willen berufen. Was passiert bei widersprechenden AGB? Versteckter Dissens § 155 — beide Klauseln fallen weg, das Gesetz greift ein (Fall 05e).","words":995,"mins":5},{"id":"r-anhang-e-die-übungsfälle-als-landkarte","subject":"recht","num":"E","title":"Anhang E: Die Übungsfälle als Landkarte","short":"Die Übungsfälle als Landkarte","html":"<p>Falls du gezielt üben willst — das ist drin:<\/p>\n<table>\n<thead>\n<tr>\n<th>Datei<\/th>\n<th>Fälle<\/th>\n<th>Kernthemen<\/th>\n<th>Kapitel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>01 Willenserklärungen<\/strong><\/td>\n<td>a–e<\/td>\n<td>Handlungs-/Erklärungswille, obj. Empfängerhorizont, invitatio, § 241a<\/td>\n<td>4<\/td>\n<\/tr>\n<tr>\n<td><strong>02 Wirksamwerden<\/strong><\/td>\n<td>a–f<\/td>\n<td>§ 130 Zugang, § 147, Erklärungs-/Empfangsbote, Sphärentheorie, § 162 I analog, <strong>Musterlösung im Gutachtenstil (d)<\/strong><\/td>\n<td>5, 3<\/td>\n<\/tr>\n<tr>\n<td><strong>03 Minderjährigenrecht<\/strong><\/td>\n<td>a–f<\/td>\n<td>§§ 104/105/106/107/108/110, § 187 II, Bote, § 929, n-tv-Fall, <strong>Übungsklausur EA Sports<\/strong><\/td>\n<td>6, 7<\/td>\n<\/tr>\n<tr>\n<td><strong>04 Gesetzliche Unwirksamkeit<\/strong><\/td>\n<td>e, f<\/td>\n<td>§ 134 (Cannabis), § 138 II (Wucher), § 812<\/td>\n<td>8, 15<\/td>\n<\/tr>\n<tr>\n<td><strong>05 Vertragsschluss<\/strong><\/td>\n<td>a–e<\/td>\n<td>§§ 145, 147, 150, 241a, 243, 275, 447, 155 (AGB/Gerichtsstand)<\/td>\n<td>9, 14<\/td>\n<\/tr>\n<tr>\n<td><strong>06 Vertretungsrecht<\/strong><\/td>\n<td>a–e<\/td>\n<td>Bote vs. Vertreter (§ 120), § 168 Erlöschen, § 179 I/III, Untervollmacht, Anscheinsvollmacht, § 181<\/td>\n<td>10<\/td>\n<\/tr>\n<tr>\n<td><strong>07 Gesetzl. Schuldverhältnisse<\/strong><\/td>\n<td>a–g<\/td>\n<td>c.i.c. (Malware, Fake-Bewertungen), § 812 I S.1/S.2, § 818 III, § 823 (Unfall, Trojaner), <strong>Bewertungsschema in c)<\/strong><\/td>\n<td>15<\/td>\n<\/tr>\n<tr>\n<td><strong>08 Vertragsauflösung<\/strong><\/td>\n<td>a–f<\/td>\n<td>§ 355/312g/312b (Widerruf), § 119 II, § 119 I 2. Fall, Motivirrtum, § 123 I 2. Fall<\/td>\n<td>11, 12<\/td>\n<\/tr>\n<tr>\n<td><strong>09 Rücktritt<\/strong><\/td>\n<td>a, b<\/td>\n<td>§§ 323, 324, 346, 349, 325/280, positives vs. negatives Interesse, <strong>2 handschriftliche Schemata<\/strong><\/td>\n<td>13<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Meine Empfehlung für deine Lernreihenfolge:<\/strong>\n1. Kapitel 3 (Methode) lesen — zweimal.\n2. Fall <strong>02 d)<\/strong> im Original lesen. Das ist die einzige vollständig ausformulierte Musterlösung mit Klammerkommentaren („Obersatz\", „Definition\", „Subsumtion\"). Sie ist deine Schreibvorlage.\n3. Fall <strong>06 b)<\/strong> durcharbeiten — nächster Verwandter der Probeklausur.\n4. Fall <strong>03 e)<\/strong> durcharbeiten — Minderjährige + Abstraktionsprinzip in einem.\n5. Fall <strong>07 f)/g)<\/strong> überfliegen — § 823 mit IT-Bezug.\n6. Dann die Probeklausur schreiben.<\/p>\n<hr>\n<p><em>Erstellt aus: WRuDS Gesamtfoliensatz (31 Folien, Stephan Wike), Übungsfälle 01–09 mit Lösungen inkl. der Bildlösungen und handschriftlichen Flipcharts, WRuDS Probeklausur. Stand: August 2026.<\/em><\/p>","text":"Falls du gezielt üben willst — das ist drin: Datei Fälle Kernthemen Kapitel 01 Willenserklärungen a–e Handlungs-/Erklärungswille, obj. Empfängerhorizont, invitatio, § 241a 4 02 Wirksamwerden a–f § 130 Zugang, § 147, Erklärungs-/Empfangsbote, Sphärentheorie, § 162 I analog, Musterlösung im Gutachtenstil (d) 5, 3 03 Minderjährigenrecht a–f §§ 104/105/106/107/108/110, § 187 II, Bote, § 929, n-tv-Fall, Übungsklausur EA Sports 6, 7 04 Gesetzliche Unwirksamkeit e, f § 134 (Cannabis), § 138 II (Wucher), § 812 8, 15 05 Vertragsschluss a–e §§ 145, 147, 150, 241a, 243, 275, 447, 155 (AGB/Gerichtsstand) 9, 14 06 Vertretungsrecht a–e Bote vs. Vertreter (§ 120), § 168 Erlöschen, § 179 I/III, Untervollmacht, Anscheinsvollmacht, § 181 10 07 Gesetzl. Schuldverhältnisse a–g c.i.c. (Malware, Fake-Bewertungen), § 812 I S.1/S.2, § 818 III, § 823 (Unfall, Trojaner), Bewertungsschema in c) 15 08 Vertragsauflösung a–f § 355/312g/312b (Widerruf), § 119 II, § 119 I 2. Fall, Motivirrtum, § 123 I 2. Fall 11, 12 09 Rücktritt a, b §§ 323, 324, 346, 349, 325/280, positives vs. negatives Interesse, 2 handschriftliche Schemata 13 Meine Empfehlung für deine Lernreihenfolge: 1. Kapitel 3 (Methode) lesen — zweimal. 2. Fall 02 d) im Original lesen. Das ist die einzige vollständig ausformulierte Musterlösung mit Klammerkommentaren („Obersatz\", „Definition\", „Subsumtion\"). Sie ist deine Schreibvorlage. 3. Fall 06 b) durcharbeiten — nächster Verwandter der Probeklausur. 4. Fall 03 e) durcharbeiten — Minderjährige + Abstraktionsprinzip in einem. 5. Fall 07 f)/g) überfliegen — § 823 mit IT-Bezug. 6. Dann die Probeklausur schreiben. Erstellt aus: WRuDS Gesamtfoliensatz (31 Folien, Stephan Wike), Übungsfälle 01–09 mit Lösungen inkl. der Bildlösungen und handschriftlichen Flipcharts, WRuDS Probeklausur. Stand: August 2026.","words":266,"mins":1},{"id":"r-anhang-f-was-du-wirklich-auswendig-können-musst","subject":"recht","num":"F","title":"Anhang F: Was du wirklich auswendig können musst","short":"Was du wirklich auswendig können musst","html":"<p>Das ist die Liste, die du in den letzten Tagen vor der Klausur durchgehst. <strong>Alles, was hier nicht steht, musst du verstehen — nicht auswendig lernen.<\/strong> Du hast das BGB dabei; für den Wortlaut der Paragraphen ist gesorgt.<\/p>\n<h3 id=\"r-f1-definitionen-diese-acht-wortlich\">F.1 Definitionen — diese acht wörtlich<\/h3>\n<p>Warum wörtlich? Weil du sie im Gutachten <strong>hinschreiben<\/strong> musst, bevor du subsumierst. Ohne Definition hängt die Subsumtion in der Luft, und genau dafür gibt es Punkte.<\/p>\n<table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Begriff<\/th>\n<th>Der Satz<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>Willenserklärung<\/strong><\/td>\n<td>Auf einen rechtlichen Erfolg gerichtete menschliche Willensäußerung.<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>Zugang<\/strong> (unter Abwesenden)<\/td>\n<td>Eine WE geht zu, wenn sie so in den Machtbereich des Empfängers gelangt, dass eine Kenntnisnahme möglich ist und nach der Verkehrsanschauung damit gerechnet werden kann.<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>Irrtum<\/strong><\/td>\n<td>Das unbewusste Auseinanderfallen von Wille und Erklärung.<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>Sittenwidrigkeit<\/strong><\/td>\n<td>Verstoß gegen das Anstandsgefühl aller billig und gerecht Denkenden.<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><strong>Drohung<\/strong><\/td>\n<td>Das Inaussichtstellen eines empfindlichen Übels, das der Drohende nach der Vorstellung des Erklärenden beeinflussen kann.<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><strong>Arglistige Täuschung<\/strong><\/td>\n<td>Vorspiegelung falscher oder Entstellung bzw. Verschweigen wesentlicher Tatsachen, wodurch ein Irrtum ausgelöst wird. Arglist = der Täuschende weiß, dass seine Täuschung zur WE führt.<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><strong>Leistung<\/strong> (i. S. d. § 812)<\/td>\n<td>Bewusste zweckgerichtete Mehrung fremden Vermögens.<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><strong>Erfüllungsgehilfe<\/strong> (§ 278)<\/td>\n<td>Wer im Pflichtenkreis des Schuldners mit dessen Wissen und Wollen zur Erfüllung der Verbindlichkeit tätig ist.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Dazu noch zwei kurze, die du eher als Formel brauchst:<\/strong><\/p>\n<ul>\n<li><strong>essentialia negotii<\/strong> = Vertragspartner · Vertragsgegenstand · Gegenleistung („nur noch ja sagen müssen\")<\/li>\n<li><strong>Objektiver Empfängerhorizont<\/strong> = nicht was der Erklärende dachte, sondern was ein verständiger Dritter in der Lage des Empfängers verstehen durfte (§§ 133, 157)<\/li>\n<\/ul>\n<h3 id=\"r-f2-sieben-schemata-die-reihenfolge-im-kopf\">F.2 Sieben Schemata — die Reihenfolge im Kopf<\/h3>\n<p>Nicht wörtlich, aber <strong>die Schrittfolge muss ohne Nachdenken kommen<\/strong>. Schreib sie dir dreimal auf ein leeres Blatt, dann sitzen sie.<\/p>\n<table>\n<thead>\n<tr>\n<th>Schema<\/th>\n<th>Schritte<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Gutachtenstil<\/strong><\/td>\n<td>Obersatz → Definition → Subsumtion → Schlusssatz<\/td>\n<\/tr>\n<tr>\n<td><strong>Anspruchsaufbau<\/strong><\/td>\n<td>entstanden? → erloschen? (Einwendungen) → durchsetzbar? (Einreden)<\/td>\n<\/tr>\n<tr>\n<td><strong>Minderjährige<\/strong><\/td>\n<td>§ 104/105 (&lt; 7) → § 106 → § 107 lediglich Vorteil → Einwilligung → § 110 → §§ 112/113 → sonst § 108 schwebend unwirksam<\/td>\n<\/tr>\n<tr>\n<td><strong>Stellvertretung § 164<\/strong><\/td>\n<td>eigene WE → im fremden Namen → mit Vertretungsmacht<\/td>\n<\/tr>\n<tr>\n<td><strong>Anfechtung<\/strong><\/td>\n<td>Anfechtungserklärung § 143 → Anfechtungsgrund → Frist § 121/124<\/td>\n<\/tr>\n<tr>\n<td><strong>§ 823 I<\/strong><\/td>\n<td>Handlung → haftungsbegründende Kausalität → Rechtsgutsverletzung → Rechtswidrigkeit → Verschulden → haftungsausfüllende Kausalität → Schaden<\/td>\n<\/tr>\n<tr>\n<td><strong>§ 812<\/strong><\/td>\n<td>etwas erlangt → durch Leistung / in sonstiger Weise → ohne Rechtsgrund → kein Ausschluss (§§ 814, 818 III)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-f3-paragraphen-die-du-ohne-nachschlagen-kennen-musst\">F.3 Paragraphen, die du ohne Nachschlagen kennen musst<\/h3>\n<p>Nicht den Wortlaut — nur <strong>welche Nummer wofür steht<\/strong>. Sonst weißt du in der Klausur nicht einmal, wo du blättern sollst.<\/p>\n<table>\n<thead>\n<tr>\n<th>Bereich<\/th>\n<th>§§<\/th>\n<th>Wofür<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Anspruchsgrundlagen<\/strong><\/td>\n<td><strong>433<\/strong> · <strong>812<\/strong> · <strong>823<\/strong> · <strong>280 + 311 II + 241 II<\/strong> · <strong>631<\/strong> · <strong>179<\/strong><\/td>\n<td>Kauf · Bereicherung · Delikt · c.i.c. · Werkvertrag · falscher Vertreter<\/td>\n<\/tr>\n<tr>\n<td><strong>Auslegung<\/strong><\/td>\n<td><strong>133<\/strong> · <strong>157<\/strong><\/td>\n<td>wirklicher Wille · objektiver Empfängerhorizont<\/td>\n<\/tr>\n<tr>\n<td><strong>Vertragsschluss<\/strong><\/td>\n<td><strong>145<\/strong> · <strong>147<\/strong> · <strong>150<\/strong><\/td>\n<td>Antrag · Annahmefrist · verspätete/geänderte Annahme<\/td>\n<\/tr>\n<tr>\n<td><strong>Zugang<\/strong><\/td>\n<td><strong>130<\/strong><\/td>\n<td>Zugang + Widerruf vor Zugang<\/td>\n<\/tr>\n<tr>\n<td><strong>Minderjährige<\/strong><\/td>\n<td><strong>104<\/strong> · <strong>105<\/strong> · <strong>106<\/strong> · <strong>107<\/strong> · <strong>108<\/strong> · <strong>110<\/strong><\/td>\n<td>die Kernkette<\/td>\n<\/tr>\n<tr>\n<td><strong>Nichtigkeit<\/strong><\/td>\n<td><strong>125<\/strong> · <strong>134<\/strong> · <strong>138<\/strong><\/td>\n<td>Form · Verbot · Sitte/Wucher<\/td>\n<\/tr>\n<tr>\n<td><strong>Anfechtung<\/strong><\/td>\n<td><strong>119<\/strong> · <strong>123<\/strong> · <strong>142<\/strong> · <strong>143<\/strong><\/td>\n<td>Gründe · Wirkung · Erklärung<\/td>\n<\/tr>\n<tr>\n<td><strong>Vertretung<\/strong><\/td>\n<td><strong>164<\/strong> · <strong>168<\/strong> · <strong>177<\/strong> · <strong>179<\/strong> · <strong>181<\/strong><\/td>\n<td>Grundnorm · Erlöschen · schwebend unwirksam · Haftung · Insichgeschäft<\/td>\n<\/tr>\n<tr>\n<td><strong>Übereignung<\/strong><\/td>\n<td><strong>929<\/strong><\/td>\n<td>Einigung + Übergabe<\/td>\n<\/tr>\n<tr>\n<td><strong>Lösung vom Vertrag<\/strong><\/td>\n<td><strong>346<\/strong> · <strong>323<\/strong> · <strong>355<\/strong> · <strong>312g<\/strong><\/td>\n<td>Rücktritt · Rücktrittsgrund · Widerruf<\/td>\n<\/tr>\n<tr>\n<td><strong>Schaden<\/strong><\/td>\n<td><strong>249<\/strong> · <strong>252<\/strong> · <strong>253<\/strong><\/td>\n<td>Naturalrestitution · entgangener Gewinn · Schmerzensgeld<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Merk dir zusätzlich diese vier Zahlen:<\/strong><\/p>\n<ul>\n<li><strong>2 Wochen<\/strong> — Genehmigungsfrist nach Aufforderung (§ 108 II Minderjährige, § 177 II Vertretung)<\/li>\n<li><strong>14 Tage<\/strong> — Widerrufsfrist (§ 355 II)<\/li>\n<li><strong>1 Jahr<\/strong> — Anfechtungsfrist bei Täuschung/Drohung (§ 124)<\/li>\n<li><strong>unverzüglich<\/strong> — Anfechtungsfrist bei Irrtum (§ 121); heißt „ohne schuldhaftes Zögern\", nicht „sofort\"<\/li>\n<\/ul>\n<h3 id=\"r-f4-was-du-nicht-auswendig-lernen-musst\">F.4 Was du NICHT auswendig lernen musst<\/h3>\n<p>Damit du dir die Zeit sparst:<\/p>\n<ul>\n<li><strong>Den Wortlaut der Paragraphen.<\/strong> Du hast das BGB dabei. Markier sie dir lieber gut (Anhang A).<\/li>\n<li><strong>Die Gerichtsbarkeiten und den Instanzenzug<\/strong> (Folie 5). Hintergrundwissen.<\/li>\n<li><strong>Die BGH-Rechtsprechung zu AGB-Klauseln<\/strong> (Folie 18). Zusatzmaterial.<\/li>\n<li><strong>Absätze und Sätze bei Nebennormen.<\/strong> „§ 812\" reicht, „§ 812 I S. 1 Alt. 1\" ist Kür.<\/li>\n<li><strong>Die GoA (§ 677).<\/strong> Laut Dozent nicht prüfungsrelevant — Name und ein Beispiel genügen.<\/li>\n<li><strong>Zahlenwerte bei Leistungsstörungen<\/strong> (Verzugszinsen etc.). Nur die Größenordnung.<\/li>\n<\/ul>\n<h3 id=\"r-f5-der-lernplan-fur-die-letzten-drei-tage\">F.5 Der Lernplan für die letzten drei Tage<\/h3>\n<table>\n<thead>\n<tr>\n<th>Tag<\/th>\n<th>Was<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>−3<\/strong><\/td>\n<td>Die acht Definitionen aus F.1, bis sie sitzen. Dann Kapitel 3 (Methode) nochmal ganz lesen.<\/td>\n<\/tr>\n<tr>\n<td><strong>−2<\/strong><\/td>\n<td>Die sieben Schemata aus F.2 dreimal aus dem Kopf auf ein leeres Blatt schreiben. Dann Übungsfälle 03, 06 und 08 durchgehen.<\/td>\n<\/tr>\n<tr>\n<td><strong>−1<\/strong><\/td>\n<td>Paragraphenliste F.3 durchgehen und im BGB nachschlagen — so prägst du dir die Post-its ein. Datenschutz-Quiz zweimal komplett.<\/td>\n<\/tr>\n<tr>\n<td><strong>Klausurtag<\/strong><\/td>\n<td>Nur noch F.1 und F.2 überfliegen. Nichts Neues mehr anfangen.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Das ist die Liste, die du in den letzten Tagen vor der Klausur durchgehst. Alles, was hier nicht steht, musst du verstehen — nicht auswendig lernen. Du hast das BGB dabei; für den Wortlaut der Paragraphen ist gesorgt. F.1 Definitionen — diese acht wörtlich Warum wörtlich? Weil du sie im Gutachten hinschreiben musst, bevor du subsumierst. Ohne Definition hängt die Subsumtion in der Luft, und genau dafür gibt es Punkte. # Begriff Der Satz 1 Willenserklärung Auf einen rechtlichen Erfolg gerichtete menschliche Willensäußerung. 2 Zugang (unter Abwesenden) Eine WE geht zu, wenn sie so in den Machtbereich des Empfängers gelangt, dass eine Kenntnisnahme möglich ist und nach der Verkehrsanschauung damit gerechnet werden kann. 3 Irrtum Das unbewusste Auseinanderfallen von Wille und Erklärung. 4 Sittenwidrigkeit Verstoß gegen das Anstandsgefühl aller billig und gerecht Denkenden. 5 Drohung Das Inaussichtstellen eines empfindlichen Übels, das der Drohende nach der Vorstellung des Erklärenden beeinflussen kann. 6 Arglistige Täuschung Vorspiegelung falscher oder Entstellung bzw. Verschweigen wesentlicher Tatsachen, wodurch ein Irrtum ausgelöst wird. Arglist = der Täuschende weiß, dass seine Täuschung zur WE führt. 7 Leistung (i. S. d. § 812) Bewusste zweckgerichtete Mehrung fremden Vermögens. 8 Erfüllungsgehilfe (§ 278) Wer im Pflichtenkreis des Schuldners mit dessen Wissen und Wollen zur Erfüllung der Verbindlichkeit tätig ist. Dazu noch zwei kurze, die du eher als Formel brauchst: essentialia negotii = Vertragspartner · Vertragsgegenstand · Gegenleistung („nur noch ja sagen müssen\") Objektiver Empfängerhorizont = nicht was der Erklärende dachte, sondern was ein verständiger Dritter in der Lage des Empfängers verstehen durfte (§§ 133, 157) F.2 Sieben Schemata — die Reihenfolge im Kopf Nicht wörtlich, aber die Schrittfolge muss ohne Nachdenken kommen . Schreib sie dir dreimal auf ein leeres Blatt, dann sitzen sie. Schema Schritte Gutachtenstil Obersatz → Definition → Subsumtion → Schlusssatz Anspruchsaufbau entstanden? → erloschen? (Einwendungen) → durchsetzbar? (Einreden) Minderjährige § 104/105 (< 7) → § 106 → § 107 lediglich Vorteil → Einwilligung → § 110 → §§ 112/113 → sonst § 108 schwebend unwirksam Stellvertretung § 164 eigene WE → im fremden Namen → mit Vertretungsmacht Anfechtung Anfechtungserklärung § 143 → Anfechtungsgrund → Frist § 121/124 § 823 I Handlung → haftungsbegründende Kausalität → Rechtsgutsverletzung → Rechtswidrigkeit → Verschulden → haftungsausfüllende Kausalität → Schaden § 812 etwas erlangt → durch Leistung / in sonstiger Weise → ohne Rechtsgrund → kein Ausschluss (§§ 814, 818 III) F.3 Paragraphen, die du ohne Nachschlagen kennen musst Nicht den Wortlaut — nur welche Nummer wofür steht . Sonst weißt du in der Klausur nicht einmal, wo du blättern sollst. Bereich §§ Wofür Anspruchsgrundlagen 433 · 812 · 823 · 280 + 311 II + 241 II · 631 · 179 Kauf · Bereicherung · Delikt · c.i.c. · Werkvertrag · falscher Vertreter Auslegung 133 · 157 wirklicher Wille · objektiver Empfängerhorizont Vertragsschluss 145 · 147 · 150 Antrag · Annahmefrist · verspätete/geänderte Annahme Zugang 130 Zugang + Widerruf vor Zugang Minderjährige 104 · 105 · 106 · 107 · 108 · 110 die Kernkette Nichtigkeit 125 · 134 · 138 Form · Verbot · Sitte/Wucher Anfechtung 119 · 123 · 142 · 143 Gründe · Wirkung · Erklärung Vertretung 164 · 168 · 177 · 179 · 181 Grundnorm · Erlöschen · schwebend unwirksam · Haftung · Insichgeschäft Übereignung 929 Einigung + Übergabe Lösung vom Vertrag 346 · 323 · 355 · 312g Rücktritt · Rücktrittsgrund · Widerruf Schaden 249 · 252 · 253 Naturalrestitution · entgangener Gewinn · Schmerzensgeld Merk dir zusätzlich diese vier Zahlen: 2 Wochen — Genehmigungsfrist nach Aufforderung (§ 108 II Minderjährige, § 177 II Vertretung) 14 Tage — Widerrufsfrist (§ 355 II) 1 Jahr — Anfechtungsfrist bei Täuschung/Drohung (§ 124) unverzüglich — Anfechtungsfrist bei Irrtum (§ 121); heißt „ohne schuldhaftes Zögern\", nicht „sofort\" F.4 Was du NICHT auswendig lernen musst Damit du dir die Zeit sparst: Den Wortlaut der Paragraphen. Du hast das BGB dabei. Markier sie dir lieber gut (Anhang A). Die Gerichtsbarkeiten und den Instanzenzug (Folie 5). Hintergrundwissen. Die BGH-Rechtsprechung zu AGB-Klauseln (Folie 18). Zusatzmaterial. Absätze und Sätze bei Nebennormen. „§ 812\" reicht, „§ 812 I S. 1 Alt. 1\" ist Kür. Die GoA (§ 677). Laut Dozent nicht prüfungsrelevant — Name und ein Beispiel genügen. Zahlenwerte bei Leistungsstörungen (Verzugszinsen etc.). Nur die Größenordnung. F.5 Der Lernplan für die letzten drei Tage Tag Was −3 Die acht Definitionen aus F.1, bis sie sitzen. Dann Kapitel 3 (Methode) nochmal ganz lesen. −2 Die sieben Schemata aus F.2 dreimal aus dem Kopf auf ein leeres Blatt schreiben. Dann Übungsfälle 03, 06 und 08 durchgehen. −1 Paragraphenliste F.3 durchgehen und im BGB nachschlagen — so prägst du dir die Post-its ein. Datenschutz-Quiz zweimal komplett. Klausurtag Nur noch F.1 und F.2 überfliegen. Nichts Neues mehr anfangen.","words":780,"mins":4},{"id":"f-1-fälle-zur-willenserklärung","subject":"faelle","num":"1","title":"1. Fälle zur Willenserklärung","short":"Fälle zur Willenserklärung","html":"<p>Diese Sammlung übt <strong>eine einzige Frage<\/strong>: Liegt überhaupt eine Willenserklärung vor?<\/p>\n<p>Der Dozent prüft immer nach demselben Muster: <strong>Handlungswille? Erklärungswille?<\/strong> Und wenn es eng wird: <strong>Wie sieht es ein vernünftiger Empfänger?<\/strong> (§§ 133, 157)<\/p>\n<h3 id=\"f-fall-01-a-die-kino-frage\">Fall 01 a) — Die Kino-Frage<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Denny fragt Nancy: „Wollen wir heute Abend zusammen ins Gibson's gehen?\"<\/p>\n<p><strong>Was gefragt ist.<\/strong> Ist das eine Willenserklärung?<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\nDenny hat bewusst gesprochen — er wollte etwas tun. <strong>Handlungswille liegt vor.<\/strong>\nAber: Wollte er damit etwas rechtlich Verbindliches auslösen? Nein. Wenn Nancy nicht kommt, kann er sie nicht verklagen. Es ging um einen netten Abend, nicht um eine Rechtsfolge. <strong>Erklärungswille fehlt.<\/strong><\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Handlungswille (+), Erklärungswille (-): keine rechtlich erhebliche Folge angestrebt ⇒ keine wirksame WE\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Das nennt man eine <strong>Gefälligkeit<\/strong>. Verabredungen unter Freunden sind kein Vertrag. Das ist der Normalfall im Alltag — die meisten Dinge, die wir sagen, sind rechtlich gar nichts.<\/p>\n<h3 id=\"f-fall-01-b-die-zimmerpflanzen\">Fall 01 b) — Die Zimmerpflanzen<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Anneliese bittet ihren Nachbarn Jimmy, im Urlaub ihre Zimmerpflanzen zu gießen.<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\nWie im Kino-Fall: Nachbarschaftshilfe ist eine Gefälligkeit, kein Vertrag. Wenn Jimmy es vergisst, kann Anneliese nicht klagen.<\/p>\n<p><strong>Aber<\/strong> — und das ist die Pointe des Falls — es kommt auf die Umstände an. Wenn es sich um eine seltene Orchideensammlung im Wert von 3.000 Euro handelt und Jimmy das erkennen konnte, sieht die Sache anders aus. Dann durfte Anneliese davon ausgehen, dass er die Verantwortung ernst nimmt.<\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Handlungswille (+); Erklärungswille (-): s.o. ⇒ keine wirksame WE — anders ggfs. wenn die Pflanzen einen besonderen Wert haben und J dies erkennen konnte (§§ 133, 157 Ausle
