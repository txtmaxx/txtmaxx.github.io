p><strong>Wichtig:<\/strong> Das Fehlen eines Verzeichnisses ist ausdrücklich <strong>bußgeldbewehrt<\/strong> (siehe Kapitel 9, Folie 62).<\/p>\n<h3 id=\"d-82-pdca-zyklus-folien-5556\">8.2 PDCA-Zyklus (Folien 55–56)<\/h3>\n<p><strong>Folie 55 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Die Nachweispflicht ist mehr als Dokumentation<\/strong>\n<strong>Plan<\/strong> = Feststellen von Defiziten bestehender sowie Identifizieren und Planen von neuen und verbesserten TOMs\n<strong>Do<\/strong> = Implementierung der geplanten TOMs zur Sicherstellung und Verbesserung der Sicherheit in der Verarbeitung\n<strong>Check<\/strong> = Feststellung der Wirksamkeit von TOMs mit geeigneten Mitteln\n<strong>Act<\/strong> = TOMs werden als Standard auf das ganze Unternehmen ausgerollt\"<\/p>\n<\/blockquote>\n<p><strong>Folie 56:<\/strong> „<strong>PDCA = Plan – Do – Check – Act<\/strong>\"<\/p>\n<p>Merk dir die vier Wörter und die Zuordnung. Besonders: <strong>Check = Wirksamkeit feststellen<\/strong>, <strong>Act = als Standard ausrollen<\/strong> (nicht umgekehrt).<\/p>\n<p><strong>Einfach gesagt:<\/strong> Planen → machen → nachschauen, ob es wirkt → das Ergebnis zum Standard machen. Danach wieder von vorn.<\/p>\n<p>Genau so, wie man ein Trainingsprogramm anpasst: Plan aufstellen, sechs Wochen trainieren, auf die Waage stellen, und was funktioniert hat, wird zur Gewohnheit. Datenschutz ist kein Projekt, das einmal fertig wird, sondern eine Runde, die man immer wieder dreht.<\/p>\n<h3 id=\"d-83-datenschutz-als-ganzheitlicher-ansatz\">8.3 Datenschutz als ganzheitlicher Ansatz<\/h3>\n<p><strong>Folie 5 (Original):<\/strong> „<strong>Datenschutz im Rahmen der Digitalisierung ist keine Option sondern eine Pflicht!<\/strong>\"\n<strong>Folie 58 (Original):<\/strong> „Sich dem Thema Datenschutz nach dem Motto <strong>„Mut zur Lücke\"<\/strong> zu widmen <strong>wird hart bestraft!<\/strong>\"<\/p>","text":"Worum es hier geht — in einfachen Worten Wie organisiert eine Firma das Ganze? Im Kern über eine einzige Liste: das Verzeichnis der Verarbeitungstätigkeiten. Wer die nicht führt, kann gar nicht beweisen, dass er sich an die Regeln hält — und zahlt schon deswegen. 8.1 Das Verzeichnis der Verarbeitungstätigkeiten — Art. 30 Folie 57 (Original): „Ein „Hauptsteuerungsinstrument\" für das Datenschutzmanagement wird das Verzeichnis der Verarbeitungstätigkeiten gem. Artikel 30 DS-GVO i.V.m. § 70 BDSG (neu) sein. Dort kann die Einhaltung der Datenschutzgrundsätze ähnlich einer Checkliste abgehandelt werden. Außerdem sind an dieser Stelle die Risikobewertung und Maßnahmen zur Datensicherheit festzuhalten. Ebenso ist dort die Vereinbarung zur Auftragsdatenverarbeitung (falls erforderlich) und die Datenschutzfolgenabschätzung (falls erforderlich) aufzunehmen.\" Was das ist: Eine Liste aller Verarbeitungsvorgänge im Unternehmen — welche Daten, zu welchem Zweck, wie lange, wer bekommt sie, wie sind sie geschützt. Einfach gesagt: Das Verzeichnis ist die Inventarliste. Welche Daten haben wir? Wozu? Wie lange? Wer bekommt sie? Wie sind sie geschützt? Ohne diese Liste kann eine Firma gar nicht beweisen, dass sie sich an die Regeln hält — und genau das muss sie ja (Rechenschaftspflicht, Art. 5 II). Deshalb nennt der Dozent es das Hauptsteuerungsinstrument : Wer das Verzeichnis ordentlich führt, hat den Datenschutz im Griff. Wer es nicht hat, kassiert schon deswegen ein Bußgeld. Wichtig: Das Fehlen eines Verzeichnisses ist ausdrücklich bußgeldbewehrt (siehe Kapitel 9, Folie 62). 8.2 PDCA-Zyklus (Folien 55–56) Folie 55 (Original): „ Die Nachweispflicht ist mehr als Dokumentation Plan = Feststellen von Defiziten bestehender sowie Identifizieren und Planen von neuen und verbesserten TOMs Do = Implementierung der geplanten TOMs zur Sicherstellung und Verbesserung der Sicherheit in der Verarbeitung Check = Feststellung der Wirksamkeit von TOMs mit geeigneten Mitteln Act = TOMs werden als Standard auf das ganze Unternehmen ausgerollt\" Folie 56: „ PDCA = Plan – Do – Check – Act \" Merk dir die vier Wörter und die Zuordnung. Besonders: Check = Wirksamkeit feststellen , Act = als Standard ausrollen (nicht umgekehrt). Einfach gesagt: Planen → machen → nachschauen, ob es wirkt → das Ergebnis zum Standard machen. Danach wieder von vorn. Genau so, wie man ein Trainingsprogramm anpasst: Plan aufstellen, sechs Wochen trainieren, auf die Waage stellen, und was funktioniert hat, wird zur Gewohnheit. Datenschutz ist kein Projekt, das einmal fertig wird, sondern eine Runde, die man immer wieder dreht. 8.3 Datenschutz als ganzheitlicher Ansatz Folie 5 (Original): „ Datenschutz im Rahmen der Digitalisierung ist keine Option sondern eine Pflicht! \" Folie 58 (Original): „Sich dem Thema Datenschutz nach dem Motto „Mut zur Lücke\" zu widmen wird hart bestraft! \"","words":423,"mins":2},{"id":"d-9-haftung--geldbußen","subject":"ds","num":"9","title":"9. Haftung & Geldbußen","short":"Haftung & Geldbußen","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\n<strong>Was kostet es, wenn man es falsch macht?<\/strong><\/p>\n<p>Es gibt zwei Bußgeldstufen mit vier Zahlen: 10 Millionen / 2 Prozent und 20 Millionen / 4 Prozent.<\/p>\n<p>Diese vier Zahlen und ihre Zuordnung sind ein sicherer True/False-Kandidat. Und Achtung: <strong>Artikel 83 steht nicht in deinem DSGVO-Ausdruck<\/strong> — das musst du auswendig können.<\/p>\n<\/blockquote>\n<p><strong>Das ist ein sehr wahrscheinliches T/F-Thema, weil es konkrete Zahlen gibt.<\/strong> Und: <strong>Art. 83 steht NICHT in deinem DSGVO-Ausdruck<\/strong> (der endet bei Art. 39). Du musst die Zahlen auswendig können.<\/p>\n<h3 id=\"d-91-die-zwei-bugeldstufen\">9.1 Die zwei Bußgeldstufen<\/h3>\n<p><strong>Folie 62 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Mit Geldbuße bis zu 10.000.000 Euro oder von bis zu 2 % des erzielten Vorjahresumsatzes wird belegt, wer als Verantwortlicher (Artikel 83 Abs. 4 DSGVO)<\/strong>\n▪ <strong>Privacy by Design und Privacy by Default<\/strong> nicht umsetzt,\n▪ pbD von <strong>Auftragsverarbeitern ohne Vertrag<\/strong> verarbeiten lässt,\n▪ <strong>kein Verzeichnis von Verarbeitungstätigkeiten<\/strong> führt,\n▪ <strong>Betroffene nicht ordnungsgemäß benachrichtigt<\/strong>,\n▪ <strong>keine Datenschutz-Folgeabschätzung<\/strong> durchführt,\n▪ <strong>keinen Datenschutzbeauftragten benannt<\/strong> hat, u.a.\n➢ <strong>Jedes Vorkommnis kann einzeln geahndet werden.<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Folie 63 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Mit Geldbuße bis zu 20.000.000 Euro oder von bis zu 4 % des erzielten Vorjahresumsatzes wird belegt, wer als Verantwortlicher (Artikel 83 Abs. 5 DSGVO)<\/strong>\n▪ <strong>Die Grundsätze für die Verarbeitung, einschließlich der Bedingungen für die Einwilligung nicht einhält<\/strong>,\n▪ <strong>die Rechte der betroffenen Person nicht angemessen berücksichtigt<\/strong>,\n▪ <strong>Unzulässig pbD an eine/-n Empfänger/-in in einem Drittland übermittelt<\/strong>,\n▪ <strong>Anweisungen der Aufsichtsbehörden nicht befolgt<\/strong> werden, u.a.\n➢ <strong>Jedes Vorkommnis kann einzeln geahndet werden.<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"d-die-tabelle-zum-auswendiglernen\">Die Tabelle zum Auswendiglernen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Stufe<\/th>\n<th>Art.<\/th>\n<th>Betrag<\/th>\n<th>Umsatz<\/th>\n<th>Wofür (Merkwort)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Stufe 1<\/strong><\/td>\n<td><strong>Art. 83 IV<\/strong><\/td>\n<td><strong>10 Mio €<\/strong><\/td>\n<td><strong>2 %<\/strong><\/td>\n<td><strong>ORGANISATORISCHE<\/strong> Pflichten: Privacy by Design/Default, AV-Vertrag, Verzeichnis, DSFA, DSB<\/td>\n<\/tr>\n<tr>\n<td><strong>Stufe 2<\/strong><\/td>\n<td><strong>Art. 83 V<\/strong><\/td>\n<td><strong>20 Mio €<\/strong><\/td>\n<td><strong>4 %<\/strong><\/td>\n<td><strong>MATERIELLE<\/strong> Verstöße: Grundsätze, Einwilligung, Betroffenenrechte, Drittlandübermittlung, Behördenanweisungen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Merkhilfe:<\/strong> <em>Wer die <\/em><em>Bürokratie<\/em><em> vernachlässigt: 10/2. Wer die <\/em><em>Rechte der Menschen<\/em><em> verletzt: 20/4.<\/em><\/p>\n<blockquote>\n<p>⚠️ <strong>Drei Fallen:<\/strong>\n1. <strong>10 und 2 gehören zusammen, 20 und 4 gehören zusammen.<\/strong> Die Zahlen werden gern gekreuzt.\n2. Das Gesetz sagt „<strong>je nachdem, welcher der Beträge höher ist<\/strong>\". Bei einem Großkonzern sind 4 % des Weltumsatzes weit mehr als 20 Mio — dann gilt der höhere Betrag. Eine Aussage wie „die Geldbuße ist auf 20 Mio € begrenzt\" ist also <strong>falsch<\/strong>.\n3. „<strong>Jedes Vorkommnis kann einzeln geahndet werden<\/strong>\" — die Beträge sind kein Gesamtdeckel pro Unternehmen.\n4. Der Prozentsatz bezieht sich auf den <strong>weltweiten Jahresumsatz des vorangegangenen Geschäftsjahrs<\/strong>, nicht auf den Gewinn und nicht auf den Inlandsumsatz.<\/p>\n<\/blockquote>\n<h3 id=\"d-92-weitere-risiken-folie-60-original\">9.2 Weitere Risiken (Folie 60, Original)<\/h3>\n<blockquote>\n<p>„<strong>Rechtliche Konsequenzen von Verstößen<\/strong> — <strong>Imageverlust · Kosten durch Strafen · Kosten zur Schadensbehebung<\/strong>\nJedes Unternehmen sollte bestrebt sein, betriebsinterne Daten gegen unbefugtes Verarbeiten zu sichern.\"<\/p>\n<\/blockquote>\n<p><strong>Folie 61:<\/strong> „Verstöße gegen <strong>Datenschutzgrundsätze und gegen Datensicherheit<\/strong> sind <strong>bußgeldbewehrt<\/strong>.\"<\/p>\n<p><strong>Zusätzlich zur Geldbuße:<\/strong> Betroffene haben nach <strong>Art. 82<\/strong> einen <strong>Schadensersatzanspruch<\/strong> — auch für immateriellen Schaden.<\/p>\n<h3 id=\"d-93-zwei-begriffe-die-auf-folie-62-auftauchen\">9.3 Zwei Begriffe, die auf Folie 62 auftauchen<\/h3>\n<ul>\n<li><strong>Privacy by Design<\/strong> (Art. 25 I): Datenschutz muss <strong>von Anfang an<\/strong> in die Technik eingebaut sein — nicht nachträglich aufgesetzt.<\/li>\n<li><strong>Privacy by Default<\/strong> (Art. 25 II): Die <strong>Voreinstellungen<\/strong> müssen die datenschutzfreundlichsten sein. Ein neu installiertes Profil ist standardmäßig privat, nicht öffentlich.<\/li>\n<\/ul>\n<p><strong>Zwei Alltagsbilder:<\/strong><\/p>\n<p><strong>Privacy by Design<\/strong> ist das Fahrradschloss, das schon beim Bau des Rahmens mitgedacht wurde — nicht die Kette, die man hinterher drumwickelt. Der Datenschutz muss <strong>von Anfang an<\/strong> eingeplant sein, nicht nachträglich aufgeschraubt.<\/p>\n<p><strong>Privacy by Default<\/strong> ist das neue Handy, bei dem die Standortfreigabe ab Werk <strong>aus<\/strong> ist. Wer sie will, schaltet sie ein. Nicht andersherum. Die Voreinstellung ist immer die datensparsamste.<\/p>\n<h3 id=\"d-typische-fallen-zu-kapitel-9\">Typische Fallen zu Kapitel 9<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aussage<\/th>\n<th>✓/✗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Der Höchstrahmen für Bußgelder liegt bei 20 Mio € oder 4 % des Vorjahresumsatzes.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Verstöße gegen die Grundsätze werden mit bis zu 10 Mio € geahndet.<\/td>\n<td><strong>✗<\/strong> — Grundsätze = <strong>20 Mio / 4 %<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Wer kein Verarbeitungsverzeichnis führt, riskiert bis zu 10 Mio € / 2 %.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Die Bußgeldobergrenze ist absolut auf 20 Mio € gedeckelt.<\/td>\n<td><strong>✗<\/strong> — je nachdem, welcher Betrag <strong>höher<\/strong> ist<\/td>\n<\/tr>\n<tr>\n<td>Jedes einzelne Vorkommnis kann geahndet werden.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Privacy by Default bedeutet, dass die Voreinstellungen datenschutzfreundlich sein müssen.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Der Prozentsatz bemisst sich am Gewinn.<\/td>\n<td><strong>✗<\/strong> — am <strong>Umsatz<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Was kostet es, wenn man es falsch macht? Es gibt zwei Bußgeldstufen mit vier Zahlen: 10 Millionen / 2 Prozent und 20 Millionen / 4 Prozent. Diese vier Zahlen und ihre Zuordnung sind ein sicherer True/False-Kandidat. Und Achtung: Artikel 83 steht nicht in deinem DSGVO-Ausdruck — das musst du auswendig können. Das ist ein sehr wahrscheinliches T/F-Thema, weil es konkrete Zahlen gibt. Und: Art. 83 steht NICHT in deinem DSGVO-Ausdruck (der endet bei Art. 39). Du musst die Zahlen auswendig können. 9.1 Die zwei Bußgeldstufen Folie 62 (Original): „ Mit Geldbuße bis zu 10.000.000 Euro oder von bis zu 2 % des erzielten Vorjahresumsatzes wird belegt, wer als Verantwortlicher (Artikel 83 Abs. 4 DSGVO) ▪ Privacy by Design und Privacy by Default nicht umsetzt, ▪ pbD von Auftragsverarbeitern ohne Vertrag verarbeiten lässt, ▪ kein Verzeichnis von Verarbeitungstätigkeiten führt, ▪ Betroffene nicht ordnungsgemäß benachrichtigt , ▪ keine Datenschutz-Folgeabschätzung durchführt, ▪ keinen Datenschutzbeauftragten benannt hat, u.a. ➢ Jedes Vorkommnis kann einzeln geahndet werden. \" Folie 63 (Original): „ Mit Geldbuße bis zu 20.000.000 Euro oder von bis zu 4 % des erzielten Vorjahresumsatzes wird belegt, wer als Verantwortlicher (Artikel 83 Abs. 5 DSGVO) ▪ Die Grundsätze für die Verarbeitung, einschließlich der Bedingungen für die Einwilligung nicht einhält , ▪ die Rechte der betroffenen Person nicht angemessen berücksichtigt , ▪ Unzulässig pbD an eine/-n Empfänger/-in in einem Drittland übermittelt , ▪ Anweisungen der Aufsichtsbehörden nicht befolgt werden, u.a. ➢ Jedes Vorkommnis kann einzeln geahndet werden. \" Die Tabelle zum Auswendiglernen Stufe Art. Betrag Umsatz Wofür (Merkwort) Stufe 1 Art. 83 IV 10 Mio € 2 % ORGANISATORISCHE Pflichten: Privacy by Design/Default, AV-Vertrag, Verzeichnis, DSFA, DSB Stufe 2 Art. 83 V 20 Mio € 4 % MATERIELLE Verstöße: Grundsätze, Einwilligung, Betroffenenrechte, Drittlandübermittlung, Behördenanweisungen Merkhilfe: Wer die Bürokratie vernachlässigt: 10/2. Wer die Rechte der Menschen verletzt: 20/4. ⚠️ Drei Fallen: 1. 10 und 2 gehören zusammen, 20 und 4 gehören zusammen. Die Zahlen werden gern gekreuzt. 2. Das Gesetz sagt „ je nachdem, welcher der Beträge höher ist \". Bei einem Großkonzern sind 4 % des Weltumsatzes weit mehr als 20 Mio — dann gilt der höhere Betrag. Eine Aussage wie „die Geldbuße ist auf 20 Mio € begrenzt\" ist also falsch . 3. „ Jedes Vorkommnis kann einzeln geahndet werden \" — die Beträge sind kein Gesamtdeckel pro Unternehmen. 4. Der Prozentsatz bezieht sich auf den weltweiten Jahresumsatz des vorangegangenen Geschäftsjahrs , nicht auf den Gewinn und nicht auf den Inlandsumsatz. 9.2 Weitere Risiken (Folie 60, Original) „ Rechtliche Konsequenzen von Verstößen — Imageverlust · Kosten durch Strafen · Kosten zur Schadensbehebung Jedes Unternehmen sollte bestrebt sein, betriebsinterne Daten gegen unbefugtes Verarbeiten zu sichern.\" Folie 61: „Verstöße gegen Datenschutzgrundsätze und gegen Datensicherheit sind bußgeldbewehrt .\" Zusätzlich zur Geldbuße: Betroffene haben nach Art. 82 einen Schadensersatzanspruch — auch für immateriellen Schaden. 9.3 Zwei Begriffe, die auf Folie 62 auftauchen Privacy by Design (Art. 25 I): Datenschutz muss von Anfang an in die Technik eingebaut sein — nicht nachträglich aufgesetzt. Privacy by Default (Art. 25 II): Die Voreinstellungen müssen die datenschutzfreundlichsten sein. Ein neu installiertes Profil ist standardmäßig privat, nicht öffentlich. Zwei Alltagsbilder: Privacy by Design ist das Fahrradschloss, das schon beim Bau des Rahmens mitgedacht wurde — nicht die Kette, die man hinterher drumwickelt. Der Datenschutz muss von Anfang an eingeplant sein, nicht nachträglich aufgeschraubt. Privacy by Default ist das neue Handy, bei dem die Standortfreigabe ab Werk aus ist. Wer sie will, schaltet sie ein. Nicht andersherum. Die Voreinstellung ist immer die datensparsamste. Typische Fallen zu Kapitel 9 Aussage ✓/✗ Der Höchstrahmen für Bußgelder liegt bei 20 Mio € oder 4 % des Vorjahresumsatzes. ✓ Verstöße gegen die Grundsätze werden mit bis zu 10 Mio € geahndet. ✗ — Grundsätze = 20 Mio / 4 % Wer kein Verarbeitungsverzeichnis führt, riskiert bis zu 10 Mio € / 2 %. ✓ Die Bußgeldobergrenze ist absolut auf 20 Mio € gedeckelt. ✗ — je nachdem, welcher Betrag höher ist Jedes einzelne Vorkommnis kann geahndet werden. ✓ Privacy by Default bedeutet, dass die Voreinstellungen datenschutzfreundlich sein müssen. ✓ Der Prozentsatz bemisst sich am Gewinn. ✗ — am Umsatz","words":689,"mins":4},{"id":"d-10-der-datenschutzbeauftragte","subject":"ds","num":"10","title":"10. Der Datenschutzbeauftragte","short":"Der Datenschutzbeauftragte","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\n<strong>Wer passt im Unternehmen auf?<\/strong><\/p>\n<p>Zwei Fragen: Wann muss überhaupt jemand benannt werden, und was macht diese Person dann?<\/p>\n<p>Die wichtigste Erkenntnis dahinter: Der Datenschutzbeauftragte <strong>berät und überwacht<\/strong> — verantwortlich bleibt immer die Firma selbst.<\/p>\n<\/blockquote>\n<h3 id=\"d-101-wann-ist-ein-dsb-pflicht-folie-64\">10.1 Wann ist ein DSB Pflicht? (Folie 64)<\/h3>\n<p>Die Folie zeigt einen Entscheidungsbaum. <strong>Ein DSB muss benannt werden, wenn mindestens eine dieser Bedingungen zutrifft:<\/strong><\/p>\n<pre><code>① Behörde / öffentliche Stelle                                            → JA\n② Kerntätigkeit mit umfangreicher oder systematischer\n   Überwachung von Personen                                               → JA\n③ Kerntätigkeit mit umfangreicher Verarbeitung\n   besonderer Kategorien von Daten                                        → JA\n④ Verarbeitungen, die einer DSFA unterliegen                              → JA\n⑤ Geschäftsmäßige Verarbeitung zum Zwecke der Übermittlung,\n   der anonymisierten Übermittlung oder der Markt-/Meinungsforschung      → JA\n⑥ i. d. R. ≥ 20 Personen ständig mit der automatisierten\n   Verarbeitung pbD betraut                                               → JA\n   ─────────────────────────────────────────────────────────────\n   Sonst (alle NEIN):                            keine Benennung erforderlich\n<\/code><\/pre>\n<blockquote>\n<p>⚠️ <strong>Die 20-Personen-Grenze ist eine deutsche Besonderheit<\/strong> (§ 38 BDSG), nicht DSGVO. Sie ist die wahrscheinlichste Zahlenfrage in diesem Kapitel. Merk dir: <strong>≥ 20 Personen, die ständig mit automatisierter Verarbeitung betraut sind.<\/strong>\nBeachte: Es geht um <strong>Personen, die mit der Verarbeitung betraut sind<\/strong> — nicht um die Gesamtzahl der Mitarbeiter. Ein Unternehmen mit 200 Mitarbeitern, von denen nur 5 mit pbD arbeiten, braucht (nach diesem Kriterium) keinen DSB.<\/p>\n<\/blockquote>\n<h3 id=\"d-102-aufgaben-des-dsb-art-39-folie-65-original\">10.2 Aufgaben des DSB — Art. 39 (Folie 65, Original)<\/h3>\n<blockquote>\n<p>„▪ <strong>Unterrichtung und Beratung<\/strong> des/der Verantwortlichen und der Beschäftigten, die Verarbeitungen durchführen\n▪ <strong>Überwachung der Einhaltung<\/strong> der Datenschutzvorschriften sowie der Strategien des/der Verantwortlichen für den Schutz pbD\n▪ <strong>Beratung im Zusammenhang mit der Datenschutz-Folgenabschätzung<\/strong> und Überwachung ihrer Durchführung\n▪ <strong>Zusammenarbeit mit der Aufsichtsbehörde<\/strong>\n▪ <strong>Anlaufstelle für die Aufsichtsbehörde<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Fünf Aufgaben: Beraten · Überwachen · DSFA begleiten · Zusammenarbeiten · Anlaufstelle sein.<\/strong><\/p>\n<blockquote>\n<p>⚠️ <strong>Die wichtigste konzeptionelle Falle:<\/strong> Der DSB <strong>überwacht und berät — er entscheidet nicht und er haftet nicht.<\/strong>\n<strong>Verantwortlich bleibt immer der Verantwortliche<\/strong> (also die Geschäftsführung / das Unternehmen). Der DSB ist kein Verantwortlicher im Sinne der DSGVO. Eine Aussage wie „Der DSB haftet für Datenschutzverstöße des Unternehmens\" ist <strong>falsch<\/strong>.<\/p>\n<\/blockquote>\n<p><strong>Weitere Merkmale (Art. 37–38, nicht ausdrücklich auf den Folien, aber Standardwissen):<\/strong>\n- Der DSB kann <strong>intern oder extern<\/strong> sein. Dein Dozent ist selbst ein <strong>externer<\/strong> DSB — das erwähnt er auf jeder Folie.\n- Er ist <strong>weisungsfrei<\/strong> in der Ausübung seiner Aufgaben und darf deswegen nicht abberuft oder benachteiligt werden.\n- Er berichtet direkt der <strong>höchsten Managementebene<\/strong>.\n- Er ist zur <strong>Verschwiegenheit<\/strong> verpflichtet.\n- Seine <strong>Kontaktdaten<\/strong> sind zu veröffentlichen und der Aufsichtsbehörde mitzuteilen.<\/p>\n<h3 id=\"d-typische-fallen-zu-kapitel-10\">Typische Fallen zu Kapitel 10<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aussage<\/th>\n<th>✓/✗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ein DSB muss ab 20 ständig mit automatisierter Verarbeitung betrauten Personen benannt werden.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Jedes Unternehmen mit mehr als 20 Mitarbeitern braucht einen DSB.<\/td>\n<td><strong>✗<\/strong> — es kommt auf die <strong>mit der Verarbeitung betrauten<\/strong> Personen an<\/td>\n<\/tr>\n<tr>\n<td>Behörden müssen immer einen DSB benennen.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Der DSB haftet persönlich für Datenschutzverstöße des Unternehmens.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Der DSB muss ein interner Mitarbeiter sein.<\/td>\n<td><strong>✗<\/strong> — auch extern möglich<\/td>\n<\/tr>\n<tr>\n<td>Der DSB ist Anlaufstelle für die Aufsichtsbehörde.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Der DSB entscheidet über Zwecke und Mittel der Verarbeitung.<\/td>\n<td><strong>✗<\/strong> — das ist der Verantwortliche<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Wer passt im Unternehmen auf? Zwei Fragen: Wann muss überhaupt jemand benannt werden, und was macht diese Person dann? Die wichtigste Erkenntnis dahinter: Der Datenschutzbeauftragte berät und überwacht — verantwortlich bleibt immer die Firma selbst. 10.1 Wann ist ein DSB Pflicht? (Folie 64) Die Folie zeigt einen Entscheidungsbaum. Ein DSB muss benannt werden, wenn mindestens eine dieser Bedingungen zutrifft: ① Behörde / öffentliche Stelle → JA ② Kerntätigkeit mit umfangreicher oder systematischer Überwachung von Personen → JA ③ Kerntätigkeit mit umfangreicher Verarbeitung besonderer Kategorien von Daten → JA ④ Verarbeitungen, die einer DSFA unterliegen → JA ⑤ Geschäftsmäßige Verarbeitung zum Zwecke der Übermittlung, der anonymisierten Übermittlung oder der Markt-/Meinungsforschung → JA ⑥ i. d. R. ≥ 20 Personen ständig mit der automatisierten Verarbeitung pbD betraut → JA ───────────────────────────────────────────────────────────── Sonst (alle NEIN): keine Benennung erforderlich ⚠️ Die 20-Personen-Grenze ist eine deutsche Besonderheit (§ 38 BDSG), nicht DSGVO. Sie ist die wahrscheinlichste Zahlenfrage in diesem Kapitel. Merk dir: ≥ 20 Personen, die ständig mit automatisierter Verarbeitung betraut sind. Beachte: Es geht um Personen, die mit der Verarbeitung betraut sind — nicht um die Gesamtzahl der Mitarbeiter. Ein Unternehmen mit 200 Mitarbeitern, von denen nur 5 mit pbD arbeiten, braucht (nach diesem Kriterium) keinen DSB. 10.2 Aufgaben des DSB — Art. 39 (Folie 65, Original) „▪ Unterrichtung und Beratung des/der Verantwortlichen und der Beschäftigten, die Verarbeitungen durchführen ▪ Überwachung der Einhaltung der Datenschutzvorschriften sowie der Strategien des/der Verantwortlichen für den Schutz pbD ▪ Beratung im Zusammenhang mit der Datenschutz-Folgenabschätzung und Überwachung ihrer Durchführung ▪ Zusammenarbeit mit der Aufsichtsbehörde ▪ Anlaufstelle für die Aufsichtsbehörde \" Fünf Aufgaben: Beraten · Überwachen · DSFA begleiten · Zusammenarbeiten · Anlaufstelle sein. ⚠️ Die wichtigste konzeptionelle Falle: Der DSB überwacht und berät — er entscheidet nicht und er haftet nicht. Verantwortlich bleibt immer der Verantwortliche (also die Geschäftsführung / das Unternehmen). Der DSB ist kein Verantwortlicher im Sinne der DSGVO. Eine Aussage wie „Der DSB haftet für Datenschutzverstöße des Unternehmens\" ist falsch . Weitere Merkmale (Art. 37–38, nicht ausdrücklich auf den Folien, aber Standardwissen): - Der DSB kann intern oder extern sein. Dein Dozent ist selbst ein externer DSB — das erwähnt er auf jeder Folie. - Er ist weisungsfrei in der Ausübung seiner Aufgaben und darf deswegen nicht abberuft oder benachteiligt werden. - Er berichtet direkt der höchsten Managementebene . - Er ist zur Verschwiegenheit verpflichtet. - Seine Kontaktdaten sind zu veröffentlichen und der Aufsichtsbehörde mitzuteilen. Typische Fallen zu Kapitel 10 Aussage ✓/✗ Ein DSB muss ab 20 ständig mit automatisierter Verarbeitung betrauten Personen benannt werden. ✓ Jedes Unternehmen mit mehr als 20 Mitarbeitern braucht einen DSB. ✗ — es kommt auf die mit der Verarbeitung betrauten Personen an Behörden müssen immer einen DSB benennen. ✓ Der DSB haftet persönlich für Datenschutzverstöße des Unternehmens. ✗ Der DSB muss ein interner Mitarbeiter sein. ✗ — auch extern möglich Der DSB ist Anlaufstelle für die Aufsichtsbehörde. ✓ Der DSB entscheidet über Zwecke und Mittel der Verarbeitung. ✗ — das ist der Verantwortliche","words":501,"mins":3},{"id":"d-11-auftragsverarbeitung","subject":"ds","num":"11","title":"11. Auftragsverarbeitung","short":"Auftragsverarbeitung","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\n<strong>Was gilt, wenn eine Firma die Datenverarbeitung auslagert?<\/strong><\/p>\n<p>Cloud-Hosting, externe Lohnbuchhaltung, ein Newsletter-Tool. Alles erlaubt — aber die Verantwortung wandert <strong>nicht<\/strong> mit.<\/p>\n<p>Das ist im Grunde der ganze Inhalt dieses Kapitels, und genau darauf zielt die typische Fangfrage.<\/p>\n<\/blockquote>\n<p><strong>Folie 66 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Auftragsverarbeitung (ADV), Artikel 28 DS-GVO — Grundprinzip<\/strong>\n▪ pbD muss ein Unternehmen <strong>nicht selbst<\/strong> erheben, verarbeiten oder nutzen; es kann sich eines <strong>Dienstleisters<\/strong> im Wege der Auftragsverarbeitung bedienen\n▪ <strong>Unternehmen bleibt für das Erheben, Verarbeiten und Nutzen verantwortlich, auch wenn dies durch einen Dienstleister erfolgt<\/strong> (Dienstleister ist quasi <strong>ausgelagerte Abteilung<\/strong> d. verantwortlichen Stelle)\n▪ Unternehmen muss dem Dienstleister <strong>Vorgaben (Weisungen)<\/strong> machen, wie mit den pbD umzugehen ist\"<\/p>\n<\/blockquote>\n<h3 id=\"d-die-drei-kernsatze\">Die drei Kernsätze<\/h3>\n<pre><code>① Auslagern ist erlaubt.\n② Die VERANTWORTUNG bleibt beim Auftraggeber. Immer.\n③ Es braucht einen VERTRAG (AV-Vertrag) und WEISUNGEN.\n<\/code><\/pre>\n<p><strong>Alltagsbeispiele für Auftragsverarbeitung:<\/strong> Cloud-Hosting (AWS, Azure), Lohnabrechnung durch ein externes Büro, ein E-Mail-Marketing-Tool, ein externer IT-Dienstleister, Aktenvernichtung.<\/p>\n<p><strong>Das Bild:<\/strong> Eine Firma lässt ihre Lohnabrechnung von einem externen Büro machen. Das Büro sieht dabei die Gehälter aller Mitarbeiter.<\/p>\n<p>Trotzdem bleibt die <strong>Firma<\/strong> diejenige, die gegenüber ihren Mitarbeitern geradesteht. Das Büro ist nur die verlängerte Werkbank und darf <strong>nur das<\/strong> tun, was ihm aufgetragen wurde. Es darf die Gehaltsdaten nicht für eigene Zwecke nutzen — etwa um Werbung zu verschicken.<\/p>\n<p>Und wenn es das doch tut, ist es kein Auftragsverarbeiter mehr, sondern selbst verantwortlich — mit allen Pflichten, die daran hängen.<\/p>\n<blockquote>\n<p>⚠️ <strong>Die Falle:<\/strong> „Wenn ich die Verarbeitung auslagere, ist der Dienstleister verantwortlich\" → <strong>falsch<\/strong>. Der Auftraggeber bleibt der Verantwortliche. Der Dozent formuliert es sehr griffig: Der Dienstleister ist <strong>„quasi eine ausgelagerte Abteilung\"<\/strong>.<\/p>\n<p>⚠️ <strong>Zweite Falle:<\/strong> Ohne AV-Vertrag ist die Verarbeitung rechtswidrig — und das ist ausdrücklich bußgeldbewehrt mit <strong>10 Mio € / 2 %<\/strong> (Folie 62: „pbD von Auftragsverarbeitern ohne Vertrag verarbeiten lässt\").<\/p>\n<\/blockquote>\n<h3 id=\"d-typische-fallen-zu-kapitel-11\">Typische Fallen zu Kapitel 11<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aussage<\/th>\n<th>✓/✗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bei Auftragsverarbeitung geht die Verantwortung auf den Dienstleister über.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Für die Auftragsverarbeitung ist ein Vertrag erforderlich.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Der Auftragsverarbeiter handelt auf Weisung des Verantwortlichen.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Cloud-Hosting kann eine Auftragsverarbeitung sein.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Der Auftragsverarbeiter darf die Daten für eigene Zwecke nutzen.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Was gilt, wenn eine Firma die Datenverarbeitung auslagert? Cloud-Hosting, externe Lohnbuchhaltung, ein Newsletter-Tool. Alles erlaubt — aber die Verantwortung wandert nicht mit. Das ist im Grunde der ganze Inhalt dieses Kapitels, und genau darauf zielt die typische Fangfrage. Folie 66 (Original): „ Auftragsverarbeitung (ADV), Artikel 28 DS-GVO — Grundprinzip ▪ pbD muss ein Unternehmen nicht selbst erheben, verarbeiten oder nutzen; es kann sich eines Dienstleisters im Wege der Auftragsverarbeitung bedienen ▪ Unternehmen bleibt für das Erheben, Verarbeiten und Nutzen verantwortlich, auch wenn dies durch einen Dienstleister erfolgt (Dienstleister ist quasi ausgelagerte Abteilung d. verantwortlichen Stelle) ▪ Unternehmen muss dem Dienstleister Vorgaben (Weisungen) machen, wie mit den pbD umzugehen ist\" Die drei Kernsätze ① Auslagern ist erlaubt. ② Die VERANTWORTUNG bleibt beim Auftraggeber. Immer. ③ Es braucht einen VERTRAG (AV-Vertrag) und WEISUNGEN. Alltagsbeispiele für Auftragsverarbeitung: Cloud-Hosting (AWS, Azure), Lohnabrechnung durch ein externes Büro, ein E-Mail-Marketing-Tool, ein externer IT-Dienstleister, Aktenvernichtung. Das Bild: Eine Firma lässt ihre Lohnabrechnung von einem externen Büro machen. Das Büro sieht dabei die Gehälter aller Mitarbeiter. Trotzdem bleibt die Firma diejenige, die gegenüber ihren Mitarbeitern geradesteht. Das Büro ist nur die verlängerte Werkbank und darf nur das tun, was ihm aufgetragen wurde. Es darf die Gehaltsdaten nicht für eigene Zwecke nutzen — etwa um Werbung zu verschicken. Und wenn es das doch tut, ist es kein Auftragsverarbeiter mehr, sondern selbst verantwortlich — mit allen Pflichten, die daran hängen. ⚠️ Die Falle: „Wenn ich die Verarbeitung auslagere, ist der Dienstleister verantwortlich\" → falsch . Der Auftraggeber bleibt der Verantwortliche. Der Dozent formuliert es sehr griffig: Der Dienstleister ist „quasi eine ausgelagerte Abteilung\" . ⚠️ Zweite Falle: Ohne AV-Vertrag ist die Verarbeitung rechtswidrig — und das ist ausdrücklich bußgeldbewehrt mit 10 Mio € / 2 % (Folie 62: „pbD von Auftragsverarbeitern ohne Vertrag verarbeiten lässt\"). Typische Fallen zu Kapitel 11 Aussage ✓/✗ Bei Auftragsverarbeitung geht die Verantwortung auf den Dienstleister über. ✗ Für die Auftragsverarbeitung ist ein Vertrag erforderlich. ✓ Der Auftragsverarbeiter handelt auf Weisung des Verantwortlichen. ✓ Cloud-Hosting kann eine Auftragsverarbeitung sein. ✓ Der Auftragsverarbeiter darf die Daten für eigene Zwecke nutzen. ✗","words":352,"mins":2},{"id":"d-12-datenschutz-folgenabschätzung","subject":"ds","num":"12","title":"12. Datenschutz-Folgenabschätzung","short":"Datenschutz-Folgenabschätzung","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\n<strong>Was tun, bevor man etwas Riskantes startet?<\/strong><\/p>\n<p>Erst prüfen, dann machen. Wenn ein Vorhaben voraussichtlich ein hohes Risiko für die Betroffenen mit sich bringt, muss vorher durchgespielt werden, was schiefgehen kann.<\/p>\n<p>Kurzes Kapitel, aber es hängt mit dreien anderen zusammen: mit dem Verzeichnis, mit dem Datenschutzbeauftragten und mit den Bußgeldern.<\/p>\n<\/blockquote>\n<p><strong>Folie 67 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Datenschutz-Folgenabschätzung, Art. 35 DS-GVO — Voraussetzungen<\/strong>\n▪ <strong>Einführung / Wesentliche Änderung einer Form der Verarbeitung mit einem voraussichtlich hohen Risiko für die Rechte und Freiheiten natürlicher Personen<\/strong>\n➢ <strong>Stufe 1: Risikoanalyse<\/strong>\n− Verwendung <strong>neuer Technologien<\/strong>\n− <strong>Art<\/strong> der Verarbeitung\n− <strong>Zwecke<\/strong> der Verarbeitung\n− <strong>Umfang<\/strong> der Verarbeitung\n➢ <strong>Stufe 2: Datenschutz-Folgenabschätzung<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"d-was-das-ist\">Was das ist<\/h3>\n<p>Eine <strong>vorgeschaltete Risikoprüfung<\/strong>, bevor eine riskante Verarbeitung startet. Der Auslöser ist ein <strong>voraussichtlich hohes Risiko<\/strong> für die Rechte und Freiheiten natürlicher Personen.<\/p>\n<p><strong>Zwei Stufen:<\/strong> Erst die <strong>Risikoanalyse<\/strong> (ist das Risiko hoch?), dann — nur wenn ja — die eigentliche <strong>DSFA<\/strong>.<\/p>\n<p><strong>Vier Kriterien der Risikoanalyse: neue Technologien · Art · Zwecke · Umfang.<\/strong><\/p>\n<p><strong>Typische DSFA-Fälle:<\/strong> großflächige Videoüberwachung, Scoring/Profiling, biometrische Erkennung, Verarbeitung besonderer Kategorien im großen Stil, KI-basierte Bewerberauswahl.<\/p>\n<p><strong>Einfach gesagt: wie der TÜV — aber vorher.<\/strong><\/p>\n<p>Bevor etwas Riskantes überhaupt startet, wird durchgespielt, was alles schiefgehen kann und wie man es absichert. Nicht erst, wenn es schon läuft und der erste Schaden da ist.<\/p>\n<p>Man baut ja auch keine Achterbahn, lässt sie ein Jahr fahren und prüft dann erst, ob sie sicher ist.<\/p>\n<p><strong>Zwei Verknüpfungen, die du kennen solltest:<\/strong>\n- Wer eine DSFA durchführen muss, muss (nach Folie 64) auch einen <strong>DSB benennen<\/strong>.\n- Der <strong>DSB berät<\/strong> bei der DSFA und überwacht ihre Durchführung (Art. 39, Folie 65).\n- Die DSFA ist ins <strong>Verzeichnis der Verarbeitungstätigkeiten<\/strong> aufzunehmen (Folie 57).\n- Fehlende DSFA = Bußgeld <strong>10 Mio € / 2 %<\/strong> (Folie 62).<\/p>\n<h3 id=\"d-typische-fallen-zu-kapitel-12\">Typische Fallen zu Kapitel 12<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aussage<\/th>\n<th>✓/✗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Eine DSFA ist für jede Verarbeitung durchzuführen.<\/td>\n<td><strong>✗<\/strong> — nur bei <strong>voraussichtlich hohem Risiko<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Die DSFA erfolgt nach dem Start der Verarbeitung.<\/td>\n<td><strong>✗<\/strong> — <strong>vorher<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Der DSB berät bei der DSFA.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Die Verwendung neuer Technologien ist ein Kriterium der Risikoanalyse.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Was tun, bevor man etwas Riskantes startet? Erst prüfen, dann machen. Wenn ein Vorhaben voraussichtlich ein hohes Risiko für die Betroffenen mit sich bringt, muss vorher durchgespielt werden, was schiefgehen kann. Kurzes Kapitel, aber es hängt mit dreien anderen zusammen: mit dem Verzeichnis, mit dem Datenschutzbeauftragten und mit den Bußgeldern. Folie 67 (Original): „ Datenschutz-Folgenabschätzung, Art. 35 DS-GVO — Voraussetzungen ▪ Einführung / Wesentliche Änderung einer Form der Verarbeitung mit einem voraussichtlich hohen Risiko für die Rechte und Freiheiten natürlicher Personen ➢ Stufe 1: Risikoanalyse − Verwendung neuer Technologien − Art der Verarbeitung − Zwecke der Verarbeitung − Umfang der Verarbeitung ➢ Stufe 2: Datenschutz-Folgenabschätzung \" Was das ist Eine vorgeschaltete Risikoprüfung , bevor eine riskante Verarbeitung startet. Der Auslöser ist ein voraussichtlich hohes Risiko für die Rechte und Freiheiten natürlicher Personen. Zwei Stufen: Erst die Risikoanalyse (ist das Risiko hoch?), dann — nur wenn ja — die eigentliche DSFA . Vier Kriterien der Risikoanalyse: neue Technologien · Art · Zwecke · Umfang. Typische DSFA-Fälle: großflächige Videoüberwachung, Scoring/Profiling, biometrische Erkennung, Verarbeitung besonderer Kategorien im großen Stil, KI-basierte Bewerberauswahl. Einfach gesagt: wie der TÜV — aber vorher. Bevor etwas Riskantes überhaupt startet, wird durchgespielt, was alles schiefgehen kann und wie man es absichert. Nicht erst, wenn es schon läuft und der erste Schaden da ist. Man baut ja auch keine Achterbahn, lässt sie ein Jahr fahren und prüft dann erst, ob sie sicher ist. Zwei Verknüpfungen, die du kennen solltest: - Wer eine DSFA durchführen muss, muss (nach Folie 64) auch einen DSB benennen . - Der DSB berät bei der DSFA und überwacht ihre Durchführung (Art. 39, Folie 65). - Die DSFA ist ins Verzeichnis der Verarbeitungstätigkeiten aufzunehmen (Folie 57). - Fehlende DSFA = Bußgeld 10 Mio € / 2 % (Folie 62). Typische Fallen zu Kapitel 12 Aussage ✓/✗ Eine DSFA ist für jede Verarbeitung durchzuführen. ✗ — nur bei voraussichtlich hohem Risiko Die DSFA erfolgt nach dem Start der Verarbeitung. ✗ — vorher Der DSB berät bei der DSFA. ✓ Die Verwendung neuer Technologien ist ein Kriterium der Risikoanalyse. ✓","words":350,"mins":2},{"id":"d-13-datenschutzverletzung--datenpanne","subject":"ds","num":"13","title":"13. Datenschutzverletzung / Datenpanne","short":"Datenschutzverletzung / Datenpanne","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\n<strong>Was passiert, wenn Daten abhandenkommen?<\/strong><\/p>\n<p>Verlorener USB-Stick, Hackerangriff, Mail an den falschen Verteiler. Dann läuft eine Uhr: <strong>72 Stunden<\/strong>.<\/p>\n<p>Achte genau darauf, wer wann informiert werden muss — die Behörde und die Betroffenen haben unterschiedliche Schwellen. Genau das wird umgedreht abgefragt.<\/p>\n<\/blockquote>\n<p><strong>Das ist eines der sichersten T/F-Themen, weil es eine konkrete Frist gibt: 72 Stunden.<\/strong><\/p>\n<h3 id=\"d-131-was-ist-eine-datenpanne-folie-68-original\">13.1 Was ist eine Datenpanne? (Folie 68, Original)<\/h3>\n<blockquote>\n<p>„<strong>Datenschutzverletzung Artikel 33 DS-GVO — Was ist eine Datenpanne im Sinne der DS-GVO?<\/strong>\n➢ Die <strong>unrechtmäßige Übermittlung pbD oder die unrechtmäßige Kenntniserlangung durch Dritte<\/strong> <strong>und<\/strong>\n➢ dass die Verletzung des Schutzes pbD <strong>voraussichtlich zu einem Risiko für die Rechte und Freiheiten natürlicher Personen<\/strong> führt.\"<\/p>\n<\/blockquote>\n<h3 id=\"d-132-die-meldepflichten-folie-69-original\">13.2 Die Meldepflichten (Folie 69, Original)<\/h3>\n<blockquote>\n<p>„▪ Im Fall einer Verletzung muss die Meldung <strong>gegenüber der Behörde unverzüglich (mind. binnen 72 Stunden)<\/strong> erfolgen.\n▪ Die <strong>Meldepflicht gilt für alle Kategorien<\/strong> von personenbezogenen Daten <strong>unabhängig von ihrer Sensibilität<\/strong>.\n▪ Sofern die Verletzung voraussichtlich ein <strong>hohes Risiko<\/strong> für die Rechte u. Freiheiten natürlicher Personen zur Folge hat, muss die Meldung <strong>auch gegenüber der betroffenen Person<\/strong> erfolgen.\"<\/p>\n<\/blockquote>\n<h3 id=\"d-die-zwei-meldewege-merk-dir-die-schwellen\">Die zwei Meldewege — merk dir die Schwellen!<\/h3>\n<table>\n<thead>\n<tr>\n<th>An wen<\/th>\n<th>Wann<\/th>\n<th>Schwelle<\/th>\n<th>Artikel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Aufsichtsbehörde<\/strong><\/td>\n<td>unverzüglich, <strong>binnen 72 Stunden<\/strong><\/td>\n<td><strong>Risiko<\/strong> für Rechte und Freiheiten<\/td>\n<td><strong>Art. 33<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Betroffene Person<\/strong><\/td>\n<td>unverzüglich<\/td>\n<td><strong>HOHES Risiko<\/strong><\/td>\n<td><strong>Art. 34<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>⚠️ <strong>Die entscheidende Unterscheidung:<\/strong> An die <strong>Behörde<\/strong> meldest du schon bei einem einfachen <strong>Risiko<\/strong>. An die <strong>Betroffenen<\/strong> erst bei <strong>hohem Risiko<\/strong>. Das ist genau die Art von Nuance, die in T/F-Fragen umgedreht wird.<\/p>\n<p>⚠️ <strong>Zweite Falle:<\/strong> Die 72-Stunden-Frist gilt <strong>nur gegenüber der Aufsichtsbehörde<\/strong>. Gegenüber Betroffenen gilt „unverzüglich\" ohne feste Stundenzahl.<\/p>\n<p>⚠️ <strong>Dritte Falle:<\/strong> Die Meldepflicht gilt <strong>unabhängig von der Sensibilität<\/strong> der Daten. Es müssen also keine Gesundheits- oder Finanzdaten betroffen sein.<\/p>\n<\/blockquote>\n<p><strong>Alltagsbeispiele für Datenpannen:<\/strong> Verlorener USB-Stick mit Kundendaten · E-Mail an den falschen Verteiler mit offenem CC · Ransomware-Angriff · gestohlener Laptop · fehlkonfigurierter S3-Bucket · versehentlich öffentliche Datenbank.<\/p>\n<p><strong>Erpressungsfall:<\/strong> Der Dozent hat dazu eine eigene Folie:\n<strong>Folie 51 (Original):<\/strong> „<strong>bei Erpressung 1. Maßnahme: Strafanzeige!<\/strong>\"<\/p>\n<h3 id=\"d-typische-fallen-zu-kapitel-13\">Typische Fallen zu Kapitel 13<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aussage<\/th>\n<th>✓/✗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Eine Datenpanne ist der Aufsichtsbehörde binnen 72 Stunden zu melden.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Eine Datenpanne ist der Aufsichtsbehörde binnen 72 Tagen zu melden.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Betroffene sind bei jeder Datenpanne zu informieren.<\/td>\n<td><strong>✗<\/strong> — nur bei <strong>hohem Risiko<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Die Meldepflicht gilt nur für besondere Kategorien von Daten.<\/td>\n<td><strong>✗<\/strong> — unabhängig von der Sensibilität<\/td>\n<\/tr>\n<tr>\n<td>Bei Erpressung ist die erste Maßnahme die Zahlung des Lösegelds.<\/td>\n<td><strong>✗<\/strong> — <strong>Strafanzeige<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Ein verlorener USB-Stick mit Kundendaten kann eine meldepflichtige Datenpanne sein.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Was passiert, wenn Daten abhandenkommen? Verlorener USB-Stick, Hackerangriff, Mail an den falschen Verteiler. Dann läuft eine Uhr: 72 Stunden . Achte genau darauf, wer wann informiert werden muss — die Behörde und die Betroffenen haben unterschiedliche Schwellen. Genau das wird umgedreht abgefragt. Das ist eines der sichersten T/F-Themen, weil es eine konkrete Frist gibt: 72 Stunden. 13.1 Was ist eine Datenpanne? (Folie 68, Original) „ Datenschutzverletzung Artikel 33 DS-GVO — Was ist eine Datenpanne im Sinne der DS-GVO? ➢ Die unrechtmäßige Übermittlung pbD oder die unrechtmäßige Kenntniserlangung durch Dritte und ➢ dass die Verletzung des Schutzes pbD voraussichtlich zu einem Risiko für die Rechte und Freiheiten natürlicher Personen führt.\" 13.2 Die Meldepflichten (Folie 69, Original) „▪ Im Fall einer Verletzung muss die Meldung gegenüber der Behörde unverzüglich (mind. binnen 72 Stunden) erfolgen. ▪ Die Meldepflicht gilt für alle Kategorien von personenbezogenen Daten unabhängig von ihrer Sensibilität . ▪ Sofern die Verletzung voraussichtlich ein hohes Risiko für die Rechte u. Freiheiten natürlicher Personen zur Folge hat, muss die Meldung auch gegenüber der betroffenen Person erfolgen.\" Die zwei Meldewege — merk dir die Schwellen! An wen Wann Schwelle Artikel Aufsichtsbehörde unverzüglich, binnen 72 Stunden Risiko für Rechte und Freiheiten Art. 33 Betroffene Person unverzüglich HOHES Risiko Art. 34 ⚠️ Die entscheidende Unterscheidung: An die Behörde meldest du schon bei einem einfachen Risiko . An die Betroffenen erst bei hohem Risiko . Das ist genau die Art von Nuance, die in T/F-Fragen umgedreht wird. ⚠️ Zweite Falle: Die 72-Stunden-Frist gilt nur gegenüber der Aufsichtsbehörde . Gegenüber Betroffenen gilt „unverzüglich\" ohne feste Stundenzahl. ⚠️ Dritte Falle: Die Meldepflicht gilt unabhängig von der Sensibilität der Daten. Es müssen also keine Gesundheits- oder Finanzdaten betroffen sein. Alltagsbeispiele für Datenpannen: Verlorener USB-Stick mit Kundendaten · E-Mail an den falschen Verteiler mit offenem CC · Ransomware-Angriff · gestohlener Laptop · fehlkonfigurierter S3-Bucket · versehentlich öffentliche Datenbank. Erpressungsfall: Der Dozent hat dazu eine eigene Folie: Folie 51 (Original): „ bei Erpressung 1. Maßnahme: Strafanzeige! \" Typische Fallen zu Kapitel 13 Aussage ✓/✗ Eine Datenpanne ist der Aufsichtsbehörde binnen 72 Stunden zu melden. ✓ Eine Datenpanne ist der Aufsichtsbehörde binnen 72 Tagen zu melden. ✗ Betroffene sind bei jeder Datenpanne zu informieren. ✗ — nur bei hohem Risiko Die Meldepflicht gilt nur für besondere Kategorien von Daten. ✗ — unabhängig von der Sensibilität Bei Erpressung ist die erste Maßnahme die Zahlung des Lösegelds. ✗ — Strafanzeige Ein verlorener USB-Stick mit Kundendaten kann eine meldepflichtige Datenpanne sein. ✓","words":415,"mins":2},{"id":"d-14-beschäftigtendatenschutz","subject":"ds","num":"14","title":"14. Beschäftigtendatenschutz","short":"Beschäftigtendatenschutz","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\n<strong>Sonderregeln für Mitarbeiterdaten.<\/strong><\/p>\n<p>Hier gilt nicht die DSGVO, sondern das deutsche BDSG, konkret § 26.<\/p>\n<p>Zwei Dinge überraschen die meisten: Auch <strong>Bewerber<\/strong> und <strong>längst ausgeschiedene<\/strong> Mitarbeiter zählen als Beschäftigte. Und im Arbeitsverhältnis braucht eine Einwilligung in der Regel Schriftform.<\/p>\n<\/blockquote>\n<p>Rechtsgrundlage ist hier nicht die DSGVO, sondern das <strong>BDSG<\/strong> — konkret <strong>§ 26<\/strong>. Deutschland hat dafür eine Öffnungsklausel genutzt.<\/p>\n<h3 id=\"d-141-wer-ist-beschaftigter-26-viii-bdsg-folie-70-original\">14.1 Wer ist „Beschäftigter\"? — § 26 VIII BDSG (Folie 70, Original)<\/h3>\n<blockquote>\n<p>„▪ <strong>Arbeitnehmer<\/strong> und <strong>arbeitnehmerähnliche Personen<\/strong> ▪ <strong>Auszubildende<\/strong> ▪ <strong>Bewerber<\/strong> ▪ <strong>Ausgeschiedene Beschäftigte<\/strong> ▪ Beschäftigte nach dem Jugendfreiwilligengesetz ▪ Beschäftigte in anerkannten Behindertenwerkstätten ▪ Beschäftigte in Reha-/Wiedereingliederungsmaßnahmen ▪ <strong>Beamte, Richter, Soldaten, Bundesfreiwilligendienstleistende<\/strong>\"<\/p>\n<p>⚠️ <strong>Die wichtigsten zwei Einträge für T/F: Bewerber und ausgeschiedene Beschäftigte.<\/strong> Der Begriff ist viel weiter als „aktuell Angestellte\". Wer sich nur beworben hat, ist schon Beschäftigter im Sinne des § 26 — und wer längst gekündigt hat, ebenfalls.<\/p>\n<\/blockquote>\n<h3 id=\"d-142-wann-darf-verarbeitet-werden-26-i-s-1-folie-71-original\">14.2 Wann darf verarbeitet werden? — § 26 I S. 1 (Folie 71, Original)<\/h3>\n<blockquote>\n<p>„Personenbezogene Daten von Beschäftigten dürfen für Zwecke des Beschäftigungsverhältnisses verarbeitet werden, <strong>wenn dies erforderlich ist<\/strong> für\n▪ die <strong>Entscheidung über die Begründung<\/strong> eines Beschäftigungsverhältnisses <strong>oder<\/strong>\n▪ die <strong>Durchführung<\/strong> des Beschäftigungsverhältnisses <strong>oder<\/strong>\n▪ die <strong>Beendigung<\/strong> des Beschäftigungsverhältnisses <strong>oder<\/strong>\n▪ die Ausübung oder Erfüllung der sich aus einem <strong>Gesetz oder Tarifvertrag, einer Betriebs- oder Dienstvereinbarung<\/strong> ergebenden Rechte und Pflichten der <strong>Interessenvertretung<\/strong>.\"<\/p>\n<\/blockquote>\n<p><strong>Der Lebenszyklus: Begründung → Durchführung → Beendigung.<\/strong> Plus: Rechte der Interessenvertretung (Betriebsrat).<\/p>\n<p><strong>Das Schlüsselwort ist „erforderlich\".<\/strong> Nicht „nützlich\", nicht „praktisch\" — erforderlich.<\/p>\n<h3 id=\"d-143-verarbeitung-zur-straftataufdeckung-26-i-s-2-folie-72-original\">14.3 Verarbeitung zur Straftataufdeckung — § 26 I S. 2 (Folie 72, Original)<\/h3>\n<blockquote>\n<p>„Verarbeitung von Beschäftigtendaten bei Ermittlungen/Straftaten:\n▪ Ziel ist die <strong>Aufdeckung von Straftaten<\/strong>.\n▪ <strong>Dokumentierte tatsächliche Anhaltspunkte<\/strong> begründen den <strong>Verdacht<\/strong>, dass eine Straftat begangen wurde.\n▪ Die Erhebung, Verarbeitung oder Nutzung ist <strong>zur Aufdeckung erforderlich<\/strong>.\n▪ Das schutzwürdige Interesse des Beschäftigten … <strong>überwiegt nicht (keine Unverhältnismäßigkeit)<\/strong>.\"<\/p>\n<\/blockquote>\n<p><strong>Vier kumulative Voraussetzungen.<\/strong> Der Punkt: <strong>Verdachtslose Überwachung „ins Blaue hinein\" ist unzulässig.<\/strong> Es braucht dokumentierte tatsächliche Anhaltspunkte.<\/p>\n<p><strong>Alltagsbeispiel:<\/strong> Ein Arbeitgeber darf nicht präventiv alle E-Mails scannen, um vielleicht mal etwas zu finden. Er darf aber bei einem konkreten, dokumentierten Diebstahlsverdacht gezielt ermitteln.<\/p>\n<h3 id=\"d-144-einwilligung-im-arbeitsverhaltnis-26-ii-folie-73-original\">14.4 Einwilligung im Arbeitsverhältnis — § 26 II (Folie 73, Original)<\/h3>\n<blockquote>\n<p>„Zur Beurteilung der <strong>Freiwilligkeit<\/strong> einer Einwilligung ist insbesondere zu berücksichtigen:\n▪ Die im Beschäftigungsverhältnis bestehende <strong>Abhängigkeit<\/strong> der beschäftigten Person.\n▪ Die <strong>Umstände<\/strong>, unter denen die Einwilligung erteilt worden ist.\n▪ <strong>Die Einwilligung bedarf der Schriftform<\/strong>, soweit nicht wegen besonderer Umstände eine andere Form angemessen ist.\n▪ Die Beschäftigten müssen über ihr <strong>Widerrufsrecht<\/strong> informiert werden.\"<\/p>\n<p>⚠️ <strong>Wichtige Falle:<\/strong> Im Arbeitsverhältnis gilt die <strong>Schriftform<\/strong> als Regel — anders als bei der allgemeinen Einwilligung nach Art. 7 DSGVO, wo keine Unterschrift nötig ist (Kapitel 5.3). Diese beiden Sätze widersprechen sich scheinbar, sind aber beide richtig: <strong>Art. 7 DSGVO = keine Form. § 26 II BDSG (Beschäftigte) = Schriftform als Regel.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Der Grundgedanke:<\/strong> Wegen des <strong>Abhängigkeitsverhältnisses<\/strong> ist eine Einwilligung im Arbeitsverhältnis kritisch zu prüfen — kann ein Mitarbeiter dem Chef gegenüber wirklich frei „nein\" sagen?<\/p>\n<h3 id=\"d-typische-fallen-zu-kapitel-14\">Typische Fallen zu Kapitel 14<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aussage<\/th>\n<th>✓/✗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bewerber sind Beschäftigte im Sinne des § 26 BDSG.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Ausgeschiedene Mitarbeiter fallen nicht mehr unter § 26 BDSG.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Verdachtslose Überwachung zur Straftataufdeckung ist zulässig.<\/td>\n<td><strong>✗<\/strong> — es braucht dokumentierte tatsächliche Anhaltspunkte<\/td>\n<\/tr>\n<tr>\n<td>Eine Einwilligung im Beschäftigungsverhältnis bedarf in der Regel der Schriftform.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Beschäftigtendaten dürfen für die Beendigung des Arbeitsverhältnisses verarbeitet werden.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Die Abhängigkeit des Beschäftigten ist bei der Freiwilligkeit zu berücksichtigen.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Sonderregeln für Mitarbeiterdaten. Hier gilt nicht die DSGVO, sondern das deutsche BDSG, konkret § 26. Zwei Dinge überraschen die meisten: Auch Bewerber und längst ausgeschiedene Mitarbeiter zählen als Beschäftigte. Und im Arbeitsverhältnis braucht eine Einwilligung in der Regel Schriftform. Rechtsgrundlage ist hier nicht die DSGVO, sondern das BDSG — konkret § 26 . Deutschland hat dafür eine Öffnungsklausel genutzt. 14.1 Wer ist „Beschäftigter\"? — § 26 VIII BDSG (Folie 70, Original) „▪ Arbeitnehmer und arbeitnehmerähnliche Personen ▪ Auszubildende ▪ Bewerber ▪ Ausgeschiedene Beschäftigte ▪ Beschäftigte nach dem Jugendfreiwilligengesetz ▪ Beschäftigte in anerkannten Behindertenwerkstätten ▪ Beschäftigte in Reha-/Wiedereingliederungsmaßnahmen ▪ Beamte, Richter, Soldaten, Bundesfreiwilligendienstleistende \" ⚠️ Die wichtigsten zwei Einträge für T/F: Bewerber und ausgeschiedene Beschäftigte. Der Begriff ist viel weiter als „aktuell Angestellte\". Wer sich nur beworben hat, ist schon Beschäftigter im Sinne des § 26 — und wer längst gekündigt hat, ebenfalls. 14.2 Wann darf verarbeitet werden? — § 26 I S. 1 (Folie 71, Original) „Personenbezogene Daten von Beschäftigten dürfen für Zwecke des Beschäftigungsverhältnisses verarbeitet werden, wenn dies erforderlich ist für ▪ die Entscheidung über die Begründung eines Beschäftigungsverhältnisses oder ▪ die Durchführung des Beschäftigungsverhältnisses oder ▪ die Beendigung des Beschäftigungsverhältnisses oder ▪ die Ausübung oder Erfüllung der sich aus einem Gesetz oder Tarifvertrag, einer Betriebs- oder Dienstvereinbarung ergebenden Rechte und Pflichten der Interessenvertretung .\" Der Lebenszyklus: Begründung → Durchführung → Beendigung. Plus: Rechte der Interessenvertretung (Betriebsrat). Das Schlüsselwort ist „erforderlich\". Nicht „nützlich\", nicht „praktisch\" — erforderlich. 14.3 Verarbeitung zur Straftataufdeckung — § 26 I S. 2 (Folie 72, Original) „Verarbeitung von Beschäftigtendaten bei Ermittlungen/Straftaten: ▪ Ziel ist die Aufdeckung von Straftaten . ▪ Dokumentierte tatsächliche Anhaltspunkte begründen den Verdacht , dass eine Straftat begangen wurde. ▪ Die Erhebung, Verarbeitung oder Nutzung ist zur Aufdeckung erforderlich . ▪ Das schutzwürdige Interesse des Beschäftigten … überwiegt nicht (keine Unverhältnismäßigkeit) .\" Vier kumulative Voraussetzungen. Der Punkt: Verdachtslose Überwachung „ins Blaue hinein\" ist unzulässig. Es braucht dokumentierte tatsächliche Anhaltspunkte. Alltagsbeispiel: Ein Arbeitgeber darf nicht präventiv alle E-Mails scannen, um vielleicht mal etwas zu finden. Er darf aber bei einem konkreten, dokumentierten Diebstahlsverdacht gezielt ermitteln. 14.4 Einwilligung im Arbeitsverhältnis — § 26 II (Folie 73, Original) „Zur Beurteilung der Freiwilligkeit einer Einwilligung ist insbesondere zu berücksichtigen: ▪ Die im Beschäftigungsverhältnis bestehende Abhängigkeit der beschäftigten Person. ▪ Die Umstände , unter denen die Einwilligung erteilt worden ist. ▪ Die Einwilligung bedarf der Schriftform , soweit nicht wegen besonderer Umstände eine andere Form angemessen ist. ▪ Die Beschäftigten müssen über ihr Widerrufsrecht informiert werden.\" ⚠️ Wichtige Falle: Im Arbeitsverhältnis gilt die Schriftform als Regel — anders als bei der allgemeinen Einwilligung nach Art. 7 DSGVO, wo keine Unterschrift nötig ist (Kapitel 5.3). Diese beiden Sätze widersprechen sich scheinbar, sind aber beide richtig: Art. 7 DSGVO = keine Form. § 26 II BDSG (Beschäftigte) = Schriftform als Regel. Der Grundgedanke: Wegen des Abhängigkeitsverhältnisses ist eine Einwilligung im Arbeitsverhältnis kritisch zu prüfen — kann ein Mitarbeiter dem Chef gegenüber wirklich frei „nein\" sagen? Typische Fallen zu Kapitel 14 Aussage ✓/✗ Bewerber sind Beschäftigte im Sinne des § 26 BDSG. ✓ Ausgeschiedene Mitarbeiter fallen nicht mehr unter § 26 BDSG. ✗ Verdachtslose Überwachung zur Straftataufdeckung ist zulässig. ✗ — es braucht dokumentierte tatsächliche Anhaltspunkte Eine Einwilligung im Beschäftigungsverhältnis bedarf in der Regel der Schriftform. ✓ Beschäftigtendaten dürfen für die Beendigung des Arbeitsverhältnisses verarbeitet werden. ✓ Die Abhängigkeit des Beschäftigten ist bei der Freiwilligkeit zu berücksichtigen. ✓","words":566,"mins":3},{"id":"d-15-cybersicherheit","subject":"ds","num":"15","title":"15. Cybersicherheit","short":"Cybersicherheit","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nDer praktische Teil: Was macht ein Unternehmen, wenn es angegriffen wird?<\/p>\n<p>Hier gibt es wenig auswendig zu lernen. Merk dir die Zweiteilung in technische und organisatorische Ebene — und die zwei Sätze, die der Dozent besonders betont hat.<\/p>\n<\/blockquote>\n<p>Dieser Block ist eher praktisch als juristisch. Merk dir die Struktur, nicht die Details.<\/p>\n<h3 id=\"d-151-das-spannungsfeld-folie-50-original\">15.1 Das Spannungsfeld (Folie 50, Original)<\/h3>\n<blockquote>\n<p>„<strong>Sicherheit darf nicht nerven<\/strong> — Restriktion und Freiheit\nBeschränkung der Zugangsberechtigung · Sicherheitsgesetze · IT-Sicherheitskonzept ↔ <strong>Gewährleistung von Effizienz und Produktivität<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"d-152-was-zahlt-bei-einem-angriff-folie-52-original\">15.2 Was zählt bei einem Angriff? (Folie 52, Original)<\/h3>\n<blockquote>\n<p>„<strong>Cyberangriff findet statt — Ziel des Unternehmens<\/strong>\n➢ <strong>Maximale Schadensbegrenzung<\/strong>\n➢ <strong>Schnelle Rückkehr zum Normalzustand<\/strong>\n<strong>Voraussetzung dafür sind<\/strong>\n➢ <strong>Kommunikation<\/strong>\n➢ <strong>Reaktionsschnelligkeit<\/strong>\n➢ <strong>Lückenlos nachvollziehbare Dokumentation der Geschehnisse<\/strong>\"<\/p>\n<\/blockquote>\n<p>Der Dozent unterscheidet zwei Ebenen:<\/p>\n<p><strong>Technische Ebene (Folie 53, Original):<\/strong><\/p>\n<blockquote>\n<p>„1. <strong>Redundanzen mittels Backups<\/strong> schaffen.\n2. Technisch notwendige Standards aus rechtlichen Vorgaben, z.B. <strong>DSGVO, BSI-Kritis-Verordnung, Cybersicherheitsstärkungsgesetz, ISO Normen<\/strong> ableiten\n➢ <strong>Cloudbasierte Lösungen statt Insellösungen<\/strong> in der IT, um „State of the Art\" in Sicherheit und Verfügbarkeit zu sein.\n➢ Auslagerung in Rechenzentren und Zusammenschluss mit Gleichgesinnten\n➢ <strong>Permanent Sicherheitsupdates installieren, Firewall aktualisieren<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Prozessuale/organisatorische Ebene (Folie 54, Original):<\/strong><\/p>\n<blockquote>\n<p>„1. Schritt: <strong>Sensibilisierung der Beschäftigten durch regelmäßiges Training<\/strong>\n2. <strong>Krisen- und Notfallplan aktivieren<\/strong>, der eine schnelle und zielgerichtete Kommunikation vorsieht\n➢ <strong>Rechte und Rollen sowie Verantwortlichkeiten festlegen<\/strong>\n➢ <strong>Kommunikationskaskaden<\/strong> vorbereiten, Anweisungen durch Krisenstäbe …\"<\/p>\n<p>⚠️ <strong>Merke:<\/strong> Der <strong>erste Schritt auf der organisatorischen Ebene ist die Sensibilisierung/Schulung der Beschäftigten<\/strong> — nicht die Technik. Und bei <strong>Erpressung ist die erste Maßnahme die Strafanzeige<\/strong> (Folie 51).<\/p>\n<\/blockquote>","text":"Worum es hier geht — in einfachen Worten Der praktische Teil: Was macht ein Unternehmen, wenn es angegriffen wird? Hier gibt es wenig auswendig zu lernen. Merk dir die Zweiteilung in technische und organisatorische Ebene — und die zwei Sätze, die der Dozent besonders betont hat. Dieser Block ist eher praktisch als juristisch. Merk dir die Struktur, nicht die Details. 15.1 Das Spannungsfeld (Folie 50, Original) „ Sicherheit darf nicht nerven — Restriktion und Freiheit Beschränkung der Zugangsberechtigung · Sicherheitsgesetze · IT-Sicherheitskonzept ↔ Gewährleistung von Effizienz und Produktivität \" 15.2 Was zählt bei einem Angriff? (Folie 52, Original) „ Cyberangriff findet statt — Ziel des Unternehmens ➢ Maximale Schadensbegrenzung ➢ Schnelle Rückkehr zum Normalzustand Voraussetzung dafür sind ➢ Kommunikation ➢ Reaktionsschnelligkeit ➢ Lückenlos nachvollziehbare Dokumentation der Geschehnisse \" Der Dozent unterscheidet zwei Ebenen: Technische Ebene (Folie 53, Original): „1. Redundanzen mittels Backups schaffen. 2. Technisch notwendige Standards aus rechtlichen Vorgaben, z.B. DSGVO, BSI-Kritis-Verordnung, Cybersicherheitsstärkungsgesetz, ISO Normen ableiten ➢ Cloudbasierte Lösungen statt Insellösungen in der IT, um „State of the Art\" in Sicherheit und Verfügbarkeit zu sein. ➢ Auslagerung in Rechenzentren und Zusammenschluss mit Gleichgesinnten ➢ Permanent Sicherheitsupdates installieren, Firewall aktualisieren \" Prozessuale/organisatorische Ebene (Folie 54, Original): „1. Schritt: Sensibilisierung der Beschäftigten durch regelmäßiges Training 2. Krisen- und Notfallplan aktivieren , der eine schnelle und zielgerichtete Kommunikation vorsieht ➢ Rechte und Rollen sowie Verantwortlichkeiten festlegen ➢ Kommunikationskaskaden vorbereiten, Anweisungen durch Krisenstäbe …\" ⚠️ Merke: Der erste Schritt auf der organisatorischen Ebene ist die Sensibilisierung/Schulung der Beschäftigten — nicht die Technik. Und bei Erpressung ist die erste Maßnahme die Strafanzeige (Folie 51).","words":260,"mins":1},{"id":"d-16-künstliche-intelligenz--ki-vo","subject":"ds","num":"16","title":"16. Künstliche Intelligenz & KI-VO","short":"Künstliche Intelligenz & KI-VO","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nEin Drittel der Folien geht um KI. Rechne also mit mehreren Fragen dazu.<\/p>\n<p>Zwei Blöcke: <strong>die KI-Verordnung<\/strong> (seit 2024 in Kraft, mit einer Risiko-Pyramide von „verboten\" bis „egal\") und <strong>KI im Datenschutz<\/strong> (was du in einen Chatbot tippst, sind Daten).<\/p>\n<p>Als Informatiker hast du hier einen Vorteil: Du weißt, dass eine Wenn-Dann-Regel keine KI ist. Genau danach wird gefragt.<\/p>\n<\/blockquote>\n<p><strong>Der Dozent hat ~40 der 114 Folien auf KI verwendet<\/strong> — also gut ein Drittel. Rechne mit mehreren T/F-Fragen.<\/p>\n<h3 id=\"d-161-die-legaldefinition-art-3-nr-1-ki-vo-folie-82-original\">16.1 Die Legaldefinition — Art. 3 Nr. 1 KI-VO (Folie 82, Original)<\/h3>\n<blockquote>\n<p>„<strong>Das ist KI:<\/strong>\n➢ „ein <strong>maschinengestütztes System<\/strong>, das für einen […] <strong>autonomen Betrieb<\/strong> ausgelegt ist und das nach seiner Betriebsaufnahme <strong>anpassungsfähig<\/strong> sein kann und das aus den erhaltenen <strong>Eingaben<\/strong> für explizite oder implizite <strong>Ziele ableitet<\/strong> […] die <strong>physische oder virtuelle Umgebungen beeinflussen<\/strong> können\" (<strong>Legaldefinition in Art. 3 Nr. 1 KI-VO<\/strong>)<\/p>\n<p><strong>Das ist KI nicht:<\/strong>\n➢ <strong>Regelbasierte Software<\/strong>\n➢ <strong>Expertensysteme, die nur Muster abgleichen<\/strong>, ohne für autonomen Betrieb und anpassungsfähig zu sein\n➢ <strong>Herkömmliche Programmierung<\/strong>\n• <strong>wenn-dann-Regeln<\/strong>\n• Umfeld ist einmalig untersucht und wird fest beschrieben: Veränderungen im Umfeld führen zu Veränderungen im Code\"<\/p>\n<\/blockquote>\n<p><strong>Die Merkmale: maschinengestützt · autonom · anpassungsfähig · leitet aus Eingaben Ergebnisse ab · beeinflusst Umgebungen.<\/strong><\/p>\n<blockquote>\n<p>⚠️ <strong>Sehr wahrscheinliche T/F-Frage:<\/strong> „Regelbasierte Software / ein klassisches Expertensystem / eine if-then-Automatisierung ist ein KI-System im Sinne der KI-VO\" → <strong>falsch<\/strong>.\nAls Informatiker hast du hier einen Vorteil: Der Unterschied ist <strong>gelernte Ableitung vs. fest programmierte Regel<\/strong>.<\/p>\n<\/blockquote>\n<h3 id=\"d-162-das-datum-folie-83-original\">16.2 Das Datum (Folie 83, Original)<\/h3>\n<blockquote>\n<p>„<strong>Die KI-Verordnung trat zum 01.08.2024 in Kraft<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>01.08.2024<\/strong> — merken. Nicht mit dem DSGVO-Datum (25.05.2018) verwechseln.<\/p>\n<h3 id=\"d-163-die-akteure-folie-84\">16.3 Die Akteure (Folie 84)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Akteur<\/th>\n<th>Definition laut Folie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Anbieter<\/strong><\/td>\n<td>(eigene oder fremde) <strong>Entwicklung<\/strong> eines KI-Systems, mit dem Ziel des <strong>Inverkehrbringens oder der Inbetriebnahme<\/strong>, unter <strong>eigenem Namen / eigener Marke<\/strong>, <strong>entgeltlich oder unentgeltlich<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Nutzer / Betreiber<\/strong><\/td>\n<td><strong>Verwendung<\/strong> eines KI-Systems <strong>in eigener Verantwortung<\/strong>. <strong>Ausnahme: persönliche, nicht berufliche Tätigkeiten<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Aber auch<\/strong><\/td>\n<td>Produkthersteller, Händler, Einführer u. a.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>⚠️ Beachte die Parallele zur DSGVO: Auch die KI-VO hat eine <strong>Ausnahme für rein private Nutzung<\/strong> — genau wie die Haushaltsausnahme in Art. 2 DSGVO.<\/p>\n<\/blockquote>\n<h3 id=\"d-164-der-risikobasierte-ansatz-folie-85-original\">16.4 Der risikobasierte Ansatz ★★★ (Folie 85, Original)<\/h3>\n<blockquote>\n<p>„<strong>Risikobasierter Regulierungsansatz der KI-VO<\/strong>\n<strong>verbotene KI-Systeme<\/strong> ➢ <strong>Verbot des Inverkehrbringens, Inbetriebnahme oder Anwendung<\/strong>\n<strong>Hochrisiko KI-Systeme<\/strong> ➢ Besondere Anforderungen und Pflichten, <strong>Art. 6 – 49<\/strong>, je nach Gefährdungs- und Schadenspotential\n<strong>bestimmte KI-Systeme<\/strong> ➢ <strong>Transparenzpflichten, Art. 50<\/strong>, KI-Kenntnisse (<strong>Deepfakes, Chatbots<\/strong>)\n<strong>risikoarme KI-Systeme<\/strong> ➢ <strong>Freiwillige Anwendung<\/strong> bestimmter Anforderungen <strong>Art. 95<\/strong>\n<strong>KI-Systeme mit allg. Verwendungszweck<\/strong> ➢ Spezifische Anforderungen an <strong>Sicherheit und Zuverlässigkeit<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Die Pyramide von oben nach unten:<\/strong><\/p>\n<pre><code>┌─ VERBOTEN ──────────────── gar nicht erlaubt (z.B. Social Scoring,\n│                            manipulative Systeme, biometrische Massenüberwachung)\n├─ HOCHRISIKO ────────────── strenge Pflichten, Art. 6–49\n├─ TRANSPARENZPFLICHT ────── Deepfakes, Chatbots: Art. 50 — man muss wissen,\n│                            dass man mit einer Maschine spricht\n├─ RISIKOARM ─────────────── freiwillige Verhaltenskodizes, Art. 95\n└─ GPAI (allg. Zweck) ────── eigene Regeln zu Sicherheit und Zuverlässigkeit\n<\/code><\/pre>\n<p><strong>Merksatz:<\/strong> <em>Je höher das Risiko, desto strenger die Pflicht — von Verbot bis Freiwilligkeit.<\/em><\/p>\n<blockquote>\n<p>⚠️ <strong>Falle:<\/strong> Nicht jede KI ist verboten oder hochriskant. Die meisten Systeme fallen in die <strong>risikoarme<\/strong> Kategorie mit rein <strong>freiwilligen<\/strong> Anforderungen. Eine Aussage wie „Die KI-VO verbietet den Einsatz von KI-Systemen grundsätzlich\" ist <strong>falsch<\/strong> — das wäre das DSGVO-Prinzip (Verbot mit Erlaubnisvorbehalt), nicht das der KI-VO.<\/p>\n<\/blockquote>\n<h3 id=\"d-165-der-zeitplan-folie-86-original\">16.5 Der Zeitplan (Folie 86, Original)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Datum<\/th>\n<th>Abstand<\/th>\n<th>Was gilt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>01.08.2024<\/strong><\/td>\n<td>Inkrafttreten (20 Tage nach Veröffentlichung im Amtsblatt)<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td><strong>02.02.2025<\/strong><\/td>\n<td><strong>+6 Monate<\/strong><\/td>\n<td>allgemeine Bestimmungen und <strong>verbotene KI-Praktiken<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>02.08.2025<\/strong><\/td>\n<td><strong>+12 Monate<\/strong><\/td>\n<td>notifizierende Behörden/Stellen, <strong>Verpflichtungen für universelle KI-Modelle<\/strong>, Verwaltung, <strong>Sanktionen<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>02.08.2026<\/strong><\/td>\n<td><strong>+24 Monate<\/strong><\/td>\n<td><strong>alle übrigen Verpflichtungen<\/strong> (außer den genannten)<\/td>\n<\/tr>\n<tr>\n<td><strong>02.08.2027<\/strong><\/td>\n<td><strong>+36 Monate<\/strong><\/td>\n<td>Verpflichtungen für <strong>andere KI-Systeme mit hohem Risiko<\/strong><\/td>\n<\/tr>\n<tr>\n<td><em>02.12.2027<\/em><\/td>\n<td><em>„Soll verschoben werden\"<\/em><\/td>\n<td>(Vermerk auf der Folie)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Merkhilfe:<\/strong> Verbote zuerst (6 Monate), dann Sanktionen (12), dann der Rest (24), dann Hochrisiko in Produkten (36).<\/p>\n<h3 id=\"d-166-art-4-ki-vo-ki-kompetenz-folie-89-original\">16.6 Art. 4 KI-VO — KI-Kompetenz (Folie 89, Original)<\/h3>\n<blockquote>\n<p>„<strong>Artikel 4 KI-Kompetenz<\/strong>\nDie <strong>Anbieter und Betreiber<\/strong> von KI-Systemen ergreifen Maßnahmen, um nach besten Kräften sicherzustellen, dass <strong>ihr Personal<\/strong> und andere Personen, die in ihrem Auftrag mit dem Betrieb und der Nutzung von KI-Systemen befasst sind, über ein <strong>ausreichendes Maß an KI-Kompetenz<\/strong> verfügen …\nDiese <strong>„muss\"-Vorschrift<\/strong> erscheint für kleine und mittlere Betreiber unverhältnismäßig.\"<\/p>\n<\/blockquote>\n<p><strong>Kurz:<\/strong> Wer KI einsetzt, muss sein Personal schulen. Das ist eine <strong>Pflicht<\/strong>, keine Empfehlung — und gilt für <strong>Anbieter und Betreiber<\/strong>.<\/p>\n<h3 id=\"d-167-menschliche-aufsicht-folie-88-original\">16.7 Menschliche Aufsicht (Folie 88, Original)<\/h3>\n<blockquote>\n<p>„<strong>Ziel: Vertrauenswürdige KI<\/strong> — Menschliche Aufsicht von KI-Systemen besonders im <strong>Hochrisiko-Bereich<\/strong>\n<strong>Verstehen<\/strong>: Menschen müssen den <strong>Output der KI nachvollziehen und prüfen<\/strong> können\n<strong>Kontrolle<\/strong>: Menschen brauchen die <strong>Stopptaste<\/strong> (unterschiedlich ausgestaltet je nach System)\n<strong>Motivation<\/strong>: Die <strong>Mensch-Maschine-Interaktion und die Arbeitsumgebung<\/strong> müssen so gestaltet sein, dass der Mensch die Aufgabe langfristig ausüben kann\"<\/p>\n<\/blockquote>\n<p><strong>Drei Begriffe: Verstehen – Kontrolle – Motivation.<\/strong><\/p>\n<h3 id=\"d-168-ki-und-personenbezogene-daten-folie-92-original\">16.8 KI und personenbezogene Daten (Folie 92, Original)<\/h3>\n<blockquote>\n<p>„Bei der Nutzung eines KI-Systems fallen unter anderem folgende <strong>personenbezogene Daten<\/strong> an:\n• <strong>Benutzernamen und Passwort<\/strong> beim Login des Nutzers\n• <strong>Chatverlauf / Historie<\/strong>\n• <strong>Daten der Nutzung<\/strong> des KI-Systems (Datum, Uhrzeit, Standort, verwendetes Gerät, Lizenzangaben)\n• <strong>Prompts inkl. ergänzender Input<\/strong>\n• <strong>Output<\/strong>\n➢ <strong>Umstritten, ob auch das KI-Modell selbst personenbezogene Daten enthält<\/strong>\"<\/p>\n<p>⚠️ <strong>Merke: Prompts und Output sind personenbezogene Daten.<\/strong> Das ist der praktisch wichtigste Satz des KI-Blocks. Wenn du einen Namen in einen Chatbot tippst, verarbeitest du pbD.\nUnd: Ob das <strong>Modell selbst<\/strong> pbD enthält, ist laut Folie <strong>umstritten<\/strong> — eine Aussage „Das KI-Modell enthält unstreitig keine pbD\" wäre also <strong>falsch<\/strong>.<\/p>\n<\/blockquote>\n<h3 id=\"d-169-die-checkliste-fur-llm-chatbots-folie-110-original\">16.9 Die Checkliste für LLM-Chatbots ★ (Folie 110, Original)<\/h3>\n<blockquote>\n<p>„<strong>Checkliste zum Einsatz LLM-basierter Chatbots<\/strong>\n1. <strong>Bereitstellung eines Funktions-Accounts<\/strong>\n2. <strong>Keine Eingabe personenbezogener Daten<\/strong>\n3. <strong>Keine Ausgabe personenbezogener Daten<\/strong>\n4. <strong>Vorsicht bei personenbeziehbaren Daten<\/strong>\n5. <strong>Opt-out des KI-Trainings<\/strong>\n6. <strong>Ergebnisse auf Richtigkeit prüfen<\/strong>\n7. <strong>Ergebnisse auf Diskriminierung überprüfen<\/strong>\n8. <strong>Keine automatisierte Letztentscheidung<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Diese acht Punkte sind ein sehr wahrscheinlicher T/F-Steinbruch.<\/strong> Merk dir besonders Punkt 8: <strong>keine automatisierte Letztentscheidung<\/strong> — das ist der Bezug zu <strong>Art. 22 DSGVO<\/strong> (Recht, keiner ausschließlich automatisierten Entscheidung unterworfen zu werden).<\/p>\n<h3 id=\"d-1610-wie-llms-funktionieren-die-argumentation-des-dozenten\">16.10 Wie LLMs funktionieren — die Argumentation des Dozenten<\/h3>\n<p>Der Dozent baut eine ganze Argumentationskette auf, dass LLMs <strong>keine Semantik<\/strong> haben. Für T/F-Fragen relevant:<\/p>\n<p><strong>Folie 99 (Original) — Tokenisierung:<\/strong><\/p>\n<blockquote>\n<p>„<strong>Tokenisierung<\/strong> bezeichnet das <strong>Zerteilen von Text in die kleineren Einheiten Worte bzw. Wortbestandteile<\/strong>, die als <strong>Tokens<\/strong> bezeichnet werden … Anschließend erfolgt die <strong>Umwandlung in Zahlen<\/strong>. Diese Umwandlung ist grundlegend für die generative KI.\"<\/p>\n<\/blockquote>\n<p><strong>Folie 100 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Wie arbeiten LLMs?<\/strong> ➢ Können Tausende von Wörtern einlesen (Prompt) ➢ <strong>Lernen, das nächste Wort vorherzusagen<\/strong> ➢ <strong>Jedoch ohne Semantik!<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Folie 105 (Original) — John Searle:<\/strong><\/p>\n<blockquote>\n<p>„„<strong>Syntax reicht nicht für Semantik aus.<\/strong>\" · „Computerprogramme sind vollständig durch ihre <strong>formale (oder syntaktische) Struktur<\/strong> definiert.\" · „Ein Geist hat geistige Inhalte, und zwar <strong>semantische<\/strong> Inhalte.\" · „<strong>Schlussfolgerung 1: Kein Computerprogramm kann aus eigener Kraft einem System einen Geist geben.<\/strong>\"\"<\/p>\n<\/blockquote>\n<p><strong>Folie 108 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Was lernen wir daraus:<\/strong>\n➢ Wir Menschen gehen wie folgt vor: <strong>nachdenken, analysieren, bewerten<\/strong>.\n➢ Dies können Maschinen <strong>heute (noch?) nicht<\/strong>\n➢ Maschinen können auch (noch?) <strong>keine moralischen Fragen bewerten<\/strong>.\n➢ <strong>Aber sie können schon Texte assoziieren, die aussehen wie das Produkt von Nachdenken, Analyse oder moralischer Bewertung.<\/strong>\n➢ Mit heutigen Methoden werden Maschinen dazu nicht in der Lage sein. <strong>Ihnen fehlt die Referenz auf die Realität.<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Folie 109 (Original):<\/strong> „<strong>ChatGPT: Plappernder Papagei mit ~Nachdenken light<\/strong>\"<\/p>\n<p><strong>Halluzinationen (Folien 101–102):<\/strong> Der Dozent zeigt einen echten Screenshot, in dem ChatGPT ausführlich über einen <strong>„Lila Leierapfel\"<\/strong> referiert — eine Sorte, die er frei erfunden hat. Sein Kommentar: „<strong>Ist frei erfunden!!<\/strong>\". Das ist sein Beleg für Checklistenpunkt 6 („Ergebnisse auf Richtigkeit prüfen\").<\/p>\n<p><strong>Und die Gegenseite (Folie 95):<\/strong> „<strong>Überraschung!!!<\/strong> ChatGPT kann schreiben · kann Schach spielen · kann übersetzen · … <strong>aber wurde darauf gar nicht trainiert!<\/strong>\"<\/p>\n<h3 id=\"d-1611-weitere-fakten-aus-dem-ki-block\">16.11 Weitere Fakten aus dem KI-Block<\/h3>\n<ul>\n<li><strong>Folie 96:<\/strong> „ChatGPT-4 schafft die (amerikanische) Anwaltsprüfung\" (Quelle: Katz/Bommarito u.a., 2024).<\/li>\n<li><strong>Folie 111:<\/strong> „<strong>Landgericht München: OpenAI verstößt gegen das Urheberrecht!<\/strong>\" — Klage der <strong>GEMA<\/strong> wegen neun Liedtexten; das Gericht untersagte die Nutzung von Songtexten. <em>(Die Folie schreibt in der Überschrift „Landesgericht\", im Text korrekt „Landgericht München\".)<\/em><\/li>\n<li><strong>Folie 91:<\/strong> Staatsanwaltschaft in Florida ermittelt gegen OpenAI im Zusammenhang mit einer Schusswaffentat.<\/li>\n<li><strong>Folien 112–113:<\/strong> Bitkom-Studie zu Rechenzentren — Deutschland: <strong>530 MW (2025) → 2.020 MW (2030), also Vervierfachung<\/strong>; Europa 16.500 → 28.000 MW (+70 %); USA 48.000 (2024) → 95.000 MW.<\/li>\n<li><strong>Folie 76:<\/strong> KI könnte das deutsche BIP jährlich um <strong>0,8 Prozentpunkte<\/strong> steigern, <strong>4,5 Billionen Euro<\/strong> zusätzliche Wertschöpfung in 15 Jahren (IAB-Studie).<\/li>\n<li><strong>Folie 74:<\/strong> Abschließendes Statement des Dozenten: „<strong>Vom Datenschutzrecht zum Datennutzungsrecht.<\/strong>\"<\/li>\n<\/ul>\n<h3 id=\"d-typische-fallen-zu-kapitel-16\">Typische Fallen zu Kapitel 16<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aussage<\/th>\n<th>✓/✗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Die KI-VO trat am 01.08.2024 in Kraft.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Regelbasierte Software ist ein KI-System im Sinne der KI-VO.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Die KI-VO verfolgt einen risikobasierten Ansatz.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Alle KI-Systeme unterliegen denselben Pflichten.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Für risikoarme KI-Systeme gelten nur freiwillige Anforderungen.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Deepfakes und Chatbots unterliegen Transparenzpflichten.<\/td>\n<td><strong>✓<\/strong> — Art. 50<\/td>\n<\/tr>\n<tr>\n<td>Prompts, die man in einen Chatbot eingibt, können pbD sein.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Nach der Checkliste des Dozenten dürfen KI-Ergebnisse als Letztentscheidung dienen.<\/td>\n<td><strong>✗<\/strong> — „keine automatisierte Letztentscheidung\"<\/td>\n<\/tr>\n<tr>\n<td>Art. 4 KI-VO verpflichtet Anbieter und Betreiber zur Sicherstellung von KI-Kompetenz.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>LLMs verstehen die Bedeutung der Wörter, die sie erzeugen.<\/td>\n<td><strong>✗<\/strong> — laut Folie „ohne Semantik\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Ein Drittel der Folien geht um KI. Rechne also mit mehreren Fragen dazu. Zwei Blöcke: die KI-Verordnung (seit 2024 in Kraft, mit einer Risiko-Pyramide von „verboten\" bis „egal\") und KI im Datenschutz (was du in einen Chatbot tippst, sind Daten). Als Informatiker hast du hier einen Vorteil: Du weißt, dass eine Wenn-Dann-Regel keine KI ist. Genau danach wird gefragt. Der Dozent hat ~40 der 114 Folien auf KI verwendet — also gut ein Drittel. Rechne mit mehreren T/F-Fragen. 16.1 Die Legaldefinition — Art. 3 Nr. 1 KI-VO (Folie 82, Original) „ Das ist KI: ➢ „ein maschinengestütztes System , das für einen […] autonomen Betrieb ausgelegt ist und das nach seiner Betriebsaufnahme anpassungsfähig sein kann und das aus den erhaltenen Eingaben für explizite oder implizite Ziele ableitet […] die physische oder virtuelle Umgebungen beeinflussen können\" ( Legaldefinition in Art. 3 Nr. 1 KI-VO ) Das ist KI nicht: ➢ Regelbasierte Software ➢ Expertensysteme, die nur Muster abgleichen , ohne für autonomen Betrieb und anpassungsfähig zu sein ➢ Herkömmliche Programmierung • wenn-dann-Regeln • Umfeld ist einmalig untersucht und wird fest beschrieben: Veränderungen im Umfeld führen zu Veränderungen im Code\" Die Merkmale: maschinengestützt · autonom · anpassungsfähig · leitet aus Eingaben Ergebnisse ab · beeinflusst Umgebungen. ⚠️ Sehr wahrscheinliche T/F-Frage: „Regelbasierte Software / ein klassisches Expertensystem / eine if-then-Automatisierung ist ein KI-System im Sinne der KI-VO\" → falsch . Als Informatiker hast du hier einen Vorteil: Der Unterschied ist gelernte Ableitung vs. fest programmierte Regel . 16.2 Das Datum (Folie 83, Original) „ Die KI-Verordnung trat zum 01.08.2024 in Kraft \" 01.08.2024 — merken. Nicht mit dem DSGVO-Datum (25.05.2018) verwechseln. 16.3 Die Akteure (Folie 84) Akteur Definition laut Folie Anbieter (eigene oder fremde) Entwicklung eines KI-Systems, mit dem Ziel des Inverkehrbringens oder der Inbetriebnahme , unter eigenem Namen / eigener Marke , entgeltlich oder unentgeltlich Nutzer / Betreiber Verwendung eines KI-Systems in eigener Verantwortung . Ausnahme: persönliche, nicht berufliche Tätigkeiten Aber auch Produkthersteller, Händler, Einführer u. a. ⚠️ Beachte die Parallele zur DSGVO: Auch die KI-VO hat eine Ausnahme für rein private Nutzung — genau wie die Haushaltsausnahme in Art. 2 DSGVO. 16.4 Der risikobasierte Ansatz ★★★ (Folie 85, Original) „ Risikobasierter Regulierungsansatz der KI-VO verbotene KI-Systeme ➢ Verbot des Inverkehrbringens, Inbetriebnahme oder Anwendung Hochrisiko KI-Systeme ➢ Besondere Anforderungen und Pflichten, Art. 6 – 49 , je nach Gefährdungs- und Schadenspotential bestimmte KI-Systeme ➢ Transparenzpflichten, Art. 50 , KI-Kenntnisse ( Deepfakes, Chatbots ) risikoarme KI-Systeme ➢ Freiw
