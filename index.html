t mehr. Er müsste dir neu 30 Euro anbieten, und dann müsstest du wieder Ja sagen. Fall 05 b) zeigt das dreimal hintereinander. Original: „Angebot von Denny hätte nur sofort angenommen werden können, § 147 I ; verspätete Annahme durch Anneliese (zusätzlich unter Erweiterungen) = neues Angebot, § 150 I ; Denny hat angenommen; Veränderung der Bezahlungsart ist neues Angebot zur Vertragsänderung , wurde angenommen.\" Erst zu spät + verändert (putzen!) → neues Angebot. Dann PayPal statt bar → wieder neues Angebot. Bei so einem Fall gehst du chronologisch durch und prüfst jede Erklärung einzeln. 9.5 Dissens — §§ 154, 155 Offener Dissens § 154 Versteckter Dissens § 155 Was Beide wissen , dass sie sich noch nicht über alles einig sind Beide glauben , einig zu sein, sind es aber nicht Folge Im Zweifel kein Vertrag Vertrag gilt „im Übrigen\" , wenn er auch ohne den strittigen Punkt geschlossen worden wäre Werkzeug Auslegung §§ 133, 157 Auslegung §§ 133, 157 Fall 05 e) — der AGB-/Gerichtsstands-Fall. Jimmy bestellt mit AGB „Gerichtsstand München\", Nancy liefert mit Lieferschein „Gerichtsstand Frankfurt\". Original-Lösung: „Angebot durch Bestellformular einschl. AGB. Annahme durch Lieferung m. abweichenden AGB ⇒ versteckter Dissens (bzgl. Gerichtsstands) § 155 . Alles, worüber sie sich geeinigt haben, gilt, wenn die Auslegung §§ 133, 157 ergibt, dass der Vertrag auch ohne den Punkt des Dissenses geschlossen werden sollte. Auslegung ergibt, dass die Parteien den Vertrag nicht an den unterschiedlichen Gerichtsständen scheitern lassen wollten. Dem entsprechend gilt der Vertrag „im übrigen\", § 155. Nach der Rspr. gilt in einem solchen Fall das Gesetz! ⇒ Klage muss am Sitz des Beklagten eingereicht werden.\" Merke die Pointe: Wenn sich zwei AGB widersprechen, fällt beides weg und das Gesetz greift ein. Das nennt man „Theorie des letzten Wortes\" bzw. Restgültigkeitstheorie. 9.6 AGB — §§ 305 ff. Folie 17 (Original): „– Enthält ggfs. auch „Allgemeine Geschäftsbedingungen\", §§ 305 ff – Für eine Vielzahl von Verträgen vorformuliert, unabhängig von der Gestaltung und Vertragsform, § 305 I – Einbezogen durch Hinweis und Möglichkeit der Kenntnisnahme, § 305 II – Inhaltlich zulässig (keine nach Treu und Glauben unangemessene Benachteiligung), §§ 307 – 309 \" Der Dreischritt für die Klausur: ① § 305 I Sind es überhaupt AGB? → für eine VIELZAHL von Verträgen VORFORMULIERT, einseitig gestellt. (Individuell ausgehandelt = keine AGB) ② § 305 II Wirksam EINBEZOGEN? → ausdrücklicher HINWEIS + Möglichkeit der KENNTNISNAHME + Einverständnis ③ §§ 307-309 INHALTSKONTROLLE → § 309 Klauselverbote OHNE Wertungsmöglichkeit (schwarze Liste) § 308 Klauselverbote MIT Wertungsmöglichkeit (graue Liste) § 307 Generalklausel: unangemessene Benachteiligung nach Treu und Glauben Alltagsbeispiel für § 305 II: Auf der Rückseite eines Kassenzettels stehen AGB in 4pt-Schrift → nicht wirksam einbezogen, keine zumutbare Kenntnisnahme. Im Onlineshop musst du eine Checkbox anklicken und der Text ist verlinkt → wirksam einbezogen. Folie 18 („Jüngste Beispiele aus der BGH-Rspr. für unwirksame AGB-Klauseln im Bankenrecht, Mietrecht und Arbeitsrecht\") ist reines Zusatzmaterial . Da hattest du mit deiner Einschätzung recht — kenn den Dreischritt oben, mehr braucht es nicht. 9.7 § 241a — Unbestellte Leistungen (fehlte in deiner Liste!) Der Dozent bringt das in zwei Übungsfällen. Das ist kein Zufall. § 241a: Bei einer unbestellten Lieferung durch einen Unternehmer (§ 14) an einen Verbraucher (§ 13) wird kein Anspruch des Unternehmers begründet — weder auf Zahlung noch auf Rückgabe. Alltagsbeispiel: Dir wird unaufgefordert ein Buch mit Rechnung zugeschickt. Du musst weder zahlen noch zurückschicken noch dich melden. Du darfst es sogar behalten und benutzen. Fall 05 c) — die Obstkiste. Denny schickt Anneliese ungefragt eine Kiste Obst mit Rechnung über 15 €. Sie isst die Erdbeeren und bringt den Rest zurück. Original-Lösung: „Anspruch des Denny auf Zahlung von 15 EUR aus § 433 BGB. Voraussetzung: geschlossener Kaufvertrag, § 145: Angebot und Annahme • Angebot durch Übersendung (Gegenstand, Vertragspartner, Preis +) • Annahme durch A: durch bloße Entgegennahme (-), weil keine entsprechende WE. Teilannahme (verändertes Angebot nach § 150 bzgl. Erdbeeren? Ja!, aber Bindung vernichtet durch Verbraucherschutz § 241a ? Unbestellte Lieferung (+), durch Unternehmer § 14 (+), an Verbraucher § 13 (+) Dem entsprechend nach § 241a kein Anspruch gegen den Verbraucher! \" Merke den Doppelschlag: Selbst wenn du durch Verbrauchen konkludent annimmst — § 241a killt den Anspruch trotzdem. Auch die 5 € für die Erdbeeren bekommt Denny nicht. Beispiel aus deinen Übungsfällen — Zusammenfassung Fall 05 Fall Kernproblem Norm a) Kein Preis genannt § 145, essentialia negotii (-) b) Verspätet + verändert angenommen § 147 I, § 150 I c) Unbestellte Obstkiste §§ 13, 14, 150, 241a d) PS5 wird vor Versand zerstört §§ 243 Gattungsschuld, 275, 447 e) Widersprechende AGB § 155 versteckter Dissens","words":1668,"mins":9},{"id":"r-10-stellvertretung--bote","subject":"recht","num":"10","title":"10. Stellvertretung & Bote","short":"Stellvertretung & Bote","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nJemand handelt für dich — dein Kollege bestellt in deinem Namen, deine Freundin kauft für dich ein.<\/p>\n<p>Die Frage ist immer: <strong>Wirkt das für dich? Oder bleibt der andere darauf sitzen?<\/strong><\/p>\n<p><strong>Das ist das Thema deiner Probeklausur.<\/strong> Nimm dir für dieses Kapitel mehr Zeit als für die anderen.<\/p>\n<\/blockquote>\n<p><strong>Achtung: Genau darum geht es in der Probeklausur.<\/strong> Und in der Übungsfallsammlung 06 mit fünf Fällen. Wenn du ein Thema besonders gut können willst, dann dieses.<\/p>\n<h3 id=\"r-101-der-grundgedanke-164\">10.1 Der Grundgedanke — § 164<\/h3>\n<p><strong>Folie 20 (Original):<\/strong><\/p>\n<blockquote>\n<p>„● Ein Stellvertreter erzeugt einen Vertragsschluss <strong>unmittelbar zwischen dem Vertretenen und dem Geschäftspartner, § 164<\/strong>\n– Zulässigkeit der Vertretung: nahezu bei allen Rechtsgeschäften gegeben, <strong>Ausnahmen Ehe (§ 1311) und Testamentserrichtung (§ 2064)<\/strong>\n– <strong>Eigene Willenserklärung aus eigener Entschließungsfreiheit<\/strong>; der Vertreter muss sich seinen Willen bilden, daher kommt es auf ihn an (z.B. Wissenszurechnung etwa beim Autokauf); <strong>anders beim Boten, der eine fremde Erklärung nur weitergibt<\/strong>\n– <strong>Im fremden Namen, „Offenkundigkeitsprinzip\"<\/strong>: unter Vorlage einer Urkunde …, ausdrücklich oder sich aus den Umständen ergebend, <strong>§ 164 I, 2<\/strong> (Geschäftsräume, Bestellung unter Firmenanschrift, …) oder für den Geschäftspartner unerheblich bei <strong>„Geschäften, für den es angeht\" (Bargeschäfte des täglichen Lebens)<\/strong>; bei mangelnder Offenkundigkeit ⇒ <strong>der Vertreter wird Vertragspartner, § 164 II<\/strong>\n– <strong>Im Rahmen der Vertretungsmacht<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"r-die-drei-voraussetzungen-des-164-auswendig\">Die drei Voraussetzungen des § 164 (auswendig!)<\/h3>\n<pre><code>① EIGENE Willenserklärung      (Abgrenzung zum Boten!)\n② IM FREMDEN NAMEN             (Offenkundigkeitsprinzip, § 164 I 2)\n③ MIT VERTRETUNGSMACHT\n<\/code><\/pre>\n<p>Merkhilfe: <strong>„Eigen – fremd – Macht.\"<\/strong><\/p>\n<p><strong>Rechtsfolge:<\/strong> Der Vertrag kommt <strong>unmittelbar<\/strong> zwischen Vertretenem und Geschäftspartner zustande. Der Vertreter ist raus — er wird nicht Vertragspartei, haftet nicht, bekommt nichts.<\/p>\n<p><strong>Der ganze Unterschied steckt in einer Frage: Darf die Person mitdenken?<\/strong><\/p>\n<p><strong>Bote<\/strong> — du gibst deinem Mitbewohner einen Zettel: <em>„2 Vollkornbrötchen\"<\/em>. Er gibt den Zettel beim Bäcker ab. Er entscheidet <strong>nichts<\/strong>. Er ist nur der Transportweg, wie ein Briefumschlag mit Beinen.<\/p>\n<p><strong>Stellvertreter<\/strong> — du sagst deinem Mitbewohner: <em>„Bring irgendwas Leckeres zum Frühstück mit, bis 10 Euro.\"<\/em> Jetzt sucht <strong>er<\/strong> aus. Er denkt mit, er entscheidet. Der Vertrag mit dem Bäcker gilt trotzdem für <strong>dich<\/strong>.<\/p>\n<p>Weil der Vertreter mitdenkt, kommt es auch auf <strong>seinen<\/strong> Kopf an: Wenn er etwas weiß oder sich irrt, wird das dir zugerechnet. Beim Boten ist das anders — da zählt nur, was du auf den Zettel geschrieben hast.<\/p>\n<h3 id=\"r-102-vertreter-vs-bote-die-wichtigste-abgrenzung\">10.2 ★ Vertreter vs. Bote — die wichtigste Abgrenzung<\/h3>\n<p>Das ist eine sehr wahrscheinliche Kurzfrage („Erklären Sie den Unterschied\").<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Stellvertreter<\/strong> § 164<\/th>\n<th><strong>Bote<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Wessen WE?<\/td>\n<td><strong>eigene<\/strong><\/td>\n<td><strong>fremde<\/strong> — er überbringt nur<\/td>\n<\/tr>\n<tr>\n<td>Entschließungsfreiheit<\/td>\n<td>ja — er entscheidet mit<\/td>\n<td><strong>nein<\/strong> — die Erklärung steht schon fest<\/td>\n<\/tr>\n<tr>\n<td>Geschäftsfähigkeit nötig?<\/td>\n<td><strong>beschränkte<\/strong> genügt, § 165<\/td>\n<td><strong>gar keine<\/strong> — auch ein 6-Jähriger kann Bote sein<\/td>\n<\/tr>\n<tr>\n<td>Auf wessen Willensmängel kommt es an?<\/td>\n<td>auf den <strong>Vertreter<\/strong> (§ 166 I)<\/td>\n<td>auf den <strong>Geschäftsherrn<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Wenn er sich vertut?<\/td>\n<td><strong>§ 119<\/strong> (eigener Irrtum)<\/td>\n<td><strong>§ 120<\/strong> (falsche Übermittlung)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Der Test:<\/strong> Frag dich — <em>durfte die Person selbst entscheiden?<\/em><\/p>\n<ul>\n<li>„Kauf mir bitte <strong>eine FAZ<\/strong>.\" → Alles steht fest. <strong>Bote.<\/strong><\/li>\n<li>„Kauf mir bitte <strong>irgendein schönes Modell<\/strong> bis 5.000 €.\" → Er darf auswählen. <strong>Vertreter.<\/strong><\/li>\n<\/ul>\n<p><strong>Alltagsbeispiel:<\/strong> Du schickst deinen Mitbewohner mit einem Zettel los: „2× Vollkornbrot\". Er ist Bote. Sagst du „bring irgendwas Leckeres mit, bis 10 Euro\", ist er Vertreter.<\/p>\n<p><strong>§ 120 — der Bote vertut sich.<\/strong> Wenn der Bote die WE falsch übermittelt, ist die Erklärung <strong>anfechtbar wie bei einem Erklärungsirrtum<\/strong> — also nach § 120, nicht nach § 119.<\/p>\n<p><strong>Fall 06 a) genau dazu.<\/strong> Denny soll für Jimmy eine FAZ holen, sagt aber „Bitte eine Rundschau\". Original:<\/p>\n<blockquote>\n<p><em>„Vertragsschluss zwischen Jimmy und Anneliese wie oben (<\/em><em>Denny hat nach wie vor keine eigene WE abgegeben, sondern war in dem Glauben, eine fremde WE weitergegeben zu haben. Daher ist er weiterhin Bote<\/em><em>, andere Ansicht bei guter Argumentation vertretbar). <\/em><em>Das Geschäft ist aber nach § 120 anfechtbar.<\/em><em>\"<\/em><\/p>\n<\/blockquote>\n<h3 id=\"r-103-das-offenkundigkeitsprinzip-164-i-s-2\">10.3 Das Offenkundigkeitsprinzip — § 164 I S. 2<\/h3>\n<blockquote>\n<p>Der Vertreter muss <strong>erkennbar machen, dass er für einen anderen handelt.<\/strong><\/p>\n<\/blockquote>\n<p>Das geht:\n- <strong>ausdrücklich<\/strong> („Ich handle im Namen der Firma Müller GmbH\")\n- <strong>aus den Umständen<\/strong> (§ 164 I S. 2): Du stehst hinter der Kasse im Laden → offensichtlich handelst du für den Ladeninhaber. Bestellung auf Firmenbriefpapier.<\/p>\n<p><strong>Ausnahme: „Geschäft für den, den es angeht\"<\/strong> — bei <strong>Bargeschäften des täglichen Lebens<\/strong> ist es dem Verkäufer egal, wer der Vertragspartner ist, weil sofort bar bezahlt wird. Dann muss die Vertretung nicht offengelegt werden.\nBeispiel: Du kaufst am Kiosk eine Zeitung für deinen Chef. Der Kioskbesitzer will nur sein Geld — es interessiert ihn nicht, in wessen Namen du kaufst.<\/p>\n<p><strong>Rechtsfolge bei fehlender Offenkundigkeit — § 164 II:<\/strong><\/p>\n<blockquote>\n<p><strong>Der Vertreter wird selbst Vertragspartner.<\/strong> Und: Er kann sich <strong>nicht<\/strong> darauf berufen, dass er eigentlich für einen anderen handeln wollte (§ 164 II: der Mangel des Willens, im eigenen Namen zu handeln, kommt nicht in Betracht).<\/p>\n<\/blockquote>\n<p>Merke: Wer nicht sagt, dass er für andere handelt, hat sich selbst verpflichtet. <strong>Keine Anfechtung möglich.<\/strong><\/p>\n<h3 id=\"r-104-woher-kommt-die-vertretungsmacht\">10.4 Woher kommt die Vertretungsmacht?<\/h3>\n<p><strong>Folien 20/21 (Original):<\/strong><\/p>\n<blockquote>\n<p>„⇒<strong>Entstehen und Grundlage der Vertretungsmacht:<\/strong>\n– <strong>aus Gesetz<\/strong> (Eltern, Vormund, Pfleger, Betreuer, Organ einer juristischen Person)\n– <strong>durch rechtsgeschäftliche Einzelübertragung („Vollmacht\", Definition in § 166 II)<\/strong>: ggü dem Bevollmächtigten, <strong>§ 167 I, 1. Fall (Innenvollmacht)<\/strong> oder dem Vertragspartner, <strong>§ 167 I, 2. Fall (Außenvollmacht)<\/strong>\n– <strong>aus einem zugrunde liegenden Rechtsgeschäft<\/strong> (z.B. Auftrag, Arbeits-, Dienstbesorgungsvertrag, s. <strong>§ 168<\/strong>)\n– <strong>aus zuvor entstandenem Rechtsschein des Vollmachtgebers: Duldungs-, oder Anscheinsvollmacht<\/strong> (aus dem Rechtsgedanken der <strong>§§ 170 ff<\/strong>, sofern der Vertreter <strong>wiederholt<\/strong> für den Vertretenen aufgetreten ist, der Dritte <strong>gutgläubig<\/strong> auf die Bevollmächtigung vertraut und der Vertretene das Auftreten des Vertreters <strong>kannte (dann Duldungsvollmacht) oder hätte kennen müssen (dann Anscheinsvollmacht)<\/strong>\"<\/p>\n<\/blockquote>\n<table>\n<thead>\n<tr>\n<th>Quelle<\/th>\n<th>§<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Gesetz<\/strong><\/td>\n<td>§ 1629 (Eltern), § 26 BGB / § 35 GmbHG / § 78 AktG (Organe)<\/td>\n<td>Die Eltern vertreten das Kind; der GF vertritt die GmbH<\/td>\n<\/tr>\n<tr>\n<td><strong>Innenvollmacht<\/strong><\/td>\n<td>§ 167 I, 1. Fall<\/td>\n<td>„Du darfst für mich einkaufen\" — gesagt <strong>zum Vertreter<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Außenvollmacht<\/strong><\/td>\n<td>§ 167 I, 2. Fall<\/td>\n<td>„Herr Meier darf für mich unterschreiben\" — gesagt <strong>zum Geschäftspartner<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Aus dem Grundverhältnis<\/strong><\/td>\n<td>§ 168<\/td>\n<td>Arbeitsvertrag, Auftrag — die Vollmacht steckt implizit drin<\/td>\n<\/tr>\n<tr>\n<td><strong>Duldungsvollmacht<\/strong><\/td>\n<td>§§ 170 ff. analog<\/td>\n<td>Der Vertretene <strong>weiß<\/strong> davon und lässt es laufen<\/td>\n<\/tr>\n<tr>\n<td><strong>Anscheinsvollmacht<\/strong><\/td>\n<td>§§ 170 ff. analog<\/td>\n<td>Der Vertretene <strong>hätte es wissen müssen<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Prokura<\/strong><\/td>\n<td>§ 49 HGB<\/td>\n<td>umfassende handelsrechtliche Vollmacht<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Duldung vs. Anschein — Merkhilfe:<\/strong><\/p>\n<blockquote>\n<p><strong>D<\/strong>uldung = er <strong>D<\/strong>uldet es, weil er es <strong>weiß<\/strong>.\n<strong>A<\/strong>nschein = er <strong>A<\/strong>hnt es nicht, hätte es aber wissen müssen (Fahrlässigkeit).<\/p>\n<\/blockquote>\n<p>Beide brauchen: (1) <strong>wiederholtes<\/strong> Auftreten, (2) <strong>Gutgläubigkeit<\/strong> des Dritten.<\/p>\n<p><strong>Erlöschen der Vollmacht (Folie 21):<\/strong><\/p>\n<blockquote>\n<p>„⇒<strong>Erlöschen der Vertretungsmacht<\/strong>\n– durch <strong>Widerruf<\/strong> gegenüber dem Bevollmächtigten oder dem Geschäftspartner, <strong>§ 168, S. 3<\/strong>\n– durch <strong>Erlöschen des zugrundeliegenden Rechtsgeschäfts, § 168, S. 1<\/strong>\n– ggfs. muss <strong>Rechtsschein zerstört<\/strong> werden (Widerruf ggü Vertragspartner bei Innenvollmacht, §§ 170, 171; Beseitigen einer Vollmachtsurkunde, §§ 172 II, 175 f)\"<\/p>\n<p>⚠️ <strong>Sehr wichtig für die Probeklausur:<\/strong> Ein Widerruf der Vollmacht wirkt <strong>nur für die Zukunft (ex nunc)<\/strong>. Man kann eine Vollmacht <strong>nicht rückwirkend entziehen<\/strong>. Wenn jemand im Fall sagt „ich entziehe die Vertretungsbefugnis rückwirkend\" — das geht nicht. Der Vertrag, der vorher geschlossen wurde, bleibt bestehen.<\/p>\n<\/blockquote>\n<p><strong>Umfang der Vollmacht (Folie 21):<\/strong> Prokura § 49 HGB (allumfassend) · Einzel- oder Gesamtvollmacht · Haupt- und <strong>Untervollmacht<\/strong> · inhaltliche Beschränkungen.<\/p>\n<h3 id=\"r-105-was-passiert-wenn-die-voraussetzungen-fehlen\">10.5 ★ Was passiert, wenn die Voraussetzungen fehlen?<\/h3>\n<p><strong>Das ist die klassische Prüfungsfrage.<\/strong> Folie 22 (Original):<\/p>\n<blockquote>\n<p>„● <strong>Scheitert die Stellvertretung, kommt ggfs. ein Vertragsschluss mit dem „Vertreter\" oder ein Schadensersatzanspruch in Betracht, §§ 177, 179<\/strong>\n– <strong>Fehlergrund Offenkundigkeitsprinzip ⇒ Vertragsschluss mit dem „stillen\" Vertreter, § 164 II<\/strong>\n– <strong>Fehlergrund fehlende oder überschrittene Vertretungsmacht ⇒ schwebende Unwirksamkeit<\/strong>: der Vertretene kann das Geschäft innerhalb von <strong>zwei Wochen genehmigen<\/strong> und wird dann zum Vertragspartner, <strong>§ 177 I, II<\/strong>\n– <strong>Schadensersatz bei gescheiterter Stellvertretung, § 179 I, II<\/strong>\n⇒<strong>Anspruchsgrundlagen gegen den Vertreter ohne Vertretungsmacht:<\/strong>\n<strong>§ 179 I bei bewusster Überschreitung<\/strong> der Vertretungsmacht: Anspruch auf <strong>Vertragserfüllung oder den sog. Erfüllungsschaden<\/strong> = Herstellung der Vermögenssituation, die bei erfolgreicher Vertretung bestanden hätte (einschließlich entgangenem Gewinn, §§ 249 ff, 252 <strong>„positives Interesse\"<\/strong>);\n<strong>§ 179 II, bei unbewusster Überschreitung<\/strong> seiner Vertretungsmacht („im guten Glauben\"): Anspruch nur auf den sog. <strong>Vertrauensschaden<\/strong> = Herstellung der Vermögenssituation, die bestanden hätte, wenn das Geschäft nicht stattgefunden hätte …, <strong>„negatives Interesse\"<\/strong>, etwa Transport- und Verwaltungskosten, ggfs. auch unterlassenes anderweitiges Geschäft, <strong>maximal jedoch der entgangene Gewinn<\/strong> aus dem nicht zustande gekommenen Geschäft.\"<\/p>\n<\/blockquote>\n<h3 id=\"r-die-fehler-matrix-in-die-klausur-ubernehmen\">Die Fehler-Matrix (in die Klausur übernehmen)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Was fehlt?<\/th>\n<th>Rechtsfolge<\/th>\n<th>§<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Eigene WE<\/strong> (war nur Bote)<\/td>\n<td>kein § 164, sondern Botenrecht → Anfechtung § 120<\/td>\n<td>§ 120<\/td>\n<\/tr>\n<tr>\n<td><strong>Offenkundigkeit<\/strong><\/td>\n<td><strong>Vertreter wird selbst Vertragspartner<\/strong>, keine Berufung auf inneren Willen<\/td>\n<td>§ 164 II<\/td>\n<\/tr>\n<tr>\n<td><strong>Vertretungsmacht<\/strong> (fehlt oder überschritten)<\/td>\n<td><strong>schwebend unwirksam<\/strong> → Genehmigung möglich (2 Wochen nach Aufforderung)<\/td>\n<td>§ 177 I, II<\/td>\n<\/tr>\n<tr>\n<td>… und der Vertretene <strong>verweigert<\/strong><\/td>\n<td><strong>Schadensersatz gegen den falsus procurator<\/strong><\/td>\n<td>§ 179<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-179-positives-vs-negatives-interesse\">§ 179 — positives vs. negatives Interesse<\/h3>\n<p>Das ist der Kern der Probeklausur. Merk dir die Tabelle:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>§ 179 I<\/strong><\/th>\n<th><strong>§ 179 II<\/strong><\/th>\n<th><strong>§ 179 III<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Wann<\/td>\n<td>Vertreter <strong>kannte<\/strong> den Mangel (bewusste Überschreitung)<\/td>\n<td>Vertreter war <strong>gutgläubig<\/strong><\/td>\n<td>Geschäftspartner <strong>kannte oder musste kennen<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Anspruch<\/td>\n<td><strong>Erfüllung ODER Erfüllungsschaden<\/strong><\/td>\n<td>nur <strong>Vertrauensschaden<\/strong><\/td>\n<td><strong>Ausschluss<\/strong> — gar kein Anspruch<\/td>\n<\/tr>\n<tr>\n<td>Interesse<\/td>\n<td><strong>positives<\/strong> Interesse<\/td>\n<td><strong>negatives<\/strong> Interesse<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td>Bedeutung<\/td>\n<td>Stellung wie bei <strong>wirksamem<\/strong> Vertrag<\/td>\n<td>Stellung wie <strong>ohne jeden Vertrag<\/strong><\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td>Deckel<\/td>\n<td>—<\/td>\n<td><strong>max. das positive Interesse<\/strong><\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-positives-vs-negatives-interesse-mit-bild\">Positives vs. negatives Interesse — mit Bild<\/h3>\n<p>Das hat der Dozent im Fall 09 handschriftlich aufs Flipchart gemalt:<\/p>\n<blockquote>\n<p>„<strong>§ 122<\/strong> — als ob die Vertragspartner sich <strong>nie getroffen<\/strong> hätten. <strong>„Vertrauensinteresse\" = negatives Interesse.<\/strong> Vermögensvergleich: hergestellt wird der Zustand <strong>vor Vertragsschluss<\/strong>.\"<\/p>\n<\/blockquote>\n<pre><code>NEGATIVES Interesse  →  Stell mich so, als hätte ich dich NIE GETROFFEN.\n(Vertrauensschaden)     Ersatz: Fahrtkosten, Gutachterkosten, entgangenes\n                        anderes Geschäft. Aber NICHT der erhoffte Gewinn.\n                        Normen: §§ 122, 179 II, c.i.c.\n\nPOSITIVES Interesse  →  Stell mich so, als wäre der Vertrag ERFÜLLT worden.\n(Erfüllungsschaden)     Ersatz: alles inkl. entgangenem Gewinn (§ 252).\n                        Normen: §§ 179 I, 249, 252, 280 mit § 325\n<\/code><\/pre>\n<p><strong>Alltagsbeispiel:<\/strong> Du wolltest einen Kühlschrank für 1 €, der 300 € wert ist.\n- <strong>Positives Interesse:<\/strong> 299 € — du wirst so gestellt, als hättest du das Schnäppchen bekommen.\n- <strong>Negatives Interesse:<\/strong> nur deine Fahrtkosten und der Nachmittag, den du dir freigenommen hast — als hättest du nie von dem Angebot gehört.<\/p>\n<h3 id=\"r-106-181-insichgeschaft\">10.6 § 181 — Insichgeschäft<\/h3>\n<blockquote>\n<p><strong>Ein Vertreter kann nicht mit sich selbst kontrahieren<\/strong> — weder im eigenen Namen (Selbstkontrahieren) noch als Vertreter beider Seiten (Doppelvertretung). Ausnahme: Gestattung oder das Geschäft dient ausschließlich der Erfüllung einer Verbindlichkeit.<\/p>\n<\/blockquote>\n<p><strong>Warum?<\/strong> Interessenkonflikt. Wer beide Seiten vertritt, kann nicht hart verhandeln.<\/p>\n<p><strong>Warum es diese Regel gibt:<\/strong> Du bittest einen Freund, für dich ein gebrauchtes Auto zu kaufen — und er verkauft dir daraufhin <strong>sein eigenes<\/strong>.<\/p>\n<p>Wer soll da für dich hart verhandeln? Er sitzt auf beiden Seiten des Tisches. Je mehr er für sich herausholt, desto schlechter ist es für dich. Deshalb sagt § 181: <strong>Das geht nicht.<\/strong><\/p>\n<p>Fall 06 e): Jimmy soll für Anneliese ein Auto kaufen und verkauft ihr über einen Strohmann sein eigenes:<\/p>\n<blockquote>\n<p><em>„An sich liegen wirksame Stellvertretungen nach § 164 auf beiden Seiten vor (Jimmy vertritt Anne auf Käuferseite; Denny vertritt Jimmy auf Verkäuferseite), <\/em><em>jedoch untersagt § 181, dass man als Vertreter oder als Vertretener Verträge mit sich selbst schließt („In-sich-Geschäft\")<\/em><em>. Dementsprechend ist kein wirksamer Kaufvertrag zustande gekommen.\"<\/em><\/p>\n<\/blockquote>\n<p>Merke: Auch ein <strong>Strohmann<\/strong> rettet das nicht.<\/p>\n<h3 id=\"r-107-prufungsschema-stellvertretung\">10.7 Prüfungsschema Stellvertretung<\/h3>\n<pre><code>Anspruch X gegen Y aus § 433 (o.ä.)?\n └ Vertrag geschlossen? Angebot + Annahme § 145\n    └ WE wurde durch Z abgegeben. Hat Z den Y wirksam vertreten, § 164?\n       ① Eigene WE?                → nein: Bote, § 120\n       ② Im fremden Namen?         → nein: § 164 II, Z wird selbst Vertragspartner\n       ③ Vertretungsmacht?\n            Woher? Gesetz / § 167 I Innen- o. Außenvollmacht / § 168 Grundverhältnis /\n                   §§ 170ff Duldungs- o. Anscheinsvollmacht\n            Noch nicht erloschen? § 168 S. 1 (Grundverhältnis weg) / S. 3 (Widerruf)\n            Umfang reicht? → Auslegung §§ 133, 157\n            § 181 Insichgeschäft?\n       → nein: § 177 I schwebend unwirksam\n                → Genehmigung? (§ 177 II: 2 Wochen nach Aufforderung)\n                → Verweigerung → § 179 I oder II gegen den Vertreter,\n                                  Ausschluss nach § 179 III prüfen!\n<\/code><\/pre>\n<h3 id=\"r-beispiele-aus-deinen-ubungsfallen-fall-06\">Beispiele aus deinen Übungsfällen (Fall 06)<\/h3>\n<p><strong>Fall 06 b) — der Kühlschrank.<\/strong> Der wichtigste Fall, weil er der Probeklausur am nächsten kommt. Denny wird fristlos gekündigt und verkauft am nächsten Tag den Kühlschrank für 1 €. Original (gekürzt):<\/p>\n<blockquote>\n<p><em>„Ursprünglich hatte Denny Vertretungsmacht für Jimmy zur Tätigung von Kaufverträgen aus seinem Arbeitsvertrag mit Jimmy, <\/em><em>§§ 166 II, 168<\/em><em>. Allerdings ist diese Vertretungsmacht durch die <\/em><em>fristlose Kündigung des der Vollmacht zugrundeliegenden Rechtsgeschäfts (Arbeitsvertrag) weggefallen, § 168<\/em><em>. […]\nAnneliese könnte gegen Denny einen Anspruch auf Schadensersatz nach <\/em><em>§ 179 I<\/em><em> in Höhe von <\/em><em>299 EUR<\/em><em> haben. […] Sie hätte einen Kühlschrank im Wert von 300 EUR für den Preis von 1 EUR erhalten. <\/em><em>Also ist ihr Schaden 299 EUR, § 249.<\/em><em> […] Dieser Anspruch könnte jedoch <\/em><em>nach § 179 III ausgeschlossen<\/em><em> sein, wenn Anne den Mangel der Vertretungsmacht des Denny kannte oder hatte kennen müssen. […] Möglicherweise hätte sie bei einem so <\/em><em>auffälligen Missverhältnis<\/em><em> von Leistung und Gegenleistung die mangelnde Vertretungsmacht erkennen müssen. <\/em><em>(Hier kommt es auf die Argumentation und die Umstände des Einzelfalls an. Für die Klausur reicht dieser Hinweis.)<\/em><em>\"<\/em><\/p>\n<\/blockquote>\n<p>Der letzte Klammersatz ist ein Geschenk: <strong>Der Dozent will keine ausufernde Diskussion, sondern dass du das Problem siehst und benennst.<\/strong><\/p>\n<p><strong>Fall 06 c) — die Untervollmacht.<\/strong> Anneliese bevollmächtigt Jimmy (Makler), der gibt Untervollmacht an Denny (Pädagogikstudent). Original:<\/p>\n<blockquote>\n<p><em>„Ob die dem Jimmy erteilte Vertretungsmacht … auch die <\/em><em>Erteilung von Untervollmachten<\/em><em> umfasste, ist durch <\/em><em>Auslegung nach §§ 133, 157<\/em><em> zu ermitteln. Vorliegend hat Anne den Jimmy bevollmächtigt, da dieser durch seine <\/em><em>fachliche Expertise<\/em><em> … besonders geeignet schien. Mutmaßlich war es Anne <\/em><em>nicht recht<\/em><em>, dass ihre Aufträge von einem gerade verfügbaren Pädagogikstudenten beauftragt werden. Dem entsprechend hatte Jimmy <\/em><em>keine Vertretungsmacht zur Erteilung einer Untervollmacht<\/em><em>. […] Die <\/em><em>Weigerung der Rechnungsbezahlung<\/em><em> durch Anne ist als <\/em><em>Verweigerung der Genehmigung<\/em><em> … anzusehen, <\/em><em>§ 177 I<\/em><em>.\"<\/em><\/p>\n<\/blockquote>\n<p>Zwei Lehren: (1) Die <strong>Erteilung einer Vollmacht ist selbst ein Rechtsgeschäft<\/strong> (§ 166 II) — du musst also die Vertretung <em>zweimal<\/em> prüfen. (2) Wer die Zahlung verweigert, verweigert damit konkludent die <strong>Genehmigung<\/strong> nach § 177 I.<\/p>\n<p><strong>Fall 06 d) — die Anscheinsvollmacht.<\/strong> Nancy bestellt seit Jahren Nagellack für das Studio ihrer Mutter. Original:<\/p>\n<blockquote>\n<p><em>„Voraussetzung einer <\/em><em>Anscheinsvollmacht<\/em><em> … ist, dass eine Person gegenüber dem Geschäftspartner <\/em><em>mehrfach als Vertreter in Erscheinung getreten<\/em><em> und dieser <\/em><em>gutgläubig<\/em><em> hinsichtlich der Vertretungsmacht ist. Letztlich müsste die Vertretene das Verhalten der Vertreterin <\/em><em>gekannt haben oder hätte kennen müssen<\/em><em>. Vorliegend hat Nancy <\/em><em>mehrfach erfolgreich Bestellungen ausgeführt<\/em><em> und die Mutter <\/em><em>hätte das Auftreten ihrer Tochter auch erkennen können<\/em><em>. Folglich liegen die Voraussetzungen einer Anscheinsvollmacht vor … <\/em><em>weswegen die Firma einen Anspruch auf Kaufpreiszahlung nach § 433 hat.<\/em><em>\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Prüfe immer in dieser Reihenfolge:<\/strong> ausdrückliche Vollmacht → Vollmacht aus dem Grundverhältnis (§ 168) → Rechtsscheinvollmacht (§§ 170 ff.). Der Dozent geht in Fall 06d genau diese drei Stufen durch.<\/p>","text":"Worum es hier geht — in einfachen Worten Jemand handelt für dich — dein Kollege bestellt in deinem Namen, deine Freundin kauft für dich ein. Die Frage ist immer: Wirkt das für dich? Oder bleibt der andere darauf sitzen? Das ist das Thema deiner Probeklausur. Nimm dir für dieses Kapitel mehr Zeit als für die anderen. Achtung: Genau darum geht es in der Probeklausur. Und in der Übungsfallsammlung 06 mit fünf Fällen. Wenn du ein Thema besonders gut können willst, dann dieses. 10.1 Der Grundgedanke — § 164 Folie 20 (Original): „● Ein Stellvertreter erzeugt einen Vertragsschluss unmittelbar zwischen dem Vertretenen und dem Geschäftspartner, § 164 – Zulässigkeit der Vertretung: nahezu bei allen Rechtsgeschäften gegeben, Ausnahmen Ehe (§ 1311) und Testamentserrichtung (§ 2064) – Eigene Willenserklärung aus eigener Entschließungsfreiheit ; der Vertreter muss sich seinen Willen bilden, daher kommt es auf ihn an (z.B. Wissenszurechnung etwa beim Autokauf); anders beim Boten, der eine fremde Erklärung nur weitergibt – Im fremden Namen, „Offenkundigkeitsprinzip\" : unter Vorlage einer Urkunde …, ausdrücklich oder sich aus den Umständen ergebend, § 164 I, 2 (Geschäftsräume, Bestellung unter Firmenanschrift, …) oder für den Geschäftspartner unerheblich bei „Geschäften, für den es angeht\" (Bargeschäfte des täglichen Lebens) ; bei mangelnder Offenkundigkeit ⇒ der Vertreter wird Vertragspartner, § 164 II – Im Rahmen der Vertretungsmacht \" Die drei Voraussetzungen des § 164 (auswendig!) ① EIGENE Willenserklärung (Abgrenzung zum Boten!) ② IM FREMDEN NAMEN (Offenkundigkeitsprinzip, § 164 I 2) ③ MIT VERTRETUNGSMACHT Merkhilfe: „Eigen – fremd – Macht.\" Rechtsfolge: Der Vertrag kommt unmittelbar zwischen Vertretenem und Geschäftspartner zustande. Der Vertreter ist raus — er wird nicht Vertragspartei, haftet nicht, bekommt nichts. Der ganze Unterschied steckt in einer Frage: Darf die Person mitdenken? Bote — du gibst deinem Mitbewohner einen Zettel: „2 Vollkornbrötchen\" . Er gibt den Zettel beim Bäcker ab. Er entscheidet nichts . Er ist nur der Transportweg, wie ein Briefumschlag mit Beinen. Stellvertreter — du sagst deinem Mitbewohner: „Bring irgendwas Leckeres zum Frühstück mit, bis 10 Euro.\" Jetzt sucht er aus. Er denkt mit, er entscheidet. Der Vertrag mit dem Bäcker gilt trotzdem für dich . Weil der Vertreter mitdenkt, kommt es auch auf seinen Kopf an: Wenn er etwas weiß oder sich irrt, wird das dir zugerechnet. Beim Boten ist das anders — da zählt nur, was du auf den Zettel geschrieben hast. 10.2 ★ Vertreter vs. Bote — die wichtigste Abgrenzung Das ist eine sehr wahrscheinliche Kurzfrage („Erklären Sie den Unterschied\"). Stellvertreter § 164 Bote Wessen WE? eigene fremde — er überbringt nur Entschließungsfreiheit ja — er entscheidet mit nein — die Erklärung steht schon fest Geschäftsfähigkeit nötig? beschränkte genügt, § 165 gar keine — auch ein 6-Jähriger kann Bote sein Auf wessen Willensmängel kommt es an? auf den Vertreter (§ 166 I) auf den Geschäftsherrn Wenn er sich vertut? § 119 (eigener Irrtum) § 120 (falsche Übermittlung) Der Test: Frag dich — durfte die Person selbst entscheiden? „Kauf mir bitte eine FAZ .\" → Alles steht fest. Bote. „Kauf mir bitte irgendein schönes Modell bis 5.000 €.\" → Er darf auswählen. Vertreter. Alltagsbeispiel: Du schickst deinen Mitbewohner mit einem Zettel los: „2× Vollkornbrot\". Er ist Bote. Sagst du „bring irgendwas Leckeres mit, bis 10 Euro\", ist er Vertreter. § 120 — der Bote vertut sich. Wenn der Bote die WE falsch übermittelt, ist die Erklärung anfechtbar wie bei einem Erklärungsirrtum — also nach § 120, nicht nach § 119. Fall 06 a) genau dazu. Denny soll für Jimmy eine FAZ holen, sagt aber „Bitte eine Rundschau\". Original: „Vertragsschluss zwischen Jimmy und Anneliese wie oben ( Denny hat nach wie vor keine eigene WE abgegeben, sondern war in dem Glauben, eine fremde WE weitergegeben zu haben. Daher ist er weiterhin Bote , andere Ansicht bei guter Argumentation vertretbar). Das Geschäft ist aber nach § 120 anfechtbar. \" 10.3 Das Offenkundigkeitsprinzip — § 164 I S. 2 Der Vertreter muss erkennbar machen, dass er für einen anderen handelt. Das geht: - ausdrücklich („Ich handle im Namen der Firma Müller GmbH\") - aus den Umständen (§ 164 I S. 2): Du stehst hinter der Kasse im Laden → offensichtlich handelst du für den Ladeninhaber. Bestellung auf Firmenbriefpapier. Ausnahme: „Geschäft für den, den es angeht\" — bei Bargeschäften des täglichen Lebens ist es dem Verkäufer egal, wer der Vertragspartner ist, weil sofort bar bezahlt wird. Dann muss die Vertretung nicht offengelegt werden. Beispiel: Du kaufst am Kiosk eine Zeitung für deinen Chef. Der Kioskbesitzer will nur sein Geld — es interessiert ihn nicht, in wessen Namen du kaufst. Rechtsfolge bei fehlender Offenkundigkeit — § 164 II: Der Vertreter wird selbst Vertragspartner. Und: Er kann sich nicht darauf berufen, dass er eigentlich für einen anderen handeln wollte (§ 164 II: der Mangel des Willens, im eigenen Namen zu handeln, kommt nicht in Betracht). Merke: Wer nicht sagt, dass er für andere handelt, hat sich selbst verpflichtet. Keine Anfechtung möglich. 10.4 Woher kommt die Vertretungsmacht? Folien 20/21 (Original): „⇒ Entstehen und Grundlage der Vertretungsmacht: – aus Gesetz (Eltern, Vormund, Pfleger, Betreuer, Organ einer juristischen Person) – durch rechtsgeschäftliche Einzelübertragung („Vollmacht\", Definition in § 166 II) : ggü dem Bevollmächtigten, § 167 I, 1. Fall (Innenvollmacht) oder dem Vertragspartner, § 167 I, 2. Fall (Außenvollmacht) – aus einem zugrunde liegenden Rechtsgeschäft (z.B. Auftrag, Arbeits-, Dienstbesorgungsvertrag, s. § 168 ) – aus zuvor entstandenem Rechtsschein des Vollmachtgebers: Duldungs-, oder Anscheinsvollmacht (aus dem Rechtsgedanken der §§ 170 ff , sofern der Vertreter wiederholt für den Vertretenen aufgetreten ist, der Dritte gutgläubig auf die Bevollmächtigung vertraut und der Vertretene das Auftreten des Vertreters kannte (dann Duldungsvollmacht) oder hätte kennen müssen (dann Anscheinsvollmacht) \" Quelle § Beispiel Gesetz § 1629 (Eltern), § 26 BGB / § 35 GmbHG / § 78 AktG (Organe) Die Eltern vertreten das Kind; der GF vertritt die GmbH Innenvollmacht § 167 I, 1. Fall „Du darfst für mich einkaufen\" — gesagt zum Vertreter Außenvollmacht § 167 I, 2. Fall „Herr Meier darf für mich unterschreiben\" — gesagt zum Geschäftspartner Aus dem Grundverhältnis § 168 Arbeitsvertrag, Auftrag — die Vollmacht steckt implizit drin Duldungsvollmacht §§ 170 ff. analog Der Vertretene weiß davon und lässt es laufen Anscheinsvollmacht §§ 170 ff. analog Der Vertretene hätte es wissen müssen Prokura § 49 HGB umfassende handelsrechtliche Vollmacht Duldung vs. Anschein — Merkhilfe: D uldung = er D uldet es, weil er es weiß . A nschein = er A hnt es nicht, hätte es aber wissen müssen (Fahrlässigkeit). Beide brauchen: (1) wiederholtes Auftreten, (2) Gutgläubigkeit des Dritten. Erlöschen der Vollmacht (Folie 21): „⇒ Erlöschen der Vertretungsmacht – durch Widerruf gegenüber dem Bevollmächtigten oder dem Geschäftspartner, § 168, S. 3 – durch Erlöschen des zugrundeliegenden Rechtsgeschäfts, § 168, S. 1 – ggfs. muss Rechtsschein zerstört werden (Widerruf ggü Vertragspartner bei Innenvollmacht, §§ 170, 171; Beseitigen einer Vollmachtsurkunde, §§ 172 II, 175 f)\" ⚠️ Sehr wichtig für die Probeklausur: Ein Widerruf der Vollmacht wirkt nur für die Zukunft (ex nunc) . Man kann eine Vollmacht nicht rückwirkend entziehen . Wenn jemand im Fall sagt „ich entziehe die Vertretungsbefugnis rückwirkend\" — das geht nicht. Der Vertrag, der vorher geschlossen wurde, bleibt bestehen. Umfang der Vollmacht (Folie 21): Prokura § 49 HGB (allumfassend) · Einzel- oder Gesamtvollmacht · Haupt- und Untervollmacht · inhaltliche Beschränkungen. 10.5 ★ Was passiert, wenn die Voraussetzungen fehlen? Das ist die klassische Prüfungsfrage. Folie 22 (Original): „● Scheitert die Stellvertretung, kommt ggfs. ein Vertragsschluss mit dem „Vertreter\" oder ein Schadensersatzanspruch in Betracht, §§ 177, 179 – Fehlergrund Offenkundigkeitsprinzip ⇒ Vertragsschluss mit dem „stillen\" Vertreter, § 164 II – Fehlergrund fehlende oder überschrittene Vertretungsmacht ⇒ schwebende Unwirksamkeit : der Vertretene kann das Geschäft innerhalb von zwei Wochen genehmigen und wird dann zum Vertragspartner, § 177 I, II – Schadensersatz bei gescheiterter Stellvertretung, § 179 I, II ⇒ Anspruchsgrundlagen gegen den Vertreter ohne Vertretungsmacht: § 179 I bei bewusster Überschreitung der Vertretungsmacht: Anspruch auf Vertragserfüllung oder den sog. Erfüllungsschaden = Herstellung der Vermögenssituation, die bei erfolgreicher Vertretung bestanden hätte (einschließlich entgangenem Gewinn, §§ 249 ff, 252 „positives Interesse\" ); § 179 II, bei unbewusster Überschreitung seiner Vertretungsmacht („im guten Glauben\"): Anspruch nur auf den sog. Vertrauensschaden = Herstellung der Vermögenssituation, die bestanden hätte, wenn das Geschäft nicht stattgefunden hätte …, „negatives Interesse\" , etwa Transport- und Verwaltungskosten, ggfs. auch unterlassenes anderweitiges Geschäft, maximal jedoch der entgangene Gewinn aus dem nicht zustande gekommenen Geschäft.\" Die Fehler-Matrix (in die Klausur übernehmen) Was fehlt? Rechtsfolge § Eigene WE (war nur Bote) kein § 164, sondern Botenrecht → Anfechtung § 120 § 120 Offenkundigkeit Vertreter wird selbst Vertragspartner , keine Berufung auf inneren Willen § 164 II Vertretungsmacht (fehlt oder überschritten) schwebend unwirksam → Genehmigung möglich (2 Wochen nach Aufforderung) § 177 I, II … und der Vertretene verweigert Schadensersatz gegen den falsus procurator § 179 § 179 — positives vs. negatives Interesse Das ist der Kern der Probeklausur. Merk dir die Tabelle: § 179 I § 179 II § 179 III Wann Vertreter kannte den Mangel (bewusste Überschreitung) Vertreter war gutgläubig Geschäftspartner kannte oder musste kennen Anspruch Erfüllung ODER Erfüllungsschaden nur Vertrauensschaden Ausschluss — gar kein Anspruch Interesse positives Interesse negatives Interesse – Bedeutung Stellung wie bei wirksamem Vertrag Stellung wie ohne jeden Vertrag – Deckel — max. das positive Interesse — Positives vs. negatives Interesse — mit Bild Das hat der Dozent im Fall 09 handschriftlich aufs Flipchart gemalt: „ § 122 — als ob die Vertragspartner sich nie getroffen hätten. „Vertrauensinteresse\" = negatives Interesse. Vermögensvergleich: hergestellt wird der Zustand vor Vertragsschluss .\" NEGATIVES Interesse → Stell mich so, als hätte ich dich NIE GETROFFEN. (Vertrauensschaden) Ersatz: Fahrtkosten, Gutachterkosten, entgangenes anderes Geschäft. Aber NICHT der erhoffte Gewinn. Normen: §§ 122, 179 II, c.i.c. POSITIVES Interesse → Stell mich so, als wäre der Vertrag ERFÜLLT worden. (Erfüllungsschaden) Ersatz: alles inkl. entgangenem Gewinn (§ 252). Normen: §§ 179 I, 249, 252, 280 mit § 325 Alltagsbeispiel: Du wolltest einen Kühlschrank für 1 €, der 300 € wert ist. - Positives Interesse: 299 € — du wirst so gestellt, als hättest du das Schnäppchen bekommen. - Negatives Interesse: nur deine Fahrtkosten und der Nachmittag, den du dir freigenommen hast — als hättest du nie von dem Angebot gehört. 10.6 § 181 — Insichgeschäft Ein Vertreter kann nicht mit sich selbst kontrahieren — weder im eigenen Namen (Selbstkontrahieren) noch als Vertreter beider Seiten (Doppelvertretung). Ausnahme: Gestattung oder das Geschäft dient ausschließlich der Erfüllung einer Verbindlichkeit. Warum? Interessenkonflikt. Wer beide Seiten vertritt, kann nicht hart verhandeln. Warum es diese Regel gibt: Du bittest einen Freund, für dich ein gebrauchtes Auto zu kaufen — und er verkauft dir daraufhin sein eigenes . Wer soll da für dich hart verhandeln? Er sitzt auf beiden Seiten des Tisches. Je mehr er für sich herausholt, desto schlechter ist es für dich. Deshalb sagt § 181: Das geht nicht. Fall 06 e): Jimmy soll für Anneliese ein Auto kaufen und verkauft ihr über einen Strohmann sein eigenes: „An sich liegen wirksame Stellvertretungen nach § 164 auf beiden Seiten vor (Jimmy vertritt Anne auf Käuferseite; Denny vertritt Jimmy auf Verkäuferseite), jedoch untersagt § 181, dass man als Vertreter oder als Vertretener Verträge mit sich selbst schließt („In-sich-Geschäft\") . Dementsprechend ist kein wirksamer Kaufvertrag zustande gekommen.\" Merke: Auch ein Strohmann rettet das nicht. 10.7 Prüfungsschema Stellvertretung Anspruch X gegen Y aus § 433 (o.ä.)? └ Vertrag geschlossen? Angebot + Annahme § 145 └ WE wurde durch Z abgegeben. Hat Z den Y wirksam vertreten, § 164? ① Eigene WE? → nein: Bote, § 120 ② Im fremden Namen? → nein: § 164 II, Z wird selbst Vertragspartner ③ Vertretungsmacht? Woher? Gesetz / § 167 I Innen- o. Außenvollmacht / § 168 Grundverhältnis / §§ 170ff Duldungs- o. Anscheinsvollmacht Noch nicht erloschen? § 168 S. 1 (Grundverhältnis weg) / S. 3 (Widerruf) Umfang reicht? → Auslegung §§ 133, 157 § 181 Insichgeschäft? → nein: § 177 I schwebend unwirksam → Genehmigung? (§ 177 II: 2 Wochen nach Aufforderung) → Verweigerung → § 179 I oder II gegen den Vertreter, Ausschluss nach § 179 III prüfen! Beispiele aus deinen Übungsfällen (Fall 06) Fall 06 b) — der Kühlschrank. Der wichtigste Fall, weil er der Probeklausur am nächsten kommt. Denny wird fristlos gekündigt und verkauft am nächsten Tag den Kühlschrank für 1 €. Original (gekürzt): „Ursprünglich hatte Denny Vertretungsmacht für Jimmy zur Tätigung von Kaufverträgen aus seinem Arbeitsvertrag mit Jimmy, §§ 166 II, 168 . Allerdings ist diese Vertretungsmacht durch die fristlose Kündigung des der Vollmacht zugrundeliegenden Rechtsgeschäfts (Arbeitsvertrag) weggefallen, § 168 . […] Anneliese könnte gegen Denny einen Anspruch auf Schadensersatz nach § 179 I in Höhe von 299 EUR haben. […] Sie hätte einen Kühlschrank im Wert von 300 EUR für den Preis von 1 EUR erhalten. Also ist ihr Schaden 299 EUR, § 249. […] Dieser Anspruch könnte jedoch nach § 179 III ausgeschlossen sein, wenn Anne den Mangel der Vertretungsmacht des Denny kannte oder hatte kennen müssen. […] Möglicherweise hätte sie bei einem so auffälligen Missverhältnis von Leistung und Gegenleistung die mangelnde Vertretungsmacht erkennen müssen. (Hier kommt es auf die Argumentation und die Umstände des Einzelfalls an. Für die Klausur reicht dieser Hinweis.) \" Der letzte Klammersatz ist ein Geschenk: Der Dozent will keine ausufernde Diskussion, sondern dass du das Problem siehst und benennst. Fall 06 c) — die Untervollmacht. Anneliese bevollmächtigt Jimmy (Makler), der gibt Untervollmacht an Denny (Pädagogikstudent). Original: „Ob die dem Jimmy erteilte Vertretungsmacht … auch die Erteilung von Untervollmachten umfasste, ist durch Auslegung nach §§ 133, 157 zu ermitteln. Vorliegend hat Anne den Jimmy bevollmächtigt, da dieser durch seine fachliche Expertise … besonders geeignet schien. Mutmaßlich war es Anne nicht recht , dass ihre Aufträge von einem gerade verfügbaren Pädagogikstudenten beauftragt werden. Dem entsprechend hatte Jimmy keine Vertretungsmacht zur Erteilung einer Untervollmacht . […] Die Weigerung der Rechnungsbezahlung durch Anne ist als Verweigerung der Genehmigung … anzusehen, § 177 I .\" Zwei Lehren: (1) Die Erteilung einer Vollmacht ist selbst ein Rechtsgeschäft (§ 166 II) — du musst also die Vertretung zweimal prüfen. (2) Wer die Zahlung verweigert, verweigert damit konkludent die Genehmigung nach § 177 I. Fall 06 d) — die Anscheinsvollmacht. Nancy bestellt seit Jahren Nagellack für das Studio ihrer Mutter. Original: „Voraussetzung einer Anscheinsvollmacht … ist, dass eine Person gegenüber dem Geschäftspartner mehrfach als Vertreter in Erscheinung getreten und dieser gutgläubig hinsichtlich der Vertretungsmacht ist. Letztlich müsste die Vertretene das Verhalten der Vertreterin gekannt haben oder hätte kennen müssen . Vorliegend hat Nancy mehrfach erfolgreich Bestellungen ausgeführt und die Mutter hätte das Auftreten ihrer Tochter auch erkennen können . Folglich liegen die Voraussetzungen einer Anscheinsvollmacht vor … weswegen die Firma einen Anspruch auf Kaufpreiszahlung nach § 433 hat. \" Prüfe immer in dieser Reihenfolge: ausdrückliche Vollmacht → Vollmacht aus dem Grundverhältnis (§ 168) → Rechtsscheinvollmacht (§§ 170 ff.). Der Dozent geht in Fall 06d genau diese drei Stufen durch.","words":2446,"mins":13},{"id":"r-11-anfechtung","subject":"recht","num":"11","title":"11. Anfechtung","short":"Anfechtung","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nDu hast dich vertan, jemand hat dich belogen oder bedroht — <strong>wie kommst du wieder aus dem Vertrag raus?<\/strong><\/p>\n<p>Die Anfechtung ist der Notausgang. Aber sie funktioniert nur mit einem der Gründe, die das Gesetz anerkennt. „Ich hab's mir anders überlegt\" gehört nicht dazu.<\/p>\n<\/blockquote>\n<p><strong>Folie 26 (Original):<\/strong><\/p>\n<blockquote>\n<p>„● <strong>Vernichtung durch wirksame Anfechtung, § 142<\/strong>\n⇒ Erfordert\n– eine <strong>Anfechtungserklärung ggü dem Anfechtungsgegner, § 143<\/strong>\n– aufgrund eines <strong>Anfechtungsgrundes<\/strong> (Erklärungsirrtum, Inhaltsirrtum, Irrtum über eine verkehrswesentliche Eigenschaft, arglistige Täuschung oder widerrechtliche Drohung), <strong>§§ 119, 120, 123<\/strong>\n– innerhalb der <strong>Anfechtungsfrist, § 121, 124<\/strong>.\n⇒ Löst aus:\n– <strong>Nichtigkeit der WE von Anfang an; „ex tunc\", § 142<\/strong> (Gegensatz: ab dem Zeitpunkt für die Zukunft, <strong>„ex nunc\"<\/strong>)\n– <strong>Schadensersatz in Höhe des negativen Interesses, Anspruchsgrundlage: § 122<\/strong>\n– Ganz überwiegend: <strong>Fehleridentität beim Verfügungsgeschäft<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"r-111-die-drei-voraussetzungen-auswendig\">11.1 Die drei Voraussetzungen (auswendig!)<\/h3>\n<pre><code>① Anfechtungserklärung ggü. dem richtigen Anfechtungsgegner   § 143\n② Anfechtungsgrund                                            §§ 119, 120, 123\n③ Anfechtungsfrist                                            § 121 / § 124\n<\/code><\/pre>\n<p>Merkhilfe: <strong>„Erklärung – Grund – Frist.\"<\/strong><\/p>\n<p><strong>Was die Anfechtung ist:<\/strong> Ein <strong>Gestaltungsrecht<\/strong>. Du erklärst sie einseitig, der andere kann nichts dagegen tun. Sie braucht keine Zustimmung und kein Gericht.<\/p>\n<p><strong>Rechtsfolge § 142: ex tunc.<\/strong> Die WE gilt als <strong>von Anfang an nichtig<\/strong> — so als hätte es sie nie gegeben.<\/p>\n<blockquote>\n<p><strong>ex tunc<\/strong> = „von damals an\" → rückwirkend, alles wird gelöscht\n<strong>ex nunc<\/strong> = „von jetzt an\" → nur für die Zukunft, die Vergangenheit bleibt gültig<\/p>\n<\/blockquote>\n<p><strong>Denk an einen Eintrag im Klassenbuch.<\/strong><\/p>\n<p><strong>Anfechtung (ex tunc)<\/strong> ist, als würde der Eintrag <strong>ausradiert<\/strong>. Danach steht da nichts mehr — so, als hätte es ihn nie gegeben.<\/p>\n<p><strong>Rücktritt (ex nunc)<\/strong> ist, als würde daneben geschrieben: <em>„ab heute nicht mehr gültig\"<\/em>. Der Eintrag <strong>bleibt stehen<\/strong>. Er galt bis heute. Nur ab jetzt gilt er nicht mehr.<\/p>\n<p>Das ist kein Wortspiel, sondern hat handfeste Folgen: Bei der Anfechtung gab es nie einen Rechtsgrund, deshalb holst du das Geld über <strong>§ 812<\/strong> zurück. Beim Rücktritt gab es sehr wohl einen Vertrag, deshalb holst du es über <strong>§ 346<\/strong> zurück — aus dem Vertrag selbst.<\/p>\n<h3 id=\"r-112-die-anfechtungsgrunde\">11.2 Die Anfechtungsgründe<\/h3>\n<p><strong>Folie 27 (Original, vollständig):<\/strong><\/p>\n<blockquote>\n<p>„●<strong>Anfechtungsgründe<\/strong>\n⇒<strong>Irrtum: das unbewusste Auseinanderfallen von Wille und Erklärung<\/strong>, das dazu führte, die WE abzugeben, § 119 I\n– <strong>Inhaltsirrtum, § 119 I, 1. Fall:<\/strong> „Ich wollte zwar genau das erklären, was ich erklärt habe, war mir aber <strong>über die Bedeutung des Erklärten<\/strong> im Irrtum.\" („Ich dachte, Gold Doublé sei massives Gold\")\n– <strong>Erklärungsirrtum, § 119 I, 2. Fall:<\/strong> „Ich wollte eigentlich <strong>etwas anderes erklären<\/strong>, als ich erklärt habe\" (<strong>Versprechen, Verschreiben, Verklicken, Vertippen<\/strong>)\n– <strong>Irrtum über eine verkehrswesentliche Eigenschaft<\/strong> des Vertragsgegenstandes oder der Person, <strong>§ 119 II<\/strong> („<strong>alle wertbildenden Faktoren, nicht aber der Wert selber<\/strong>\")\n– <strong>Nicht relevant: der Motivirrtum<\/strong>\n⇒<strong>Unrechtmäßige Willensbeeinflussung<\/strong> durch den Erklärungsempfänger oder einen Dritten, der aus der Erklärung einen Vorteil zieht, <strong>§ 123<\/strong>\n– <strong>Arglistige Täuschung; § 123 I, 1. Fall:<\/strong> eine Täuschung löst durch <strong>Vorspiegelung falscher oder Entstellung oder Verschweigen wesentlicher Tatsachen<\/strong> einen Irrtum beim Erklärenden aus. <strong>Arglist liegt vor wenn der Vertragspartner weiß, dass seine Täuschungshandlung ursächlich für die WE des Erklärenden ist.<\/strong>\n– <strong>Widerrechtliche Drohung; § 123 I, 2. Fall:<\/strong> Drohung ist das <strong>Inaussichtstellen eines empfindlichen Übels<\/strong>, das der Drohende nach der Vorstellung des Erklärenden beeinflussen kann; <strong>Widerrechtlich ist die Drohung, wenn die Zweck-Mittel-Relation unangemessen ist.<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"r-die-irrtums-definition-auswendig\">Die Irrtums-Definition (auswendig!)<\/h3>\n<blockquote>\n<p><strong>Irrtum ist das unbewusste Auseinanderfallen von Wille und Erklärung.<\/strong><\/p>\n<\/blockquote>\n<h3 id=\"r-die-grunde-im-uberblick\">Die Gründe im Überblick<\/h3>\n<table>\n<thead>\n<tr>\n<th>Grund<\/th>\n<th>§<\/th>\n<th>Merksatz<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Inhaltsirrtum<\/strong><\/td>\n<td>§ 119 I, <strong>1. Fall<\/strong><\/td>\n<td>„Ich wollte das sagen — wusste aber nicht, was es bedeutet.\"<\/td>\n<td>Du bestellst „25 Gros Rollen Toilettenpapier\" und denkst, „Gros\" heiße Packung (= 144 Stück!) · Der Dozenten-Klassiker: „Ich dachte, Gold Doublé sei massives Gold\"<\/td>\n<\/tr>\n<tr>\n<td><strong>Erklärungsirrtum<\/strong><\/td>\n<td>§ 119 I, <strong>2. Fall<\/strong><\/td>\n<td>„Ich wollte was anderes sagen.\"<\/td>\n<td>Vertippen, Versprechen, Verklicken · Du schreibst 2500 statt 250<\/td>\n<\/tr>\n<tr>\n<td><strong>Eigenschaftsirrtum<\/strong><\/td>\n<td>§ 119 <strong>II<\/strong><\/td>\n<td>Irrtum über <strong>wertbildende Faktoren<\/strong> von Sache oder Person — <strong>nicht über den Wert selbst<\/strong><\/td>\n<td>Du kaufst ein „Original-Gemälde\", das ein Druck ist · Du hältst jemanden für kreditwürdig<\/td>\n<\/tr>\n<tr>\n<td><strong>Falsche Übermittlung<\/strong><\/td>\n<td>§ 120<\/td>\n<td>Der <strong>Bote<\/strong> hat es falsch überbracht<\/td>\n<td>Fall 06a: „Rundschau\" statt „FAZ\"<\/td>\n<\/tr>\n<tr>\n<td><strong>Arglistige Täuschung<\/strong><\/td>\n<td>§ 123 I, 1. Fall<\/td>\n<td>Der andere hat dich <strong>belogen<\/strong> (auch durch Verschweigen!)<\/td>\n<td>Verkäufer verschweigt den Unfallschaden<\/td>\n<\/tr>\n<tr>\n<td><strong>Widerrechtliche Drohung<\/strong><\/td>\n<td>§ 123 I, 2. Fall<\/td>\n<td>Der andere hat dich <strong>erpresst<\/strong><\/td>\n<td>„Unterschreib, sonst zeige ich dich an\"<\/td>\n<\/tr>\n<tr>\n<td><strong>Motivirrtum<\/strong><\/td>\n<td>✗ <strong>kein Grund<\/strong><\/td>\n<td>Du hast dich in deinen <strong>Beweggründen<\/strong> geirrt<\/td>\n<td>Du kaufst eine Konzertkarte für deinen Neffen, der die Band nicht mehr mag<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-die-drei-abgrenzungen-die-wirklich-abgefragt-werden\">★ Die drei Abgrenzungen, die wirklich abgefragt werden<\/h3>\n<p><strong>① Inhaltsirrtum vs. Erklärungsirrtum<\/strong><\/p>\n<pre><code>Erklärungsirrtum  →  Der Fehler passiert BEIM ERKLÄREN. Du wolltest &quot;250&quot; schreiben,\n                     dein Finger hat &quot;2500&quot; getippt. Wille ≠ geäußerte Zeichen.\n                     → Vertippen, Versprechen, Verklicken, Vergreifen\n\nInhaltsirrtum     →  Die Zeichen stimmen, aber du kennst ihre BEDEUTUNG nicht.\n                     Du wolltest &quot;Gold Doublé&quot; schreiben und hast es geschrieben —\n                     du wusstest nur nicht, dass das vergoldetes Messing ist.\n                     → Bedeutungsirrtum\n<\/code><\/pre>\n<p>Merkhilfe: <strong>Erklärungsirrtum = falsche Taste. Inhaltsirrtum = falsches Verständnis.<\/strong><\/p>\n<p><strong>② Eigenschaftsirrtum § 119 II vs. Wertirrtum (nicht anfechtbar)<\/strong><\/p>\n<p>Das ist die feinste und beliebteste Unterscheidung.<\/p>\n<blockquote>\n<p><strong>Anfechtbar<\/strong> sind Irrtümer über <strong>wertbildende Faktoren<\/strong>: Echtheit, Alter, Material, Herkunft, Baujahr, Unfallfreiheit, bei Personen: Zuverlässigkeit, Kreditwürdigkeit, berufliche Qualifikation.\n<strong>Nicht anfechtbar<\/strong> ist der Irrtum über <strong>den Wert selbst<\/strong> — also über den Preis.<\/p>\n<\/blockquote>\n<p><strong>Warum?<\/strong> Weil der Preis das ist, was du selbst aushandeln musst. Das Risiko einer Fehlkalkulation trägst du. Sonst könnte jeder jeden schlechten Deal wieder rückgängig machen.<\/p>\n<p><strong>Alltagsbeispiel:<\/strong>\n- „Ich dachte, die Uhr ist aus Gold, sie ist aber vergoldet.\" → <strong>wertbildender Faktor<\/strong> → § 119 II ✓\n- „Ich dachte, die Uhr ist 5.000 € wert, sie ist aber nur 500 € wert.\" → <strong>reiner Wertirrtum<\/strong> → ✗<\/p>\n<p><strong>③ Motivirrtum — warum nicht anfechtbar?<\/strong><\/p>\n<p>Der Motivirrtum liegt <strong>vor<\/strong> der Willensbildung. Wille und Erklärung stimmen perfekt überein — du hast genau das gewollt und gesagt, was du wolltest. Nur dein <em>Grund<\/em> dafür war falsch.<\/p>\n<p><strong>Alltagsbeispiel:<\/strong> Du kaufst einen schwarzen Anzug, weil du denkst, dein Onkel sei gestorben. Er lebt. → Du wolltest den Anzug kaufen, du hast es gesagt, alles korrekt. Nur dein Motiv war falsch. <strong>Nicht anfechtbar.<\/strong> Dein Motiv geht den Verkäufer nichts an.<\/p>\n<p><strong>Alle vier Irrtümer an einem einzigen Beispiel — du kaufst eine Uhr:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Was schiefgegangen ist<\/th>\n<th>Welcher Irrtum<\/th>\n<th>Anfechtbar?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Du wolltest 250 € bieten und hast dich vertippt: <strong>2.500 €<\/strong><\/td>\n<td>Erklärungsirrtum, § 119 I 2. Fall<\/td>\n<td>✓<\/td>\n<\/tr>\n<tr>\n<td>Du sagst „Gold Doublé\" und denkst, das sei <strong>massives Gold<\/strong><\/td>\n<td>Inhaltsirrtum, § 119 I 1. Fall<\/td>\n<td>✓<\/td>\n<\/tr>\n<tr>\n<td>Die Uhr ist tatsächlich nur <strong>vergoldet<\/strong> statt aus Gold<\/td>\n<td>Eigenschaftsirrtum, § 119 II<\/td>\n<td>✓<\/td>\n<\/tr>\n<tr>\n<td>Du wolltest sie deinem <strong>Vater schenken<\/strong> — der mag aber keine Uhren<\/td>\n<td>Motivirrtum<\/td>\n<td>✗<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Warum ist der letzte Fall nicht anfechtbar?<\/strong> Weil du genau das wolltest und genau das gesagt hast. Die Uhr ist in Ordnung, der Preis ist in Ordnung, alles ist wie besprochen. Nur dein <strong>Grund<\/strong> war falsch — und der geht den Verkäufer nichts an. Sonst könnte jeder jeden Kauf rückgängig machen mit „ich hab's mir anders überlegt\".<\/p>\n<h3 id=\"r-113-arglistige-tauschung-123-i-1-fall\">11.3 Arglistige Täuschung — § 123 I, 1. Fall<\/h3>\n<p><strong>Definition (Folie 27):<\/strong> „eine Täuschung löst durch <strong>Vorspiegelung falscher oder Entstellung oder Verschweigen wesentlicher Tatsachen<\/strong> einen Irrtum beim Erklärenden aus.\"<\/p>\n<p>Drei Varianten: <strong>aktiv lügen<\/strong> · <strong>entstellen<\/strong> · <strong>verschweigen<\/strong> (bei Aufklärungspflicht).<\/p>\n<p><strong>Arglist<\/strong> = der Täuschende <strong>weiß<\/strong>, dass seine Täuschung ursächlich für die WE ist.<\/p>\n<h3 id=\"r-114-widerrechtliche-drohung-123-i-2-fall\">11.4 Widerrechtliche Drohung — § 123 I, 2. Fall<\/h3>\n<p><strong>Definition:<\/strong> „Drohung ist das <strong>Inaussichtstellen eines empfindlichen Übels<\/strong>, das der Drohende <strong>nach der Vorstellung des Erklärenden beeinflussen kann<\/strong>.\"<\/p>\n<p><strong>Der Knackpunkt ist die Widerrechtlichkeit:<\/strong> Sie liegt vor, wenn die <strong>Zweck-Mittel-Relation unangemessen<\/strong> ist.<\/p>\n<p>Prüfe drei Dinge:\n1. Ist der <strong>Zweck<\/strong> für sich zulässig?\n2. Ist das <strong>Mittel<\/strong> für sich zulässig?\n3. <strong>Besteht ein innerer Zusammenhang zwischen beiden?<\/strong><\/p>\n<p>Der dritte Punkt entscheidet — das zeigt Fall 08f perfekt:<\/p>\n<table>\n<thead>\n<tr>\n<th>Variante<\/th>\n<th>Zweck<\/th>\n<th>Mittel<\/th>\n<th>Innerer Zusammenhang?<\/th>\n<th>Widerrechtlich?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>„Unterschreib das Unfall-Eingeständnis, sonst zeige ich dich <strong>wegen des Unfalls<\/strong> an\"<\/td>\n<td>zulässig<\/td>\n<td>zulässig<\/td>\n<td>✓ ja<\/td>\n<td><strong>nein<\/strong> — keine Anfechtung<\/td>\n<\/tr>\n<tr>\n<td>„Unterschreib das Unfall-Eingeständnis, sonst zeige ich dich <strong>wegen eines Diebstahls<\/strong> an\"<\/td>\n<td>zulässig<\/td>\n<td>zulässig<\/td>\n<td>✗ <strong>sachfremd<\/strong><\/td>\n<td><strong>ja<\/strong> — § 123 I, 2. Fall (+)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Original aus Fall 08f:<\/p>\n<blockquote>\n<p><em>„Vorliegend ist der Zweck der Beweissicherung … für sich genommen zulässig und angemessen. Auch das Mittel, jemanden anzuzeigen, der ein bestimmtes Fehlverhalten gezeigt hat, ist in Ordnung. Im vorliegenden Fall besteht auch zwischen Mittel und Zweck ein <\/em><em>innerer Zusammenhang<\/em><em>, so dass auch insoweit Angemessenheit und Verhältnismäßigkeit zu bejahen sind. Folglich war Jimmys Drohung <\/em><em>nicht widerrechtlich<\/em><em>\"<\/em>\nund zur Variante: <em>„Allerdings haben Mittel und Zweck vorliegend <\/em><em>keinen inneren Zusammenhang. Sie sind einander sachfremd<\/em><em>, weswegen die Zweck-Mittel-Beziehung als unangemessen bezeichnet werden muss. Vorliegend ist die Drohung mithin rechtswidrig\"<\/em><\/p>\n<\/blockquote>\n<h3 id=\"r-115-fristen-121-vs-124\">11.5 Fristen — § 121 vs. § 124<\/h3>\n<table>\n<thead>\n<tr>\n<th>Grund<\/th>\n<th>Frist<\/th>\n<th>§<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Irrtum (§§ 119, 120)<\/td>\n<td><strong>unverzüglich<\/strong> = ohne schuldhaftes Zögern (nicht „sofort\"! ein paar Tage Überlegung sind ok)<\/td>\n<td>§ 121<\/td>\n<\/tr>\n<tr>\n<td>Täuschung / Drohung (§ 123)<\/td>\n<td><strong>1 Jahr<\/strong> ab Entdeckung bzw. Ende der Zwangslage<\/td>\n<td>§ 124<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Warum der Unterschied?<\/strong> Wer arglistig getäuscht hat, ist <strong>nicht schutzwürdig<\/strong>. Er darf nicht darauf vertrauen, dass sein Betrug schnell bestandskräftig wird.<\/p>\n<h3 id=\"r-116-122-schadensersatz-nach-anfechtung\">11.6 § 122 — Schadensersatz nach Anfechtung<\/h3>\n<blockquote>\n<p>Wer nach <strong>§ 119 oder § 120<\/strong> anficht, muss dem anderen den <strong>Vertrauensschaden (negatives Interesse)<\/strong> ersetzen — <strong>§ 122<\/strong>.\n<strong>Aber nicht bei § 123!<\/strong> Wer getäuscht oder bedroht hat, ist nicht schutzwürdig.<\/p>\n<\/blockquote>\n<p><strong>Alltagsbeispiel:<\/strong> Du vertippst dich und bietest dein Auto für 500 statt 5.000 €. Der Käufer fährt 200 km an. Du fichst an → Vertrag weg, aber du zahlst ihm die Fahrtkosten (§ 122).\nHätte der Käufer dich getäuscht und du fichst nach § 123 an → <strong>kein<\/strong> Schadensersatz.<\/p>\n<p><strong>Merke:<\/strong> § 122 ist auch die <strong>Legaldefinition des negativen Interesses<\/strong>. Der Dozent verweist bei c.i.c. ausdrücklich darauf (Folie 23: <em>„Ausgleich des negativen Interesses, definiert in § 122 I\"<\/em>).<\/p>\n<h3 id=\"r-117-wer-ist-anfechtungsgegner-143\">11.7 Wer ist Anfechtungsgegner? — § 143<\/h3>\n<ul>\n<li>Bei <strong>Verträgen<\/strong>: der andere Vertragsteil.<\/li>\n<li>Bei <strong>einseitigen empfangsbedürftigen WE<\/strong>: derjenige, gegenüber dem sie abzugeben war.<\/li>\n<\/ul>\n<h3 id=\"r-118-prufungsschema-anfechtung\">11.8 Prüfungsschema Anfechtung<\/h3>\n<pre><code>Ist die WE nach § 142 nichtig?\n ① Anfechtungserklärung, § 143\n      - erklärt? (auch konkludent: &quot;das gilt nicht&quot;, &quot;ich will mein Geld zurück&quot;)\n      - gegenüber dem richtigen Gegner?\n ② Anfechtungsgrund\n      § 119 I 1. Fall  Inhaltsirrtum\n      § 119 I 2. Fall  Erklärungsirrtum\n      § 119 II         Eigenschaftsirrtum (wertbildender Faktor, NICHT der Wert)\n      § 120            Falschübermittlung durch Boten\n      § 123 I 1. Fall  arglistige Täuschung\n      § 123 I 2. Fall  widerrechtliche Drohung (Zweck-Mittel-Relation!)\n      ✗ Motivirrtum ist KEIN Grund\n ③ Frist:  § 121 unverzüglich  /  § 124 ein Jahr\n ⇒ Rechtsfolge: § 142 nichtig EX TUNC\n    + § 122 Schadensersatz (negatives Interesse) — nur bei §§ 119, 120, nicht bei § 123\n    + Rückabwicklung über § 812 (weil der Rechtsgrund entfallen ist)\n<\/code><\/pre>\n<h3 id=\"r-beispiele-aus-deinen-ubungsfallen-fall-08\">Beispiele aus deinen Übungsfällen (Fall 08)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Fall<\/th>\n<th>Sachverhalt<\/th>\n<th>Ergebnis (Original)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>b)<\/strong> ★<\/td>\n<td>Denny kauft eine „Original-Lithografie\", die nur signierter Druck ist<\/td>\n<td><em>„Irrtum über einen <\/em><em>wertbildenden Faktor<\/em><em> des Gegenstandes, nicht jedoch über den Wert selbst … <\/em><em>§ 119 II<\/em><em> … Mithin kann Denny innerhalb der Frist des <\/em><em>§ 121 I<\/em><em>, also unverzüglich … anfechten\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>b) Var. 1<\/strong><\/td>\n<td>Er wusste es, dachte aber, es sei 5.000 € wert<\/td>\n<td><em>„Der <\/em><em>bloße Irrtum über den Wert<\/em><em> stellt keinen wertbildenden Faktor dar … berechtigt somit nach § 119 II <\/em><em>nicht<\/em><em> zur Anfechtung\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>b) Var. 2<\/strong><\/td>\n<td>Die Galerie hatte es als „Original-Lithografie\" beworben<\/td>\n<td><em>„Anfechtung nach <\/em><em>§ 123 I<\/em><em> wegen arglistiger Täuschung … Denny kann innerhalb der Frist des <\/em><em>§ 124<\/em><em> seine Anfechtung erklären\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>c)<\/strong><\/td>\n<td>Nancy schenkt „Günter Klum\" eine Box, weil sie ihn für den Promi-Vater hält<\/td>\n<td><em>„Irrtum über eine <\/em><em>verkehrswesentliche Eigenschaft der Person<\/em><em> des Geschäftspartners nach <\/em><em>§ 119 II<\/em><em>\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>d)<\/strong><\/td>\n<td>Denny antwortet auf „VB 250 EUR\" mit „gerne für 2500 EUR\"<\/td>\n<td><em>„fallen Gewolltes und Erklärtes ersichtlich auseinander, so dass ein nach <\/em><em>§ 119 I, 2. Fall<\/em><em> beachtlicher <\/em><em>Erklärungsirrtum<\/em><em> vorliegt\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>e)<\/strong> ★<\/td>\n<td>Er hatte die Karte für seinen Neffen gekauft, dessen Musikgeschmack sich änderte<\/td>\n<td><em>„<\/em><em>Kein gesetzlich anerkannter Anfechtungsgrund, da lediglich Motivirrtum.<\/em><em>\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>f)<\/strong><\/td>\n<td>Drohung mit Anzeige (Unfall vs. Diebstahl)<\/td>\n<td>siehe Tabelle oben<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Beachte, wie elegant b) und c) zusammengehören:<\/strong> § 119 II gilt für Eigenschaften <strong>der Sache<\/strong> (Lithografie) <em>und<\/em> <strong>der Person<\/strong> (Günter Klum). Und d) + e) sind der perfekte Kontrast: einmal Erklärungsirrtum (anfechtbar), einmal Motivirrtum (nicht anfechtbar) — im selben Sachverhalt, mit derselben Konzertkarte.<\/p>","text":"Worum es hier geht — in einfachen Worten Du hast dich vertan, jemand hat dich belogen oder bedroht — wie kommst du wieder aus dem Vertrag raus? Die Anfechtung ist der Notausgang. Aber sie funktioniert nur mit einem der Gründe, die das Gesetz anerkennt. „Ich hab's mir anders überlegt\" gehört nicht dazu. Folie 26 (Original): „● Vernichtung durch wirksame Anfechtung, § 142 ⇒ Erfordert – eine Anfechtungserklärung ggü dem Anfechtungsgegner, § 143 – aufgrund eines Anfechtungsgrundes (Erklärungsirrtum, Inhaltsirrtum, Irrtum über eine verkehrswesentliche Eigenschaft, arglistige Täuschung oder widerrechtliche Drohung), §§ 119, 120, 123 – innerhalb der Anfechtungsfrist, § 121, 124 . ⇒ Löst aus: – Nichtigkeit der WE von Anfang an; „ex tunc\", § 142 (Gegensatz: ab dem Zeitpunkt für die Zukunft, „ex nunc\" ) – Schadensersatz in Höhe des negativen Interesses, Anspruchsgrundlage: § 122 – Ganz überwiegend: Fehleridentität beim Verfügungsgeschäft \" 11.1 Die drei Voraussetzungen (auswendig!) ① Anfechtungserklärung ggü. dem richtigen Anfechtungsgegner § 143 ② Anfechtungsgrund §§ 119, 120, 123 ③ Anfechtungsfrist § 121 / § 124 Merkhilfe: „Erklärung – Grund – Frist.\" Was die Anfechtung ist: Ein Gestaltungsrecht . Du erklärst sie einseitig, der andere kann nichts dagegen tun. Sie braucht keine Zustimmung und kein Gericht. Rechtsfolge § 142: ex tunc. Die WE gilt als von Anfang an nichtig — so als hätte es sie nie gegeben. ex tunc = „von damals an\" → rückwirkend, alles wird gelöscht ex nunc = „von jetzt an\" → nur für die Zukunft, die Vergangenheit bleibt gültig Denk an einen Eintrag im Klassenbuch. Anfechtung (ex tunc) ist, als würde der Eintrag ausradiert . Danach steht da nichts mehr — so, als hätte es ihn nie gegeben. Rücktritt (ex nunc) ist, als würde daneben geschrieben: „ab heute nicht mehr gültig\" . Der Eintrag bleibt stehen . Er galt bis heute. Nur ab jetzt gilt er nicht mehr. Das ist kein Wortspiel, sondern hat handfeste Folgen: Bei der Anfechtung gab es nie einen Rechtsgrund, deshalb holst du das Geld über § 812 zurück. Beim Rücktritt gab es sehr wohl einen Vertrag, deshalb holst du es über § 346 zurück — aus dem Vertrag selbst. 11.2 Die Anfechtungsgründe Folie 27 (Original, vollständig): „● Anfechtungsgründe ⇒ Irrtum: das unbewusste Auseinanderfallen von Wille und Erklärung , das dazu führte, die WE abzugeben, § 119 I – Inhaltsirrtum, § 119 I, 1. Fall: „Ich wollte zwar genau das erklären, was ich erklärt habe, war mir aber über die Bedeutung des Erklärten im Irrtum.\" („Ich dachte, Gold Doublé sei massives Gold\") – Erklärungsirrtum, § 119 I, 2. Fall: „Ich wollte eigentlich etwas anderes erklären , als ich erklärt habe\" ( Versprechen, Verschreiben, Verklicken, Vertippen ) – Irrtum über eine verkehrswesentliche Eigenschaft des Vertragsgegenstandes oder der Person, § 119 II („ alle wertbildenden Faktoren, nicht aber der Wert selber \") – Nicht relevant: der Motivirrtum ⇒ Unrechtmäßige Willensbeeinflussung durch den Erklärungsempfänger oder einen Dritten, der aus der Erklärung einen Vorteil zieht, § 123 – Arglistige Täuschung; § 123 I, 1. Fall: eine Täuschung löst durch Vorspiegelung falscher oder Entstellung oder Verschweigen wesentlicher Tatsachen einen Irrtum beim Erklärenden aus. Arglist liegt vor wenn der Vertragspartner weiß, dass seine Täuschungshandlung ursächlich für die WE des Erklärenden ist. – Widerrechtliche Drohung; § 123 I, 2. Fall: Drohung ist das Inaussichtstellen eines empfindlichen Übels , das der Drohende nach der Vorstellung des Erklärenden beeinflussen kann; Widerrechtlich ist die Drohung, wenn die Zweck-Mittel-Relation unangemessen ist. \" Die Irrtums-Definition (auswendig!) Irrtum ist das unbewusste Auseinanderfallen von Wille und Erklärung. Die Gründe im Überblick Grund § Merksatz Beispiel Inhaltsirrtum § 119 I, 1. Fall „Ich wollte das sagen — wusste aber nicht, was es bedeutet.\" Du bestellst „25 Gros Rollen Toilettenpapier\" und denkst, „Gros\" heiße Packung (= 144 Stück!) · Der Dozenten-Klassiker: „Ich dachte, Gold Doublé sei massives Gold\" Erklärungsirrtum § 119 I, 2. Fall „Ich wollte was anderes sagen.\" Vertippen, Versprechen, Verklicken · Du schreibst 2500 statt 250 Eigenschaftsirrtum § 119 II Irrtum über wertbildende Faktoren von Sache oder Person — nicht über den Wert selbst Du kaufst ein „Original-Gemälde\", das ein Druck ist · Du hältst jemanden für kreditwürdig Falsche Übermittlung § 120 Der Bote hat es falsch überbracht Fall 06a: „Rundschau\" statt „FAZ\" Arglistige Täuschung § 123 I, 1. Fall Der andere hat dich belogen (auch durch Verschweigen!) Verkäufer verschweigt den Unfallschaden Widerrechtliche Drohung § 123 I, 2. Fall Der andere hat dich erpresst „Unterschreib, sonst zeige ich dich an\" Motivirrtum ✗ kein Grund Du hast dich in deinen Beweggründen geirrt Du kaufst eine Konzertkarte für deinen Neffen, der die Band nicht mehr mag ★ Die drei Abgrenzungen, die wirklich abgefragt werden ① Inhaltsirrtum vs. Erklärungsirrtum Erklärungsirrtum → Der Fehler passiert BEIM ERKLÄREN. Du wolltest \"250\" schreiben, dein Finger hat \"2500\" getippt. Wille ≠ geäußerte Zeichen. → Vertippen, Versprechen, Verklicken, Vergreifen Inhaltsirrtum → Die Zeichen stimmen, aber du kennst ihre BEDEUTUNG nicht. Du wolltest \"Gold Doublé\" schreiben und hast es geschrieben — du wusstest nur nicht, dass das vergoldetes Messing ist. → Bedeutungsirrtum Merkhilfe: Erklärungsirrtum = falsche Taste. Inhaltsirrtum = falsches Verständnis. ② Eigenschaftsirrtum § 119 II vs. Wertirrtum (nicht anfechtbar) Das ist die feinste und beliebteste Unterscheidung. Anfechtbar sind Irrtümer über wertbildende Faktoren : Echtheit, Alter, Material, Herkunft, Baujahr, Unfallfreiheit, bei Personen: Zuverlässigkeit, Kreditwürdigkeit, berufliche Qualifikation. Nicht anfechtbar ist der Irrtum über den Wert selbst — also über den Preis. Warum? Weil der Preis das ist, was du selbst aushandeln musst. Das Risiko einer Fehlkalkulation trägst du. Sonst könnte jeder jeden schlechten Deal wieder rückgängig machen. Alltagsbeispiel: - „Ich dachte, die Uhr ist aus Gold, sie ist aber vergoldet.\" → wertbildender Faktor → § 119 II ✓ - „Ich dachte, die Uhr ist 5.000 € wert, sie ist aber nur 500 € wert.\" → reiner Wertirrtum → ✗ ③ Motivirrtum — warum nicht anfechtbar? Der Motivirrtum liegt vor der Willensbildung. Wille und Erklärung stimmen perfekt überein — du hast genau das gewollt und gesagt, was du wolltest. Nur dein Grund dafür war falsch. Alltagsbeispiel: Du kaufst einen schwarzen Anzug, weil du denkst, dein Onkel sei gestorben. Er lebt. → Du wolltest den Anzug kaufen, du hast es gesagt, alles korrekt. Nur dein Motiv war falsch. Nicht anfechtbar. Dein Motiv geht den Verkäufer nichts an. Alle vier Irrtümer an einem einzigen Beispiel — du kaufst eine Uhr: Was schiefgegangen ist Welcher Irrtum Anfechtbar? Du wolltest 250 € bieten und hast dich vertippt: 2.500 € Erklärungsirrtum, § 119 I 2. Fall ✓ Du sagst „Gold Doublé\" und denkst, das sei massives Gold Inhaltsirrtum, § 119 I 1. Fall ✓ Die Uhr ist tatsächlich nur vergoldet statt aus Gold Eigenschaftsirrtum, § 119 II ✓ Du wolltest sie deinem Vater schenken — der mag aber keine Uhren Motivirrtum ✗ Warum ist der letzte Fall nicht anfechtbar? Weil du genau das wolltest und genau das gesagt hast. Die Uhr ist in Ordnung, der Preis ist in Ordnung, alles ist wie besprochen. Nur dein Grund war falsch — und der geht den Verkäufer nichts an. Sonst könnte jeder jeden Kauf rückgängig machen mit „ich hab's mir anders überlegt\". 11.3 Arglistige Täuschung — § 123 I, 1. Fall Definition (Folie 27): „eine Täuschung löst durch Vorspiegelung falscher oder Entstellung oder Verschweigen wesentlicher Tatsachen einen Irrtum beim Erklärenden aus.\" Drei Varianten: aktiv lügen · entstellen · verschweigen (bei Aufklärungspflicht). Arglist = der Täuschende weiß , dass seine Täuschung ursächlich für die WE ist. 11.4 Widerrechtliche Drohung — § 123 I, 2. Fall Definition: „Drohung ist das Inaussichtstellen eines empfindlichen Übels , das der Drohende nach der Vorstellung des Erklärenden beeinflussen kann .\" Der Knackpunkt ist die Widerrechtlichkeit: Sie liegt vor, wenn die Zweck-Mittel-Relation unangemessen ist. Prüfe drei Dinge: 1. Ist der Zweck für sich zulässig? 2. Ist das Mittel für sich zulässig? 3. Besteht ein innerer Zusammenhang zwischen beiden? Der dritte Punkt entscheidet — das zeigt Fall 08f perfekt: Variante Zweck Mittel Innerer Zusammenhang? Widerrechtlich? „Unterschreib das Unfall-Eingeständnis, sonst zeige ich dich wegen des Unfalls an\" zulässig zulässig ✓ ja nein — keine Anfechtung „Unterschreib das Unfall-Eingeständnis, sonst zeige ich dich wegen eines Diebstahls an\" zulässig zulässig ✗ sachfremd ja — § 123 I, 2. Fall (+) Original aus Fall 08f: „Vorliegend ist der Zweck der Beweissicherung … für sich genommen zulässig und angemessen. Auch das Mittel, jemanden anzuzeigen, der ein bestimmtes Fehlverhalten gezeigt hat, ist in Ordnung. Im vorliegenden Fall besteht auch zwischen Mittel und Zweck ein innerer Zusammenhang , so dass auch insoweit Angemessenheit und Verhältnismäßigkeit zu bejahen sind. Folglich war Jimmys Drohung nicht widerrechtlich \" und zur Variante: „Allerdings haben Mittel und Zweck vorliegend keinen inneren Zusammenhang. Sie sind einander sachfremd , weswegen die Zweck-Mittel-Beziehung als unangemessen bezeichnet werden muss. Vorliegend ist die Drohung mithin rechtswidrig\" 11.5 Fristen — § 121 vs. § 124 Grund Frist § Irrtum (§§ 119, 120) unverzüglich = ohne schuldhaftes Zögern (nicht „sofort\"! ein paar Tage Überlegung sind ok) § 121 Täuschung / Drohung (§ 123) 1 Jahr ab Entdeckung bzw. Ende der Zwangslage § 124 Warum der Unterschied? Wer arglistig getäuscht hat, ist nicht schutzwürdig . Er darf nicht darauf vertrauen, dass sein Betrug schnell bestandskräftig wird. 11.6 § 122 — Schadensersatz nach Anfechtung Wer nach § 119 oder § 120 anficht, muss dem anderen den Vertrauensschaden (negatives Interesse) ersetzen — § 122 . Aber nicht bei § 123! Wer getäuscht oder bedroht hat, ist nicht schutzwürdig. Alltagsbeispiel: Du vertippst dich und bietest dein Auto für 500 statt 5.000 €. Der Käufer fährt 200 km an. Du fichst an → Vertrag weg, aber du zahlst ihm die Fahrtkosten (§ 122). Hätte der Käufer dich getäuscht und du fichst nach § 123 an → kein Schadensersatz. Merke: § 122 ist auch die Legaldefinition des negativen Interesses . Der Dozent verweist bei c.i.c. ausdrücklich darauf (Folie 23: „Ausgleich des negativen Interesses, definiert in § 122 I\" ). 11.7 Wer ist Anfechtungsgegner? — § 143 Bei Verträgen : der andere Vertragsteil. Bei einseitigen empfangsbedürftigen WE : derjenige, gegenüber dem sie abzugeben war. 11.8 Prüfungsschema Anfechtung Ist die WE nach § 142 nichtig? ① Anfechtungserklärung, § 143 - erklärt? (auch konkludent: \"das gilt nicht\", \"ich will mein Geld zurück\") - gegenüber dem richtigen Gegner? ② Anfechtungsgrund § 119 I 1. Fall Inhaltsirrtum § 119 I 2. Fall Erklärungsirrtum § 119 II Eigenschaftsirrtum (wertbildender Faktor, NICHT der Wert) § 120 Falschübermittlung durch Boten § 123 I 1. Fall arglistige Täuschung § 123 I 2. Fall widerrechtliche Drohung (Zweck-Mittel-Relation!) ✗ Motivirrtum ist KEIN Grund ③ Frist: § 121 unverzüglich / § 124 ein Jahr ⇒ Rechtsfolge: § 142 nichtig EX TUNC + § 122 Schadensersatz (negatives Interesse) — nur bei §§ 119, 120, nicht bei § 123 + Rückabwicklung über § 812 (weil der Rechtsgrund entfallen ist) Beispiele aus deinen Übungsfällen (Fall 08) Fall Sachverhalt Ergebnis (Original) b) ★ Denny kauft eine „Original-Lithografie\", die nur signierter Druck ist „Irrtum über einen wertbildenden Faktor des Gegenstandes, nicht jedoch über den Wert selbst … § 119 II … Mithin kann Denny innerhalb der Frist des § 121 I , also unverzüglich … anfechten\" b) Var. 1 Er wusste es, dachte aber, es sei 5.000 € wert „Der bloße Irrtum über den Wert stellt keinen wertbildenden Faktor dar … berechtigt somit nach § 119 II nicht zur Anfechtung\" b) Var. 2 Die Galerie hatte es als „Original-Lithografie\" beworben „Anfechtung nach § 123 I wegen arglistiger Täuschung … Denny kann innerhalb der Frist des § 124 seine Anfechtung erklären\" c) Nancy schenkt „Günter Klum\" eine Box, weil sie ihn für den Promi-Vater hält „Irrtum über eine verkehrswesentliche Eigenschaft der Person des Geschäftspartners nach § 119 II \" d) Denny antwortet auf „VB 250 EUR\" mit „gerne für 2500 EUR\" „fallen Gewolltes und Erklärtes ersichtlich auseinander, so dass ein nach § 119 I, 2. Fall beachtlicher Erklärungsirrtum vorliegt\" e) ★ Er hatte die Karte für seinen Neffen gekauft, dessen Musikgeschmack sich änderte „ Kein gesetzlich anerkannter Anfechtungsgrund, da lediglich Motivirrtum. \" f) Drohung mit Anzeige (Unfall vs. Diebstahl) siehe Tabelle oben Beachte, wie elegant b) und c) zusammengehören: § 119 II gilt für Eigenschaften der Sache (Lithografie) und der Person (Günter Klum). Und d) + e) sind der perfekte Kontrast: einmal Erklärungsirrtum (anfechtbar), einmal Motivirrtum (nicht anfechtbar) — im selben Sachverhalt, mit derselben Konzertkarte.","words":2010,"mins":11},{"id":"r-12-widerruf","subject":"recht","num":"12","title":"12. Widerruf","short":"Widerruf","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nDas ist der 14-Tage-Rückgabe-Klassiker vom Onlinekauf.<\/p>\n<p>Der entscheidende Unterschied zur Anfechtung: Hier brauchst du <strong>überhaupt keinen Grund<\/strong>. Du sagst einfach „nein doch nicht\" und bist raus.<\/p>\n<p>Dafür gilt das Widerrufsrecht nur für Verbraucher und nur bei bestimmten Vertragsarten.<\/p>\n<\/blockquote>\n<p><strong>Folie 26 (Original):<\/strong><\/p>\n<blockquote>\n<p>„● <strong>Vernichtung der WE durch Widerruf<\/strong>\n– Durch Widerruf <strong>gleichzeitig oder vor dem Wirksamwerden<\/strong> der WE, <strong>§ 130 I 2<\/strong>\n– Durch <strong>gesetzlich eingeräumtes Widerrufsrecht nach § 355<\/strong> bei <strong>Fernabsatz- und Haustürgeschäften gemäß § 312g<\/strong> (Online, Telefon, Versand, Geschäfte auf öffentlichen Plätzen/Messen, <strong>§§ 312b, 312c<\/strong>), <strong>Frist 14 Tage nach § 355 II<\/strong>\n– Durch <strong>rechtsgeschäftlich vereinbartes Widerrufsrecht<\/strong> (konstitutive Einräumung oder Verlängerung)\"<\/p>\n<\/blockquote>\n<h3 id=\"r-121-zwei-ganz-verschiedene-dinge-die-beide-widerruf-heien\">12.1 Zwei ganz verschiedene Dinge, die beide „Widerruf\" heißen<\/h3>\n<p>Das verwechseln alle. Halte sie streng auseinander:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>§ 130 I S. 2<\/strong><\/th>\n<th><strong>§ 355 (Verbraucherwiderruf)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Was<\/td>\n<td>Widerruf der <strong>WE<\/strong>, bevor sie wirksam wird<\/td>\n<td>Widerruf des <strong>geschlossenen Vertrags<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Wann<\/td>\n<td>nur <strong>vor oder gleichzeitig<\/strong> mit dem Zugang<\/td>\n<td><strong>14 Tage<\/strong> nach Vertragsschluss/Warenerhalt<\/td>\n<\/tr>\n<tr>\n<td>Wer<\/td>\n<td>jeder<\/td>\n<td>nur <strong>Verbraucher (§ 13)<\/strong> gegenüber <strong>Unternehmer (§ 14)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Wo<\/td>\n<td>immer<\/td>\n<td>nur bei bestimmten Vertragstypen (§ 312g)<\/td>\n<\/tr>\n<tr>\n<td>Grund nötig?<\/td>\n<td>nein<\/td>\n<td>nein<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-122-widerruf-vs-anfechtung-die-abgrenzung\">12.2 ★ Widerruf vs. Anfechtung — die Abgrenzung<\/h3>\n<p>Sehr wahrscheinliche Kurzfrage.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Anfechtung<\/strong><\/th>\n<th><strong>Widerruf<\/strong> (§ 355)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Grund nötig?<\/strong><\/td>\n<td><strong>JA<\/strong> — § 119, 120 oder 123<\/td>\n<td><strong>NEIN<\/strong> — reine Willkür, „ich hab's mir anders überlegt\"<\/td>\n<\/tr>\n<tr>\n<td>Frist<\/td>\n<td>unverzüglich (§ 121) / 1 Jahr (§ 124)<\/td>\n<td><strong>14 Tage<\/strong> (§ 355 II)<\/td>\n<\/tr>\n<tr>\n<td>Wirkung<\/td>\n<td><strong>ex tunc<\/strong> (§ 142) — von Anfang an nichtig<\/td>\n<td>Bindung entfällt, Rückgewähr § 355 III / § 357<\/td>\n<\/tr>\n<tr>\n<td>Wer<
