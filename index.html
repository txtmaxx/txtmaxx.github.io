e Einwilligung bedarf nach der DSGVO der eigenhändigen Unterschrift.","a":false,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Der Widerruf muss so einfach sein wie die Erteilung der Einwilligung.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Kinder können ab 16 Jahren selbst einwilligen.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Ein Widerruf macht die bisherige Verarbeitung rückwirkend rechtswidrig.","a":false,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Art. 13 gilt bei Erhebung direkt bei der betroffenen Person.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Das Auskunftsrecht steht in Art. 15.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Die Auskunft umfasst auch die geplante Speicherdauer.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Gesetzliche Aufbewahrungspflichten können der Löschung entgegenstehen.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Das Recht auf Datenübertragbarkeit gilt bei jeder Rechtsgrundlage.","a":false,"note":"nur Einwilligung/Vertrag + automatisiert","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Gegen Direktwerbung kann ohne Begründung widersprochen werden.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Betroffene müssen auf ihr Widerspruchsrecht hingewiesen werden.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Zutrittskontrolle regelt den physischen Zugang zu Räumen.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Zwei-Faktor-Authentifizierung ist eine Zutrittskontrolle.","a":false,"note":"Zugang","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"RBAC ist eine Maßnahme der Zugriffskontrolle.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Art. 32 nennt auch die Belastbarkeit der Systeme.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"„Safety\" meint den Schutz vor gezielten Angriffen.","a":false,"note":"das ist security","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Das Verzeichnis der Verarbeitungstätigkeiten steht in Art. 30.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"PDCA steht für Plan – Do – Check – Act.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Der Bußgeldrahmen der oberen Stufe liegt bei 20 Mio € oder 4 % des Vorjahresumsatzes.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Ein fehlendes Verarbeitungsverzeichnis fällt in die 20-Mio-Stufe.","a":false,"note":"10 Mio / 2 %","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Bußgelder sind absolut auf 20 Mio € gedeckelt.","a":false,"note":"je nachdem, welcher Betrag höher ist","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Ein DSB ist ab 20 ständig mit automatisierter Verarbeitung betrauten Personen zu benennen.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Der DSB haftet persönlich für Verstöße des Unternehmens.","a":false,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Der DSB kann extern bestellt werden.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Betroffene sind bei jeder Datenpanne zu benachrichtigen.","a":false,"note":"nur bei hohem Risiko","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Klassische Wenn-Dann-Software ist ein KI-System nach der KI-VO.","a":false,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Deepfakes und Chatbots unterliegen Transparenzpflichten nach Art. 50.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Prompts können personenbezogene Daten enthalten.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Art. 4 KI-VO verpflichtet zur Sicherstellung ausreichender KI-Kompetenz.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Nach der Checkliste des Dozenten darf eine KI die Letztentscheidung treffen.","a":false,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Nutzung von KI ausschließlich zu persönlichen, nicht beruflichen Zwecken ist ausgenommen.","a":true,"note":"","topic":"Gemischte Wiederholung","subject":"ds"},{"q":"Laut Folie ist unstreitig, dass ein KI-Modell selbst keine pbD enthält.","a":false,"note":"„umstritten\"","topic":"Gemischte Wiederholung","subject":"ds"}],"cards":[{"q":"Definiere die Willenserklärung.","a":"Auf einen rechtlichen Erfolg gerichtete menschliche Willensäußerung.","topic":"Definitionen","subject":"recht"},{"q":"Definiere den Zugang unter Abwesenden.","a":"Eine WE geht zu, wenn sie so in den Machtbereich des Empfängers gelangt, dass eine Kenntnisnahme möglich ist und nach der Verkehrsanschauung damit gerechnet werden kann.","topic":"Definitionen","subject":"recht"},{"q":"Definiere den Irrtum.","a":"Das unbewusste Auseinanderfallen von Wille und Erklärung.","topic":"Definitionen","subject":"recht"},{"q":"Definiere die Sittenwidrigkeit.","a":"Verstoß gegen das Anstandsgefühl aller billig und gerecht Denkenden.","topic":"Definitionen","subject":"recht"},{"q":"Definiere die Drohung.","a":"Das Inaussichtstellen eines empfindlichen Übels, das der Drohende nach der Vorstellung des Erklärenden beeinflussen kann.","topic":"Definitionen","subject":"recht"},{"q":"Definiere die Täuschung.","a":"Vorspiegelung falscher oder Entstellung bzw. Verschweigen wesentlicher Tatsachen, wodurch ein Irrtum ausgelöst wird.","topic":"Definitionen","subject":"recht"},{"q":"Definiere den Erfüllungsgehilfen (§ 278).","a":"Wer im Pflichtenkreis des Schuldners mit dessen Wissen und Wollen zur Erfüllung der Verbindlichkeit tätig ist.","topic":"Definitionen","subject":"recht"},{"q":"Definiere die Leistung i.S.d. § 812.","a":"Bewusste zweckgerichtete Mehrung fremden Vermögens.","topic":"Definitionen","subject":"recht"},{"q":"Definiere die Mahnung.","a":"Einseitige empfangsbedürftige Aufforderung zur Leistung, § 286 I.","topic":"Definitionen","subject":"recht"},{"q":"Was sind die essentialia negotii?","a":"Vertragspartner, Vertragsgegenstand, Gegenleistung — so, dass nur noch „ja\" gesagt werden muss.","topic":"Definitionen","subject":"recht"},{"q":"Öffentliches Recht vs. Privatrecht?","a":"Über-/Unterordnung (mind. eine Partei hoheitlich) vs. Gleichordnung/Koordination.","topic":"Unterschiede","subject":"recht"},{"q":"Einwendung vs. Einrede?","a":"Einwendung: Anspruch existiert nicht (mehr), von Amts wegen zu prüfen. Einrede: Anspruch existiert, ist aber nicht durchsetzbar — nur wenn die Partei sie vorträgt.","topic":"Unterschiede","subject":"recht"},{"q":"Verpflichtungs- vs. Verfügungsgeschäft?","a":"Verpflichtung begründet nur eine Pflicht (§ 433). Verfügung wirkt unmittelbar auf ein Recht ein (§ 929: Einigung + Übergabe). Beide sind rechtlich unabhängig (Abstraktionsprinzip).","topic":"Unterschiede","subject":"recht"},{"q":"Vertreter vs. Bote?","a":"Vertreter gibt eine <strong>eigene<\/strong> WE mit eigener Entschließungsfreiheit ab (§ 164). Bote überbringt nur eine <strong>fremde<\/strong>, fertige WE. Irrtum: § 119 vs. § 120.","topic":"Unterschiede","subject":"recht"},{"q":"Anfechtung vs. Widerruf?","a":"Anfechtung braucht einen <strong>Grund<\/strong> (§§ 119, 123) und wirkt <strong>ex tunc<\/strong>. Widerruf (§ 355) braucht <strong>keinen Grund<\/strong>, nur die 14-Tage-Frist, und gilt nur für Verbraucher.","topic":"Unterschiede","subject":"recht"},{"q":"Anfechtung vs. Rücktritt?","a":"Anfechtung = Willensmangel, ex tunc, Rückabwicklung über § 812. Rücktritt = Leistungsstörung, <strong>ex nunc<\/strong>, Rückabwicklung über § 346 (Rückgewährschuldverhältnis).","topic":"Unterschiede","subject":"recht"},{"q":"Positives vs. negatives Interesse?","a":"Positiv: gestellt werden wie bei <strong>erfülltem<\/strong> Vertrag (inkl. entgangenem Gewinn, § 252) — §§ 179 I, 325/280. Negativ: gestellt werden, als hätte man sich <strong>nie getroffen<\/strong> — §§ 122, 179 II, c.i.c.","topic":"Unterschiede","subject":"recht"},{"q":"§ 278 vs. § 831?","a":"§ 278: Erfüllungsgehilfe im Schuldverhältnis, Haftung für fremdes Verschulden wie für eigenes, <strong>keine Entlastung<\/strong>. § 831: Verrichtungsgehilfe im Deliktsrecht, eigenes Auswahlverschulden, <strong>Exkulpation möglich<\/strong>.","topic":"Unterschiede","subject":"recht"},{"q":"Leistungs- vs. Eingriffskondiktion?","a":"§ 812 I 1, 1. Alt.: durch <strong>Leistung<\/strong> (bewusste zweckgerichtete Zuwendung). 2. Alt.: <strong>in sonstiger Weise<\/strong> (Abbuchung, Eingriff).","topic":"Unterschiede","subject":"recht"},{"q":"Haftungsbegründende vs. haftungsausfüllende Kausalität?","a":"Begründend: Handlung → Rechtsgutsverletzung. Ausfüllend: Rechtsgutsverletzung → Schaden.","topic":"Unterschiede","subject":"recht"},{"q":"Gattungs- vs. Stückschuld?","a":"Gattung (§ 243): irgendeine Sache mittlerer Art und Güte, kein § 275 bei Untergang eines Stücks, bis zur Konkretisierung (§ 243 II). Stückschuld: genau diese Sache.","topic":"Unterschiede","subject":"recht"},{"q":"Werkvertrag vs. Dienstvertrag?","a":"§ 631: geschuldet ist der <strong>Erfolg<\/strong>. § 611: geschuldet ist das <strong>Bemühen<\/strong>.","topic":"Unterschiede","subject":"recht"},{"q":"Die drei Stufen des Anspruchsaufbaus?","a":"Entstanden → Erloschen (Einwendungen) → Durchsetzbar (Einreden).","topic":"Schemata","subject":"recht"},{"q":"Die vier Schritte des Gutachtenstils?","a":"Obersatz → Definition der TBM → Subsumtion → Schlusssatz.","topic":"Schemata","subject":"recht"},{"q":"Die drei Voraussetzungen des § 164?","a":"Eigene WE, im fremden Namen (Offenkundigkeit), mit Vertretungsmacht.","topic":"Schemata","subject":"recht"},{"q":"Die drei Voraussetzungen der Anfechtung?","a":"Anfechtungserklärung (§ 143), Anfechtungsgrund (§§ 119/120/123), Frist (§ 121/124).","topic":"Schemata","subject":"recht"},{"q":"Das Prüfungsschema § 823 I (7 Punkte)?","a":"Verletzungshandlung → haftungsbegründende Kausalität → Rechtsgutsverletzung → Rechtswidrigkeit → Verschulden (§ 276) → haftungsausfüllende Kausalität → Schaden (§§ 249, 252).","topic":"Schemata","subject":"recht"},{"q":"Die 4 Voraussetzungen des § 812?","a":"Etwas erlangt → durch Leistung oder in sonstiger Weise → ohne Rechtsgrund → kein Ausschluss (§ 814, § 818 III).","topic":"Schemata","subject":"recht"},{"q":"Das Minderjährigen-Schema?","a":"§ 104/105 (&lt; 7) → § 106 → § 107 lediglich rechtl. Vorteil → Einwilligung → § 110 → §§ 112/113 → sonst § 108 I schwebend unwirksam.","topic":"Schemata","subject":"recht"},{"q":"Der AGB-Dreischritt?","a":"§ 305 I (sind es AGB?) → § 305 II (einbezogen?) → §§ 307–309 (inhaltlich zulässig?).","topic":"Schemata","subject":"recht"},{"q":"Die 5 Unwirksamkeitsgründe?","a":"§§ 104 ff. Geschäftsfähigkeit · §§ 125 ff. Form · § 134 Verbot · § 138 Sitte/Wucher · § 142 Anfechtung.","topic":"Schemata","subject":"recht"},{"q":"Das Verzugsschema?","a":"Fälliger durchsetzbarer Anspruch → Mahnung (§ 286 I) oder entbehrlich (§ 286 II) → Nichtleistung → Verschulden (§§ 286 IV, 276).","topic":"Schemata","subject":"recht"},{"q":"Kommt es beim Zugang auf die tatsächliche Kenntnisnahme an?","a":"<strong>Nein<\/strong> — nur auf die übliche. Auch dann nicht, wenn der Absender weiß, dass der Empfänger verreist ist.","topic":"Fallen","subject":"recht"},{"q":"Ist ein wirtschaftlich vorteilhafter Kauf für einen Minderjährigen „lediglich rechtlich vorteilhaft\"?","a":"<strong>Nein.<\/strong> Die Pflicht zur Gegenleistung ist ein rechtlicher Nachteil.","topic":"Fallen","subject":"recht"},{"q":"Rettet § 110 einen Ratenkauf?","a":"<strong>Nein<\/strong> — die Leistung muss <strong>vollständig<\/strong> bewirkt sein. Erst mit der letzten Rate wird der Vertrag wirksam.","topic":"Fallen","subject":"recht"},{"q":"Prüfst du § 138 I oder § 138 II zuerst?","a":"<strong>Immer § 138 II zuerst<\/strong> — Spezialnorm vor allgemeiner Norm.","topic":"Fallen","subject":"recht"},{"q":"Ist der Irrtum über den Wert einer Sache anfechtbar?","a":"<strong>Nein.<\/strong> Nur über <strong>wertbildende Faktoren<\/strong> (§ 119 II), nicht über den Wert selbst.","topic":"Fallen","subject":"recht"},{"q":"Ist der Motivirrtum anfechtbar?","a":"<strong>Nein.<\/strong> Kein gesetzlich anerkannter Anfechtungsgrund.","topic":"Fallen","subject":"recht"},{"q":"Gibt es § 122 Schadensersatz auch bei § 123?","a":"<strong>Nein.<\/strong> Wer täuscht oder droht, ist nicht schutzwürdig. Nur bei §§ 119, 120.","topic":"Fallen","subject":"recht"},{"q":"Kann man eine Vollmacht rückwirkend entziehen?","a":"<strong>Nein.<\/strong> Der Widerruf (§ 168 S. 3) wirkt nur <strong>ex nunc<\/strong>.","topic":"Fallen","subject":"recht"},{"q":"Wahrt ein Fax die Schriftform des § 126?","a":"<strong>Nein<\/strong> — beim Empfänger kommt keine eigenhändige Unterschrift an.","topic":"Fallen","subject":"recht"},{"q":"Gibt es beim Kauf im Ladengeschäft ein Widerrufsrecht?","a":"<strong>Nein<\/strong> — nur bei § 312b (außerhalb Geschäftsräumen) und § 312c (Fernabsatz). Umtausch im Laden ist Kulanz.","topic":"Fallen","subject":"recht"},{"q":"Muss ein Verbraucher unbestellte Ware zurückschicken?","a":"<strong>Nein<\/strong>, § 241a. Weder zahlen noch zurückschicken noch sich melden.","topic":"Fallen","subject":"recht"},{"q":"Wo steht das Schmerzensgeld?","a":"<strong>§ 253 II.<\/strong> § 252 ist der entgangene Gewinn, § 249 die Naturalrestitution.","topic":"Fallen","subject":"recht"},{"q":"Kann ein Geschäftsunfähiger Bote sein?","a":"<strong>Ja<\/strong> — er gibt keine eigene WE ab, sondern überbringt nur eine fremde (Fall 03a).","topic":"Fallen","subject":"recht"},{"q":"Was passiert bei fehlender Offenkundigkeit?","a":"Der Vertreter wird <strong>selbst<\/strong> Vertragspartner, § 164 II — und kann sich nicht auf seinen inneren Willen berufen.","topic":"Fallen","subject":"recht"},{"q":"Was passiert bei widersprechenden AGB?","a":"Versteckter Dissens § 155 — beide Klauseln fallen weg, <strong>das Gesetz greift ein<\/strong> (Fall 05e).","topic":"Fallen","subject":"recht"}]};
</script>
<script>
/* =============================================================================
   Lernblatt Wirtschaftsrecht I — Anwendungslogik
   Daten liegen in window.DATA (beim Build aus den Markdown-Quellen erzeugt).
   ========================================================================== */
(function () {
  "use strict";

  var D   = window.DATA;
  var LS  = "wruds:";
  var $   = function (s, r) { return (r || document).querySelector(s); };
  var $$  = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  /* ------------------------------------------------------------ Persistenz */
  function get(key, fb) {
    try { var v = localStorage.getItem(LS + key); return v === null ? fb : JSON.parse(v); }
    catch (e) { return fb; }
  }
  function set(key, val) {
    try { localStorage.setItem(LS + key, JSON.stringify(val)); } catch (e) {}
  }

  var readSet = new Set(get("read", []));
  function persistRead() { set("read", Array.from(readSet)); }

  /* ----------------------------------------------------------------- Theme */
  var themeBtn = $("#themebtn");
  function applyTheme(mode) {
    if (mode === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", mode);
    themeBtn.setAttribute("aria-label", "Darstellung: " + ({ system: "System", light: "Hell", dark: "Dunkel" })[mode]);
    themeBtn.dataset.mode = mode;
  }
  applyTheme(get("theme", "system"));
  themeBtn.addEventListener("click", function () {
    var order = ["system", "light", "dark"];
    var next = order[(order.indexOf(themeBtn.dataset.mode) + 1) % 3];
    set("theme", next); applyTheme(next);
  });

  /* --------------------------------------------------------------- Sidebar */
  var rail = $("#rail");

  function railLink(sec) {
    var a = document.createElement("a");
    a.href = "#" + sec.id;
    a.dataset.id = sec.id;
    a.title = sec.title;
    a.innerHTML =
      '<span class="num">' + (sec.num === null ? "&middot;" : sec.num) + '</span>' +
      '<span class="label"></span>' +
      '<span class="tick" aria-hidden="true">' +
      '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 5"/></svg>' +
      '</span>';
    $(".label", a).textContent = sec.short;
    if (readSet.has(sec.id)) a.classList.add("done");
    a.addEventListener("click", function (e) { e.preventDefault(); go(sec.id); });
    return a;
  }

  function buildRail() {
    rail.innerHTML = "";
    [["recht", "Recht", "r"], ["faelle", "Übungsfälle", "f"], ["ds", "Datenschutz", "d"]].forEach(function (grp) {
      var secs = D.sections.filter(function (s) { return s.subject === grp[0]; });
      var g = document.createElement("div");
      g.className = "railgroup";
      g.dataset.subject = grp[0];
      var h = document.createElement("div");
      h.className = "railhead";
      h.innerHTML = '<span class="dot ' + grp[2] + '"></span><span>' + grp[1] + '</span><span class="count"></span>';
      g.appendChild(h);
      secs.forEach(function (s) { g.appendChild(railLink(s)); });
      rail.appendChild(g);
    });
    updateCounts();
  }

  function updateCounts() {
    $$(".railgroup").forEach(function (g) {
      var links = $$("a", g);
      var done = links.filter(function (a) { return readSet.has(a.dataset.id); }).length;
      $(".count", g).textContent = done + "/" + links.length;
    });
  }

  /* ------------------------------------------------------------ Lese-Ansicht */
  var docEl = $("#doc");
  var current = null;

  function sectionById(id) {
    for (var i = 0; i < D.sections.length; i++) if (D.sections[i].id === id) return D.sections[i];
    return null;
  }

  function go(id, opts) {
    var sec = sectionById(id);
    if (!sec) return;
    current = sec;
    setMode("read", true);
    document.documentElement.setAttribute("data-subject", sec.subject);

    var isRead = readSet.has(sec.id);
    docEl.innerHTML =
      '<header class="dochead">' +
        '<div class="eyebrow">' + ({recht: "Recht &middot; Stephan Wike",
                                    faelle: "Übungsfälle &middot; Schritt für Schritt",
                                    ds: "Datenschutz &middot; Udo Keuter"})[sec.subject] + '</div>' +
        '<h2 class="title"></h2>' +
        '<div class="meta">' +
          '<span>' + sec.words.toLocaleString("de-DE") + " Wörter &middot; ca. " + sec.mins + ' Min.</span>' +
          '<button class="readtoggle" type="button" aria-pressed="' + isRead + '">' +
            '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 5"/></svg>' +
            '<span>' + (isRead ? "Gelernt" : "Als gelernt markieren") + '</span>' +
          '</button>' +
        '</div>' +
      '</header>' +
      '<div class="prose">' + sec.html + '</div>';
    $(".title", docEl).textContent = sec.title;

    $(".readtoggle", docEl).addEventListener("click", function () {
      if (readSet.has(sec.id)) readSet.delete(sec.id); else readSet.add(sec.id);
      persistRead();
      var on = readSet.has(sec.id);
      this.setAttribute("aria-pressed", on);
      $("span", this).textContent = on ? "Gelernt" : "Als gelernt markieren";
      var link = $('#rail a[data-id="' + CSS.escape(sec.id) + '"]');
      if (link) link.classList.toggle("done", on);
      updateCounts();
      updateProgress();
    });

    // Kapitel-Einstiege als eigenen Kasten auszeichnen (meine Erklaerung,
    // im Gegensatz zum woertlichen Folienzitat darunter)
    $$(".prose blockquote", docEl).forEach(function (bq) {
      var first = bq.querySelector("strong");
      if (!first || first.textContent.indexOf("Worum es hier geht") !== 0) return;
      bq.classList.add("intro");
      var lead = document.createElement("span");
      lead.className = "lead";
      lead.textContent = "In einfachen Worten";
      first.parentNode.replaceChild(lead, first);
      // ggf. verbliebenen Trenner am Absatzanfang entfernen
      var p0 = bq.querySelector("p");
      if (p0 && /^\s*$/.test(p0.textContent)) p0.remove();
    });

    // Breite Inhalte einzeln scrollbar machen
    $$(".prose table", docEl).forEach(function (t) {
      if (t.parentElement.classList.contains("tablewrap")) return;
      var w = document.createElement("div"); w.className = "tablewrap";
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
    // Zellen mit reinen Symbolen zentrieren und faerben
    $$(".prose td", docEl).forEach(function (td) {
      var txt = td.textContent.trim();
      if (/^[✓✗]$/.test(txt)) {
        td.classList.add("sym");
        td.innerHTML = '<span class="' + (txt === "✓" ? "yes" : "no") + '">' + txt + "</span>";
      }
    });

    $$("#rail a").forEach(function (a) { a.classList.toggle("active", a.dataset.id === sec.id); });
    set("last", sec.id);
    updateProgress();

    if (!opts || !opts.keepScroll) window.scrollTo({ top: 0, behavior: "auto" });
    if (document.body.classList.contains("navopen")) toggleNav(false);
    if (opts && opts.anchor) {
      var t = document.getElementById(opts.anchor);
      if (t) setTimeout(function () { t.scrollIntoView({ block: "start" }); }, 30);
    }
    var a2 = $('#rail a[data-id="' + CSS.escape(sec.id) + '"]');
    if (a2 && a2.scrollIntoView) a2.scrollIntoView({ block: "nearest" });
  }

  function updateProgress() {
    var pct = D.sections.length ? (readSet.size / D.sections.length) * 100 : 0;
    $("#progress").style.width = pct.toFixed(1) + "%";
  }

  /* Interne Anker (#…) innerhalb des Inhalts aufloesen */
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[href^='#']") : null;
    if (!a || a.closest("#rail")) return;
    var raw = decodeURIComponent(a.getAttribute("href").slice(1));
    if (!raw) return;
    e.preventDefault();
    var pref = current ? ({recht: "r-", faelle: "f-", ds: "d-"})[current.subject] : "r-";
    // 1) Abschnitt im gleichen Fach   2) Abschnitt irgendwo   3) Ueberschrift im Dokument
    var target = sectionById(pref + raw) || sectionById(raw) ||
                 sectionById("r-" + raw) || sectionById("f-" + raw) || sectionById("d-" + raw);
    if (target) { go(target.id); return; }
    var head = document.getElementById(pref + raw) || document.getElementById(raw);
    if (head) head.scrollIntoView({ block: "start" });
  });

  /* ----------------------------------------------------------------- Suche */
  var searchEl = $("#search"), resultsEl = $("#results");
  var searchTimer = null;

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function runSearch(q) {
    q = q.trim();
    if (q.length < 2) {
      $$("#rail a").forEach(function (a) { a.classList.remove("hidden"); });
      resultsEl.hidden = true; docEl.hidden = false;
      return;
    }
    var needle = q.toLowerCase();
    var hits = [];
    D.sections.forEach(function (s) {
      var hay = (s.title + " " + s.text).toLowerCase();
      var i = hay.indexOf(needle);
      if (i === -1) return;
      var start = Math.max(0, i - 90);
      var snippet = s.text.slice(Math.max(0, i - 90), i + needle.length + 130);
      if (start > 0) snippet = "…" + snippet;
      hits.push({ sec: s, snippet: snippet, score: s.title.toLowerCase().indexOf(needle) !== -1 ? 0 : 1 });
    });
    hits.sort(function (a, b) { return a.score - b.score; });

    var ids = {};
    hits.forEach(function (h) { ids[h.sec.id] = true; });
    $$("#rail a").forEach(function (a) { a.classList.toggle("hidden", !ids[a.dataset.id]); });

    var rx = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    resultsEl.innerHTML =
      '<h3>' + hits.length + (hits.length === 1 ? " Treffer" : " Treffer") + '</h3>' +
      '<p class="hint">für „' + escapeHtml(q) + '"</p>' +
      hits.map(function (h) {
        return '<a class="hit" href="#' + h.sec.id + '" data-id="' + h.sec.id + '">' +
               '<div class="where">' + ({recht: "Recht", faelle: "Übungsfälle", ds: "Datenschutz"})[h.sec.subject] + '</div>' +
               '<h4>' + escapeHtml(h.sec.title).replace(rx, "<mark>$1</mark>") + '</h4>' +
               '<p>' + escapeHtml(h.snippet).replace(rx, "<mark>$1</mark>") + '</p></a>';
      }).join("") ||
      '<p class="emptynote">Nichts gefunden. Andere Schreibweise oder ein einzelnes Stichwort versuchen — z.&nbsp;B. „Zugang", „§ 812", „72 Stunden".</p>';

    $$(".hit", resultsEl).forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault(); searchEl.value = ""; runSearch(""); go(a.dataset.id);
      });
    });
    setMode("read", true);
    resultsEl.hidden = false; docEl.hidden = true;
  }

  searchEl.addEventListener("input", function () {
    clearTimeout(searchTimer);
    var v = searchEl.value;
    searchTimer = setTimeout(function () { runSearch(v); }, 120);
  });

  /* ------------------------------------------------------------------ Modi */
  var views = { read: $("#view-read"), quiz: $("#view-quiz"), cards: $("#view-cards") };

  function setMode(m, silent) {
    Object.keys(views).forEach(function (k) { views[k].hidden = k !== m; });
    // Die Akzentfarbe folgt dem Fach: Quiz pruet Datenschutz, Karten pruefen Recht.
    if (m === "quiz") document.documentElement.setAttribute("data-subject", "ds");
    else if (m === "cards") document.documentElement.setAttribute("data-subject", "recht");
    else if (current) document.documentElement.setAttribute("data-subject", current.subject);
    $$(".modes button").forEach(function (b) { b.setAttribute("aria-selected", b.dataset.mode === m); });
    if (!silent && m === "quiz") quizSetup();
    if (!silent && m === "cards") cardsSetup();
    if (m !== "read") { resultsEl.hidden = true; docEl.hidden = false; }
  }
  $$(".modes button").forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.dataset.mode); });
  });

  /* ------------------------------------------------------------------ Quiz */
  var quizEl = $("#view-quiz");
  var Q = { pool: [], idx: 0, right: 0, wrong: [], answered: false, scope: "Alle", size: 24 };

  function quizTopics() {
    var seen = [], out = [];
    D.quiz.forEach(function (i) { if (seen.indexOf(i.topic) === -1) { seen.push(i.topic); out.push(i.topic); } });
    return out;
  }

  function quizSetup() {
    var topics = quizTopics();
    var best = get("quizbest", null);
    quizEl.innerHTML =
      '<div class="pad"><div class="panel grid">' +
        '<h3>True / False — Datenschutz</h3>' +
        '<p class="sub">Der Datenschutzteil der Klausur besteht aus 24 True/False-Fragen zu je einem Punkt. ' +
        'Hier liegen <b>' + D.quiz.length + '</b> Aussagen aus dem Lernblatt bereit.' +
        (best ? ' Bester Lauf bisher: <b>' + best.right + "/" + best.total + "</b>." : "") + '</p>' +
        '<div class="field"><label>Umfang</label><div class="chips" id="qsize"></div></div>' +
        '<div class="field"><label>Themen</label><div class="chips" id="qscope"></div></div>' +
        '<button class="btn" id="qstart">Quiz starten</button>' +
      '</div></div>';

    var sizes = [[10, "10 Fragen"], [24, "24 — wie in der Klausur"], [50, "50 Fragen"], [0, "Alle " + D.quiz.length]];
    var sizeBox = $("#qsize");
    sizes.forEach(function (s) {
      var b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.textContent = s[1];
      b.setAttribute("aria-pressed", s[0] === Q.size);
      b.addEventListener("click", function () {
        Q.size = s[0];
        $$("button", sizeBox).forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      });
      sizeBox.appendChild(b);
    });

    var scopeBox = $("#qscope");
    ["Alle"].concat(topics).forEach(function (t) {
      var n = t === "Alle" ? D.quiz.length : D.quiz.filter(function (i) { return i.topic === t; }).length;
      var b = document.createElement("button");
      b.className = "chip"; b.type = "button";
      b.innerHTML = "<span></span><span class='n'>" + n + "</span>";
      $("span", b).textContent = t;
      b.setAttribute("aria-pressed", t === Q.scope);
      b.addEventListener("click", function () {
        Q.scope = t;
        $$("button", scopeBox).forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      });
      scopeBox.appendChild(b);
    });

    $("#qstart").addEventListener("click", function () { quizStart(); });
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function quizStart(only) {
    var src = only || D.quiz.filter(function (i) { return Q.scope === "Alle" || i.topic === Q.scope; });
    Q.pool = shuffle(src);
    if (Q.size > 0 && !only) Q.pool = Q.pool.slice(0, Q.size);
    Q.idx = 0; Q.right = 0; Q.wrong = []; Q.answered = false;
    quizRender();
  }

  function quizRender() {
    if (Q.idx >= Q.pool.length) return quizFinish();
    var it = Q.pool[Q.idx];
    quizEl.innerHTML =
      '<div class="pad"><div class="panel grid">' +
        '<div class="quizbar">' +
          '<span class="tally">Frage ' + (Q.idx + 1) + " / " + Q.pool.length + '</span>' +
          '<span class="track"><span class="fill" style="width:' + (Q.idx / Q.pool.length * 100) + '%"></span></span>' +
          '<span class="tally"><span class="g">' + Q.right + '</span> richtig · <span class="b">' + Q.wrong.length + '</span> falsch</span>' +
        '</div>' +
        '<div class="qtopic"></div>' +
        '<p class="qtext"></p>' +
        '<div class="tf">' +
          '<button type="button" data-v="1">Richtig <span class="k">1</span></button>' +
          '<button type="button" data-v="0">Falsch <span class="k">2</span></button>' +
        '</div>' +
        '<div id="qverdict"></div>' +
      '</div></div>';
    $(".qtopic", quizEl).textContent = it.topic;
    $(".qtext", quizEl).textContent = it.q;
    $$(".tf button", quizEl).forEach(function (b) {
      b.addEventListener("click", function () { quizAnswer(b.dataset.v === "1"); });
    });
    Q.answered = false;
  }

  function quizAnswer(pick) {
    if (Q.answered) return;
    Q.answered = true;
    var it = Q.pool[Q.idx];
    var ok = pick === it.a;
    if (ok) Q.right++; else Q.wrong.push(it);

    // Zaehler sofort mitziehen, nicht erst beim naechsten Rendern
    var tallies = $$(".quizbar .tally", quizEl);
    if (tallies[1]) {
      tallies[1].innerHTML = '<span class="g">' + Q.right + '</span> richtig · <span class="b">' +
                             Q.wrong.length + '</span> falsch';
    }

    $$(".tf button", quizEl).forEach(function (b) {
      b.disabled = true;
      var v = b.dataset.v === "1";
      if (v === pick) b.classList.add(ok ? "pickedRight" : "pickedWrong");
      else if (v === it.a) b.classList.add("wasRight");
    });

    var v = $("#qverdict");
    v.innerHTML =
      '<div class="verdict ' + (ok ? "good" : "bad") + '">' +
        "<b>" + (ok ? "Richtig" : "Falsch") + " — die Aussage ist " + (it.a ? "wahr" : "unwahr") + "</b>" +
        (it.note ? '<span class="note"></span>' : "") +
      "</div>" +
      '<div class="actions"><button class="btn" id="qnext">' +
        (Q.idx + 1 >= Q.pool.length ? "Auswertung" : "Weiter") +
      ' <span class="k" style="opacity:.6">⏎</span></button></div>';
    if (it.note) $(".note", v).textContent = it.note;
    $("#qnext").addEventListener("click", quizNext);
    $("#qnext").focus();
  }

  function quizNext() { Q.idx++; quizRender(); }

  function quizFinish() {
    var total = Q.pool.length, pct = total ? Math.round(Q.right / total * 100) : 0;
    var cls = pct >= 85 ? "good" : pct >= 65 ? "mid" : "bad";
    var best = get("quizbest", null);
    if (!best || Q.right / total > best.right / best.total) set("quizbest", { right: Q.right, total: total });

    quizEl.innerHTML =
      '<div class="pad"><div class="panel">' +
        '<div class="score">' +
          '<div class="big">' + Q.right + '</div>' +
          '<div class="of">von ' + total + " Aussagen richtig beurteilt</div>" +
          '<div class="pct ' + cls + '">' + pct + " %</div>" +
        "</div>" +
        '<div class="review" id="qreview"></div>' +
        '<div class="actions">' +
          (Q.wrong.length ? '<button class="btn" id="qagainwrong">Die ' + Q.wrong.length + " falschen wiederholen</button>" : "") +
          '<button class="btn ghost" id="qrestart">Neuer Durchgang</button>' +
          '<button class="btn ghost" id="qsetup">Auswahl ändern</button>' +
        "</div>" +
      "</div></div>";

    if (Q.wrong.length) {
      var r = $("#qreview");
      r.innerHTML = "<h4>Diese Aussagen saßen noch nicht</h4>";
      Q.wrong.forEach(function (it) {
        var d = document.createElement("div");
        d.className = "rev";
        d.innerHTML = '<span class="s"></span><span class="t">Richtig wäre: <b>' +
                      (it.a ? "wahr" : "unwahr") + "</b>" + (it.note ? " — " : "") + '<i class="n"></i></span>';
        $(".s", d).textContent = it.q;
        if (it.note) $(".n", d).textContent = it.note;
        r.appendChild(d);
      });
      $("#qagainwrong").addEventListener("click", function () { quizStart(Q.wrong); });
    }
    $("#qrestart").addEventListener("click", function () { quizStart(); });
    $("#qsetup").addEventListener("click", quizSetup);
  }

  /* ---------------------------------------------------------- Karteikarten */
  var cardsEl = $("#view-cards");
  var C = { pool: [], idx: 0, known: 0, again: [], flipped: false, scope: "Alle" };

  function cardTopics() {
    var seen = [];
    D.cards.forEach(function (c) { if (seen.indexOf(c.topic) === -1) seen.push(c.topic); });
    return seen;
  }

  function cardsSetup() {
    cardsEl.innerHTML =
      '<div class="pad"><div class="panel grid">' +
        "<h3>Karteikarten — Recht</h3>" +
        '<p class="sub">Neben der Fallbearbeitung fragt die Klausur Definitionen, Unterschiede und Prüfungsschemata ab. ' +
        "<b>" + D.cards.length + "</b> Karten aus dem Selbsttest des Lernblatts.</p>" +
        '<div class="field"><label>Themen</label><div class="chips" id="cscope"></div></div>' +
        '<button class="btn" id="cstart">Karten durchgehen</button>' +
      "</div></div>";
    var box = $("#cscope");
    ["Alle"].concat(cardTopics()).forEach(function (t) {
      var n = t === "Alle" ? D.cards.length : D.cards.filter(function (c) { return c.topic === t; }).length;
      var b = document.createElement("button");
      b.className = "chip"; b.type = "button";
      b.innerHTML = "<span></span><span class='n'>" + n + "</span>";
      $("span", b).textContent = t;
      b.setAttribute("aria-pressed", t === C.scope);
      b.addEventListener("click", function () {
        C.scope = t;
        $$("button", box).forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      });
      box.appendChild(b);
    });
    $("#cstart").addEventListener("click", function () { cardsStart(); });
  }

  function cardsStart(only) {
    C.pool = shuffle(only || D.cards.filter(function (c) { return C.scope === "Alle" || c.topic === C.scope; }));
    C.idx = 0; C.known = 0; C.again = []; C.flipped = false;
    cardsRender();
  }

  function cardsRender() {
    if (C.idx >= C.pool.length) return cardsFinish();
    var c = C.pool[C.idx];
    cardsEl.innerHTML =
      '<div class="pad"><div class="panel grid card" id="thecard">' +
        '<div class="quizbar">' +
          '<span class="tally">Karte ' + (C.idx + 1) + " / " + C.pool.length + "</span>" +
          '<span class="track"><span class="fill" style="width:' + (C.idx / C.pool.length * 100) + '%"></span></span>' +
          '<span class="tally"><span class="g">' + C.known + "</span> gewusst</span>" +
        "</div>" +
        '<div class="side"></div>' +
        '<p class="q"></p>' +
        '<div id="cback"></div>' +
      "</div></div>";
    $(".side", cardsEl).textContent = c.topic;
    $(".q", cardsEl).textContent = c.q;
    $("#cback").innerHTML = '<div class="flip">Zum Aufdecken klicken <kbd>Leertaste</kbd></div>';
    C.flipped = false;
    $("#thecard").addEventListener("click", function (e) {
      if (e.target.closest("button")) return;
      cardsFlip();
    });
  }

  function cardsFlip() {
    if (C.flipped) return;
    C.flipped = true;
    var c = C.pool[C.idx];
    var back = $("#cback");
    back.innerHTML =
      '<div class="a"></div>' +
      '<div class="actions">' +
        '<button class="btn" id="cknow">Gewusst <span class="k">1</span></button>' +
        '<button class="btn ghost" id="cagain">Nochmal <span class="k">2</span></button>' +
      "</div>";
    $(".a", back).innerHTML = c.a;   // enthaelt bewusst die Auszeichnung aus der Quelle
    $("#cknow").addEventListener("click", function (e) { e.stopPropagation(); cardsGrade(true); });
    $("#cagain").addEventListener("click", function (e) { e.stopPropagation(); cardsGrade(false); });
  }

  function cardsGrade(known) {
    if (!C.flipped) return;
    if (known) C.known++; else C.again.push(C.pool[C.idx]);
    C.idx++; cardsRender();
  }

  function cardsFinish() {
    var total = C.pool.length;
    cardsEl.innerHTML =
      '<div class="pad"><div class="panel">' +
        '<div class="score">' +
          '<div class="big">' + C.known + "</div>" +
          '<div class="of">von ' + total + " Karten auf Anhieb gewusst</div>" +
        "</div>" +
        '<div class="actions">' +
          (C.again.length ? '<button class="btn" id="cagainall">Die ' + C.again.length + " offenen wiederholen</button>" : "") +
          '<button class="btn ghost" id="crestart">Neuer Durchgang</button>' +
          '<button class="btn ghost" id="csetup">Auswahl ändern</button>' +
        "</div>" +
      "</div></div>";
    if (C.again.length) $("#cagainall").addEventListener("click", function () { cardsStart(C.again); });
    $("#crestart").addEventListener("click", function () { cardsStart(); });
    $("#csetup").addEventListener("click", cardsSetup);
  }

  /* ------------------------------------------------------------- Tastatur */
  document.addEventListener("keydown", function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing) { e.preventDefault(); searchEl.focus(); searchEl.select(); return; }
    if (e.key === "Escape") {
      if (typing) { searchEl.value = ""; runSearch(""); searchEl.blur(); }
      if (document.body.classList.contains("navopen")) toggleNav(false);
      return;
    }
    if (typing) return;

    if (!views.quiz.hidden) {
      if (!Q.answered && (e.key === "1" || e.key === "r" || e.key === "ArrowLeft")) { quizAnswer(true); e.preventDefault(); }
      else if (!Q.answered && (e.key === "2" || e.key === "f" || e.key === "ArrowRight")) { quizAnswer(false); e.preventDefault(); }
      else if (Q.answered && (e.key === "Enter" || e.key === " ")) { if ($("#qnext")) { quizNext(); e.preventDefault(); } }
    } else if (!views.cards.hidden) {
      if (!C.flipped && (e.key === " " || e.key === "Enter")) { if ($("#thecard")) { cardsFlip(); e.preventDefault(); } }
      else if (C.flipped && (e.key === "1" || e.key === "g")) { cardsGrade(true); e.preventDefault(); }
      else if (C.flipped && (e.key === "2" || e.key === "n")) { cardsGrade(false); e.preventDefault(); }
    } else {
      var i = current ? D.sections.indexOf(current) : -1;
      if (e.key === "j" && i > -1 && i < D.sections.length - 1) go(D.sections[i + 1].id);
      if (e.key === "k" && i > 0) go(D.sections[i - 1].id);
    }
  });

  /* ------------------------------------------------------- Mobile-Navigation */
  function toggleNav(on) {
    var next = on === undefined ? !document.body.classList.contains("navopen") : on;
    document.body.classList.toggle("navopen", next);
    $("#menubtn").setAttribute("aria-expanded", next);
  }
  $("#menubtn").addEventListener("click", function () { toggleNav(); });
  document.addEventListener("click", function (e) {
    if (!document.body.classList.contains("navopen")) return;
    if (e.target === document.body) toggleNav(false);
  });

  /* ------------------------------------------------------------------ Start */
  buildRail();
  updateProgress();
  var startId = get("last", null);
  go(sectionById(startId) ? startId : D.sections[0].id);
})();

</script>
</body>
</html>
