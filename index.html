lockquote>\n<h3 id=\"r-die-drei-stufen-in-einem-bild\">Die drei Stufen in einem Bild<\/h3>\n<pre><code>┌───────────────────────────────────────────────────────────────┐\n│ 1. ANSPRUCH ENTSTANDEN?                                        │\n│    Ist die Anspruchsgrundlage erfüllt?                         │\n│    Vertrag geschlossen? Wirksam? Keine Nichtigkeit?            │\n│    → Hier steckt 80 % deiner Arbeit                            │\n└───────────────────────────┬───────────────────────────────────┘\n                            │ ja\n┌───────────────────────────▼───────────────────────────────────┐\n│ 2. ANSPRUCH ERLOSCHEN?  → EINWENDUNGEN                        │\n│    Erfüllung · Aufrechnung · Erlass · Unmöglichkeit           │\n│    · Anfechtung (§ 142) · Rücktritt (§ 346) · Widerruf        │\n│    Vom Gericht VON AMTS WEGEN zu prüfen                        │\n└───────────────────────────┬───────────────────────────────────┘\n                            │ nein\n┌───────────────────────────▼───────────────────────────────────┐\n│ 3. ANSPRUCH DURCHSETZBAR? → EINREDEN                          │\n│    Verjährung § 214 · Zurückbehaltung § 273 · § 320 · Stundung│\n│    Nur wenn die PARTEI sich darauf beruft                      │\n└───────────────────────────┬───────────────────────────────────┘\n                            │ ja\n                     ⇒ ENDERGEBNIS\n<\/code><\/pre>\n<h3 id=\"r-einwendung-vs-einrede-der-unterschied-den-man-abfragen-kann\">Einwendung vs. Einrede — der Unterschied, den man abfragen kann<\/h3>\n<p>Das ist eine <strong>klassische Kurzfrage<\/strong>. Merk dir:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Einwendung<\/strong><\/th>\n<th><strong>Einrede<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Wirkung<\/td>\n<td>Der Anspruch <strong>existiert nicht (mehr)<\/strong><\/td>\n<td>Der Anspruch <strong>existiert<\/strong>, kann aber nicht durchgesetzt werden<\/td>\n<\/tr>\n<tr>\n<td>Prüfung<\/td>\n<td><strong>Von Amts wegen<\/strong> — das Gericht prüft von selbst<\/td>\n<td>Nur wenn die <strong>Partei sie vorträgt<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Beispiele<\/td>\n<td>Erfüllung, Aufrechnung, Erlass, Unmöglichkeit, Nichtigkeit (§§ 105, 125, 134, 138), erfolgreiche Anfechtung, Rücktritt, Widerruf<\/td>\n<td>Verjährung § 214, Zurückbehaltungsrecht § 273, nicht erfüllter Vertrag § 320, Stundung<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Alltagsbeispiel:<\/strong> Du hast deinem Kumpel 200 € geliehen.\n- Du hast das Geld <strong>schon zurückbekommen<\/strong> → Einwendung (Erfüllung). Der Anspruch ist tot, egal ob jemand was sagt.\n- Der Anspruch ist <strong>verjährt<\/strong> → Einrede. Der Anspruch lebt noch! Wenn dein Kumpel vor Gericht nicht sagt „das ist verjährt\", verurteilt ihn der Richter trotzdem. Der Richter darf ihn nicht darauf hinweisen.<\/p>\n<p><strong>Der Unterschied wird an einer Frage klar: Muss ich es sagen — oder merkt es das Gericht von selbst?<\/strong><\/p>\n<p>Dein Kumpel verklagt dich auf 200 Euro.<\/p>\n<ul>\n<li>Du hast <strong>längst zurückgezahlt<\/strong> → <strong>Einwendung<\/strong>. Die Schuld gibt es nicht mehr. Das Gericht berücksichtigt das, sobald es sich aus den Unterlagen ergibt, auch ohne dass du darauf herumreitest.<\/li>\n<li>Die Forderung ist <strong>verjährt<\/strong> → <strong>Einrede<\/strong>. Die Schuld gibt es sehr wohl noch! Du darfst dich nur weigern zu zahlen. Aber wenn du vor Gericht nicht ausdrücklich sagst „das ist verjährt\", verurteilt dich der Richter trotzdem. Er darf dich nicht einmal darauf hinweisen.<\/li>\n<\/ul>\n<h3 id=\"r-35-der-komplette-bauplan-fur-deinen-klausurfall\">3.5 Der komplette Bauplan für deinen Klausurfall<\/h3>\n<p>Diesen Ablauf schreibst du in der Klausur ganz oben auf dein Konzeptblatt:<\/p>\n<pre><code>① Sachverhalt lesen. Personen + Beziehungen skizzieren (Pfeile!).\n② Für JEDE Personenbeziehung: Wer will was von wem woraus?\n   → Bei mehreren Beziehungen: mehrere Obersätze! (Folie 11: „ggfs. mehrere Obersätze&quot;)\n③ Anspruchsgrundlage wählen. Reihenfolge:\n      Vertrag (§ 433, § 631, § 535 ...)\n   →  vertragsähnlich (c.i.c. §§ 311 II, 241 II, 280)\n   →  Delikt (§ 823)\n   →  Bereicherung (§ 812)                    ← immer zuletzt, ist subsidiär\n④ ENTSTANDEN?  Vertrag geschlossen (Angebot § 145 + Annahme)?\n                Beide WE wirksam? (Geschäftsfähigkeit, Form, Inhalt, Zugang)\n⑤ ERLOSCHEN?   Erfüllung · Anfechtung § 142 · Rücktritt § 346 · Widerruf § 355\n⑥ DURCHSETZBAR? Verjährung § 214 · § 273 · § 320\n⑦ Schlusssatz: „Folglich hat X einen Anspruch auf … aus § …&quot; (oder: hat keinen)\n<\/code><\/pre>\n<h3 id=\"r-36-was-du-nicht-machen-darfst\">3.6 Was du NICHT machen darfst<\/h3>\n<table>\n<thead>\n<tr>\n<th>Fehler<\/th>\n<th>Warum es Punkte kostet<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>„Der Vertrag ist nichtig, weil Denny 6 Jahre alt ist.\"<\/td>\n<td><strong>Urteilsstil.<\/strong> Ergebnis zuerst, dann Begründung. Kostet Methodenpunkte. Richtig: „Fraglich ist, ob Dennys WE wirksam ist. Nach § 104 Nr. 1 ist geschäftsunfähig, wer … Denny ist 6 Jahre alt. Folglich …\"<\/td>\n<\/tr>\n<tr>\n<td>Keine Anspruchsgrundlage nennen<\/td>\n<td>Kostet direkt 10 Punkte. Auch eine <em>falsche<\/em> AG bringt noch 3+3 Punkte („als erforderlich erkannt\" + „EINE AG gefunden\"). <strong>Nenne immer eine.<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Definitionen weglassen<\/td>\n<td>Die Subsumtion hängt in der Luft. Ohne Definition kein Maßstab.<\/td>\n<\/tr>\n<tr>\n<td>Kein Schlusssatz<\/td>\n<td>5 Punkte weg. Der Dozent hat „Formulierung Ergebnis 5\" explizit als eigene Position.<\/td>\n<\/tr>\n<tr>\n<td>Alles in einem Fließtextblock<\/td>\n<td>Der Dozent will Struktur sehen. Rück ein, nummeriere, benutz (+)/(-).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-beispiel-aus-deinen-ubungsfallen\">Beispiel aus deinen Übungsfällen<\/h3>\n<p><strong>Fall 06 b) (Kühlschrank)<\/strong> — hier siehst du beide Obersätze für zwei Personenbeziehungen. Original:<\/p>\n<blockquote>\n<p>„(Obersatz:) Anne könnte einen Anspruch auf Übereignung des Kühlschranks von Jimmy nach § 433 haben. <strong>(Definition Tatbestandsmerkmale, TBM):<\/strong> Voraussetzung dafür wäre ein gültiger Kaufvertrag zwischen Anne und Jimmy. Verträge kommen nach § 145 durch Angebot und Annahme zustande. […] <strong>(Subsumtion:)<\/strong> Denny hat eine eigene Erklärung über die Übereignung des Kühlschrankes für 1 EUR abgegeben. […] <strong>(Schlusssatz:)<\/strong> Folglich hatte Denny für den nach der Kündigung geschlossenen Kaufvertrag keine Vertretungsmacht mehr. Folglich wurde Jimmy durch Denny nicht wirksam vertreten. Folglich ist kein Kaufvertrag zwischen Anne und Jimmy geschlossen worden, so dass Anne keinen Anspruch gegenüber Jimmy auf Übereignung des Kühlschrankes hat.<\/p>\n<p><strong>Anneliese könnte gegen Denny einen Anspruch auf Schadensersatz nach § 179 I in Höhe von 299 EUR haben.<\/strong> […]\"<\/p>\n<\/blockquote>\n<p>Erst Anne → Jimmy (scheitert), dann Anne → Denny (§ 179). <strong>Wenn der erste Anspruch scheitert, ist der Fall nicht zu Ende — dann kommt der nächste Anspruchsgegner.<\/strong> Genau das wird auch in der Probeklausur verlangt.<\/p>","text":"Worum es hier geht — in einfachen Worten Hier geht es nicht darum, was du schreibst, sondern in welcher Reihenfolge . Das klingt nach Formkram. Ist es aber nicht: Für die reine Form gibt es 20 von 55 Punkten, und weitere 5 für den Schlusssatz. Du kannst also inhaltlich danebenliegen und trotzdem gut abschneiden, wenn die Struktur sitzt — und umgekehrt. Wenn du nur ein einziges Kapitel wirklich beherrschst, dann dieses. Das ist das wichtigste Kapitel des Lernblatts. Hier liegen die 10 Methodenpunkte + 10 Punkte Anspruchsgrundlage = 36 % der Fallpunkte , und zwar unabhängig vom Inhalt. 3.1 Der Grundgedanke (Folie 11, Original) „● Jura als Wissenschaft – Klassische wissenschaftliche Methode: Aufstellen einer Hypothese ⇒ Experimentelle Erhärtung/Falsifizierung der Hypothese ⇒ Ableitung des Ergebnisses in Bezug auf die Hypothese – Juristische Methode (in der Falllösung): Aufstellung eines Obersatzes ⇒ Definition der Tatbestandsmerkmale / Einordnung des Lebenssachverhaltes unter die definierten TBM („Subsumtion\") ⇒ Schlussfolgern des Ergebnisses \" Der Dozent baut hier eine Brücke, die für dich als Informatiker perfekt passt: Naturwissenschaft: Hypothese → Experiment → Ergebnis Jura: Obersatz → Definition+Subsumtion → Schlusssatz Informatik: Assertion → Test ausführen → pass/fail Ein Gutachten ist ein Unit-Test in Prosa. Du behauptest etwas (Obersatz = Assertion), definierst die Bedingung (Definition = erwarteter Wert), prüfst den konkreten Fall dagegen (Subsumtion = actual vs. expected) und stellst das Ergebnis fest (Schlusssatz = assert passed/failed). 3.2 Die vier Schritte im Detail (Folie 11, Original) „● Aufstellung eines „Obersatzes\" , der zu dem gewünschten juristischen Ergebnis führen würde – „Wer? will was? von wem?\" ; ggfs. mehrere Obersätze bei verschiedenen Personenbeziehungen – Was wäre hierfür eine geeignete Anspruchsgrundlage , z.B. eine Rechtsnorm aus Gesetz oder Vertrag („woraus?\") ● Benennung und Definition der Tatbestandsmerkmale – Ggfs. in mehreren Ebenen (manche Definition enthält weiter zu definierende Begriffe) ● „Subsumtion\" – Einordnung des Lebenssachverhalts unter jedes der definierten Tatbestandsmerkmale / Argumentation ● „Schlusssatz\" : Feststellung des Zwischenergebnisses/Gesamtergebnisses – Alle anspruchsbegründenden Tatbestandsmerkmale erfüllt? – Feststellung der Rechtsfolge\" Die Zauberformel: WER will WAS von WEM WORAUS? Das ist der einzige Satz, den du am Anfang jeder Fallbearbeitung hinschreiben musst. Frage Bedeutung Beispiel Wer? Anspruchsteller / Gläubiger Anneliese will was? Rechtsfolge, das Begehren Übereignung des Kühlschranks von wem? Anspruchsgegner / Schuldner von Jimmy woraus? Anspruchsgrundlage aus § 433 I Daraus wird automatisch der Obersatz: „ Anneliese könnte einen Anspruch auf Übereignung des Kühlschranks gegen Jimmy aus § 433 I haben. \" Merke: Immer Konjunktiv. „könnte … haben\", „müsste\", „wäre\". Im Gutachtenstil weißt du das Ergebnis noch nicht — du arbeitest darauf hin. Wenn du „Anneliese hat einen Anspruch …\" schreibst und dann erst prüfst, ist das Urteilsstil und kostet dich Methodenpunkte. Schreib wie ein Arzt, der eine Diagnose stellt — nicht wie einer, der das Ergebnis schon kennt. Ein Arzt sagt nicht „Sie haben Grippe\" und sucht sich danach die Gründe zusammen. Er sagt: „Es könnte eine Grippe sein. Dafür bräuchte es Fieber, Gliederschmerzen und Husten. Fieber: 39 Grad, ja. Gliederschmerzen: ja. Husten: ja. Also ist es eine Grippe.\" Erst die Vermutung, dann die Voraussetzungen, dann der Abgleich mit dem, was du vorfindest, dann das Ergebnis. Genau diese Reihenfolge will der Dozent auf dem Papier sehen. Die Gutachten-Satzbausteine (auswendig lernen!) Diese fünf Formulierungen ziehst du in der Klausur einfach durch. Sie sind wörtlich aus den Musterlösungen des Dozenten: Schritt Baustein Original aus Fall 02d / 06b 1. Obersatz „X könnte einen Anspruch auf … gegen Y aus § … haben.\" „Denny könnte einen Anspruch auf Übereignung der Konsole zum Preis von 230 EUR haben. Grundlage hierfür wäre ein wirksamer Kaufvertrag nach § 433 I. („Obersatz\")\" 2. Voraussetzung „Voraussetzung dafür wäre …\" / „Fraglich ist, ob …\" „Voraussetzung für § 164 ist eine eigene WE, die im fremden Namen im Rahmen der gegebenen Vertretungsmacht abgegeben wurde.\" 3. Definition „Unter … versteht man …\" / „… ist …\" „Eine WE ist eine von einem Handlungswillen getragene Äußerung, durch die die Erklärenden einen Rechtserfolg herbeiführen möchten („neue Definition\")\" 4. Subsumtion „Vorliegend …\" / „Hier hat X …\" „Durch das Schreiben der Mail wollte Nancy den Rechtserfolg eines Kaufvertrages mit Denny herbeiführen („Subsumtion\")\" 5. Schluss „Folglich …\" / „Somit liegt … vor\" / „Mithin …\" „Folglich ist kein Kaufvertrag zwischen Anne und Jimmy geschlossen worden, so dass Anne keinen Anspruch … hat.\" Der Dozent liebt „Folglich\". In Fall 06b stehen vier „Folglich\" hintereinander. Benutz es. Es ist das sichtbarste Signal für „ich beherrsche den Gutachtenstil\". 3.3 Verschachtelung — der Punkt, an dem die meisten scheitern Folie 11: „Ggfs. in mehreren Ebenen (manche Definition enthält weiter zu definierende Begriffe)\" Genau das ist der Kern. Eine Definition wirft neue Begriffe auf, die du wieder definieren musst. Das ist Rekursion . Schau dir an, wie der Dozent das in Fall 02d selbst durchzieht (Original, gekürzt): Obersatz: Anspruch auf Übereignung aus § 433 I? └ TBM: Dafür braucht es einen Vertrag → §§ 145 ff.: Angebot + Annahme └ Definition: „Bei einem Angebot handelt es sich um eine WE\" └ Definition eine Ebene tiefer: „Eine WE ist eine von einem Handlungswillen getragene Äußerung …\" └ Subsumtion: „Durch das Schreiben der Mail wollte Nancy …\" └ Teilergebnis: „Somit liegt ein Angebot vor\" └ Neues TBM: „Fraglich ist, ob dieses wirksam geworden ist\" └ Definition: „Wirksam werden WE unter Abwesenden mit Zugang, § 130 I\" └ Definition tiefer: „Zugegangen ist eine WE, wenn sie so in den Machtbereich … gelangt ist, dass eine Kenntnisnahme möglich und üblich ist\" └ Subsumtion: „Vorliegend ist die Mail … um 21 Uhr in den Machtbereich von Denny gelangt\" └ Zwischenergebnis: „Zugang liegt vor\" └ Neues TBM: „Allerdings wird eine WE nicht wirksam, wenn … ein Widerruf zugeht, § 130 I 2\" └ ... Schlusssatz: „Folglich liegt Denny kein wirksames Angebot durch Nancy vor, so dass auch kein Kaufvertrag … geschlossen wurde und demnach Danny keinen Anspruch auf Übereignung der Konsole hat\" Kennst du das von Behörden? Du willst einen Personalausweis. Dafür brauchst du eine Meldebescheinigung. Für die brauchst du eine Wohnungsgeberbestätigung. Für die brauchst du den Vermieter. Jede Voraussetzung bringt eine neue mit — so lange, bis du bei etwas ankommst, das du einfach vorlegen kannst. Genau so hangelt sich ein Gutachten nach unten: Jeder Begriff, den du zur Erklärung benutzt, muss selbst erklärt werden, bis du bei einer Frage landest, die du direkt am Sachverhalt beantworten kannst. def anspruch_433(): return vertrag_geschlossen() and not erloschen() and durchsetzbar() def vertrag_geschlossen(): return angebot() and annahme() def angebot(): return ist_willenserklaerung() and wirksam_geworden() and kein_widerruf() def wirksam_geworden(): return zugang_130() # ← hier endlich am Sachverhalt entscheidbar Klausur-Tipp: Rück ein! Der Dozent hat gesagt, Stichworte und Halbsätze reichen. Nutz Einrückung und Spiegelstriche, um die Ebenen sichtbar zu machen. Genau so sieht sein eigenes handschriftliches Flipchart aus (Fall 09): Anspruch Nancy → Jimmy: Zahlung d. Werklohns, § 631 * Vertrag geschlossen ⟹ Anspruch entstanden * Anspruch erloschen, § 346? Rücktritt * RT-Erklärung, § 349 (+) * RT-Recht aus Gesetz - § 323 - fällige Leistung, § 271 (+) - nicht (vertragsmäßig) erfüllt (+) * angemessene Nachfrist (+) ⟹ RT-Grund § 323 (+) Das ist Original-Dozentenhandschrift . So darf dein Gutachten aussehen. Mit (+) und (-) markiert er, ob ein Merkmal erfüllt ist. Übernimm das. 3.4 Der Anspruchsaufbau — die drei Stufen (Folie 12) Das ist der Teil, der in deiner Themenliste komplett fehlte. Folie 11 sagt dir, wie du schreibst. Folie 12 sagt dir, in welcher Reihenfolge du prüfst. Folie 12 (Original, vollständig): „⇒ Anspruch entstanden! Eine oder mehrere Anspruchsgrundlagen sind erfüllt ● Anspruch erloschen? Einwendungen gegen den Anspruch (von Amts wegen zu berücksichtigen) – durch Erfüllung, § 346 – durch Aufrechnung, § 349 – durch Erlass, § 389 – durch absolute oder wirtschaftliche Unmöglichkeit, §§ 275, 326 ● Anspruch durchsetzbar? Einreden gegen den Anspruch (durch Partei vorzutragen) – Verjährung, § 214 – Zurückbehaltungsrecht, § 273 – Nicht erfüllter Vertrag, § 320 – Stundung ⇒ Endergebnis \" ⚠️ Achtung, die §§ auf dieser Folie sind verrutscht. Richtig ist: Erfüllung = § 362 (nicht 346) · Aufrechnung = § 389 (nicht 349) · Erlass = § 397 (nicht 389). § 346 ist der Rücktritt , § 349 die Rücktrittserklärung . Schreib in der Klausur einfach „Erfüllung\", „Aufrechnung\", „Erlass\" ohne § — dann kannst du nichts falsch machen. Der Dozent will die Struktur sehen, nicht die Paragrafennummer dieser Nebenpunkte. Die §§ 214, 273, 320 auf der Folie sind dagegen korrekt . Die drei Stufen in einem Bild ┌───────────────────────────────────────────────────────────────┐ │ 1. ANSPRUCH ENTSTANDEN? │ │ Ist die Anspruchsgrundlage erfüllt? │ │ Vertrag geschlossen? Wirksam? Keine Nichtigkeit? │ │ → Hier steckt 80 % deiner Arbeit │ └───────────────────────────┬───────────────────────────────────┘ │ ja ┌───────────────────────────▼───────────────────────────────────┐ │ 2. ANSPRUCH ERLOSCHEN? → EINWENDUNGEN │ │ Erfüllung · Aufrechnung · Erlass · Unmöglichkeit │ │ · Anfechtung (§ 142) · Rücktritt (§ 346) · Widerruf │ │ Vom Gericht VON AMTS WEGEN zu prüfen │ └───────────────────────────┬───────────────────────────────────┘ │ nein ┌───────────────────────────▼───────────────────────────────────┐ │ 3. ANSPRUCH DURCHSETZBAR? → EINREDEN │ │ Verjährung § 214 · Zurückbehaltung § 273 · § 320 · Stundung│ │ Nur wenn die PARTEI sich darauf beruft │ └───────────────────────────┬───────────────────────────────────┘ │ ja ⇒ ENDERGEBNIS Einwendung vs. Einrede — der Unterschied, den man abfragen kann Das ist eine klassische Kurzfrage . Merk dir: Einwendung Einrede Wirkung Der Anspruch existiert nicht (mehr) Der Anspruch existiert , kann aber nicht durchgesetzt werden Prüfung Von Amts wegen — das Gericht prüft von selbst Nur wenn die Partei sie vorträgt Beispiele Erfüllung, Aufrechnung, Erlass, Unmöglichkeit, Nichtigkeit (§§ 105, 125, 134, 138), erfolgreiche Anfechtung, Rücktritt, Widerruf Verjährung § 214, Zurückbehaltungsrecht § 273, nicht erfüllter Vertrag § 320, Stundung Alltagsbeispiel: Du hast deinem Kumpel 200 € geliehen. - Du hast das Geld schon zurückbekommen → Einwendung (Erfüllung). Der Anspruch ist tot, egal ob jemand was sagt. - Der Anspruch ist verjährt → Einrede. Der Anspruch lebt noch! Wenn dein Kumpel vor Gericht nicht sagt „das ist verjährt\", verurteilt ihn der Richter trotzdem. Der Richter darf ihn nicht darauf hinweisen. Der Unterschied wird an einer Frage klar: Muss ich es sagen — oder merkt es das Gericht von selbst? Dein Kumpel verklagt dich auf 200 Euro. Du hast längst zurückgezahlt → Einwendung . Die Schuld gibt es nicht mehr. Das Gericht berücksichtigt das, sobald es sich aus den Unterlagen ergibt, auch ohne dass du darauf herumreitest. Die Forderung ist verjährt → Einrede . Die Schuld gibt es sehr wohl noch! Du darfst dich nur weigern zu zahlen. Aber wenn du vor Gericht nicht ausdrücklich sagst „das ist verjährt\", verurteilt dich der Richter trotzdem. Er darf dich nicht einmal darauf hinweisen. 3.5 Der komplette Bauplan für deinen Klausurfall Diesen Ablauf schreibst du in der Klausur ganz oben auf dein Konzeptblatt: ① Sachverhalt lesen. Personen + Beziehungen skizzieren (Pfeile!). ② Für JEDE Personenbeziehung: Wer will was von wem woraus? → Bei mehreren Beziehungen: mehrere Obersätze! (Folie 11: „ggfs. mehrere Obersätze\") ③ Anspruchsgrundlage wählen. Reihenfolge: Vertrag (§ 433, § 631, § 535 ...) → vertragsähnlich (c.i.c. §§ 311 II, 241 II, 280) → Delikt (§ 823) → Bereicherung (§ 812) ← immer zuletzt, ist subsidiär ④ ENTSTANDEN? Vertrag geschlossen (Angebot § 145 + Annahme)? Beide WE wirksam? (Geschäftsfähigkeit, Form, Inhalt, Zugang) ⑤ ERLOSCHEN? Erfüllung · Anfechtung § 142 · Rücktritt § 346 · Widerruf § 355 ⑥ DURCHSETZBAR? Verjährung § 214 · § 273 · § 320 ⑦ Schlusssatz: „Folglich hat X einen Anspruch auf … aus § …\" (oder: hat keinen) 3.6 Was du NICHT machen darfst Fehler Warum es Punkte kostet „Der Vertrag ist nichtig, weil Denny 6 Jahre alt ist.\" Urteilsstil. Ergebnis zuerst, dann Begründung. Kostet Methodenpunkte. Richtig: „Fraglich ist, ob Dennys WE wirksam ist. Nach § 104 Nr. 1 ist geschäftsunfähig, wer … Denny ist 6 Jahre alt. Folglich …\" Keine Anspruchsgrundlage nennen Kostet direkt 10 Punkte. Auch eine falsche AG bringt noch 3+3 Punkte („als erforderlich erkannt\" + „EINE AG gefunden\"). Nenne immer eine. Definitionen weglassen Die Subsumtion hängt in der Luft. Ohne Definition kein Maßstab. Kein Schlusssatz 5 Punkte weg. Der Dozent hat „Formulierung Ergebnis 5\" explizit als eigene Position. Alles in einem Fließtextblock Der Dozent will Struktur sehen. Rück ein, nummeriere, benutz (+)/(-). Beispiel aus deinen Übungsfällen Fall 06 b) (Kühlschrank) — hier siehst du beide Obersätze für zwei Personenbeziehungen. Original: „(Obersatz:) Anne könnte einen Anspruch auf Übereignung des Kühlschranks von Jimmy nach § 433 haben. (Definition Tatbestandsmerkmale, TBM): Voraussetzung dafür wäre ein gültiger Kaufvertrag zwischen Anne und Jimmy. Verträge kommen nach § 145 durch Angebot und Annahme zustande. […] (Subsumtion:) Denny hat eine eigene Erklärung über die Übereignung des Kühlschrankes für 1 EUR abgegeben. […] (Schlusssatz:) Folglich hatte Denny für den nach der Kündigung geschlossenen Kaufvertrag keine Vertretungsmacht mehr. Folglich wurde Jimmy durch Denny nicht wirksam vertreten. Folglich ist kein Kaufvertrag zwischen Anne und Jimmy geschlossen worden, so dass Anne keinen Anspruch gegenüber Jimmy auf Übereignung des Kühlschrankes hat. Anneliese könnte gegen Denny einen Anspruch auf Schadensersatz nach § 179 I in Höhe von 299 EUR haben. […]\" Erst Anne → Jimmy (scheitert), dann Anne → Denny (§ 179). Wenn der erste Anspruch scheitert, ist der Fall nicht zu Ende — dann kommt der nächste Anspruchsgegner. Genau das wird auch in der Probeklausur verlangt.","words":2154,"mins":11},{"id":"r-4-die-willenserklärung-we","subject":"recht","num":"4","title":"4. Die Willenserklärung (WE)","short":"Die Willenserklärung (WE)","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nDie Willenserklärung ist der kleinste Baustein des gesamten Zivilrechts. <strong>Ein Vertrag besteht aus genau zwei davon<\/strong>: einer von dir, einer vom anderen.<\/p>\n<p>Deshalb fängt fast jede Fallprüfung hier an. Wenn du verstanden hast, was eine Willenserklärung ist und wann sie gilt, hast du den größten Teil des Stoffs verstanden.<\/p>\n<p>In diesem Kapitel steht auch <strong>die eine Definition, die du wirklich Wort für Wort auswendig können musst<\/strong>.<\/p>\n<\/blockquote>\n<p><strong>Folie 8 (Original):<\/strong><\/p>\n<blockquote>\n<p>„Nukleus/Grundbaustein zur Erzeugung von Rechtsfolgen ist die <strong>WILLENSERKLÄRUNG<\/strong>\n– <strong>Auf einen rechtlichen Erfolg gerichtete menschliche Willensäußerung<\/strong>\n– Erklärung: ausdrücklich oder konkludent (durch schlüssiges Verhalten)\"<\/p>\n<\/blockquote>\n<p><strong>Diese Definition musst du wörtlich können.<\/strong> Sie ist der meistgebrauchte Satz der ganzen Klausur.<\/p>\n<h3 id=\"r-41-die-bestandteile-folie-9-original\">4.1 Die Bestandteile (Folie 9, Original)<\/h3>\n<blockquote>\n<p>„● <strong>„Menschliche Willensäußerung\"<\/strong>: Handlungs- und Erklärungswille\n– Auszulegen nach <strong>§§ 133, 157<\/strong> bei Verträgen vom <strong>(obj.) Empfängerhorizont<\/strong>\n– <strong>Handlungswille<\/strong> (willensgetragenes Verhalten; Gegenteil: „Reflex\"): „ich will etwas tun (oder unterlassen)\"\n+ <strong>Erklärungswille<\/strong> (Bewusstsein, etwas rechtlich Erhebliches zu tun): „ich kann u. will EINEN Rechtserfolg erreichen\"\n+ <strong>Geschäftswille<\/strong>: „ich strebe DIESEN Rechtserfolg an\"\n– Erklärung: ausdrücklich od. konkludent (durch schlüssiges Verhalten: <strong>äußerer Anhaltspunkt + entspr. Interessenlage<\/strong>), mit Wissen und Wollen\n– <strong>Rechtsbindungswille<\/strong>: Ich will mich jetzt genau an die angestrebte Rechtsfolge binden\"<\/p>\n<\/blockquote>\n<h3 id=\"r-die-vier-willen-mit-alltagsbeispielen\">Die vier Willen — mit Alltagsbeispielen<\/h3>\n<p>Denk an eine Auktion. Der Auktionator ruft „25.000 Euro zum Ersten…\"<\/p>\n<table>\n<thead>\n<tr>\n<th>Wille<\/th>\n<th>Bedeutung<\/th>\n<th>Du hebst die Hand, weil …<\/th>\n<th>Liegt vor?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Handlungswille<\/strong><\/td>\n<td>„Ich will überhaupt etwas tun\"<\/td>\n<td>… du sie bewusst hebst<\/td>\n<td>✓<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><em>Gegenteil: Reflex<\/em><\/td>\n<td>… dich jemand am Arm stößt / du niest<\/td>\n<td>✗<\/td>\n<\/tr>\n<tr>\n<td><strong>Erklärungswille<\/strong> (= Erklärungsbewusstsein)<\/td>\n<td>„Ich will <em>irgendeinen<\/em> Rechtserfolg\"<\/td>\n<td>… du weißt, dass Handheben hier ein Gebot ist<\/td>\n<td>✓<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>… du einem Freund winkst<\/td>\n<td>✗<\/td>\n<\/tr>\n<tr>\n<td><strong>Geschäftswille<\/strong><\/td>\n<td>„Ich will <em>genau diesen<\/em> Rechtserfolg\"<\/td>\n<td>… du genau dieses Bild für genau 25.000 willst<\/td>\n<td>✓<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>… du dachtest, es geht um Los Nr. 4<\/td>\n<td>✗ (→ Irrtum, Kap. 11)<\/td>\n<\/tr>\n<tr>\n<td><strong>Rechtsbindungswille<\/strong><\/td>\n<td>„Ich will mich jetzt binden\"<\/td>\n<td>… du kaufen und nicht nur plaudern willst<\/td>\n<td>✓<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Dieselben vier Willen nochmal ganz langsam — im Restaurant:<\/strong><\/p>\n<p>Du <strong>hebst die Hand<\/strong>, um die Kellnerin zu rufen.\n- Du wolltest die Hand heben → Handlungswille ✓\n- Wolltest du damit etwas rechtlich Verbindliches? Nein, nur Aufmerksamkeit → Erklärungswille ✗\n- <strong>Ergebnis: keine Willenserklärung.<\/strong> Du hast nichts bestellt.<\/p>\n<p>Du sagst: <strong>„Einmal die Pizza Margherita, bitte.\"<\/strong>\n- Du wolltest sprechen → Handlungswille ✓\n- Dir ist klar, dass du damit bestellst und danach zahlen musst → Erklärungswille ✓\n- Du willst genau die Margherita, nicht die Salami → Geschäftswille ✓\n- Du meinst es ernst, es ist kein Witz → Rechtsbindungswille ✓\n- <strong>Ergebnis: Willenserklärung.<\/strong> Der Vertrag kommt zustande.<\/p>\n<p><strong>Was passiert, wenn ein Wille fehlt?<\/strong><\/p>\n<ul>\n<li><strong>Handlungswille fehlt<\/strong> → keine WE. Punkt. Ein Reflex ist rechtlich ein Nichts.<\/li>\n<li><strong>Erklärungswille fehlt<\/strong> → Hier wird es interessant. <strong>Objektiv<\/strong> kann trotzdem eine WE vorliegen, wenn ein vernünftiger Empfänger das als Erklärung verstehen durfte (§§ 133, 157). Dann ist sie aber <strong>anfechtbar<\/strong> (§ 119 I, Kap. 11).<\/li>\n<li><strong>Geschäftswille fehlt<\/strong> → WE liegt vor, ist aber <strong>anfechtbar<\/strong> (§ 119 I, Inhalts- oder Erklärungsirrtum).<\/li>\n<li><strong>Rechtsbindungswille fehlt<\/strong> → keine WE, sondern nur eine unverbindliche <strong>Gefälligkeit<\/strong>.<\/li>\n<\/ul>\n<h3 id=\"r-42-ausdrucklich-oder-konkludent\">4.2 Ausdrücklich oder konkludent<\/h3>\n<ul>\n<li><strong>Ausdrücklich:<\/strong> „Ich kaufe das Fahrrad für 50 Euro.\" Gesprochen, geschrieben, per WhatsApp.<\/li>\n<li><strong>Konkludent<\/strong> (= durch schlüssiges Verhalten): Du legst die Cola aufs Kassenband. Du steigst in die Bahn. Du nickst.<\/li>\n<\/ul>\n<p>Die Folie nennt für konkludent <strong>zwei Voraussetzungen<\/strong>:\n1. <strong>äußerer Anhaltspunkt<\/strong> (irgendetwas Sichtbares muss passieren) und\n2. <strong>entsprechende Interessenlage<\/strong> (das Verhalten muss sinnvoll nur so deutbar sein).<\/p>\n<p><strong>Beispiel:<\/strong> Du gehst in die Bäckerei, zeigst auf ein Brötchen, legst 60 Cent hin. Kein Wort gesprochen — aber äußerer Anhaltspunkt (Zeigen + Geld) + Interessenlage (was sollte das sonst sein?) = wirksames Angebot.<\/p>\n<p><strong>Schweigen ist im Zivilrecht grundsätzlich KEINE Willenserklärung.<\/strong> Wenn dir jemand schreibt „Wenn Sie nicht widersprechen, gilt der Vertrag als geschlossen\" — das funktioniert nicht. (Ausnahme im Handelsrecht: kaufmännisches Bestätigungsschreiben. Nicht klausurrelevant bei euch.)<\/p>\n<h3 id=\"r-43-auslegung-133-157-objektiver-empfangerhorizont\">4.3 Auslegung §§ 133, 157 — objektiver Empfängerhorizont<\/h3>\n<p><strong>Das ist das wichtigste Werkzeug der ganzen Vorlesung.<\/strong> Es taucht in fast jedem Übungsfall auf.<\/p>\n<ul>\n<li><strong>§ 133:<\/strong> Der <em>wirkliche Wille<\/em> zählt, nicht der Wortlaut.<\/li>\n<li><strong>§ 157:<\/strong> Verträge sind nach <em>Treu und Glauben<\/em> mit Rücksicht auf die <em>Verkehrssitte<\/em> auszulegen.<\/li>\n<\/ul>\n<p>Zusammen ergibt das den <strong>objektiven Empfängerhorizont<\/strong>:<\/p>\n<blockquote>\n<p>Entscheidend ist nicht, was der Erklärende <em>dachte<\/em>, und auch nicht, was der Empfänger <em>zufällig verstanden hat<\/em> — sondern <strong>was ein verständiger, objektiver Dritter in der Position des Empfängers verstehen durfte.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Ein Beispiel, das jeder kennt:<\/strong> Du schreibst deinem Vermieter: <em>„Ich bin zum 30.9. raus.\"<\/em><\/p>\n<p>Du meinst: erstmal nur eine Info, du suchst ja noch. Der Vermieter liest: <strong>Kündigung<\/strong>. Und weil jeder vernünftige Mensch in seiner Lage das genau so verstehen darf, <strong>ist<\/strong> es eine Kündigung — auch wenn du innerlich etwas anderes gemeint hast.<\/p>\n<blockquote>\n<p><strong>Merke: Nicht was du dachtest zählt, sondern was der andere verstehen durfte.<\/strong><\/p>\n<\/blockquote>\n<p>Das ist übrigens der Grund, warum es die Anfechtung überhaupt gibt (Kapitel 11). Sie ist der Notausgang für genau solche Fälle.<\/p>\n<p><strong>Alltagsbeispiel:<\/strong> Du schreibst deinem Vermieter „Ich möchte zum 30.9. raus.\" Du denkst dabei „das ist erstmal nur eine Info\". Ein objektiver Vermieter versteht: Kündigung. → Es ist eine Kündigung.<\/p>\n<h3 id=\"r-44-abgrenzung-we-vs-gefalligkeit-vs-realakt\">4.4 Abgrenzung: WE vs. Gefälligkeit vs. Realakt<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Was<\/th>\n<th>Beispiel<\/th>\n<th>Rechtsfolge<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Willenserklärung<\/strong><\/td>\n<td>auf Rechtserfolg gerichtet<\/td>\n<td>„Ich verkaufe dir das Rad für 50 €\"<\/td>\n<td>Rechtsgeschäft entsteht<\/td>\n<\/tr>\n<tr>\n<td><strong>Gefälligkeit<\/strong><\/td>\n<td>kein Rechtsbindungswille<\/td>\n<td>„Wollen wir heute Abend ins Kino?\"<\/td>\n<td>Nichts. Kein Anspruch.<\/td>\n<\/tr>\n<tr>\n<td><strong>Realakt<\/strong><\/td>\n<td>Rechtsfolge tritt ein, <em>ohne<\/em> dass jemand sie will<\/td>\n<td>Verbinden zweier Sachen, Fund, Herstellung eines Werks<\/td>\n<td>Gesetz knüpft an, unabhängig vom Willen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Realakte sind bei euch nicht Schwerpunkt, aber der Begriff steht auf Folie 7 („Erklärungen und <strong>Realakte<\/strong>\"). Merke: Ein 5-Jähriger kann keinen Vertrag schließen (§ 105), aber er kann durch Malen ein Urheberrecht erwerben — dafür braucht es keine Geschäftsfähigkeit.<\/p>\n<h3 id=\"r-45-beispiele-aus-deinen-ubungsfallen-fall-01\">4.5 Beispiele aus deinen Übungsfällen (Fall 01)<\/h3>\n<p>Das ist <strong>die<\/strong> Fallsammlung zur WE. Der Dozent prüft hier immer nach demselben Muster: <code>Handlungswille (+/-), Erklärungswille (+/-) ⇒ Ergebnis<\/code>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Fall<\/th>\n<th>Sachverhalt<\/th>\n<th>Lösung des Dozenten (Original)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>a)<\/strong><\/td>\n<td>Denny zu Nancy: „Wollen wir heute Abend ins Gibson's gehen?\"<\/td>\n<td><em>„Handlungswille (+), Erklärungswille (-): keine rechtlich erhebliche Folge angestrebt ⇒ keine wirksame WE\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>b)<\/strong><\/td>\n<td>Anneliese bittet Nachbarn Jimmy, im Urlaub die Zimmerpflanzen zu gießen<\/td>\n<td><em>„Handlungswille (+); Erklärungswille (-) … ⇒ keine wirksame WE — anders ggfs. wenn die Pflanzen einen besonderen Wert haben und J dies erkennen konnte (§§ 133, 157 Auslegung vom Empfängerhorizont)\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>c)<\/strong> ★<\/td>\n<td>Denny winkt im Auktionsraum seinem Freund zu — der Auktionator schlägt zu: 10 Fuder Wein für 45.400 €<\/td>\n<td><em>„Handlungswille (+), Erklärungswille (?), subjektiv aus der Sicht von D (-), jedoch nach Auslegung vom obj. Empfängerhorizont (+) ⇒ <\/em><em>wirksame WE<\/em><em>\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>d)<\/strong> ★<\/td>\n<td>Anneliese legt die vorbereitete Kündigung auf den Tisch, Lebensgefährte Denny wirft sie ein<\/td>\n<td><em>„Handlungswille (+ bezüglich Verfassens der Kündigung), Erklärungswille (?): A wollte ihre Erklärung nur vorbereiten und hat sie nicht mit Wissen und Wollen abgegeben, subjektiv (-), jedoch nach Auslegung vom obj. Empfängerhorizont (+) ⇒ <\/em><em>wirksame WE<\/em><em>\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>e1)<\/strong><\/td>\n<td>Media Markt plakatiert „Schnell-Spar-Tage, PS5 Pro 649 €\"<\/td>\n<td><em>„Handlungswille (+), Erklärungswille (-), da noch kein unmittelbarer Geschäftserfolg angestrebt, sondern lediglich vorbereitet ⇒ keine WE\"<\/em> → das ist die <strong>invitatio ad offerendum<\/strong>, Kap. 9<\/td>\n<\/tr>\n<tr>\n<td><strong>e2)<\/strong><\/td>\n<td>Media Markt schickt Anneliese ungefragt eine PS5 mit Rechnung<\/td>\n<td><em>„Handlungswille (+), Erklärungswille (+), Erklärung (+) durch konkludentes Verhalten „Zuschicken\", AB muss nur noch zugreifen ⇒ <\/em><em>wirksame WE<\/em><em>, allerdings kein Vertragsschluss wegen <\/em><em>§ 241a<\/em><em>\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>e3)<\/strong><\/td>\n<td>Anneliese listet ihre gebrauchte PS5 auf Amazon für 350 €<\/td>\n<td><em>„Erklärungswille (?): da bei Amazon die Ware durch Klicken unmittelbar in den eigenen Warenkorb gelegt werden kann und die Fa. an jeden verkaufen will (+) ⇒ wirksame WE, andere Ansicht (a.A.) vertretbar\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>e4)<\/strong><\/td>\n<td>Anneliese hat einen Stand auf der Gamer-Börse, PS5 mit 350 € ausgezeichnet<\/td>\n<td><em>„Erklärungswille (?): <\/em><em>beide Ansichten vertretbar<\/em><em>, zu argumentieren ist, ob sich AB noch bezüglich des Käufers Gedanken machen wollte.\"<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Die Lehre aus c) und d):<\/strong> Beide Male fehlte subjektiv der Erklärungswille — beide Male war die WE trotzdem wirksam, weil der <strong>objektive Empfängerhorizont<\/strong> entscheidet. Genau darauf zielt der Dozent. Wenn im Fall jemand sagt „so hab ich das aber nicht gemeint\", ist das dein Signal: <strong>§§ 133, 157 prüfen.<\/strong> Der Betroffene kann sich dann nur noch über die <strong>Anfechtung<\/strong> (§ 119) lösen.<\/p>\n<p><strong>Die Lehre aus e1)–e4):<\/strong> Der Dozent akzeptiert ausdrücklich <strong>beide Ansichten<\/strong>, solange du argumentierst. Er schreibt zweimal „a.A. vertretbar\". In der Klausur gilt: <strong>Argumentation &gt; richtiges Ergebnis.<\/strong><\/p>","text":"Worum es hier geht — in einfachen Worten Die Willenserklärung ist der kleinste Baustein des gesamten Zivilrechts. Ein Vertrag besteht aus genau zwei davon : einer von dir, einer vom anderen. Deshalb fängt fast jede Fallprüfung hier an. Wenn du verstanden hast, was eine Willenserklärung ist und wann sie gilt, hast du den größten Teil des Stoffs verstanden. In diesem Kapitel steht auch die eine Definition, die du wirklich Wort für Wort auswendig können musst . Folie 8 (Original): „Nukleus/Grundbaustein zur Erzeugung von Rechtsfolgen ist die WILLENSERKLÄRUNG – Auf einen rechtlichen Erfolg gerichtete menschliche Willensäußerung – Erklärung: ausdrücklich oder konkludent (durch schlüssiges Verhalten)\" Diese Definition musst du wörtlich können. Sie ist der meistgebrauchte Satz der ganzen Klausur. 4.1 Die Bestandteile (Folie 9, Original) „● „Menschliche Willensäußerung\" : Handlungs- und Erklärungswille – Auszulegen nach §§ 133, 157 bei Verträgen vom (obj.) Empfängerhorizont – Handlungswille (willensgetragenes Verhalten; Gegenteil: „Reflex\"): „ich will etwas tun (oder unterlassen)\" + Erklärungswille (Bewusstsein, etwas rechtlich Erhebliches zu tun): „ich kann u. will EINEN Rechtserfolg erreichen\" + Geschäftswille : „ich strebe DIESEN Rechtserfolg an\" – Erklärung: ausdrücklich od. konkludent (durch schlüssiges Verhalten: äußerer Anhaltspunkt + entspr. Interessenlage ), mit Wissen und Wollen – Rechtsbindungswille : Ich will mich jetzt genau an die angestrebte Rechtsfolge binden\" Die vier Willen — mit Alltagsbeispielen Denk an eine Auktion. Der Auktionator ruft „25.000 Euro zum Ersten…\" Wille Bedeutung Du hebst die Hand, weil … Liegt vor? Handlungswille „Ich will überhaupt etwas tun\" … du sie bewusst hebst ✓ Gegenteil: Reflex … dich jemand am Arm stößt / du niest ✗ Erklärungswille (= Erklärungsbewusstsein) „Ich will irgendeinen Rechtserfolg\" … du weißt, dass Handheben hier ein Gebot ist ✓ … du einem Freund winkst ✗ Geschäftswille „Ich will genau diesen Rechtserfolg\" … du genau dieses Bild für genau 25.000 willst ✓ … du dachtest, es geht um Los Nr. 4 ✗ (→ Irrtum, Kap. 11) Rechtsbindungswille „Ich will mich jetzt binden\" … du kaufen und nicht nur plaudern willst ✓ Dieselben vier Willen nochmal ganz langsam — im Restaurant: Du hebst die Hand , um die Kellnerin zu rufen. - Du wolltest die Hand heben → Handlungswille ✓ - Wolltest du damit etwas rechtlich Verbindliches? Nein, nur Aufmerksamkeit → Erklärungswille ✗ - Ergebnis: keine Willenserklärung. Du hast nichts bestellt. Du sagst: „Einmal die Pizza Margherita, bitte.\" - Du wolltest sprechen → Handlungswille ✓ - Dir ist klar, dass du damit bestellst und danach zahlen musst → Erklärungswille ✓ - Du willst genau die Margherita, nicht die Salami → Geschäftswille ✓ - Du meinst es ernst, es ist kein Witz → Rechtsbindungswille ✓ - Ergebnis: Willenserklärung. Der Vertrag kommt zustande. Was passiert, wenn ein Wille fehlt? Handlungswille fehlt → keine WE. Punkt. Ein Reflex ist rechtlich ein Nichts. Erklärungswille fehlt → Hier wird es interessant. Objektiv kann trotzdem eine WE vorliegen, wenn ein vernünftiger Empfänger das als Erklärung verstehen durfte (§§ 133, 157). Dann ist sie aber anfechtbar (§ 119 I, Kap. 11). Geschäftswille fehlt → WE liegt vor, ist aber anfechtbar (§ 119 I, Inhalts- oder Erklärungsirrtum). Rechtsbindungswille fehlt → keine WE, sondern nur eine unverbindliche Gefälligkeit . 4.2 Ausdrücklich oder konkludent Ausdrücklich: „Ich kaufe das Fahrrad für 50 Euro.\" Gesprochen, geschrieben, per WhatsApp. Konkludent (= durch schlüssiges Verhalten): Du legst die Cola aufs Kassenband. Du steigst in die Bahn. Du nickst. Die Folie nennt für konkludent zwei Voraussetzungen : 1. äußerer Anhaltspunkt (irgendetwas Sichtbares muss passieren) und 2. entsprechende Interessenlage (das Verhalten muss sinnvoll nur so deutbar sein). Beispiel: Du gehst in die Bäckerei, zeigst auf ein Brötchen, legst 60 Cent hin. Kein Wort gesprochen — aber äußerer Anhaltspunkt (Zeigen + Geld) + Interessenlage (was sollte das sonst sein?) = wirksames Angebot. Schweigen ist im Zivilrecht grundsätzlich KEINE Willenserklärung. Wenn dir jemand schreibt „Wenn Sie nicht widersprechen, gilt der Vertrag als geschlossen\" — das funktioniert nicht. (Ausnahme im Handelsrecht: kaufmännisches Bestätigungsschreiben. Nicht klausurrelevant bei euch.) 4.3 Auslegung §§ 133, 157 — objektiver Empfängerhorizont Das ist das wichtigste Werkzeug der ganzen Vorlesung. Es taucht in fast jedem Übungsfall auf. § 133: Der wirkliche Wille zählt, nicht der Wortlaut. § 157: Verträge sind nach Treu und Glauben mit Rücksicht auf die Verkehrssitte auszulegen. Zusammen ergibt das den objektiven Empfängerhorizont : Entscheidend ist nicht, was der Erklärende dachte , und auch nicht, was der Empfänger zufällig verstanden hat — sondern was ein verständiger, objektiver Dritter in der Position des Empfängers verstehen durfte. Ein Beispiel, das jeder kennt: Du schreibst deinem Vermieter: „Ich bin zum 30.9. raus.\" Du meinst: erstmal nur eine Info, du suchst ja noch. Der Vermieter liest: Kündigung . Und weil jeder vernünftige Mensch in seiner Lage das genau so verstehen darf, ist es eine Kündigung — auch wenn du innerlich etwas anderes gemeint hast. Merke: Nicht was du dachtest zählt, sondern was der andere verstehen durfte. Das ist übrigens der Grund, warum es die Anfechtung überhaupt gibt (Kapitel 11). Sie ist der Notausgang für genau solche Fälle. Alltagsbeispiel: Du schreibst deinem Vermieter „Ich möchte zum 30.9. raus.\" Du denkst dabei „das ist erstmal nur eine Info\". Ein objektiver Vermieter versteht: Kündigung. → Es ist eine Kündigung. 4.4 Abgrenzung: WE vs. Gefälligkeit vs. Realakt Was Beispiel Rechtsfolge Willenserklärung auf Rechtserfolg gerichtet „Ich verkaufe dir das Rad für 50 €\" Rechtsgeschäft entsteht Gefälligkeit kein Rechtsbindungswille „Wollen wir heute Abend ins Kino?\" Nichts. Kein Anspruch. Realakt Rechtsfolge tritt ein, ohne dass jemand sie will Verbinden zweier Sachen, Fund, Herstellung eines Werks Gesetz knüpft an, unabhängig vom Willen Realakte sind bei euch nicht Schwerpunkt, aber der Begriff steht auf Folie 7 („Erklärungen und Realakte \"). Merke: Ein 5-Jähriger kann keinen Vertrag schließen (§ 105), aber er kann durch Malen ein Urheberrecht erwerben — dafür braucht es keine Geschäftsfähigkeit. 4.5 Beispiele aus deinen Übungsfällen (Fall 01) Das ist die Fallsammlung zur WE. Der Dozent prüft hier immer nach demselben Muster: Handlungswille (+/-), Erklärungswille (+/-) ⇒ Ergebnis . Fall Sachverhalt Lösung des Dozenten (Original) a) Denny zu Nancy: „Wollen wir heute Abend ins Gibson's gehen?\" „Handlungswille (+), Erklärungswille (-): keine rechtlich erhebliche Folge angestrebt ⇒ keine wirksame WE\" b) Anneliese bittet Nachbarn Jimmy, im Urlaub die Zimmerpflanzen zu gießen „Handlungswille (+); Erklärungswille (-) … ⇒ keine wirksame WE — anders ggfs. wenn die Pflanzen einen besonderen Wert haben und J dies erkennen konnte (§§ 133, 157 Auslegung vom Empfängerhorizont)\" c) ★ Denny winkt im Auktionsraum seinem Freund zu — der Auktionator schlägt zu: 10 Fuder Wein für 45.400 € „Handlungswille (+), Erklärungswille (?), subjektiv aus der Sicht von D (-), jedoch nach Auslegung vom obj. Empfängerhorizont (+) ⇒ wirksame WE \" d) ★ Anneliese legt die vorbereitete Kündigung auf den Tisch, Lebensgefährte Denny wirft sie ein „Handlungswille (+ bezüglich Verfassens der Kündigung), Erklärungswille (?): A wollte ihre Erklärung nur vorbereiten und hat sie nicht mit Wissen und Wollen abgegeben, subjektiv (-), jedoch nach Auslegung vom obj. Empfängerhorizont (+) ⇒ wirksame WE \" e1) Media Markt plakatiert „Schnell-Spar-Tage, PS5 Pro 649 €\" „Handlungswille (+), Erklärungswille (-), da noch kein unmittelbarer Geschäftserfolg angestrebt, sondern lediglich vorbereitet ⇒ keine WE\" → das ist die invitatio ad offerendum , Kap. 9 e2) Media Markt schickt Anneliese ungefragt eine PS5 mit Rechnung „Handlungswille (+), Erklärungswille (+), Erklärung (+) durch konkludentes Verhalten „Zuschicken\", AB muss nur noch zugreifen ⇒ wirksame WE , allerdings kein Vertragsschluss wegen § 241a \" e3) Anneliese listet ihre gebrauchte PS5 auf Amazon für 350 € „Erklärungswille (?): da bei Amazon die Ware durch Klicken unmittelbar in den eigenen Warenkorb gelegt werden kann und die Fa. an jeden verkaufen will (+) ⇒ wirksame WE, andere Ansicht (a.A.) vertretbar\" e4) Anneliese hat einen Stand auf der Gamer-Börse, PS5 mit 350 € ausgezeichnet „Erklärungswille (?): beide Ansichten vertretbar , zu argumentieren ist, ob sich AB noch bezüglich des Käufers Gedanken machen wollte.\" Die Lehre aus c) und d): Beide Male fehlte subjektiv der Erklärungswille — beide Male war die WE trotzdem wirksam, weil der objektive Empfängerhorizont entscheidet. Genau darauf zielt der Dozent. Wenn im Fall jemand sagt „so hab ich das aber nicht gemeint\", ist das dein Signal: §§ 133, 157 prüfen. Der Betroffene kann sich dann nur noch über die Anfechtung (§ 119) lösen. Die Lehre aus e1)–e4): Der Dozent akzeptiert ausdrücklich beide Ansichten , solange du argumentierst. Er schreibt zweimal „a.A. vertretbar\". In der Klausur gilt: Argumentation > richtiges Ergebnis.","words":1369,"mins":7},{"id":"r-5-wirksamwerden-durch-zugang","subject":"recht","num":"5","title":"5. Wirksamwerden durch Zugang","short":"Wirksamwerden durch Zugang","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nDu hast etwas gesagt oder geschrieben — <strong>ab wann gilt es?<\/strong><\/p>\n<p>Antwort: nicht, wenn du es abschickst, sondern wenn es beim anderen ankommt. Dieses Kapitel klärt, wann genau „angekommen\" ist.<\/p>\n<p>Klingt banal, entscheidet aber ganze Fälle. Ob deine Kündigung noch fristgerecht war, hängt an genau dieser Frage.<\/p>\n<\/blockquote>\n<p>Eine WE existiert erst rechtlich, wenn sie <strong>abgegeben<\/strong> wurde und (bei empfangsbedürftigen WE) <strong>zugegangen<\/strong> ist. Das ist die zweite Prüfungsstufe nach Kapitel 4.<\/p>\n<h3 id=\"r-51-empfangsbedurftig-oder-nicht-folie-9\">5.1 Empfangsbedürftig oder nicht? (Folie 9)<\/h3>\n<blockquote>\n<p>„● Wirksamwerden durch Zugang\n– <strong>Empfangsbedürftigkeit?<\/strong> (§§ 130, 151)\n– Zugang ggü. dem Erklärungsempfänger: Einseitig/zweiseitig/mehrseitig\n– <strong>Zugang ggü Anwesenden (§ 147)<\/strong>, auch Telefon (Abs. 1, Satz 2), Videokonferenz: Aussprechen, Übergeben\"<\/p>\n<\/blockquote>\n<ul>\n<li><strong>Empfangsbedürftig<\/strong> (der Normalfall): Angebot, Annahme, Kündigung, Anfechtung, Widerruf, Mahnung. Sie wirken erst mit Zugang.<\/li>\n<li><strong>Nicht empfangsbedürftig<\/strong> (selten): Testament, Auslobung. Wirken sofort.<\/li>\n<\/ul>\n<h3 id=\"r-52-zugang-unter-anwesenden-147\">5.2 Zugang unter Anwesenden — § 147<\/h3>\n<p>Persönliches Gespräch, <strong>Telefon<\/strong> (§ 147 I S. 2!) und Videokonferenz zählen als „unter Anwesenden\". Der Zugang erfolgt <strong>sofort<\/strong> mit dem Aussprechen bzw. Übergeben.<\/p>\n<h3 id=\"r-53-zugang-unter-abwesenden-130-i-das-herzstuck\">5.3 Zugang unter Abwesenden — § 130 I (das Herzstück)<\/h3>\n<p><strong>Folie 10 (Original, wörtlich):<\/strong><\/p>\n<blockquote>\n<p>„– Zugang ggü. Abwesenden (§ 130): Brief, eMail, Txtmsg, durch Dritte (Erklärungs-, Empfangsbote, Vertretung), öffentliche Zustellung (§ 132)\n– <strong>Abwesenden geht eine Erklärung zu, wenn sie so in den Machtbereich gelangt, dass eine Kenntnisnahme möglich ist und unter normalen Umständen „nach der Verkehrsanschauung\" damit gerechnet werden kann.<\/strong>\n– <strong>der Zugangszeitpunkt richtet sich rechtlich allein nach der Üblichkeit der Kenntnisnahme, nicht nach dem tatsächlichen Vorgang<\/strong>\n– wer den Zugang einer Erklärung gegen sich vereitelt, muss sich so behandeln lassen, als sei der Zugang ohne das Hindernis erfolgt (<strong>§ 162 I analog<\/strong>)\n– tritt ein anderes Zugangshindernis auf, ist darauf abzustellen, <strong>in wessen Sphäre<\/strong> (Erklärende oder Empfangende) das Hindernis entstanden ist, insbesondere auch bei Überbringen durch Dritte (Zustellung durch Erklärungsbote bzw. durch Empfangsbote)\"<\/p>\n<\/blockquote>\n<h3 id=\"r-die-zugangs-definition-auswendig\">Die Zugangs-Definition (auswendig!)<\/h3>\n<blockquote>\n<p><strong>Zugegangen ist eine WE, wenn sie so in den Machtbereich des Empfängers gelangt ist, dass unter normalen Umständen mit einer Kenntnisnahme gerechnet werden kann.<\/strong><\/p>\n<\/blockquote>\n<p>Zwei Voraussetzungen:\n1. <strong>Machtbereich<\/strong> — der Briefkasten, das E-Mail-Postfach, die Hand.\n2. <strong>Möglichkeit + Üblichkeit der Kenntnisnahme<\/strong> — nach der Verkehrsanschauung.<\/p>\n<h3 id=\"r-der-wichtigste-satz-des-ganzen-kapitels\">Der wichtigste Satz des ganzen Kapitels<\/h3>\n<blockquote>\n<p><strong>Es kommt NICHT auf die tatsächliche Kenntnisnahme an, sondern auf die übliche.<\/strong><\/p>\n<\/blockquote>\n<p>Das ist die Falle, in die alle tappen. Wenn der Empfänger den Brief drei Wochen liegen lässt, ist er trotzdem am Tag nach Einwurf zugegangen. Und umgekehrt: Wenn er die Mail um 21:01 Uhr liest, ist sie trotzdem erst am nächsten Tag zugegangen.<\/p>\n<p><strong>Denk an deinen Briefkasten im Hausflur.<\/strong> Sobald der Brief drin liegt und du ihn holen <em>könntest<\/em>, ist er zugegangen.<\/p>\n<p>Ob du zwei Wochen im Urlaub bist, ob du nie nach unten gehst, ob du den Brief siehst und liegen lässt — dem Recht ist das alles egal. Es zählt der Moment, <strong>in dem ein normaler Mensch reingeschaut hätte<\/strong>.<\/p>\n<p>Das klingt hart, ist aber logisch. Sonst könnte jeder jede Kündigung und jede Mahnung dadurch aushebeln, dass er einfach nicht in den Briefkasten schaut.<\/p>\n<h3 id=\"r-die-faustregeln-fur-die-klausur\">Die Faustregeln für die Klausur<\/h3>\n<table>\n<thead>\n<tr>\n<th>Übermittlungsweg<\/th>\n<th>Zugang wann?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Persönliches Gespräch, Telefon, Videocall<\/td>\n<td><strong>sofort<\/strong> (§ 147 I 2)<\/td>\n<\/tr>\n<tr>\n<td>Brief in den Briefkasten, morgens/mittags<\/td>\n<td>am <strong>selben Tag<\/strong> (nach der üblichen Leerungszeit)<\/td>\n<\/tr>\n<tr>\n<td>Brief in den Briefkasten, abends/nachts<\/td>\n<td>am <strong>Folgetag<\/strong><\/td>\n<\/tr>\n<tr>\n<td>E-Mail während der üblichen Geschäftszeit<\/td>\n<td><strong>sofort/am selben Tag<\/strong><\/td>\n<\/tr>\n<tr>\n<td>E-Mail abends (21 Uhr) an Privatperson<\/td>\n<td><strong>am Folgetag<\/strong> — „mit einem Lesen einer eMail um 21 Uhr kann üblicherweise nicht gerechnet werden\"<\/td>\n<\/tr>\n<tr>\n<td>E-Mail abends ins <strong>Geschäfts<\/strong>-Postfach<\/td>\n<td>am <strong>Vormittag des Folgetages<\/strong> (Fall 02f)<\/td>\n<\/tr>\n<tr>\n<td>Übergabe an <strong>Erklärungsboten<\/strong> (Bote des Absenders)<\/td>\n<td>erst wenn der Bote sie tatsächlich abliefert<\/td>\n<\/tr>\n<tr>\n<td>Übergabe an <strong>Empfangsboten<\/strong> (Person des Empfängers)<\/td>\n<td><strong>sofort<\/strong> mit Übergabe an den Boten<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"r-54-erklarungsbote-vs-empfangsbote-die-spharentheorie\">5.4 Erklärungsbote vs. Empfangsbote — die Sphärentheorie<\/h3>\n<p>Das ist der Teil, den der Dozent in Fall 02e systematisch durchspielt. Der Grundgedanke:<\/p>\n<blockquote>\n<p><strong>Wer den Boten aussucht, trägt das Risiko.<\/strong><\/p>\n<\/blockquote>\n<ul>\n<li><strong>Erklärungsbote<\/strong> = der Bote des <strong>Absenders<\/strong>. Er steht in der Sphäre des Erklärenden. Verzögert er, geht das zulasten des Absenders — Zugang erst bei tatsächlicher Ablieferung.<\/li>\n<li><strong>Empfangsbote<\/strong> = eine Person, die nach der Verkehrsanschauung <strong>befugt ist, für den Empfänger Erklärungen entgegenzunehmen<\/strong>. Sie steht in der Sphäre des Empfängers. Zugang erfolgt sofort mit Übergabe an sie (plus übliche Weiterleitungszeit).<\/li>\n<\/ul>\n<p><strong>Wer ist Empfangsbote?<\/strong> (aus den Musterlösungen)<\/p>\n<table>\n<thead>\n<tr>\n<th>Person<\/th>\n<th>Empfangsbote?<\/th>\n<th>Begründung des Dozenten<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Mitbewohner in derselben Wohnung<\/strong><\/td>\n<td>✓ ja<\/td>\n<td><em>„gilt nach der Verkehrsanschauung als befugt, für den Empfänger Erklärungen entgegenzunehmen\"<\/em><\/td>\n<\/tr>\n<tr>\n<td>Ehepartner, erwachsene Familienangehörige<\/td>\n<td>✓ ja<\/td>\n<td>gleicher Gedanke<\/td>\n<\/tr>\n<tr>\n<td>Angestellte im Geschäftsbetrieb<\/td>\n<td>✓ ja<\/td>\n<td>Fall 02f<\/td>\n<\/tr>\n<tr>\n<td><strong>Nachbarin<\/strong><\/td>\n<td>✗ nein<\/td>\n<td><em>„gilt normalerweise nicht als befugt … Daher liegt das Störungsereignis durch die fehlerhafte Auswahl der Übergabeperson in der Sphäre der Erklärenden\"<\/em><\/td>\n<\/tr>\n<tr>\n<td><strong>10-jähriges Kind<\/strong><\/td>\n<td>✗ nein<\/td>\n<td><em>„gilt nicht als dafür vorgesehen, Willenserklärungen für einen Dritten entgegenzunehmen (fehlerhafte Auswahl)\"<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Alltagsbeispiel:<\/strong> Deine Kündigung soll fristgerecht am 30. ankommen. Du gibst sie am 29. deiner Nachbarin mit. Die vergisst es und wirft sie am 3. ein. → <strong>Deine Schuld.<\/strong> Du hast die falsche Person ausgesucht. Fristversäumnis.\nHättest du sie am 29. dem Mitbewohner des Vermieters gegeben → <strong>Zugang am 29.<\/strong> Alles gut, auch wenn der Mitbewohner drei Tage schläft.<\/p>\n<h3 id=\"r-55-zugangsvereitelung-162-i-analog\">5.5 Zugangsvereitelung — § 162 I analog<\/h3>\n<p>Wenn jemand den Zugang <strong>treuwidrig verhindert<\/strong>, wird er so behandelt, als sei zugegangen.<\/p>\n<p><strong>Klassiker aus Fall 02b:<\/strong> Denny hat gar keinen Briefkasten.<\/p>\n<blockquote>\n<p><em>„Machtbereich (-), allerdings liegt das Zugangshindernis in der Sphäre des Empfängers. Daher muss er sich so behandeln lassen, als habe das Zugangshindernis nicht bestanden, § 162 I analog.\"<\/em><\/p>\n<\/blockquote>\n<p>Weitere Beispiele: Annahme verweigern, Briefkasten zukleben, nach Kündigungsankündigung „verreisen\".<\/p>\n<p><strong>Beispiel:<\/strong> Jemand ahnt, dass eine Kündigung kommt, und klebt seinen Briefkasten zu. Oder er sieht den Postboten mit dem Einschreiben und verweigert die Annahme.<\/p>\n<p>Damit kommt er nicht durch. Er wird behandelt, <strong>als hätte er den Brief bekommen<\/strong>. Wer sich absichtlich taub stellt, gilt als gehört.<\/p>\n<h3 id=\"r-56-widerruf-130-i-s-2\">5.6 Widerruf — § 130 I S. 2<\/h3>\n<blockquote>\n<p>Eine WE wird <strong>nicht wirksam<\/strong>, wenn dem Empfänger vorher oder <strong>gleichzeitig<\/strong> ein Widerruf zugeht.<\/p>\n<\/blockquote>\n<p><strong>Wichtig:<\/strong> Das ist der Widerruf <em>der Willenserklärung selbst<\/em> — nicht das Verbraucher-Widerrufsrecht (Kap. 12). Sobald die WE zugegangen ist, ist dieses Fenster zu.<\/p>\n<p><strong>Das ist genau der Punkt in Fall 02d:<\/strong> Angebot per Mail um 21:00, Widerruf per Mail um 22:00. Beide gehen erst am Folgetag zu → <strong>gleichzeitig<\/strong> → das Angebot wird nie wirksam. Der Dozent hat diesen Fall komplett im Gutachtenstil ausformuliert (siehe Kap. 3.3), weil er ihn für das perfekte Übungsbeispiel hält. <strong>Lies ihn im Original durch.<\/strong><\/p>\n<h3 id=\"r-57-offentliche-zustellung-132\">5.7 Öffentliche Zustellung — § 132<\/h3>\n<p>Wenn der Empfänger unbekannt oder unauffindbar ist, gibt es die öffentliche Zustellung als Zugangsersatz. Nur den Namen merken.<\/p>\n<h3 id=\"r-beispiele-aus-deinen-ubungsfallen-fall-02\">Beispiele aus deinen Übungsfällen (Fall 02)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Fall<\/th>\n<th>Sachverhalt<\/th>\n<th>Lösung (Original, gekürzt)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a)<\/td>\n<td>Nancy ruft an, Denny hört zu<\/td>\n<td><em>„Zugang unter Anwesenden, § 147 I, S. 2 auch Telefon ⇒ Wirksamwerden sofort\"<\/em><\/td>\n<\/tr>\n<tr>\n<td>a)<\/td>\n<td>Nancy ruft an, Denny ist abgelenkt und versteht nichts<\/td>\n<td><em>„Zugang ebenfalls sofort … Das Zugangshindernis liegt in der Sphäre des Empfängers\"<\/em><\/td>\n<\/tr>\n<tr>\n<td>b)<\/td>\n<td>Brief in den Briefkasten am 06.05., liest ihn erst am 10.05. wegen Urlaub<\/td>\n<td><em>„Kein Unterschied zum Ausgangsfall, da es auf die tatsächliche Kenntnisnahme nicht ankommt, <\/em><em>selbst dann nicht, wenn die Erklärende weiß, dass im konkreten Fall nicht mit der üblichen Kenntnisnahme zu rechnen ist<\/em><em>\"<\/em><\/td>\n<\/tr>\n<tr>\n<td>c)<\/td>\n<td>E-Mail um 21:00, gelesen um 21:01<\/td>\n<td><em>„mögliche Kenntnisnahme schon dann, <\/em><em>üblich jedoch nicht schon am Abend<\/em><em>, sondern im Laufe des nächsten Tages\"<\/em><\/td>\n<\/tr>\n<tr>\n<td>c)<\/td>\n<td>E-Mail nie gelesen, weil Account gewechselt<\/td>\n<td><em>„Machtbereich? (-); … Im Normalfall ist der Empfänger verpflichtet, den Zugang von Erklärungen auch bei Adresswechsel sicherzustellen\"<\/em><\/td>\n<\/tr>\n<tr>\n<td>f)<\/td>\n<td>Brief abends ins Firmenpostfach, Angestellter liest und entsorgt ihn<\/td>\n<td><em>„Machtbereich am 04.05.; übliche Kenntnisnahme im Geschäftsbereich: am Vormittag des Folgetages.\"<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Beachte Fall b) besonders: <strong>Selbst wenn der Absender weiß, dass der Empfänger im Urlaub ist<\/strong>, ändert das nichts am Zugang. Das ist kontraintuitiv und deshalb ein perfektes Klausurdetail.<\/p>","text":"Worum es hier geht — in einfachen Worten Du hast etwas gesagt oder geschrieben — ab wann gilt es? Antwort: nicht, wenn du es abschickst, sondern wenn es beim anderen ankommt. Dieses Kapitel klärt, wann genau „angekommen\" ist. Klingt banal, entscheidet aber ganze Fälle. Ob deine Kündigung noch fristgerecht war, hängt an genau dieser Frage. Eine WE existiert erst rechtlich, wenn sie abgegeben wurde und (bei empfangsbedürftigen WE) zugegangen ist. Das ist die zweite Prüfungsstufe nach Kapitel 4. 5.1 Empfangsbedürftig oder nicht? (Folie 9) „● Wirksamwerden durch Zugang – Empfangsbedürftigkeit? (§§ 130, 151) – Zugang ggü. dem Erklärungsempfänger: Einseitig/zweiseitig/mehrseitig – Zugang ggü Anwesenden (§ 147) , auch Telefon (Abs. 1, Satz 2), Videokonferenz: Aussprechen, Übergeben\" Empfangsbedürftig (der Normalfall): Angebot, Annahme, Kündigung, Anfechtung, Widerruf, Mahnung. Sie wirken erst mit Zugang. Nicht empfangsbedürftig (selten): Testament, Auslobung. Wirken sofort. 5.2 Zugang unter Anwesenden — § 147 Persönliches Gespräch, Telefon (§ 147 I S. 2!) und Videokonferenz zählen als „unter Anwesenden\". Der Zugang erfolgt sofort mit dem Aussprechen bzw. Übergeben. 5.3 Zugang unter Abwesenden — § 130 I (das Herzstück) Folie 10 (Original, wörtlich): „– Zugang ggü. Abwesenden (§ 130): Brief, eMail, Txtmsg, durch Dritte (Erklärungs-, Empfangsbote, Vertretung), öffentliche Zustellung (§ 132) – Abwesenden geht eine Erklärung zu, wenn sie so in den Machtbereich gelangt, dass eine Kenntnisnahme möglich ist und unter normalen Umständen „nach der Verkehrsanschauung\" damit gerechnet werden kann. – der Zugangszeitpunkt richtet sich rechtlich allein nach der Üblichkeit der Kenntnisnahme, nicht nach dem tatsächlichen Vorgang – wer den Zugang einer Erklärung gegen sich vereitelt, muss sich so behandeln lassen, als sei der Zugang ohne das Hindernis erfolgt ( § 162 I analog ) – tritt ein anderes Zugangshindernis auf, ist darauf abzustellen, in wessen Sphäre (Erklärende oder Empfangende) das Hindernis entstanden ist, insbesondere auch bei Überbringen durch Dritte (Zustellung durch Erklärungsbote bzw. durch Empfangsbote)\" Die Zugangs-Definition (auswendig!) Zugegangen ist eine WE, wenn sie so in den Machtbereich des Empfängers gelangt ist, dass unter normalen Umständen mit einer Kenntnisnahme gerechnet werden kann. Zwei Voraussetzungen: 1. Machtbereich — der Briefkasten, das E-Mail-Postfach, die Hand. 2. Möglichkeit + Üblichkeit der Kenntnisnahme — nach der Verkehrsanschauung. Der wichtigste Satz des ganzen Kapitels Es kommt NICHT auf die tatsächliche Kenntnisnahme an, sondern auf die übliche. Das ist die Falle, in die alle tappen. Wenn der Empfänger den Brief drei Wochen liegen lässt, ist er trotzdem am Tag nach Einwurf zugegangen. Und umgekehrt: Wenn er die Mail um 21:01 Uhr liest, ist sie trotzdem erst am nächsten Tag zugegangen. Denk an deinen Briefkasten im Hausflur. Sobald der Brief drin liegt und du ihn holen könntest , ist er zugegangen. Ob du zwei Wochen im Urlaub bist, ob du nie nach unten gehst, ob du den Brief siehst und liegen lässt — dem Recht ist das alles egal. Es zählt der Moment, in dem ein normaler Mensch reingeschaut hätte . Das klingt hart, ist aber logisch. Sonst könnte jeder jede Kündigung und jede Mahnung dadurch aushebeln, dass er einfach nicht in den Briefkasten schaut. Die Faustregeln für die Klausur Übermittlungsweg Zugang wann? Persönliches Gespräch, Telefon, Videocall sofort (§ 147 I 2) Brief in den Briefkasten, morgens/mittags am selben Tag (nach der üblichen Leerungszeit) Brief in den Briefkasten, abends/nachts am Folgetag E-Mail während der üblichen Geschäftszeit sofort/am selben Tag E-Mail abends (21 Uhr) an Privatperson am Folgetag — „mit einem Lesen einer eMail um 21 Uhr kann üblicherweise nicht gerechnet werden\" E-Mail abends ins Geschäfts -Postfach am Vormittag des Folgetages (Fall 02f) Übergabe an Erklärungsboten (Bote des Absenders) erst wenn der Bote sie tatsächlich abliefert Übergabe an Empfangsboten (Person des Empfängers) sofort mit Übergabe an den Boten 5.4 Erklärungsbote vs. Empfangsbote — die Sphärentheorie Das ist der Teil, den der Dozent in Fall 02e systematisch durchspielt. Der Grundgedanke: Wer den Boten aussucht, trägt das Risiko. Erklärungsbote = der Bote des Absenders . Er steht in der Sphäre des Erklärenden. Verzögert er, geht das zulasten des Absenders — Zugang erst bei tatsächlicher Ablieferung. Empfangsbote = eine Person, die nach der Verkehrsanschauung befugt ist, für den Empfänger Erklärungen entgegenzunehmen . Sie steht in der Sphäre des Empfängers. Zugang erfolgt sofort mit Übergabe an sie (plus übliche Weiterleitungszeit). Wer ist Empfangsbote? (aus den Musterlösungen) Person Empfangsbote? Begründung des Dozenten Mitbewohner in derselben Wohnung ✓ ja „gilt nach der Verkehrsanschauung als befugt, für den Empfänger Erklärungen entgegenzunehmen\" Ehepartner, erwachsene Familienangehörige ✓ ja gleicher Gedanke Angestellte im Geschäftsbetrieb ✓ ja Fall 02f Nachbarin ✗ nein „gilt normalerweise nicht als befugt … Daher liegt das Störungsereignis durch die fehlerhafte Auswahl der Übergabeperson in der Sphäre der Erklärenden\" 10-jähriges Kind ✗ nein „gilt nicht als dafür vorgesehen, Willenserklärungen für einen Dritten entgegenzunehmen (fehlerhafte Auswahl)\" Alltagsbeispiel: Deine Kündigung soll fristgerecht am 30. ankommen. Du gibst sie am 29. deiner Nachbarin mit. Die vergisst es und wirft sie am 3. ein. → Deine Schuld. Du hast die falsche Person ausgesucht. Fristversäumnis. Hättest du sie am 29. dem Mitbewohner des Vermieters gegeben → Zugang am 29. Alles gut, auch wenn der Mitbewohner drei Tage schläft. 5.5 Zugangsvereitelung — § 162 I analog Wenn jemand den Zugang treuwidrig verhindert , wird er so behandelt, als sei zugegangen. Klassiker aus Fall 02b: Denny hat gar keinen Briefkasten. „Machtbereich (-), allerdings liegt das Zugangshindernis in der Sphäre des Empfängers. Daher muss er sich so behandeln lassen, als habe das Zugangshindernis nicht bestanden, § 162 I analog.\" Weitere Beispiele: Annahme verweigern, Briefkasten zukleben, nach Kündigungsankündigung „verreisen\". Beispiel: Jemand ahnt, dass eine Kündigung kommt, und klebt seinen Briefkasten zu. Oder er sieht den Postboten mit dem Einschreiben und verweigert die Annahme. Damit kommt er nicht durch. Er wird behandelt, als hätte er den Brief bekommen . Wer sich absichtlich taub stellt, gilt als gehört. 5.6 Widerruf — § 130 I S. 2 Eine WE wird nicht wirksam , wenn dem Empfänger vorher oder gleichzeitig ein Widerruf zugeht. Wichtig: Das ist der Widerruf der Willenserklärung selbst — nicht das Verbraucher-Widerrufsrecht (Kap. 12). Sobald die WE zugegangen ist, ist dieses Fenster zu. Das ist genau der Punkt in Fall 02d: Angebot per Mail um 21:00, Widerruf per Mail um 22:00. Beide gehen erst am Folgetag zu → gleichzeitig → das Angebot wird nie wirksam. Der Dozent hat diesen Fall komplett im Gutachtenstil ausformuliert (siehe Kap. 3.3), weil er ihn für das perfekte Übungsbeispiel hält. Lies ihn im Original durch. 5.7 Öffentliche Zustellung — § 132 Wenn der Empfänger unbekannt oder unauffindbar ist, gibt es die öffentliche Zustellung als Zugangsersatz. Nur den Namen merken. Beispiele aus deinen Übungsfällen (Fall 02) Fall Sachverhalt Lösung (Original, gekürzt) a) Nancy ruft an, Denny hört zu „Zugang unter Anwesenden, § 147 I, S. 2 auch Telefon ⇒ Wirksamwerden sofort\" a) Nancy ruft an, Denny ist abgelenkt und versteht nichts „Zugang ebenfalls sofort … Das Zugangshindernis liegt in der Sphäre des Empfängers\" b) Brief in den Briefkasten am 06.05., liest ihn erst am 10.05. wegen Urlaub „Kein Unterschied zum Ausgangsfall, da es auf die tatsächliche Kenntnisnahme nicht ankommt, selbst dann nicht, wenn die Erklärende weiß, dass im konkreten Fall nicht mit der üblichen Kenntnisnahme zu rechnen ist \" c) E-Mail um 21:00, gelesen um 21:01 „mögliche Kenntnisnahme schon dann, üblich jedoch nicht schon am Abend , sondern im Laufe des nächsten Tages\" c) E-Mail nie gelesen, weil Account gewechselt „Machtbereich? (-); … Im Normalfall ist der Empfänger verpflichtet, den Zugang von Erklärungen auch bei Adresswechsel sicherzustellen\" f) Brief abends ins Firmenpostfach, Angestellter liest und entsorgt ihn „Machtbereich am 04.05.; übliche Kenntnisnahme im Geschäftsbereich: am Vormittag des Folgetages.\" Beachte Fall b) besonders: Selbst wenn der Absender weiß, dass der Empfänger im Urlaub ist , ändert das nichts am Zugang. Das ist kontraintuitiv und deshalb ein perfektes Klausurdetail.","words":1264,"mins":7},{"id":"r-6-geschäftsfähigkeit--minderjährigenrecht","subject":"recht","num":"6","title":"6. Geschäftsfähigkeit / Minderjährigenrecht","short":"Geschäftsfähigkeit / Minderjährigenrecht","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nKinder und Jugendliche sollen sich nicht ruinieren können. Deshalb gelten ihre Verträge nur eingeschränkt.<\/p>\n<p>Dieses Kapitel sagt dir, ab wann jemand wirksam etwas kaufen kann — und was passiert, wenn ein 15-Jähriger ein Abo abschließt.<\/p>\n<p><strong>Rechne fest damit, dass das drankommt.<\/strong> Der Dozent hat eine eigene Fallsammlung dazu gemacht, und in seinem Bewertungsschema stehen 15 Punkte allein für die §§ 433, 108, 110.<\/p>\n<\/blockquote>\n<p>Das ist <strong>der Lieblingsstoff des Dozenten<\/strong>. Es gibt eine eigene Fallsammlung (03), der EA-Sports-Fall taucht <strong>zweimal<\/strong> als „Übungsklausur\" auf (in 03f und 04), und im Original-Bewertungsschema stehen 15 Punkte für „Prüfung §§ 433, 108, 110\". Rechne fest damit.<\/p>\n<h3 id=\"r-61-der-grundgedanke-folie-13-original\">6.1 Der Grundgedanke (Folie 13, Original)<\/h3>\n<blockquote>\n<p>„● <strong>Formale Unwirksamkeit durch eingeschränkte Geschäftsfähigkeit / Minderjährigenrecht<\/strong>\n<strong>Grundsatz. Die Rechtsordnung schützt die Schutzbedürftigen vor Rechtsfolgen, die sie nicht übersehen können<\/strong>, durch\n– Nichtigkeit von WE, die ein Geschäftsunfähiger abgibt, <strong>§§ 105, 104 Nr. 1 u. 2<\/strong> ⇒ keine Rechtsfolgen\n– <strong>„Schwebende Unwirksamkeit\"<\/strong> von WE, die ein vermindert Geschäftsfähiger ohne Einwilligung der gesetzlichen Vertretung abgibt, <strong>§§ 106 ff<\/strong>\nAusnahmen: <strong>lediglich rechtlicher Vorteil<\/strong> (Beachte: <strong>Abstraktionsprinzip!<\/strong>), <strong>„Taschengeldparagraf\" § 110<\/strong>, eigenes Erwerbsgeschäft, <strong>§ 112<\/strong>, Dienst- oder Arbeitsverhältnis, <strong>§ 113<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"r-62-die-drei-stufen\">6.2 Die drei Stufen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Alter<\/th>\n<th>Status<\/th>\n<th>§<\/th>\n<th>Rechtsfolge der WE<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>0–6<\/strong><\/td>\n<td>geschäftsunfähig<\/td>\n<td>§ 104 Nr. 1<\/td>\n<td><strong>nichtig<\/strong>, § 105 — passiert einfach nichts<\/td>\n<\/tr>\n<tr>\n<td><strong>7–17<\/strong><\/td>\n<td>beschränkt geschäftsfähig<\/td>\n<td>§ 106<\/td>\n<td><strong>schwebend unwirksam<\/strong>, § 108 I — hängt in der Luft<\/td>\n<\/tr>\n<tr>\n<td><strong>ab 18<\/strong><\/td>\n<td>voll geschäftsfähig<\/td>\n<td>–<\/td>\n<td>wirksam<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Zusätzlich <strong>§ 104 Nr. 2<\/strong>: dauerhafte krankhafte Störung der Geistestätigkeit → ebenfalls geschäftsunfähig, unabhängig vom Alter.<\/p>\n<p><strong>Fristberechnung § 187 II:<\/strong> Mit dem <strong>Geburtstag selbst<\/strong> ist das Lebensjahr vollendet. Am 7. Geburtstag ist man also bereits beschränkt geschäftsfähig — nicht erst am Tag danach. Genau das prüft Fall 03c.<\/p>\n<p><strong>Die drei Stufen als Bild:<\/strong><\/p>\n<p>Ein <strong>Sechsjähriger<\/strong> ist wie jemand, dessen Unterschrift schlicht nicht zählt. Er kann unterschreiben, was er will — rechtlich passiert <strong>nichts<\/strong>. Der Vertrag ist von vornherein tot.<\/p>\n<p>Ein <strong>Zwölfjähriger<\/strong> ist wie jemand, dessen Unterschrift erstmal <strong>in der Schwebe<\/strong> hängt. Sagen die Eltern hinterher „ja, passt\", gilt der Vertrag — und zwar rückwirkend, als hätte er von Anfang an gegolten. Sagen sie „nein\", war er nie da.<\/p>\n<p>Ein <strong>Achtzehnjähriger<\/strong> unterschreibt, und es gilt sofort.<\/p>\n<p>Dahinter steckt nur ein einziger Gedanke: <strong>Kinder sollen vor Folgen geschützt werden, die sie nicht überblicken.<\/strong> Wenn du in der Klausur unsicher bist, frag dich immer: Wird das Kind hier geschützt oder nicht?<\/p>\n<h3 id=\"r-63-107-lediglich-rechtlicher-vorteil\">6.3 § 107 — „lediglich rechtlicher Vorteil\"<\/h3>\n<p>Der Minderjährige braucht <strong>keine<\/strong> Einwilligung, wenn das Geschäft ihm <strong>lediglich einen rechtlichen Vorteil<\/strong> bringt.<\/p>\n<p><strong>Die entscheidende Falle — merk dir das wörtlich:<\/strong><\/p>\n<blockquote>\n<p><strong>„Rechtlich\" ≠ „wirtschaftlich\".<\/strong> Sobald der Minderjährige <em>irgendeine<\/em> Pflicht übernimmt, ist es ein rechtlicher Nachteil — auch wenn das Geschäft ein Superdeal ist.<\/p>\n<\/blockquote>\n<p>Der Dozent formuliert es in Fall 03e so:<\/p>\n<blockquote>\n<p><em>„Lediglich rechtlicher Vorteil? Zwar <\/em><em>wirtschaftlicher<\/em><em> Vorteil, aber <\/em><em>Pflicht zur Gegenleistung, daher rechtlicher Nachteil<\/em><em> ⇒ (-)\"<\/em><\/p>\n<\/blockquote>\n<table>\n<thead>\n<tr>\n<th>Geschäft<\/th>\n<th>Lediglich rechtl. Vorteil?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Oma schenkt dem 10-Jährigen 500 € (reine Schenkung)<\/td>\n<td>✓ ja — er bekommt nur, muss nichts<\/td>\n<\/tr>\n<tr>\n<td>Der 16-Jährige kauft ein Moped für 550 €, das 750 € wert ist<\/td>\n<td>✗ <strong>nein<\/strong> — er muss zahlen<\/td>\n<\/tr>\n<tr>\n<td>Der 16-Jährige <strong>bekommt<\/strong> das Moped übereignet (§ 929)<\/td>\n<td>✓ <strong>ja<\/strong> — der Eigentumserwerb allein ist reiner Vorteil<\/td>\n<\/tr>\n<tr>\n<td>Schenkung eines Grundstücks (mit Grundsteuerpflicht)<\/td>\n<td>✗ nein — Lasten hängen dran<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Die vorletzte Zeile ist der Punkt, an dem das <strong>Abstraktionsprinzip<\/strong> ins Spiel kommt — siehe Kapitel 7. Die Folie 13 sagt es selbst: <em>„lediglich rechtlicher Vorteil (<\/em><em>Beachte: Abstraktionsprinzip!<\/em><em>)\"<\/em>.<\/p>\n<h3 id=\"r-64-108-schwebende-unwirksamkeit\">6.4 § 108 — Schwebende Unwirksamkeit<\/h3>\n<p><strong>Folie 15 (Original):<\/strong><\/p>\n<blockquote>\n<p>„⇒Rechtsfolge, sofern keine Wirksamkeit nach obigen Vorschriften: <strong>„Schwebende Unwirksamkeit, § 108 I\"<\/strong>\n– Durch die WE eines beschränkt Geschäftsfähigen ohne Einwilligung des Vertreters hängt die WE und damit der Vertragsschluss <strong>„in der Luft\"<\/strong> und entfaltet keine Rechtswirkungen\n– Der Schwebezustand endet durch die <strong>Genehmigung<\/strong> des gesetzlichen Vertreters oder deren <strong>Verweigerung<\/strong>, § 108 I. <strong>Mit Genehmigung wird die WE von Anfang an wirksam. Eine Frist sieht das Gesetz nicht vor.<\/strong>\n– Der Vertragspartner hat es in der Hand, den Schwebezustand zu beenden, <strong>§ 108 II<\/strong>, in dem er den gesetzlichen Vertreter zur Genehmigung auffordert. Diese kann nur <strong>innerhalb von zwei Wochen<\/strong> nach der Aufforderung erteilt werden.\"<\/p>\n<\/blockquote>\n<p><strong>Die Begriffe (auf den Unterschied kommt es an!):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>§<\/th>\n<th>Wann?<\/th>\n<th>Wirkung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Einwilligung<\/strong><\/td>\n<td>§ 183<\/td>\n<td><strong>vorher<\/strong><\/td>\n<td>Geschäft ist von Anfang an wirksam<\/td>\n<\/tr>\n<tr>\n<td><strong>Genehmigung<\/strong><\/td>\n<td>§ 184<\/td>\n<td><strong>nachher<\/strong><\/td>\n<td>Wirkt <strong>auf den Vertragsschluss zurück<\/strong> (ex tunc)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Merkhilfe: <strong>Ein<\/strong>willigung kommt v<strong>or<\/strong>her, <strong>Ge<\/strong>nehmigung kommt hint<strong>er<\/strong>her.<\/p>\n<p><strong>Die 2-Wochen-Frist des § 108 II<\/strong> ist wichtig: Sie läuft <strong>nicht automatisch<\/strong>. Erst wenn der Vertragspartner den gesetzlichen Vertreter <em>auffordert<\/em>, startet die Uhr. Schweigt der Vertreter dann zwei Wochen → gilt als <strong>verweigert<\/strong>.<\/p>\n<p><strong>Gesetzliche Vertretung:<\/strong> § 1629 — die Eltern vertreten das Kind gemeinsam.<\/p>\n<h3 id=\"r-65-110-der-taschengeldparagraph\">6.5 § 110 — Der Taschengeldparagraph<\/h3>\n<p>Der wichtigste Ausnahmetatbestand. <strong>Wortlaut sinngemäß:<\/strong><\/p>\n<blockquote>\n<p>Der Vertrag gilt als von Anfang an wirksam, wenn der Minderjährige die <strong>vertragsmäßige Leistung mit Mitteln bewirkt<\/strong>, die ihm zu diesem Zweck oder zur freien Verfügung von den Eltern oder mit deren Zustimmung von einem Dritten überlassen worden sind.<\/p>\n<\/blockquote>\n<p><strong>Folie 14 (Original):<\/strong><\/p>\n<blockquote>\n<p>„⇒ <strong>Erweitert ausgelegte Einwilligung: Der Taschengeldparagraf § 110<\/strong> (ähnlich: Arbeitsverhältnis § 113)\n– Das Gesetz <strong>unterstellt die Einwilligung<\/strong> des ges. Vertreters durch das Zurverfügungstellen der Mittel\n– Allerdings: <strong>einschränkend auszulegen bzgl. längerfristiger Bindung oder mutmaßlich nicht gedeckten Zwecken<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Die drei Voraussetzungen:<\/strong>\n1. <strong>Eigene Mittel<\/strong> — Taschengeld, Geburtstagsgeld, selbst verdientes Geld, Konfirmationsgeld.\n2. <strong>Überlassen zu diesem Zweck oder zur freien Verfügung<\/strong> — nicht: das Sparbuch fürs Studium.\n3. ★ <strong>VOLLSTÄNDIG bewirkt<\/strong> — die Leistung muss komplett erbracht sein.<\/p>\n<p><strong>Punkt 3 ist der Klausurhebel.<\/strong> Der Dozent formuliert in Fall 03e wörtlich:<\/p>\n<blockquote>\n<p><em>„nach Sinn und Zweck muss die Vorschrift jedoch <\/em><em>einschränkend ausgelegt<\/em><em> werden, um den Minderjährigenschutz nicht auszuhebeln. Daher müssen <\/em><em>längerfristige Verbindlichkeiten ausgeschlossen<\/em><em> werden und es ist zu fordern, dass die Gegenleistung <\/em><em>vollständig bewirkt<\/em><em> sein muss, um das Privileg der Gültigkeit nach § 110 auszulösen.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Daraus folgt die Faustregel:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>§ 110?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>16-Jährige kauft Kopfhörer für 80 €, zahlt sofort bar vom Taschengeld<\/td>\n<td>✓ ja<\/td>\n<\/tr>\n<tr>\n<td>16-Jährige kauft Moped für 550 €, zahlt 400 € an und den Rest in Raten<\/td>\n<td>✗ <strong>nein<\/strong> — noch nicht vollständig bewirkt<\/td>\n<\/tr>\n<tr>\n<td>… nachdem sie die <strong>letzte Rate<\/strong> gezahlt hat<\/td>\n<td>✓ <strong>ja<\/strong> — jetzt ist es vollständig bewirkt, der Vertrag wird wirksam<\/td>\n<\/tr>\n<tr>\n<td>17-Jähriger schließt ein <strong>6-Monats-Abo<\/strong> für 9,99 €/Monat ab<\/td>\n<td>✗ <strong>nein<\/strong> — längerfristige Bindung, nicht vollständig bewirkt<\/td>\n<\/tr>\n<tr>\n<td>17-Jähriger kauft einmalig FC Points für 19,99 €, zahlt sofort per PayPal-Guthaben aus dem Nebenjob<\/td>\n<td>✓ ja<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Merksatz: § 110 rettet Barkäufe, nicht Abos und nicht Ratenzahlung.<\/strong><\/p>\n<h3 id=\"r-66-112-113-die-vergessenen-ausnahmen\">6.6 §§ 112, 113 — die vergessenen Ausnahmen<\/h3>\n<p>Diese fehlten in deiner Liste, stehen aber auf Folie 13 und 14.<\/p>\n<ul>\n<li><strong>§ 112 — eigenes Erwerbsgeschäft.<\/strong> Wenn der Minderjährige mit Genehmigung der Eltern <em>und<\/em> des Familiengerichts ein Gewerbe betreibt, ist er für alle Geschäfte dieses Betriebs voll geschäftsfähig.\n  Folie 14: <em>„Der Minderjährigenschutz ist durch die <\/em><em>doppelte Genehmigungsbedürftigkeit<\/em><em> eines eigenen Betriebs (gesetzliche Vertretung + Familiengericht) ausreichend gewährleistet\"<\/em><\/li>\n<li><strong>§ 113 — Dienst- oder Arbeitsverhältnis.<\/strong> Wer mit Erlaubnis der Eltern arbeiten darf, kann alle Geschäfte rund um dieses Arbeitsverhältnis selbst vornehmen (Arbeitsvertrag, Kündigung, Lohnfragen).<\/li>\n<\/ul>\n<p>Wenn im Fall steht „mit Erlaubnis seiner Eltern hat er einen Nebenjob\" — dann ist <strong>§ 113<\/strong> dein Stichwort, mindestens als Nebenbemerkung.<\/p>\n<h3 id=\"r-67-das-prufungsschema-so-schreibst-du-es-in-die-klausur\">6.7 Das Prüfungsschema (so schreibst du es in die Klausur)<\/h3>\n<pre><code>WE eines Minderjährigen wirksam?\n ① Wie alt?   &lt; 7  → § 104 Nr. 1, WE nichtig § 105.  ENDE.\n              7–17 → § 106, weiter mit ②\n ② § 107: Lediglich rechtlicher Vorteil?\n              ja   → wirksam, keine Einwilligung nötig.  ENDE.\n              nein → weiter mit ③\n    ⚠ Getrennt prüfen: Verpflichtungsgeschäft UND Verfügungsgeschäft!\n ③ Einwilligung der Eltern (vorher) erteilt, § 183?\n              ja   → wirksam.  ENDE.\n              nein → weiter mit ④\n ④ § 110: Mit eigenen Mitteln VOLLSTÄNDIG bewirkt?\n              ja   → wirksam.  ENDE.\n              nein → weiter mit ⑤\n ⑤ § 112 (eigenes Erwerbsgeschäft) oder § 113 (Arbeitsverhältnis)?\n              ja   → wirksam.  ENDE.\n              nein → weiter mit ⑥\n ⑥ ⇒ SCHWEBEND UNWIRKSAM, § 108 I\n      Genehmigung § 184 → rückwirkend wirksam (ex tunc)\n      Verweigerung      → endgültig unwirksam\n      § 108 II: Vertragspartner fordert auf → 2 Wochen Frist\n ⑦ Rückabwicklung, wenn endgültig unwirksam → § 812 (Kap. 15)\n<\/code><\/pre>\n<h3 id=\"r-68-beispiele-aus-deinen-ubungsfallen-fall-03\">6.8 Beispiele aus deinen Übungsfällen (Fall 03)<\/h3>\n<p><strong>Fall 03 a) — Denny (6) gibt die Schuhe ab.<\/strong> Original-Lösung des Dozenten:<\/p>\n<blockquote>\n<p>„Wie ist die Rechtslage?: <strong>Alle Personenbeziehungen sind rechtlich zu erörtern<\/strong>; ggfs. auch Sachbeziehungen (Eigentum)<\/p>\n<p><strong>Vertragsbeziehung Denny (6J) und Jimmy (Erzieher):<\/strong>\nJ könnte einen Anspruch auf Übereignung der Schuhe gegen D haben. Vss wäre ein wirksamer Kaufvertrag nach § 433 […] Antrag durch D? Erklärung abgegeben, aber <strong>nichtig nach § 105, weil D geschäftsunfähig ist § 104, Nr. 1<\/strong>. D und J haben keinen wirksamen KV geschlossen, kein KV zustande gekommen.<\/p>\n<p><strong>J könnte einen Anspruch aus § 433 auf Übereignung der Schuhe gegen die Mutter A haben.<\/strong>\nKV kommt zustande durch Antrag und Annahme §§ 145, 147. Antrag von A könnte im Mitgeben der Schuhe liegen und der Beauftragung von D liegen. <strong>Es ist ihre WE, die D lediglich als Bote überbracht hat. Ist D als Erklärungsbote geeignet? (+) ⇒ Antrag (+), Annahme durch J (+) ⇒ Vertrag (+)<\/strong><\/p>\n<p><strong>Übereignung der Schuhe § 929 durch D als Bote für A<\/strong>, Übereignung des Geldes durch D als Bote von J<\/p>\n<p><strong>Rechtsbeziehung A und D: kein Rechtsgeschäft abgeschlossen worden.<\/strong>\"<\/p>\n<p>📌 <strong>Korrektur zu deiner Themenliste:<\/strong> Du hattest diesen Fall als Abstraktionsprinzip-Beispiel eingeordnet („die Übereignung kann trotzdem wirksam sein\"). Tatsächlich ist es primär ein <strong>Boten-Fall<\/strong>: Denny gibt gar keine eigene WE ab, er überbringt nur die seiner Mutter. Deshalb kommt der Vertrag zwischen <strong>Mutter und Erzieher<\/strong> zustande — obwohl Denny geschäftsunfähig ist. <strong>Ein Geschäftsunfähiger kann Bote sein<\/strong>, weil er dabei keinen eigenen Willen bilden muss. Das ist die eigentliche Pointe. (Zum Abstraktionsprinzip nimm besser Fall 03e, siehe unten.)<\/p>\n<\/blockquote>\n<p><strong>Fall 03 b)<\/strong> — Denny sagt „zwei Euro\" statt „drei Euro\":<\/p>\n<blockquote>\n<p><em>„Antrag „drei EUR\" durch A ist nicht zugegangen, da Erklärungsbote nicht übermittelt hat, § 130 I. Antrag „zwei EUR\": durch D nicht mgl, da dessen WE nach §§ 105, 104 Nr. 1 nichtig ist. <\/em><em>Aber im Hingeben von zwei EUR durch J ist durch Auslegung nach §§ 133, 157 ein neues Angebot … zu sehen, § 150.<\/em><em> In d
