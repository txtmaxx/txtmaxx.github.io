iesem Fall erfolgt Zugang durch D, der Erklärungsbote für J ist. Das … Angebot kann A, z.B. konkludent, durch Entgegennahme des Geldes annehmen.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Fall 03 c)<\/strong> — dieselbe Szene am 7. Geburtstag:<\/p>\n<blockquote>\n<p><em>„Ja, denn mit dem Geburtstag vollendet D sein siebentes Lebensjahr, <\/em><em>§ 187 II, 2<\/em><em> und ist damit <\/em><em>beschränkt geschäftsfähig, § 106<\/em><em>. Somit bietet D seine Schuhe dem J zum Kauf für 2 EUR an. Diese WE ist <\/em><em>schwebend unwirksam bis A sie als gesetzliche Vertreterin genehmigt, §§ 108, 1629, 184<\/em><em>.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Fall 03 d) — der n-tv-Fall (Lollis auf Amazon):<\/strong> Der 7-jährige Liam bestellt für 4.220 $.<\/p>\n<blockquote>\n<p><em>„Anspruchsgrundlage könnte <\/em><em>§ 812 I, 2. Fall<\/em><em> sein. Vss: etwas erlangt (+) das Geld, in sonstiger Weise (+) durch Abbuchung, ohne rechtlichen Grund […] Angebot könnte im Klicken des Liam auf Amazon gelegen haben. Allerdings könnte dieses Angebot nach <\/em><em>§ 107<\/em><em> unwirksam gewesen sein, da Liam in seiner Geschäftsfähigkeit als 7-jähriger beschränkt war, <\/em><em>§ 106<\/em><em>, und keine Einwilligung durch seine Mutter vorlag. […] <\/em><em>Mit der Verweigerung der Genehmigung ist der Vertrag nicht zustande gekommen.<\/em><em> Folglich liegt kein Rechtsgrund für die Abbuchung […] vor. Folglich hat die Mutter einen Rückgabeanspruch nach <\/em><em>§ 812 I, 2. Fall<\/em><em>.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Fall 03 e) — die Simson-Schwalbe.<\/strong> Das ist der wichtigste Fall der Sammlung, weil er alles kombiniert. Nancy (16) kauft für 550 €, zahlt 400 € an, Rest in zwei Raten à 75 €. Ergebnisse:<\/p>\n<table>\n<thead>\n<tr>\n<th>Geschäft<\/th>\n<th>Ergebnis<\/th>\n<th>Warum<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Kaufvertrag § 433<\/strong><\/td>\n<td>schwebend unwirksam § 108<\/td>\n<td>rechtl. Nachteil (§ 107 -), keine Einwilligung, § 110 (-) weil Raten<\/td>\n<\/tr>\n<tr>\n<td><strong>Übereignung Schwalbe § 929<\/strong> an Nancy<\/td>\n<td>✓ <strong>wirksam<\/strong><\/td>\n<td><em>„da die Einigung über den Eigentumsübergang einen lediglich rechtlichen Vorteil darstellt (+)\"<\/em> → <strong>Nancy ist Eigentümerin<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Übereignung der 550 € § 929<\/strong> an Jimmy<\/td>\n<td>✓ wirksam<\/td>\n<td><em>„weil N das Geld nach § 110 mit eigenen Mitteln bewirkt hat\"<\/em><\/td>\n<\/tr>\n<tr>\n<td>Anspruch auf die restlichen 200 €?<\/td>\n<td>✗ nein<\/td>\n<td>Vertrag schwebend unwirksam<\/td>\n<\/tr>\n<tr>\n<td>… nachdem sie <strong>alle Raten<\/strong> gezahlt hat<\/td>\n<td>✓ <strong>ja<\/strong><\/td>\n<td><em>„Kaufvertrag § 433 diesmal (+) weil N inzwischen die Leistung aus eigenen Mitteln bewirkt hat, § 110\"<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Das ist das Musterbeispiel fürs Abstraktionsprinzip:<\/strong> Der Kaufvertrag ist unwirksam, die Übereignung ist wirksam. Nancy ist Eigentümerin einer Sache, die sie nach dem Kaufvertrag gar nicht hätte bekommen dürfen. Siehe Kapitel 7.<\/p>\n<p><strong>Fall 03 f) / 04 — die „Übungsklausur\" (Denny, 17, EA Sports FC).<\/strong> Der Dozent hat sie <strong>zweimal<\/strong> in die Unterlagen gelegt. Beachte die Zweiteilung:\n- <strong>2000 FC Points für 19,99 €<\/strong>, sofort per PayPal aus dem Nebenjob-Guthaben → <strong>§ 110 (+)<\/strong>, wirksam. Zusätzlich argumentierbar: <strong>§ 113<\/strong>, weil Nebenjob mit Elternerlaubnis.\n- <strong>6-Monats-Abo, 9,99 €/Monat<\/strong> → <strong>§ 110 (-)<\/strong>, längerfristige Bindung, nicht vollständig bewirkt → <strong>§ 108 I schwebend unwirksam<\/strong>, Eltern verweigern die Genehmigung → Rückforderung über <strong>§ 812<\/strong>.<\/p>\n<p>Wenn genau dieser Fall in der Klausur kommt: Die Frage „was können die Eltern tun?\" beantwortest du mit <strong>Verweigerung der Genehmigung nach § 108 I<\/strong> und <strong>Rückforderung nach § 812 I 1 (Leistungskondiktion)<\/strong>.<\/p>\n<p><strong>Fall 07 c) — Zahngold.<\/strong> Hier dreht der Dozent § 110 um: Denny (17) verkauft sein von den Eltern geschenktes Zahngold für 455 €.<\/p>\n<blockquote>\n<p><em>„Die Eltern hatten ihm das Zahngold <\/em><em>zur freien Verfügung<\/em><em> gegeben. Eine spätere <\/em><em>„Reue\" der Eltern ändert daran nichts<\/em><em> mehr. Dementsprechend war der Vertrag wirksam zustande gekommen und es liegt ein Rechtsgrund vor.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Beachte:<\/strong> Hier war das Zahngold selbst das „eigene Mittel\" — Denny hat damit <em>seine<\/em> Leistung (Übereignung des Goldes) vollständig bewirkt. Und <strong>einmal überlassen ist überlassen<\/strong>: Die Eltern können ihre Einwilligung nicht rückwirkend zurücknehmen.<\/p>","text":"Worum es hier geht — in einfachen Worten Kinder und Jugendliche sollen sich nicht ruinieren können. Deshalb gelten ihre Verträge nur eingeschränkt. Dieses Kapitel sagt dir, ab wann jemand wirksam etwas kaufen kann — und was passiert, wenn ein 15-Jähriger ein Abo abschließt. Rechne fest damit, dass das drankommt. Der Dozent hat eine eigene Fallsammlung dazu gemacht, und in seinem Bewertungsschema stehen 15 Punkte allein für die §§ 433, 108, 110. Das ist der Lieblingsstoff des Dozenten . Es gibt eine eigene Fallsammlung (03), der EA-Sports-Fall taucht zweimal als „Übungsklausur\" auf (in 03f und 04), und im Original-Bewertungsschema stehen 15 Punkte für „Prüfung §§ 433, 108, 110\". Rechne fest damit. 6.1 Der Grundgedanke (Folie 13, Original) „● Formale Unwirksamkeit durch eingeschränkte Geschäftsfähigkeit / Minderjährigenrecht Grundsatz. Die Rechtsordnung schützt die Schutzbedürftigen vor Rechtsfolgen, die sie nicht übersehen können , durch – Nichtigkeit von WE, die ein Geschäftsunfähiger abgibt, §§ 105, 104 Nr. 1 u. 2 ⇒ keine Rechtsfolgen – „Schwebende Unwirksamkeit\" von WE, die ein vermindert Geschäftsfähiger ohne Einwilligung der gesetzlichen Vertretung abgibt, §§ 106 ff Ausnahmen: lediglich rechtlicher Vorteil (Beachte: Abstraktionsprinzip! ), „Taschengeldparagraf\" § 110 , eigenes Erwerbsgeschäft, § 112 , Dienst- oder Arbeitsverhältnis, § 113 \" 6.2 Die drei Stufen Alter Status § Rechtsfolge der WE 0–6 geschäftsunfähig § 104 Nr. 1 nichtig , § 105 — passiert einfach nichts 7–17 beschränkt geschäftsfähig § 106 schwebend unwirksam , § 108 I — hängt in der Luft ab 18 voll geschäftsfähig – wirksam Zusätzlich § 104 Nr. 2 : dauerhafte krankhafte Störung der Geistestätigkeit → ebenfalls geschäftsunfähig, unabhängig vom Alter. Fristberechnung § 187 II: Mit dem Geburtstag selbst ist das Lebensjahr vollendet. Am 7. Geburtstag ist man also bereits beschränkt geschäftsfähig — nicht erst am Tag danach. Genau das prüft Fall 03c. Die drei Stufen als Bild: Ein Sechsjähriger ist wie jemand, dessen Unterschrift schlicht nicht zählt. Er kann unterschreiben, was er will — rechtlich passiert nichts . Der Vertrag ist von vornherein tot. Ein Zwölfjähriger ist wie jemand, dessen Unterschrift erstmal in der Schwebe hängt. Sagen die Eltern hinterher „ja, passt\", gilt der Vertrag — und zwar rückwirkend, als hätte er von Anfang an gegolten. Sagen sie „nein\", war er nie da. Ein Achtzehnjähriger unterschreibt, und es gilt sofort. Dahinter steckt nur ein einziger Gedanke: Kinder sollen vor Folgen geschützt werden, die sie nicht überblicken. Wenn du in der Klausur unsicher bist, frag dich immer: Wird das Kind hier geschützt oder nicht? 6.3 § 107 — „lediglich rechtlicher Vorteil\" Der Minderjährige braucht keine Einwilligung, wenn das Geschäft ihm lediglich einen rechtlichen Vorteil bringt. Die entscheidende Falle — merk dir das wörtlich: „Rechtlich\" ≠ „wirtschaftlich\". Sobald der Minderjährige irgendeine Pflicht übernimmt, ist es ein rechtlicher Nachteil — auch wenn das Geschäft ein Superdeal ist. Der Dozent formuliert es in Fall 03e so: „Lediglich rechtlicher Vorteil? Zwar wirtschaftlicher Vorteil, aber Pflicht zur Gegenleistung, daher rechtlicher Nachteil ⇒ (-)\" Geschäft Lediglich rechtl. Vorteil? Oma schenkt dem 10-Jährigen 500 € (reine Schenkung) ✓ ja — er bekommt nur, muss nichts Der 16-Jährige kauft ein Moped für 550 €, das 750 € wert ist ✗ nein — er muss zahlen Der 16-Jährige bekommt das Moped übereignet (§ 929) ✓ ja — der Eigentumserwerb allein ist reiner Vorteil Schenkung eines Grundstücks (mit Grundsteuerpflicht) ✗ nein — Lasten hängen dran Die vorletzte Zeile ist der Punkt, an dem das Abstraktionsprinzip ins Spiel kommt — siehe Kapitel 7. Die Folie 13 sagt es selbst: „lediglich rechtlicher Vorteil ( Beachte: Abstraktionsprinzip! )\" . 6.4 § 108 — Schwebende Unwirksamkeit Folie 15 (Original): „⇒Rechtsfolge, sofern keine Wirksamkeit nach obigen Vorschriften: „Schwebende Unwirksamkeit, § 108 I\" – Durch die WE eines beschränkt Geschäftsfähigen ohne Einwilligung des Vertreters hängt die WE und damit der Vertragsschluss „in der Luft\" und entfaltet keine Rechtswirkungen – Der Schwebezustand endet durch die Genehmigung des gesetzlichen Vertreters oder deren Verweigerung , § 108 I. Mit Genehmigung wird die WE von Anfang an wirksam. Eine Frist sieht das Gesetz nicht vor. – Der Vertragspartner hat es in der Hand, den Schwebezustand zu beenden, § 108 II , in dem er den gesetzlichen Vertreter zur Genehmigung auffordert. Diese kann nur innerhalb von zwei Wochen nach der Aufforderung erteilt werden.\" Die Begriffe (auf den Unterschied kommt es an!): Begriff § Wann? Wirkung Einwilligung § 183 vorher Geschäft ist von Anfang an wirksam Genehmigung § 184 nachher Wirkt auf den Vertragsschluss zurück (ex tunc) Merkhilfe: Ein willigung kommt v or her, Ge nehmigung kommt hint er her. Die 2-Wochen-Frist des § 108 II ist wichtig: Sie läuft nicht automatisch . Erst wenn der Vertragspartner den gesetzlichen Vertreter auffordert , startet die Uhr. Schweigt der Vertreter dann zwei Wochen → gilt als verweigert . Gesetzliche Vertretung: § 1629 — die Eltern vertreten das Kind gemeinsam. 6.5 § 110 — Der Taschengeldparagraph Der wichtigste Ausnahmetatbestand. Wortlaut sinngemäß: Der Vertrag gilt als von Anfang an wirksam, wenn der Minderjährige die vertragsmäßige Leistung mit Mitteln bewirkt , die ihm zu diesem Zweck oder zur freien Verfügung von den Eltern oder mit deren Zustimmung von einem Dritten überlassen worden sind. Folie 14 (Original): „⇒ Erweitert ausgelegte Einwilligung: Der Taschengeldparagraf § 110 (ähnlich: Arbeitsverhältnis § 113) – Das Gesetz unterstellt die Einwilligung des ges. Vertreters durch das Zurverfügungstellen der Mittel – Allerdings: einschränkend auszulegen bzgl. längerfristiger Bindung oder mutmaßlich nicht gedeckten Zwecken \" Die drei Voraussetzungen: 1. Eigene Mittel — Taschengeld, Geburtstagsgeld, selbst verdientes Geld, Konfirmationsgeld. 2. Überlassen zu diesem Zweck oder zur freien Verfügung — nicht: das Sparbuch fürs Studium. 3. ★ VOLLSTÄNDIG bewirkt — die Leistung muss komplett erbracht sein. Punkt 3 ist der Klausurhebel. Der Dozent formuliert in Fall 03e wörtlich: „nach Sinn und Zweck muss die Vorschrift jedoch einschränkend ausgelegt werden, um den Minderjährigenschutz nicht auszuhebeln. Daher müssen längerfristige Verbindlichkeiten ausgeschlossen werden und es ist zu fordern, dass die Gegenleistung vollständig bewirkt sein muss, um das Privileg der Gültigkeit nach § 110 auszulösen.\" Daraus folgt die Faustregel: Situation § 110? 16-Jährige kauft Kopfhörer für 80 €, zahlt sofort bar vom Taschengeld ✓ ja 16-Jährige kauft Moped für 550 €, zahlt 400 € an und den Rest in Raten ✗ nein — noch nicht vollständig bewirkt … nachdem sie die letzte Rate gezahlt hat ✓ ja — jetzt ist es vollständig bewirkt, der Vertrag wird wirksam 17-Jähriger schließt ein 6-Monats-Abo für 9,99 €/Monat ab ✗ nein — längerfristige Bindung, nicht vollständig bewirkt 17-Jähriger kauft einmalig FC Points für 19,99 €, zahlt sofort per PayPal-Guthaben aus dem Nebenjob ✓ ja Merksatz: § 110 rettet Barkäufe, nicht Abos und nicht Ratenzahlung. 6.6 §§ 112, 113 — die vergessenen Ausnahmen Diese fehlten in deiner Liste, stehen aber auf Folie 13 und 14. § 112 — eigenes Erwerbsgeschäft. Wenn der Minderjährige mit Genehmigung der Eltern und des Familiengerichts ein Gewerbe betreibt, ist er für alle Geschäfte dieses Betriebs voll geschäftsfähig. Folie 14: „Der Minderjährigenschutz ist durch die doppelte Genehmigungsbedürftigkeit eines eigenen Betriebs (gesetzliche Vertretung + Familiengericht) ausreichend gewährleistet\" § 113 — Dienst- oder Arbeitsverhältnis. Wer mit Erlaubnis der Eltern arbeiten darf, kann alle Geschäfte rund um dieses Arbeitsverhältnis selbst vornehmen (Arbeitsvertrag, Kündigung, Lohnfragen). Wenn im Fall steht „mit Erlaubnis seiner Eltern hat er einen Nebenjob\" — dann ist § 113 dein Stichwort, mindestens als Nebenbemerkung. 6.7 Das Prüfungsschema (so schreibst du es in die Klausur) WE eines Minderjährigen wirksam? ① Wie alt? < 7 → § 104 Nr. 1, WE nichtig § 105. ENDE. 7–17 → § 106, weiter mit ② ② § 107: Lediglich rechtlicher Vorteil? ja → wirksam, keine Einwilligung nötig. ENDE. nein → weiter mit ③ ⚠ Getrennt prüfen: Verpflichtungsgeschäft UND Verfügungsgeschäft! ③ Einwilligung der Eltern (vorher) erteilt, § 183? ja → wirksam. ENDE. nein → weiter mit ④ ④ § 110: Mit eigenen Mitteln VOLLSTÄNDIG bewirkt? ja → wirksam. ENDE. nein → weiter mit ⑤ ⑤ § 112 (eigenes Erwerbsgeschäft) oder § 113 (Arbeitsverhältnis)? ja → wirksam. ENDE. nein → weiter mit ⑥ ⑥ ⇒ SCHWEBEND UNWIRKSAM, § 108 I Genehmigung § 184 → rückwirkend wirksam (ex tunc) Verweigerung → endgültig unwirksam § 108 II: Vertragspartner fordert auf → 2 Wochen Frist ⑦ Rückabwicklung, wenn endgültig unwirksam → § 812 (Kap. 15) 6.8 Beispiele aus deinen Übungsfällen (Fall 03) Fall 03 a) — Denny (6) gibt die Schuhe ab. Original-Lösung des Dozenten: „Wie ist die Rechtslage?: Alle Personenbeziehungen sind rechtlich zu erörtern ; ggfs. auch Sachbeziehungen (Eigentum) Vertragsbeziehung Denny (6J) und Jimmy (Erzieher): J könnte einen Anspruch auf Übereignung der Schuhe gegen D haben. Vss wäre ein wirksamer Kaufvertrag nach § 433 […] Antrag durch D? Erklärung abgegeben, aber nichtig nach § 105, weil D geschäftsunfähig ist § 104, Nr. 1 . D und J haben keinen wirksamen KV geschlossen, kein KV zustande gekommen. J könnte einen Anspruch aus § 433 auf Übereignung der Schuhe gegen die Mutter A haben. KV kommt zustande durch Antrag und Annahme §§ 145, 147. Antrag von A könnte im Mitgeben der Schuhe liegen und der Beauftragung von D liegen. Es ist ihre WE, die D lediglich als Bote überbracht hat. Ist D als Erklärungsbote geeignet? (+) ⇒ Antrag (+), Annahme durch J (+) ⇒ Vertrag (+) Übereignung der Schuhe § 929 durch D als Bote für A , Übereignung des Geldes durch D als Bote von J Rechtsbeziehung A und D: kein Rechtsgeschäft abgeschlossen worden. \" 📌 Korrektur zu deiner Themenliste: Du hattest diesen Fall als Abstraktionsprinzip-Beispiel eingeordnet („die Übereignung kann trotzdem wirksam sein\"). Tatsächlich ist es primär ein Boten-Fall : Denny gibt gar keine eigene WE ab, er überbringt nur die seiner Mutter. Deshalb kommt der Vertrag zwischen Mutter und Erzieher zustande — obwohl Denny geschäftsunfähig ist. Ein Geschäftsunfähiger kann Bote sein , weil er dabei keinen eigenen Willen bilden muss. Das ist die eigentliche Pointe. (Zum Abstraktionsprinzip nimm besser Fall 03e, siehe unten.) Fall 03 b) — Denny sagt „zwei Euro\" statt „drei Euro\": „Antrag „drei EUR\" durch A ist nicht zugegangen, da Erklärungsbote nicht übermittelt hat, § 130 I. Antrag „zwei EUR\": durch D nicht mgl, da dessen WE nach §§ 105, 104 Nr. 1 nichtig ist. Aber im Hingeben von zwei EUR durch J ist durch Auslegung nach §§ 133, 157 ein neues Angebot … zu sehen, § 150. In diesem Fall erfolgt Zugang durch D, der Erklärungsbote für J ist. Das … Angebot kann A, z.B. konkludent, durch Entgegennahme des Geldes annehmen.\" Fall 03 c) — dieselbe Szene am 7. Geburtstag: „Ja, denn mit dem Geburtstag vollendet D sein siebentes Lebensjahr, § 187 II, 2 und ist damit beschränkt geschäftsfähig, § 106 . Somit bietet D seine Schuhe dem J zum Kauf für 2 EUR an. Diese WE ist schwebend unwirksam bis A sie als gesetzliche Vertreterin genehmigt, §§ 108, 1629, 184 .\" Fall 03 d) — der n-tv-Fall (Lollis auf Amazon): Der 7-jährige Liam bestellt für 4.220 $. „Anspruchsgrundlage könnte § 812 I, 2. Fall sein. Vss: etwas erlangt (+) das Geld, in sonstiger Weise (+) durch Abbuchung, ohne rechtlichen Grund […] Angebot könnte im Klicken des Liam auf Amazon gelegen haben. Allerdings könnte dieses Angebot nach § 107 unwirksam gewesen sein, da Liam in seiner Geschäftsfähigkeit als 7-jähriger beschränkt war, § 106 , und keine Einwilligung durch seine Mutter vorlag. […] Mit der Verweigerung der Genehmigung ist der Vertrag nicht zustande gekommen. Folglich liegt kein Rechtsgrund für die Abbuchung […] vor. Folglich hat die Mutter einen Rückgabeanspruch nach § 812 I, 2. Fall .\" Fall 03 e) — die Simson-Schwalbe. Das ist der wichtigste Fall der Sammlung, weil er alles kombiniert. Nancy (16) kauft für 550 €, zahlt 400 € an, Rest in zwei Raten à 75 €. Ergebnisse: Geschäft Ergebnis Warum Kaufvertrag § 433 schwebend unwirksam § 108 rechtl. Nachteil (§ 107 -), keine Einwilligung, § 110 (-) weil Raten Übereignung Schwalbe § 929 an Nancy ✓ wirksam „da die Einigung über den Eigentumsübergang einen lediglich rechtlichen Vorteil darstellt (+)\" → Nancy ist Eigentümerin Übereignung der 550 € § 929 an Jimmy ✓ wirksam „weil N das Geld nach § 110 mit eigenen Mitteln bewirkt hat\" Anspruch auf die restlichen 200 €? ✗ nein Vertrag schwebend unwirksam … nachdem sie alle Raten gezahlt hat ✓ ja „Kaufvertrag § 433 diesmal (+) weil N inzwischen die Leistung aus eigenen Mitteln bewirkt hat, § 110\" Das ist das Musterbeispiel fürs Abstraktionsprinzip: Der Kaufvertrag ist unwirksam, die Übereignung ist wirksam. Nancy ist Eigentümerin einer Sache, die sie nach dem Kaufvertrag gar nicht hätte bekommen dürfen. Siehe Kapitel 7. Fall 03 f) / 04 — die „Übungsklausur\" (Denny, 17, EA Sports FC). Der Dozent hat sie zweimal in die Unterlagen gelegt. Beachte die Zweiteilung: - 2000 FC Points für 19,99 € , sofort per PayPal aus dem Nebenjob-Guthaben → § 110 (+) , wirksam. Zusätzlich argumentierbar: § 113 , weil Nebenjob mit Elternerlaubnis. - 6-Monats-Abo, 9,99 €/Monat → § 110 (-) , längerfristige Bindung, nicht vollständig bewirkt → § 108 I schwebend unwirksam , Eltern verweigern die Genehmigung → Rückforderung über § 812 . Wenn genau dieser Fall in der Klausur kommt: Die Frage „was können die Eltern tun?\" beantwortest du mit Verweigerung der Genehmigung nach § 108 I und Rückforderung nach § 812 I 1 (Leistungskondiktion) . Fall 07 c) — Zahngold. Hier dreht der Dozent § 110 um: Denny (17) verkauft sein von den Eltern geschenktes Zahngold für 455 €. „Die Eltern hatten ihm das Zahngold zur freien Verfügung gegeben. Eine spätere „Reue\" der Eltern ändert daran nichts mehr. Dementsprechend war der Vertrag wirksam zustande gekommen und es liegt ein Rechtsgrund vor.\" Beachte: Hier war das Zahngold selbst das „eigene Mittel\" — Denny hat damit seine Leistung (Übereignung des Goldes) vollständig bewirkt. Und einmal überlassen ist überlassen : Die Eltern können ihre Einwilligung nicht rückwirkend zurücknehmen.","words":2255,"mins":12},{"id":"r-7-abstraktionsprinzip","subject":"recht","num":"7","title":"7. Abstraktionsprinzip","short":"Abstraktionsprinzip","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nEin Kauf besteht juristisch aus <strong>zwei getrennten Vorgängen<\/strong>: dem Versprechen („ich verkaufe dir das\") und der Übergabe („hier, jetzt gehört es dir\").<\/p>\n<p>Im Alltag denkst du das als eine Sache. Das Recht trennt es. Warum? Damit nicht alles zusammenbricht, wenn eines von beiden schiefgeht.<\/p>\n<p>Das klingt nach Theorie, ist aber der Grund, warum am Ende so vieler Fälle <strong>§ 812<\/strong> auftaucht.<\/p>\n<\/blockquote>\n<p><strong>Folie 14 (Original, vollständig):<\/strong><\/p>\n<blockquote>\n<p>„⇒<strong>Einschub: Das Abstraktionsprinzip als zentrales Konstruktionsprinzip im Zivilrecht<\/strong>\n– <strong>Jede vertragliche Vermögensverschiebung basiert auf zwei voneinander unabhängigen Rechtsgeschäften:<\/strong>\n  - dem (schuldrechtlichen) <strong>Verpflichtungs(Kausal)-geschäft<\/strong>: „ich verspreche eine bestimmte Vermögensverschiebung\"\n  - dem (sachenrechtlichen = dinglichen) <strong>Verfügungs(Erfüllungs-)geschäft<\/strong>: „ich bewirke die Vermögensverschiebung\"\n– <strong>Beide Geschäfte sind rechtlich unabhängig voneinander<\/strong>\n  - Kauf und Eigentumsübertragung (<strong>§§ 433, 929<\/strong>)\n  - Leihe und Besitzübertragung (<strong>§§ 598, 854<\/strong>)\n  - Verlöbnis und Eheschließung (<strong>§§ 1297, 1310<\/strong>)\n⇒ im Minderjährigenrecht ist häufig das <strong>Verpflichtungsgeschäft problematisch, das Verfügungsgeschäft wegen § 107 ggfs. nicht<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"r-was-das-bedeutet-der-backerei-klassiker\">Was das bedeutet — der Bäckerei-Klassiker<\/h3>\n<p>Du kaufst ein Brötchen. Für dein Gefühl ist das <em>ein<\/em> Vorgang. Juristisch sind es <strong>drei<\/strong>:<\/p>\n<pre><code>① Kaufvertrag § 433           „Ich verspreche: du kriegst das Brötchen, ich kriege 60 Cent.&quot;\n                              → begründet nur PFLICHTEN. Noch gehört niemandem was Neues.\n② Übereignung Brötchen § 929  Bäcker + du einigen euch + er übergibt → du wirst Eigentümer.\n③ Übereignung der 60 Cent §929 Du + Bäcker einigen euch + du übergibst → er wird Eigentümer.\n<\/code><\/pre>\n<p><strong>Und jetzt der Clou: Diese drei Geschäfte sind rechtlich voneinander unabhängig.<\/strong> Ist ① nichtig, kann ② trotzdem wirksam sein.<\/p>\n<h3 id=\"r-warum-das-keine-haarspalterei-ist\">Warum das keine Haarspalterei ist<\/h3>\n<p><strong>Denk an eine Bestellung im Onlineshop.<\/strong><\/p>\n<p><strong>Montag.<\/strong> Du klickst „Kaufen\". Was hast du jetzt? Noch gar nichts. Du hast nur zwei <strong>Versprechen<\/strong>: Der Shop verspricht zu liefern, du versprichst zu zahlen. → Das ist das <strong>Verpflichtungsgeschäft<\/strong>.<\/p>\n<p><strong>Donnerstag.<\/strong> Das Paket kommt. Jetzt gehört dir das Gerät wirklich. → Das ist das <strong>Verfügungsgeschäft<\/strong>.<\/p>\n<p>Zwei verschiedene Vorgänge, an zwei verschiedenen Tagen. Im Alltag sagst du „ich habe was gekauft\" und meinst beides zusammen. Juristisch sind das zwei Paar Schuhe.<\/p>\n<p><strong>Und jetzt der Punkt, um den es wirklich geht:<\/strong> Stellt sich heraus, dass der Kaufvertrag vom Montag ungültig war — dann liegt das Gerät trotzdem bei dir zu Hause und gehört dir. Es springt nicht von allein zurück in den Shop. Man braucht einen <strong>zweiten Vorgang<\/strong>, um es zurückzuholen.<\/p>\n<p>Und genau dafür gibt es <strong>§ 812<\/strong> (Kapitel 15). Merk dir diese Verbindung, sie kommt in fast jedem Fall vor.<\/p>\n<p>Genau deshalb ist <strong>§ 812 (ungerechtfertigte Bereicherung) so wichtig<\/strong>: Er ist der Rollback-Mechanismus. Wenn die Verpflichtung wegfällt, die Verfügung aber steht, holt § 812 die Sache zurück. Merke:<\/p>\n<blockquote>\n<p><strong>Trennungsprinzip:<\/strong> Verpflichtung und Verfügung sind zwei getrennte Rechtsgeschäfte.\n<strong>Abstraktionsprinzip:<\/strong> Die Wirksamkeit des einen hängt nicht von der Wirksamkeit des anderen ab.\n<strong>§ 812<\/strong> ist das Reparaturwerkzeug, wenn beide auseinanderlaufen.<\/p>\n<\/blockquote>\n<h3 id=\"r-warum-gibt-es-das-uberhaupt\">Warum gibt es das überhaupt?<\/h3>\n<p>Aus Gründen der <strong>Verkehrssicherheit<\/strong>. Stell dir vor, du kaufst ein gebrauchtes Auto. Der Verkäufer hatte es selbst gekauft — und in dieser Vorkette war irgendein Vertrag nichtig. Ohne Abstraktionsprinzip wäre dein Eigentum futsch, weil ein Fehler drei Stationen vorher durchschlägt. Mit Abstraktionsprinzip bleibt jede Übereignung für sich wirksam, und die Fehler werden <strong>nur zwischen den unmittelbar Beteiligten<\/strong> über § 812 bereinigt.<\/p>\n<h3 id=\"r-71-verpflichtung-vs-verfugung-die-tabelle\">7.1 Verpflichtung vs. Verfügung — die Tabelle<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Verpflichtungsgeschäft<\/strong><\/th>\n<th><strong>Verfügungsgeschäft<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Auch genannt<\/td>\n<td>Kausalgeschäft, Grundgeschäft<\/td>\n<td>Erfüllungsgeschäft, dingliches Geschäft<\/td>\n<\/tr>\n<tr>\n<td>Was passiert?<\/td>\n<td>begründet eine <strong>Pflicht<\/strong><\/td>\n<td>wirkt <strong>unmittelbar<\/strong> auf ein Recht ein (überträgt, belastet, ändert, hebt auf)<\/td>\n<\/tr>\n<tr>\n<td>BGB-Buch<\/td>\n<td>2. Buch Schuldrecht<\/td>\n<td>3. Buch Sachenrecht<\/td>\n<\/tr>\n<tr>\n<td>Beispiele<\/td>\n<td>Kauf § 433 · Miete § 535 · Werkvertrag § 631 · Schenkung § 516 · Leihe § 598<\/td>\n<td>Übereignung § 929 · Abtretung § 398 · Besitzübertragung § 854<\/td>\n<\/tr>\n<tr>\n<td>Für Minderjährige<\/td>\n<td>meist <strong>nachteilig<\/strong> (Pflicht!)<\/td>\n<td>oft <strong>lediglich vorteilhaft<\/strong> (nur Erwerb)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>§ 433 ist ein gegenseitiger Vertrag:<\/strong> Der Verkäufer verpflichtet sich zu Übergabe <em>und<\/em> Eigentumsverschaffung (§ 433 I), der Käufer zur Kaufpreiszahlung <em>und<\/em> Abnahme (§ 433 II). <strong>Beide<\/strong> Seiten haben Pflichten — deshalb ist ein Kaufvertrag für einen Minderjährigen nie „lediglich rechtlich vorteilhaft\".<\/p>\n<p><strong>§ 929 hat zwei Voraussetzungen:<\/strong> <strong>Einigung + Übergabe.<\/strong> (Merkhilfe: „Einig sein und rübergeben.\")<\/p>\n<h3 id=\"r-72-die-ausnahme-fehleridentitat\">7.2 Die Ausnahme: Fehleridentität<\/h3>\n<p>Das steht auf <strong>Folie 26<\/strong> und fehlte in deiner Liste:<\/p>\n<blockquote>\n<p>„Ganz überwiegend: <strong>Fehleridentität beim Verfügungsgeschäft<\/strong>\"<\/p>\n<\/blockquote>\n<p>Manchmal schlägt derselbe Fehler auf <strong>beide<\/strong> Geschäfte durch — dann sind beide unwirksam. Beispiele:\n- <strong>Geschäftsunfähigkeit<\/strong> (§ 105): Ein 6-Jähriger kann <em>weder<\/em> einen Kaufvertrag schließen <em>noch<\/em> wirksam übereignen. Beide WE sind nichtig.\n- <strong>Arglistige Täuschung<\/strong> (§ 123): Wer über beides getäuscht wurde, kann beides anfechten.\n- <strong>Sittenwidrigkeit<\/strong> (§ 138), wenn gerade die Übereignung sittenwidrig ist.<\/p>\n<p><strong>Kein<\/strong> Durchschlagen dagegen bei: § 107 (weil die Verfügung ja vorteilhaft ist) und beim reinen Inhalts-/Erklärungsirrtum über den Preis (der betrifft nur den Kaufvertrag).<\/p>\n<h3 id=\"r-73-so-schreibst-du-es-in-der-klausur\">7.3 So schreibst du es in der Klausur<\/h3>\n<p>Wenn im Fall gefragt wird „<strong>Wer ist Eigentümer?<\/strong>\" — dann ist das dein Signal, <strong>getrennt<\/strong> zu prüfen:<\/p>\n<pre><code>A. Kaufvertrag, § 433            → wirksam? (Angebot, Annahme, §§ 104 ff., 125 ff., 134, 138)\nB. Übereignung der Sache, § 929  → Einigung + Übergabe? Einigung wirksam? (nochmal §§ 104 ff.!)\nC. Übereignung des Geldes, § 929 → dasselbe\nD. Falls A unwirksam, B wirksam  → Rückabwicklung über § 812 I 1 (Leistungskondiktion)\n<\/code><\/pre>\n<h3 id=\"r-beispiel-aus-deinen-ubungsfallen\">Beispiel aus deinen Übungsfällen<\/h3>\n<p><strong>Fall 03 e) (Simson-Schwalbe)<\/strong> ist das perfekte Beispiel. Wörtlich aus der Musterlösung:<\/p>\n<blockquote>\n<p>„<strong>Übereignung der Schwalbe<\/strong>\nUrsprünglich war J Eigentümer des Mopeds. Er könnte sein Eigentum nach <strong>§ 929<\/strong> durch <strong>Einigung und Übergabe<\/strong> an N verloren haben. Angebot durch J (+). Annahme durch N? <strong>WE wirksam nach § 107, da die Einigung über den Eigentumsübergang einen lediglich rechtlichen Vorteil darstellt (+).<\/strong> Übergabe ist erfolgt ⇒ <strong>N ist Eigentümerin<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Merk dir das Ergebnis, weil es so schön absurd wirkt:<\/strong> Nancy schuldet die 200 € nicht (Kaufvertrag schwebend unwirksam) — aber das Moped gehört ihr trotzdem (Übereignung wirksam, weil rein vorteilhaft). Genau das ist das Abstraktionsprinzip in einem Satz. Jimmy müsste über <strong>§ 812<\/strong> zurückfordern.<\/p>\n<p><strong>Fall 04 f) (Schwalbe gegen 300 €, Wucher)<\/strong> zeigt die Rückabwicklungsrichtung:<\/p>\n<blockquote>\n<p><em>„§ 812 I — etwas erlangt (+) Eigentum am Moped — ohne Rechtsgrund? ursprünglich könnte Kaufvertrag zw A und J Rechtsgrund gewesen sein? könnte gemäß <\/em><em>§ 138 II<\/em><em> nichtig sein? • auffällige Missverhältnis zw Leistung und Gegenleistung (+) &gt; 100% Aufschlag • Ausnutzen der Zwangslage (+) ⇒ Rechtsgeschäft nach § 138 II nichtig ⇒ ohne Rechtsgrund (+). <\/em><em>Anspruch auf Rückübertragung aus § 812 I gegeben.<\/em><em>\"<\/em><\/p>\n<\/blockquote>","text":"Worum es hier geht — in einfachen Worten Ein Kauf besteht juristisch aus zwei getrennten Vorgängen : dem Versprechen („ich verkaufe dir das\") und der Übergabe („hier, jetzt gehört es dir\"). Im Alltag denkst du das als eine Sache. Das Recht trennt es. Warum? Damit nicht alles zusammenbricht, wenn eines von beiden schiefgeht. Das klingt nach Theorie, ist aber der Grund, warum am Ende so vieler Fälle § 812 auftaucht. Folie 14 (Original, vollständig): „⇒ Einschub: Das Abstraktionsprinzip als zentrales Konstruktionsprinzip im Zivilrecht – Jede vertragliche Vermögensverschiebung basiert auf zwei voneinander unabhängigen Rechtsgeschäften: - dem (schuldrechtlichen) Verpflichtungs(Kausal)-geschäft : „ich verspreche eine bestimmte Vermögensverschiebung\" - dem (sachenrechtlichen = dinglichen) Verfügungs(Erfüllungs-)geschäft : „ich bewirke die Vermögensverschiebung\" – Beide Geschäfte sind rechtlich unabhängig voneinander - Kauf und Eigentumsübertragung ( §§ 433, 929 ) - Leihe und Besitzübertragung ( §§ 598, 854 ) - Verlöbnis und Eheschließung ( §§ 1297, 1310 ) ⇒ im Minderjährigenrecht ist häufig das Verpflichtungsgeschäft problematisch, das Verfügungsgeschäft wegen § 107 ggfs. nicht \" Was das bedeutet — der Bäckerei-Klassiker Du kaufst ein Brötchen. Für dein Gefühl ist das ein Vorgang. Juristisch sind es drei : ① Kaufvertrag § 433 „Ich verspreche: du kriegst das Brötchen, ich kriege 60 Cent.\" → begründet nur PFLICHTEN. Noch gehört niemandem was Neues. ② Übereignung Brötchen § 929 Bäcker + du einigen euch + er übergibt → du wirst Eigentümer. ③ Übereignung der 60 Cent §929 Du + Bäcker einigen euch + du übergibst → er wird Eigentümer. Und jetzt der Clou: Diese drei Geschäfte sind rechtlich voneinander unabhängig. Ist ① nichtig, kann ② trotzdem wirksam sein. Warum das keine Haarspalterei ist Denk an eine Bestellung im Onlineshop. Montag. Du klickst „Kaufen\". Was hast du jetzt? Noch gar nichts. Du hast nur zwei Versprechen : Der Shop verspricht zu liefern, du versprichst zu zahlen. → Das ist das Verpflichtungsgeschäft . Donnerstag. Das Paket kommt. Jetzt gehört dir das Gerät wirklich. → Das ist das Verfügungsgeschäft . Zwei verschiedene Vorgänge, an zwei verschiedenen Tagen. Im Alltag sagst du „ich habe was gekauft\" und meinst beides zusammen. Juristisch sind das zwei Paar Schuhe. Und jetzt der Punkt, um den es wirklich geht: Stellt sich heraus, dass der Kaufvertrag vom Montag ungültig war — dann liegt das Gerät trotzdem bei dir zu Hause und gehört dir. Es springt nicht von allein zurück in den Shop. Man braucht einen zweiten Vorgang , um es zurückzuholen. Und genau dafür gibt es § 812 (Kapitel 15). Merk dir diese Verbindung, sie kommt in fast jedem Fall vor. Genau deshalb ist § 812 (ungerechtfertigte Bereicherung) so wichtig : Er ist der Rollback-Mechanismus. Wenn die Verpflichtung wegfällt, die Verfügung aber steht, holt § 812 die Sache zurück. Merke: Trennungsprinzip: Verpflichtung und Verfügung sind zwei getrennte Rechtsgeschäfte. Abstraktionsprinzip: Die Wirksamkeit des einen hängt nicht von der Wirksamkeit des anderen ab. § 812 ist das Reparaturwerkzeug, wenn beide auseinanderlaufen. Warum gibt es das überhaupt? Aus Gründen der Verkehrssicherheit . Stell dir vor, du kaufst ein gebrauchtes Auto. Der Verkäufer hatte es selbst gekauft — und in dieser Vorkette war irgendein Vertrag nichtig. Ohne Abstraktionsprinzip wäre dein Eigentum futsch, weil ein Fehler drei Stationen vorher durchschlägt. Mit Abstraktionsprinzip bleibt jede Übereignung für sich wirksam, und die Fehler werden nur zwischen den unmittelbar Beteiligten über § 812 bereinigt. 7.1 Verpflichtung vs. Verfügung — die Tabelle Verpflichtungsgeschäft Verfügungsgeschäft Auch genannt Kausalgeschäft, Grundgeschäft Erfüllungsgeschäft, dingliches Geschäft Was passiert? begründet eine Pflicht wirkt unmittelbar auf ein Recht ein (überträgt, belastet, ändert, hebt auf) BGB-Buch 2. Buch Schuldrecht 3. Buch Sachenrecht Beispiele Kauf § 433 · Miete § 535 · Werkvertrag § 631 · Schenkung § 516 · Leihe § 598 Übereignung § 929 · Abtretung § 398 · Besitzübertragung § 854 Für Minderjährige meist nachteilig (Pflicht!) oft lediglich vorteilhaft (nur Erwerb) § 433 ist ein gegenseitiger Vertrag: Der Verkäufer verpflichtet sich zu Übergabe und Eigentumsverschaffung (§ 433 I), der Käufer zur Kaufpreiszahlung und Abnahme (§ 433 II). Beide Seiten haben Pflichten — deshalb ist ein Kaufvertrag für einen Minderjährigen nie „lediglich rechtlich vorteilhaft\". § 929 hat zwei Voraussetzungen: Einigung + Übergabe. (Merkhilfe: „Einig sein und rübergeben.\") 7.2 Die Ausnahme: Fehleridentität Das steht auf Folie 26 und fehlte in deiner Liste: „Ganz überwiegend: Fehleridentität beim Verfügungsgeschäft \" Manchmal schlägt derselbe Fehler auf beide Geschäfte durch — dann sind beide unwirksam. Beispiele: - Geschäftsunfähigkeit (§ 105): Ein 6-Jähriger kann weder einen Kaufvertrag schließen noch wirksam übereignen. Beide WE sind nichtig. - Arglistige Täuschung (§ 123): Wer über beides getäuscht wurde, kann beides anfechten. - Sittenwidrigkeit (§ 138), wenn gerade die Übereignung sittenwidrig ist. Kein Durchschlagen dagegen bei: § 107 (weil die Verfügung ja vorteilhaft ist) und beim reinen Inhalts-/Erklärungsirrtum über den Preis (der betrifft nur den Kaufvertrag). 7.3 So schreibst du es in der Klausur Wenn im Fall gefragt wird „ Wer ist Eigentümer? \" — dann ist das dein Signal, getrennt zu prüfen: A. Kaufvertrag, § 433 → wirksam? (Angebot, Annahme, §§ 104 ff., 125 ff., 134, 138) B. Übereignung der Sache, § 929 → Einigung + Übergabe? Einigung wirksam? (nochmal §§ 104 ff.!) C. Übereignung des Geldes, § 929 → dasselbe D. Falls A unwirksam, B wirksam → Rückabwicklung über § 812 I 1 (Leistungskondiktion) Beispiel aus deinen Übungsfällen Fall 03 e) (Simson-Schwalbe) ist das perfekte Beispiel. Wörtlich aus der Musterlösung: „ Übereignung der Schwalbe Ursprünglich war J Eigentümer des Mopeds. Er könnte sein Eigentum nach § 929 durch Einigung und Übergabe an N verloren haben. Angebot durch J (+). Annahme durch N? WE wirksam nach § 107, da die Einigung über den Eigentumsübergang einen lediglich rechtlichen Vorteil darstellt (+). Übergabe ist erfolgt ⇒ N ist Eigentümerin \" Merk dir das Ergebnis, weil es so schön absurd wirkt: Nancy schuldet die 200 € nicht (Kaufvertrag schwebend unwirksam) — aber das Moped gehört ihr trotzdem (Übereignung wirksam, weil rein vorteilhaft). Genau das ist das Abstraktionsprinzip in einem Satz. Jimmy müsste über § 812 zurückfordern. Fall 04 f) (Schwalbe gegen 300 €, Wucher) zeigt die Rückabwicklungsrichtung: „§ 812 I — etwas erlangt (+) Eigentum am Moped — ohne Rechtsgrund? ursprünglich könnte Kaufvertrag zw A und J Rechtsgrund gewesen sein? könnte gemäß § 138 II nichtig sein? • auffällige Missverhältnis zw Leistung und Gegenleistung (+) > 100% Aufschlag • Ausnutzen der Zwangslage (+) ⇒ Rechtsgeschäft nach § 138 II nichtig ⇒ ohne Rechtsgrund (+). Anspruch auf Rückübertragung aus § 812 I gegeben. \"","words":1051,"mins":6},{"id":"r-8-unwirksamkeitsgründe","subject":"recht","num":"8","title":"8. Unwirksamkeitsgründe","short":"Unwirksamkeitsgründe","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nManchmal sind sich beide einig — und der Vertrag gilt trotzdem nicht.<\/p>\n<p>Dafür gibt es fünf Gründe: <strong>Kind · falsche Form · Gesetzesverstoß · Wucher oder Sittenwidrigkeit · Anfechtung.<\/strong><\/p>\n<p>Immer wenn dich im Sachverhalt etwas stutzig macht („darf man das überhaupt so?\"), gehst du diese fünf durch.<\/p>\n<\/blockquote>\n<p><strong>„Welche Unwirksamkeitsgründe kennen Sie? Nennen Sie Beispiele.\"<\/strong> — Das ist eine sehr wahrscheinliche Kurzfrage. Folie 13 listet sie in genau dieser Ordnung auf.<\/p>\n<p><strong>Folie 13 (Original):<\/strong><\/p>\n<blockquote>\n<p>„● <strong>Unwirksamkeitsgründe<\/strong>\n– <strong>formal<\/strong>:\n  - <strong>§§ 104 ff (Geschäftsfähigkeit)<\/strong>: Nichtigkeit – schwebende Unwirksamkeit – Taschengeldparagraph\n  - <strong>§§ 125 ff (Formmangel)<\/strong>: Schriftform – Textform – Elektronische Form – Notarielle Beurkundung – gewillkürte Form\n– <strong>inhaltlich<\/strong>:\n  - <strong>§ 134<\/strong> (verbotswidrig)\n  - <strong>§ 138 I, II<\/strong> (sittenwidrig)\n  - <strong>§ 142<\/strong> (erfolgreich angefochten)\"<\/p>\n<\/blockquote>\n<h3 id=\"r-die-merkliste-5-gruppen-so-aufsagen\">Die Merkliste (5 Gruppen, so aufsagen)<\/h3>\n<pre><code>FORMAL                              INHALTLICH\n① §§ 104 ff.  Geschäftsfähigkeit    ③ § 134   gesetzliches Verbot\n② §§ 125 ff.  Formmangel            ④ § 138   Sittenwidrigkeit / Wucher\n                                    ⑤ § 142   erfolgreich angefochten\n<\/code><\/pre>\n<p>Merkhilfe: <strong>„Kind – Form – Verbot – Sitte – Anfechtung.\"<\/strong><\/p>\n<h3 id=\"r-81-formmangel-125-ff\">8.1 Formmangel — §§ 125 ff.<\/h3>\n<p><strong>Folie 15 (Original):<\/strong><\/p>\n<blockquote>\n<p>„● <strong>Formale Unwirksamkeit durch Formmangel<\/strong>\n– Ein formbedürftiges Rechtsgeschäft, das die Form nicht einhält, ist <strong>nichtig<\/strong>: bei gesetzlich vorgeschriebener Form <strong>absolut<\/strong>; bei <strong>gewillkürter<\/strong> Schriftform <strong>„im Zweifel\"<\/strong> (Auslegung nach §§ 133, 157)\n– <strong>Schriftform nach § 126<\/strong> bei Darlehen (<strong>§ 492<\/strong>), bestimmte Mietverträge (<strong>§ 550<\/strong>), <strong>Bürgschaft (§ 766)<\/strong>, Kündigung von Miet- und Arbeitsverträgen (<strong>§§ 568, 623<\/strong>), Arbeitsverträge ab 2022 (<strong>§ 2 NachwG<\/strong>); ⚡ Fax\n– <strong>Beurkundung nach § 128<\/strong> bei <strong>Schenkung (§ 518)<\/strong>, <strong>Grundstückskauf und -übertragung (§§ 311b, 873, 925)<\/strong>, Ehe- und Erbvertrag (<strong>§§ 1410, 2276<\/strong>), GmbH-Gründung (<strong>§ 2 I GmbHG<\/strong>)\n– Aber: <strong>Formmängel können ggfs. geheilt werden: §§ 494 II, 518 II, 311b I, S. 2<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"r-der-grundgedanke-warum-gibt-es-formvorschriften\">Der Grundgedanke: Warum gibt es Formvorschriften?<\/h3>\n<p>Drei Zwecke:\n1. <strong>Warnfunktion<\/strong> — „Halt, das ist ernst!\" (Bürgschaft, Schenkung)\n2. <strong>Beweisfunktion<\/strong> — später nachweisbar (Arbeitsvertrag, Kündigung)\n3. <strong>Beratungsfunktion<\/strong> — der Notar erklärt dir, was du tust (Grundstückskauf)<\/p>\n<p><strong>Faustregel: Je gefährlicher das Geschäft, desto strenger die Form.<\/strong><\/p>\n<h3 id=\"r-die-formstufen\">Die Formstufen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Stufe<\/th>\n<th>§<\/th>\n<th>Was genau<\/th>\n<th>Beispiele<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Textform<\/strong><\/td>\n<td>§ 126b<\/td>\n<td>lesbar, dauerhaft, Name genannt — <strong>keine Unterschrift<\/strong><\/td>\n<td>E-Mail, Widerrufsbelehrung<\/td>\n<\/tr>\n<tr>\n<td><strong>Schriftform<\/strong><\/td>\n<td>§ 126<\/td>\n<td>Papier + <strong>eigenhändige Unterschrift<\/strong><\/td>\n<td>Bürgschaft § 766 · Kündigung Miete § 568 / Arbeit § 623 · Darlehen § 492 · best. Mietverträge § 550<\/td>\n<\/tr>\n<tr>\n<td><strong>Elektronische Form<\/strong><\/td>\n<td>§ 126a<\/td>\n<td>qualifizierte elektronische Signatur<\/td>\n<td>ersetzt Schriftform, wenn nicht ausgeschlossen<\/td>\n<\/tr>\n<tr>\n<td><strong>Notarielle Beurkundung<\/strong><\/td>\n<td>§ 128<\/td>\n<td>Notar verliest, berät, beurkundet<\/td>\n<td>Schenkungsversprechen § 518 · Grundstückskauf § 311b · Ehevertrag § 1410 · Erbvertrag § 2276 · GmbH-Gründung § 2 I GmbHG<\/td>\n<\/tr>\n<tr>\n<td><strong>Gewillkürte Form<\/strong><\/td>\n<td>§ 127<\/td>\n<td>die Parteien vereinbaren selbst eine Form<\/td>\n<td>„Änderungen bedürfen der Schriftform\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>⚡ <strong>Das Fax-Zeichen auf der Folie:<\/strong> Ein Fax wahrt die Schriftform <strong>nicht<\/strong>, weil beim Empfänger keine eigenhändige Unterschrift ankommt, sondern nur deren Abbild. Klassische Prüfungsfalle. Auch eine eingescannte Unterschrift in einer PDF reicht nicht.<\/p>\n<p><strong>Wichtiger Merksatz zur Kündigung:<\/strong> Eine Kündigung des Arbeitsvertrags per WhatsApp oder E-Mail ist <strong>nichtig<\/strong> (§§ 623, 125). Das ist ein sehr beliebtes Beispiel.<\/p>\n<h3 id=\"r-rechtsfolge-125\">Rechtsfolge § 125<\/h3>\n<ul>\n<li><strong>Gesetzliche Form<\/strong> nicht eingehalten → <strong>absolut nichtig<\/strong>. Kein Ermessen.<\/li>\n<li><strong>Gewillkürte Form<\/strong> nicht eingehalten → <strong>„im Zweifel\" nichtig<\/strong> (§ 125 S. 2), aber durch Auslegung §§ 133, 157 kann sich ergeben, dass die Parteien es nicht so streng meinten.<\/li>\n<\/ul>\n<h3 id=\"r-heilung\">Heilung<\/h3>\n<p>Die Folie nennt drei Heilungsvorschriften — sehr elegant, merk sie dir mit Beispiel:<\/p>\n<table>\n<thead>\n<tr>\n<th>§<\/th>\n<th>Geschäft<\/th>\n<th>Heilung durch<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>§ 518 II<\/strong><\/td>\n<td>Schenkungsversprechen<\/td>\n<td><strong>tatsächlichen Vollzug<\/strong> der Schenkung<\/td>\n<\/tr>\n<tr>\n<td><strong>§ 311b I S. 2<\/strong><\/td>\n<td>Grundstückskaufvertrag<\/td>\n<td><strong>Auflassung + Eintragung<\/strong> ins Grundbuch<\/td>\n<\/tr>\n<tr>\n<td><strong>§ 494 II<\/strong><\/td>\n<td>Verbraucherdarlehen<\/td>\n<td><strong>Empfang des Darlehens<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Alltagsbeispiel § 518:<\/strong> Oma sagt „Zum 18. schenke ich dir mein Auto.\" → Formnichtig (nicht notariell). Du kannst nicht klagen. <strong>Aber:<\/strong> Wenn Oma dir das Auto tatsächlich übergibt und übereignet, ist der Formmangel geheilt — sie kann es nicht zurückverlangen. <strong>Merksatz: Das Versprechen braucht Form, das Vollzogene nicht.<\/strong><\/p>\n<h3 id=\"r-82-gesetzliches-verbot-134\">8.2 Gesetzliches Verbot — § 134<\/h3>\n<p><strong>Folie 16 (Original):<\/strong><\/p>\n<blockquote>\n<p>„Verstößt ein Rechtsgeschäft gegen ein gesetzliches Verbot, ist es ebenfalls nichtig, <strong>§ 134<\/strong>; Beispiele: <strong>Schwarzarbeit<\/strong> (SchwarzArbG, AO, StGB), <strong>Alkohol- und Pornografieverkauf an Jugendliche<\/strong> (JuSchG, StGB), <strong>Hehlerware<\/strong>, etc.\"<\/p>\n<\/blockquote>\n<p><strong>Erklärung:<\/strong> Wenn ein Geschäft gegen ein Verbotsgesetz verstößt, ist es nichtig — es entfaltet gar keine Rechtswirkung.<\/p>\n<p><strong>Alltagsbeispiele:<\/strong>\n- Der Handwerker macht dein Bad „ohne Rechnung\" für 3.000 € bar. → § 134 i.V.m. SchwarzArbG. Der Vertrag ist nichtig. Er kann <strong>kein Geld verlangen<\/strong>, du kannst <strong>keine Mängelgewährleistung<\/strong> verlangen. Beide sind schutzlos.\n- Kioskbesitzer verkauft Schnaps an einen 15-Jährigen. → nichtig.\n- Kauf gestohlener Ware.<\/p>\n<p><strong>Was „nichtig\" praktisch bedeutet:<\/strong> Der Handwerker macht dein Bad „ohne Rechnung\" für 3.000 Euro in bar.<\/p>\n<p>Nichtig heißt <strong>nicht<\/strong> „gilt erstmal und wird später rückabgewickelt\". Es heißt: <strong>Es gab nie einen Vertrag.<\/strong> Deshalb kann der Handwerker sein Geld nicht einklagen — und du kannst nicht auf Gewährleistung pochen, wenn die Fliesen wieder abfallen. Beide stehen im Regen. Genau das ist die Strafe.<\/p>\n<h3 id=\"r-83-wucher-138-ii\">8.3 Wucher — § 138 II<\/h3>\n<p><strong>Folie 16 (Original):<\/strong><\/p>\n<blockquote>\n<p>„Ebenso ein wucherisches Rechtsgeschäft, <strong>§ 138 II<\/strong>. Beim Wucher nutzt der eine Geschäftspartner <strong>die Schwäche des anderen bewusst aus („subjektives Element\")<\/strong>, um sich selbst (oder einem Dritten) einen <strong>unangemessenen (Faustregel: das Doppelte des Üblichen)<\/strong> Vorteil zu verschaffen\"<\/p>\n<\/blockquote>\n<p><strong>Zwei Voraussetzungen — beide müssen vorliegen:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Was<\/th>\n<th>Prüfung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>objektiv<\/strong><\/td>\n<td>auffälliges Missverhältnis zwischen Leistung und Gegenleistung<\/td>\n<td><strong>Faustregel: das Doppelte des Üblichen<\/strong> (bzw. &gt; 100 % Aufschlag)<\/td>\n<\/tr>\n<tr>\n<td><strong>subjektiv<\/strong><\/td>\n<td><strong>bewusstes Ausnutzen<\/strong> einer Schwäche: Zwangslage, Unerfahrenheit, Mangel an Urteilsvermögen, erhebliche Willensschwäche<\/td>\n<td>Der Täter muss die Schwäche <em>kennen<\/em> und <em>ausnutzen<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Alltagsbeispiel:<\/strong> Dein Auto bleibt nachts auf der Autobahn liegen. Der Abschleppdienst verlangt 900 € statt der üblichen 200 €, weil er weiß, dass du keine Wahl hast. → Wucher.\nGegenbeispiel: Du kaufst in der Fußgängerzone eine überteuerte Sonnenbrille für 200 €, weil du keine Lust auf Preisvergleich hast. → <strong>kein<\/strong> Wucher. Du warst in keiner Zwangslage.<\/p>\n<h3 id=\"r-84-sittenwidrigkeit-138-i\">8.4 Sittenwidrigkeit — § 138 I<\/h3>\n<p><strong>Folie 16 (Original):<\/strong><\/p>\n<blockquote>\n<p>„Ebenso ein Rechtsgeschäft, das gegen die guten Sitten verstößt, <strong>§ 138 I<\/strong> (Maßstab: <strong>das Anstandsgefühl aller billig und gerecht Denkenden<\/strong>); <strong>als Spezialnorm ist zuvor § 138 II zu prüfen<\/strong> (Bsp.: Verträge zu Leihmutterschaften im Ausland, Verträge über Wechsel der Religionszugehörigkeit, Verabredungen zu Straftaten).\"<\/p>\n<p>⚠️ <strong>Reihenfolge merken: IMMER erst § 138 II (Wucher), dann § 138 I (Sittenwidrigkeit).<\/strong>\n§ 138 II ist die <strong>Spezialnorm<\/strong> — sie geht der allgemeinen Regel vor. Wenn du das umdrehst, ist es ein Aufbaufehler.\nMerkhilfe: <em>Speziell vor allgemein.<\/em> (In der Informatik: die spezifischere Überladung gewinnt.)<\/p>\n<\/blockquote>\n<p><strong>Die Definition auswendig:<\/strong> „Sittenwidrig ist, was gegen das <strong>Anstandsgefühl aller billig und gerecht Denkenden<\/strong> verstößt.\"<\/p>\n<p>Das ist bewusst eine <strong>Generalklausel<\/strong> — ein absichtlich unscharfer Auffangtatbestand, den die Rechtsprechung mit Leben füllt. In der Klausur brauchst du nur die Definition + eine Subsumtion mit Argument.<\/p>\n<p><strong>Beispiele des Dozenten:<\/strong> Leihmutterschaftsverträge im Ausland · Verträge über den Wechsel der Religionszugehörigkeit · Verabredungen zu Straftaten.<\/p>\n<p><strong>Wenn § 138 II am subjektiven Element scheitert:<\/strong> Dann kannst du bei krassem Missverhältnis immer noch § 138 I prüfen (sog. wucherähnliches Geschäft). Das ist ein guter Argumentationszug in der Klausur.<\/p>\n<h3 id=\"r-beispiele-aus-deinen-ubungsfallen-fall-04\">Beispiele aus deinen Übungsfällen (Fall 04)<\/h3>\n<p><strong>Fall 04 e) — Cannabis in der WG.<\/strong> Jimmy zahlt Nancy 50 € für 10 g. Original:<\/p>\n<blockquote>\n<p><em>„Jimmy möchte von Nancy die 50 EUR zurückhaben. <\/em><em>Anspruchsgrundlage hierfür könnte § 812 Abs. 1 sein.<\/em><em> Voraussetzung dafür wäre, dass Nancy etwas durch Leistung ohne rechtlichen Grund erlangt. […] Rechtlicher Grund könnte ein Kaufvertrag nach § 433 gewesen sein. J und N haben einen KV durch Angebot und Annahme geschlossen. Dieser könnte jedoch <\/em><em>nach § 134 nichtig<\/em><em> sein. Voraussetzung dafür wäre, dass der Vertrag gegen ein gesetzliches Verbot verstößt. <\/em><em>Der Verkauf von Cannabis nicht zum Eigenkonsum ist nach wie vor strafbar.<\/em><em> Daher ist der Kaufvertrag nach § 134 nichtig. Folglich ist die Leistung der 50 EUR ohne Rechtsgrund erfolgt. <\/em><em>Folglich hat Jimmy einen Anspruch auf gezahlten 50 EUR.<\/em><em>\"<\/em><\/p>\n<\/blockquote>\n<p>Beachte den Aufbau: § 812 ist die <strong>Anspruchsgrundlage<\/strong>, § 134 ist nur die <strong>Vorfrage<\/strong> („liegt ein Rechtsgrund vor?\"). Genau so machst du es.<\/p>\n<p><strong>Fall 04 f) — die Schwalbe für 300 €.<\/strong> Anneliese leiht Jimmy immer wieder Geld; als er wieder anpumpt, verlangt sie das 750 € wertige Moped für 300 €. Original:<\/p>\n<blockquote>\n<p><em>„§ 812 I — etwas erlangt (+) Eigentum am Moped — ohne Rechtsgrund? […] könnte gemäß <\/em><em>§ 138 II<\/em><em> nichtig sein? • <\/em><em>auffällige Missverhältnis zw Leistung und Gegenleistung (+) &gt; 100% Aufschlag<\/em><em> • <\/em><em>Ausnutzen der Zwangslage (+)<\/em><em> ⇒ Rechtsgeschäft nach § 138 II nichtig ⇒ ohne Rechtsgrund (+). Anspruch auf Rückübertragung aus § 812 I gegeben.\"<\/em><\/p>\n<\/blockquote>\n<p>Und der Dozent fügt in derselben Datei ausdrücklich hinzu:<\/p>\n<blockquote>\n<p><em>„Eine andere Argumentation, nach der angesichts der <\/em><em>Historie des Anpumpens in der Gesamtschau kein auffälliges Missverhältnis<\/em><em> zwischen Leistung und Gegenleistung vorliegt, ist ebenfalls <\/em><em>gut vertretbar<\/em><em>.\"<\/em><\/p>\n<\/blockquote>\n<p>Wieder: <strong>Argumentation zählt, nicht das Ergebnis.<\/strong><\/p>","text":"Worum es hier geht — in einfachen Worten Manchmal sind sich beide einig — und der Vertrag gilt trotzdem nicht. Dafür gibt es fünf Gründe: Kind · falsche Form · Gesetzesverstoß · Wucher oder Sittenwidrigkeit · Anfechtung. Immer wenn dich im Sachverhalt etwas stutzig macht („darf man das überhaupt so?\"), gehst du diese fünf durch. „Welche Unwirksamkeitsgründe kennen Sie? Nennen Sie Beispiele.\" — Das ist eine sehr wahrscheinliche Kurzfrage. Folie 13 listet sie in genau dieser Ordnung auf. Folie 13 (Original): „● Unwirksamkeitsgründe – formal : - §§ 104 ff (Geschäftsfähigkeit) : Nichtigkeit – schwebende Unwirksamkeit – Taschengeldparagraph - §§ 125 ff (Formmangel) : Schriftform – Textform – Elektronische Form – Notarielle Beurkundung – gewillkürte Form – inhaltlich : - § 134 (verbotswidrig) - § 138 I, II (sittenwidrig) - § 142 (erfolgreich angefochten)\" Die Merkliste (5 Gruppen, so aufsagen) FORMAL INHALTLICH ① §§ 104 ff. Geschäftsfähigkeit ③ § 134 gesetzliches Verbot ② §§ 125 ff. Formmangel ④ § 138 Sittenwidrigkeit / Wucher ⑤ § 142 erfolgreich angefochten Merkhilfe: „Kind – Form – Verbot – Sitte – Anfechtung.\" 8.1 Formmangel — §§ 125 ff. Folie 15 (Original): „● Formale Unwirksamkeit durch Formmangel – Ein formbedürftiges Rechtsgeschäft, das die Form nicht einhält, ist nichtig : bei gesetzlich vorgeschriebener Form absolut ; bei gewillkürter Schriftform „im Zweifel\" (Auslegung nach §§ 133, 157) – Schriftform nach § 126 bei Darlehen ( § 492 ), bestimmte Mietverträge ( § 550 ), Bürgschaft (§ 766) , Kündigung von Miet- und Arbeitsverträgen ( §§ 568, 623 ), Arbeitsverträge ab 2022 ( § 2 NachwG ); ⚡ Fax – Beurkundung nach § 128 bei Schenkung (§ 518) , Grundstückskauf und -übertragung (§§ 311b, 873, 925) , Ehe- und Erbvertrag ( §§ 1410, 2276 ), GmbH-Gründung ( § 2 I GmbHG ) – Aber: Formmängel können ggfs. geheilt werden: §§ 494 II, 518 II, 311b I, S. 2 \" Der Grundgedanke: Warum gibt es Formvorschriften? Drei Zwecke: 1. Warnfunktion — „Halt, das ist ernst!\" (Bürgschaft, Schenkung) 2. Beweisfunktion — später nachweisbar (Arbeitsvertrag, Kündigung) 3. Beratungsfunktion — der Notar erklärt dir, was du tust (Grundstückskauf) Faustregel: Je gefährlicher das Geschäft, desto strenger die Form. Die Formstufen Stufe § Was genau Beispiele Textform § 126b lesbar, dauerhaft, Name genannt — keine Unterschrift E-Mail, Widerrufsbelehrung Schriftform § 126 Papier + eigenhändige Unterschrift Bürgschaft § 766 · Kündigung Miete § 568 / Arbeit § 623 · Darlehen § 492 · best. Mietverträge § 550 Elektronische Form § 126a qualifizierte elektronische Signatur ersetzt Schriftform, wenn nicht ausgeschlossen Notarielle Beurkundung § 128 Notar verliest, berät, beurkundet Schenkungsversprechen § 518 · Grundstückskauf § 311b · Ehevertrag § 1410 · Erbvertrag § 2276 · GmbH-Gründung § 2 I GmbHG Gewillkürte Form § 127 die Parteien vereinbaren selbst eine Form „Änderungen bedürfen der Schriftform\" ⚡ Das Fax-Zeichen auf der Folie: Ein Fax wahrt die Schriftform nicht , weil beim Empfänger keine eigenhändige Unterschrift ankommt, sondern nur deren Abbild. Klassische Prüfungsfalle. Auch eine eingescannte Unterschrift in einer PDF reicht nicht. Wichtiger Merksatz zur Kündigung: Eine Kündigung des Arbeitsvertrags per WhatsApp oder E-Mail ist nichtig (§§ 623, 125). Das ist ein sehr beliebtes Beispiel. Rechtsfolge § 125 Gesetzliche Form nicht eingehalten → absolut nichtig . Kein Ermessen. Gewillkürte Form nicht eingehalten → „im Zweifel\" nichtig (§ 125 S. 2), aber durch Auslegung §§ 133, 157 kann sich ergeben, dass die Parteien es nicht so streng meinten. Heilung Die Folie nennt drei Heilungsvorschriften — sehr elegant, merk sie dir mit Beispiel: § Geschäft Heilung durch § 518 II Schenkungsversprechen tatsächlichen Vollzug der Schenkung § 311b I S. 2 Grundstückskaufvertrag Auflassung + Eintragung ins Grundbuch § 494 II Verbraucherdarlehen Empfang des Darlehens Alltagsbeispiel § 518: Oma sagt „Zum 18. schenke ich dir mein Auto.\" → Formnichtig (nicht notariell). Du kannst nicht klagen. Aber: Wenn Oma dir das Auto tatsächlich übergibt und übereignet, ist der Formmangel geheilt — sie kann es nicht zurückverlangen. Merksatz: Das Versprechen braucht Form, das Vollzogene nicht. 8.2 Gesetzliches Verbot — § 134 Folie 16 (Original): „Verstößt ein Rechtsgeschäft gegen ein gesetzliches Verbot, ist es ebenfalls nichtig, § 134 ; Beispiele: Schwarzarbeit (SchwarzArbG, AO, StGB), Alkohol- und Pornografieverkauf an Jugendliche (JuSchG, StGB), Hehlerware , etc.\" Erklärung: Wenn ein Geschäft gegen ein Verbotsgesetz verstößt, ist es nichtig — es entfaltet gar keine Rechtswirkung. Alltagsbeispiele: - Der Handwerker macht dein Bad „ohne Rechnung\" für 3.000 € bar. → § 134 i.V.m. SchwarzArbG. Der Vertrag ist nichtig. Er kann kein Geld verlangen , du kannst keine Mängelgewährleistung verlangen. Beide sind schutzlos. - Kioskbesitzer verkauft Schnaps an einen 15-Jährigen. → nichtig. - Kauf gestohlener Ware. Was „nichtig\" praktisch bedeutet: Der Handwerker macht dein Bad „ohne Rechnung\" für 3.000 Euro in bar. Nichtig heißt nicht „gilt erstmal und wird später rückabgewickelt\". Es heißt: Es gab nie einen Vertrag. Deshalb kann der Handwerker sein Geld nicht einklagen — und du kannst nicht auf Gewährleistung pochen, wenn die Fliesen wieder abfallen. Beide stehen im Regen. Genau das ist die Strafe. 8.3 Wucher — § 138 II Folie 16 (Original): „Ebenso ein wucherisches Rechtsgeschäft, § 138 II . Beim Wucher nutzt der eine Geschäftspartner die Schwäche des anderen bewusst aus („subjektives Element\") , um sich selbst (oder einem Dritten) einen unangemessenen (Faustregel: das Doppelte des Üblichen) Vorteil zu verschaffen\" Zwei Voraussetzungen — beide müssen vorliegen: Was Prüfung objektiv auffälliges Missverhältnis zwischen Leistung und Gegenleistung Faustregel: das Doppelte des Üblichen (bzw. > 100 % Aufschlag) subjektiv bewusstes Ausnutzen einer Schwäche: Zwangslage, Unerfahrenheit, Mangel an Urteilsvermögen, erhebliche Willensschwäche Der Täter muss die Schwäche kennen und ausnutzen Alltagsbeispiel: Dein Auto bleibt nachts auf der Autobahn liegen. Der Abschleppdienst verlangt 900 € statt der üblichen 200 €, weil er weiß, dass du keine Wahl hast. → Wucher. Gegenbeispiel: Du kaufst in der Fußgängerzone eine überteuerte Sonnenbrille für 200 €, weil du keine Lust auf Preisvergleich hast. → kein Wucher. Du warst in keiner Zwangslage. 8.4 Sittenwidrigkeit — § 138 I Folie 16 (Original): „Ebenso ein Rechtsgeschäft, das gegen die guten Sitten verstößt, § 138 I (Maßstab: das Anstandsgefühl aller billig und gerecht Denkenden ); als Spezialnorm ist zuvor § 138 II zu prüfen (Bsp.: Verträge zu Leihmutterschaften im Ausland, Verträge über Wechsel der Religionszugehörigkeit, Verabredungen zu Straftaten).\" ⚠️ Reihenfolge merken: IMMER erst § 138 II (Wucher), dann § 138 I (Sittenwidrigkeit). § 138 II ist die Spezialnorm — sie geht der allgemeinen Regel vor. Wenn du das umdrehst, ist es ein Aufbaufehler. Merkhilfe: Speziell vor allgemein. (In der Informatik: die spezifischere Überladung gewinnt.) Die Definition auswendig: „Sittenwidrig ist, was gegen das Anstandsgefühl aller billig und gerecht Denkenden verstößt.\" Das ist bewusst eine Generalklausel — ein absichtlich unscharfer Auffangtatbestand, den die Rechtsprechung mit Leben füllt. In der Klausur brauchst du nur die Definition + eine Subsumtion mit Argument. Beispiele des Dozenten: Leihmutterschaftsverträge im Ausland · Verträge über den Wechsel der Religionszugehörigkeit · Verabredungen zu Straftaten. Wenn § 138 II am subjektiven Element scheitert: Dann kannst du bei krassem Missverhältnis immer noch § 138 I prüfen (sog. wucherähnliches Geschäft). Das ist ein guter Argumentationszug in der Klausur. Beispiele aus deinen Übungsfällen (Fall 04) Fall 04 e) — Cannabis in der WG. Jimmy zahlt Nancy 50 € für 10 g. Original: „Jimmy möchte von Nancy die 50 EUR zurückhaben. Anspruchsgrundlage hierfür könnte § 812 Abs. 1 sein. Voraussetzung dafür wäre, dass Nancy etwas durch Leistung ohne rechtlichen Grund erlangt. […] Rechtlicher Grund könnte ein Kaufvertrag nach § 433 gewesen sein. J und N haben einen KV durch Angebot und Annahme geschlossen. Dieser könnte jedoch nach § 134 nichtig sein. Voraussetzung dafür wäre, dass der Vertrag gegen ein gesetzliches Verbot verstößt. Der Verkauf von Cannabis nicht zum Eigenkonsum ist nach wie vor strafbar. Daher ist der Kaufvertrag nach § 134 nichtig. Folglich ist die Leistung der 50 EUR ohne Rechtsgrund erfolgt. Folglich hat Jimmy einen Anspruch auf gezahlten 50 EUR. \" Beachte den Aufbau: § 812 ist die Anspruchsgrundlage , § 134 ist nur die Vorfrage („liegt ein Rechtsgrund vor?\"). Genau so machst du es. Fall 04 f) — die Schwalbe für 300 €. Anneliese leiht Jimmy immer wieder Geld; als er wieder anpumpt, verlangt sie das 750 € wertige Moped für 300 €. Original: „§ 812 I — etwas erlangt (+) Eigentum am Moped — ohne Rechtsgrund? […] könnte gemäß § 138 II nichtig sein? • auffällige Missverhältnis zw Leistung und Gegenleistung (+) > 100% Aufschlag • Ausnutzen der Zwangslage (+) ⇒ Rechtsgeschäft nach § 138 II nichtig ⇒ ohne Rechtsgrund (+). Anspruch auf Rückübertragung aus § 812 I gegeben.\" Und der Dozent fügt in derselben Datei ausdrücklich hinzu: „Eine andere Argumentation, nach der angesichts der Historie des Anpumpens in der Gesamtschau kein auffälliges Missverhältnis zwischen Leistung und Gegenleistung vorliegt, ist ebenfalls gut vertretbar .\" Wieder: Argumentation zählt, nicht das Ergebnis.","words":1438,"mins":8},{"id":"r-9-vertragsschluss","subject":"recht","num":"9","title":"9. Vertragsschluss","short":"Vertragsschluss","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nWie entsteht ein Vertrag? Einer macht ein Angebot, der andere nimmt an. Fertig.<\/p>\n<p>So einfach ist es im Grundsatz — und die Fallen stecken alle im Detail: Ist ein Preisschild im Schaufenster schon ein Angebot? Was passiert, wenn jemand „Ja, aber…\" sagt? Was, wenn beide unterschiedliche AGB verwenden?<\/p>\n<p>Genau diese Details werden geprüft.<\/p>\n<\/blockquote>\n<p>Ein Vertrag entsteht durch <strong>zwei aufeinander bezogene Willenserklärungen<\/strong>: Angebot (§ 145) und Annahme.<\/p>\n<h3 id=\"r-91-das-angebot-der-antrag-145\">9.1 Das Angebot / der Antrag — § 145<\/h3>\n<p><strong>Folie 17 (Original):<\/strong><\/p>\n<blockquote>\n<p>„● Initiiert wird der Vertrag durch Übermittlung eines <strong>Angebots/Antrags, § 145<\/strong>\n– Der Antrag ist eine <strong>WE<\/strong> und muss alle Merkmale enthalten, insb. den <strong>ernsthaften Rechtsbindungswillen<\/strong> (lese <strong>§§ 116–118<\/strong>), anders: Aufforderung zur Abgabe eines Angebots (<strong>„invitatio ad offerendum\"<\/strong> – ist aber schon ein <strong>gesetzliches Schuldverhältnis, vgl. § 311 II, Nr. 1-3<\/strong>)\n– Enthält <strong>alle vertragswesentlichen Elemente so, dass nur noch „ja\" gesagt werden muss („essentialia negotii\"): Vertragspartner, Vertragsgegenstand, Gegenleistung<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"r-die-essentialia-negotii-der-nur-noch-ja-sagen-test\">Die essentialia negotii — der „nur-noch-ja-sagen\"-Test<\/h3>\n<p>Ein Angebot ist nur dann ein Angebot, wenn der andere <strong>nur noch „ja\" sagen muss<\/strong>. Drei Bestandteile:<\/p>\n<ol>\n<li><strong>Vertragspartner<\/strong> (wer?)<\/li>\n<li><strong>Vertragsgegenstand<\/strong> (was?)<\/li>\n<li><strong>Gegenleistung<\/strong> (wieviel?)<\/li>\n<\/ol>\n<p><strong>Der Test ist ganz simpel: Kann der andere einfach „Ja\" sagen — und alles ist klar?<\/strong><\/p>\n<ul>\n<li>„Ich möchte dein Fahrrad kaufen.\" → Ja … und zu welchem Preis? Nicht klar. <strong>Kein Angebot.<\/strong><\/li>\n<li>„Ich kaufe dein Fahrrad für 50 Euro.\" → Ja. Fertig, beide wissen alles. <strong>Angebot.<\/strong><\/li>\n<\/ul>\n<pre><code class=\"language-java\">angebot(partner: Anneliese, gegenstand: Fahrrad, preis: 50_EUR)   // ✓ § 145\nangebot(partner: Anneliese, gegenstand: Fahrrad, preis: ???)      // ✗ kein Angebot\n<\/code><\/pre>\n<p><strong>Fall 05 a)<\/strong> zeigt das exakt: Anneliese sagt „ich möchte dein Fahrrad kaufen\".<\/p>\n<blockquote>\n<p><em>„<\/em><em>Kein Preis benannt, essentialia negotii nicht definiert ⇒ kein Angebot nach § 145<\/em><em>\"<\/em><\/p>\n<\/blockquote>\n<h3 id=\"r-116118-kein-ernsthafter-rechtsbindungswille\">§§ 116–118 — kein ernsthafter Rechtsbindungswille<\/h3>\n<p>Die Folie sagt „lese §§ 116–118\". Kurz:\n- <strong>§ 116<\/strong> Geheimer Vorbehalt: Du denkst innerlich „ich meine es nicht ernst\", sagst es aber nicht → <strong>WE ist trotzdem wirksam.<\/strong> Dein Innenleben interessiert nicht.\n- <strong>§ 117<\/strong> Scheingeschäft: Beide sind sich einig, dass es nur zum Schein ist → <strong>nichtig.<\/strong> (Klassiker: Schwarzkauf beim Grundstück, im Vertrag steht ein zu niedriger Preis.)\n- <strong>§ 118<\/strong> Scherzerklärung: Du erwartest, dass der andere den Scherz erkennt → <strong>nichtig<\/strong>, aber du schuldest Schadensersatz nach § 122.<\/p>\n<h3 id=\"r-92-invitatio-ad-offerendum\">9.2 invitatio ad offerendum<\/h3>\n<blockquote>\n<p><strong>invitatio ad offerendum<\/strong> = „Einladung, ein Angebot abzugeben\". Es ist <strong>kein<\/strong> Angebot, sondern nur Werbung.<\/p>\n<\/blockquote>\n<p><strong>Warum gibt es das?<\/strong> Der Verkäufer will sich nicht binden — er hat vielleicht nur begrenzten Vorrat oder will sich den Kunden aussuchen können. Wäre das Schaufenster ein Angebot, könnten 500 Leute gleichzeitig „ja\" sagen und der Händler müsste 500-mal liefern.<\/p>\n<p><strong>Typische invitationes:<\/strong> Schaufensterauslage · Warenauslage im Supermarkt · Werbeprospekt · Zeitungsanzeige · Speisekarte · meistens auch der Online-Shop-Katalog.<\/p>\n<p><strong>Wer macht dann das Angebot?<\/strong> Der <strong>Kunde<\/strong> — indem er die Ware an die Kasse legt oder auf „Kaufen\" klickt. Der Händler nimmt an.<\/p>\n<p><strong>Aber Achtung, die Folie ergänzt etwas Wichtiges:<\/strong><\/p>\n<blockquote>\n<p><em>„ist aber schon ein <\/em><em>gesetzliches Schuldverhältnis, vgl. § 311 II, Nr. 1-3<\/em><em>\"<\/em><\/p>\n<\/blockquote>\n<p>Auch ohne Vertrag entstehen schon <strong>Schutzpflichten<\/strong>. Wenn du im Supermarkt auf einer Bananenschale ausrutschst, hast du einen Anspruch aus <strong>c.i.c. (§§ 311 II, 241 II, 280)<\/strong> — obwohl du noch gar nichts gekauft hast. Siehe Kapitel 15.<\/p>\n<h3 id=\"r-93-die-annahme\">9.3 Die Annahme<\/h3>\n<p><strong>Folie 19 (Original):<\/strong><\/p>\n<blockquote>\n<p>„● Geschlossen wird der Vertrag durch eine <strong>auf den Antrag bezogene Annahme<\/strong>\n– Ist ebenfalls eine WE und muss alle Merkmale enthalten\n– Ausdrücklich oder konkludent, ggfs. <strong>verzichtbar bei Üblichkeit oder Verabredung, § 151<\/strong>\n– Innerhalb der Frist, <strong>§§ 147, 148<\/strong>\n– Bei <strong>offenem Dissenz<\/strong>, im Zweifel kein Vertragsschluss, <strong>§§ 154; 133, 157<\/strong>\n– bei <strong>verstecktem Dissenz<\/strong> Auslegung, <strong>§§ 155, 133, 157<\/strong>\n– Eine <strong>veränderte oder verspätete Annahme ist ein neuer Antrag, §§ 150, 145 ff<\/strong>\"<\/p>\n<\/blockquote>\n<h3 id=\"r-die-annahmefristen\">Die Annahmefristen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>§<\/th>\n<th>Frist<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Unter <strong>Anwesenden<\/strong> (auch Telefon, Video)<\/td>\n<td>§ 147 I<\/td>\n<td><strong>sofort<\/strong> — wer nicht sofort ja sagt, hat abgelehnt<\/td>\n<\/tr>\n<tr>\n<td>Unter <strong>Abwesenden<\/strong><\/td>\n<td>§ 147 II<\/td>\n<td>bis zu dem Zeitpunkt, zu dem der Antragende die Antwort <em>unter regelmäßigen Umständen erwarten darf<\/em><\/td>\n<\/tr>\n<tr>\n<td>Antragender hat <strong>Frist gesetzt<\/strong><\/td>\n<td>§ 148<\/td>\n<td>genau diese Frist<\/td>\n<\/tr>\n<tr>\n<td>Annahme <strong>ohne Zugang<\/strong><\/td>\n<td>§ 151<\/td>\n<td>wenn Zugang nach der Verkehrssitte nicht zu erwarten ist<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>§ 151 in echt:<\/strong> Du bestellst online. Der Händler schickt die Ware, ohne dir vorher eine Annahmeerklärung zu schicken. Der Vertrag kommt trotzdem zustande — die Annahme muss dir nicht zugehen, weil das im Versandhandel unüblich ist.<\/p>\n<h3 id=\"r-94-150-verspatete-oder-veranderte-annahme\">9.4 ★ § 150 — Verspätete oder veränderte Annahme<\/h3>\n<p><strong>Das ist die wahrscheinlichste Detailfrage der ganzen Klausur.<\/strong> Der Dozent hebt sie auf Folie 19 hervor.<\/p>\n<blockquote>\n<p><strong>Eine verspätete Annahme oder eine Annahme unter Änderungen gilt als Ablehnung, verbunden mit einem neuen Antrag. § 150.<\/strong><\/p>\n<\/blockquote>\n<p>Zwei Effekte gleichzeitig:\n1. Das <strong>ursprüngliche Angebot ist tot<\/strong> (§ 146: erloschen durch Ablehnung).\n2. Es liegt ein <strong>neuer Antrag<\/strong> vor — jetzt muss der ursprüngliche Anbieter annehmen.<\/p>\n<p><strong>Die Rollen drehen sich um.<\/strong><\/p>\n<p><strong>Alltagsbeispiel:<\/strong> Du bietest dein Fahrrad für 100 €. Der Käufer sagt: „Ja, aber für 80 €.\" → Das ist <strong>keine<\/strong> Annahme. Dein Angebot ist erloschen. Sein „Ja, aber\" ist ein neues Angebot über 80 €. Jetzt musst <strong>du<\/strong> entscheiden.<\/p>\n<p><strong>Beispiel vom Flohmarkt:<\/strong> Du bietest deine Jacke für 30 Euro an. Der andere sagt: <strong>„Ja, für 20.\"<\/strong><\/p>\n<p>Das ist <strong>kein<\/strong> Ja. Und jetzt kommt der Teil, den man leicht übersieht: Dein Angebot über 30 Euro ist damit <strong>endgültig vom Tisch<\/strong>. Auf dem Tisch liegt nur noch sein Angebot über 20 Euro — und <strong>du<\/strong> musst entscheiden.<\/p>\n<p>Sagst du „nein, doch nicht\", kann er nicht auf die 30 Euro zurück. Die gibt es nicht mehr. Er müsste dir neu 30 Euro anbieten, und dann müsstest <strong>du<\/strong> wieder Ja sagen.<\/p>\n<p><strong>Fall 05 b) zeigt das dreimal hintereinander.<\/strong> Original:<\/p>\n<blockquote>\n<p><em>„Angebot von Denny hätte <\/em><em>nur sofort angenommen werden können, § 147 I<\/em><em>; <\/em><em>verspätete Annahme durch Anneliese (zusätzlich unter Erweiterungen) = neues Angebot, § 150 I<\/em><em>; Denny hat angenommen; <\/em><em>Veränderung der Bezahlungsart ist neues Angebot zur Vertragsänderung<\/em><em>, wurde angenommen.\"<\/em><\/p>\n<\/blockquote>\n<p>Erst zu spät + verändert (putzen!) → neues Angebot. Dann PayPal statt bar → wieder neues Angebot. Bei so einem Fall gehst du chronologisch durch und prüfst jede Erklärung einzeln.<\/p>\n<h3 id=\"r-95-dissens-154-155\">9.5 Dissens — §§ 154, 155<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Offener Dissens<\/strong> § 154<\/th>\n<th><strong>Versteckter Dissens<\/strong> § 155<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Was<\/td>\n<td>Beide <strong>wissen<\/strong>, dass sie sich noch nicht über alles einig sind<\/td>\n<td>Beide <strong>glauben<\/strong>, einig zu sein, sind es aber nicht<\/td>\n<\/tr>\n<tr>\n<td>Folge<\/td>\n<td><strong>Im Zweifel kein Vertrag<\/strong><\/td>\n<td>Vertrag gilt <strong>„im Übrigen\"<\/strong>, wenn er auch ohne den strittigen Punkt geschlossen worden wäre<\/td>\n<\/tr>\n<tr>\n<td>Werkzeug<\/td>\n<td>Auslegung §§ 133, 157<\/td>\n<td>Auslegung §§ 133, 157<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Fall 05 e) — der AGB-/Gerichtsstands-Fall.<\/strong> Jimmy bestellt mit AGB „Gerichtsstand München\", Nancy liefert mit Lieferschein „Gerichtsstand Frankfurt\". Original-Lösung:<\/p>\n<blockquote>\n<p><em>„Angebot durch Bestellformular einschl. AGB. Annahme durch Lieferung m. abweichenden AGB ⇒ <\/em><em>versteckter Dissens (bzgl. Gerichtsstands) § 155<\/em><em>. Alles, worüber sie sich geeinigt haben, gilt, wenn die Auslegung §§ 133, 157 ergibt, dass der Vertrag auch ohne den Punkt des Dissenses geschlossen werden sollte. Auslegung ergibt, dass die Parteien den Vertrag nicht an den unterschiedlichen Gerichtsständen scheitern lassen wollten. Dem entsprechend gilt der Vertrag „im übrigen\", § 155. <\/em><em>Nach der Rspr. gilt in einem solchen Fall das Gesetz!<\/em><em> ⇒ Klage muss am Sitz des Beklagten eingereicht werden.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Merke die Pointe:<\/strong> Wenn sich zwei AGB widersprechen, fällt <strong>beides<\/strong> weg und das <strong>Gesetz<\/strong> greift ein. Das nennt man „Theorie des letzten Wortes\" bzw. Restgültigkeitstheorie.<\/p>\n<h3 id=\"r-96-agb-305-ff\">9.6 AGB — §§ 305 ff.<\/h3>\n<p><strong>Folie 17 (Original):<\/strong><\/p>\n<blockquote>\n<p>„– Enthält ggfs. auch <strong>„Allgemeine Geschäftsbedingungen\", §§ 305 ff<\/strong>\n– <strong>Für eine Vielzahl von Verträgen vorformuliert, unabhängig von der Gestaltung und Vertragsform, § 305 I<\/strong>\n– <strong>Einbezogen durch Hinweis und Möglichkeit der Kenntnisnahme, § 305 II<\/strong>\n– <strong>Inhaltlich zulässig (keine nach Treu und Glauben unangemessene Benachteiligung), §§ 307 – 309<\/strong>\"<\/p>\n<\/blockquote>\n<p>Der Dreischritt für die Klausur:<\/p>\n<pre><code>① § 305 I   Sind es überhaupt AGB?  → für eine VIELZAHL von Verträgen VORFORMULIERT,\n                                       einseitig gestellt. (Individuell ausgehandelt = keine AGB)\n② § 305 II  Wirksam EINBEZOGEN?     → ausdrücklicher HINWEIS + Möglichkeit der KENNTNISNAHME\n                                       + Einverständnis\n③ §§ 307-309 INHALTSKONTROLLE       → § 309 Klauselverbote OHNE Wertungsmöglichkeit (schwarze Liste)\n                                       § 308 Klauselverbote MIT Wertungsmöglichkeit (graue Liste)\n                                       § 307 Generalklausel: unangemessene Benachteiligung\n                                              nach Treu und Glauben\n<\/code><\/pre>\n<p><strong>Alltagsbeispiel für § 305 II:<\/strong> Auf der Rückseite eines Kassenzettels stehen AGB in 4pt-Schrift → nicht wirksam einbezogen, keine zumutbare Kenntnisnahme. Im Onlineshop musst du eine Checkbox anklicken und der Text ist verlinkt → wirksam einbezogen.<\/p>\n<blockquote>\n<p><strong>Folie 18<\/strong> („Jüngste Beispiele aus der BGH-Rspr. für unwirksame AGB-Klauseln im Bankenrecht, Mietrecht und Arbeitsrecht\") ist <strong>reines Zusatzmaterial<\/strong>. Da hattest du mit deiner Einschätzung recht — kenn den Dreischritt oben, mehr braucht es nicht.<\/p>\n<\/blockquote>\n<h3 id=\"r-97-241a-unbestellte-leistungen-fehlte-in-deiner-liste\">9.7 § 241a — Unbestellte Leistungen (fehlte in deiner Liste!)<\/h3>\n<p>Der Dozent bringt das in <strong>zwei<\/strong> Übungsfällen. Das ist kein Zufall.<\/p>\n<blockquote>\n<p><strong>§ 241a:<\/strong> Bei einer <strong>unbestellten Lieferung<\/strong> durch einen <strong>Unternehmer (§ 14)<\/strong> an einen <strong>Verbraucher (§ 13)<\/strong> wird <strong>kein Anspruch<\/strong> des Unternehmers begründet — weder auf Zahlung noch auf Rückgabe.<\/p>\n<\/blockquote>\n<p><strong>Alltagsbeispiel:<\/strong> Dir wird unaufgefordert ein Buch mit Rechnung zugeschickt. Du musst weder zahlen noch zurückschicken noch dich melden. Du darfst es sogar behalten und benutzen.<\/p>\n<p><strong>Fall 05 c) — die Obstkiste.<\/strong> Denny schickt Anneliese ungefragt eine Kiste Obst mit Rechnung über 15 €. Sie isst die Erdbeeren und bringt den Rest zurück. Original-Lösung:<\/p>\n<blockquote>\n<p><em>„Anspruch des Denny auf Zahlung von 15 EUR aus § 433 BGB. Voraussetzung: geschlossener Kaufvertrag, § 145: Angebot und Annahme\n• Angebot durch Übersendung (Gegenstand, Vertragspartner, Preis +)\n• Annahme durch A: durch bloße Entgegennahme (-), weil keine entsprechende WE. Teilannahme (verändertes Angebot nach <\/em><em>§ 150<\/em><em> bzgl. Erdbeeren? Ja!, aber <\/em><em>Bindung vernichtet durch Verbraucherschutz § 241a<\/em><em>? <\/em><em>Unbestellte Lieferung (+), durch Unternehmer § 14 (+), an Verbraucher § 13 (+)<\/em><em>\n<\/em><em>Dem entsprechend nach § 241a kein Anspruch gegen den Verbraucher!<\/em><em>\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Merke den Doppelschlag:<\/strong> Selbst wenn du durch Verbrauchen konkludent annimmst — § 241a killt den Anspruch trotzdem. Auch die 5 € für die Erdbeeren bekommt Denny nicht.<\/p>\n<h3 id=\"r-beispiel-aus-deinen-ubungsfallen-zusammenfassung-fall-05\">Beispiel aus deinen Übungsfällen — Zusammenfassung Fall 05<\/h3>\n<table>\n<thead>\n<tr>\n<th>Fall<\/th>\n<th>Kernproblem<\/th>\n<th>Norm<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a)<\/td>\n<td>Kein Preis genannt<\/td>\n<td>§ 145, essentialia negotii (-)<\/td>\n<\/tr>\n<tr>\n<td>b)<\/td>\n<td>Verspätet + verändert angenommen<\/td>\n<td>§ 147 I, § 150 I<\/td>\n<\/tr>\n<tr>\n<td>c)<\/td>\n<td>Unbestellte Obstkiste<\/td>\n<td>§§ 13, 14, 150, <strong>241a<\/strong><\/td>\n<\/tr>\n<tr>\n<td>d)<\/td>\n<td>PS5 wird vor Versand zerstört<\/td>\n<td>§§ 243 Gattungsschuld, 275, <strong>447<\/strong><\/td>\n<\/tr>\n<tr>\n<td>e)<\/td>\n<td>Widersprechende AGB<\/td>\n<td>§ 155 versteckter Dissens<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Wie entsteht ein Vertrag? Einer macht ein Angebot, der andere nimmt an. Fertig. So einfach ist es im Grundsatz — und die Fallen stecken alle im Detail: Ist ein Preisschild im Schaufenster schon ein Angebot? Was passiert, wenn jemand „Ja, aber…\" sagt? Was, wenn beide unterschiedliche AGB verwenden? Genau diese Details werden geprüft. Ein Vertrag entsteht durch zwei aufeinander bezogene Willenserklärungen : Angebot (§ 145) und Annahme. 9.1 Das Angebot / der Antrag — § 145 Folie 17 (Original): „● Initiiert wird der Vertrag durch Übermittlung eines Angebots/Antrags, § 145 – Der Antrag ist eine WE und muss alle Merkmale enthalten, insb. den ernsthaften Rechtsbindungswillen (lese §§ 116–118 ), anders: Aufforderung zur Abgabe eines Angebots ( „invitatio ad offerendum\" – ist aber schon ein gesetzliches Schuldverhältnis, vgl. § 311 II, Nr. 1-3 ) – Enthält alle vertragswesentlichen Elemente so, dass nur noch „ja\" gesagt werden muss („essentialia negotii\"): Vertragspartner, Vertragsgegenstand, Gegenleistung \" Die essentialia negotii — der „nur-noch-ja-sagen\"-Test Ein Angebot ist nur dann ein Angebot, wenn der andere nur noch „ja\" sagen muss . Drei Bestandteile: Vertragspartner (wer?) Vertragsgegenstand (was?) Gegenleistung (wieviel?) Der Test ist ganz simpel: Kann der andere einfach „Ja\" sagen — und alles ist klar? „Ich möchte dein Fahrrad kaufen.\" → Ja … und zu welchem Preis? Nicht klar. Kein Angebot. „Ich kaufe dein Fahrrad für 50 Euro.\" → Ja. Fertig, beide wissen alles. Angebot. angebot(partner: Anneliese, gegenstand: Fahrrad, preis: 50_EUR) // ✓ § 145 angebot(partner: Anneliese, gegenstand: Fahrrad, preis: ???) // ✗ kein Angebot Fall 05 a) zeigt das exakt: Anneliese sagt „ich möchte dein Fahrrad kaufen\". „ Kein Preis benannt, essentialia negotii nicht definiert ⇒ kein Angebot nach § 145 \" §§ 116–118 — kein ernsthafter Rechtsbindungswille Die Folie sagt „lese §§ 116–118\". Kurz: - § 116 Geheimer Vorbehalt: Du denkst innerlich „ich meine es nicht ernst\", sagst es aber nicht → WE ist trotzdem wirksam. Dein Innenleben interessiert nicht. - § 117 Scheingeschäft: Beide sind sich einig, dass es nur zum Schein ist → nichtig. (Klassiker: Schwarzkauf beim Grundstück, im Vertrag steht ein zu niedriger Preis.) - § 118 Scherzerklärung: Du erwartest, dass der andere den Scherz erkennt → nichtig , aber du schuldest Schadensersatz nach § 122. 9.2 invitatio ad offerendum invitatio ad offerendum = „Einladung, ein Angebot abzugeben\". Es ist kein Angebot, sondern nur Werbung. Warum gibt es das? Der Verkäufer will sich nicht binden — er hat vielleicht nur begrenzten Vorrat oder will sich den Kunden aussuchen können. Wäre das Schaufenster ein Angebot, könnten 500 Leute gleichzeitig „ja\" sagen und der Händler müsste 500-mal liefern. Typische invitationes: Schaufensterauslage · Warenauslage im Supermarkt · Werbeprospekt · Zeitungsanzeige · Speisekarte · meistens auch der Online-Shop-Katalog. Wer macht dann das Angebot? Der Kunde — indem er die Ware an die Kasse legt oder auf „Kaufen\" klickt. Der Händler nimmt an. Aber Achtung, die Folie ergänzt etwas Wichtiges: „ist aber schon ein gesetzliches Schuldverhältnis, vgl. § 311 II, Nr. 1-3 \" Auch ohne Vertrag entstehen schon Schutzpflichten . Wenn du im Supermarkt auf einer Bananenschale ausrutschst, hast du einen Anspruch aus c.i.c. (§§ 311 II, 241 II, 280) — obwohl du noch gar nichts gekauft hast. Siehe Kapitel 15. 9.3 Die Annahme Folie 19 (Original): „● Geschlossen wird der Vertrag durch eine auf den Antrag bezogene Annahme – Ist ebenfalls eine WE und muss alle Merkmale enthalten – Ausdrücklich oder konkludent, ggfs. verzichtbar bei Üblichkeit oder Verabredung, § 151 – Innerhalb der Frist, §§ 147, 148 – Bei offenem Dissenz , im Zweifel kein Vertragsschluss, §§ 154; 133, 157 – bei verstecktem Dissenz Auslegung, §§ 155, 133, 157 – Eine veränderte oder verspätete Annahme ist ein neuer Antrag, §§ 150, 145 ff \" Die Annahmefristen Situation § Frist Unter Anwesenden (auch Telefon, Video) § 147 I sofort — wer nicht sofort ja sagt, hat abgelehnt Unter Abwesenden § 147 II bis zu dem Zeitpunkt, zu dem der Antragende die Antwort unter regelmäßigen Umständen erwarten darf Antragender hat Frist gesetzt § 148 genau diese Frist Annahme ohne Zugang § 151 wenn Zugang nach der Verkehrssitte nicht zu erwarten ist § 151 in echt: Du bestellst online. Der Händler schickt die Ware, ohne dir vorher eine Annahmeerklärung zu schicken. Der Vertrag kommt trotzdem zustande — die Annahme muss dir nicht zugehen, weil das im Versandhandel unüblich ist. 9.4 ★ § 150 — Verspätete oder veränderte Annahme Das ist die wahrscheinlichste Detailfrage der ganzen Klausur. Der Dozent hebt sie auf Folie 19 hervor. Eine verspätete Annahme oder eine Annahme unter Änderungen gilt als Ablehnung, verbunden mit einem neuen Antrag. § 150. Zwei Effekte gleichzeitig: 1. Das ursprüngliche Angebot ist tot (§ 146: erloschen durch Ablehnung). 2. Es liegt ein neuer Antrag vor — jetzt muss der ursprüngliche Anbieter annehmen. Die Rollen drehen sich um. Alltagsbeispiel: Du bietest dein Fahrrad für 100 €. Der Käufer sagt: „Ja, aber für 80 €.\" → Das ist keine Annahme. Dein Angebot ist erloschen. Sein „Ja, aber\" ist ein neues Angebot über 80 €. Jetzt musst du entscheiden. Beispiel vom Flohmarkt: Du bietest deine Jacke für 30 Euro an. Der andere sagt: „Ja, für 20.\" Das ist kein Ja. Und jetzt kommt der Teil, den man leicht übersieht: Dein Angebot über 30 Euro ist damit endgültig vom Tisch . Auf dem Tisch liegt nur noch sein Angebot über 20 Euro — und du musst entscheiden. Sagst du „nein, doch nicht\", kann er nicht auf die 30 Euro zurück. Die gibt es nich
