recht: Ihre Freundin sucht eine Reisebegleitung fürs Wochenende, das hätte sie sich sonst nie leisten können . Die 170 Euro sind vollständig verbraucht. Jetzt will RAZA das Geld zurück. Schritt für Schritt. 1. § 812 I S. 1 1. Fall — RAZA hat 170 Euro zu viel gezahlt, ohne Rechtsgrund. Der Anspruch besteht grundsätzlich. 2. Aber § 818 III: Der Anspruch ist ausgeschlossen, soweit der Empfänger nicht mehr bereichert ist. Anneliese hat das Geld ausgegeben, es ist weg. 3. Die entscheidende Zusatzfrage — „ersparte Aufwendungen\": Hätte sie das Geld für etwas ausgegeben, das sie sowieso gekauft hätte (Miete, Lebensmittel), wäre sie nicht entreichert — dann hätte sie ja eigenes Geld gespart. Nur bei Luxus, den sie sich sonst nie geleistet hätte , greift § 818 III wirklich. 4. Der Sachverhalt sagt ausdrücklich: „das hätte sich Anneliese sonst nie leisten können\". → Keine ersparten Aufwendungen. 5. → § 818 III greift. RAZA bekommt nichts. Die Lösung des Dozenten. „Der Anspruch ist nach § 812 I, S 1, 1. Fall (Leistungskondiktion) gegeben, allerdings steht dem die Einwendung des § 818 III entgegen, da die Bereicherung im Vermögen der A nicht mehr vorhanden, sie somit entreichert und damit der Anspruch nach § 812 ausgeschlossen ist. Es liegen auch keine ersparten Aufwendungen vor , die ansonsten üblicherweise getätigt worden wären.\" Was du mitnimmst. § 818 III ist keine Freikarte fürs Geldausgeben. Die Prüffrage lautet: Hätte er es sowieso ausgegeben? - Wochenendtrip, den er sich nie geleistet hätte → entreichert , er darf behalten. - Wocheneinkauf → nicht entreichert , er muss zahlen. Fall 07 f) — Der Verkehrsunfall (§ 823 mit acht Schadenspositionen) ★★ Der Sachverhalt. Jimmy fährt gern zügig und übersieht in einer geschlossenen Ortschaft die von rechts kommende Anneliese. Er fährt ihr in die Seitentür. Neben dem Sachschaden wird ihr Bein erheblich geprellt , sie kann zwei Wochen nicht arbeiten. Was gefragt ist. Welche Schäden muss Jimmy ersetzen? — Der Dozent prüft jeden Posten einzeln . Genau diese Technik sollst du lernen. Schritt für Schritt — erst der Grundanspruch. § 823 I: Jimmy hat durch Missachtung der Vorfahrt rechtswidrig und schuldhaft (fahrlässig, § 276 II) geschützte Rechtsgüter der Anneliese verletzt ( Eigentum am Auto, Körper/Gesundheit ). Daraus sind kausal Schäden entstanden. Grundanspruch (+). Und jetzt Posten für Posten: Posten Ergebnis Begründung Reparatur 3.500 € ✓ voll Rechtsgut Eigentum, Vermögensvergleich nach § 249 … wenn das Auto nur 2.500 € wert wäre nur 2.500 € Reparaturkosten dürfen den Wert um höchstens 30 % übersteigen — hier überschritten Heilbehandlung Bein + Physio 1.500 € ✓ Rechtsgut Gesundheit Weitere Physio 1.800 € wegen vorbestehender Arthrose ✗ die Arthrose war schon vorher da → keine schadensbegründende Kausalität Schmerzensgeld 800 € ✓ immaterieller Schaden, aber ersatzfähig nach § 253 II ; 800 € liegt „am oberen Rand\" Mietwagen Porsche 2.400 € für 2 Wochen gekürzt ersetzt wird nur ein vergleichbares Fahrzeug, nicht die Luxusklasse Lohnfortzahlung 2.800 € vom Arbeitgeber ✗ Anneliese hat keinen Schaden — sie hat ihr Geld ja bekommen. (Der Arbeitgeber könnte selbst fordern.) Entgangener Geschäftsabschluss 5.000 € fraglich § 252 entgangener Gewinn — aber stünde der Anneliese oder ihrem Arbeitgeber zu? Die Lösung des Dozenten (Auszüge): „Wie wäre es, wenn das Auto nur noch 2.500 EUR wert wäre? […] Sofern ein besonderes Interesse an genau diesem Fahrzeug plausibel gemacht wird, ist eine Überschreitung der (tatsächlichen) Reparaturkosten um höchstens 30% anerkannt worden. (-, da hier überschritten ⇒ nur 2.500 EUR) […] Schmerzensgeld von 800 EUR (+, zwar immaterieller Schaden, aber zu ersetzen nach § 253 II ; 800 EUR liegt jedoch am oberen Rand). Kosten für einen Mietwagen […] Dabei hatte sich A einmal im Leben als Mietwagen einen Porsche geleistet. ( Der Schaden besteht lediglich in der Nichtverfügbarkeit eines Autos der Klasse, die bisher gefahren wurde. […] § 249.) Kosten für die Lohnfortzahlung […] (-; A hat keinen Schaden , allerdings könnte der Arbeitgeber SE fordern.)\" Was du mitnimmst. Drei Regeln, die alle drei in der Klausur zählen: Prüfe jeden Schadensposten getrennt. Ein Anspruch kann dem Grunde nach bestehen und trotzdem bei einzelnen Positionen scheitern. Der Geschädigte soll nicht besser dastehen als vorher. Deshalb kein Porsche statt Kleinwagen, deshalb keine Reparatur über 130 % des Werts. Wer keinen Schaden hat, bekommt nichts — auch wenn er verletzt wurde. Die Lohnfortzahlung ist das perfekte Beispiel. Fall 07 g) — Der Trojaner am Arbeitsplatz ★★ Der Sachverhalt. Denny wurde bei einer Beförderung übergangen. Um seinem Chef seine Fähigkeiten zu beweisen, installiert er einen Trojaner , der das Betriebssystem lahmlegt — er wollte den Fehler anschließend beheben und als Retter dastehen. Die Reparatur misslingt, ein neues Release wird nötig: 15.000 Euro . Ohne den Vorfall wäre der Releasewechsel erst in einem halben Jahr fällig gewesen. Während des Stillstands gehen Aufträge mit 25.000 Euro potenziellem Gewinn verloren. Zusätzlich beschädigt die Malware das System eines Konkurrenten, der sich illegal auf Dennys Rechner aufgeschaltet hatte — Schaden dort: 12.000 Euro . Was gefragt ist. Für welche Schäden muss Denny aufkommen? Schritt für Schritt. Ansprüche des Arbeitgebers gegen Denny, § 823 I. Der Dozent hakt das Schema Punkt für Punkt ab: - Verletzungshandlung: ✓ (Manipulation des Systems) - Rechtsgutsverletzung: ✓ (Eigentum / Nutzungsmöglichkeit / Vermögen) - Haftungsbegründende Kausalität: ✓ - Rechtswidrigkeit: ✓ - Verschulden: ✓ ( Vorsatz ) - Schaden: ✓ Und jetzt die haftungsausfüllende Kausalität, Posten für Posten: Releasewechsel 15.000 €: Die Kosten wären in einem halben Jahr ohnehin angefallen. Ist die Rechtsgutsverletzung wirklich ursächlich für diesen Schaden? Der Dozent sagt: wohl nein (-) . Denk den Trojaner weg — das Release hätte trotzdem Geld gekostet, nur später. Entgangener Gewinn 25.000 €: ✓ (+) , §§ 823 I, 249, 252. Diese Aufträge wären ohne den Angriff hereingekommen. Anspruch des Konkurrenten gegen Denny, § 823 I — 12.000 €. - Verletzungshandlung: ✓ - Rechtsgutsverletzung beim Konkurrenten: ✓ - Haftungsbegründende Kausalität: Ohne Dennys Trojaner kein Schaden — „conditio sine qua non\" also ✓. - Aber die Adäquanz? Damit, dass sich jemand illegal auf seinen Rechner aufschaltet und dadurch mitgeschädigt wird, muss Denny nicht rechnen. Das ist völlig untypisch und unterbricht die Kausalkette . - → Kein Anspruch (-). Die Lösung des Dozenten (gekürzt): „ Releasewechsel (15.000 EUR): Fraglich ist, ob die Kosten für den Releasewechsel einen kausal durch die Verletzungshandlung entstandenen Schaden darstellen, da sie in einem halben Jahr ohnehin angefallen wären. […] Hier wohl (-). Entgangener Gewinn (25.000 EUR): (+, §§ 823 I, 249, 252). Anspruch Konkurrent […] Zwar war die Verletzungshandlung conditio sine qua non für die Rechtsgutsverletzung bei K, jedoch ist die Frage, ob dem D diese Rechtsgutsverletzung im Sinne einer Adäquanz zuzurechnen ist. […] Insbesondere wird die Kausalkette durch das völlig unübliche, nicht erwartbare widerrechtliche Eingreifen des Dritten K unterbrochen. Damit liegt keine adäquat kausale Rechtgutsverletzung vor. (-)\" Was du mitnimmst. Das ist ein IT-Fall und damit ein wahrscheinlicher Klausurkandidat. Zwei Merksätze: Ein Schaden, der sowieso eingetreten wäre, ist nicht kausal verursacht. (Wegdenken-Test: Fällt der Schaden weg, wenn ich die Handlung wegdenke?) Das unerwartete rechtswidrige Eingreifen eines Dritten unterbricht die Adäquanz. Und die Darstellungsform: Der Dozent hakt das Schema mit (+) und (−) ab. Mach das genauso — das ist schnell geschrieben und zeigt sofort, dass du das Schema beherrschst.","words":2757,"mins":15},{"id":"f-8-fälle-zur-vertragsauflösung","subject":"faelle","num":"8","title":"8. Fälle zur Vertragsauflösung","short":"Fälle zur Vertragsauflösung","html":"<p>Hier geht es um die Frage: <strong>Wie kommt man wieder raus?<\/strong> Drei Wege — Widerruf, Anfechtung, Rücktritt.<\/p>\n<h3 id=\"f-fall-08-a-das-ebike-per-werbeanruf-widerruf\">Fall 08 a) — Das eBike per Werbeanruf (Widerruf) ★★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Anneliese bekommt einen <strong>Werbeanruf<\/strong> der Recard GmbH: Sie habe gewonnen und bekomme ein eBike zum „Sensationspreis\" von <strong>2.999 Euro<\/strong>. Während des Gesprächs googelt sie den Preis, findet ihn tatsächlich günstig, und sagt zu. Die Firma schickt sofort eine Bestätigungsmail, Anneliese zahlt per PayPal. Am Nachmittag erfährt sie bei ihrem Fahrradhändler, dass es dasselbe Modell <strong>200 Euro günstiger<\/strong> gibt. Sie mailt der Firma, dass sie es sich anders überlegt hat. Geschäftsführer Jimmy ist empört: Der Widerruf sei viel zu spät, „<strong>pacta sunt servanda<\/strong>\", und alles sei schriftlich bestätigt. Das Geld behalte er.<\/p>\n<p><strong>Was gefragt ist.<\/strong> Zu Recht?<\/p>\n<p><strong>Schritt für Schritt.<\/strong><\/p>\n<ol>\n<li><strong>Anspruchsgrundlage: § 812 I 1. Fall.<\/strong> — Anneliese will ihr Geld zurück. Der Dozent merkt an, dass auch § 355 III als Spezialvorschrift ginge, prüft aber § 812, weil das die allgemeinere Norm ist.<\/li>\n<li>Rechtsgrund war der Kaufvertrag. Ist der noch da?<\/li>\n<li><strong>Erst § 130 I S. 2 prüfen<\/strong> — Widerruf der Willenserklärung vor oder mit Zugang? Nein, viel zu spät. Dieser Weg ist zu.<\/li>\n<li><strong>Also braucht sie ein besonderes Widerrufsrecht, § 355 I.<\/strong> Woher?<\/li>\n<li><strong>§ 312g I<\/strong> — dafür müssen drei Dinge stimmen:\n   - <strong>Verbraucher<\/strong>, § 13: Anneliese handelt privat ✓\n   - <strong>Unternehmer<\/strong>, § 14: die Recard GmbH handelt gewerblich ✓\n   - <strong>außerhalb von Geschäftsräumen<\/strong>, § 312b I Nr. 3: der Vertrag kam <strong>ausschließlich fernmündlich<\/strong> zustande ✓<\/li>\n<li>→ Widerrufsrecht (+). Frist: <strong>14 Tage<\/strong> (§ 355 II) — sie widerruft noch am selben Tag.<\/li>\n<li>→ Vertrag entfällt → kein Rechtsgrund → <strong>§ 812, Geld zurück.<\/strong><\/li>\n<\/ol>\n<p><strong>Und Jimmys Einwände?<\/strong> „Pacta sunt servanda\" ist zwar ein echter Rechtsgrundsatz, aber das Widerrufsrecht ist <strong>zwingendes Verbraucherrecht<\/strong> — es lässt sich weder wegvereinbaren noch durch eine schriftliche Bestätigung aushebeln.<\/p>\n<p><strong>Die Lösung des Dozenten<\/strong> (gekürzt):<\/p>\n<blockquote>\n<p>„Anspruchsgrundlage hierfür könnte <strong>§ 812 I, 1. Fall<\/strong> sein (Alternativ wäre auch die Anspruchsgrundlage § 355 III als Spezialvorschrift möglich; da § 812 I aber auch in anderen Fällen greift, wird hier § 812 geprüft). […] <strong>Da der Widerruf einer WE nach § 130 I 2 voraussetzt, dass dieser gleichzeitig oder vor der WE […] zugeht und dies vorliegend nicht der Fall war, müsste Anneliese ein besonderes Widerrufsrecht zustehen.<\/strong> Ein solches könnte sich aus § 355 I ergeben […] Dieses könnte sich aus <strong>§ 312g I<\/strong> ergeben. […] <strong>Anneliese ist als Privatperson Verbraucherin nach § 13<\/strong> und die Recard GmbH handelt nach <strong>§ 14<\/strong> gewerblich […] Der Vertrag wurde auch ausschließlich fernmündlich, also <strong>außerhalb der Geschäftsräume der Recard GmbH nach § 312b I Nr. 3<\/strong> geschlossen. […] Dies muss sie nach <strong>§ 355 I, II fristgerecht, innerhalb von 14 Tagen<\/strong> ausüben […] Mithin hat Anne einen Anspruch auf Rückgewähr der geleisteten 2.999 EUR.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Der <strong>Aufbau<\/strong> ist hier die eigentliche Lektion:<\/p>\n<blockquote>\n<p><strong>§ 812 ist die Anspruchsgrundlage. § 355/§ 312g sind nur die Vorfrage.<\/strong><\/p>\n<\/blockquote>\n<p>Und: Hak <strong>§ 13 und § 14 einzeln ab<\/strong>. Das sind sichere, schnelle Punkte, und der Dozent macht es selbst genau so.<\/p>\n<p><strong>Merksatz zum Widerruf:<\/strong> Er braucht <strong>keinen Grund<\/strong>. Anneliese muss nicht begründen, warum sie es sich anders überlegt hat — anders als bei der Anfechtung.<\/p>\n<h3 id=\"f-fall-08-b-die-dali-lithografie-eigenschaftsirrtum\">Fall 08 b) — Die Dali-Lithografie (Eigenschaftsirrtum) ★★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Denny will sein erstes Gehalt in einen Kunstdruck investieren. Auf der Website der Mulligan-Galerie sieht er eine <strong>Dali-Lithografie<\/strong> mit Originalunterschrift und Nummerierung 199/500 für <strong>2.000 Euro<\/strong>. Er hatte mit dem Zehnfachen gerechnet und bestellt telefonisch diese „originale Lithografie\". Vier Wochen später bemerkt sein Vater: Es ist <strong>keine Original-Lithografie<\/strong>, sondern ein <strong>Druck<\/strong>, den der Künstler nicht selbst angefertigt, sondern nur <strong>selbst signiert<\/strong> hat.<\/p>\n<p><strong>Was gefragt ist.<\/strong> Kann Denny anfechten? Nach welcher Vorschrift?<\/p>\n<p><strong>Schritt für Schritt.<\/strong><\/p>\n<ol>\n<li>Voraussetzungen der Anfechtung: <strong>Anfechtungserklärung<\/strong> (§ 143), <strong>Anfechtungsgrund<\/strong>, <strong>Frist<\/strong>.<\/li>\n<li>Welcher Grund kommt in Betracht? Denny hat genau das bestellt, was er bestellen wollte — kein Erklärungsirrtum, kein Inhaltsirrtum.<\/li>\n<li>Aber er irrte sich über eine <strong>Eigenschaft der Sache<\/strong>: Er dachte, der Künstler habe sie selbst angefertigt.<\/li>\n<li><strong>§ 119 II<\/strong> — Irrtum über eine <strong>verkehrswesentliche Eigenschaft<\/strong>. Das sind alle <strong>wertbildenden Faktoren<\/strong>, nicht aber der Wert selbst.<\/li>\n<li>Ist „vom Künstler selbst angefertigt\" ein wertbildender Faktor? Eindeutig ja — genau das macht den Unterschied zwischen 2.000 und 20.000 Euro.<\/li>\n<li>→ <strong>§ 119 II (+)<\/strong>, Frist: <strong>unverzüglich<\/strong> nach Entdeckung (§ 121).<\/li>\n<\/ol>\n<p><strong>Zwei Abwandlungen, die den Fall erst wertvoll machen:<\/strong><\/p>\n<p><strong>Abwandlung 1:<\/strong> Denny wusste, dass der Künstler die Farbe nicht selbst aufgetragen hat — dachte aber, so ein Werk sei mindestens <strong>5.000 Euro<\/strong> wert.<\/p>\n<blockquote>\n<p>„Der bloße <strong>Irrtum über den Wert<\/strong> stellt keinen wertbildenden Faktor dar, ist damit kein Irrtum über eine verkehrswesentliche Eigenschaft und berechtigt somit nach § 119 II <strong>nicht<\/strong> zur Anfechtung.\"<\/p>\n<\/blockquote>\n<p><strong>Abwandlung 2:<\/strong> Die Galerie hatte das Bild aktiv als „Original-Lithografie\" <strong>beworben<\/strong>.<\/p>\n<blockquote>\n<p>Dann kommt <strong>§ 123 I<\/strong> in Betracht — <strong>arglistige Täuschung<\/strong>. Frist dann: <strong>ein Jahr<\/strong> (§ 124).<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Die Grenze zwischen § 119 II und dem nicht anfechtbaren Wertirrtum ist <strong>die<\/strong> Feinheit dieses Themas:<\/p>\n<blockquote>\n<p><strong>Anfechtbar:<\/strong> Echtheit, Alter, Material, Herkunft, Unfallfreiheit — alles, was den Wert <em>bestimmt<\/em>.\n<strong>Nicht anfechtbar:<\/strong> der Preis selbst. Fehlkalkulation ist dein Risiko.<\/p>\n<\/blockquote>\n<p>Und merk dir die zwei Fristen: <strong>§ 119 → unverzüglich. § 123 → ein Jahr.<\/strong> Warum der Unterschied? Wer betrügt, ist nicht schutzwürdig.<\/p>\n<h3 id=\"f-fall-08-c-gunter-klum-eigenschaftsirrtum-uber-die-person\">Fall 08 c) — „Günter Klum\" (Eigenschaftsirrtum über die Person)<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Nancy verkauft mit ihrem Start-up Naturkosmetik. Eine Sample-Box kostet <strong>350 Euro<\/strong>. Ein <strong>Günter Klum aus Bergisch-Gladbach<\/strong> ruft an und bestellt. Nancy verspricht: „Ihnen schicke ich die Box natürlich <strong>gratis<\/strong>\" — und verschickt sie. Danach merkt sie beim Adressabgleich, dass es wohl nicht der Vater der bekannten Celebrity ist.<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\nNancy hat sich nicht über die Ware geirrt, sondern über die <strong>Person<\/strong> ihres Geschäftspartners. <strong>§ 119 II<\/strong> erfasst ausdrücklich auch <strong>Eigenschaften der Person<\/strong>.<\/p>\n<p>War die vermeintliche Prominenz eine „verkehrswesentliche Eigenschaft\"? Ja — nur deshalb hat sie statt eines Kaufvertrags einen <strong>Schenkungsvertrag<\/strong> geschlossen. Sie erhoffte sich Werbewirkung.<\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Als Anfechtungsgrund kommt der <strong>Irrtum über eine verkehrswesentliche Eigenschaft der Person des Geschäftspartners nach § 119 II<\/strong> in Betracht. Da Nancy mit ihrem Geschäftspartner nur im Hinblick auf dessen vermeintliche Möglichkeiten zur Promotion ihrer Artikel einen Schenkungs- anstelle eines Kaufvertrages geschlossen hat, liegt ein Irrtum über eine verkehrswesentliche Eigenschaft der Person vor, der zur Anfechtung berechtigt.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> <strong>§ 119 II gilt für Sachen UND für Personen.<\/strong> Bei Personen sind verkehrswesentlich zum Beispiel: Zahlungsfähigkeit, berufliche Qualifikation, Zuverlässigkeit — und hier eben die Prominenz.<\/p>\n<h3 id=\"f-fall-08-d-2500-statt-250-erklarungsirrtum\">Fall 08 d) — 2.500 statt 250 (Erklärungsirrtum)<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Denny sucht bei kleinanzeigen.de eine Karte für ein Ed-Sheeran-Konzert. Nancy bietet eine für „<strong>VB 250 EUR<\/strong>\". Denny schreibt zurück: „<strong>gerne für 2500 EUR<\/strong>\". Nancy freut sich.<\/p>\n<p><strong>Schritt für Schritt.<\/strong> Gewolltes und Erklärtes fallen offensichtlich auseinander — er wollte 250 schreiben, geschrieben hat er 2500. Das ist der klassische <strong>Erklärungsirrtum, § 119 I 2. Fall<\/strong> (Vertippen).<\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„Im vorliegenden Fall fallen Gewolltes und Erklärtes ersichtlich auseinander, so dass ein nach <strong>§ 119 I, 2. Fall<\/strong> beachtlicher <strong>Erklärungsirrtum<\/strong> vorliegt.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Vertippen, Versprechen, Verklicken, Vergreifen → <strong>immer § 119 I 2. Fall<\/strong>.<\/p>\n<h3 id=\"f-fall-08-e-der-neffe-mag-ed-sheeran-nicht-mehr-motivirrtum\">Fall 08 e) — Der Neffe mag Ed Sheeran nicht mehr (Motivirrtum) ★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Denny hatte die Konzertkarte eigentlich für seinen Neffen Jimmy gekauft, der früher glühender Ed-Sheeran-Fan war. Inzwischen hat sich Jimmys Musikgeschmack gewandelt. Weil Denny sich darüber getäuscht hat, will er gegenüber Nancy anfechten.<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\nDenny wollte die Karte kaufen. Er hat den Kauf der Karte erklärt. Wille und Erklärung stimmen <strong>perfekt<\/strong> überein. Die Karte ist echt, der Preis ist richtig, alles ist so wie besprochen.<\/p>\n<p>Falsch war nur sein <strong>Beweggrund<\/strong> — und der geht Nancy nichts an.<\/p>\n<p><strong>Die Lösung des Dozenten.<\/strong><\/p>\n<blockquote>\n<p>„<strong>Kein gesetzlich anerkannter Anfechtungsgrund, da lediglich Motivirrtum.<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Vergleich d) und e) <strong>direkt nebeneinander<\/strong> — es ist derselbe Sachverhalt mit derselben Konzertkarte:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Was schiefging<\/th>\n<th>Anfechtbar?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>d)<\/strong><\/td>\n<td>Er hat sich <strong>vertippt<\/strong><\/td>\n<td><strong>✓<\/strong> § 119 I 2. Fall<\/td>\n<\/tr>\n<tr>\n<td><strong>e)<\/strong><\/td>\n<td>Sein <strong>Grund<\/strong> war falsch<\/td>\n<td><strong>✗<\/strong> Motivirrtum<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Wenn du diesen Unterschied sicher erklären kannst, hast du das Anfechtungsrecht verstanden.<\/p>\n<h3 id=\"f-fall-08-f-die-drohung-mit-der-anzeige\">Fall 08 f) — Die Drohung mit der Anzeige ★★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Jimmy und Anneliese fahren Fahrrad. Anneliese ist spät dran, übersieht den von rechts kommenden Jimmy und fährt ihn an. Jimmy verletzt sich am Arm. Anneliese will nicht auf die Polizei warten. Jimmy schlägt vor: Sie unterschreibt ein <strong>Eingeständnis<\/strong>, dass sie die Vorfahrt missachtet hat — dann zeigt er sie nicht an. Abends will sie das Eingeständnis zurückziehen: Sie sei ja <strong>bedroht<\/strong> worden.<\/p>\n<p><strong>Was gefragt ist.<\/strong> Kann sie anfechten?<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\n1. Möglicher Grund: <strong>widerrechtliche Drohung<\/strong>, § 123 I 2. Fall.\n2. <strong>Drohung?<\/strong> Ja — das Inaussichtstellen eines empfindlichen Übels (Anzeige), auf das Jimmy Einfluss hat. ✓\n3. <strong>Widerrechtlich?<\/strong> Das ist der Knackpunkt. Widerrechtlich ist eine Drohung, wenn die <strong>Zweck-Mittel-Relation unangemessen<\/strong> ist. Prüf drei Dinge:\n   - Ist der <strong>Zweck<\/strong> zulässig? Beweissicherung und ein Schuldanerkenntnis — ja.\n   - Ist das <strong>Mittel<\/strong> zulässig? Jemanden anzeigen, der sich falsch verhalten hat — ja.\n   - Gibt es einen <strong>inneren Zusammenhang<\/strong>? Ja! Es geht um genau denselben Unfall.\n4. → Die Drohung war <strong>nicht widerrechtlich<\/strong>. <strong>Keine Anfechtung möglich.<\/strong><\/p>\n<p><strong>Und jetzt die Abwandlung, die den Fall lehrreich macht:<\/strong> Jimmy hätte gedroht, sie <strong>wegen eines Diebstahls<\/strong> anzuzeigen, den er beobachtet habe.\n- Zweck zulässig? Ja. Mittel zulässig? Ja.\n- <strong>Innerer Zusammenhang?<\/strong> <strong>Nein!<\/strong> Der Diebstahl hat mit dem Fahrradunfall nichts zu tun. Die beiden sind einander <strong>sachfremd<\/strong>.\n- → Die Drohung ist <strong>widerrechtlich<\/strong> → <strong>§ 123 I 2. Fall (+)<\/strong>, Anfechtung möglich.<\/p>\n<p><strong>Die Lösung des Dozenten<\/strong> (gekürzt):<\/p>\n<blockquote>\n<p>„Widerrechtlich ist eine Drohung, bei der die <strong>Zweck-Mittel-Relation unangemessen oder nicht verhältnismäßig<\/strong> ist. Vorliegend ist der Zweck der Beweissicherung […] für sich genommen zulässig und angemessen. Auch das Mittel, jemanden anzuzeigen, der ein bestimmtes Fehlverhalten gezeigt hat, ist in Ordnung. Im vorliegenden Fall besteht auch <strong>zwischen Mittel und Zweck ein innerer Zusammenhang<\/strong> […] Folglich war Jimmys Drohung nicht widerrechtlich […]\n[Abwandlung:] Allerdings haben Mittel und Zweck vorliegend <strong>keinen inneren Zusammenhang. Sie sind einander sachfremd<\/strong>, weswegen die Zweck-Mittel-Beziehung als unangemessen bezeichnet werden muss. Vorliegend ist die Drohung mithin rechtswidrig.\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Nicht jede Drohung ist widerrechtlich. Die entscheidende Frage lautet:<\/p>\n<blockquote>\n<p><strong>Passen Zweck und Mittel sachlich zusammen?<\/strong><\/p>\n<\/blockquote>\n<p>Anzeige wegen des Unfalls, um den Unfall zu klären → in Ordnung.\nAnzeige wegen eines Diebstahls, um den Unfall zu klären → Erpressung.<\/p>","text":"Hier geht es um die Frage: Wie kommt man wieder raus? Drei Wege — Widerruf, Anfechtung, Rücktritt. Fall 08 a) — Das eBike per Werbeanruf (Widerruf) ★★ Der Sachverhalt. Anneliese bekommt einen Werbeanruf der Recard GmbH: Sie habe gewonnen und bekomme ein eBike zum „Sensationspreis\" von 2.999 Euro . Während des Gesprächs googelt sie den Preis, findet ihn tatsächlich günstig, und sagt zu. Die Firma schickt sofort eine Bestätigungsmail, Anneliese zahlt per PayPal. Am Nachmittag erfährt sie bei ihrem Fahrradhändler, dass es dasselbe Modell 200 Euro günstiger gibt. Sie mailt der Firma, dass sie es sich anders überlegt hat. Geschäftsführer Jimmy ist empört: Der Widerruf sei viel zu spät, „ pacta sunt servanda \", und alles sei schriftlich bestätigt. Das Geld behalte er. Was gefragt ist. Zu Recht? Schritt für Schritt. Anspruchsgrundlage: § 812 I 1. Fall. — Anneliese will ihr Geld zurück. Der Dozent merkt an, dass auch § 355 III als Spezialvorschrift ginge, prüft aber § 812, weil das die allgemeinere Norm ist. Rechtsgrund war der Kaufvertrag. Ist der noch da? Erst § 130 I S. 2 prüfen — Widerruf der Willenserklärung vor oder mit Zugang? Nein, viel zu spät. Dieser Weg ist zu. Also braucht sie ein besonderes Widerrufsrecht, § 355 I. Woher? § 312g I — dafür müssen drei Dinge stimmen: - Verbraucher , § 13: Anneliese handelt privat ✓ - Unternehmer , § 14: die Recard GmbH handelt gewerblich ✓ - außerhalb von Geschäftsräumen , § 312b I Nr. 3: der Vertrag kam ausschließlich fernmündlich zustande ✓ → Widerrufsrecht (+). Frist: 14 Tage (§ 355 II) — sie widerruft noch am selben Tag. → Vertrag entfällt → kein Rechtsgrund → § 812, Geld zurück. Und Jimmys Einwände? „Pacta sunt servanda\" ist zwar ein echter Rechtsgrundsatz, aber das Widerrufsrecht ist zwingendes Verbraucherrecht — es lässt sich weder wegvereinbaren noch durch eine schriftliche Bestätigung aushebeln. Die Lösung des Dozenten (gekürzt): „Anspruchsgrundlage hierfür könnte § 812 I, 1. Fall sein (Alternativ wäre auch die Anspruchsgrundlage § 355 III als Spezialvorschrift möglich; da § 812 I aber auch in anderen Fällen greift, wird hier § 812 geprüft). […] Da der Widerruf einer WE nach § 130 I 2 voraussetzt, dass dieser gleichzeitig oder vor der WE […] zugeht und dies vorliegend nicht der Fall war, müsste Anneliese ein besonderes Widerrufsrecht zustehen. Ein solches könnte sich aus § 355 I ergeben […] Dieses könnte sich aus § 312g I ergeben. […] Anneliese ist als Privatperson Verbraucherin nach § 13 und die Recard GmbH handelt nach § 14 gewerblich […] Der Vertrag wurde auch ausschließlich fernmündlich, also außerhalb der Geschäftsräume der Recard GmbH nach § 312b I Nr. 3 geschlossen. […] Dies muss sie nach § 355 I, II fristgerecht, innerhalb von 14 Tagen ausüben […] Mithin hat Anne einen Anspruch auf Rückgewähr der geleisteten 2.999 EUR.\" Was du mitnimmst. Der Aufbau ist hier die eigentliche Lektion: § 812 ist die Anspruchsgrundlage. § 355/§ 312g sind nur die Vorfrage. Und: Hak § 13 und § 14 einzeln ab . Das sind sichere, schnelle Punkte, und der Dozent macht es selbst genau so. Merksatz zum Widerruf: Er braucht keinen Grund . Anneliese muss nicht begründen, warum sie es sich anders überlegt hat — anders als bei der Anfechtung. Fall 08 b) — Die Dali-Lithografie (Eigenschaftsirrtum) ★★ Der Sachverhalt. Denny will sein erstes Gehalt in einen Kunstdruck investieren. Auf der Website der Mulligan-Galerie sieht er eine Dali-Lithografie mit Originalunterschrift und Nummerierung 199/500 für 2.000 Euro . Er hatte mit dem Zehnfachen gerechnet und bestellt telefonisch diese „originale Lithografie\". Vier Wochen später bemerkt sein Vater: Es ist keine Original-Lithografie , sondern ein Druck , den der Künstler nicht selbst angefertigt, sondern nur selbst signiert hat. Was gefragt ist. Kann Denny anfechten? Nach welcher Vorschrift? Schritt für Schritt. Voraussetzungen der Anfechtung: Anfechtungserklärung (§ 143), Anfechtungsgrund , Frist . Welcher Grund kommt in Betracht? Denny hat genau das bestellt, was er bestellen wollte — kein Erklärungsirrtum, kein Inhaltsirrtum. Aber er irrte sich über eine Eigenschaft der Sache : Er dachte, der Künstler habe sie selbst angefertigt. § 119 II — Irrtum über eine verkehrswesentliche Eigenschaft . Das sind alle wertbildenden Faktoren , nicht aber der Wert selbst. Ist „vom Künstler selbst angefertigt\" ein wertbildender Faktor? Eindeutig ja — genau das macht den Unterschied zwischen 2.000 und 20.000 Euro. → § 119 II (+) , Frist: unverzüglich nach Entdeckung (§ 121). Zwei Abwandlungen, die den Fall erst wertvoll machen: Abwandlung 1: Denny wusste, dass der Künstler die Farbe nicht selbst aufgetragen hat — dachte aber, so ein Werk sei mindestens 5.000 Euro wert. „Der bloße Irrtum über den Wert stellt keinen wertbildenden Faktor dar, ist damit kein Irrtum über eine verkehrswesentliche Eigenschaft und berechtigt somit nach § 119 II nicht zur Anfechtung.\" Abwandlung 2: Die Galerie hatte das Bild aktiv als „Original-Lithografie\" beworben . Dann kommt § 123 I in Betracht — arglistige Täuschung . Frist dann: ein Jahr (§ 124). Was du mitnimmst. Die Grenze zwischen § 119 II und dem nicht anfechtbaren Wertirrtum ist die Feinheit dieses Themas: Anfechtbar: Echtheit, Alter, Material, Herkunft, Unfallfreiheit — alles, was den Wert bestimmt . Nicht anfechtbar: der Preis selbst. Fehlkalkulation ist dein Risiko. Und merk dir die zwei Fristen: § 119 → unverzüglich. § 123 → ein Jahr. Warum der Unterschied? Wer betrügt, ist nicht schutzwürdig. Fall 08 c) — „Günter Klum\" (Eigenschaftsirrtum über die Person) Der Sachverhalt. Nancy verkauft mit ihrem Start-up Naturkosmetik. Eine Sample-Box kostet 350 Euro . Ein Günter Klum aus Bergisch-Gladbach ruft an und bestellt. Nancy verspricht: „Ihnen schicke ich die Box natürlich gratis \" — und verschickt sie. Danach merkt sie beim Adressabgleich, dass es wohl nicht der Vater der bekannten Celebrity ist. Schritt für Schritt. Nancy hat sich nicht über die Ware geirrt, sondern über die Person ihres Geschäftspartners. § 119 II erfasst ausdrücklich auch Eigenschaften der Person . War die vermeintliche Prominenz eine „verkehrswesentliche Eigenschaft\"? Ja — nur deshalb hat sie statt eines Kaufvertrags einen Schenkungsvertrag geschlossen. Sie erhoffte sich Werbewirkung. Die Lösung des Dozenten. „Als Anfechtungsgrund kommt der Irrtum über eine verkehrswesentliche Eigenschaft der Person des Geschäftspartners nach § 119 II in Betracht. Da Nancy mit ihrem Geschäftspartner nur im Hinblick auf dessen vermeintliche Möglichkeiten zur Promotion ihrer Artikel einen Schenkungs- anstelle eines Kaufvertrages geschlossen hat, liegt ein Irrtum über eine verkehrswesentliche Eigenschaft der Person vor, der zur Anfechtung berechtigt.\" Was du mitnimmst. § 119 II gilt für Sachen UND für Personen. Bei Personen sind verkehrswesentlich zum Beispiel: Zahlungsfähigkeit, berufliche Qualifikation, Zuverlässigkeit — und hier eben die Prominenz. Fall 08 d) — 2.500 statt 250 (Erklärungsirrtum) Der Sachverhalt. Denny sucht bei kleinanzeigen.de eine Karte für ein Ed-Sheeran-Konzert. Nancy bietet eine für „ VB 250 EUR \". Denny schreibt zurück: „ gerne für 2500 EUR \". Nancy freut sich. Schritt für Schritt. Gewolltes und Erklärtes fallen offensichtlich auseinander — er wollte 250 schreiben, geschrieben hat er 2500. Das ist der klassische Erklärungsirrtum, § 119 I 2. Fall (Vertippen). Die Lösung des Dozenten. „Im vorliegenden Fall fallen Gewolltes und Erklärtes ersichtlich auseinander, so dass ein nach § 119 I, 2. Fall beachtlicher Erklärungsirrtum vorliegt.\" Was du mitnimmst. Vertippen, Versprechen, Verklicken, Vergreifen → immer § 119 I 2. Fall . Fall 08 e) — Der Neffe mag Ed Sheeran nicht mehr (Motivirrtum) ★ Der Sachverhalt. Denny hatte die Konzertkarte eigentlich für seinen Neffen Jimmy gekauft, der früher glühender Ed-Sheeran-Fan war. Inzwischen hat sich Jimmys Musikgeschmack gewandelt. Weil Denny sich darüber getäuscht hat, will er gegenüber Nancy anfechten. Schritt für Schritt. Denny wollte die Karte kaufen. Er hat den Kauf der Karte erklärt. Wille und Erklärung stimmen perfekt überein. Die Karte ist echt, der Preis ist richtig, alles ist so wie besprochen. Falsch war nur sein Beweggrund — und der geht Nancy nichts an. Die Lösung des Dozenten. „ Kein gesetzlich anerkannter Anfechtungsgrund, da lediglich Motivirrtum. \" Was du mitnimmst. Vergleich d) und e) direkt nebeneinander — es ist derselbe Sachverhalt mit derselben Konzertkarte: Was schiefging Anfechtbar? d) Er hat sich vertippt ✓ § 119 I 2. Fall e) Sein Grund war falsch ✗ Motivirrtum Wenn du diesen Unterschied sicher erklären kannst, hast du das Anfechtungsrecht verstanden. Fall 08 f) — Die Drohung mit der Anzeige ★★ Der Sachverhalt. Jimmy und Anneliese fahren Fahrrad. Anneliese ist spät dran, übersieht den von rechts kommenden Jimmy und fährt ihn an. Jimmy verletzt sich am Arm. Anneliese will nicht auf die Polizei warten. Jimmy schlägt vor: Sie unterschreibt ein Eingeständnis , dass sie die Vorfahrt missachtet hat — dann zeigt er sie nicht an. Abends will sie das Eingeständnis zurückziehen: Sie sei ja bedroht worden. Was gefragt ist. Kann sie anfechten? Schritt für Schritt. 1. Möglicher Grund: widerrechtliche Drohung , § 123 I 2. Fall. 2. Drohung? Ja — das Inaussichtstellen eines empfindlichen Übels (Anzeige), auf das Jimmy Einfluss hat. ✓ 3. Widerrechtlich? Das ist der Knackpunkt. Widerrechtlich ist eine Drohung, wenn die Zweck-Mittel-Relation unangemessen ist. Prüf drei Dinge: - Ist der Zweck zulässig? Beweissicherung und ein Schuldanerkenntnis — ja. - Ist das Mittel zulässig? Jemanden anzeigen, der sich falsch verhalten hat — ja. - Gibt es einen inneren Zusammenhang ? Ja! Es geht um genau denselben Unfall. 4. → Die Drohung war nicht widerrechtlich . Keine Anfechtung möglich. Und jetzt die Abwandlung, die den Fall lehrreich macht: Jimmy hätte gedroht, sie wegen eines Diebstahls anzuzeigen, den er beobachtet habe. - Zweck zulässig? Ja. Mittel zulässig? Ja. - Innerer Zusammenhang? Nein! Der Diebstahl hat mit dem Fahrradunfall nichts zu tun. Die beiden sind einander sachfremd . - → Die Drohung ist widerrechtlich → § 123 I 2. Fall (+) , Anfechtung möglich. Die Lösung des Dozenten (gekürzt): „Widerrechtlich ist eine Drohung, bei der die Zweck-Mittel-Relation unangemessen oder nicht verhältnismäßig ist. Vorliegend ist der Zweck der Beweissicherung […] für sich genommen zulässig und angemessen. Auch das Mittel, jemanden anzuzeigen, der ein bestimmtes Fehlverhalten gezeigt hat, ist in Ordnung. Im vorliegenden Fall besteht auch zwischen Mittel und Zweck ein innerer Zusammenhang […] Folglich war Jimmys Drohung nicht widerrechtlich […] [Abwandlung:] Allerdings haben Mittel und Zweck vorliegend keinen inneren Zusammenhang. Sie sind einander sachfremd , weswegen die Zweck-Mittel-Beziehung als unangemessen bezeichnet werden muss. Vorliegend ist die Drohung mithin rechtswidrig.\" Was du mitnimmst. Nicht jede Drohung ist widerrechtlich. Die entscheidende Frage lautet: Passen Zweck und Mittel sachlich zusammen? Anzeige wegen des Unfalls, um den Unfall zu klären → in Ordnung. Anzeige wegen eines Diebstahls, um den Unfall zu klären → Erpressung.","words":1720,"mins":9},{"id":"f-9-fälle-zum-rücktritt","subject":"faelle","num":"9","title":"9. Fälle zum Rücktritt","short":"Fälle zum Rücktritt","html":"<p>Zwei Fälle, und zu beiden hat der Dozent das Prüfungsschema <strong>per Hand aufs Flipchart gemalt<\/strong> und abfotografiert. Das ist ein starkes Signal, dass er darauf Wert legt.<\/p>\n<h3 id=\"f-fall-09-a-die-inspektion-vor-dem-urlaub\">Fall 09 a) — Die Inspektion vor dem Urlaub ★★<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Jimmy will mit seinem BMW X1 nach Andalusien und bringt ihn <strong>14 Tage vorher an einem Montag<\/strong> zur Inspektion in die Vertragswerkstatt. Werkstattleiterin Nancy will anrufen, wenn der Wagen fertig ist. <strong>Mittwoch<\/strong> hat Jimmy noch nichts gehört und ruft an; Nancy nennt Notfälle als Grund. Jimmy: „<strong>Wenn der Wagen am nächsten Montagmittag immer noch nicht fertig ist, gehe ich zur Konkurrenz.<\/strong>\" Am Montag hört er nichts, geht nachmittags hin und <strong>holt den Wagen ab<\/strong>. Nancy will ihn nicht herausgeben — sie habe für den Nachmittag extra Mechatroniker eingeplant — und verlangt ihren Werklohn.<\/p>\n<p><strong>Was gefragt ist.<\/strong> Muss Jimmy zahlen? Und: Er musste in einer anderen Werkstatt <strong>200 Euro Expresszuschlag<\/strong> zahlen — bekommt er die von Nancy?<\/p>\n<p><strong>Schritt für Schritt — Teil 1: der Werklohn.<\/strong><\/p>\n<p>Hier siehst du den <strong>Anspruchsaufbau aus Kapitel 3<\/strong> in Reinform. Nancy will Geld, also prüfst du <em>ihren<\/em> Anspruch:<\/p>\n<ol>\n<li><strong>Anspruch entstanden?<\/strong> Werkvertrag über die Inspektion, § 631. ✓<\/li>\n<li><strong>Anspruch erloschen?<\/strong> Möglicherweise durch <strong>Rücktritt, § 346<\/strong>. Dafür braucht es zweierlei:\n   - <strong>Rücktrittserklärung, § 349<\/strong> — Jimmy hat den Wagen abgeholt und angekündigt, zur Konkurrenz zu gehen. ✓\n   - <strong>Rücktrittsgrund<\/strong> — hier <strong>§ 323<\/strong>:<ul>\n<li>fällige Leistung, § 271 ✓<\/li>\n<li>nicht vertragsgemäß erfüllt ✓ (der Wagen war nicht fertig)<\/li>\n<li><strong>angemessene Nachfrist<\/strong> gesetzt? ✓ — genau das war der Anruf am Mittwoch mit der Frist bis Montagmittag<\/li>\n<\/ul>\n<\/li>\n<li>→ Rücktrittsgrund (+) → Anspruch aus § 631 <strong>erloschen<\/strong>. <strong>Nancy bekommt keinen Werklohn.<\/strong><\/li>\n<\/ol>\n<p><strong>Das handschriftliche Schema des Dozenten<\/strong> (vom Flipchart):<\/p>\n<pre><code>Anspruch Nancy → Jimmy: Zahlung d. Werklohns, § 631\n * Vertrag geschlossen\n      ⟹ Anspruch entstanden\n * Anspruch erloschen, § 346?  Rücktritt\n      * RT-Erklärung, § 349                    (+)\n      * RT-Recht aus Gesetz\n           - § 323\n           - fällige Leistung, § 271           (+)\n           - nicht (vertragsmäßig) erfüllt     (+)\n           * angemessene Nachfrist             (+)\n      ⟹ RT-Grund § 323                         (+)\n<\/code><\/pre>\n<p><strong>Schritt für Schritt — Teil 2: die 200 Euro Expresszuschlag.<\/strong><\/p>\n<ol>\n<li>Anspruchsgrundlage: <strong>§§ 325, 280<\/strong>.<\/li>\n<li>Das Problem: Nach dem Rücktritt gibt es eigentlich <strong>kein Schuldverhältnis mehr<\/strong> — wie soll man dann noch Schadensersatz aus ihm herleiten?<\/li>\n<li><strong>§ 325 löst genau das:<\/strong> Der Rücktritt <strong>schließt den Schadensersatz nicht aus<\/strong>. Der Anspruch bleibt erhalten.<\/li>\n<li>Pflichtverletzung: Nancy hat <strong>nicht rechtzeitig<\/strong> geleistet (§§ 271, 323).<\/li>\n<li>Vertretenmüssen: sogar <strong>vorsätzlich<\/strong> — sie hat andere Kunden vorgezogen (§ 276 I).<\/li>\n<li>Schaden: die 200 Euro. Nach <strong>§ 249<\/strong> ist der Zustand herzustellen, der ohne die Pflichtverletzung bestünde — dann hätte Jimmy 200 Euro weniger gezahlt. Das ist das <strong>positive Interesse<\/strong>.<\/li>\n<\/ol>\n<p><strong>Die Lösung des Dozenten<\/strong> (gekürzt):<\/p>\n<blockquote>\n<p>„Die 200 EUR Zuschlag stellen einen Schaden aus dem Vertrag dar, den Jimmy durch Rücktritt aufgelöst hat. Ein Schadensersatzanspruch gegen Nancy ergibt sich aus <strong>§§ 325, 280<\/strong>. […] <strong>Allerdings existiert zwischen den beiden nach Ausübung des Rücktritts durch J kein Schuldverhältnis mehr. Gleichwohl bleibt nach § 325 ein Schadensersatzanspruch auch in diesem Fall erhalten.<\/strong> […] Dies ist sogar vorsätzlich geschehen, da sie andere Kunden vorgezogen hat, so dass sie die Pflichtverletzung nach § 276 I zu vertreten hat. […] Nach § 249 hat Jimmy den Zustand herzustellen, der ohne das schädigende Ereignis […] eingetreten wäre (<strong>„positives Interesse\"<\/strong>). […] <strong>Im Gegensatz dazu wird in anderen Fällen (§§ 122, 179 II) nur das „negative Interesse\" ersetzt.<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Was du mitnimmst.<\/strong> Drei Dinge:<\/p>\n<ol>\n<li><strong>Der Rücktritt wird nicht als eigener Obersatz geprüft<\/strong>, sondern als <strong>Einwendung<\/strong> auf der zweiten Stufe („Anspruch erloschen?\"). Genau so hat es der Dozent aufgemalt.<\/li>\n<li><strong>§ 349 nicht vergessen<\/strong> — der Rücktritt braucht eine <strong>Erklärung<\/strong>. Das übersehen die meisten.<\/li>\n<li>Der letzte Satz des Dozenten ist ein direkter Fingerzeig auf eine wahrscheinliche Kurzfrage: <strong>positives vs. negatives Interesse.<\/strong> Er hat es auch auf ein zweites Flipchart geschrieben:<blockquote>\n<p>„<strong>§ 122<\/strong> — als ob die Vertragspartner sich <strong>nie getroffen<\/strong> hätten. <strong>„Vertrauensinteresse\" = negatives Interesse.<\/strong> Vermögensvergleich: hergestellt wird der Zustand <strong>vor Vertragsschluss<\/strong>.\"<\/p>\n<\/blockquote>\n<\/li>\n<\/ol>\n<h3 id=\"f-fall-09-b-der-sponsorenvertrag-nebenpflichtverletzung\">Fall 09 b) — Der Sponsorenvertrag (Nebenpflichtverletzung)<\/h3>\n<p><strong>Der Sachverhalt.<\/strong> Anneliese ist Leistungssportlerin und hat gerade die deutschen Meisterschaften im Siebenkampf gewonnen. Der Sportartikelhersteller <strong>Panther<\/strong> will sie als Gesicht einer Kampagne und schließt einen Vertrag über mehrere Marketing-Events in den nächsten drei Monaten. Dabei <strong>vergisst sie zu erwähnen<\/strong>, dass aus ihrem alten Sponsorenvertrag mit dem Konkurrenten <strong>Victoria<\/strong> noch ein Auftritt auf der Messe ISPO aussteht. Als Panther sie dort am Nachbarstand entdeckt, wirft man ihr Treuebruch vor und will sich <strong>sofort<\/strong> vom Vertrag lösen. Anneliese hält dagegen: Sie hätte nach <strong>§ 323 III<\/strong> erst abgemahnt werden müssen. Außerdem stehe im Vertrag nichts von „exklusiv\".<\/p>\n<p><strong>Schritt für Schritt.<\/strong>\n1. Panther will raus → <strong>Rücktritt, § 346<\/strong>. Erklärung nach § 349 liegt vor.\n2. Rücktrittsgrund? Die <strong>Hauptleistung<\/strong> hat Anneliese nicht verletzt — sie ist ja zu den Panther-Events erschienen.\n3. Aber es gibt auch <strong>Nebenpflichten<\/strong>: <strong>§ 241 II<\/strong> verpflichtet jede Partei zur Rücksicht auf die Interessen der anderen. Für ein Werbegesicht gehört dazu, nicht gleichzeitig für die Konkurrenz aufzutreten — auch ohne ausdrückliche Exklusivklausel.\n4. <strong>Zwei Wege zum selben Ergebnis:<\/strong>\n   - <strong>§ 324<\/strong> — Rücktritt wegen Verletzung einer Pflicht nach § 241 II. Dort ist <strong>keine Nachfrist<\/strong> vorgesehen. Das ist der direkte Weg, und ihn nennt die getippte Lösung.\n   - Oder über <strong>§ 323<\/strong> mit der Frage, ob die Nachfrist entbehrlich war — <strong>§ 323 II Nr. 3<\/strong> (besondere Umstände). So steht es auf dem Flipchart des Dozenten.\n5. → <strong>Rücktritt (+).<\/strong> Annelieses Einwand mit der Abmahnung greift nicht.<\/p>\n<p><strong>Die getippte Lösung des Dozenten<\/strong> ist denkbar knapp:<\/p>\n<blockquote>\n<p>„<strong>Rücktrittsgrund aus §§ 241 II, 324 (+)<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Sein handschriftliches Flipchart<\/strong> zeigt den vollen Weg:<\/p>\n<pre><code>Panther will sich vom Sponsoren-Vertrag lösen\n * Vertrag zustande gekommen                    (+)\n * Vertrag durch RT aufgelöst § 346\n    + Erklärung, § 349                          (+)\n    + Grund? § 323\n       * fällige Leistung?                      ✓\n       * nicht vertragsgemäß erfüllt?\n            * Hauptleistung o.k.\n            * Treuepflicht, § 241 II            ✓\n       * angemessene Nachfrist?                 (−)\n            entbehrlich nach § 323 II Nr. 3\n<\/code><\/pre>\n<p><strong>Was du mitnimmst.<\/strong> Der Merksatz für die Klausur:<\/p>\n<blockquote>\n<p><strong>Hauptleistung in Ordnung, aber Rücksichtnahmepflicht verletzt → § 241 II i.V.m. § 324.<\/strong><\/p>\n<\/blockquote>\n<p>Und: Eine Pflicht muss <strong>nicht im Vertrag stehen<\/strong>, um zu gelten. § 241 II gilt immer. Annelieses Argument „da stand nichts von exklusiv\" hilft ihr deshalb nicht.<\/p>","text":"Zwei Fälle, und zu beiden hat der Dozent das Prüfungsschema per Hand aufs Flipchart gemalt und abfotografiert. Das ist ein starkes Signal, dass er darauf Wert legt. Fall 09 a) — Die Inspektion vor dem Urlaub ★★ Der Sachverhalt. Jimmy will mit seinem BMW X1 nach Andalusien und bringt ihn 14 Tage vorher an einem Montag zur Inspektion in die Vertragswerkstatt. Werkstattleiterin Nancy will anrufen, wenn der Wagen fertig ist. Mittwoch hat Jimmy noch nichts gehört und ruft an; Nancy nennt Notfälle als Grund. Jimmy: „ Wenn der Wagen am nächsten Montagmittag immer noch nicht fertig ist, gehe ich zur Konkurrenz. \" Am Montag hört er nichts, geht nachmittags hin und holt den Wagen ab . Nancy will ihn nicht herausgeben — sie habe für den Nachmittag extra Mechatroniker eingeplant — und verlangt ihren Werklohn. Was gefragt ist. Muss Jimmy zahlen? Und: Er musste in einer anderen Werkstatt 200 Euro Expresszuschlag zahlen — bekommt er die von Nancy? Schritt für Schritt — Teil 1: der Werklohn. Hier siehst du den Anspruchsaufbau aus Kapitel 3 in Reinform. Nancy will Geld, also prüfst du ihren Anspruch: Anspruch entstanden? Werkvertrag über die Inspektion, § 631. ✓ Anspruch erloschen? Möglicherweise durch Rücktritt, § 346 . Dafür braucht es zweierlei: - Rücktrittserklärung, § 349 — Jimmy hat den Wagen abgeholt und angekündigt, zur Konkurrenz zu gehen. ✓ - Rücktrittsgrund — hier § 323 : fällige Leistung, § 271 ✓ nicht vertragsgemäß erfüllt ✓ (der Wagen war nicht fertig) angemessene Nachfrist gesetzt? ✓ — genau das war der Anruf am Mittwoch mit der Frist bis Montagmittag → Rücktrittsgrund (+) → Anspruch aus § 631 erloschen . Nancy bekommt keinen Werklohn. Das handschriftliche Schema des Dozenten (vom Flipchart): Anspruch Nancy → Jimmy: Zahlung d. Werklohns, § 631 * Vertrag geschlossen ⟹ Anspruch entstanden * Anspruch erloschen, § 346? Rücktritt * RT-Erklärung, § 349 (+) * RT-Recht aus Gesetz - § 323 - fällige Leistung, § 271 (+) - nicht (vertragsmäßig) erfüllt (+) * angemessene Nachfrist (+) ⟹ RT-Grund § 323 (+) Schritt für Schritt — Teil 2: die 200 Euro Expresszuschlag. Anspruchsgrundlage: §§ 325, 280 . Das Problem: Nach dem Rücktritt gibt es eigentlich kein Schuldverhältnis mehr — wie soll man dann noch Schadensersatz aus ihm herleiten? § 325 löst genau das: Der Rücktritt schließt den Schadensersatz nicht aus . Der Anspruch bleibt erhalten. Pflichtverletzung: Nancy hat nicht rechtzeitig geleistet (§§ 271, 323). Vertretenmüssen: sogar vorsätzlich — sie hat andere Kunden vorgezogen (§ 276 I). Schaden: die 200 Euro. Nach § 249 ist der Zustand herzustellen, der ohne die Pflichtverletzung bestünde — dann hätte Jimmy 200 Euro weniger gezahlt. Das ist das positive Interesse . Die Lösung des Dozenten (gekürzt): „Die 200 EUR Zuschlag stellen einen Schaden aus dem Vertrag dar, den Jimmy durch Rücktritt aufgelöst hat. Ein Schadensersatzanspruch gegen Nancy ergibt sich aus §§ 325, 280 . […] Allerdings existiert zwischen den beiden nach Ausübung des Rücktritts durch J kein Schuldverhältnis mehr. Gleichwohl bleibt nach § 325 ein Schadensersatzanspruch auch in diesem Fall erhalten. […] Dies ist sogar vorsätzlich geschehen, da sie andere Kunden vorgezogen hat, so dass sie die Pflichtverletzung nach § 276 I zu vertreten hat. […] Nach § 249 hat Jimmy den Zustand herzustellen, der ohne das schädigende Ereignis […] eingetreten wäre ( „positives Interesse\" ). […] Im Gegensatz dazu wird in anderen Fällen (§§ 122, 179 II) nur das „negative Interesse\" ersetzt. \" Was du mitnimmst. Drei Dinge: Der Rücktritt wird nicht als eigener Obersatz geprüft , sondern als Einwendung auf der zweiten Stufe („Anspruch erloschen?\"). Genau so hat es der Dozent aufgemalt. § 349 nicht vergessen — der Rücktritt braucht eine Erklärung . Das übersehen die meisten. Der letzte Satz des Dozenten ist ein direkter Fingerzeig auf eine wahrscheinliche Kurzfrage: positives vs. negatives Interesse. Er hat es auch auf ein zweites Flipchart geschrieben: „ § 122 — als ob die Vertragspartner sich nie getroffen hätten. „Vertrauensinteresse\" = negatives Interesse. Vermögensvergleich: hergestellt wird der Zustand vor Vertragsschluss .\" Fall 09 b) — Der Sponsorenvertrag (Nebenpflichtverletzung) Der Sachverhalt. Anneliese ist Leistungssportlerin und hat gerade die deutschen Meisterschaften im Siebenkampf gewonnen. Der Sportartikelhersteller Panther will sie als Gesicht einer Kampagne und schließt einen Vertrag über mehrere Marketing-Events in den nächsten drei Monaten. Dabei vergisst sie zu erwähnen , dass aus ihrem alten Sponsorenvertrag mit dem Konkurrenten Victoria noch ein Auftritt auf der Messe ISPO aussteht. Als Panther sie dort am Nachbarstand entdeckt, wirft man ihr Treuebruch vor und will sich sofort vom Vertrag lösen. Anneliese hält dagegen: Sie hätte nach § 323 III erst abgemahnt werden müssen. Außerdem stehe im Vertrag nichts von „exklusiv\". Schritt für Schritt. 1. Panther will raus → Rücktritt, § 346 . Erklärung nach § 349 liegt vor. 2. Rücktrittsgrund? Die Hauptleistung hat Anneliese nicht verletzt — sie ist ja zu den Panther-Events erschienen. 3. Aber es gibt auch Nebenpflichten : § 241 II verpflichtet jede Partei zur Rücksicht auf die Interessen der anderen. Für ein Werbegesicht gehört dazu, nicht gleichzeitig für die Konkurrenz aufzutreten — auch ohne ausdrückliche Exklusivklausel. 4. Zwei Wege zum selben Ergebnis: - § 324 — Rücktritt wegen Verletzung einer Pflicht nach § 241 II. Dort ist keine Nachfrist vorgesehen. Das ist der direkte Weg, und ihn nennt die getippte Lösung. - Oder über § 323 mit der Frage, ob die Nachfrist entbehrlich war — § 323 II Nr. 3 (besondere Umstände). So steht es auf dem Flipchart des Dozenten. 5. → Rücktritt (+). Annelieses Einwand mit der Abmahnung greift nicht. Die getippte Lösung des Dozenten ist denkbar knapp: „ Rücktrittsgrund aus §§ 241 II, 324 (+) \" Sein handschriftliches Flipchart zeigt den vollen Weg: Panther will sich vom Sponsoren-Vertrag lösen * Vertrag zustande gekommen (+) * Vertrag durch RT aufgelöst § 346 + Erklärung, § 349 (+) + Grund? § 323 * fällige Leistung? ✓ * nicht vertragsgemäß erfüllt? * Hauptleistung o.k. * Treuepflicht, § 241 II ✓ * angemessene Nachfrist? (−) entbehrlich nach § 323 II Nr. 3 Was du mitnimmst. Der Merksatz für die Klausur: Hauptleistung in Ordnung, aber Rücksichtnahmepflicht verletzt → § 241 II i.V.m. § 324. Und: Eine Pflicht muss nicht im Vertrag stehen , um zu gelten. § 241 II gilt immer. Annelieses Argument „da stand nichts von exklusiv\" hilft ihr deshalb nicht.","words":1033,"mins":5},{"id":"f-wie-du-mit-diesen-fällen-arbeitest","subject":"faelle","num":null,"title":"Wie du mit diesen Fällen arbeitest","short":"Wie du mit diesen Fällen arbeitest","html":"<p><strong>Nicht lesen — rechnen.<\/strong> Der Nutzen entsteht erst, wenn du selbst schreibst.<\/p>\n<p><strong>Der Ablauf, den ich dir empfehle:<\/strong><\/p>\n<ol>\n<li>Lies nur den <strong>Sachverhalt<\/strong> und die Frage. Deck den Rest ab.<\/li>\n<li>Mal die <strong>Personen<\/strong> auf und zieh Pfeile zwischen ihnen.<\/li>\n<li>Schreib den <strong>Obersatz<\/strong> hin: Wer will was von wem woraus?<\/li>\n<li>Arbeite die Prüfung stichwortartig durch — mit <strong>(+)<\/strong> und <strong>(−)<\/strong>, so wie der Dozent.<\/li>\n<li><strong>Erst dann<\/strong> aufdecken und vergleichen.<\/li>\n<\/ol>\n<p><strong>Die sieben Fälle, die du auf jeden Fall gerechnet haben solltest:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Fall<\/th>\n<th>Warum<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>02 d)<\/strong> Angebot und Widerruf per Mail<\/td>\n<td>die einzige vollständig ausformulierte Musterlösung — deine Schreibvorlage<\/td>\n<\/tr>\n<tr>\n<td><strong>03 e)<\/strong> Simson-Schwalbe<\/td>\n<td>Minderjährige + Abstraktionsprinzip in einem<\/td>\n<\/tr>\n<tr>\n<td><strong>03 f)<\/strong> EA Sports<\/td>\n<td>die „Übungsklausur\", zweimal beigelegt<\/td>\n<\/tr>\n<tr>\n<td><strong>06 b)<\/strong> Kühlschrank<\/td>\n<td>strukturell am nächsten an deiner Probeklausur<\/td>\n<\/tr>\n<tr>\n<td><strong>07 c)<\/strong> Zahngold<\/td>\n<td>enthält das Bewertungsschema<\/td>\n<\/tr>\n<tr>\n<td><strong>07 g)<\/strong> Trojaner<\/td>\n<td>IT-Fall, § 823 mit beiden Kausalitäten<\/td>\n<\/tr>\n<tr>\n<td><strong>08 f)<\/strong> Drohung<\/td>\n<td>Zweck-Mittel-Relation, sehr beliebte Prüfungsfrage<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Nicht lesen — rechnen. Der Nutzen entsteht erst, wenn du selbst schreibst. Der Ablauf, den ich dir empfehle: Lies nur den Sachverhalt und die Frage. Deck den Rest ab. Mal die Personen auf und zieh Pfeile zwischen ihnen. Schreib den Obersatz hin: Wer will was von wem woraus? Arbeite die Prüfung stichwortartig durch — mit (+) und (−) , so wie der Dozent. Erst dann aufdecken und vergleichen. Die sieben Fälle, die du auf jeden Fall gerechnet haben solltest: Fall Warum 02 d) Angebot und Widerruf per Mail die einzige vollständig ausformulierte Musterlösung — deine Schreibvorlage 03 e) Simson-Schwalbe Minderjährige + Abstraktionsprinzip in einem 03 f) EA Sports die „Übungsklausur\", zweimal beigelegt 06 b) Kühlschrank strukturell am nächsten an deiner Probeklausur 07 c) Zahngold enthält das Bewertungsschema 07 g) Trojaner IT-Fall, § 823 mit beiden Kausalitäten 08 f) Drohung Zweck-Mittel-Relation, sehr beliebte Prüfungsfrage","words":143,"mins":1},{"id":"d-inhaltsverzeichnis","subject":"ds","num":null,"title":"Inhaltsverzeichnis","short":"Inhaltsverzeichnis","html":"<table>\n<thead>\n<tr>\n<th>Kap.<\/th>\n<th>Thema<\/th>\n<th>Artikel<\/th>\n<th>Gewicht<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>0<\/strong><\/td>\n<td><a href=\"#d-0-klausur-cockpit\">Klausur-Cockpit &amp; Strategie<\/a><\/td>\n<td>–<\/td>\n<td>Pflicht<\/td>\n<\/tr>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td><a href=\"#d-1-rechtsrahmen--grundrecht\">Rechtsrahmen &amp; Grundrecht<\/a><\/td>\n<td>Art. 1<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td><a href=\"#d-2-anwendungsbereich\">Anwendungsbereich<\/a><\/td>\n<td>Art. 2, 3<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td><a href=\"#d-3-begriffe-personenbezogene-daten\">Begriffe: personenbezogene Daten<\/a><\/td>\n<td>Art. 4, 9<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>4<\/strong><\/td>\n<td><a href=\"#d-4-die-neun-grundsätze\">Die neun Grundsätze<\/a><\/td>\n<td>Art. 5<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>5<\/strong><\/td>\n<td><a href=\"#d-5-rechtmäßigkeit--einwilligung\">Rechtmäßigkeit &amp; Einwilligung<\/a><\/td>\n<td>Art. 6, 7<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>6<\/strong><\/td>\n<td><a href=\"#d-6-informationspflichten--betroffenenrechte\">Informationspflichten &amp; Betroffenenrechte<\/a><\/td>\n<td>Art. 13–21<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>7<\/strong><\/td>\n<td><a href=\"#d-7-datensicherheit--toms\">Datensicherheit &amp; TOMs<\/a><\/td>\n<td>Art. 32<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>8<\/strong><\/td>\n<td><a href=\"#d-8-datenschutzmanagement\">Datenschutzmanagement<\/a><\/td>\n<td>Art. 30<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td><strong>9<\/strong><\/td>\n<td><a href=\"#d-9-haftung--geldbußen\">Haftung &amp; Geldbußen<\/a><\/td>\n<td>Art. 83<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>10<\/strong><\/td>\n<td><a href=\"#d-10-der-datenschutzbeauftragte\">Der Datenschutzbeauftragte<\/a><\/td>\n<td>Art. 37–39<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>11<\/strong><\/td>\n<td><a href=\"#d-11-auftragsverarbeitung\">Auftragsverarbeitung<\/a><\/td>\n<td>Art. 28<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td><strong>12<\/strong><\/td>\n<td><a href=\"#d-12-datenschutz-folgenabschätzung\">Datenschutz-Folgenabschätzung<\/a><\/td>\n<td>Art. 35<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td><strong>13<\/strong><\/td>\n<td><a href=\"#d-13-datenschutzverletzung--datenpanne\">Datenschutzverletzung / Datenpanne<\/a><\/td>\n<td>Art. 33, 34<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>14<\/strong><\/td>\n<td><a href=\"#d-14-beschäftigtendatenschutz\">Beschäftigtendatenschutz<\/a><\/td>\n<td>§ 26 BDSG<\/td>\n<td>★★<\/td>\n<\/tr>\n<tr>\n<td><strong>15<\/strong><\/td>\n<td><a href=\"#d-15-cybersicherheit\">Cybersicherheit<\/a><\/td>\n<td>–<\/td>\n<td>★<\/td>\n<\/tr>\n<tr>\n<td><strong>16<\/strong><\/td>\n<td><a href=\"#d-16-künstliche-intelligenz--ki-vo\">Künstliche Intelligenz &amp; KI-VO<\/a><\/td>\n<td>KI-VO<\/td>\n<td>★★★<\/td>\n<\/tr>\n<tr>\n<td><strong>A<\/strong><\/td>\n<td><a href=\"#d-anhang-a-zahlen-cheatsheet\">Zahlen-Cheatsheet<\/a><\/td>\n<td>–<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td><strong>B<\/strong><\/td>\n<td><a href=\"#d-anhang-b-fehler-in-den-folien\">Fehler in den Folien<\/a><\/td>\n<td>–<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td><strong>C<\/strong><\/td>\n<td><a href=\"#d-anhang-c-dein-dsgvo-ausdruck\">Dein DSGVO-Ausdruck<\/a><\/td>\n<td>–<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td><strong>D<\/strong><\/td>\n<td><a href=\"#d-anhang-d-60-übungsfragen\">60 Übungs-True/False-Fragen<\/a><\/td>\n<td>–<\/td>\n<td>–<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Kap. Thema Artikel Gewicht 0 Klausur-Cockpit & Strategie – Pflicht 1 Rechtsrahmen & Grundrecht Art. 1 ★★ 2 Anwendungsbereich Art. 2, 3 ★★★ 3 Begriffe: personenbezogene Daten Art. 4, 9 ★★★ 4 Die neun Grundsätze Art. 5 ★★★ 5 Rechtmäßigkeit & Einwilligung Art. 6, 7 ★★★ 6 Informationspflichten & Betroffenenrechte Art. 13–21 ★★★ 7 Datensicherheit & TOMs Art. 32 ★★★ 8 Datenschutzmanagement Art. 30 ★★ 9 Haftung & Geldbußen Art. 83 ★★★ 10 Der Datenschutzbeauftragte Art. 37–39 ★★★ 11 Auftragsverarbeitung Art. 28 ★★ 12 Datenschutz-Folgenabschätzung Art. 35 ★★ 13 Datenschutzverletzung / Datenpanne Art. 33, 34 ★★★ 14 Beschäftigtendatenschutz § 26 BDSG ★★ 15 Cybersicherheit – ★ 16 Künstliche Intelligenz & KI-VO KI-VO ★★★ A Zahlen-Cheatsheet – – B Fehler in den Folien – – C Dein DSGVO-Ausdruck – – D 60 Übungs-True/False-Fragen – –","words":134,"mins":1},{"id":"d-0-klausur-cockpit","subject":"ds","num":"0","title":"0. Klausur-Cockpit","short":"Klausur-Cockpit","html":"<h3 id=\"d-warum-dieses-blatt-anders-aufgebaut-ist-als-das-recht-blatt\">Warum dieses Blatt anders aufgebaut ist als das Recht-Blatt<\/h3>\n<p>Im Recht-Teil brauchst du <strong>Struktur und Argumentation<\/strong>. Hier brauchst du <strong>Wiedererkennung<\/strong>. Bei einer True/False-Frage hast du keine Zeit für Herleitung — du musst den Satz lesen und sofort wissen, ob er stimmt.<\/p>\n<p>Deshalb ist dieses Blatt so gebaut:\n- <strong>Kurze Faktensätze<\/strong> statt Fließtext.\n- <strong>Zahlen und Artikel-Nummern<\/strong> hervorgehoben — das sind die häufigsten Fallen.\n- Zu jedem Kapitel <strong>„Typische Fallen\"<\/strong> mit fertigen T/F-Beispielen.\n- Am Ende <strong>60 Übungsfragen<\/strong> zum Selbsttest.<\/p>\n<h3 id=\"d-strategie-fur-die-24-fragen\">Strategie für die 24 Fragen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Regel<\/th>\n<th>Warum<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Plan die 24 Fragen auf 5–8 Minuten.<\/strong><\/td>\n<td>Das sind 24 sichere Punkte. Sie sind schneller verdient als jeder Gutachtenabsatz.<\/td>\n<\/tr>\n<tr>\n<td><strong>Achte auf absolute Wörter.<\/strong><\/td>\n<td>„immer\", „nie\", „ausschließlich\", „in jedem Fall\", „grundsätzlich nicht\" — solche Sätze sind häufiger falsch als richtig, weil das Datenschutzrecht fast überall Ausnahmen kennt.<\/td>\n<\/tr>\n<tr>\n<td><strong>Achte auf vertauschte Zahlen.<\/strong><\/td>\n<td>72 Stunden ↔ 72 Tage, 10 Mio ↔ 20 Mio, 2 % ↔ 4 %, 16 Jahre ↔ 18 Jahre. Das ist die beliebteste Falle überhaupt.<\/td>\n<\/tr>\n<tr>\n<td><strong>Achte auf vertauschte Artikel.<\/strong><\/td>\n<td>Art. 15 (Auskunft) ↔ Art. 17 (Löschung) ↔ Art. 20 (Portabilität) ↔ Art. 21 (Widerspruch).<\/td>\n<\/tr>\n<tr>\n<td><strong>Nicht grübeln.<\/strong><\/td>\n<td>Bei 1 Punkt pro Frage lohnt sich kein Nachdenken über 30 Sekunden. Erste Intuition, weiter.<\/td>\n<\/tr>\n<tr>\n<td><strong>Nichts leer lassen.<\/strong><\/td>\n<td>Es gibt (üblicherweise) keinen Minuspunkt für Falsches. 50 % Trefferchance beim Raten schlägt 0 %.<\/td>\n<\/tr>\n<tr>\n<td><strong>Nutz den DSGVO-Ausdruck<\/strong> — aber nur für Artikel 1–39.<\/td>\n<td>Mehr steht nicht drin. Siehe Anhang C.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"d-die-agenda-des-dozenten-folien-67-original\">Die Agenda des Dozenten (Folien 6–7, Original)<\/h3>\n<blockquote>\n<p>„1. Datenschutz in der EU · 2. Persönlichkeitsrechtsschutz, Ziele und Anwendungsbereich · 3. Datenschutz – ein ganzheitlicher Ansatz · 4. Schutzziele, Datenschutz und Datensicherheit · 5. Begriffe der DS-GVO · 6. Grundsätze für die Verarbeitung · 7. Informationspflichten und Rechte des Betroffenen · 8. Cybersicherheit · 9. Datenschutzmanagementsystem · 10. Haftungsfragen und Geldbußen / Strafen · 11. Der Datenschutzbeauftragte · 12. Auftragsdatenverarbeitung · 13. Datenschutz-Folgenabschätzung · 14. Datenschutz-Verletzung · 15. Beschäftigtendatenschutz · 16. Schlüsseltechnologie Künstliche Intelligenz (KI) und KI-Verordnung\"<\/p>\n<\/blockquote>\n<p><strong>Diese 16 Punkte sind die Kapitelstruktur dieses Blatts.<\/strong> Wenn der Dozent 24 Fragen stellt, kommt statistisch aus fast jedem Block mindestens eine.<\/p>","text":"Warum dieses Blatt anders aufgebaut ist als das Recht-Blatt Im Recht-Teil brauchst du Struktur und Argumentation . Hier brauchst du Wiedererkennung . Bei einer True/False-Frage hast du keine Zeit für Herleitung — du musst den Satz lesen und sofort wissen, ob er stimmt. Deshalb ist dieses Blatt so gebaut: - Kurze Faktensätze statt Fließtext. - Zahlen und Artikel-Nummern hervorgehoben — das sind die häufigsten Fallen. - Zu jedem Kapitel „Typische Fallen\" mit fertigen T/F-Beispielen. - Am Ende 60 Übungsfragen zum Selbsttest. Strategie für die 24 Fragen Regel Warum Plan die 24 Fragen auf 5–8 Minuten. Das sind 24 sichere Punkte. Sie sind schneller verdient als jeder Gutachtenabsatz. Achte auf absolute Wörter. „immer\", „nie\", „ausschließlich\", „in jedem Fall\", „grundsätzlich nicht\" — solche Sätze sind häufiger falsch als richtig, weil das Datenschutzrecht fast überall Ausnahmen kennt. Achte auf vertauschte Zahlen. 72 Stunden ↔ 72 Tage, 10 Mio ↔ 20 Mio, 2 % ↔ 4 %, 16 Jahre ↔ 18 Jahre. Das ist die beliebteste Falle überhaupt. Achte auf vertauschte Artikel. Art. 15 (Auskunft) ↔ Art. 17 (Löschung) ↔ Art. 20 (Portabilität) ↔ Art. 21 (Widerspruch). Nicht grübeln. Bei 1 Punkt pro Frage lohnt sich kein Nachdenken über 30 Sekunden. Erste Intuition, weiter. Nichts leer lassen. Es gibt (üblicherweise) keinen Minuspunkt für Falsches. 50 % Trefferchance beim Raten schlägt 0 %. Nutz den DSGVO-Ausdruck — aber nur für Artikel 1–39. Mehr steht nicht drin. Siehe Anhang C. Die Agenda des Dozenten (Folien 6–7, Original) „1. Datenschutz in der EU · 2. Persönlichkeitsrechtsschutz, Ziele und Anwendungsbereich · 3. Datenschutz – ein ganzheitlicher Ansatz · 4. Schutzziele, Datenschutz und Datensicherheit · 5. Begriffe der DS-GVO · 6. Grundsätze für die Verarbeitung · 7. Informationspflichten und Rechte des Betroffenen · 8. Cybersicherheit · 9. Datenschutzmanagementsystem · 10. Haftungsfragen und Geldbußen / Strafen · 11. Der Datenschutzbeauftragte · 12. Auftragsdatenverarbeitung · 13. Datenschutz-Folgenabschätzung · 14. Datenschutz-Verletzung · 15. Beschäftigtendatenschutz · 16. Schlüsseltechnologie Künstliche Intelligenz (KI) und KI-Verordnung\" Diese 16 Punkte sind die Kapitelstruktur dieses Blatts. Wenn der Dozent 24 Fragen stellt, kommt statistisch aus fast jedem Block mindestens eine.","words":342,"mins":2},{"id":"d-1-rechtsrahmen--grundrecht","subject":"ds","num":"1","title":"1. Rechtsrahmen & Grundrecht","short":"Rechtsrahmen & Grundrecht","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\nWoher kommt der Datenschutz überhaupt, und welches Gesetz gilt?<\/p>\n<p>Kurz: Ein Urteil von 1983 hat entschieden, dass jeder selbst bestimmen darf, wer was über ihn weiß. Seit 2018 gilt dafür europaweit dieselbe Verordnung — die DSGVO.<\/p>\n<p>Hier stehen ein paar <strong>Jahreszahlen<\/strong>, die man leicht vertauscht. Genau danach wird bei True/False gern gefragt.<\/p>\n<\/blockquote>\n<h3 id=\"d-11-die-daten-zum-merken\">1.1 Die Daten zum Merken<\/h3>\n<p><strong>Folie 9 (Original):<\/strong><\/p>\n<blockquote>\n<p>„Die Europäische Datenschutzgrundverordung (DS-GVO) ist am <strong>25.05.2016 in Kraft getreten<\/strong> und ab <strong>25.05.2018<\/strong> in allen Mitgliedsstaaten <strong>verpflichtend anzuwenden<\/strong>.\"<\/p>\n<\/blockquote>\n<p><strong>Zwei Daten, ein Unterschied — das ist eine klassische Falle:<\/strong>\n- <strong>25.05.2016<\/strong> = Inkrafttreten\n- <strong>25.05.2018<\/strong> = Anwendbarkeit (die zweijährige Übergangsfrist endete)<\/p>\n<p><strong>Folie 10 (Original):<\/strong><\/p>\n<blockquote>\n<p>„Datenschutz aktuelles Recht = <strong>DS-GVO + BDSG-neu + weitere Gesetze mit Sicherheitsbestimmungen<\/strong>\n➢ Europäische Vereinheitlichung vs. Bürokratiezuwachs\"<\/p>\n<\/blockquote>\n<h3 id=\"d-was-ist-eine-verordnung-wichtig-fur-tf\">Was ist eine Verordnung? (wichtig für T/F)<\/h3>\n<p>Die DSGVO ist eine <strong>Verordnung<\/strong>, keine Richtlinie. Der Unterschied:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Verordnung<\/strong> (DSGVO)<\/th>\n<th><strong>Richtlinie<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Wirkung<\/td>\n<td>gilt <strong>unmittelbar<\/strong> in allen Mitgliedstaaten<\/td>\n<td>muss erst in nationales Recht <strong>umgesetzt<\/strong> werden<\/td>\n<\/tr>\n<tr>\n<td>Umsetzungsgesetz nötig?<\/td>\n<td><strong>nein<\/strong><\/td>\n<td>ja<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Das <strong>BDSG<\/strong> ergänzt die DSGVO nur dort, wo sie den Mitgliedstaaten Spielraum lässt (sog. Öffnungsklauseln) — z. B. beim Beschäftigtendatenschutz (§ 26) und bei der DSB-Benennungspflicht (§ 38).<\/p>\n<p><strong>Einfach gesagt:<\/strong> Die DSGVO ist das europäische Hauptgesetz. Es gilt in Deutschland, Frankreich und Polen wortgleich. Das deutsche BDSG darf nur an den wenigen Stellen etwas ergänzen, an denen die DSGVO das <strong>ausdrücklich erlaubt<\/strong> — zum Beispiel beim Arbeitnehmerdatenschutz.<\/p>\n<p>Vergleich: Die DSGVO ist die Straßenverkehrsordnung, die überall in Europa gilt. Das BDSG ist das Ortsschild, das in einer bestimmten Straße Tempo 30 anordnet — aber es darf die Vorfahrtsregeln nicht umschreiben.<\/p>\n<h3 id=\"d-12-das-volkszahlungsurteil-die-deutsche-wurzel\">1.2 Das Volkszählungsurteil — die deutsche Wurzel<\/h3>\n<p><strong>Folie 11 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Volkszählungsurteil des BVerfG vom 15. Dezember 1983<\/strong>\nEffektiver Datenschutz ist keine Schikane, sondern eine grundlegende Weichenstellung des Zusammenlebens in unserer freiheitlichen Demokratie.\"<\/p>\n<\/blockquote>\n<p><strong>Folie 12 (Original):<\/strong><\/p>\n<blockquote>\n<p>„<strong>Bürger haben Recht auf informationelle Selbstbestimmung<\/strong>\n➢ Ein <strong>Grundrecht auf Datenschutz<\/strong>, das das Gericht aus den <strong>Artikeln 1 und 2 des Grundgesetzes<\/strong> ableitet.\n<strong>Viele Deutsche haben Angst vor Datenmissbrauch<\/strong> … <strong>Kontrolle über Daten gehört zum selbstbestimmten Leben<\/strong> … <strong>Ohne Datenschutz ist also kein demokratischer Staat zu machen<\/strong>\n➢ Selbstbestimmung ist eine elementare Funktionsbedingung eines auf Handlungs- und Mitwirkungsfähigkeit seiner Bürger begründeten freiheitlichen demokratischen Gemeinwesens.\"<\/p>\n<\/blockquote>\n<p><strong>Merke die Fakten:<\/strong>\n- Gericht: <strong>Bundesverfassungsgericht (BVerfG)<\/strong>\n- Datum: <strong>15. Dezember 1983<\/strong>\n- Ergebnis: <strong>Recht auf informationelle Selbstbestimmung<\/strong>\n- Hergeleitet aus: <strong>Art. 1 und Art. 2 GG<\/strong> (Menschenwürde + allgemeines Persönlichkeitsrecht)<\/p>\n<p><strong>In einem Satz:<\/strong> <em>Du entscheidest selbst, wer was wann über dich weiß.<\/em><\/p>\n<h3 id=\"d-13-art-1-dsgvo-der-zweck\">1.3 Art. 1 DSGVO — der Zweck<\/h3>\n<p>Die Folie 16 zeigt eine Grafik mit dem Kern von Art. 1:<\/p>\n<pre><code> Schutz der GRUNDRECHTE          ┌──────────────────┐        Recht natürlicher Personen\n und Grundfreiheiten      ◀──────│  Artikel 1 DSGVO │──────▶  auf Schutz personen-\n natürlicher Personen            └──────────────────┘         bezogener DATEN\n         │                                                            │\n Informationelle                                                 IT-Sicherheit\n Selbstbestimmung\n<\/code><\/pre>\n<p><strong>Merke:<\/strong> Die DSGVO schützt <strong>natürliche Personen<\/strong> — nicht Unternehmen, nicht Verstorbene, nicht Tiere.<\/p>\n<h3 id=\"d-14-ziele-der-dsgvo-erwagungsgrund-11\">1.4 Ziele der DSGVO (Erwägungsgrund 11)<\/h3>\n<p><strong>Folie 15 (Original):<\/strong><\/p>\n<blockquote>\n<p>„Erwägungsgrund Nr. 11: „Ein unionsweiter wirksamer Schutz pbD erfordert eine … <strong>Stärkung und Präzisierung der Rechte der betroffenen Personen<\/strong> sowie eine <strong>Verschärfung der Verpflichtungen<\/strong> für diejenigen, die pbD verarbeiten und darüber entscheiden, aber ebenso <strong>gleiche Befugnisse der Mitgliedstaaten<\/strong> bei der Überwachung … sowie <strong>gleiche Sanktionen<\/strong> im Falle ihrer Verletzung.\"\"<\/p>\n<\/blockquote>\n<p>Vier Ziele: <strong>Rechte stärken · Pflichten verschärfen · gleiche Befugnisse · gleiche Sanktionen.<\/strong><\/p>\n<h3 id=\"d-15-datenschutz-vs-datensicherheit-vs-informationssicherheit\">1.5 Datenschutz vs. Datensicherheit vs. Informationssicherheit<\/h3>\n<p>Folie 17 zeigt drei überlappende Kreise. Der Unterschied ist eine sehr typische T/F-Frage:<\/p>\n<table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Schützt …<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Datenschutz<\/strong><\/td>\n<td>die <strong>Person<\/strong> vor Missbrauch ihrer Daten<\/td>\n<td>Darf ich die IP-Adresse überhaupt speichern?<\/td>\n<\/tr>\n<tr>\n<td><strong>Datensicherheit / IT-Sicherheit<\/strong><\/td>\n<td>die <strong>Daten<\/strong> vor Verlust, Veränderung, Zugriff<\/td>\n<td>Ist die Datenbank verschlüsselt?<\/td>\n<\/tr>\n<tr>\n<td><strong>Informationsschutz<\/strong><\/td>\n<td><strong>alle<\/strong> Informationen (auch nicht-personenbezogene)<\/td>\n<td>Betriebsgeheimnisse, Quellcode<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Merksatz:<\/strong> <em>Datenschutz schützt Menschen. Datensicherheit schützt Daten.<\/em>\nMan kann perfekte Datensicherheit haben und trotzdem gegen den Datenschutz verstoßen — nämlich wenn man perfekt verschlüsselt Daten speichert, die man gar nicht speichern darf.<\/p>\n<h3 id=\"d-16-das-grundparadigma-folie-18\">1.6 Das Grundparadigma (Folie 18)<\/h3>\n<p>Der Dozent zeigt einen Kreislauf:<\/p>\n<pre><code>Schutzziele definieren → Risiken und Bedrohungen identifizieren → Risiken abwägen\n→ Schutzmaßnahmen definieren → Maßnahmen umsetzen → auf Wirksamkeit prüfen → (zurück zum Anfang)\n<\/code><\/pre>\n<h3 id=\"d-17-schutzziele-des-datenschutzes-folie-19\">1.7 Schutzziele des Datenschutzes (Folie 19)<\/h3>\n<p><strong>Original:<\/strong><\/p>\n<blockquote>\n<p>„➢ <strong>Primäres Schutzziel: Persönlichkeitsschutz.<\/strong> Den einzelnen Menschen vor Missbrauch seiner personenbezogenen Daten zu schützen und die Voraussetzungen für die Wahrnehmung des informationellen Selbstbestimmungsrechts zu schaffen. Im Wesentlichen geht es um: die <strong>Zulässigkeit<\/strong> der Verarbeitung pbD · die Sicherstellung der erforderlichen <strong>technischen und organisatorischen Maßnahmen<\/strong> · die <strong>Datenschutzkonformität aller Geschäftsprozesse<\/strong>\n➢ <strong>Sekundäres Schutzziel: Datenminimierung<\/strong> — Anonymität, Pseudonymität\"<\/p>\n<\/blockquote>\n<p><strong>Merke:<\/strong> primär = <strong>Persönlichkeitsschutz<\/strong>, sekundär = <strong>Datenminimierung<\/strong>.<\/p>\n<h3 id=\"d-typische-fallen-zu-kapitel-1\">Typische Fallen zu Kapitel 1<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aussage<\/th>\n<th>✓/✗<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Die DSGVO gilt seit dem 25.05.2018 verpflichtend in allen Mitgliedstaaten.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Die DSGVO ist eine Richtlinie und musste in deutsches Recht umgesetzt werden.<\/td>\n<td><strong>✗<\/strong> — sie ist eine <strong>Verordnung<\/strong> und gilt unmittelbar<\/td>\n<\/tr>\n<tr>\n<td>Das Recht auf informationelle Selbstbestimmung wurde vom BGH entwickelt.<\/td>\n<td><strong>✗<\/strong> — vom <strong>BVerfG<\/strong> (Volkszählungsurteil 1983)<\/td>\n<\/tr>\n<tr>\n<td>Das Recht auf informationelle Selbstbestimmung leitet sich aus Art. 1 und 2 GG ab.<\/td>\n<td><strong>✓<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Datenschutz und Datensicherheit sind dasselbe.<\/td>\n<td><strong>✗<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Primäres Schutzziel des Datenschutzes ist die Datenminimierung.<\/td>\n<td><strong>✗<\/strong> — primär ist der <strong>Persönlichkeitsschutz<\/strong>, Datenminimierung ist sekundär<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","text":"Worum es hier geht — in einfachen Worten Woher kommt der Datenschutz überhaupt, und welches Gesetz gilt? Kurz: Ein Urteil von 1983 hat entschieden, dass jeder selbst bestimmen darf, wer was über ihn weiß. Seit 2018 gilt dafür europaweit dieselbe Verordnung — die DSGVO. Hier stehen ein paar Jahreszahlen , die man leicht vertauscht. Genau danach wird bei True/False gern gefragt. 1.1 Die Daten zum Merken Folie 9 (Original): „Die Europäische Datenschutzgrundverordung (DS-GVO) ist am 25.05.2016 in Kraft getreten und ab 25.05.2018 in allen Mitgliedsstaaten verpflichtend anzuwenden .\" Zwei Daten, ein Unterschied — das ist eine klassische Falle: - 25.05.2016 = Inkrafttreten - 25.05.2018 = Anwendbarkeit (die zweijährige Übergangsfrist endete) Folie 10 (Original): „Datenschutz aktuelles Recht = DS-GVO + BDSG-neu + weitere Gesetze mit Sicherheitsbestimmungen ➢ Europäische Vereinheitlichung vs. Bürokratiezuwachs\" Was ist eine Verordnung? (wichtig für T/F) Die DSGVO ist eine Verordnung , keine Richtlinie. Der Unterschied: Verordnung (DSGVO) Richtlinie Wirkung gilt unmittelbar in allen Mitgliedstaaten muss erst in nationales Recht umgesetzt werden Umsetzungsgesetz nötig? nein ja Das BDSG ergänzt die DSGVO nur dort, wo sie den Mitgliedstaaten Spielraum lässt (sog. Öffnungsklauseln) — z. B. beim Beschäftigtendatenschutz (§ 26) und bei der DSB-Benennungspflicht (§ 38). Einfach gesagt: Die DSGVO ist das europäische Hauptgesetz. Es gilt in Deutschland, Frankreich und Polen wortgleich. Das deutsche BDSG darf nur an den wenigen Stellen etwas ergänzen, an denen die DSGVO das ausdrücklich erlaubt — zum Beispiel beim Arbeitnehmerdatenschutz. Vergleich: Die DSGVO ist die Straßenverkehrsordnung, die überall in Europa gilt. Das BDSG ist das Ortsschild, das in einer bestimmten Straße Tempo 30 anordnet — aber es darf die Vorfahrtsregeln nicht umschreiben. 1.2 Das Volkszählungsurteil — die deutsche Wurzel Folie 11 (Original): „ Volkszählungsurteil des BVerfG vom 15. Dezember 1983 Effektiver Datenschutz ist keine Schikane, sondern eine grundlegende Weichenstellung des Zusammenlebens in unserer freiheitlichen Demokratie.\" Folie 12 (Original): „ Bürger haben Recht auf informationelle Selbstbestimmung ➢ Ein Grundrecht auf Datenschutz , das das Gericht aus den Artikeln 1 und 2 des Grundgesetzes ableitet. Viele Deutsche haben Angst vor Datenmissbrauch … Kontrolle über Daten gehört zum selbstbestimmten Leben … Ohne Datenschutz ist also kein demokratischer Staat zu machen ➢ Selbstbestimmung ist eine elementare Funktionsbedingung eines auf Handlungs- und Mitwirkungsfähigkeit seiner Bürger begründeten freiheitlichen demokratischen Gemeinwesens.\" Merke die Fakten: - Gericht: Bundesverfassungsgericht (BVerfG) - Datum: 15. Dezember 1983 - Ergebnis: Recht auf informationelle Selbstbestimmung - Hergeleitet aus: Art. 1 und Art. 2 GG (Menschenwürde + allgemeines Persönlichkeitsrecht) In einem Satz: Du entscheidest selbst, wer was wann über dich weiß. 1.3 Art. 1 DSGVO — der Zweck Die Folie 16 zeigt eine Grafik mit dem Kern von Art. 1: Schutz der GRUNDRECHTE ┌──────────────────┐ Recht natürlicher Personen und Grundfreiheiten ◀──────│ Artikel 1 DSGVO │──────▶ auf Schutz personen- natürlicher Personen └──────────────────┘ bezogener DATEN │ │ Informationelle IT-Sicherheit Selbstbestimmung Merke: Die DSGVO schützt natürliche Personen — nicht Unternehmen, nicht Verstorbene, nicht Tiere. 1.4 Ziele der DSGVO (Erwägungsgrund 11) Folie 15 (Original): „Erwägungsgrund Nr. 11: „Ein unionsweiter wirksamer Schutz pbD erfordert eine … Stärkung und Präzisierung der Rechte der betroffenen Personen sowie eine Verschärfung der Verpflichtungen für diejenigen, die pbD verarbeiten und darüber entscheiden, aber ebenso gleiche Befugnisse der Mitgliedstaaten bei der Überwachung … sowie gleiche Sanktionen im Falle ihrer Verletzung.\"\" Vier Ziele: Rechte stärken · Pflichten verschärfen · gleiche Befugnisse · gleiche Sanktionen. 1.5 Datenschutz vs. Datensicherheit vs. Informationssicherheit Folie 17 zeigt drei überlappende Kreise. Der Unterschied ist eine sehr typische T/F-Frage: Begriff Schützt … Beispiel Datenschutz die Person vor Missbrauch ihrer Daten Darf ich die IP-Adresse überhaupt speichern? Datensicherheit / IT-Sicherheit die Daten vor Verlust, Veränderung, Zugriff Ist die Datenbank verschlüsselt? Informationsschutz alle Informationen (auch nicht-personenbezogene) Betriebsgeheimnisse, Quellcode Merksatz: Datenschutz schützt Menschen. Datensicherheit schützt Daten. Man kann perfekte Datensicherheit haben und trotzdem gegen den Datenschutz verstoßen — nämlich wenn man perfekt verschlüsselt Daten speichert, die man gar nicht speichern darf. 1.6 Das Grundparadigma (Folie 18) Der Dozent zeigt einen Kreislauf: Schutzziele definieren → Risiken und Bedrohungen identifizieren → Risiken abwägen → Schutzmaßnahmen definieren → Maßnahmen umsetzen → auf Wirksamkeit prüfen → (zurück zum Anfang) 1.7 Schutzziele des Datenschutzes (Folie 19) Original: „➢ Primäres Schutzziel: Persönlichkeitsschutz. Den einzelnen Menschen vor Missbrauch seiner personenbezogenen Daten zu schützen und die Voraussetzungen für die Wahrnehmung des informationellen Selbstbestimmungsrechts zu schaffen. Im Wesentlichen geht es um: die Zulässigkeit der Verarbeitung pbD · die Sicherstellung der erforderlichen technischen und organisatorischen Maßnahmen · die Datenschutzkonformität aller Geschäftsprozesse ➢ Sekundäres Schutzziel: Datenminimierung — Anonymität, Pseudonymität\" Merke: primär = Persönlichkeitsschutz , sekundär = Datenminimierung . Typische Fallen zu Kapitel 1 Aussage ✓/✗ Die DSGVO gilt seit dem 25.05.2018 verpflichtend in allen Mitgliedstaaten. ✓ Die DSGVO ist eine Richtlinie und musste in deutsches Recht umgesetzt werden. ✗ — sie ist eine Verordnung und gilt unmittelbar Das Recht auf informationelle Selbstbestimmung wurde vom BGH entwickelt. ✗ — vom BVerfG (Volkszählungsurteil 1983) Das Recht auf informationelle Selbstbestimmung leitet sich aus Art. 1 und 2 GG ab. ✓ Datenschutz und Datensicherheit sind dasselbe. ✗ Primäres Schutzziel des Datenschutzes ist die Datenminimierung. ✗ — primär ist der Persönlichkeitsschutz , Datenminimierung ist sekundär","words":827,"mins":4},{"id":"d-2-anwendungsbereich","subject":"ds","num":"2","title":"2. Anwendungsbereich","short":"Anwendungsbereich","html":"<blockquote>\n<p><strong>Worum es hier geht — in einfachen Worten<\/strong>\n<strong>Wann gilt die DSGVO überhaupt — und wann nicht?<\/strong><\/p>\n<p>Zwei Fragen: Geht es um die richtige Art von Verarbeitung (sachlich)? Und ist der Betreffende in Europa (räumlich)?<\/p>\n<p>Die wichtigste Erkenntnis: Auch ein US-Konzern ohne Büro in Europa kann der DSGVO unterliegen, sobald er sich an europäische Nutzer richtet.<\/p>\n<\/blockquote>\n<h3 id=\"d-21-sachlicher-anwendungsbereich-art-2\">2.1 Sachlicher Anwendungsbereich (Art. 2)<\/h3>\n<p><strong>Folie 26 (Original):<\/strong><\/p>\n<blockquote>\n<p>„▪ <strong>Verarbeitung von personenbezogenen Daten:<\/strong>\n▪ <strong>„automatisiert\"<\/strong>: ganz oder teilweise\n▪ <strong>„Nichtautomatisiert\": Dateisystem<\/strong>\n<strong>Ausnahmebereiche:<\/strong> z. B. Verarbeitung <strong>ausschließlich für persönliche oder familiäre Tätigkeiten<\/strong>\"<\/p>\n<\/blockquote>\n<p><strong>Was das heißt:<\/strong>\n- <strong>Automatisiert<\/strong> = per Computer. Immer erfasst.\n- <strong>Nichtautomatisiert<\/strong> = auf Papier — aber <strong>nur, wenn es in einem Dateisystem<\/strong> (strukturierten Ablage) gespeichert ist oder werden soll. Ein alphabetisch sortierter Karteikasten fällt darunter, ein loser Notizzettel nicht.<\/p>\n<p><strong>Die Haushaltsausnahme (Art. 2 II lit. c):<\/strong> Ausschließlich <strong>persönliche oder familiäre<\/strong> Tätigkeiten sind ausgenommen.\n- Dein privates Adressbuch im Handy → <strong>nicht<\/strong> von der DSGVO erfasst.\n- Deine Geburtstagsliste zu Hause → nicht erfasst.\n- <strong>Aber:<\/strong> Sobald du sie beruflic
